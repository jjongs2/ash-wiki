# PR마다, 그리고 main에 push될 때 `npm run check`(서식, 타입, 콘텐츠 검사기, 테스트)를 돌린다. 검사 목록과
# 순서는 package.json의 scripts.check 한 곳에만 둔다. 룰셋(.github/rulesets/main.json)이
# PR에서 이 job의 통과를 요구한다. 룰셋은 브랜치 최신화를 요구하지 않으므로, PR 여럿을 합친 뒤에야
# 생기는 위반은 main의 push 실행이 잡는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
