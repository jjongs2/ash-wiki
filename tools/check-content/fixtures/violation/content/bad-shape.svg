<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" fill="none" stroke="var(--ink, #727981)" aria-label="모양 위반 예시">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 위반(svg): 척도(0, 2) 밖의 rx와 ry다. -->
  <rect x="10.75" y="10.75" width="98.5" height="28.5" rx="4" stroke-width="1.5" />
  <rect x="130.75" y="10.75" width="98.5" height="28.5" ry="6" stroke-width="1.5" />
  <!-- 위반(svg): 척도(1, 1.5, 3) 밖의 선 두께다. -->
  <line x1="10" y1="50" x2="230" y2="50" stroke-width="2" />
  <!-- 위반(svg): 두 가지(3 3, 5 4) 밖의 점선이다. -->
  <line x1="10" y1="60" x2="230" y2="60" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- 위반(svg): 보조 점선인데 폭이 1.5이고, 윤곽 점선인데 폭을 적지 않아 1이다. -->
  <line x1="10" y1="70" x2="230" y2="70" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="10" y1="80" x2="230" y2="80" stroke-dasharray="5 4" />
  <!-- 위반(svg): 윤곽 점선인데 조상에서 물려받은 폭이 1이다. -->
  <g stroke-width="1"><line x1="10" y1="90" x2="230" y2="90" stroke-dasharray="5 4" /></g>
  <!-- 위반(svg): 11보다 작은 글자, 9보다 작은 첨자, 옮기지 않았는데 9인 tspan이다. -->
  <text x="20" y="120" font-size="10" fill="var(--text, #727981)" stroke="none">A</text>
  <text x="20" y="140" fill="var(--text, #727981)" stroke="none">B<tspan dy="2" font-size="8">1</tspan></text>
  <text x="20" y="160" fill="var(--text, #727981)" stroke="none">C<tspan font-size="9">2</tspan></text>
  <!-- 위반(svg): style로 준 선 두께도 척도 밖이다. -->
  <line x1="10" y1="190" x2="230" y2="190" style="stroke-width: 2.5" />
</svg>
