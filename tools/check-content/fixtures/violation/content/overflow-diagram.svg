<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" fill="none" aria-label="viewBox 밖으로 나간 예시">
  <!-- 위반(svg): 아래 상자가 viewBox 아래로 20 나갔다. 안의 그림은 여백이 같다. -->
  <rect x="20" y="20" width="200" height="60" fill="var(--blue-tint, #336fb8)" />
  <rect x="20" y="110" width="200" height="10" fill="var(--orange-tint, #b0540d)" />
</svg>
