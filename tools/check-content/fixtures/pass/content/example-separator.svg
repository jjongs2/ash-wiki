<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="14" width="70" height="32" rx="4" />
    <rect x="110" y="14" width="70" height="32" rx="4" />
    <rect x="20" y="64" width="70" height="32" rx="4" />
    <rect x="110" y="64" width="70" height="32" rx="4" />
  </g>
  <line x1="90.75" y1="80" x2="109.25" y2="80" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="35">2001</text>
    <!-- 통과(svg): 두 상자 사이 `:`는 잉크 중심이 상자 세로 중심에서 1.5 아래로, 허용치(14에서 2.8) 안이다. -->
    <text x="100" y="35">:</text>
    <text x="145" y="35">db8</text>
    <!-- 통과(svg): 두 상자 사이 칸에 선이 있으면 글자는 그 선의 라벨이므로 세로 위치를 보지 않는다. -->
    <text x="100" y="74" font-size="12">전송</text>
  </g>
</svg>
