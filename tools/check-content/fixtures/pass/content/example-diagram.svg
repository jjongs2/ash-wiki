<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2.5 240 100" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" fill="none">
  <!-- 통과(svg): 색은 토큰(var)과 키워드(대소문자 무관), url(#id)만 쓴다. 주석 안의 색(#ff0000)은 보지 않는다.
       글자는 본문 폰트로 그리고, 그림의 상하좌우 여백이 같다. -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");
    .bus { stroke: var(--ink, #727981) !important; fill: None; }
  </style>
  <defs>
    <linearGradient id="fade">
      <stop offset="0" stop-color="var(--blue, #336FB8)" />
      <stop offset="1" stop-color="var( --violet ,#825da9 )" />
    </linearGradient>
  </defs>
  <!-- 통과(svg): 선 두께 1, 1.5, 3과 점선 두 가지를 폭에 맞게 쓴다. 폭은 조상에서 물려받는다. -->
  <line class="bus" x1="10" y1="80" x2="230" y2="80" stroke-width="3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="10" y1="60" x2="230" y2="60" stroke-dasharray="5 4" />
    <line x1="10" y1="65" x2="230" y2="65" stroke-width="1" stroke-dasharray="3,3" />
  </g>
  <line x1="10" y1="70" x2="230" y2="70" stroke="var(--ink, #727981)" stroke-dasharray="3 3" />
  <rect x="20.75" y="10.75" width="88.5" height="38.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <!-- 통과(svg): dy나 baseline-shift로 옮긴 첨자 tspan은 9까지 쓴다. -->
  <text x="65" y="35" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ECU<tspan dy="3" font-size="9">1</tspan><tspan baseline-shift="sub" font-size="9">2</tspan></text>
  <!-- 통과(svg): 글자 노드의 "fill: red"는 CSS 선언이 아니다. -->
  <text x="120" y="95" text-anchor="middle" font-size="11" fill="var(--text, #727981)">fill: red</text>
  <rect x="130" y="10" width="90" height="24" rx="2" fill="url(#fade)" style="stroke: var(--green, #337b47)" />
  <rect x="130.75" y="36.75" width="88.5" height="12.5" rx="0" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
</svg>
