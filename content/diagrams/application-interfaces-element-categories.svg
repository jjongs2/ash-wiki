<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="20.75" width="200.5" height="208.5" rx="2" />
    <rect x="480.75" y="20.75" width="198.5" height="208.5" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="34" y="44">Application Interfaces</text>
    <text x="494" y="44">프로젝트</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="60" width="160" height="36" rx="2" />
    <rect x="40" y="120" width="160" height="36" rx="2" />
    <rect x="40" y="180" width="160" height="36" rx="2" />
    <rect x="500" y="90" width="160" height="80" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="83">STANDARD</text>
    <text x="120" y="143">BLUEPRINT</text>
    <text x="120" y="203">EXAMPLE</text>
    <text x="580" y="126">프로젝트의</text>
    <text x="580" y="144">모델 요소</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="78" x2="498" y2="100" marker-end="url(#arrow)" />
    <line x1="200" y1="130" x2="498" y2="122" marker-end="url(#arrow)" />
    <line x1="200" y1="146" x2="498" y2="138" stroke-dasharray="5 4" marker-end="url(#arrow)" />
    <line x1="200" y1="198" x2="498" y2="160" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="350" y="72">고치지 않고 그대로 쓴다</text>
    <text x="350" y="120">복사하고 다듬어 끌어낸다</text>
    <text x="350" y="162">끌어낸 객체를 검증한다</text>
    <text x="350" y="200">구현 방법 하나를 보인다</text>
  </g>
</svg>
