<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 435 274" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="시나리오의 추상화 수준">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">ISO 34501:2022</text>

  <!-- 추상화 수준: 위에서 아래로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="42" width="280" height="44" rx="2" />
    <rect x="20" y="98" width="280" height="44" rx="2" />
    <rect x="20" y="154" width="280" height="44" rx="2" />
    <rect x="20" y="210" width="280" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="61">functional scenario</text>
    <text x="160" y="78" font-size="12">개념 수준의 자연어</text>
    <text x="160" y="117">abstract scenario</text>
    <text x="160" y="134" font-size="12">형식화된 선언적 기술</text>
    <text x="160" y="173">logical scenario</text>
    <text x="160" y="190" font-size="12">일부 파라미터 값을 범위로 둠</text>
    <text x="160" y="229">concrete scenario</text>
    <text x="160" y="246" font-size="12">명시적 파라미터 값</text>
  </g>

  <!-- 시나리오의 수 -->
  <line x1="326" y1="42" x2="326" y2="252" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="338" y="140">아래로 갈수록</text>
    <text x="338" y="156">시나리오의 수가</text>
    <text x="338" y="172">늘어나는 경향</text>
  </g>
</svg>
