<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1.5 518 236" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="포트 수와 역할에 따라 나뉜 PTP 시계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 세 시계 -->
  <rect x="20" y="88" width="150" height="56" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="112" text-anchor="middle" fill="var(--text, #727981)">ordinary clock</text>
  <text x="95" y="132" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PTP 포트 하나</text>
  <rect x="184" y="88" width="150" height="56" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="259" y="112" text-anchor="middle" fill="var(--text, #727981)">boundary clock</text>
  <text x="259" y="132" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PTP 포트 여럿</text>
  <rect x="348" y="88" width="150" height="56" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="423" y="112" text-anchor="middle" fill="var(--text, #727981)">transparent clock</text>
  <text x="423" y="132" text-anchor="middle" font-size="12" fill="var(--text, #727981)">master나 slave가 되지 않음</text>

  <!-- 포트까지의 선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="95" y1="149" x2="95" y2="176" />
    <line x1="259" y1="44" x2="259" y2="83" />
    <line x1="219" y1="149" x2="219" y2="176" />
    <line x1="299" y1="149" x2="299" y2="176" />
    <line x1="423" y1="44" x2="423" y2="86" marker-end="url(#arrow)" />
    <line x1="423" y1="144" x2="423" y2="182" marker-end="url(#arrow)" />
  </g>

  <!-- 포트 -->
  <g fill="var(--ink, #727981)">
    <rect x="90" y="139" width="10" height="10" />
    <rect x="254" y="83" width="10" height="10" />
    <rect x="214" y="139" width="10" height="10" />
    <rect x="294" y="139" width="10" height="10" />
  </g>

  <!-- ordinary clock 포트의 역할 -->
  <text x="95" y="192" text-anchor="middle" font-size="12" fill="var(--text, #727981)">master 또는 slave</text>

  <!-- boundary clock 포트의 역할 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="259" y="32" text-anchor="middle">상위 master에 동기화</text>
    <text x="267" y="68">slave</text>
    <text x="219" y="192" text-anchor="middle">master</text>
    <text x="299" y="192" text-anchor="middle">master</text>
    <text x="259" y="212" text-anchor="middle">하위 시계에 시각을 전함</text>
  </g>

  <!-- transparent clock이 하는 일 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="423" y="32">PTP 메시지</text>
    <text x="423" y="198">체류 시간을 재어</text>
    <text x="423" y="214">correctionField에 더해 넘김</text>
  </g>
</svg>
