<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -9.5 800 174.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 맞는 스트림 필터가 없을 때 -->
  <path d="M175 48 V28 H755 V46" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="465" y="20" text-anchor="middle" fill="var(--text, #727981)">맞는 스트림 필터가 없으면 거르지 않고 큐로</text>

  <!-- 처리 단계 -->
  <text x="20" y="74" fill="var(--text, #727981)">받은 프레임</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="88" y1="70" x2="118" y2="70" marker-end="url(#arrow)" />
    <line x1="230" y1="70" x2="258" y2="70" marker-end="url(#arrow)" />
    <line x1="400" y1="70" x2="428" y2="70" marker-end="url(#arrow)" />
    <line x1="540" y1="70" x2="578" y2="70" marker-end="url(#arrow)" />
    <line x1="690" y1="70" x2="728" y2="70" marker-end="url(#arrow)" />
  </g>
  <rect x="120" y="48" width="110" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="175" y="74" text-anchor="middle" fill="var(--text, #727981)">스트림 필터</text>
  <rect x="260" y="48" width="140" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="74" text-anchor="middle" fill="var(--text, #727981)">최대 SDU 크기 필터</text>
  <rect x="430" y="48" width="110" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="485" y="74" text-anchor="middle" fill="var(--text, #727981)">스트림 게이트</text>
  <rect x="580" y="48" width="110" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="635" y="66" text-anchor="middle" fill="var(--text, #727981)">flow meter</text>
  <text x="635" y="82" text-anchor="middle" fill="var(--text, #727981)">(있을 때만)</text>
  <rect x="730" y="48" width="50" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="755" y="74" text-anchor="middle" fill="var(--text, #727981)">큐</text>

  <!-- 단계마다 하는 일 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="175" y="112">stream_handle과</text>
    <text x="175" y="128">우선순위로 대응</text>
    <text x="330" y="112">최대 SDU 크기보다</text>
    <text x="330" y="128">크면 버림</text>
    <text x="485" y="112">수신 구간 밖이나</text>
    <text x="485" y="128">데이터 한도를 넘으면 버림</text>
    <text x="485" y="144">우선순위 → IPV</text>
    <text x="635" y="112">한도를 넘으면 버리거나</text>
    <text x="635" y="128">drop eligible로 표시</text>
  </g>
</svg>
