<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -9.5 517 190.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="받은 프레임이 스트림 필터에서 큐까지 거치는 순서">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 맞는 스트림 필터가 없을 때 -->
  <path d="M135 48 V28 H479 V46" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <circle cx="135" cy="48" r="3" fill="var(--ink, #727981)" />
  <text x="307" y="20" text-anchor="middle" fill="var(--text, #727981)">맞는 스트림 필터가 없으면 거르지 않고 큐로</text>

  <!-- 처리 단계 -->
  <text x="20" y="74" fill="var(--text, #727981)">받은 프레임</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="70" x2="98" y2="70" marker-end="url(#arrow)" />
    <line x1="170" y1="70" x2="190" y2="70" marker-end="url(#arrow)" />
    <line x1="252" y1="70" x2="272" y2="70" marker-end="url(#arrow)" />
    <line x1="350" y1="70" x2="369" y2="70" marker-end="url(#arrow)" />
    <line x1="441" y1="70" x2="459" y2="70" marker-end="url(#arrow)" />
  </g>
  <rect x="100" y="48" width="70" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="135" y="74" text-anchor="middle" fill="var(--text, #727981)">스트림 필터</text>
  <rect x="192" y="48" width="60" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="222" y="66" text-anchor="middle" fill="var(--text, #727981)">최대 SDU</text>
  <text x="222" y="82" text-anchor="middle" fill="var(--text, #727981)">크기 필터</text>
  <rect x="274" y="48" width="76" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="312" y="74" text-anchor="middle" fill="var(--text, #727981)">스트림 게이트</text>
  <rect x="371" y="48" width="70" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="406" y="66" text-anchor="middle" fill="var(--text, #727981)">flow meter</text>
  <text x="406" y="82" text-anchor="middle" fill="var(--text, #727981)">(있을 때만)</text>
  <rect x="461" y="48" width="36" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="479" y="74" text-anchor="middle" fill="var(--text, #727981)">큐</text>

  <!-- 단계마다 하는 일 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="135" y="112">stream_handle과</text>
    <text x="135" y="128">우선순위로 대응</text>
    <text x="222" y="112">최대 SDU</text>
    <text x="222" y="128">크기보다 크면</text>
    <text x="222" y="144">버림</text>
    <text x="312" y="112">수신 구간 밖이나</text>
    <text x="312" y="128">데이터 한도를</text>
    <text x="312" y="144">넘으면 버림</text>
    <text x="312" y="160">우선순위 → IPV</text>
    <text x="406" y="112">한도를 넘으면</text>
    <text x="406" y="128">버리거나</text>
    <text x="406" y="144">drop eligible로</text>
    <text x="406" y="160">표시</text>
  </g>
</svg>
