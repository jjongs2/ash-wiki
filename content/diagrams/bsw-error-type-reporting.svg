<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 248" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="오류 유형마다 보고하는 모듈">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 오류 유형과 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="190" height="40" rx="2" />
    <rect x="20" y="76" width="190" height="40" rx="2" />
    <rect x="20" y="132" width="190" height="40" rx="2" />
    <rect x="20" y="188" width="190" height="40" rx="2" />
    <rect x="420" y="20" width="120" height="96" rx="2" />
    <rect x="420" y="132" width="120" height="96" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="45">development error</text>
    <text x="115" y="101">runtime error</text>
    <text x="115" y="157">production error</text>
    <text x="115" y="213">extended production error</text>
    <text x="480" y="73">Det</text>
    <text x="480" y="185">Dem</text>
  </g>

  <!-- 보고 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="210" y1="40" x2="418" y2="40" />
    <line x1="210" y1="96" x2="418" y2="96" />
    <line x1="210" y1="152" x2="418" y2="152" />
    <line x1="210" y1="208" x2="418" y2="208" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="314" y="33">Det_ReportError</text>
    <text x="314" y="89">Det_ReportRuntimeError</text>
    <text x="314" y="145">Dem_SetEventStatus</text>
    <text x="314" y="201">Dem_SetEventStatus</text>
  </g>
</svg>
