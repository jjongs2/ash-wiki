<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 -20 725 226" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- SDU 하나: PDU에 실릴 조각 셋 -->
  <path d="M222 14 V8 H522 V14" stroke="#727981" stroke-width="1.5" />
  <text x="372" y="0" text-anchor="middle" fill="#727981">SDU</text>
  <g fill="#336fb8">
    <rect x="222" y="20" width="98" height="36" />
    <rect x="324" y="20" width="96" height="36" />
    <rect x="424" y="20" width="98" height="36" />
  </g>

  <!-- 조각이 PDU로 가는 자리 -->
  <g stroke="#727981" stroke-width="1" stroke-dasharray="4 4">
    <line x1="222" y1="58" x2="144" y2="128" />
    <line x1="320" y1="58" x2="244" y2="128" />
    <line x1="324" y1="58" x2="384" y2="128" />
    <line x1="420" y1="58" x2="484" y2="128" />
    <line x1="424" y1="58" x2="624" y2="128" />
