  <line x1="680" y1="120" x2="680" y2="36" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="670" y="83" text-anchor="end" fill="#727981">재조립</text>

  <!-- PDU 여럿 -->
  <rect x="20" y="130" width="124" height="36" fill="#b0540d" />
  <text x="82" y="152" text-anchor="middle" font-size="12" fill="#f8fafd">프로토콜 제어 정보</text>
  <rect x="144" y="130" width="100" height="36" fill="#336fb8" />
  <rect x="260" y="130" width="124" height="36" fill="#b0540d" />
  <text x="322" y="152" text-anchor="middle" font-size="12" fill="#f8fafd">프로토콜 제어 정보</text>
  <rect x="384" y="130" width="100" height="36" fill="#336fb8" />
  <rect x="500" y="130" width="124" height="36" fill="#b0540d" />
  <text x="562" y="152" text-anchor="middle" font-size="12" fill="#f8fafd">프로토콜 제어 정보</text>
  <rect x="624" y="130" width="100" height="36" fill="#336fb8" />

  <g text-anchor="middle" font-size="12" fill="#f8fafd">
    <text x="194" y="152">사용자 데이터</text>
    <text x="434" y="152">사용자 데이터</text>
    <text x="674" y="152">사용자 데이터</text>
  </g>

  <g stroke="#727981" stroke-width="1.5">
    <path d="M20 172 V178 H244 V172" />
    <path d="M260 172 V178 H484 V172" />
    <path d="M500 172 V178 H724 V172" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="132" y="196">PDU</text>
    <text x="372" y="196">PDU</text>
    <text x="612" y="196">PDU</text>
