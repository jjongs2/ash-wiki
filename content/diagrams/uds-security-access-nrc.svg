<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 11.5 521 401.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- requestSeed -->
  <rect x="20" y="50" width="140" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="90" y="75" text-anchor="middle" fill="var(--text, #727981)">requestSeed 요청</text>
  <rect x="330" y="22" width="190" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="425" y="45" text-anchor="middle" fill="var(--text, #727981)">Xxx_GetSeed()로 seed를 구함</text>

  <!-- sendKey -->
  <rect x="20" y="150" width="140" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="90" y="169" text-anchor="middle" fill="var(--text, #727981)">sendKey 요청</text>
  <text x="90" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">requestSeed 성공 뒤</text>
  <rect x="20" y="230" width="140" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="90" y="255" text-anchor="middle" fill="var(--text, #727981)">Xxx_CompareKey()</text>
  <rect x="330" y="262" width="170" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="415" y="285" text-anchor="middle" fill="var(--text, #727981)">SecurityDelayTimer 켬</text>

  <!-- 부정 응답 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)">
    <rect x="330.75" y="82.75" width="108.5" height="34.5" rx="2" />
    <rect x="330.75" y="202.75" width="108.5" height="34.5" rx="2" />
    <rect x="330.75" y="322.75" width="108.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="385" y="105">NRC 0x37</text>
    <text x="385" y="225">NRC 0x35</text>
    <text x="385" y="345">NRC 0x36</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M160 70 H180 M180 40 V100" />
    <path d="M160 250 H190 M190 220 V280" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="40" x2="328" y2="40" />
    <line x1="180" y1="100" x2="328" y2="100" />
    <line x1="90" y1="196" x2="90" y2="228" />
    <line x1="190" y1="220" x2="328" y2="220" />
    <line x1="190" y1="280" x2="328" y2="280" />
    <line x1="385" y1="298" x2="385" y2="320" />
  </g>

  <!-- 조건 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="254" y="33">보안 수준이 비활성이면</text>
    <text x="254" y="93">지연 타이머가 도는 동안</text>
    <text x="175" y="243">실패</text>
    <text x="259" y="213">AttemptCounter &lt; 한도</text>
    <text x="259" y="273">AttemptCounter ≥ 한도</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="270" y="384">AUTOSAR R25-11의 Dcm 명세. 한도는 DcmDspSecurityNumAttDelay다.</text>
    <text x="270" y="402">키 비교가 실패한 두 경우 모두 보안 수준은 바뀌지 않는다.</text>
  </g>
</svg>
