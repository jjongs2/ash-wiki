<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 11.5 691 331.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- requestSeed -->
  <rect x="20" y="50" width="140" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="90" y="75" text-anchor="middle" fill="var(--text, #727981)">requestSeed 요청</text>
  <rect x="360" y="22" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="460" y="45" text-anchor="middle" fill="var(--text, #727981)">Xxx_GetSeed()로 seed를 구함</text>

  <!-- sendKey -->
  <rect x="20" y="157" width="140" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="90" y="176" text-anchor="middle" fill="var(--text, #727981)">sendKey 요청</text>
  <text x="90" y="193" text-anchor="middle" font-size="12" fill="var(--text, #727981)">requestSeed 성공 뒤</text>
  <rect x="190" y="160" width="150" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="265" y="185" text-anchor="middle" fill="var(--text, #727981)">Xxx_CompareKey()</text>
  <rect x="520" y="192" width="170" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="605" y="215" text-anchor="middle" fill="var(--text, #727981)">SecurityDelayTimer 켬</text>

  <!-- 부정 응답 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)">
    <rect x="360.75" y="82.75" width="108.5" height="34.5" rx="2" />
    <rect x="520.75" y="132.75" width="108.5" height="34.5" rx="2" />
    <rect x="520.75" y="252.75" width="108.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="415" y="105">NRC 0x37</text>
    <text x="575" y="155">NRC 0x35</text>
    <text x="575" y="275">NRC 0x36</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M160 70 H190 M190 40 V100" />
    <path d="M340 180 H370 M370 150 V210" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="40" x2="358" y2="40" />
    <line x1="190" y1="100" x2="358" y2="100" />
    <line x1="160" y1="180" x2="188" y2="180" />
    <line x1="370" y1="150" x2="518" y2="150" />
    <line x1="370" y1="210" x2="518" y2="210" />
    <line x1="575" y1="228" x2="575" y2="250" />
  </g>

  <!-- 조건 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="274" y="33">보안 수준이 비활성이면</text>
    <text x="274" y="93">지연 타이머가 도는 동안</text>
    <text x="355" y="173">실패</text>
    <text x="444" y="143">AttemptCounter &lt; 한도</text>
    <text x="444" y="203">AttemptCounter ≥ 한도</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="355" y="314">AUTOSAR R25-11의 Dcm 명세. 한도는 DcmDspSecurityNumAttDelay다.</text>
    <text x="355" y="332">키 비교가 실패한 두 경우 모두 보안 수준은 바뀌지 않는다.</text>
  </g>
</svg>
