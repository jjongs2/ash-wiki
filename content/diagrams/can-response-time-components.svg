<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -6 529.5 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 큐잉 지연의 두 성분 -->
  <path d="M126 28 V22 H205 V28" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="165.5" y="14" text-anchor="middle" font-size="12" fill="var(--text, #727981)">블로킹</text>
  <path d="M205 28 V22 H391 V28" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="298" y="14" text-anchor="middle" font-size="12" fill="var(--text, #727981)">간섭</text>

  <!-- 버스 -->
  <text x="102" y="53" text-anchor="end" fill="var(--text, #727981)">버스</text>
  <rect x="112.75" y="35.75" width="91.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="158.5" y="53" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">더 낮은 우선순위</text>
  <rect x="205.75" y="35.75" width="91.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="251.5" y="53" text-anchor="middle" font-size="12" fill="var(--text, #727981)">더 높은 우선순위</text>
  <rect x="298.75" y="35.75" width="91.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="344.5" y="53" text-anchor="middle" font-size="12" fill="var(--text, #727981)">더 높은 우선순위</text>
  <rect x="391.75" y="35.75" width="70.5" height="26.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="427" y="53" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">메시지 <tspan font-style="italic">m</tspan></text>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M50 68 V98 M50 130 V230" />
    <path d="M126 68 V98 M126 130 V154" />
    <path d="M391 68 V98 M391 130 V154" />
    <path d="M463 68 V98 M463 130 V192" />
    <path d="M491 68 V230" />
  </g>

  <!-- 시간 축 -->
  <line x1="30" y1="104" x2="511" y2="104" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="519" y="108" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <circle cx="50" cy="104" r="3" />
    <circle cx="126" cy="104" r="3" />
    <circle cx="391" cy="104" r="3" />
    <circle cx="463" cy="104" r="3" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="50" y="124">사건</text>
    <text x="126" y="124">큐에 들어감</text>
    <text x="391" y="124">송신 시작</text>
    <text x="463" y="124">송신 완료</text>
  </g>

  <!-- 길이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="52" y1="150" x2="124" y2="150" />
    <line x1="128" y1="150" x2="389" y2="150" />
    <line x1="393" y1="150" x2="461" y2="150" />
    <line x1="52" y1="188" x2="461" y2="188" />
    <line x1="52" y1="226" x2="489" y2="226" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="88" y="142">큐잉 지터 <tspan font-style="italic">J</tspan><tspan font-style="italic" dy="3" font-size="9">m</tspan></text>
    <text x="258.5" y="142">큐잉 지연 <tspan font-style="italic">w</tspan><tspan font-style="italic" dy="3" font-size="9">m</tspan></text>
    <text x="427" y="142">전송 시간 <tspan font-style="italic">C</tspan><tspan font-style="italic" dy="3" font-size="9">m</tspan></text>
    <text x="256.5" y="180">최악 응답 시간 <tspan font-style="italic">R</tspan><tspan font-style="italic" dy="3" font-size="9">m</tspan></text>
    <text x="270.5" y="218">마감 시한 <tspan font-style="italic">D</tspan><tspan font-style="italic" dy="3" font-size="9">m</tspan></text>
  </g>

  <!-- 범례 -->
  <text x="30" y="262" font-size="12" fill="var(--text, #727981)">최악의 경우. 최악 응답 시간이 마감 시한 이하이면 메시지 <tspan font-style="italic">m</tspan>은 스케줄 가능하다.</text>
</svg>
