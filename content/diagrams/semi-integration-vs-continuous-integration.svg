<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 276" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="600" y="30" text-anchor="end" fill="var(--text, #727981)">Fowler</text>

  <!-- semi-integration: 주 줄기의 변경을 브랜치로 당겨 오기만 한다 -->
  <text x="20" y="30" font-size="14" fill="var(--text, #727981)">semi-integration</text>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="92" y="60">주 줄기</text>
    <text x="92" y="100">브랜치</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="56" x2="600" y2="56" />
    <path d="M130 56 L148 96 H600" />
    <line x1="250" y1="58" x2="250" y2="94" />
    <line x1="370" y1="58" x2="370" y2="94" />
    <line x1="490" y1="58" x2="490" y2="94" />
  </g>
  <text x="370" y="118" text-anchor="middle" fill="var(--text, #727981)">주 줄기의 변경을 정기적으로 당겨 와 빌드·테스트</text>

  <!-- 지속적 통합: 브랜치의 코드를 몇 시간 안에 주 줄기로 push한다 -->
  <text x="20" y="160" font-size="14" fill="var(--text, #727981)">지속적 통합</text>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="92" y="190">주 줄기</text>
    <text x="92" y="226">브랜치</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="186" x2="600" y2="186" />
    <path d="M130 186 L146 222 H222 L237 189" />
    <path d="M270 186 L286 222 H362 L377 189" />
    <path d="M410 186 L426 222 H502 L517 189" />
  </g>
  <text x="236" y="212" fill="var(--text, #727981)">push</text>
  <path d="M130 234 V240 H238 V234" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="184" y="256" text-anchor="middle" fill="var(--text, #727981)">몇 시간 이내</text>
</svg>
