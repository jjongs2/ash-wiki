<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 510 246" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 위: STARTUP → UP → SHUTDOWN, 그 위를 돌아 SHUTDOWN에서 STARTUP으로 가는 Reset, 아래: UP과 오가는 SLEEP, SHUTDOWN 뒤의 OFF -->

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="130" height="72" rx="2" />
    <rect x="190" y="20" width="130" height="72" rx="2" />
    <rect x="360" y="20" width="130" height="72" rx="2" />
    <rect x="375" y="150" width="100" height="56" rx="2" />
    <rect x="190" y="150" width="130" height="56" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="45">STARTUP</text>
    <text x="255" y="45">UP</text>
    <text x="425" y="45">SHUTDOWN</text>
    <text x="425" y="183">OFF</text>
    <text x="255" y="173">SLEEP</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="85" y="64">EcuM이 맡음</text>
    <text x="85" y="80">(이른 단계)</text>
    <text x="255" y="64">BswM이 맡음</text>
    <text x="425" y="64">EcuM이 맡음</text>
    <text x="425" y="80">(늦은 단계)</text>
    <text x="255" y="193">EcuM이 맡음</text>
  </g>

  <!-- 전환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="56" x2="188" y2="56" />
    <line x1="320" y1="56" x2="358" y2="56" />
    <line x1="425" y1="92" x2="425" y2="148" />
    <line x1="230" y1="92" x2="230" y2="148" />
    <line x1="280" y1="150" x2="280" y2="94" />
    <path d="M470 20 V0 H40 V18" />
  </g>
  <text x="288" y="125" font-size="12" fill="var(--text, #727981)">wakeup</text>
  <text x="340" y="14" font-size="12" text-anchor="middle" fill="var(--text, #727981)">Reset</text>
</svg>
