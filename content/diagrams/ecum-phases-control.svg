<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 216" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="170" height="56" rx="2" />
    <rect x="250" y="20" width="170" height="56" rx="2" />
    <rect x="480" y="20" width="170" height="56" rx="2" />
    <rect x="710" y="20" width="100" height="56" rx="2" />
    <rect x="250" y="140" width="170" height="56" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="43">STARTUP</text>
    <text x="335" y="43">UP</text>
    <text x="565" y="43">SHUTDOWN</text>
    <text x="760" y="53">OFF</text>
    <text x="335" y="163">SLEEP</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="105" y="63">EcuM이 맡음 (이른 단계)</text>
    <text x="335" y="63">BswM이 맡음</text>
    <text x="565" y="63">EcuM이 맡음 (늦은 단계)</text>
    <text x="335" y="183">EcuM이 맡음</text>
  </g>

  <!-- 전환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="48" x2="248" y2="48" />
    <line x1="420" y1="48" x2="478" y2="48" />
    <line x1="650" y1="48" x2="708" y2="48" />
    <line x1="300" y1="76" x2="300" y2="138" />
    <line x1="370" y1="140" x2="370" y2="78" />
  </g>
  <text x="378" y="112" font-size="12" fill="var(--text, #727981)">wakeup</text>
</svg>
