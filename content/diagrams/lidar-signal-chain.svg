<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 9.5 330 266" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="라이다 신호 체인">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 수신 시스템 틀 -->
  <rect x="12" y="88" width="304" height="76" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="306" y="104" text-anchor="end" font-size="12" fill="var(--text, #727981)">수신 시스템</text>

  <!-- 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="27" y="20" width="70" height="36" rx="2" />
    <rect x="176" y="20" width="110" height="36" rx="2" />
    <rect x="24" y="116" width="76" height="36" rx="2" />
    <rect x="124" y="116" width="50" height="36" rx="2" />
    <rect x="198" y="116" width="106" height="36" rx="2" />
    <rect x="181" y="196" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="62" y="43">대상</text>
    <text x="231" y="43">송신 시스템</text>
    <text x="62" y="139">광검출기</text>
    <text x="149" y="139">TIA</text>
    <text x="251" y="139">ADC 또는 TDC</text>
    <text x="251" y="219">디지털 처리 시스템</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="176" y1="38" x2="99" y2="38" />
    <line x1="62" y1="56" x2="62" y2="114" />
    <line x1="100" y1="134" x2="122" y2="134" />
    <line x1="174" y1="134" x2="196" y2="134" />
    <line x1="251" y1="152" x2="251" y2="194" />
    <line x1="181" y1="214" x2="133" y2="214" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="137" y="30" text-anchor="middle">빛</text>
    <text x="70" y="78">반사 신호</text>
    <text x="127" y="218" text-anchor="end">점군 정보</text>
    <text x="166" y="264" text-anchor="middle">TI 백서에 따른 신호 체인</text>
  </g>
</svg>
