<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 25.5 560 80" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="110" height="36" rx="2" />
    <rect x="230" y="40" width="120" height="36" rx="2" />
    <rect x="450" y="40" width="110" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="75" y="63">드라이버</text>
    <text x="290" y="63">SUT의 일부</text>
    <text x="505" y="63">스텁</text>
  </g>

  <!-- 호출과 응답 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="58" x2="228" y2="58" />
    <line x1="350" y1="50" x2="448" y2="50" />
    <line x1="450" y1="66" x2="352" y2="66" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="179" y="51">호출</text>
    <text x="400" y="44">호출</text>
    <text x="400" y="81">미리 정한 응답</text>
  </g>

  <!-- 흉내 내는 대상 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="75" y="96">부르는 모듈을 흉내</text>
    <text x="505" y="96">불리는 모듈을 흉내</text>
  </g>
</svg>
