<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 500 376" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 저장소와 ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="170" y="20" width="240" height="48" rx="4" />
    <rect x="170" y="150" width="240" height="48" rx="4" />
    <rect x="60" y="290" width="200" height="36" rx="4" />
    <rect x="320" y="290" width="200" height="36" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="290" y="40">Director repository</text>
    <text x="290" y="58" font-size="12">무엇을 설치할지 정함</text>
    <text x="290" y="170">Primary ECU</text>
    <text x="290" y="188" font-size="12">모아 서명</text>
    <text x="160" y="313">Secondary ECU</text>
    <text x="420" y="313">Secondary ECU</text>
  </g>

  <!-- 보고 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M160 288 V244 H420 V288" />
    <line x1="290" y1="244" x2="290" y2="200" marker-end="url(#arrow)" />
    <line x1="290" y1="148" x2="290" y2="70" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="298" y="113">차량 버전 매니페스트</text>
    <text x="298" y="228">ECU version report</text>
    <text x="298" y="270" text-anchor="middle">설치된 이미지의 파일 이름, 길이, 해시</text>
    <text x="290" y="354" text-anchor="middle">Uptane Standard 2.1.0</text>
  </g>
</svg>
