<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 19.5 483.5 257" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- TJA1462 -->
  <rect x="90" y="30" width="310" height="182" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="390" y="50" text-anchor="end" font-size="14" fill="var(--text, #727981)">TJA1462</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="64" width="110" height="40" rx="4" />
    <rect x="140" y="140" width="110" height="40" rx="4" />
  </g>
  <g text-anchor="middle" font-size="14" fill="var(--text, #727981)">
    <text x="195" y="89">드라이버</text>
    <text x="195" y="165">수신기</text>
  </g>

  <!-- 컨트롤러 쪽 핀 -->
  <line x1="40" y1="84" x2="138" y2="84" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="140" y1="160" x2="42" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="40" y="76" fill="var(--text, #727981)">TXD</text>
  <text x="40" y="152" fill="var(--text, #727981)">RXD</text>

  <!-- 드라이버 출력이 트랜시버 안에서 수신기 입력으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M250 76 H320 V148 H250" />
    <path d="M250 92 H313 A7 7 0 0 1 327 92 H350 V172 H250" />
    <path d="M320 112 H343 A7 7 0 0 1 357 112 H460" />
    <path d="M350 136 H460" />
  </g>
  <circle cx="320" cy="112" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="350" cy="136" r="3.5" fill="var(--ink, #727981)" />
  <g fill="var(--text, #727981)">
    <text x="466" y="116">CAN_H</text>
    <text x="466" y="140">CAN_L</text>
  </g>

  <!-- 지연 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="195" y="56">TXD → 버스 최대 80 ns</text>
    <text x="195" y="198">버스 → RXD 최대 110 ns</text>
    <text x="245" y="244">루프 지연(TXD low → RXD low) 최대 190 ns</text>
    <text x="245" y="264">전원 전압 4.75~5.25 V</text>
  </g>
</svg>
