<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -5.5 520.5 258.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="정적 분석의 상한과 측정의 최댓값">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="45">정적 분석</text>
    <text x="20" y="107">실제 실행 시간</text>
    <text x="20" y="175">측정</text>
  </g>

  <!-- 정적 분석이 계산한 구간 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="124" y="24">BCET 하한</text>
    <text x="404" y="24">WCET 상한</text>
  </g>
  <line x1="124" y1="40" x2="404" y2="40" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <g stroke="var(--violet, #825da9)" stroke-width="1.5">
    <line x1="124" y1="31" x2="124" y2="49" />
    <line x1="404" y1="31" x2="404" y2="49" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="124" y1="52" x2="124" y2="210" />
    <line x1="404" y1="52" x2="404" y2="210" />
  </g>

  <!-- 실제로 가능한 실행 시간 -->
  <rect x="151" y="88" width="213" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="257.5" y="107" text-anchor="middle" fill="var(--text, #727981)">가능한 실행 시간</text>
  <text x="364" y="134" text-anchor="end" font-size="12" fill="var(--text, #727981)">최댓값 = WCET</text>
  <line x1="366" y1="102" x2="402" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="412" y="106" font-size="12" fill="var(--text, #727981)">과대평가될 수 있음</text>

  <!-- 측정값 -->
  <g fill="var(--orange, #b0540d)">
    <circle cx="179" cy="170" r="4.5" />
    <circle cx="203" cy="170" r="4.5" />
    <circle cx="216" cy="170" r="4.5" />
    <circle cx="229" cy="170" r="4.5" />
    <circle cx="242" cy="170" r="4.5" />
    <circle cx="255" cy="170" r="4.5" />
    <circle cx="270" cy="170" r="4.5" />
    <circle cx="286" cy="170" r="4.5" />
    <circle cx="318" cy="170" r="4.5" />
  </g>
  <text x="322" y="194" text-anchor="end" font-size="12" fill="var(--text, #727981)">관측한 최댓값</text>

  <!-- 축 -->
  <line x1="104" y1="212" x2="482" y2="212" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="482" y="232" text-anchor="end" font-size="12" fill="var(--text, #727981)">실행 시간</text>
</svg>
