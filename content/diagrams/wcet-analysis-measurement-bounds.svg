<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -5.5 736 258.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="45">정적 분석</text>
    <text x="20" y="107">실제 실행 시간</text>
    <text x="20" y="175">측정</text>
  </g>

  <!-- 정적 분석이 계산한 구간 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="200" y="24">BCET 하한</text>
    <text x="620" y="24">WCET 상한</text>
  </g>
  <line x1="200" y1="40" x2="620" y2="40" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <g stroke="var(--violet, #825da9)" stroke-width="1.5">
    <line x1="200" y1="31" x2="200" y2="49" />
    <line x1="620" y1="31" x2="620" y2="49" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="200" y1="52" x2="200" y2="210" />
    <line x1="620" y1="52" x2="620" y2="210" />
  </g>

  <!-- 실제로 가능한 실행 시간 -->
  <rect x="240" y="88" width="320" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="400" y="107" text-anchor="middle" fill="var(--text, #727981)">가능한 실행 시간</text>
  <text x="560" y="134" text-anchor="end" font-size="12" fill="var(--text, #727981)">최댓값 = WCET</text>
  <line x1="562" y1="102" x2="618" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="628" y="106" font-size="12" fill="var(--text, #727981)">과대평가될 수 있음</text>

  <!-- 측정값 -->
  <g fill="var(--orange, #b0540d)">
    <circle cx="282" cy="170" r="4.5" />
    <circle cx="318" cy="170" r="4.5" />
    <circle cx="336" cy="170" r="4.5" />
    <circle cx="352" cy="170" r="4.5" />
    <circle cx="368" cy="170" r="4.5" />
    <circle cx="384" cy="170" r="4.5" />
    <circle cx="406" cy="170" r="4.5" />
    <circle cx="430" cy="170" r="4.5" />
    <circle cx="478" cy="170" r="4.5" />
  </g>
  <text x="482" y="194" text-anchor="end" font-size="12" fill="var(--text, #727981)">관측한 최댓값</text>

  <!-- 축 -->
  <line x1="180" y1="212" x2="698" y2="212" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="698" y="232" text-anchor="end" font-size="12" fill="var(--text, #727981)">실행 시간</text>
</svg>
