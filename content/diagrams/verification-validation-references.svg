<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 26 830 90" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="120" height="30" rx="4" />
    <rect x="340" y="40" width="70" height="30" rx="4" />
    <rect x="610" y="40" width="220" height="30" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="59">명시된 요구사항</text>
    <text x="375" y="59">제품</text>
    <text x="720" y="59">의도된 용도나 응용에 대한 요구사항</text>
  </g>
  <!-- 검증 -->
  <line x1="338" y1="55" x2="142" y2="55" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="240" y="47" text-anchor="middle" fill="var(--text, #727981)">검증</text>
  <text x="240" y="72" text-anchor="middle" font-size="11" fill="var(--text, #727981)">"Am I building the product right?"</text>
  <!-- 확인 -->
  <line x1="412" y1="55" x2="608" y2="55" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="510" y="47" text-anchor="middle" fill="var(--text, #727981)">확인</text>
  <text x="510" y="72" text-anchor="middle" font-size="11" fill="var(--text, #727981)">"Am I building the right product?"</text>
  <!-- 범위 -->
  <text x="425" y="104" text-anchor="middle" fill="var(--text, #727981)">요구사항: ISO 9000:2026의 정의, 물음: Boehm 1979년 글</text>
</svg>
