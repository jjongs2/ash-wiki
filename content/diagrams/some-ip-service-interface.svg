<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 560 284" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 클라이언트 -->
  <rect x="20.75" y="72.75" width="98.5" height="184.5" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="70" y="170" text-anchor="middle" fill="var(--on-fill, #f8fafd)">클라이언트</text>

  <!-- 서버와 서비스 -->
  <rect x="380.75" y="16.75" width="178.5" height="262.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="470" y="36" text-anchor="middle" fill="var(--text, #727981)">서버</text>
  <rect x="396.75" y="44.75" width="146.5" height="224.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="470" y="63" text-anchor="middle" font-size="12" fill="var(--text, #727981)">서비스</text>
  <rect x="410.75" y="72.75" width="118.5" height="32.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="410.75" y="120.75" width="118.5" height="32.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="410.75" y="168.75" width="118.5" height="88.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="470" y="94">메서드</text>
    <text x="470" y="142">이벤트</text>
    <text x="470" y="218">필드</text>
  </g>

  <!-- 방향 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="120" y1="89" x2="408" y2="89" marker-end="url(#arrow)" />
    <line x1="410" y1="137" x2="122" y2="137" marker-end="url(#arrow)" />
    <line x1="120" y1="190" x2="408" y2="190" marker-end="url(#arrow)" />
    <line x1="120" y1="216" x2="408" y2="216" marker-end="url(#arrow)" />
    <line x1="410" y1="242" x2="122" y2="242" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="264" y="83">RPC로 호출</text>
    <text x="264" y="131">값이 바뀔 때나 주기적으로</text>
    <text x="264" y="184">getter로 읽기</text>
    <text x="264" y="210">setter로 바꾸기</text>
    <text x="264" y="236">notifier로 알림</text>
  </g>
</svg>
