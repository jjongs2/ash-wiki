    <text x="136" y="64.5">UN R155</text>
    <text x="136" y="130">EU 2019/2144</text>
    <text x="136" y="146" font-size="12">항목 미충족 차량</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="150" y1="60" x2="690" y2="60" />
    <line x1="150" y1="134" x2="690" y2="134" />
  </g>

  <!-- 날짜 -->
  <g fill="var(--ink, #727981)">
    <circle cx="153.5" cy="60" r="4" />
    <circle cx="359.8" cy="60" r="4" />
    <circle cx="659.8" cy="60" r="4" />
    <circle cx="240.6" cy="134" r="4" />
    <circle cx="360.8" cy="134" r="4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
