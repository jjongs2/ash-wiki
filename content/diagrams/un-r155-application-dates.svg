<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 0.5 683.5 210.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 1년 = 60 단위, 2021년 1월 1일 = x 150 -->
