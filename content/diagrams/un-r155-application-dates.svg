  <path d="M150 170 v5 M210 170 v5 M270 170 v5 M330 170 v5 M390 170 v5 M450 170 v5 M510 170 v5 M570 170 v5 M630 170 v5 M690 170 v5" stroke="var(--ink, #727981)" stroke-width="1" />
