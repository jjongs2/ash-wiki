<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 0 480 197" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="마스터와 슬레이브의 송신 클럭">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 마스터: 로컬 클럭 소스에서 송신 클럭 -->
  <rect x="80.75" y="20.75" width="118.5" height="38.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="45" text-anchor="middle" fill="var(--text, #727981)">로컬 클럭 소스</text>
  <line x1="140" y1="60" x2="140" y2="98" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="148" y="84" font-size="12" fill="var(--text, #727981)">송신 클럭</text>
  <rect x="80.75" y="100.75" width="118.5" height="48.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="140" y="130" text-anchor="middle" fill="var(--on-fill, #f8fafd)">마스터</text>

  <!-- 꼬임쌍선 한 쌍 -->
  <path d="M200 118 H220 C232.5 118 232.5 132 245 132 C257.5 132 257.5 118 270 118 C282.5 118 282.5 132 295 132 C307.5 132 307.5 118 320 118 C332.5 118 332.5 132 345 132 C357.5 132 357.5 118 370 118 H400" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M200 132 H220 C232.5 132 232.5 118 245 118 C257.5 118 257.5 132 270 132 C282.5 132 282.5 118 295 118 C307.5 118 307.5 132 320 132 C332.5 132 332.5 118 345 118 C357.5 118 357.5 132 370 132 H400" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="300" y="176" text-anchor="middle" font-size="12" fill="var(--text, #727981)">꼬임쌍선 한 쌍</text>

  <!-- 슬레이브: 마스터 신호에서 복구한 클럭으로 송신 -->
  <circle cx="380" cy="118" r="3.5" fill="var(--ink, #727981)" />
  <path d="M380 118 V40 H398" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="372" y="84" text-anchor="end" font-size="12" fill="var(--text, #727981)">마스터의 신호</text>
  <rect x="400.75" y="20.75" width="118.5" height="38.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="460" y="45" text-anchor="middle" fill="var(--text, #727981)">클럭 복구</text>
  <line x1="460" y1="60" x2="460" y2="98" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="468" y="84" font-size="12" fill="var(--text, #727981)">송신 클럭</text>
  <rect x="400.75" y="100.75" width="118.5" height="48.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="460" y="130" text-anchor="middle" fill="var(--on-fill, #f8fafd)">슬레이브</text>
</svg>
