<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 1.5 500 240" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="닫힌 경계와 열린 경계의 ON·OFF·IN·OUT 점">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTAL-TA 강의계획서</text>

  <!-- 경계 -->
  <path d="M300 46 V74 M300 92 V104 M300 134 V174 M300 192 V204" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="300" y="40" text-anchor="middle" fill="var(--text, #727981)">경계</text>

  <!-- 행 이름 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="90" y="94">닫힌 경계</text>
    <text x="90" y="110">≤, ≥, =</text>
    <text x="90" y="194">열린 경계</text>
    <text x="90" y="210">&lt;, &gt;, ≠</text>
  </g>

  <!-- 동치 분할 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M120 70 V62 H300 V70" />
    <path d="M120 170 V162 H300 V170" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="56">동치 분할</text>
    <text x="210" y="156">동치 분할</text>
  </g>

  <!-- 수직선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="96" x2="480" y2="96" />
    <line x1="110" y1="196" x2="480" y2="196" />
  </g>

  <!-- 정밀도 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M300 104 V110 H340 V104" />
    <path d="M260 204 V210 H300 V204" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="126">정밀도</text>
    <text x="280" y="226">정밀도</text>
  </g>

  <!-- 점 -->
  <g fill="var(--ink, #727981)">
    <circle cx="190" cy="96" r="5" />
    <circle cx="300" cy="96" r="5" />
    <circle cx="340" cy="96" r="5" />
    <circle cx="430" cy="96" r="5" />
    <circle cx="190" cy="196" r="5" />
    <circle cx="260" cy="196" r="5" />
    <circle cx="300" cy="196" r="5" />
    <circle cx="430" cy="196" r="5" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="86">IN</text>
    <text x="300" y="86">ON</text>
    <text x="340" y="86">OFF</text>
    <text x="430" y="86">OUT</text>
    <text x="190" y="186">IN</text>
    <text x="260" y="186">ON</text>
    <text x="300" y="186">OFF</text>
    <text x="430" y="186">OUT</text>
  </g>
</svg>
