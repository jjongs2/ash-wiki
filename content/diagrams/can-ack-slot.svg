<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.5 -13.5 415 289.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- ACK 필드: ACK 슬롯과 ACK 구분자 -->
  <path d="M250 30 V24 H430 V30" stroke="#727981" stroke-width="1.5" />
  <text x="340" y="16" text-anchor="middle" font-size="12" fill="#727981">ACK 필드</text>

  <!-- 비트 이름 -->
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="205" y="50">CRC 구분자</text>
    <text x="295" y="50">ACK 슬롯</text>
    <text x="385" y="50">ACK 구분자</text>
  </g>

  <!-- 송신 노드 -->
  <text x="146" y="85" text-anchor="end" fill="#727981">송신 노드</text>
  <g stroke="#727981" stroke-width="1.5">
    <rect x="160.75" y="60.75" width="88.5" height="38.5" />
    <rect x="250.75" y="60.75" width="88.5" height="38.5" />
    <rect x="340.75" y="60.75" width="88.5" height="38.5" />
  </g>
  <g text-anchor="middle" fill="#727981">
    <text x="205" y="85">R</text><text x="295" y="85">R</text><text x="385" y="85">R</text>
  </g>

  <!-- 오류 없이 받은 수신 노드 -->
  <text x="146" y="135" text-anchor="end" fill="#727981">수신 노드</text>
  <g stroke="#727981" stroke-width="1.5">
    <rect x="160.75" y="110.75" width="88.5" height="38.5" />
    <rect x="340.75" y="110.75" width="88.5" height="38.5" />
  </g>
  <rect x="250" y="110" width="90" height="40" fill="#b0540d" />
  <text x="205" y="135" text-anchor="middle" fill="#727981">R</text>
  <text x="295" y="135" text-anchor="middle" fill="#f8fafd">D</text>
  <text x="385" y="135" text-anchor="middle" fill="#727981">R</text>

  <!-- 버스 -->
  <text x="146" y="185" text-anchor="end" fill="#727981">버스에서 읽은 값</text>
  <g fill="#337b47">
    <rect x="160" y="160" width="89" height="40" />
    <rect x="250" y="160" width="89" height="40" />
    <rect x="340" y="160" width="90" height="40" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="205" y="185">R</text><text x="295" y="185">D</text><text x="385" y="185">R</text>
  </g>

  <!-- 범례 -->
  <text x="160" y="228" font-size="12" fill="#727981">D: dominant · R: recessive</text>
  <rect x="160" y="242" width="14" height="14" fill="#b0540d" />
  <text x="182" y="254" font-size="12" fill="#727981">프레임을 오류 없이 받은 노드가 내는 dominant</text>
</svg>
