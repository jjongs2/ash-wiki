<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 2 789 259" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Minimum Send Interval: 마지막으로 넘긴 때부터 잰다 -->
  <text x="250" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Minimum Send Interval</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M170 46 v-6 H330 v6" />
    <path d="M370 46 v-6 H530 v6" />
    <path d="M560 46 v-6 H720 v6" />
  </g>

  <!-- 행 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="74.5">송신 요청</text>
    <text x="20" y="164.5">하위 송신 계층</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="150" y1="70" x2="740" y2="70" />
    <line x1="150" y1="160" x2="740" y2="160" />
  </g>

  <!-- 넘긴 요청 -->
  <g fill="var(--ink, #727981)">
    <circle cx="170" cy="70" r="4" />
    <circle cx="370" cy="70" r="4" />
    <circle cx="560" cy="70" r="4" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="74" x2="170" y2="158" />
    <line x1="370" y1="74" x2="370" y2="158" />
    <line x1="560" y1="74" x2="560" y2="158" />
  </g>

  <!-- 버린 요청 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5">
    <path d="M245 65 l10 10 M255 65 l-10 10" />
    <path d="M435 65 l10 10 M445 65 l-10 10" />
  </g>

  <!-- 시간 축 -->
  <line x1="150" y1="196" x2="738" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="750" y="200.5" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 범례 -->
  <line x1="150" y1="236" x2="178" y2="236" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M355 231 l10 10 M365 231 l-10 10" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="188" y="240.5">송신 계층에 넘긴다</text>
    <text x="375" y="240.5">버리고 kMinimumSendIntervalViolationError를 돌려준다</text>
  </g>
</svg>
