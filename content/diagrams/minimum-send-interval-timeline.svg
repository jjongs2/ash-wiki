<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.5 1.5 530 290" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Minimum Send Interval: 마지막으로 넘긴 때부터 잰다 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="160" y="30">Minimum Send Interval</text>
    <text x="310" y="30">Minimum Send Interval</text>
    <text x="452" y="30">Minimum Send Interval</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M100 46 v-6 H220 v6" />
    <path d="M250 46 v-6 H370 v6" />
    <path d="M392 46 v-6 H512 v6" />
  </g>

  <!-- 행 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="66.5">송신</text>
    <text x="20" y="82.5">요청</text>
    <text x="20" y="156.5">하위</text>
    <text x="20" y="172.5">송신 계층</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="90" y1="70" x2="515" y2="70" />
    <line x1="90" y1="160" x2="515" y2="160" />
  </g>

  <!-- 넘긴 요청 -->
  <g fill="var(--ink, #727981)">
    <circle cx="100" cy="70" r="4" />
    <circle cx="250" cy="70" r="4" />
    <circle cx="392" cy="70" r="4" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="74" x2="100" y2="158" />
    <line x1="250" y1="74" x2="250" y2="158" />
    <line x1="392" y1="74" x2="392" y2="158" />
  </g>

  <!-- 버린 요청 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5">
    <path d="M155 65 l10 10 M165 65 l-10 10" />
    <path d="M297 65 l10 10 M307 65 l-10 10" />
  </g>

  <!-- 시간 축 -->
  <line x1="90" y1="196" x2="513" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="515" y="218" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 범례 -->
  <line x1="20" y1="244" x2="48" y2="244" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M29 261 l10 10 M39 261 l-10 10" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="58" y="248.5">송신 계층에 넘긴다</text>
    <text x="58" y="270.5">버리고 kMinimumSendIntervalViolationError를 돌려준다</text>
  </g>
</svg>
