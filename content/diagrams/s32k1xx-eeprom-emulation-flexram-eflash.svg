<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 3.5 484 333" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="S32K1xx의 FlexRAM과 E-flash">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="40" y="32" font-size="12" fill="var(--text, #727981)">NXP S32K1xx</text>

  <!-- 응용과 FlexRAM -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="270" y="48" width="120" height="36" rx="2" />
    <rect x="220" y="128" width="220" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="330" y="71">응용</text>
    <text x="330" y="148">FlexRAM</text>
    <text x="330" y="166" font-size="12">EEPROM 공간</text>
  </g>
  <line x1="330" y1="86" x2="330" y2="126" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="340" y="111" font-size="12" fill="var(--text, #727981)">읽기·쓰기</text>

  <!-- FlexNVM -->
  <rect x="40" y="240" width="420" height="76" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="52" y="258" font-size="12" fill="var(--text, #727981)">FlexNVM</text>
  <rect x="212" y="268" width="236" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="291" text-anchor="middle" fill="var(--text, #727981)">E-flash</text>

  <!-- 백업과 올리기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="290" y1="176" x2="290" y2="266" />
    <line x1="370" y1="268" x2="370" y2="178" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="280" y="218" text-anchor="end">상태 기계가 레코드로 백업</text>
    <text x="380" y="218">리셋 때 이미지를 올림</text>
  </g>
</svg>
