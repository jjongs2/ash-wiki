<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 312" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Secured I-PDU와 Authenticator를 계산하는 데이터">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Authenticator를 계산하는 데이터 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">Authenticator를 계산하는 데이터</text>
  <rect x="20" y="40" width="120" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="140" y="40" width="160" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="300" y="40" width="150" height="44" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g text-anchor="middle">
    <text x="80" y="67" fill="var(--text, #727981)">Data Identifier</text>
    <text x="220" y="58" fill="var(--text, #727981)">Authentic I-PDU의</text>
    <text x="220" y="75" fill="var(--text, #727981)">보호할 부분</text>
    <text x="375" y="58" fill="var(--on-fill, #f8fafd)">완전한</text>
    <text x="375" y="75" fill="var(--on-fill, #f8fafd)">Freshness Value</text>
  </g>

  <!-- 계산 -->
  <path d="M20 90 V98 H450 V90" stroke="var(--ink, #727981)" stroke-width="1" />
  <line x1="385" y1="98" x2="385" y2="198" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="373" y="152">키로 계산(MAC 또는 디지털 서명)</text>
  </g>

  <!-- Secured I-PDU -->
  <text x="20" y="190" font-size="12" fill="var(--text, #727981)">Secured I-PDU</text>
  <rect x="20" y="200" width="170" height="34" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="190" y="200" width="130" height="34" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="320" y="200" width="130" height="34" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle">
    <text x="105" y="222" fill="var(--text, #727981)">Authentic I-PDU</text>
    <text x="255" y="222" fill="var(--on-fill, #f8fafd)">Freshness Value</text>
    <text x="385" y="222" fill="var(--on-fill, #f8fafd)">Authenticator</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="255" y="254">선택 · 자르면 하위 비트</text>
    <text x="385" y="254">자르면 상위 비트</text>
  </g>
  <path d="M190 264 V272 H450 V264" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인증 정보</text>
</svg>
