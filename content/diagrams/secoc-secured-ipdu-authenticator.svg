<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 12 580 278" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Authenticator를 계산하는 데이터 -->
  <text x="80" y="30" font-size="12" fill="var(--text, #727981)">Authenticator를 계산하는 데이터</text>
  <rect x="80" y="40" width="140" height="34" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="220" y="40" width="230" height="34" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="450" y="40" width="190" height="34" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g text-anchor="middle">
    <text x="150" y="62" fill="var(--text, #727981)">Data Identifier</text>
    <text x="335" y="62" fill="var(--text, #727981)">Authentic I-PDU의 보호할 부분</text>
    <text x="545" y="62" fill="var(--on-fill, #f8fafd)">완전한 Freshness Value</text>
  </g>

  <!-- 계산 -->
  <path d="M80 80 V88 H640 V80" stroke="var(--ink, #727981)" stroke-width="1" />
  <line x1="560" y1="88" x2="560" y2="188" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="548" y="142">키로 계산(MAC 또는 디지털 서명)</text>
  </g>

  <!-- Secured I-PDU -->
  <text x="80" y="180" font-size="12" fill="var(--text, #727981)">Secured I-PDU</text>
  <rect x="80" y="190" width="260" height="34" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="340" y="190" width="140" height="34" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="480" y="190" width="160" height="34" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle">
    <text x="210" y="212" fill="var(--text, #727981)">Authentic I-PDU</text>
    <text x="410" y="212" fill="var(--on-fill, #f8fafd)">Freshness Value</text>
    <text x="560" y="212" fill="var(--on-fill, #f8fafd)">Authenticator</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="410" y="244">선택 · 자르면 하위 비트</text>
    <text x="560" y="244">자르면 상위 비트</text>
  </g>
  <path d="M340 254 V262 H640 V254" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="490" y="280" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인증 정보</text>
</svg>
