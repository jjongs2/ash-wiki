<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 236" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="가상 머신과 DMA 컨트롤러의 메모리 접근">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 접근하는 쪽, 변환, 메모리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="130" height="36" rx="2" />
    <rect x="380" y="20" width="130" height="36" rx="2" />
    <rect x="20" y="100" width="130" height="36" rx="2" />
    <rect x="380" y="100" width="130" height="36" rx="2" />
    <rect x="20" y="180" width="490" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="43">가상 머신</text>
    <text x="445" y="43">DMA 컨트롤러</text>
    <text x="85" y="123">stage 2 변환</text>
    <text x="445" y="123">SMMU</text>
    <text x="265" y="203">물리 메모리</text>
  </g>

  <!-- 하이퍼바이저 -->
  <rect x="200" y="100" width="130" height="36" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <text x="265" y="123" text-anchor="middle" fill="var(--on-fill, #f8fafd)">하이퍼바이저</text>

  <!-- 메모리 접근 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="85" y1="56" x2="85" y2="98" />
    <line x1="445" y1="56" x2="445" y2="98" />
    <line x1="85" y1="136" x2="85" y2="178" />
    <line x1="445" y1="136" x2="445" y2="178" />
  </g>

  <!-- 배정 -->
  <line x1="378" y1="38" x2="152" y2="38" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="265" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">가상 머신에 배정</text>

  <!-- 하이퍼바이저가 다스림 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="200" y1="118" x2="152" y2="118" />
    <line x1="330" y1="118" x2="378" y2="118" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="176" y="110">다스림</text>
    <text x="354" y="110">설정</text>
  </g>
</svg>
