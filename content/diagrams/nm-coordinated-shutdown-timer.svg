<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 3 500 270" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="coordinated shutdown의 채널마다 셧다운 지연 타이머">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- NmGlobalCoordinatorTime -->
  <line x1="102" y1="44" x2="458" y2="44" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="280" y="34" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NmGlobalCoordinatorTime</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="36" x2="100" y2="186" />
    <line x1="460" y1="36" x2="460" y2="186" />
  </g>

  <!-- 채널마다: 셧다운 지연 타이머 뒤에 셧다운 시간 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="88" y="91">채널 1</text>
    <text x="88" y="151">채널 2</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="100.75" y="70.75" width="142.5" height="30.5" />
    <rect x="100.75" y="130.75" width="250.5" height="30.5" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="244.75" y="70.75" width="214.5" height="30.5" />
    <rect x="352.75" y="130.75" width="106.5" height="30.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="172" y="90">셧다운 지연 타이머</text>
    <text x="352" y="90">셧다운 시간</text>
    <text x="226" y="150">셧다운 지연 타이머</text>
    <text x="406" y="150">셧다운 시간</text>
  </g>

  <!-- 시간 축 -->
  <line x1="100" y1="186" x2="488" y2="186" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="100" y="206" text-anchor="middle">coordinated shutdown 시작</text>
    <text x="20" y="232">타이머가 만료되면 그 버스의 NM에 버스 동기화를 요청한 뒤</text>
    <text x="20" y="250">네트워크를 해제한다</text>
  </g>
</svg>
