<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 요구 빈도 축 -->
  <line x1="30" y1="50" x2="586" y2="50" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="590" y="38" text-anchor="end" fill="var(--text, #727981)">요구 빈도</text>

  <!-- 1년에 한 번 경계 -->
  <line x1="250" y1="40" x2="250" y2="210" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="250" y="30" text-anchor="middle" fill="var(--text, #727981)">1년에 한 번</text>

  <!-- 동작 모드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30.75" y="70.75" width="208.5" height="44.5" rx="2" />
    <rect x="260.75" y="70.75" width="158.5" height="44.5" rx="2" />
    <rect x="430.75" y="70.75" width="158.5" height="44.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="135" y="89" font-size="13">Low demand mode</text>
    <text x="135" y="106">1년에 한 번 이하</text>
    <text x="340" y="89" font-size="13">High demand mode</text>
    <text x="340" y="106">1년에 한 번보다 많음</text>
    <text x="510" y="89" font-size="13">Continuous mode</text>
    <text x="510" y="106">늘 제어</text>
  </g>

  <!-- 화살표 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M135 116 V146" />
    <path d="M340 116 V146" />
    <path d="M510 116 V146" />
  </g>

  <!-- target failure measure -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30.75" y="150.75" width="208.5" height="44.5" rx="2" />
    <rect x="260.75" y="150.75" width="328.5" height="44.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="135" y="169" font-size="13">PFDavg</text>
    <text x="135" y="187">하한 10<tspan baseline-shift="super" font-size="9">−5</tspan></text>
    <text x="425" y="169" font-size="13">PFH</text>
    <text x="425" y="187">하한 10<tspan baseline-shift="super" font-size="9">−9</tspan> h<tspan baseline-shift="super" font-size="9">−1</tspan></text>
  </g>
</svg>
