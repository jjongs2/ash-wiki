<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 29.5 509 217" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="110" width="90" height="36" rx="2" />
    <rect x="200" y="40" width="90" height="36" rx="2" />
    <rect x="200" y="110" width="90" height="36" rx="2" />
    <rect x="200" y="200" width="90" height="36" rx="2" />
    <rect x="404" y="110" width="104" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="65" y="133">초기 명세</text>
    <text x="245" y="63">버전 1</text>
    <text x="245" y="133">버전 2</text>
    <text x="245" y="223">버전 N</text>
    <text x="456" y="133">결정 알고리즘</text>
  </g>
  <!-- 버전 2와 버전 N 사이의 생략 -->
  <g fill="var(--ink, #727981)">
    <circle cx="245" cy="164" r="1.5" />
    <circle cx="245" cy="173" r="1.5" />
    <circle cx="245" cy="182" r="1.5" />
  </g>

  <!-- 같은 명세에서 따로 개발 -->
  <line x1="110" y1="128" x2="170" y2="128" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M170 128 V58 H198" />
    <line x1="170" y1="128" x2="198" y2="128" />
    <path d="M170 128 V218 H198" />
  </g>
  <text x="140" y="120" font-size="12" fill="var(--text, #727981)" text-anchor="middle">따로 개발</text>

  <!-- 비교 벡터를 결정 알고리즘으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M290 58 H316 V128" />
    <line x1="290" y1="128" x2="316" y2="128" />
    <path d="M290 218 H316 V128" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="316" y1="128" x2="402" y2="128" />
    <line x1="456" y1="146" x2="456" y2="184" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="360" y="120">비교 벡터</text>
    <text x="360" y="144">cc-point마다</text>
  </g>
  <text x="456" y="202" text-anchor="middle" fill="var(--text, #727981)">합의 결과</text>
</svg>
