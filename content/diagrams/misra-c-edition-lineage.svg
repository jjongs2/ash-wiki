<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.5 9.5 512.5 513" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판: 한 줄에 64 단위 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="20" width="160" height="44" rx="2" />
    <rect x="100" y="84" width="160" height="44" rx="2" />
    <rect x="100" y="148" width="160" height="44" rx="2" />
    <rect x="100" y="276" width="160" height="44" rx="2" />
    <rect x="100" y="404" width="160" height="44" rx="2" />
    <rect x="100" y="468" width="160" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="39">MISRA C:1998</text>
    <text x="180" y="56" font-size="12">1998년 4월</text>
    <text x="180" y="103">MISRA C:2004</text>
    <text x="180" y="120" font-size="12">2004년</text>
    <text x="180" y="167">MISRA C:2012</text>
    <text x="180" y="184" font-size="12">2013년 3월 18일</text>
    <text x="180" y="295">MISRA C:2012 개정본</text>
    <text x="180" y="312" font-size="12">2019년 2월</text>
    <text x="180" y="423">MISRA C:2023</text>
    <text x="180" y="440" font-size="12">2023년 4월</text>
    <text x="180" y="487">MISRA C:2025</text>
    <text x="180" y="504" font-size="12">2025년 3월</text>
  </g>

  <!-- Amendment -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="290" y="212" width="140" height="44" rx="2" />
    <rect x="290" y="340" width="140" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="360" y="231">Amendment 1</text>
    <text x="360" y="248" font-size="12">2016년 4월</text>
    <text x="360" y="359">Amendment 2</text>
    <text x="360" y="376" font-size="12">2020년 2월</text>
  </g>

  <!-- 판의 이어짐과 Amendment를 합친 개정 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="64" x2="180" y2="82" />
    <line x1="180" y1="128" x2="180" y2="146" />
    <line x1="180" y1="192" x2="180" y2="274" />
    <line x1="180" y1="320" x2="180" y2="402" />
    <line x1="180" y1="448" x2="180" y2="466" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <path d="M360 256 V298 H268" />
    <path d="M360 384 V426 H268" />
  </g>
  <g fill="var(--blue, #336fb8)">
    <path d="M262 298 L269 294.5 L269 301.5 Z" />
    <path d="M262 426 L269 422.5 L269 429.5 Z" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="370" y="302">Technical Corrigendum 1과 합침</text>
    <text x="370" y="422">Amendment 3, 4와</text>
    <text x="370" y="438">Technical Corrigendum 2와 합침</text>
  </g>

  <!-- 판 번호 -->
  <path d="M92 148 H86 V448 H92" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="88" y="46">첫판</text>
    <text x="88" y="110">둘째 판</text>
    <text x="78" y="302">셋째 판</text>
    <text x="88" y="494">현행판</text>
  </g>
</svg>
