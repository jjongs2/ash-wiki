<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 13.5 630 291.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g fill="var(--text, #727981)">
    <text x="20" y="57">패키지의 색인</text>
    <text x="20" y="167">이미지</text>
  </g>

  <!-- 색인: 블록마다 해시 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130" y="34" width="80" height="36" />
    <rect x="210" y="34" width="80" height="36" />
    <rect x="290" y="34" width="80" height="36" />
    <rect x="370" y="34" width="80" height="36" />
    <rect x="450" y="34" width="80" height="36" />
    <rect x="530" y="34" width="80" height="36" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="56.5">해시</text>
    <text x="250" y="56.5">해시</text>
    <text x="330" y="56.5">해시</text>
    <text x="410" y="56.5">해시</text>
    <text x="490" y="56.5">해시</text>
    <text x="570" y="56.5">해시</text>
  </g>

  <line x1="250" y1="72" x2="250" y2="140" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="258" y="102">해시가 같은 블록을</text>
    <text x="258" y="118">기기의 데이터에서 찾음</text>
  </g>

  <!-- 새 이미지 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130" y="144" width="80" height="36" />
    <rect x="210" y="144" width="80" height="36" />
    <rect x="370" y="144" width="80" height="36" />
    <rect x="450" y="144" width="80" height="36" />
  </g>
  <g stroke="var(--green, #337b47)" stroke-width="1.5" fill="var(--green-tint, #337b47)">
    <rect x="290" y="144" width="80" height="36" />
    <rect x="530" y="144" width="80" height="36" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="166.5">찾아 씀</text>
    <text x="250" y="166.5">찾아 씀</text>
    <text x="410" y="166.5">찾아 씀</text>
    <text x="490" y="166.5">찾아 씀</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="330" y="166.5">받음</text>
    <text x="570" y="166.5">받음</text>
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="130" y="210">찾아 씀: 기기가 이미 가진 데이터에서 해시가 같은 블록</text>
    <text x="130" y="228">받음: 나머지 블록을 HTTP Range 요청으로 받음</text>
    <text x="130" y="266">RAUC block-hash-index: 4 KiB 블록마다 SHA-256 해시</text>
    <text x="130" y="284">색인의 크기는 원래 이미지의 0.8%</text>
  </g>
</svg>
