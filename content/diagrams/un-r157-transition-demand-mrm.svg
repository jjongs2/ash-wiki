<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="transition demand에서 MRM까지">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판과 조건 -->
  <text x="20" y="24" fill="var(--text, #727981)">UN R157 01 시리즈, 운전자가 시스템을 꺼서 응하지 않을 때</text>

  <!-- transition demand에서 MRM까지: 빨라야 10초 -->
  <text x="220" y="48" text-anchor="middle" fill="var(--text, #727981)">10초 이상</text>
  <path d="M130 62 v-6 H310 v6" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 구간: 축 위에 이어지므로 모서리는 0 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="68" width="110" height="44" />
    <rect x="130" y="68" width="180" height="44" />
    <rect x="310" y="68" width="180" height="44" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="86">ALKS가</text>
    <text x="75" y="102">DDT 수행</text>
    <text x="220" y="94.5">transition demand</text>
    <text x="400" y="86">MRM</text>
    <text x="400" y="102">감속 요구 목표 4.0 m/s² 이하</text>
  </g>

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="130" y1="112" x2="130" y2="134" />
    <line x1="310" y1="112" x2="310" y2="134" />
    <line x1="490" y1="112" x2="490" y2="134" />
  </g>
  <line x1="20" y1="138" x2="518" y2="138" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g fill="var(--ink, #727981)">
    <circle cx="130" cy="138" r="4" />
    <circle cx="310" cy="138" r="4" />
    <circle cx="490" cy="138" r="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="160">transition demand 시작</text>
    <text x="310" y="160">MRM 시작</text>
    <text x="310" y="176">비상등 신호</text>
    <text x="490" y="160">정지</text>
    <text x="490" y="176">시스템 꺼짐</text>
  </g>

  <text x="20" y="204" fill="var(--text, #727981)">ALKS나 차량의 심각한 failure에는 MRM을 즉시 시작할 수 있다</text>
</svg>
