<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 515.5 264" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 태그 -->
  <rect x="110.75" y="20.75" width="178.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="200" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">C-VLAN 태그 · 4옥텟</text>

  <!-- 태그가 TPID와 TCI로 갈라진다 -->
  <path d="M200 56 V72 M100 88 V72 H300 V88" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="30" y="88" width="140" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="100" y="111" text-anchor="middle" fill="var(--text, #727981)">TPID</text>
  <text x="100" y="142" text-anchor="middle" font-size="12" fill="var(--text, #727981)">2옥텟 · EtherType 0x8100</text>
  <rect x="230.75" y="88.75" width="138.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="300" y="111" text-anchor="middle" fill="var(--text, #727981)">TCI</text>

  <!-- TCI가 PCP, DEI, VID로 갈라진다 -->
  <path d="M250 124 V248 M250 160 H268 M250 204 H268 M250 248 H268" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="268" y="144" width="70" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="303" y="165" text-anchor="middle" fill="var(--text, #727981)">PCP</text>
  <rect x="268" y="188" width="70" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="303" y="209" text-anchor="middle" fill="var(--text, #727981)">DEI</text>
  <rect x="268" y="232" width="70" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="303" y="253" text-anchor="middle" fill="var(--text, #727981)">VID</text>

  <!-- 필드의 뜻 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="350" y="164">3비트 · 우선순위 0~7</text>
    <text x="350" y="200">1비트 · drop_eligible</text>
    <text x="350" y="216">2005년판에서는 이 자리가 CFI</text>
    <text x="350" y="244">12비트 · VLAN 1~4094</text>
    <text x="350" y="260">0과 4095는 VLAN 번호로 쓰지 않음</text>
  </g>
</svg>
