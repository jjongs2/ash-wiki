<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 520 232" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Concept phase -->
  <rect x="20.75" y="20.75" width="128.5" height="210.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="42" font-size="13">Concept phase</text>
    <text x="85" y="58">Part 3</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30.75" y="70.75" width="108.5" height="26.5" rx="2" />
    <rect x="30.75" y="122.75" width="108.5" height="26.5" rx="2" />
    <rect x="30.75" y="174.75" width="108.5" height="42.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="88">Item definition</text>
    <text x="85" y="140">HARA</text>
    <text x="85" y="192">Functional safety</text>
    <text x="85" y="208">concept</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M85 98 V118" />
    <path d="M85 150 V170" />
  </g>

  <!-- 제품 개발 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="176.75" y="20.75" width="236.5" height="44.5" rx="2" />
    <rect x="201.75" y="160.75" width="93.5" height="58.5" rx="2" />
    <rect x="305.75" y="160.75" width="93.5" height="58.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="295" y="40" font-size="13">시스템 수준 제품 개발</text>
    <text x="295" y="57">Part 4</text>
    <text x="248.5" y="182">하드웨어 수준</text>
    <text x="248.5" y="198">제품 개발</text>
    <text x="248.5" y="214">Part 5</text>
    <text x="352.5" y="182">소프트웨어 수준</text>
    <text x="352.5" y="198">제품 개발</text>
    <text x="352.5" y="214">Part 6</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M182 66 V140 H352.5 V156" />
    <path d="M248.5 140 V156" />
    <path d="M248.5 220 V232 H408 V70" />
  </g>
  <path d="M352.5 220 V232" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="295" y="118" text-anchor="middle" fill="var(--text, #727981)">V 모델</text>

  <!-- 생산 이후 -->
  <rect x="440.75" y="20.75" width="78.5" height="58.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="480" y="40">생산, 운용,</text>
    <text x="480" y="56">서비스, 폐기</text>
    <text x="480" y="72">Part 7</text>
  </g>

  <!-- 단계 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M150 43 H172" />
    <path d="M414 43 H436" />
  </g>
</svg>
