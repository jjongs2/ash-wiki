<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Concept phase -->
  <rect x="20.75" y="20.75" width="148.5" height="210.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="42" font-size="13">Concept phase</text>
    <text x="95" y="58">Part 3</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="35.75" y="70.75" width="118.5" height="26.5" rx="2" />
    <rect x="35.75" y="122.75" width="118.5" height="26.5" rx="2" />
    <rect x="35.75" y="174.75" width="118.5" height="42.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="88">Item definition</text>
    <text x="95" y="140">HARA</text>
    <text x="95" y="192">Functional safety</text>
    <text x="95" y="208">concept</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M95 98 V118" />
    <path d="M95 150 V170" />
  </g>

  <!-- 제품 개발 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="210.75" y="20.75" width="288.5" height="44.5" rx="2" />
    <rect x="235.75" y="160.75" width="118.5" height="58.5" rx="2" />
    <rect x="365.75" y="160.75" width="118.5" height="58.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="355" y="40" font-size="13">시스템 수준 제품 개발</text>
    <text x="355" y="57">Part 4</text>
    <text x="295" y="182">하드웨어 수준</text>
    <text x="295" y="198">제품 개발</text>
    <text x="295" y="214">Part 5</text>
    <text x="425" y="182">소프트웨어 수준</text>
    <text x="425" y="198">제품 개발</text>
    <text x="425" y="214">Part 6</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M222 66 V190 H231" />
    <path d="M485 190 H488 V70" />
  </g>
  <text x="355" y="118" text-anchor="middle" fill="var(--text, #727981)">V 모델</text>

  <!-- 생산 이후 -->
  <rect x="540.75" y="20.75" width="118.5" height="58.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="600" y="40">생산, 운용,</text>
    <text x="600" y="56">서비스, 폐기</text>
    <text x="600" y="72">Part 7</text>
  </g>

  <!-- 단계 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M170 43 H206" />
    <path d="M500 43 H536" />
  </g>
</svg>
