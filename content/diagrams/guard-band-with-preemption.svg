<svg xmlns="http://www.w3.org/2000/svg" viewBox="330 -5.5 426 185.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 기준선: 시간이 중요한 큐의 창이 시작하는 시각 -->
  <line x1="530" y1="32" x2="530" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="530" y="24" text-anchor="middle" fill="var(--text, #727981)">창이 시작하는 시각</text>

  <!-- 두 guard band -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M391 64 V56 H529 V64" />
    <path d="M491 96 V88 H529 V96" />
  </g>
  <text x="542" y="64" fill="var(--text, #727981)">guard band, 선점 없음: 가장 긴 프레임</text>
  <text x="542" y="96" fill="var(--text, #727981)">guard band, 선점 있음: 가장 긴 조각</text>

  <!-- 시간축 -->
  <rect x="530" y="112" width="170" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="615" y="130" text-anchor="middle" fill="var(--text, #727981)">시간이 중요한 큐의 창</text>
  <line x1="350" y1="140" x2="736" y2="140" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="736" y="158" text-anchor="end" fill="var(--text, #727981)">시간</text>
</svg>
