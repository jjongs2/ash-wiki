<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 724 254" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 -->
  <g text-anchor="middle" fill="var(--text, #727981)" font-weight="600">
    <text x="188" y="26">1단계</text>
    <text x="584" y="26">2단계</text>
  </g>

  <!-- 1단계: SUMS 적합 인증서 -->
  <rect x="20" y="36" width="336" height="196" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="188" y="58">SUMS 적합 인증서</text>
    <text x="188" y="75" font-size="12">7.1절의 SUMS 요구</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="36" y="132" width="130" height="48" rx="4" />
    <rect x="210" y="132" width="130" height="48" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="101" y="152">승인 당국의</text>
    <text x="101" y="169">평가</text>
    <text x="275" y="152">인증서</text>
    <text x="275" y="169">발급</text>
  </g>

  <!-- 2단계: 차량 형식 승인 -->
  <rect x="464" y="36" width="240" height="196" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="584" y="58">차량 형식 승인</text>
    <text x="584" y="75" font-size="12">7.2절의 차량 형식 요구</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="478" y="88" width="212" height="32" rx="4" />
    <rect x="478" y="128" width="212" height="32" rx="4" />
    <rect x="478" y="168" width="212" height="50" rx="4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="584" y="108.5">업데이트의 진위성과 무결성 보호</text>
    <text x="584" y="148.5">RXSWIN의 식별, 읽기, 보호</text>
    <text x="584" y="188" font-weight="600">OTA 업데이트를 하는 차량 형식</text>
    <text x="584" y="205">사용자 통지, 주행 제한, 복귀 등</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="166" y1="156" x2="208" y2="156" />
    <line x1="340" y1="156" x2="462" y2="156" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="410" y="130">인증서를 함께</text>
    <text x="410" y="146">내고 신청</text>
  </g>
</svg>
