<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -6 556 177" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="FreeRTOS의 타임 슬라이싱">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">FreeRTOS</text>

  <!-- 줄 이름 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="57">높은 우선순위</text>
    <text x="20" y="89">같은 우선순위</text>
  </g>

  <!-- 높은 우선순위 태스크 준비 -->
  <line x1="420" y1="30" x2="420" y2="104" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="420" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">높은 우선순위 태스크 준비</text>
  <rect x="420.75" y="40.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>

  <!-- 같은 우선순위 태스크 둘 -->
  <g stroke-width="1.5">
    <rect x="120.75" y="72.75" width="78.5" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" />
    <rect x="200.75" y="72.75" width="78.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" />
    <rect x="280.75" y="72.75" width="78.5" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" />
    <rect x="360.75" y="72.75" width="58.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" />
    <rect x="420.75" y="72.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-dasharray="5 4" />
  </g>
  <g font-size="12" text-anchor="middle">
    <g fill="var(--on-fill, #f8fafd)">
      <text x="160" y="88">태스크 A</text>
      <text x="240" y="88">태스크 B</text>
      <text x="320" y="88">태스크 A</text>
      <text x="390" y="88">태스크 B</text>
    </g>
    <text x="450" y="88" fill="var(--text, #727981)">선점됨</text>
  </g>

  <!-- 시간 축과 틱 -->
  <line x1="110" y1="104" x2="508" y2="104" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="516" y="108" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M120 107 L125 117 L115 117 z" />
    <path d="M200 107 L205 117 L195 117 z" />
    <path d="M280 107 L285 117 L275 117 z" />
    <path d="M360 107 L365 117 L355 117 z" />
    <path d="M440 107 L445 117 L435 117 z" />
  </g>
  <text x="108" y="117" text-anchor="end" font-size="12" fill="var(--text, #727981)">틱 인터럽트</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="122" y1="130" x2="198" y2="130" />
    <line x1="122" y1="125" x2="122" y2="135" />
    <line x1="198" y1="125" x2="198" y2="135" />
  </g>
  <text x="160" y="150" text-anchor="middle" font-size="12" fill="var(--text, #727981)">타임 슬라이스</text>
</svg>
