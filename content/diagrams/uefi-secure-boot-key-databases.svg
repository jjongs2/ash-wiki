<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 520 467" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 키와 서명 데이터베이스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="200" y="20" width="160" height="36" rx="2" />
    <rect x="200" y="100" width="160" height="36" rx="2" />
    <rect x="60" y="190" width="180" height="48" rx="2" />
    <rect x="320" y="190" width="180" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="280" y="43">PK</text>
    <text x="280" y="123">KEK</text>
    <text x="150" y="210">db</text>
    <text x="150" y="228" font-size="12">허가 서명 데이터베이스</text>
    <text x="410" y="210">dbx</text>
    <text x="410" y="228" font-size="12">금지 서명 데이터베이스</text>
  </g>

  <!-- 부트 매니저와 UEFI 이미지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="200" y="290" width="160" height="36" rx="2" />
    <rect x="140" y="370" width="280" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="280" y="313">부트 매니저</text>
    <text x="280" y="390">UEFI 이미지</text>
    <text x="280" y="408" font-size="12">운영체제 로더, 옵션 ROM, 드라이버 등</text>
  </g>

  <!-- 고칠 수 있는 관계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="280" y1="58" x2="280" y2="98" marker-end="url(#arrow)" />
    <path d="M280 138 V160 H150 V188" marker-end="url(#arrow)" />
    <path d="M280 160 H410 V188" marker-end="url(#arrow)" />
    <path d="M198 38 H40 V214 H58" marker-end="url(#arrow)" />
    <path d="M362 38 H520 V214 H502" marker-end="url(#arrow)" />
  </g>

  <!-- 이미지 확인 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M150 240 V308 H198" marker-end="url(#arrow)" />
    <path d="M410 240 V308 H362" marker-end="url(#arrow)" />
    <line x1="280" y1="328" x2="280" y2="368" marker-end="url(#arrow)" />
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="288" y="74">User mode에서 개인 키로</text>
    <text x="288" y="90">서명한 데이터로만 고침</text>
    <text x="142" y="278" text-anchor="end">서명이 있어야 함</text>
    <text x="418" y="278">서명이 없어야 함</text>
    <text x="288" y="352">시작</text>
    <text x="280" y="446" text-anchor="middle">UEFI 2.11 명세</text>
  </g>
</svg>
