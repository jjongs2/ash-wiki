<svg xmlns="http://www.w3.org/2000/svg" viewBox="39.5 51.5 441.5 77.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="50" y="62" width="110" height="36" rx="2" />
    <rect x="270" y="62" width="110" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="105" y="85">테스트 절차</text>
    <text x="325" y="85">테스트 대상</text>
  </g>

  <!-- 입력은 테스트 절차가 정하고, 출력은 되돌아가지 않는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="80" x2="268" y2="80" />
    <line x1="380" y1="80" x2="470" y2="80" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="214" y="72">입력</text>
    <text x="425" y="72">출력</text>
    <text x="214" y="118">테스터가 입력을 바로 정함</text>
    <text x="425" y="118">되먹임 루프 없음</text>
  </g>
</svg>
