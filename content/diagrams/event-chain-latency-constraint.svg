<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -11 666 295.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 이벤트 사슬 -->
  <text x="330" y="20" text-anchor="middle" fill="var(--text, #727981)">이벤트 사슬</text>
  <path d="M140 36 V28 H520 V36" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 사슬이 거치는 곳 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="73">ECU 1</text>
    <text x="20" y="123">CAN 버스</text>
    <text x="20" y="173">ECU 2</text>
  </g>
  <rect x="140" y="56" width="120" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="260.75" y="106.75" width="118.5" height="22.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="380" y="156" width="140" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="260" y1="80" x2="260" y2="103" />
    <line x1="380" y1="130" x2="380" y2="153" />
  </g>

  <!-- 자극과 응답 -->
  <circle cx="140" cy="68" r="6" fill="var(--green, #337b47)" />
  <text x="146" y="50" font-size="12" fill="var(--text, #727981)">센서 샘플링</text>
  <circle cx="520" cy="168" r="6" fill="var(--green, #337b47)" />
  <text x="532" y="173" font-size="12" fill="var(--text, #727981)">액추에이터 접근</text>

  <!-- 시간 축과 지연 제약 -->
  <line x1="120" y1="206" x2="618" y2="206" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="626" y="210" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="140" y1="76" x2="140" y2="246" />
    <line x1="520" y1="176" x2="520" y2="246" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="112" y="226">자극</text>
    <text x="548" y="226">응답</text>
  </g>
  <line x1="142" y1="240" x2="518" y2="240" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="330" y="262" text-anchor="middle" font-size="12" fill="var(--text, #727981)">지연 제약(LatencyTimingConstraint)</text>
</svg>
