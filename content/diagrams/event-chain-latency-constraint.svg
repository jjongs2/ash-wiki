<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -10.5 520.5 295.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="event chain의 자극과 응답 사이 지연 제약">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- event chain -->
  <text x="262" y="20" text-anchor="middle" fill="var(--text, #727981)">event chain</text>
  <path d="M110 36 V28 H414 V36" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 사슬이 거치는 곳 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="73">ECU 1</text>
    <text x="20" y="123">CAN 버스</text>
    <text x="20" y="173">ECU 2</text>
  </g>
  <rect x="110" y="56" width="96" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="206.75" y="106.75" width="94.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="302" y="156" width="112" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="206" y1="80" x2="206" y2="103" />
    <line x1="302" y1="130" x2="302" y2="153" />
  </g>

  <!-- 자극과 응답 -->
  <circle cx="110" cy="68" r="6" fill="var(--green, #337b47)" />
  <text x="116" y="50" font-size="12" fill="var(--text, #727981)">센서 샘플링</text>
  <circle cx="414" cy="168" r="6" fill="var(--green, #337b47)" />
  <text x="426" y="173" font-size="12" fill="var(--text, #727981)">액추에이터 접근</text>

  <!-- 시간 축과 지연 제약 -->
  <line x1="90" y1="206" x2="470" y2="206" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="210" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="110" y1="76" x2="110" y2="246" />
    <line x1="414" y1="176" x2="414" y2="246" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="105" y="226" text-anchor="end">자극</text>
    <text x="419" y="226">응답</text>
  </g>
  <line x1="112" y1="240" x2="412" y2="240" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="262" y="262" text-anchor="middle" font-size="12" fill="var(--text, #727981)">지연 제약(LatencyTimingConstraint)</text>
</svg>
