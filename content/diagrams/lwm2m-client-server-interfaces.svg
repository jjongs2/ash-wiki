<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 508.75 372" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="LwM2M Client와 Server 사이의 인터페이스">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 구성 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="190" height="40" rx="2" />
    <rect x="20" y="150" width="120" height="222" rx="2" />
    <rect x="380" y="150" width="120" height="222" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="115" y="45">LwM2M Bootstrap-Server</text>
    <text x="80" y="259">LwM2M Client</text>
    <text x="80" y="277" font-size="12">장치에서 동작</text>
    <text x="440" y="266">LwM2M Server</text>
  </g>

  <path d="M388 150 V142 H508 V364 H500" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- Bootstrap -->
  <line x1="80" y1="60" x2="80" y2="148" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="90" y="100" fill="var(--text, #727981)">Bootstrap</text>
  <text x="90" y="116" font-size="12" fill="var(--text, #727981)">Server 등록에 필요한 정보</text>

  <!-- Client와 Server 사이 -->
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Client 하나가 Server 여럿에 등록 가능</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="140" y1="206" x2="378" y2="206" />
    <line x1="380" y1="278" x2="142" y2="278" />
    <line x1="380" y1="330" x2="142" y2="330" />
    <line x1="140" y1="362" x2="378" y2="362" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="260" y="198">Client Registration</text>
    <text x="260" y="254">Device Management and</text>
    <text x="260" y="270">Service Enablement</text>
    <text x="260" y="322">Information Reporting: Observe</text>
    <text x="260" y="354">Notify</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="260" y="222">Register, Update, De-register</text>
    <text x="260" y="294">Read, Write, Execute 등</text>
  </g>
</svg>
