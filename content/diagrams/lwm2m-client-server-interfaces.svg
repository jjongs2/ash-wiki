<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 830 350" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 구성 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="220" height="40" rx="2" />
    <rect x="20" y="150" width="220" height="200" rx="2" />
    <rect x="600" y="150" width="220" height="200" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="130" y="45">LwM2M Bootstrap-Server</text>
    <text x="130" y="248">LwM2M Client</text>
    <text x="130" y="266" font-size="12">장치에서 동작</text>
    <text x="710" y="248">LwM2M Server</text>
    <text x="710" y="266" font-size="12">Client 하나가 여럿에 등록 가능</text>
  </g>

  <path d="M608 150 V142 H828 V342 H820" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- Bootstrap -->
  <line x1="130" y1="60" x2="130" y2="148" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="140" y="100" fill="var(--text, #727981)">Bootstrap</text>
  <text x="140" y="116" font-size="12" fill="var(--text, #727981)">Server 등록에 필요한 정보</text>

  <!-- Client와 Server 사이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="240" y1="196" x2="598" y2="196" />
    <line x1="600" y1="252" x2="242" y2="252" />
    <line x1="600" y1="300" x2="242" y2="300" />
    <line x1="240" y1="330" x2="598" y2="330" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="420" y="188">Client Registration</text>
    <text x="420" y="244">Device Management and Service Enablement</text>
    <text x="420" y="292">Information Reporting: Observe</text>
    <text x="420" y="322">Notify</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="420" y="212">Register, Update, De-register</text>
    <text x="420" y="268">Read, Write, Execute 등</text>
  </g>
</svg>
