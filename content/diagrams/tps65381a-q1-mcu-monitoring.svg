<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 9.5 491 374" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="TPS65381A-Q1의 MCU 감시">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 칩 경계 -->
  <rect x="20" y="20" width="230" height="324" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="34" y="40" font-size="12" fill="var(--text, #727981)">TPS65381A-Q1</text>

  <!-- 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="56" width="170" height="32" rx="2" />
    <rect x="40" y="104" width="170" height="32" rx="2" />
    <rect x="40" y="152" width="170" height="32" rx="2" />
    <rect x="40" y="200" width="170" height="32" rx="2" />
    <rect x="40" y="248" width="170" height="32" rx="2" />
    <rect x="40" y="296" width="170" height="32" rx="2" />
    <rect x="400" y="56" width="90" height="224" rx="2" />
    <rect x="400" y="296" width="90" height="32" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="125" y="77">전원 출력</text>
    <text x="125" y="125">출력 전압 감시</text>
    <text x="125" y="173">watchdog</text>
    <text x="125" y="221">error 핀 감시</text>
    <text x="125" y="269">리셋 회로</text>
    <text x="125" y="317">enable 출력</text>
    <text x="445" y="173">MCU</text>
    <text x="445" y="317">출력단</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="210" y1="72" x2="398" y2="72" />
    <path d="M230 72 V120 H212" />
    <line x1="398" y1="168" x2="212" y2="168" />
    <line x1="398" y1="216" x2="212" y2="216" />
    <line x1="210" y1="264" x2="398" y2="264" />
    <line x1="210" y1="312" x2="398" y2="312" />
  </g>
  <circle cx="230" cy="72" r="3" fill="var(--ink, #727981)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="324" y="66">전원</text>
    <text x="324" y="162">트리거</text>
    <text x="324" y="210">error 핀</text>
    <text x="324" y="258">리셋</text>
    <text x="324" y="306">끔</text>
  </g>

  <text x="255" y="372" font-size="12" fill="var(--text, #727981)" text-anchor="middle">fault를 검출하면 enable 출력으로 출력단을 끄고 MCU를 리셋</text>
</svg>
