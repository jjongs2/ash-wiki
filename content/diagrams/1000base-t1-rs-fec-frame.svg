<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 530 134" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- FEC 인코더에 함께 넣는 비트 -->
  <path d="M20 44 V38 H380 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="200" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">FEC 인코더에 함께 넣음</text>

  <!-- 80B/81B 블록 45개 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="50" width="84" height="36" />
    <rect x="104" y="50" width="84" height="36" />
    <rect x="188" y="50" width="48" height="36" />
    <rect x="236" y="50" width="84" height="36" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="62" y="73">블록 1</text>
    <text x="146" y="73">블록 2</text>
    <text x="212" y="73">⋯</text>
    <text x="278" y="73">블록 45</text>
  </g>

  <!-- OAM, 패리티 -->
  <rect x="320.75" y="50.75" width="58.5" height="34.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <rect x="380.75" y="50.75" width="128.5" height="34.5" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="350" y="73">OAM</text>
    <text x="445" y="73">패리티</text>
  </g>

  <!-- 비트 수 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 92 V98 H318 V92" />
    <path d="M322 92 V98 H378 V92" />
    <path d="M382 92 V98 H510 V92" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="169" y="114">80B/81B 블록 45개</text>
    <text x="350" y="114">OAM 9비트</text>
    <text x="446" y="114">FEC 패리티 396비트</text>
  </g>
</svg>
