<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -5.5 546.5 186.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTFL 강의계획서</text>

  <!-- 수직선 -->
  <line x1="40" y1="90" x2="500" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M60 86 V94 M90 86 V94 M120 86 V94 M150 86 V94 M180 86 V94 M210 86 V94 M240 86 V94 M270 86 V94 M300 86 V94 M330 86 V94 M360 86 V94 M390 86 V94 M420 86 V94 M450 86 V94 M480 86 V94" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="508" y="94.5" fill="var(--text, #727981)">인시</text>

  <!-- 세 추정 -->
  <g fill="var(--ink, #727981)">
    <circle cx="90" cy="90" r="5" />
    <circle cx="180" cy="90" r="5" />
    <circle cx="450" cy="90" r="5" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="54">가장 낙관적</text>
    <text x="90" y="72">a = 6</text>
    <text x="180" y="54">가장 그럴듯함</text>
    <text x="180" y="72">m = 9</text>
    <text x="450" y="54">가장 비관적</text>
    <text x="450" y="72">b = 18</text>
  </g>

  <!-- 최종 추정 -->
  <path d="M150 112 V124 M150 118 H270 M270 112 V124" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <circle cx="210" cy="118" r="5" fill="var(--orange, #b0540d)" />
  <line x1="210" y1="95" x2="210" y2="113" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="144">E = 10, SD = 2</text>
    <text x="210" y="160">최종 추정 10±2인시</text>
  </g>
</svg>
