<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 -8.5 525 305" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 머리: 수준의 종류와 판 -->
