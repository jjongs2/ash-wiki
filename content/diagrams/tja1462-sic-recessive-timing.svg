<svg xmlns="http://www.w3.org/2000/svg" viewBox="55.5 15.5 690 244" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- TXD: low에서 high로 -->
  <path d="M200 70 H260 V40 H660" stroke="var(--ink, #727981)" stroke-width="3" />
  <g fill="var(--text, #727981)">
    <text x="190" y="59" text-anchor="end" font-size="14">TXD</text>
    <text x="230" y="62" text-anchor="middle">low</text>
    <text x="640" y="32" text-anchor="middle">high</text>
  </g>

  <!-- 기준 시각 -->
  <line x1="260" y1="40" x2="260" y2="196" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 각 단계가 시작하거나 끝나는 시간 범위 -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="309" y="90" width="35" height="20" />
    <rect x="508.5" y="124" width="87.5" height="20" />
  </g>
  <rect x="550.5" y="158" width="80.5" height="20" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="190" y="104" text-anchor="end">active recessive 시작</text>
    <text x="190" y="138" text-anchor="end">active recessive 끝</text>
    <text x="190" y="172" text-anchor="end">passive recessive 시작</text>
    <text x="352" y="104">70~120 ns</text>
    <text x="604" y="138">355~480 ns</text>
    <text x="639" y="172">415~530 ns</text>
  </g>

  <!-- 시간 축 -->
  <line x1="260" y1="196" x2="700" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="706" y="200" fill="var(--text, #727981)">시간</text>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="400" y="230">TXD가 low에서 high로 바뀐 때부터 (TJA1462 Normal 모드, 전원 전압 4.75~5.25 V)</text>
    <text x="400" y="250">active recessive 동안 CAN_H와 CAN_L의 입력 저항은 저마다 37.5~62.5 Ω</text>
  </g>
</svg>
