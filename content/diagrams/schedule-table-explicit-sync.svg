<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -6.5 518 221" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="65"><tspan x="20">synchronization</tspan><tspan x="20" dy="17">counter</tspan></text>
    <text x="20" y="155">schedule table</text>
  </g>

  <!-- synchronization counter -->
  <line x1="130" y1="70" x2="470" y2="70" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="166" y1="62" x2="166" y2="78" />
    <line x1="296" y1="62" x2="296" y2="78" />
    <line x1="426" y1="62" x2="426" y2="78" />
  </g>
  <line x1="150" y1="30" x2="150" y2="66" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="150" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">SyncScheduleTable</text>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="166" y1="78" x2="166" y2="178" />
    <line x1="296" y1="78" x2="296" y2="178" />
    <line x1="426" y1="78" x2="426" y2="150" />
  </g>

  <!-- schedule table -->
  <line x1="130" y1="150" x2="470" y2="150" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="154" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <circle cx="206" cy="150" r="5" />
    <circle cx="316" cy="150" r="5" />
    <circle cx="426" cy="150" r="5" />
  </g>
  <!-- 범례 -->
  <circle cx="385" cy="188" r="5" fill="var(--ink, #727981)" />
  <text x="395" y="192" font-size="12" fill="var(--text, #727981)">expiry point</text>

  <!-- 줄인 지연 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="208" y1="104" x2="314" y2="104" />
    <line x1="318" y1="104" x2="424" y2="104" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="261" y="96">줄인 지연</text>
    <text x="371" y="96">줄인 지연</text>
  </g>

  <!-- 편차 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="168" y1="172" x2="204" y2="172" />
    <line x1="298" y1="172" x2="314" y2="172" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="186" y="192">Δ</text>
    <text x="306" y="192">Δ</text>
  </g>
</svg>
