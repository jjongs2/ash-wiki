<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.5 -2.5 820 210" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="75">synchronization counter</text>
    <text x="20" y="155">schedule table</text>
  </g>

  <!-- synchronization counter -->
  <line x1="200" y1="70" x2="760" y2="70" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="260" y1="62" x2="260" y2="78" />
    <line x1="420" y1="62" x2="420" y2="78" />
    <line x1="580" y1="62" x2="580" y2="78" />
  </g>
  <line x1="220" y1="30" x2="220" y2="66" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="220" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">SyncScheduleTable</text>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="78" x2="260" y2="178" />
    <line x1="420" y1="78" x2="420" y2="178" />
    <line x1="580" y1="78" x2="580" y2="150" />
  </g>

  <!-- schedule table -->
  <line x1="200" y1="150" x2="760" y2="150" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="768" y="154" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <circle cx="320" cy="150" r="5" />
    <circle cx="450" cy="150" r="5" />
    <circle cx="580" cy="150" r="5" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="328" y="140">expiry point</text>
    <text x="458" y="140">expiry point</text>
    <text x="588" y="140">expiry point</text>
  </g>

  <!-- 줄인 지연 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="322" y1="104" x2="448" y2="104" />
    <line x1="452" y1="104" x2="578" y2="104" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="385" y="96">줄인 지연</text>
    <text x="515" y="96">줄인 지연</text>
  </g>

  <!-- 편차 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="262" y1="172" x2="318" y2="172" />
    <line x1="422" y1="172" x2="448" y2="172" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="290" y="192">Δ</text>
    <text x="435" y="192">Δ</text>
  </g>
</svg>
