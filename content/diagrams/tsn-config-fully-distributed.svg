<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 680 100" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 엔드 스테이션과 브리지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="30" width="100" height="36" rx="4" />
    <rect x="180" y="30" width="70" height="36" rx="4" />
    <rect x="300" y="30" width="70" height="36" rx="4" />
    <rect x="420" y="30" width="70" height="36" rx="4" />
    <rect x="560" y="30" width="100" height="36" rx="4" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="53">talker</text>
    <text x="215" y="53">브리지</text>
    <text x="335" y="53">브리지</text>
    <text x="455" y="53">브리지</text>
    <text x="610" y="53">listener</text>
  </g>

  <!-- UNI -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)">
    <line x1="122" y1="48" x2="178" y2="48" />
    <line x1="492" y1="48" x2="558" y2="48" />
  </g>

  <!-- 브리지끼리의 설정 정보 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="252" y1="48" x2="298" y2="48" />
    <line x1="372" y1="48" x2="418" y2="48" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="40">UNI</text>
    <text x="525" y="40">UNI</text>
    <text x="335" y="90">브리지를 따라 설정 정보가 퍼짐</text>
  </g>
</svg>
