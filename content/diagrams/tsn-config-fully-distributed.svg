<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 524 100" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 엔드 스테이션과 브리지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="30" width="70" height="36" rx="2" />
    <rect x="138" y="30" width="56" height="36" rx="2" />
    <rect x="234" y="30" width="56" height="36" rx="2" />
    <rect x="330" y="30" width="56" height="36" rx="2" />
    <rect x="434" y="30" width="70" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="53">talker</text>
    <text x="166" y="53">브리지</text>
    <text x="262" y="53">브리지</text>
    <text x="358" y="53">브리지</text>
    <text x="469" y="53">listener</text>
  </g>

  <!-- UNI -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)">
    <line x1="92" y1="48" x2="136" y2="48" />
    <line x1="388" y1="48" x2="432" y2="48" />
  </g>

  <!-- 브리지끼리의 설정 정보 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="196" y1="48" x2="232" y2="48" />
    <line x1="292" y1="48" x2="328" y2="48" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="114" y="40">UNI</text>
    <text x="410" y="40">UNI</text>
    <text x="262" y="90">브리지를 따라 설정 정보가 퍼짐</text>
  </g>
</svg>
