<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 4.5 598 160" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 열 제목 -->
  <text x="140" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">OSI 참조 모델</text>

  <!-- OSI 아래 두 계층 -->
  <rect x="40" y="40" width="200" height="74" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="82" text-anchor="middle" fill="var(--text, #727981)">데이터 링크 계층</text>
  <rect x="40" y="120" width="200" height="34" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="142" text-anchor="middle" fill="var(--text, #727981)">물리 계층</text>

  <!-- IEEE 802.3 쪽 계층 -->
  <rect x="280" y="40" width="220" height="34" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="390" y="62" text-anchor="middle" fill="var(--text, #727981)">LLC 또는 다른 MAC 클라이언트</text>
  <rect x="280.75" y="80.75" width="218.5" height="32.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="390" y="102" text-anchor="middle" fill="var(--on-fill, #f8fafd)">MAC 부계층</text>
  <rect x="280.75" y="120.75" width="218.5" height="32.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="390" y="142" text-anchor="middle" fill="var(--on-fill, #f8fafd)">물리 계층</text>

  <!-- IEEE 802.3이 정하는 범위 -->
  <path d="M510 81 H516 V153 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="524" y="121" font-size="12" fill="var(--text, #727981)">IEEE 802.3-2022</text>
</svg>
