<svg xmlns="http://www.w3.org/2000/svg" viewBox="50.5 13 400.5 224.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="다중 노출 HDR과 부분 픽셀 둘">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 다중 노출 HDR -->
  <text x="60" y="34" fill="var(--text, #727981)">onsemi 백서에 따른 다중 노출 HDR: 노출을 차례로 찍는다</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="46" width="180" height="28" />
    <rect x="330" y="46" width="70" height="28" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="230" y="64">긴 노출</text>
    <text x="365" y="64">짧은 노출</text>
  </g>

  <!-- 부분 픽셀 둘 -->
  <text x="60" y="112" fill="var(--text, #727981)">부분 픽셀 둘: 두 신호를 동시에 얻는다</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="124" width="260" height="28" />
    <rect x="140" y="160" width="260" height="28" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="270" y="142">감도가 높은 부분 픽셀</text>
    <text x="270" y="178">잘 포화하지 않는 부분 픽셀</text>
  </g>

  <!-- 시간 축 -->
  <line x1="120" y1="208" x2="440" y2="208" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="440" y="226" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
