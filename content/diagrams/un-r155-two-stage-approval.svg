<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 724 240" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="CSMS 적합 인증서와 차량 형식 승인의 두 단계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 -->
  <g text-anchor="middle" fill="var(--text, #727981)" font-weight="600">
    <text x="188" y="26">1단계</text>
    <text x="584" y="26">2단계</text>
  </g>
  <rect x="20" y="36" width="336" height="184" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 1단계: CSMS 적합 인증서 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="36" y="104" width="130" height="48" rx="2" />
    <rect x="210" y="104" width="130" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="101" y="124">승인 당국의</text>
    <text x="101" y="141">CSMS 평가</text>
    <text x="275" y="124">CSMS</text>
    <text x="275" y="141">적합 인증서</text>
  </g>

  <!-- 2단계: 차량 형식 승인 -->
  <rect x="464" y="36" width="240" height="184" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="584" y="58">차량 형식 승인</text>
    <text x="584" y="75" font-size="12">승인 당국이나 기술 기관이 확인</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="478" y="86" width="212" height="62" rx="2" />
    <rect x="478" y="158" width="212" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="584" y="105" font-weight="600">문서 검토</text>
    <text x="584" y="122" font-size="12">리스크 평가와 완화 조치의 문서,</text>
    <text x="584" y="139" font-size="12">사이버 공격 탐지·대응 조치</text>
    <text x="584" y="177" font-weight="600">차량 시험</text>
    <text x="584" y="194" font-size="12">문서로 남긴 보안 조치의 구현</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="166" y1="128" x2="208" y2="128" />
    <line x1="340" y1="128" x2="462" y2="128" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="410" y="102">유효한 인증서로</text>
    <text x="410" y="118">신청</text>
  </g>
</svg>
