<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 202" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 멈추는 태스크 A와 그 스택 -->
  <text x="95" y="30" text-anchor="middle" fill="var(--text, #727981)">멈추는 태스크 A</text>
  <text x="95" y="50" text-anchor="middle" font-size="12" fill="var(--text, #727981)">태스크 A의 스택</text>
  <rect x="20.75" y="80.75" width="148.5" height="48.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="95" y="110" text-anchor="middle" fill="var(--on-fill, #f8fafd)">저장한 A의 context</text>
  <rect x="20.75" y="134.75" width="148.5" height="48.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="164" text-anchor="middle" fill="var(--text, #727981)">…</text>

  <!-- 프로세서 레지스터 -->
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="var(--text, #727981)">프로세서</text>
  <rect x="240.75" y="80.75" width="138.5" height="48.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="310" y="110" text-anchor="middle" fill="var(--on-fill, #f8fafd)">레지스터</text>

  <!-- 재개하는 태스크 B와 그 스택 -->
  <text x="525" y="30" text-anchor="middle" fill="var(--text, #727981)">재개하는 태스크 B</text>
  <text x="525" y="50" text-anchor="middle" font-size="12" fill="var(--text, #727981)">태스크 B의 스택</text>
  <rect x="450.75" y="80.75" width="148.5" height="48.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="525" y="110" text-anchor="middle" fill="var(--on-fill, #f8fafd)">저장해 둔 B의 context</text>
  <rect x="450.75" y="134.75" width="148.5" height="48.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="525" y="164" text-anchor="middle" fill="var(--text, #727981)">…</text>

  <!-- 저장과 복원 -->
  <line x1="238" y1="105" x2="173" y2="105" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="205" y="96" text-anchor="middle" font-size="12" fill="var(--text, #727981)">① push</text>
  <text x="205" y="124" text-anchor="middle" font-size="12" fill="var(--text, #727981)">저장</text>
  <line x1="448" y1="105" x2="383" y2="105" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="415" y="96" text-anchor="middle" font-size="12" fill="var(--text, #727981)">② pop</text>
  <text x="415" y="124" text-anchor="middle" font-size="12" fill="var(--text, #727981)">복원</text>
</svg>
