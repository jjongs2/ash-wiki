<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.5 -11.5 509 352" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 전역 시간이 생긴 시점 -->
  <text x="223" y="18" text-anchor="middle" font-size="12" fill="var(--text, #727981)">전역 시간이 생김</text>
  <line x1="223" y1="26" x2="223" y2="248" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 전역 시간의 디스패처 라운드 시작 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="241" y1="36" x2="241" y2="248" />
    <line x1="313" y1="36" x2="313" y2="248" />
    <line x1="385" y1="36" x2="385" y2="248" />
    <line x1="457" y1="36" x2="457" y2="248" />
    <line x1="529" y1="36" x2="529" y2="248" />
  </g>

  <!-- 행 이름 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="61" y="52">동기 시작</text>
    <text x="61" y="120">비동기 시작(hard 동기화)</text>
    <text x="61" y="214">비동기 시작(smooth 동기화)</text>
  </g>

  <!-- 디스패처 라운드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="241" y="62" width="72" height="24" />
    <rect x="313" y="62" width="72" height="24" />
    <rect x="385" y="62" width="72" height="24" />
    <rect x="457" y="62" width="72" height="24" />

    <rect x="61" y="130" width="72" height="24" />
    <rect x="133" y="130" width="72" height="24" />
    <rect x="205" y="130" width="72" height="24" />
    <rect x="313" y="130" width="72" height="24" />
    <rect x="385" y="130" width="72" height="24" />
    <rect x="457" y="130" width="72" height="24" />

    <rect x="61" y="224" width="72" height="24" />
    <rect x="133" y="224" width="72" height="24" />
    <rect x="205" y="224" width="72" height="24" />
    <rect x="289" y="224" width="72" height="24" />
    <rect x="373" y="224" width="72" height="24" />
    <rect x="457" y="224" width="72" height="24" />
  </g>
  <text x="151" y="78" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TT 태스크를 실행하지 않음</text>

  <!-- 늦춤 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="295" y1="172" x2="295" y2="157" marker-end="url(#arrow)" />
    <line x1="283" y1="266" x2="283" y2="251" marker-end="url(#arrow)" />
    <line x1="367" y1="266" x2="367" y2="251" marker-end="url(#arrow)" />
    <line x1="451" y1="266" x2="451" y2="251" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="295" y="188">늦춤</text>
    <text x="367" y="282">구성 값 이하로 늦춤</text>
  </g>

  <!-- 범례 -->
  <rect x="61" y="304" width="30" height="16" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="99" y="316" font-size="12" fill="var(--text, #727981)">디스패처 라운드</text>
  <line x1="220" y1="312" x2="250" y2="312" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="258" y="316" font-size="12" fill="var(--text, #727981)">전역 시간의 디스패처 라운드 시작</text>
</svg>
