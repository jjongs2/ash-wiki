<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -5.5 519.5 230.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTFL·CTAL-TA 강의계획서</text>

  <!-- 표 제목 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="162" y="56">전체 결정 테이블</text>
    <text x="446" y="56">최소화한 결정 테이블</text>
  </g>

  <!-- 행 이름 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="80" y="84">규칙</text>
    <text x="80" y="111.5">조건 1</text>
    <text x="80" y="139.5">조건 2</text>
    <text x="80" y="167.5">동작</text>
    <text x="382" y="84">규칙</text>
    <text x="382" y="111.5">조건 1</text>
    <text x="382" y="139.5">조건 2</text>
    <text x="382" y="167.5">동작</text>
  </g>

  <!-- 규칙 번호 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="108" y="84">1</text>
    <text x="144" y="84">2</text>
    <text x="180" y="84">3</text>
    <text x="216" y="84">4</text>
    <text x="410" y="84">1·2</text>
    <text x="446" y="84">3</text>
    <text x="482" y="84">4</text>
  </g>

  <!-- 합치지 않는 규칙 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="162" y="96" width="36" height="28" />
    <rect x="198" y="96" width="36" height="28" />
    <rect x="162" y="124" width="36" height="28" />
    <rect x="198" y="124" width="36" height="28" />
    <rect x="162" y="152" width="36" height="28" />
    <rect x="198" y="152" width="36" height="28" />
    <rect x="428" y="96" width="36" height="28" />
    <rect x="464" y="96" width="36" height="28" />
    <rect x="428" y="124" width="36" height="28" />
    <rect x="464" y="124" width="36" height="28" />
    <rect x="428" y="152" width="36" height="28" />
    <rect x="464" y="152" width="36" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="114.5">F</text>
    <text x="216" y="114.5">F</text>
    <text x="180" y="142.5">T</text>
    <text x="216" y="142.5">F</text>
    <text x="216" y="170.5">X</text>
    <text x="446" y="114.5">F</text>
    <text x="482" y="114.5">F</text>
    <text x="446" y="142.5">T</text>
    <text x="482" y="142.5">F</text>
    <text x="482" y="170.5">X</text>
  </g>

  <!-- 합치는 규칙 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="90" y="96" width="36" height="28" />
    <rect x="126" y="96" width="36" height="28" />
    <rect x="90" y="124" width="36" height="28" />
    <rect x="126" y="124" width="36" height="28" />
    <rect x="90" y="152" width="36" height="28" />
    <rect x="126" y="152" width="36" height="28" />
    <rect x="392" y="96" width="36" height="28" />
    <rect x="392" y="124" width="36" height="28" />
    <rect x="392" y="152" width="36" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="108" y="114.5">T</text>
    <text x="144" y="114.5">T</text>
    <text x="108" y="142.5">T</text>
    <text x="144" y="142.5">F</text>
    <text x="108" y="170.5">X</text>
    <text x="144" y="170.5">X</text>
    <text x="410" y="114.5">T</text>
    <text x="410" y="142.5">–</text>
    <text x="410" y="170.5">X</text>
  </g>

  <!-- 합침 -->
  <line x1="250" y1="138" x2="336" y2="138" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 설명 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="126" y="204">동작이 같고 조건 2만 다름</text>
    <text x="410" y="204">조건 2를 –로</text>
  </g>
</svg>
