<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -7 539.5 208" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">CMSIS-RTOS2 메모리 풀</text>

  <!-- 빈 블록 리스트 -->
  <text x="20" y="96" font-size="12" fill="var(--text, #727981)">빈 블록 리스트</text>
  <line x1="106" y1="92" x2="158" y2="92" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M202 74 C202 46 300 46 300 72" marker-end="url(#arrow)" />
    <path d="M322 74 C322 46 420 46 420 72" marker-end="url(#arrow)" />
    <path d="M442 74 C442 52 480 52 480 72" marker-end="url(#arrow)" />
  </g>

  <!-- 크기가 같은 블록 -->
  <g stroke-width="1.5">
    <rect x="160.75" y="76.75" width="60" height="30.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" />
    <rect x="220.75" y="76.75" width="60" height="30.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="280.75" y="76.75" width="60" height="30.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" />
    <rect x="340.75" y="76.75" width="60" height="30.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="400.75" y="76.75" width="60" height="30.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" />
    <rect x="460.75" y="76.75" width="58.5" height="30.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" />
  </g>
  <g font-size="12" text-anchor="middle">
    <g fill="var(--on-fill, #f8fafd)">
      <text x="191" y="96">빈</text>
      <text x="311" y="96">빈</text>
      <text x="431" y="96">빈</text>
      <text x="490" y="96">빈</text>
    </g>
    <g fill="var(--text, #727981)">
      <text x="251" y="96">사용 중</text>
      <text x="371" y="96">사용 중</text>
    </g>
  </g>

  <!-- 할당과 해제 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="190" y1="110" x2="190" y2="146" marker-end="url(#arrow)" />
    <line x1="370" y1="146" x2="370" y2="110" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="164">osMemoryPoolAlloc</text>
    <text x="190" y="180">리스트에서 떼어 넘김</text>
    <text x="370" y="164">osMemoryPoolFree</text>
    <text x="370" y="180">리스트에 다시 이음</text>
  </g>
</svg>
