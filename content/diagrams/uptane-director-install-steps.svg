<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 410" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Director repository -->
  <rect x="250" y="20" width="540" height="370" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="266" y="44" fill="var(--text, #727981)">Director repository</text>

  <!-- Primary ECU, 인벤토리 데이터베이스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="64" width="90" height="306" rx="2" />
    <rect x="630" y="114" width="140" height="100" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="221.5">Primary ECU</text>
    <text x="700" y="160">인벤토리</text>
    <text x="700" y="178">데이터베이스</text>
  </g>

  <!-- 여섯 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="270" y="64" width="320" height="36" rx="2" />
    <rect x="270" y="114" width="320" height="36" rx="2" />
    <rect x="270" y="164" width="320" height="50" rx="2" />
    <rect x="270" y="228" width="320" height="50" rx="2" />
    <rect x="270" y="292" width="320" height="28" rx="2" />
    <rect x="270" y="334" width="320" height="36" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="284" y="86">1. 차량을 식별</text>
    <text x="284" y="136">2. 데이터베이스에서 그 차량의 ECU 정보를 찾음</text>
    <text x="284" y="185">3. 차량 버전 매니페스트가 데이터베이스와</text>
    <text x="298" y="201">맞는지 검사</text>
    <text x="284" y="249">4. 설치된 이미지 정보로 설치할 이미지 묶음을 정함</text>
    <text x="298" y="265">이미지 사이의 의존성과 충돌을 고려</text>
    <text x="284" y="310">5. 필요하면 이미지를 암호화</text>
    <text x="284" y="356">6. 묶음을 나타내는 메타데이터를 만들어 보냄</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="430" y1="100" x2="430" y2="112" />
    <line x1="430" y1="150" x2="430" y2="162" />
    <line x1="430" y1="214" x2="430" y2="226" />
    <line x1="430" y1="278" x2="430" y2="290" />
    <line x1="430" y1="320" x2="430" y2="332" />
    <line x1="110" y1="82" x2="268" y2="82" />
    <line x1="270" y1="352" x2="112" y2="352" />
    <line x1="630" y1="132" x2="592" y2="132" />
    <line x1="630" y1="189" x2="592" y2="189" />
  </g>
  <g font-size="12" text-anchor="end" fill="var(--text, #727981)">
    <text x="240" y="74">차량 버전 매니페스트</text>
    <text x="240" y="328">Targets, Snapshot,</text>
    <text x="240" y="344">Timestamp 메타데이터</text>
  </g>
</svg>
