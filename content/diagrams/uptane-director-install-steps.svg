<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 498" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Director repository -->
  <rect x="70" y="100" width="430" height="378" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="86" y="124" fill="var(--text, #727981)">Director repository</text>

  <!-- Primary ECU, 인벤토리 데이터베이스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="480" height="36" rx="2" />
    <rect x="390" y="186" width="92" height="100" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="43">Primary ECU</text>
    <text x="436" y="232">인벤토리</text>
    <text x="436" y="250">데이터베이스</text>
  </g>

  <!-- 여섯 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="90" y="136" width="284" height="36" rx="2" />
    <rect x="90" y="186" width="284" height="36" rx="2" />
    <rect x="90" y="236" width="284" height="50" rx="2" />
    <rect x="90" y="300" width="284" height="66" rx="2" />
    <rect x="90" y="380" width="284" height="28" rx="2" />
    <rect x="90" y="422" width="284" height="36" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="104" y="158">1. 차량을 식별</text>
    <text x="104" y="208">2. 데이터베이스에서 그 차량의 ECU 정보를 찾음</text>
    <text x="104" y="257">3. 차량 버전 매니페스트가 데이터베이스와</text>
    <text x="118" y="273">맞는지 검사</text>
    <text x="104" y="321">4. 설치된 이미지 정보로 설치할</text>
    <text x="118" y="337">이미지 묶음을 정함</text>
    <text x="118" y="353">이미지 사이의 의존성과 충돌을 고려</text>
    <text x="104" y="398">5. 필요하면 이미지를 암호화</text>
    <text x="104" y="444">6. 묶음을 나타내는 메타데이터를 만들어 보냄</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="232" y1="58" x2="232" y2="134" />
    <line x1="232" y1="172" x2="232" y2="184" />
    <line x1="232" y1="222" x2="232" y2="234" />
    <line x1="232" y1="286" x2="232" y2="298" />
    <line x1="232" y1="366" x2="232" y2="378" />
    <line x1="232" y1="408" x2="232" y2="420" />
    <path d="M90 440 H45 V58" />
    <line x1="390" y1="204" x2="376" y2="204" />
    <line x1="390" y1="261" x2="376" y2="261" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="240" y="84">차량 버전 매니페스트</text>
    <text x="53" y="76">Targets, Snapshot,</text>
    <text x="53" y="92">Timestamp 메타데이터</text>
  </g>
</svg>
