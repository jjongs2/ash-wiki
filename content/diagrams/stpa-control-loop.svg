<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 10 268 180" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 제어기와 피제어 프로세스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150.75" y="20.75" width="238.5" height="46.5" rx="2" />
    <rect x="150.75" y="150.75" width="238.5" height="28.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="270" y="39" font-size="13">제어기</text>
    <text x="270" y="57">목표를 이루려고 결정</text>
    <text x="270" y="169" font-size="13">피제어 프로세스</text>
  </g>

  <!-- 제어 동작과 피드백 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="68" x2="200" y2="149" />
    <line x1="340" y1="150" x2="340" y2="69" />
  </g>
  <text x="190" y="114" font-size="13" text-anchor="end" fill="var(--text, #727981)">제어 동작</text>
  <text x="350" y="114" font-size="13" fill="var(--text, #727981)">피드백</text>
</svg>
