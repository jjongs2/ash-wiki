<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 710.5 293" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="46">ECU Abstraction Layer</text>
    <text x="20" y="106">MCAL</text>
    <text x="20" y="184">마이크로컨트롤러</text>
    <text x="20" y="262">마이크로컨트롤러 밖</text>
  </g>

  <!-- 행 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="72" x2="690" y2="72" />
    <line x1="20" y1="132" x2="690" y2="132" />
  </g>

  <!-- 마이크로컨트롤러 -->
  <rect x="200" y="146" width="490" height="68" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 드라이버와 장치 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="200" y="24" width="150" height="36" rx="2" />
    <rect x="200" y="84" width="150" height="36" rx="2" />
    <rect x="370" y="84" width="150" height="36" rx="2" />
    <rect x="540" y="84" width="150" height="36" rx="2" />
    <rect x="370" y="162" width="150" height="36" rx="2" />
    <rect x="200" y="240" width="150" height="36" rx="2" />
    <rect x="540" y="240" width="150" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="275" y="46.5">외부 EEPROM 드라이버</text>
    <text x="275" y="106.5">SPI Handler Driver</text>
    <text x="445" y="106.5">내부 EEPROM 드라이버</text>
    <text x="615" y="106.5">외부 플래시 드라이버</text>
    <text x="445" y="184.5">내부 EEPROM</text>
    <text x="275" y="262.5">외부 EEPROM</text>
    <text x="615" y="262.5">외부 플래시</text>
  </g>

  <!-- 접근 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="275" y1="60" x2="275" y2="83" />
    <line x1="275" y1="120" x2="275" y2="239" />
    <line x1="445" y1="120" x2="445" y2="161" />
    <line x1="615" y1="120" x2="615" y2="239" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="283" y="232">SPI</text>
    <text x="623" y="232">메모리 맵</text>
  </g>
</svg>
