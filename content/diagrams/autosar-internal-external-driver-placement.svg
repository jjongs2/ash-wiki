<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 497 314" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="38.5">ECU Abstraction</text>
    <text x="20" y="54.5">Layer</text>
    <text x="20" y="118.5">MCAL</text>
    <text x="20" y="202.5">마이크로컨트롤러</text>
    <text x="20" y="272.5">마이크로컨트롤러</text>
    <text x="20" y="288.5">밖</text>
  </g>

  <!-- 행 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="78" x2="476" y2="78" />
    <line x1="20" y1="150" x2="476" y2="150" />
  </g>

  <!-- 마이크로컨트롤러 -->
  <rect x="136" y="164" width="340" height="68" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 드라이버와 장치 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="136" y="20" width="104" height="44" rx="2" />
    <rect x="136" y="92" width="104" height="44" rx="2" />
    <rect x="254" y="92" width="104" height="44" rx="2" />
    <rect x="372" y="92" width="104" height="44" rx="2" />
    <rect x="254" y="180" width="104" height="36" rx="2" />
    <rect x="136" y="258" width="104" height="36" rx="2" />
    <rect x="372" y="258" width="104" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="188" y="38.5">외부 EEPROM</text>
    <text x="188" y="54.5">드라이버</text>
    <text x="188" y="110.5">SPI Handler</text>
    <text x="188" y="126.5">Driver</text>
    <text x="306" y="110.5">내부 EEPROM</text>
    <text x="306" y="126.5">드라이버</text>
    <text x="424" y="110.5">외부 플래시</text>
    <text x="424" y="126.5">드라이버</text>
    <text x="306" y="202.5">내부 EEPROM</text>
    <text x="188" y="280.5">외부 EEPROM</text>
    <text x="424" y="280.5">외부 플래시</text>
  </g>

  <!-- 접근 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="188" y1="64" x2="188" y2="91" />
    <line x1="188" y1="136" x2="188" y2="257" />
    <line x1="306" y1="136" x2="306" y2="179" />
    <line x1="424" y1="136" x2="424" y2="257" />
  </g>
  <g font-size="12" text-anchor="end" fill="var(--text, #727981)">
    <text x="180" y="250">SPI</text>
    <text x="416" y="250">메모리 맵</text>
  </g>
</svg>
