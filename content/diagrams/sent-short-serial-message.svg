<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 4.5 542.5 220" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 메시지 16개 -->
  <text x="330" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">연속한 SENT 메시지 16개</text>
  <line x1="92" y1="36" x2="568" y2="36" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="105" y="58">1</text>
    <text x="555" y="58">16</text>
  </g>

  <!-- 행 이름 -->
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="78" y="85.5">비트 3</text>
    <text x="78" y="121.5">비트 2</text>
  </g>

  <!-- 비트 3: 첫 메시지만 1 -->
  <rect x="90" y="66" width="30" height="30" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="105" y="86" text-anchor="middle" fill="var(--text, #727981)">1</text>
  <text x="130" y="85.5" font-size="12" fill="var(--text, #727981)">시작을 알린다</text>

  <!-- 비트 2: 메시지마다 1비트 -->
  <rect x="90" y="102" width="480" height="30" fill="var(--surface, none)" />
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="120" y1="102" x2="120" y2="132" />
    <line x1="150" y1="102" x2="150" y2="132" />
    <line x1="180" y1="102" x2="180" y2="132" />
    <line x1="240" y1="102" x2="240" y2="132" />
    <line x1="270" y1="102" x2="270" y2="132" />
    <line x1="300" y1="102" x2="300" y2="132" />
    <line x1="330" y1="102" x2="330" y2="132" />
    <line x1="360" y1="102" x2="360" y2="132" />
    <line x1="390" y1="102" x2="390" y2="132" />
    <line x1="420" y1="102" x2="420" y2="132" />
    <line x1="480" y1="102" x2="480" y2="132" />
    <line x1="510" y1="102" x2="510" y2="132" />
    <line x1="540" y1="102" x2="540" y2="132" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="90" y="102" width="120" height="30" />
    <rect x="210" y="102" width="240" height="30" />
    <rect x="450" y="102" width="120" height="30" />
  </g>

  <!-- 필드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M92 140 V146 H208 V140" />
    <path d="M212 140 V146 H448 V140" />
    <path d="M452 140 V146 H568 V140" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="150" y="166">메시지 식별자</text>
    <text x="150" y="182">4비트</text>
    <text x="330" y="166">데이터</text>
    <text x="330" y="182">8비트</text>
    <text x="510" y="166">CRC</text>
    <text x="510" y="182">4비트</text>
  </g>

  <text x="330" y="212" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NXP 앱노트에 따른 short serial message. 두 행은 상태·통신 니블의 비트다.</text>
</svg>
