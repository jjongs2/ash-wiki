    <text x="726" y="44">FCS</text>
  </g>

  <!-- LLC와 SNAP 헤더 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M318 96 V88 H598 V96" />
    <path d="M318 124 V116 H458 V124" />
    <path d="M462 124 V116 H598 V124" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
