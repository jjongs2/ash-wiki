<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 532 330" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- RFC 894 -->
  <text x="20" y="32" fill="var(--text, #727981)">RFC 894</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="70" height="40" />
    <rect x="94" y="40" width="70" height="40" />
    <rect x="168" y="40" width="62" height="40" />
    <rect x="234" y="40" width="232" height="40" />
    <rect x="470" y="40" width="42" height="40" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="64">목적지 주소</text>
    <text x="129" y="64">출발지 주소</text>
    <text x="199" y="56">길이/타입</text>
    <text x="199" y="72">0x0800</text>
    <text x="350" y="56">IP 데이터그램</text>
    <text x="350" y="72">MTU 1500</text>
    <text x="491" y="64">FCS</text>
  </g>

  <!-- RFC 1042 -->
  <text x="20" y="108" fill="var(--text, #727981)">RFC 1042</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="116" width="70" height="40" />
    <rect x="94" y="116" width="70" height="40" />
    <rect x="168" y="116" width="62" height="40" />
    <rect x="350" y="116" width="116" height="40" />
    <rect x="470" y="116" width="42" height="40" />
  </g>
  <rect x="234" y="116" width="112" height="40" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="140">목적지 주소</text>
    <text x="129" y="140">출발지 주소</text>
    <text x="199" y="140">길이/타입</text>
    <text x="408" y="132">IP 데이터그램</text>
    <text x="408" y="148">MTU 1492</text>
    <text x="491" y="140">FCS</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="290" y="132">LLC·SNAP 헤더</text>
    <text x="290" y="148">8옥텟</text>
  </g>

  <!-- LLC·SNAP 헤더를 펼친 줄 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="234" y1="157" x2="112" y2="195" />
    <line x1="346" y1="157" x2="468" y2="195" />
  </g>
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="112" y="196" width="64" height="40" />
    <rect x="180" y="196" width="64" height="40" />
    <rect x="248" y="196" width="52" height="40" />
    <rect x="304" y="196" width="76" height="40" />
    <rect x="384" y="196" width="84" height="40" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="144" y="212">DSAP</text>
    <text x="144" y="228">170</text>
    <text x="212" y="212">SSAP</text>
    <text x="212" y="228">170</text>
    <text x="274" y="212">제어</text>
    <text x="274" y="228">3</text>
    <text x="342" y="212">조직 코드</text>
    <text x="342" y="228">0</text>
    <text x="426" y="220">EtherType</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="342" y="252">24비트</text>
    <text x="426" y="252">16비트</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M112 258 V266 H300 V258" />
    <path d="M304 258 V266 H468 V258" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="206" y="282">LLC</text>
    <text x="386" y="282">SNAP</text>
  </g>

  <text x="20" y="310" fill="var(--text, #727981)">칸의 폭은 길이에 비례하지 않는다.</text>
</svg>
