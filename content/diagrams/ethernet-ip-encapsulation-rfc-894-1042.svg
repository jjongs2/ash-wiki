    <text x="388" y="108">LLC</text>
    <text x="530" y="108">SNAP</text>
  </g>

  <!-- RFC 1042 -->
  <text x="20" y="156" fill="var(--text, #727981)">RFC 1042</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="132" width="72" height="40" rx="4" />
    <rect x="176" y="132" width="72" height="40" rx="4" />
    <rect x="252" y="132" width="62" height="40" rx="4" />
    <rect x="602" y="132" width="100" height="40" rx="4" />
    <rect x="706" y="132" width="40" height="40" rx="4" />
  </g>
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="318" y="132" width="46" height="40" rx="4" />
    <rect x="368" y="132" width="46" height="40" rx="4" />
    <rect x="418" y="132" width="40" height="40" rx="4" />
    <rect x="462" y="132" width="62" height="40" rx="4" />
    <rect x="528" y="132" width="70" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="136" y="156">목적지 주소</text>
    <text x="212" y="156">출발지 주소</text>
    <text x="283" y="156">길이/타입</text>
    <text x="652" y="148">IP 데이터그램</text>
    <text x="652" y="164">MTU 1492</text>
    <text x="726" y="156">FCS</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="341" y="148">DSAP</text>
    <text x="341" y="164">170</text>
    <text x="391" y="148">SSAP</text>
    <text x="391" y="164">170</text>
    <text x="438" y="148">제어</text>
    <text x="438" y="164">3</text>
    <text x="493" y="148">조직 코드</text>
    <text x="493" y="164">0</text>
    <text x="563" y="156">EtherType</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="493" y="190">24비트</text>
    <text x="563" y="190">16비트</text>
  </g>

  <text x="20" y="214" fill="var(--text, #727981)">칸의 폭은 길이에 비례하지 않는다.</text>
</svg>
