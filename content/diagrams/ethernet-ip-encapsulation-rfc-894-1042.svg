<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -0.5 766 235.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- RFC 894 -->
  <text x="20" y="44" fill="var(--text, #727981)">RFC 894</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="20" width="72" height="40" rx="4" />
    <rect x="176" y="20" width="72" height="40" rx="4" />
    <rect x="252" y="20" width="62" height="40" rx="4" />
    <rect x="318" y="20" width="384" height="40" rx="4" />
    <rect x="706" y="20" width="40" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="136" y="44">목적지 주소</text>
    <text x="212" y="44">출발지 주소</text>
    <text x="283" y="36">길이/타입</text>
