<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 182.5 371.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 간선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="40" x2="100" y2="80" />
    <line x1="106.4" y1="97.7" x2="143.6" y2="142.3" />
    <line x1="100" y1="100" x2="100" y2="200" />
    <line x1="143.6" y1="157.7" x2="106.4" y2="202.3" />
    <line x1="106.4" y1="217.7" x2="143.6" y2="262.3" />
    <line x1="100" y1="220" x2="100" y2="320" />
    <line x1="143.6" y1="277.7" x2="106.4" y2="322.3" />
  </g>

  <!-- 가상 간선: 출구 노드에서 입구 노드로 -->
  <path d="M90 330 H20 V30 H90" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />

  <!-- 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="100" cy="30" r="10" />
    <circle cx="150" cy="150" r="10" />
    <circle cx="150" cy="270" r="10" />
    <circle cx="100" cy="330" r="10" />
  </g>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <circle cx="100" cy="90" r="10" />
    <circle cx="100" cy="210" r="10" />
  </g>

  <!-- 라벨 -->
  <g fill="var(--text, #727981)">
    <text x="118" y="34">입구 노드</text>
    <text x="118" y="334">출구 노드</text>
    <text x="84" y="94" text-anchor="end">판정 노드</text>
    <text x="84" y="214" text-anchor="end">판정 노드</text>
    <text x="55" y="350" text-anchor="middle">가상 간선</text>
  </g>
</svg>
