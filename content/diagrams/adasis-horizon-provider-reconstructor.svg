<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 540 161" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="ADASIS Horizon Provider와 Reconstructor">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 지도와 AHP -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="70.75" width="58.5" height="30.5" rx="2" />
    <rect x="110.75" y="62.75" width="138.5" height="46.5" rx="2" />
    <rect x="352.75" y="62.75" width="154.5" height="46.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="50" y="90.5">지도</text>
    <text x="180" y="81">AHP</text>
    <text x="180" y="98" font-size="11">경로 계산, map matching</text>
    <text x="430" y="81">AHR</text>
    <text x="430" y="98" font-size="11">Horizon 사본을 다시 만듦</text>
  </g>

  <!-- 응용: AHR을 담는 틀 -->
  <rect x="340.75" y="36.75" width="178.5" height="86.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="352" y="54" fill="var(--text, #727981)">응용</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="86" x2="109" y2="86" marker-end="url(#arrow)" />
    <line x1="250" y1="86" x2="351" y2="86" marker-end="url(#arrow)" />
    <line x1="180" y1="146" x2="180" y2="111" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="295" y="78">경로와 속성</text>
    <text x="295" y="103">경로 위의 위치</text>
    <text x="180" y="163">차량 위치</text>
  </g>
</svg>
