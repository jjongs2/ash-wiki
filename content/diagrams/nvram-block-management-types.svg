<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3.5 720 340" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- management type -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="26">Native</text>
    <text x="300" y="26">Redundant</text>
    <text x="620" y="26">Dataset</text>
  </g>

  <!-- 어느 type이든 RAM 블록과 administrative block 하나씩 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="160" height="28" rx="2" />
    <rect x="20" y="74" width="160" height="28" rx="2" />
    <rect x="220" y="40" width="160" height="28" rx="2" />
    <rect x="220" y="74" width="160" height="28" rx="2" />
    <rect x="540" y="40" width="160" height="28" rx="2" />
    <rect x="540" y="74" width="160" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="59">RAM 블록</text>
    <text x="100" y="93">administrative block</text>
    <text x="300" y="59">RAM 블록</text>
    <text x="300" y="93">administrative block</text>
    <text x="620" y="59">RAM 블록</text>
    <text x="620" y="93">administrative block</text>
  </g>

  <!-- NV 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="126" width="160" height="28" rx="2" />
    <rect x="220" y="126" width="160" height="28" rx="2" />
    <rect x="220" y="160" width="160" height="28" rx="2" />
    <rect x="540" y="126" width="160" height="28" rx="2" />
    <rect x="540" y="160" width="160" height="28" rx="2" />
    <rect x="540" y="226" width="160" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="145">NV 블록</text>
    <text x="300" y="145">NV 블록 (첫째)</text>
    <text x="300" y="179">NV 블록 (둘째)</text>
    <text x="620" y="145">NV 블록</text>
    <text x="620" y="179">NV 블록</text>
    <text x="620" y="245">NV 블록</text>
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="620" cy="200" r="1.5" />
    <circle cx="620" cy="207" r="1.5" />
    <circle cx="620" cy="214" r="1.5" />
    <circle cx="620" cy="300" r="1.5" />
    <circle cx="620" cy="307" r="1.5" />
    <circle cx="620" cy="314" r="1.5" />
  </g>

  <!-- ROM 블록: 없어도 된다 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20.75" y="160.75" width="158.5" height="26.5" rx="2" />
    <rect x="220.75" y="194.75" width="158.5" height="26.5" rx="2" />
    <rect x="540.75" y="260.75" width="158.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="100" y="179">ROM 블록</text>
    <text x="300" y="213">ROM 블록</text>
    <text x="620" y="279">ROM 블록</text>
  </g>

  <!-- dataset의 인덱스 -->
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="528" y="118">인덱스</text>
    <text x="528" y="144">0</text>
    <text x="528" y="178">1</text>
    <text x="528" y="244">NV 블록 수 − 1</text>
    <text x="528" y="278">그 뒤</text>
  </g>

  <!-- 범례 -->
  <rect x="20" y="300" width="28" height="16" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="56" y="313" font-size="12" fill="var(--text, #727981)">점선 테두리: 없어도 되는 블록</text>
</svg>
