<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 360 606" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- management type -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="26">Native</text>
    <text x="265" y="26">Redundant</text>
    <text x="265" y="262">Dataset</text>
  </g>

  <!-- 어느 type이든 RAM 블록과 administrative block 하나씩 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="150" height="28" rx="2" />
    <rect x="20" y="74" width="150" height="28" rx="2" />
    <rect x="190" y="40" width="150" height="28" rx="2" />
    <rect x="190" y="74" width="150" height="28" rx="2" />
    <rect x="190" y="276" width="150" height="28" rx="2" />
    <rect x="190" y="310" width="150" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="59">RAM 블록</text>
    <text x="95" y="93">administrative block</text>
    <text x="265" y="59">RAM 블록</text>
    <text x="265" y="93">administrative block</text>
    <text x="265" y="295">RAM 블록</text>
    <text x="265" y="329">administrative block</text>
  </g>

  <!-- NV 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="126" width="150" height="28" rx="2" />
    <rect x="190" y="126" width="150" height="28" rx="2" />
    <rect x="190" y="160" width="150" height="28" rx="2" />
    <rect x="190" y="362" width="150" height="28" rx="2" />
    <rect x="190" y="396" width="150" height="28" rx="2" />
    <rect x="190" y="462" width="150" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="145">NV 블록</text>
    <text x="265" y="145">NV 블록 (첫째)</text>
    <text x="265" y="179">NV 블록 (둘째)</text>
    <text x="265" y="381">NV 블록</text>
    <text x="265" y="415">NV 블록</text>
    <text x="265" y="481">NV 블록</text>
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="265" cy="436" r="1.5" />
    <circle cx="265" cy="443" r="1.5" />
    <circle cx="265" cy="450" r="1.5" />
    <circle cx="265" cy="536" r="1.5" />
    <circle cx="265" cy="543" r="1.5" />
    <circle cx="265" cy="550" r="1.5" />
  </g>

  <!-- ROM 블록: 없어도 된다 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20.75" y="160.75" width="148.5" height="26.5" rx="2" />
    <rect x="190.75" y="194.75" width="148.5" height="26.5" rx="2" />
    <rect x="190.75" y="496.75" width="148.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="95" y="179">ROM 블록</text>
    <text x="265" y="213">ROM 블록</text>
    <text x="265" y="515">ROM 블록</text>
  </g>

  <!-- dataset의 인덱스 -->
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="178" y="354">인덱스</text>
    <text x="178" y="380">0</text>
    <text x="178" y="414">1</text>
    <text x="178" y="480">NV 블록 수 − 1</text>
    <text x="178" y="514">그 뒤</text>
  </g>

  <!-- 범례 -->
  <rect x="20.75" y="570.75" width="26.5" height="14.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="56" y="583" font-size="12" fill="var(--text, #727981)">점선 테두리: 없어도 되는 블록</text>
</svg>
