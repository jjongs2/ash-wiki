<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.5 3 597.5 233.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름과 기준선 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="84" y="65">마스터</text>
    <text x="84" y="149">슬레이브</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="96" y1="74" x2="560" y2="74" />
    <line x1="96" y1="158" x2="560" y2="158" />
  </g>

  <!-- 동기 시퀀스: 1 µs = 40 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="100.75" y="46.75" width="38.5" height="26.5" rx="2" />
    <rect x="300.75" y="46.75" width="38.5" height="26.5" rx="2" />
  </g>
  <rect x="340.75" y="130.75" width="38.5" height="26.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="120" y="38" text-anchor="middle">1 µs</text>
    <text x="348" y="64">동기 시퀀스</text>
    <text x="360" y="122" text-anchor="middle">1 µs</text>
    <text x="220" y="149" text-anchor="middle">응답 없음</text>
    <text x="388" y="148">동기 시퀀스로 답함</text>
  </g>

  <!-- 마스터의 되풀이 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="76" x2="100" y2="100" />
    <line x1="300" y1="76" x2="300" y2="100" />
    <line x1="380" y1="160" x2="380" y2="184" />
    <line x1="540" y1="40" x2="540" y2="184" />
  </g>
  <line x1="102" y1="92" x2="298" y2="92" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="200" y="110" text-anchor="middle" font-size="12" fill="var(--text, #727981)">5 µs</text>

  <!-- 슬레이브 응답 뒤 4 µs -->
  <line x1="382" y1="176" x2="538" y2="176" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="460" y="194" text-anchor="middle" font-size="12" fill="var(--text, #727981)">4 µs 동안 다른 감지 없음</text>
  <text x="540" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">트레이닝 시작</text>

  <!-- 시간 -->
  <line x1="96" y1="212" x2="566" y2="212" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="574" y="216" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
