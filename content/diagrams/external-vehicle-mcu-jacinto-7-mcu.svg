<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 500 353" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="외부 차량 MCU와 Jacinto 7에 넣은 MCU">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 외부 차량 MCU -->
  <text x="105" y="40" text-anchor="middle" fill="var(--text, #727981)">외부 차량 MCU</text>
  <rect x="30" y="84" width="150" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="105" y="109" text-anchor="middle" fill="var(--text, #727981)">응용 프로세서</text>
  <line x1="105" y1="124" x2="105" y2="176" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="115" y="146">직렬 인터페이스 같은</text>
    <text x="115" y="162">외부 인터페이스</text>
  </g>
  <rect x="30" y="176" width="150" height="92" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="105" y="200" text-anchor="middle" fill="var(--text, #727981)">차량 MCU</text>
  <rect x="46" y="212" width="118" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="105" y="237" text-anchor="middle" fill="var(--text, #727981)">내장 플래시</text>

  <!-- Jacinto 7 -->
  <text x="380" y="40" text-anchor="middle" fill="var(--text, #727981)">Jacinto 7에 넣은 MCU</text>
  <rect x="270" y="52" width="220" height="180" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="284" y="72" font-size="12" fill="var(--text, #727981)">Jacinto 7 SoC</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="305" y="84" width="150" height="40" rx="2" />
    <rect x="305" y="176" width="150" height="40" rx="2" />
    <rect x="305" y="272" width="150" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="380" y="109">main domain</text>
    <text x="380" y="201">MCU domain</text>
    <text x="380" y="297">외부 플래시</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="380" y1="124" x2="380" y2="176" />
    <line x1="380" y1="216" x2="380" y2="272" />
  </g>
  <text x="390" y="154" font-size="12" fill="var(--text, #727981)">칩 안의 IPC</text>

  <text x="260" y="340" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TI 백서에 따른 외부 차량 MCU와 Jacinto 7에 넣은 MCU</text>
</svg>
