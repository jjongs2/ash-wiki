<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 16 310 284" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="IEEE 1028 판마다의 제목">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 1년 = 7 단위, 1988년 = y 40 -->
  <line x1="40" y1="40" x2="40" y2="257" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--ink, #727981)">
    <circle cx="40" cy="40" r="4" />
    <circle cx="40" cy="103" r="4" />
    <circle cx="40" cy="180" r="4" />
    <circle cx="40" cy="257" r="4" />
  </g>

  <!-- 판 -->
  <g fill="var(--text, #727981)">
    <text x="56" y="45">IEEE 1028-1988</text>
    <text x="56" y="108">IEEE 1028-1997</text>
    <text x="56" y="185">IEEE 1028-2008</text>
    <text x="56" y="262">2019년 11월 7일</text>
  </g>

  <!-- 제목과 상태 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="56" y="64">IEEE Standard Software Reviews and Audits</text>
    <text x="56" y="127">IEEE Standard for Software Reviews</text>
    <text x="56" y="204">IEEE Standard for Software Reviews and Audits</text>
    <text x="56" y="281">Inactive-Reserved</text>
  </g>
</svg>
