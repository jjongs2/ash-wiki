<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 300 310" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="MCU의 이더넷 MAC과 PHY">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- MCU 안: DMA와 MAC -->
  <rect x="20.75" y="20.75" width="278.5" height="128.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="32" y="40" font-size="12" fill="var(--text, #727981)">MCU</text>
  <rect x="40.75" y="62.75" width="68.5" height="64.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="75" y="100" text-anchor="middle" fill="var(--on-fill, #f8fafd)">DMA</text>
  <line x1="112" y1="95" x2="148" y2="95" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="150.75" y="46.75" width="128.5" height="92.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="215" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">MAC</text>
  <g font-size="12" fill="var(--on-fill, #f8fafd)" text-anchor="middle">
    <text x="215" y="92">프레임 캡슐화</text>
    <text x="215" y="110">주소 처리</text>
    <text x="215" y="128">오류 검출</text>
  </g>

  <!-- MCU 밖: PHY -->
  <line x1="215" y1="142" x2="215" y2="198" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="205" y="178" text-anchor="end" font-size="12" fill="var(--text, #727981)">MII · RMII</text>
  <rect x="160.75" y="200.75" width="108.5" height="48.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="215" y="221" text-anchor="middle" fill="var(--on-fill, #f8fafd)">PHY</text>
  <text x="215" y="240" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">부호화 · 복호화</text>

  <!-- 매체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="211" y1="250" x2="211" y2="280" />
    <line x1="219" y1="250" x2="219" y2="280" />
  </g>
  <rect x="160" y="280" width="110" height="30" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="215" y="300" text-anchor="middle" fill="var(--text, #727981)">꼬임쌍선</text>
</svg>
