<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 300 310" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- MCU 안: DMA와 MAC -->
  <rect x="20.75" y="20.75" width="278.5" height="128.5" rx="8" stroke="#727981" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="32" y="40" font-size="12" fill="#727981">MCU</text>
  <rect x="40" y="62" width="70" height="66" rx="4" fill="#825da9" />
  <text x="75" y="100" text-anchor="middle" fill="#f8fafd">DMA</text>
  <line x1="112" y1="95" x2="148" y2="95" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="150" y="46" width="130" height="94" rx="4" fill="#336fb8" />
  <text x="215" y="70" text-anchor="middle" fill="#f8fafd">MAC</text>
  <g font-size="12" fill="#f8fafd" text-anchor="middle">
    <text x="215" y="92">프레임 캡슐화</text>
    <text x="215" y="110">주소 처리</text>
    <text x="215" y="128">오류 검출</text>
  </g>

  <!-- MCU 밖: PHY -->
  <line x1="215" y1="142" x2="215" y2="198" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="205" y="178" text-anchor="end" font-size="12" fill="#727981">MII · RMII</text>
  <rect x="160" y="200" width="110" height="50" rx="4" fill="#b0540d" />
  <text x="215" y="221" text-anchor="middle" fill="#f8fafd">PHY</text>
  <text x="215" y="240" text-anchor="middle" font-size="12" fill="#f8fafd">부호화 · 복호화</text>

  <!-- 매체 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="211" y1="250" x2="211" y2="280" />
    <line x1="219" y1="250" x2="219" y2="280" />
  </g>
  <rect x="160" y="280" width="110" height="30" rx="4" fill="#337b47" />
  <text x="215" y="300" text-anchor="middle" fill="#f8fafd">꼬임쌍선</text>
</svg>
