<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Dem -->
  <rect x="250" y="20" width="170" height="120" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="335" y="42" text-anchor="middle" fill="var(--text, #727981)">Dem</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="30" width="150" height="40" rx="2" />
    <rect x="20" y="90" width="150" height="40" rx="2" />
    <rect x="266" y="56" width="138" height="30" rx="2" />
    <rect x="266" y="96" width="138" height="30" rx="2" />
    <rect x="500" y="30" width="140" height="40" rx="2" />
    <rect x="700" y="30" width="120" height="40" rx="2" />
    <rect x="500" y="90" width="140" height="40" rx="2" />
    <rect x="265" y="200" width="140" height="40" rx="2" />
    <rect x="500" y="200" width="140" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="55">SW-C의 monitor</text>
    <text x="95" y="115">BSW 모듈의 monitor</text>
    <text x="335" y="76" font-size="12">debouncing</text>
    <text x="335" y="116" font-size="12">event memory</text>
    <text x="570" y="55">Dcm</text>
    <text x="760" y="55">진단 테스터</text>
    <text x="570" y="115">NVRAM Manager</text>
    <text x="335" y="225">FiM</text>
    <text x="570" y="225">기능</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="50" x2="248" y2="50" />
    <line x1="170" y1="110" x2="248" y2="110" />
    <line x1="420" y1="50" x2="498" y2="50" />
    <line x1="640" y1="50" x2="698" y2="50" />
    <line x1="420" y1="110" x2="498" y2="110" />
    <line x1="335" y1="140" x2="335" y2="198" />
    <line x1="500" y1="220" x2="407" y2="220" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="209" y="43" text-anchor="middle">RTE</text>
    <text x="459" y="43" text-anchor="middle">DTC 상태</text>
    <text x="345" y="174">이벤트 상태</text>
    <text x="452" y="212" text-anchor="middle">FID 허용 상태</text>
  </g>
</svg>
