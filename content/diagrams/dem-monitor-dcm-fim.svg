<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Dem -->
  <rect x="20" y="110" width="480" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="260" y="132" text-anchor="middle" fill="var(--text, #727981)">Dem</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="55" y="20" width="150" height="40" rx="2" />
    <rect x="295" y="20" width="150" height="40" rx="2" />
    <rect x="60" y="144" width="180" height="30" rx="2" />
    <rect x="280" y="144" width="180" height="30" rx="2" />
    <rect x="20" y="240" width="140" height="40" rx="2" />
    <rect x="20" y="330" width="140" height="40" rx="2" />
    <rect x="190" y="240" width="140" height="40" rx="2" />
    <rect x="360" y="240" width="140" height="40" rx="2" />
    <rect x="360" y="330" width="140" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="45">SW-C의 monitor</text>
    <text x="370" y="45">BSW 모듈의 monitor</text>
    <text x="150" y="164" font-size="12">debouncing</text>
    <text x="370" y="164" font-size="12">event memory</text>
    <text x="90" y="265">Dcm</text>
    <text x="90" y="355">진단 테스터</text>
    <text x="260" y="265">NVRAM Manager</text>
    <text x="430" y="265">FiM</text>
    <text x="430" y="355">기능</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="60" x2="130" y2="108" />
    <line x1="370" y1="60" x2="370" y2="108" />
    <line x1="90" y1="190" x2="90" y2="238" />
    <line x1="90" y1="280" x2="90" y2="328" />
    <line x1="260" y1="190" x2="260" y2="238" />
    <line x1="430" y1="190" x2="430" y2="238" />
    <line x1="430" y1="330" x2="430" y2="282" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="138" y="89">RTE</text>
    <text x="98" y="219">DTC 상태</text>
    <text x="438" y="219">이벤트 상태</text>
    <text x="422" y="309" text-anchor="end">FID 허용 상태 묻기</text>
  </g>
</svg>
