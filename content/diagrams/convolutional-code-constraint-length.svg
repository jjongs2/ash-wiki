<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 -3.5 408.5 246.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 구속장 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M131 32 V26 H345 V32" />
    <path d="M203 62 V56 H345 V62" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="238" y="18">구속장 <tspan font-style="italic">K</tspan></text>
    <text x="274" y="48">앞 <tspan font-style="italic">K</tspan> − 1개 비트</text>
  </g>

  <!-- 입력 -->
  <text x="102" y="91" text-anchor="end" fill="var(--text, #727981)">입력 정보 비트</text>
  <line x1="106" y1="86" x2="128" y2="86" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 현재 비트와 앞 비트 -->
  <rect x="130.75" y="70.75" width="70.5" height="30.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="166" y="91" text-anchor="middle" fill="var(--on-fill, #f8fafd)">현재 비트</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="202" y="70.75" width="36" height="30.5" />
    <rect x="238" y="70.75" width="36" height="30.5" />
    <rect x="274" y="70.75" width="36" height="30.5" />
    <rect x="310" y="70.75" width="35.25" height="30.5" />
  </g>
  <text x="292" y="91" text-anchor="middle" fill="var(--text, #727981)">⋯</text>

  <!-- 선형 결합 -->
  <path d="M131 110 V116 H345 V110" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="353" y="120" font-size="12" fill="var(--text, #727981)">일부나 전부</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M238 116 V126 H190 V136" marker-end="url(#arrow)" />
    <path d="M238 126 H286 V136" marker-end="url(#arrow)" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150.75" y="138.75" width="78.5" height="28.5" rx="2" />
    <rect x="246.75" y="138.75" width="78.5" height="28.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="158">선형 결합</text>
    <text x="286" y="158">선형 결합</text>
  </g>

  <!-- 출력 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="169" x2="190" y2="188" />
    <line x1="286" y1="169" x2="286" y2="188" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="206">출력 심볼</text>
    <text x="286" y="206">출력 심볼</text>
  </g>
  <text x="238" y="230" text-anchor="middle" font-size="12" fill="var(--text, #727981)">입력 비트 하나마다 출력 심볼 여럿 · CCSDS 131.0-B-6의 정의</text>
</svg>
