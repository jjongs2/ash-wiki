<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1 464 312" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 첫째 줄: 첫 조각과 그 뒤에 끼어든 express 프레임 -->
  <path d="M21 44 V36 H239 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="130" y="28" text-anchor="middle" fill="var(--text, #727981)">preemptable 프레임의 첫 조각</text>
  <path d="M257 44 V36 H443 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="350" y="28" text-anchor="middle" fill="var(--text, #727981)">express 프레임</text>
  <rect x="20.75" y="52.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="47" y="70" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="78.75" y="52.75" width="32.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="95" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="116.75" y="52.75" width="78.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="156" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 1</text>
  <rect x="200.75" y="52.75" width="38.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="220" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">mCRC</text>
  <rect x="256.75" y="52.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="283" y="70" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="314.75" y="52.75" width="32.5" height="26.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="331" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="352.75" y="52.75" width="90.5" height="26.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="398" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">express 프레임</text>

  <!-- SMD와 mCRC가 알리는 것 -->
  <line x1="95" y1="82" x2="95" y2="89" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="95" y="102" text-anchor="middle" fill="var(--text, #727981)">첫 조각</text>
  <line x1="220" y1="82" x2="220" y2="89" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="220" y="102" text-anchor="middle" fill="var(--text, #727981)">이어짐</text>
  <line x1="331" y1="82" x2="331" y2="89" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="331" y="102" text-anchor="middle" fill="var(--text, #727981)">express</text>

  <!-- 선점이 일어나는 때 -->
  <line x1="156" y1="118" x2="156" y2="82" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="156" y="132" text-anchor="middle" fill="var(--text, #727981)">express 큐에 프레임이 들어옴</text>
  <line x1="20" y1="148" x2="444" y2="148" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 둘째 줄: 이어지는 조각 -->
  <path d="M21 196 V188 H303 V196" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="162" y="180" text-anchor="middle" fill="var(--text, #727981)">이어지는 조각</text>
  <rect x="20.75" y="204.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="47" y="222" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="78.75" y="204.75" width="32.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="95" y="222" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="116.75" y="204.75" width="58.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="146" y="222" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 번호</text>
  <rect x="180.75" y="204.75" width="78.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="220" y="222" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 2</text>
  <rect x="264.75" y="204.75" width="38.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="284" y="222" text-anchor="middle" fill="var(--on-fill, #f8fafd)">mCRC</text>

  <!-- SMD와 mCRC가 알리는 것 -->
  <line x1="95" y1="234" x2="95" y2="241" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="95" y="254" text-anchor="middle" fill="var(--text, #727981)">이어지는 조각</text>
  <line x1="284" y1="234" x2="284" y2="241" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="284" y="254" text-anchor="middle" fill="var(--text, #727981)">끝</text>

  <line x1="20" y1="272" x2="444" y2="272" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="444" y="290" text-anchor="end" fill="var(--text, #727981)">시간</text>
</svg>
