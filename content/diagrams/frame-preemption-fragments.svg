<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 200" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 묶음 이름 -->
  <path d="M21 44 V36 H249 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="135" y="28" text-anchor="middle" fill="var(--text, #727981)">preemptable 프레임의 첫 조각</text>
  <path d="M259 44 V36 H453 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="356" y="28" text-anchor="middle" fill="var(--text, #727981)">express 프레임</text>
  <path d="M463 44 V36 H755 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="609" y="28" text-anchor="middle" fill="var(--text, #727981)">이어지는 조각</text>

  <!-- 선로에 나가는 순서 -->
  <rect x="21.75" y="52.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="48" y="70" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="77.75" y="52.75" width="36.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="96" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="117.75" y="52.75" width="86.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="161" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 1</text>
  <rect x="207.75" y="52.75" width="40.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="228" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">mCRC</text>
  <rect x="259.75" y="52.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="286" y="70" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="315.75" y="52.75" width="36.5" height="26.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="334" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="355.75" y="52.75" width="96.5" height="26.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="404" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">express 프레임</text>
  <rect x="463.75" y="52.75" width="52.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="490" y="70" text-anchor="middle" fill="var(--text, #727981)">프리앰블</text>
  <rect x="519.75" y="52.75" width="36.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="538" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">SMD</text>
  <rect x="559.75" y="52.75" width="60.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="590" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 번호</text>
  <rect x="623.75" y="52.75" width="86.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="667" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">조각 2</text>
  <rect x="713.75" y="52.75" width="40.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="734" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">mCRC</text>

  <!-- SMD와 mCRC가 알리는 것 -->
  <text x="96" y="98" text-anchor="middle" fill="var(--text, #727981)">첫 조각</text>
  <text x="228" y="98" text-anchor="middle" fill="var(--text, #727981)">이어짐</text>
  <text x="334" y="98" text-anchor="middle" fill="var(--text, #727981)">express</text>
  <text x="538" y="98" text-anchor="middle" fill="var(--text, #727981)">이어지는 조각</text>
  <text x="734" y="98" text-anchor="middle" fill="var(--text, #727981)">끝</text>

  <!-- 선점이 일어나는 때 -->
  <line x1="170" y1="130" x2="170" y2="86" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="170" y="146" text-anchor="middle" fill="var(--text, #727981)">express 큐에 프레임이 들어옴</text>
  <line x1="20" y1="164" x2="756" y2="164" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="756" y="182" text-anchor="end" fill="var(--text, #727981)">시간</text>
</svg>
