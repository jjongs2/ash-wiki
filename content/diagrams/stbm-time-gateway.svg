<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 410 332" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Time Gateway -->
  <rect x="20" y="80" width="362" height="168" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="34" y="100" font-size="12" fill="var(--text, #727981)">Time Gateway</text>

  <!-- 모듈과 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="130" height="36" rx="2" />
    <rect x="165" y="112" width="72" height="36" rx="2" />
    <rect x="34" y="190" width="160" height="36" rx="2" />
    <rect x="208" y="190" width="160" height="36" rx="2" />
    <rect x="280" y="276" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="43">Time Master</text>
    <text x="201" y="135">StbM</text>
    <text x="114" y="213">TSyn (Time Slave 쪽)</text>
    <text x="288" y="213">TSyn (Time Master 쪽)</text>
    <text x="330" y="299">Time Slave</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="124" y1="56" x2="124" y2="188" marker-end="url(#arrow)" />
    <path d="M150 190 V130 H163" marker-end="url(#arrow)" />
    <path d="M237 130 H260 V188" marker-end="url(#arrow)" />
    <line x1="330" y1="226" x2="330" y2="274" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="132" y="72">한 버스</text>
    <text x="338" y="264">다른 버스</text>
    <text x="34" y="276">메시지를 그대로 라우팅하지 않고,</text>
    <text x="34" y="292">라우팅 지연을 보정해 다시 보낸다</text>
  </g>
</svg>
