<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 8 780 206" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Time Gateway -->
  <rect x="250" y="20" width="370" height="156" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="262" y="40" font-size="12" fill="var(--text, #727981)">Time Gateway</text>

  <!-- 모듈과 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="120" width="130" height="36" rx="2" />
    <rect x="375" y="56" width="120" height="36" rx="2" />
    <rect x="264" y="120" width="160" height="36" rx="2" />
    <rect x="446" y="120" width="160" height="36" rx="2" />
    <rect x="700" y="120" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="143">Time Master</text>
    <text x="435" y="79">StbM</text>
    <text x="344" y="143">TSyn (Time Slave 쪽)</text>
    <text x="526" y="143">TSyn (Time Master 쪽)</text>
    <text x="750" y="143">Time Slave</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="172" y1="138" x2="262" y2="138" marker-end="url(#arrow)" />
    <path d="M344 118 V74 H373" marker-end="url(#arrow)" />
    <path d="M497 74 H526 V118" marker-end="url(#arrow)" />
    <line x1="608" y1="138" x2="698" y2="138" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="211" y="130">한 버스</text>
    <text x="653" y="130">다른 버스</text>
    <text x="435" y="200">메시지를 그대로 라우팅하지 않고, 라우팅 지연을 보정해 다시 보낸다</text>
  </g>
</svg>
