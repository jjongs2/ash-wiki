<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CA -->
  <rect x="20" y="20" width="620" height="150" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="36" y="42" font-size="14" fill="var(--text, #727981)">CA</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="75" width="110" height="36" rx="2" />
    <rect x="480" y="40" width="110" height="36" rx="2" />
    <rect x="480" y="116" width="110" height="36" rx="2" />
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="98">SecY</text>
    <text x="535" y="63">SecY</text>
    <text x="535" y="139">SecY</text>
  </g>

  <!-- 한 구성원의 SC -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <line x1="170" y1="93" x2="330" y2="93" />
    <path d="M330 93 V58 H478" marker-end="url(#arrow-blue)" />
    <path d="M330 93 V134 H478" marker-end="url(#arrow-blue)" />
  </g>
  <text x="250" y="85" text-anchor="middle" fill="var(--text, #727981)">SC · SCI로 가림</text>
  <line x1="250" y1="93" x2="250" y2="200" stroke="var(--blue, #336fb8)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- SC를 받치는 SA -->
  <rect x="20" y="200" width="620" height="110" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="36" y="222">SC: SA가 차례로 이어 받침</text>
    <text x="624" y="222" text-anchor="end">AN이 SA를 넷까지 가림</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="234" width="150" height="44" rx="2" />
    <rect x="250" y="234" width="150" height="44" rx="2" />
    <rect x="440" y="234" width="150" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="135" y="253" font-size="14">SA</text>
    <text x="135" y="270">SAK</text>
    <text x="325" y="253" font-size="14">SA</text>
    <text x="325" y="270">SAK</text>
    <text x="515" y="253" font-size="14">SA</text>
    <text x="515" y="270">SAK</text>
  </g>
  <line x1="60" y1="292" x2="590" y2="292" stroke="var(--ink, #727981)" stroke-width="1" />
  <path d="M590 288 L598 292 L590 296 z" fill="var(--ink, #727981)" />
  <text x="604" y="296" fill="var(--text, #727981)">시간</text>
</svg>
