<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="CA 안에서 SA가 차례로 이어 받치는 SC">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CA -->
  <rect x="20" y="20" width="480" height="150" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="36" y="42" font-size="14" fill="var(--text, #727981)">CA</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="75" width="100" height="36" rx="2" />
    <rect x="380" y="40" width="100" height="36" rx="2" />
    <rect x="380" y="116" width="100" height="36" rx="2" />
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="98">SecY</text>
    <text x="430" y="63">SecY</text>
    <text x="430" y="139">SecY</text>
  </g>

  <!-- 한 구성원의 SC -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <line x1="140" y1="93" x2="260" y2="93" />
    <path d="M260 93 V58 H378" marker-end="url(#arrow-blue)" />
    <path d="M260 93 V134 H378" marker-end="url(#arrow-blue)" />
  </g>
  <text x="200" y="85" text-anchor="middle" fill="var(--text, #727981)">SC · SCI로 가림</text>
  <line x1="200" y1="93" x2="200" y2="200" stroke="var(--blue, #336fb8)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- SC를 받치는 SA -->
  <rect x="20" y="200" width="480" height="110" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="36" y="222">SC: SA가 차례로 이어 받침</text>
    <text x="484" y="222" text-anchor="end">AN이 SA를 넷까지 가림</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="234" width="120" height="44" rx="2" />
    <rect x="180" y="234" width="120" height="44" rx="2" />
    <rect x="320" y="234" width="120" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="253" font-size="14">SA</text>
    <text x="100" y="270">SAK</text>
    <text x="240" y="253" font-size="14">SA</text>
    <text x="240" y="270">SAK</text>
    <text x="380" y="253" font-size="14">SA</text>
    <text x="380" y="270">SAK</text>
  </g>
  <line x1="40" y1="292" x2="440" y2="292" stroke="var(--ink, #727981)" stroke-width="1" />
  <path d="M440 288 L448 292 L440 296 z" fill="var(--ink, #727981)" />
  <text x="454" y="296" fill="var(--text, #727981)">시간</text>
</svg>
