<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -1 540 470" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- CAN 스택 밖의 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="20" width="140" height="36" rx="2" />
    <rect x="210" y="20" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="43">ComM</text>
    <text x="280" y="43">PduR</text>
  </g>

  <!-- 서비스 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="110" width="140" height="36" rx="2" />
    <rect x="210" y="110" width="140" height="36" rx="2" />
    <rect x="380" y="110" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="133">CanSM</text>
    <text x="280" y="133">CanTp</text>
    <text x="450" y="133">CanNm</text>
  </g>

  <!-- L-SDU Router -->
  <rect x="210" y="200" width="310" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="365" y="223" text-anchor="middle" fill="var(--text, #727981)">LSduR</text>

  <!-- Communication Hardware Abstraction과 Communication Drivers -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="290" width="480" height="36" rx="2" />
    <rect x="40" y="380" width="200" height="36" rx="2" />
    <rect x="320" y="380" width="200" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="280" y="313">CanIf</text>
    <text x="140" y="403">CAN Driver</text>
    <text x="420" y="403">CanTrcv</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M28 278 H532 V428 H308 V338 H28 Z" />
    <rect x="28" y="368" width="224" height="60" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="140" y="448">Communication Drivers</text>
    <text x="420" y="448">Communication Hardware Abstraction</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="95" y1="58" x2="95" y2="108" marker-end="url(#arrow)" />
    <line x1="125" y1="108" x2="125" y2="58" marker-end="url(#arrow)" />
    <line x1="280" y1="58" x2="280" y2="108" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M352 38 H365 V198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="110" y1="148" x2="110" y2="288" marker-end="url(#arrow)" />
    <line x1="280" y1="148" x2="280" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="450" y1="148" x2="450" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="365" y1="238" x2="365" y2="288" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="140" y1="328" x2="140" y2="378" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="420" y1="328" x2="420" y2="378" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="87" y="87" text-anchor="end">요청</text>
    <text x="133" y="87">모드 알림</text>
    <text x="288" y="87">I-PDU</text>
    <text x="373" y="87">I-PDU</text>
    <text x="118" y="222">모드 변경</text>
    <text x="288" y="177">N-PDU</text>
    <text x="373" y="267">L-SDU</text>
    <text x="428" y="357">모드 변경</text>
  </g>
</svg>
