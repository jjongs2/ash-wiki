    </g>
    <g fill="var(--text, #727981)">
      <text x="85" y="235">프로세서</text>
      <text x="211" y="235">프로세서</text>
      <text x="337" y="235">프로세서</text>
      <text x="463" y="235">프로세서</text>
    </g>
  </g>

  <!-- global -->
  <text x="24" y="282" font-size="12" fill="var(--text, #727981)">global scheduling: cluster 크기가 프로세서 수와 같음</text>
  <rect x="24" y="290" width="500" height="78" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="30.75" y="298.75" width="486.5" height="24.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30.75" y="332.75" width="108.5" height="28.5" rx="2" />
    <rect x="156.75" y="332.75" width="108.5" height="28.5" rx="2" />
    <rect x="282.75" y="332.75" width="108.5" height="28.5" rx="2" />
    <rect x="408.75" y="332.75" width="108.5" height="28.5" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="274" y="315" fill="var(--on-fill, #f8fafd)">스케줄러 인스턴스</text>
    <g fill="var(--text, #727981)">
      <text x="85" y="351">프로세서</text>
      <text x="211" y="351">프로세서</text>
      <text x="337" y="351">프로세서</text>
      <text x="463" y="351">프로세서</text>
    </g>
  </g>
