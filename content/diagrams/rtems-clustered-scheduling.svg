      <text x="211" y="83">스케줄러 인스턴스</text>
      <text x="337" y="83">스케줄러 인스턴스</text>
      <text x="463" y="83">스케줄러 인스턴스</text>
    </g>
    <g fill="var(--text, #727981)">
