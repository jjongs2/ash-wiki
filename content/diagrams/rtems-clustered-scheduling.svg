    <rect x="276" y="174" width="248" height="78" rx="2" />
  </g>
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="30.75" y="182.75" width="234.5" height="24.5" rx="2" />
    <rect x="282.75" y="182.75" width="234.5" height="24.5" rx="2" />
  </g>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30.75" y="216.75" width="108.5" height="28.5" rx="2" />
    <rect x="156.75" y="216.75" width="108.5" height="28.5" rx="2" />
    <rect x="282.75" y="216.75" width="108.5" height="28.5" rx="2" />
    <rect x="408.75" y="216.75" width="108.5" height="28.5" rx="2" />
