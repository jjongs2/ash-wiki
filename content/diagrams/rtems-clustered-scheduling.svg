<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 -11 541 399.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="24" y="20" fill="var(--text, #727981)">RTEMS의 clustered scheduling</text>

  <!-- partition -->
  <text x="24" y="50" font-size="12" fill="var(--text, #727981)">partition: 크기가 1인 cluster</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="24" y="58" width="122" height="78" rx="2" />
    <rect x="150" y="58" width="122" height="78" rx="2" />
    <rect x="276" y="58" width="122" height="78" rx="2" />
    <rect x="402" y="58" width="122" height="78" rx="2" />
  </g>
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="30.75" y="66.75" width="108.5" height="24.5" rx="2" />
    <rect x="156.75" y="66.75" width="108.5" height="24.5" rx="2" />
    <rect x="282.75" y="66.75" width="108.5" height="24.5" rx="2" />
    <rect x="408.75" y="66.75" width="108.5" height="24.5" rx="2" />
  </g>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
