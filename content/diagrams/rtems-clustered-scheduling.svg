      <text x="337" y="119">프로세서</text>
      <text x="463" y="119">프로세서</text>
    </g>
  </g>

  <!-- cluster -->
  <text x="24" y="166" font-size="12" fill="var(--text, #727981)">cluster</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
