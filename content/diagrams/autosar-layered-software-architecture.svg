<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 660.5 330" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- BSW의 범위 -->
  <text x="20" y="195" fill="var(--text, #727981)">BSW</text>
  <path d="M66 120 H60 V260 H66" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="76" y="20" width="460" height="40" rx="2" />
    <rect x="76" y="70" width="460" height="40" rx="2" />
    <rect x="76" y="120" width="130" height="140" rx="2" />
    <rect x="216" y="120" width="320" height="40" rx="2" />
    <rect x="216" y="170" width="320" height="40" rx="2" />
    <rect x="216" y="220" width="320" height="40" rx="2" />
    <rect x="76" y="270" width="460" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="306" y="45">Application Layer</text>
    <text x="306" y="95">RTE</text>
    <text x="141" y="195">Complex Drivers</text>
    <text x="376" y="145">Services Layer</text>
    <text x="376" y="195">ECU Abstraction Layer</text>
    <text x="376" y="245">MCAL</text>
    <text x="306" y="295">마이크로컨트롤러</text>
  </g>

  <!-- 하드웨어 의존의 축: 아래일수록 의존, 위일수록 독립 -->
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="600" y="32">하드웨어에서 독립</text>
    <text x="600" y="302">하드웨어에 의존</text>
  </g>
  <line x1="600" y1="284" x2="600" y2="44" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
