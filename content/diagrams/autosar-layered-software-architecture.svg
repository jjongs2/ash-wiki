<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.5 0 530 330" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- BSW의 범위 -->
  <text x="10" y="195" fill="var(--text, #727981)">BSW</text>
  <path d="M54 120 H48 V260 H54" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="62" y="20" width="356" height="40" rx="2" />
    <rect x="62" y="70" width="356" height="40" rx="2" />
    <rect x="62" y="120" width="120" height="140" rx="2" />
    <rect x="192" y="120" width="226" height="40" rx="2" />
    <rect x="192" y="170" width="226" height="40" rx="2" />
    <rect x="192" y="220" width="226" height="40" rx="2" />
    <rect x="62" y="270" width="356" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="240" y="45">Application Layer</text>
    <text x="240" y="95">RTE</text>
    <text x="122" y="195">Complex Drivers</text>
    <text x="305" y="145">Services Layer</text>
    <text x="305" y="195">ECU Abstraction Layer</text>
    <text x="305" y="245">MCAL</text>
    <text x="240" y="295">마이크로컨트롤러</text>
  </g>

  <!-- 하드웨어 의존의 축: 아래일수록 의존, 위일수록 독립 -->
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="472" y="32">하드웨어에서 독립</text>
    <text x="472" y="302">하드웨어에 의존</text>
  </g>
  <line x1="472" y1="284" x2="472" y2="44" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
