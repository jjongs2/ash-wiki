<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5.5 532 262" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="1000BASE-T1 송신 쪽의 LPI 송신 모드">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">1000BASE-T1 송신 쪽</text>

  <!-- GMII 조건: 첫 PHY 프레임의 마지막 80B/81B 블록부터 -->
  <path d="M86 50 V42 H365 V50" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="225.5" y="34" text-anchor="middle" fill="var(--text, #727981)">GMII: Assert Low Power Idle</text>

  <!-- 매체로 나가는 신호 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="56" width="86" height="28" />
    <rect x="110" y="56" width="48" height="28" />
    <rect x="204" y="56" width="46" height="28" />
    <rect x="296" y="56" width="46" height="28" />
    <rect x="388" y="56" width="44" height="28" />
    <rect x="436" y="56" width="76" height="28" />
  </g>
  <line x1="86" y1="56" x2="86" y2="84" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)">
    <rect x="162" y="56" width="38" height="28" />
    <rect x="254" y="56" width="38" height="28" />
    <rect x="346" y="56" width="38" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="53" y="74">PHY 프레임</text>
    <text x="134" y="74">sleep</text>
    <text x="181" y="74">quiet</text>
    <text x="227" y="74">refresh</text>
    <text x="273" y="74">quiet</text>
    <text x="319" y="74">refresh</text>
    <text x="365" y="74">quiet</text>
    <text x="410" y="74">wake</text>
    <text x="474" y="74">PHY 프레임</text>
  </g>

  <!-- 마지막 80B/81B 블록 -->
  <line x1="96" y1="85" x2="96" y2="94" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="20" y="106" fill="var(--text, #727981)">마지막 80B/81B 블록</text>

  <!-- 신호마다 담는 것 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="134" y="128">LP_IDLE로 채운</text>
    <text x="134" y="144">PHY 프레임</text>
    <text x="273" y="128">refresh: 링크 상대가 적응 필터와</text>
    <text x="273" y="144">타이밍 회로를 갱신할 수 있음</text>
    <text x="410" y="128">Idle로 채운</text>
    <text x="410" y="144">PHY 프레임</text>
  </g>

  <!-- 전력 모드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 156 V164 H106 V156" />
    <path d="M158 156 V164 H388 V156" />
    <path d="M436 156 V164 H512 V156" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="63" y="182">정상 전력 모드</text>
    <text x="273" y="182">LPI 송신 모드</text>
    <text x="273" y="198">데이터 경로와 제어 논리를 꺼 전력을 더 아낄 수 있음</text>
    <text x="474" y="182">정상 전력 모드</text>
  </g>

  <!-- 시간축 -->
  <line x1="20" y1="216" x2="512" y2="216" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="512" y="234" text-anchor="end" fill="var(--text, #727981)">시간</text>
</svg>
