<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 4.5 511.5 438.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CAN 위의 UDS와 IP 위의 UDS의 계층">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 열 제목 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="90" y="24">OSI 참조 모델</text>
    <text x="260" y="24">CAN 위의 UDS</text>
    <text x="430" y="24">IP 위의 UDS</text>
  </g>

  <!-- 일곱 계층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="140" height="86" rx="2" />
    <rect x="20" y="132" width="140" height="40" rx="2" />
    <rect x="20" y="178" width="140" height="40" rx="2" />
    <rect x="20" y="224" width="140" height="40" rx="2" />
    <rect x="20" y="270" width="140" height="40" rx="2" />
    <rect x="20" y="316" width="140" height="40" rx="2" />
    <rect x="20" y="362" width="140" height="40" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="31" y="87.5">7</text>
    <text x="31" y="156.5">6</text>
    <text x="31" y="202.5">5</text>
    <text x="31" y="248.5">4</text>
    <text x="31" y="294.5">3</text>
    <text x="31" y="340.5">2</text>
    <text x="31" y="386.5">1</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="94" y="88">응용 계층</text>
    <text x="94" y="157">표현 계층</text>
    <text x="94" y="203">세션 계층</text>
    <text x="94" y="249">전송 계층</text>
    <text x="94" y="295">네트워크 계층</text>
    <text x="94" y="341">데이터 링크 계층</text>
    <text x="94" y="387">물리 계층</text>
  </g>

  <!-- 두 갈래가 함께 쓰는 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="180" y="40" width="330" height="40" rx="2" />
    <rect x="180" y="132" width="330" height="40" rx="2" />
    <rect x="180" y="178" width="330" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="345" y="65">ISO 14229-1</text>
    <text x="345" y="157">제조사별 정의, SAE J1979-DA, ISO 22901</text>
    <text x="345" y="203">ISO 14229-2</text>
  </g>

  <!-- CAN 갈래 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="180" y="86" width="160" height="40" rx="2" />
    <rect x="180" y="224" width="160" height="86" rx="2" />
    <rect x="180" y="316" width="160" height="86" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="111">ISO 14229-3</text>
    <text x="260" y="263">ISO 15765-2</text>
    <text x="260" y="281" font-size="12">DoCAN</text>
    <text x="260" y="364">CAN</text>
  </g>

  <!-- IP 갈래 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="350" y="86" width="160" height="40" rx="2" />
    <rect x="350" y="224" width="160" height="86" rx="2" />
    <rect x="350" y="316" width="160" height="86" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="430" y="111">ISO 14229-5</text>
    <text x="430" y="254">ISO 13400-2</text>
    <text x="430" y="272" font-size="12">DoIP</text>
    <text x="430" y="289" font-size="12">TCP·UDP·IP</text>
    <text x="430" y="346">ISO 13400-3</text>
    <text x="430" y="364" font-size="12">IEEE 802.3</text>
    <text x="430" y="381" font-size="12">100BASE-TX</text>
  </g>

  <text x="265" y="432" text-anchor="middle" font-size="12" fill="var(--text, #727981)">5~7계층의 배치는 ISO 14229-1:2026의 소개를 따른다.</text>
</svg>
