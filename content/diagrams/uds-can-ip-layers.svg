<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 730 160" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 줄기: 응용과 세션 -->
  <rect x="20" y="60" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="70" y="84" text-anchor="middle" font-size="12" fill="#727981">응용</text>
  <text x="70" y="102" text-anchor="middle" fill="#727981">ISO 14229-1</text>
  <rect x="142" y="60" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="192" y="84" text-anchor="middle" font-size="12" fill="#727981">세션</text>
  <text x="192" y="102" text-anchor="middle" fill="#727981">ISO 14229-2</text>

  <!-- CAN 갈래 -->
  <rect x="264" y="20" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="314" y="44" text-anchor="middle" font-size="12" fill="#727981">UDSonCAN</text>
  <text x="314" y="62" text-anchor="middle" fill="#727981">ISO 14229-3</text>
  <rect x="386" y="20" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="436" y="44" text-anchor="middle" fill="#727981">ISO 15765-2</text>
  <text x="436" y="62" text-anchor="middle" font-size="12" fill="#727981">DoCAN</text>
  <rect x="508" y="20" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="558" y="55" text-anchor="middle" fill="#727981">CAN</text>

  <!-- IP 갈래 -->
  <rect x="264" y="100" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="314" y="124" text-anchor="middle" font-size="12" fill="#727981">UDSonIP</text>
  <text x="314" y="142" text-anchor="middle" fill="#727981">ISO 14229-5</text>
  <rect x="386" y="100" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="436" y="124" text-anchor="middle" fill="#727981">ISO 13400-2</text>
  <text x="436" y="142" text-anchor="middle" font-size="12" fill="#727981">DoIP</text>
  <rect x="508" y="100" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="558" y="135" text-anchor="middle" fill="#727981">TCP·UDP·IP</text>
  <rect x="630" y="100" width="100" height="60" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="680" y="120" text-anchor="middle" fill="#727981">ISO 13400-3</text>
  <text x="680" y="137" text-anchor="middle" font-size="12" fill="#727981">IEEE 802.3</text>
  <text x="680" y="152" text-anchor="middle" font-size="12" fill="#727981">100BASE-TX</text>

  <!-- 잇는 화살표 -->
  <g stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="122" y1="90" x2="140" y2="90" />
    <path d="M244 90 H253 V50 H262" />
    <path d="M244 90 H253 V130 H262" />
    <line x1="366" y1="50" x2="384" y2="50" />
    <line x1="488" y1="50" x2="506" y2="50" />
    <line x1="366" y1="130" x2="384" y2="130" />
    <line x1="488" y1="130" x2="506" y2="130" />
    <line x1="610" y1="130" x2="628" y2="130" />
  </g>
</svg>
