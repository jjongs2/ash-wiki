<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 502 208" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 바탕 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="20.75" width="199.5" height="62.5" rx="2" />
    <rect x="300.75" y="20.75" width="199.5" height="62.5" rx="2" />
    <rect x="20.75" y="160.75" width="479.5" height="46.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120.5" y="40" font-size="13">ISO 26262 시리즈</text>
    <text x="120.5" y="58">차량 수준의 해저드 분석과</text>
    <text x="120.5" y="74">리스크 분석을 다룸</text>
    <text x="400.5" y="40" font-size="13">ISO 21448</text>
    <text x="400.5" y="58">차량 수준의 해저드 분석과</text>
    <text x="400.5" y="74">리스크 분석을 다룸</text>
    <text x="260.5" y="179" font-size="13">ISO/PAS 8800:2024</text>
    <text x="260.5" y="197">해저드 분석과 리스크 분석은 범위 밖</text>
  </g>

  <!-- 넓히는 관계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="40" y1="84" x2="40" y2="159" />
    <line x1="481" y1="84" x2="481" y2="159" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="50" y="118" font-size="13">AI 시스템의 오동작</text>
    <text x="50" y="136">관련 조항을 tailoring·확장</text>
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="471" y="118" font-size="13">AI 시스템의 기능 부족</text>
    <text x="471" y="136">개념과 지침을 확장</text>
  </g>
</svg>
