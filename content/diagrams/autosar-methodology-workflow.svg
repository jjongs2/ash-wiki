<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 466" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="VFB에서 실행 파일까지의 작업 흐름">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 산출물 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="20" y="20" width="180" height="36" rx="2" />
    <rect x="20" y="132" width="180" height="36" rx="2" />
    <rect x="20" y="244" width="180" height="36" rx="2" />
    <rect x="433" y="410" width="113" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="110" y="42.5">VFB</text>
    <text x="110" y="154.5">System Description</text>
    <text x="110" y="266.5">ECU Extract</text>
    <text x="489.5" y="432.5">실행 파일</text>
  </g>

  <!-- 시스템 설계와 SW-C 구현 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="76" width="180" height="36" rx="2" />
    <rect x="20" y="188" width="180" height="36" rx="2" />
    <rect x="380" y="76" width="180" height="148" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="98.5">시스템 개발</text>
    <text x="110" y="210.5">ECU Extract 추출</text>
    <text x="470" y="154.5">SW-C 구현</text>
  </g>

  <!-- ECU 통합 -->
  <rect x="20" y="300" width="540" height="84" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="34" y="322" fill="var(--text, #727981)">ECU 통합</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="34" y="334" width="113" height="36" rx="2" />
    <rect x="167" y="334" width="113" height="36" rx="2" />
    <rect x="300" y="334" width="113" height="36" rx="2" />
    <rect x="433" y="334" width="113" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90.5" y="356.5">ECU 설정 준비</text>
    <text x="223.5" y="356.5">BSW·RTE 설정</text>
    <text x="356.5" y="356.5">BSW·RTE 생성</text>
    <text x="489.5" y="356.5">실행 파일 빌드</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="56" x2="110" y2="75" />
    <line x1="110" y1="112" x2="110" y2="131" />
    <line x1="110" y1="168" x2="110" y2="187" />
    <line x1="110" y1="224" x2="110" y2="243" />
    <line x1="110" y1="280" x2="110" y2="299" />
    <path d="M200 38 H470 V75" />
    <line x1="470" y1="224" x2="470" y2="299" />
    <line x1="147" y1="352" x2="166" y2="352" />
    <line x1="280" y1="352" x2="299" y2="352" />
    <line x1="413" y1="352" x2="432" y2="352" />
    <line x1="489.5" y1="370" x2="489.5" y2="409" />
  </g>

  <!-- 범례 -->
  <rect x="20" y="421" width="20" height="14" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="100" y="421" width="20" height="14" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="48" y="432">작업</text>
    <text x="128" y="432">산출물</text>
  </g>
</svg>
