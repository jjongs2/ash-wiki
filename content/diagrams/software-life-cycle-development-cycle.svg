<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 11.5 661 213.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 소프트웨어 생명주기 -->
  <text x="20" y="31" fill="var(--text, #727981)">사용자나 고객의 필요</text>
  <text x="660" y="31" text-anchor="end" fill="var(--text, #727981)">더는 쓰지 않거나 쓸 수 없게 될 때</text>
  <rect x="20" y="40" width="640" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="340" y="58" text-anchor="middle" fill="var(--text, #727981)">소프트웨어 생명주기</text>

  <!-- 소프트웨어 개발 주기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="130" y1="68" x2="130" y2="108" />
    <line x1="430" y1="68" x2="430" y2="108" />
  </g>
  <text x="136" y="99" fill="var(--text, #727981)">개발하기로 정한 때</text>
  <text x="424" y="99" text-anchor="end" fill="var(--text, #727981)">인도할 때</text>
  <rect x="130" y="108" width="300" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="280" y="126" text-anchor="middle" fill="var(--text, #727981)">소프트웨어 개발 주기</text>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130" y="148" width="48" height="28" rx="2" />
    <rect x="185" y="148" width="48" height="28" rx="2" />
    <rect x="240" y="148" width="48" height="28" rx="2" />
    <rect x="295" y="148" width="56" height="28" rx="2" />
    <rect x="360" y="148" width="70" height="28" rx="2" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="154" y="166">요구</text>
    <text x="209" y="166">설계</text>
    <text x="264" y="166">구현</text>
    <text x="323" y="166">테스트</text>
    <text x="395" y="166">설치·점검</text>
    <text x="395" y="193">(때로)</text>
  </g>
  <text x="130" y="214" fill="var(--text, #727981)">개발 접근 방식에 따라 단계가 겹치거나 반복된다</text>
  <text x="660" y="214" text-anchor="end" fill="var(--text, #727981)">ISO/IEC/IEEE 24765:2017의 정의</text>
</svg>
