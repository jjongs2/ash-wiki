<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 11.5 501 233" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="소프트웨어 생명주기와 소프트웨어 개발 주기">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 소프트웨어 생명주기 -->
  <text x="20" y="31" fill="var(--text, #727981)">사용자나 고객의 필요</text>
  <text x="500" y="31" text-anchor="end" fill="var(--text, #727981)">더는 쓰지 않거나 쓸 수 없게 될 때</text>
  <rect x="20" y="40" width="480" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="260" y="58" text-anchor="middle" fill="var(--text, #727981)">소프트웨어 생명주기</text>

  <!-- 소프트웨어 개발 주기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="102" y1="68" x2="102" y2="108" />
    <line x1="402" y1="68" x2="402" y2="108" />
  </g>
  <text x="108" y="99" fill="var(--text, #727981)">개발하기로 정한 때</text>
  <text x="396" y="99" text-anchor="end" fill="var(--text, #727981)">인도할 때</text>
  <rect x="102" y="108" width="300" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="252" y="126" text-anchor="middle" fill="var(--text, #727981)">소프트웨어 개발 주기</text>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="102" y="148" width="48" height="40" rx="2" />
    <rect x="157" y="148" width="48" height="40" rx="2" />
    <rect x="212" y="148" width="48" height="40" rx="2" />
    <rect x="267" y="148" width="56" height="40" rx="2" />
    <rect x="332" y="148" width="70" height="40" rx="2" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="126" y="172">요구</text>
    <text x="181" y="172">설계</text>
    <text x="236" y="172">구현</text>
    <text x="295" y="172">테스트</text>
    <text x="367" y="164">설치·점검</text>
    <text x="367" y="180">(때로)</text>
  </g>
  <text x="102" y="208" fill="var(--text, #727981)">개발 접근 방식에 따라 단계가 겹치거나 반복된다</text>
  <text x="500" y="234" text-anchor="end" fill="var(--text, #727981)">ISO/IEC/IEEE 24765:2017의 정의</text>
</svg>
