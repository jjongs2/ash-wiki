<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 600 243.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 공통 MAC -->
  <rect x="20" y="20" width="500" height="50" rx="4" fill="#336fb8" />
  <text x="270" y="41" text-anchor="middle" fill="#f8fafd">공통 MAC</text>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#f8fafd">CSMA/CD MAC 프로토콜 · 반이중과 전이중</text>

  <!-- 관리 정보 베이스 -->
  <rect x="532" y="20" width="68" height="196" rx="4" fill="#825da9" />
  <text x="566" y="123" text-anchor="middle" fill="#f8fafd">MIB</text>

  <!-- 잇는 선 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="78" y1="70" x2="78" y2="86" />
    <line x1="206" y1="70" x2="206" y2="86" />
    <line x1="334" y1="70" x2="334" y2="86" />
    <line x1="462" y1="70" x2="462" y2="86" />
    <line x1="78" y1="112" x2="78" y2="128" />
    <line x1="206" y1="112" x2="206" y2="128" />
    <line x1="334" y1="112" x2="334" y2="128" />
    <line x1="462" y1="112" x2="462" y2="128" />
    <line x1="78" y1="164" x2="78" y2="180" />
    <line x1="206" y1="164" x2="206" y2="180" />
    <line x1="334" y1="164" x2="334" y2="180" />
    <line x1="462" y1="164" x2="462" y2="180" />
  </g>

  <!-- 속도별 MII -->
  <g stroke="#727981" stroke-width="1.5">
    <rect x="20.75" y="86.75" width="114.5" height="24.5" rx="4" />
    <rect x="148.75" y="86.75" width="114.5" height="24.5" rx="4" />
    <rect x="276.75" y="86.75" width="114.5" height="24.5" rx="4" />
    <rect x="404.75" y="86.75" width="114.5" height="24.5" rx="4" />
  </g>
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="78" y="103">MII</text>
    <text x="206" y="103">MII</text>
    <text x="334" y="103">MII</text>
    <text x="462" y="103">MII</text>
  </g>

  <!-- PHY -->
  <g fill="#b0540d">
    <rect x="20" y="128" width="116" height="36" rx="4" />
    <rect x="148" y="128" width="116" height="36" rx="4" />
    <rect x="276" y="128" width="116" height="36" rx="4" />
    <rect x="404" y="128" width="116" height="36" rx="4" />
  </g>
  <g fill="#f8fafd" text-anchor="middle">
    <text x="78" y="151">PHY</text>
    <text x="206" y="151">PHY</text>
    <text x="334" y="151">PHY</text>
    <text x="462" y="151">PHY</text>
  </g>

  <!-- 매체 -->
  <g fill="#337b47">
    <rect x="20" y="180" width="116" height="36" rx="4" />
    <rect x="148" y="180" width="116" height="36" rx="4" />
    <rect x="276" y="180" width="116" height="36" rx="4" />
    <rect x="404" y="180" width="116" height="36" rx="4" />
  </g>
  <g font-size="12" fill="#f8fafd" text-anchor="middle">
    <text x="78" y="202">동축 케이블</text>
    <text x="206" y="202">꼬임쌍선</text>
    <text x="334" y="202">광섬유 케이블</text>
    <text x="462" y="202">전기 백플레인</text>
  </g>

  <text x="20" y="242" font-size="12" fill="#727981">PHY는 속도별 MII로 골라 쓴다. 속도는 1 Mbit/s부터 400 Gbit/s까지</text>
</svg>
