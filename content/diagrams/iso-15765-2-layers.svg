    <rect x="30" y="42" width="116" height="44" rx="2" />
    <rect x="154" y="42" width="134" height="44" rx="2" />
    <rect x="296" y="42" width="116" height="44" rx="2" />
    <rect x="420" y="42" width="116" height="44" rx="2" />
    <rect x="30" y="96" width="506" height="24" rx="2" />
    <rect x="30" y="184" width="506" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="88" y="69">확장 차량 진단</text>
    <text x="221" y="60">OBD</text>
