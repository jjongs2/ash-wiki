<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 526 228" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="283" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">이 표준이 지원하는 응용 계층 프로토콜</text>

  <!-- 응용 계층 프로토콜 -->
