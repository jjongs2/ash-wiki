<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 일반 헤더: 위에서 아래로 -->
  <rect x="110" y="20" width="220" height="32" rx="4" fill="#336fb8" />
  <text x="220" y="41" text-anchor="middle" fill="#f8fafd">Protocol Version</text>
  <rect x="110" y="56" width="220" height="32" rx="4" fill="#336fb8" />
  <text x="220" y="77" text-anchor="middle" fill="#f8fafd">Inverse Protocol Version</text>
  <rect x="110" y="92" width="220" height="40" rx="4" fill="#337b47" />
  <text x="220" y="117" text-anchor="middle" fill="#f8fafd">Payload Type</text>
  <rect x="110" y="136" width="220" height="48" rx="4" fill="#b0540d" />
  <text x="220" y="165" text-anchor="middle" fill="#f8fafd">Payload Length</text>

  <!-- 필드 길이 -->
  <g font-size="12" fill="#727981">
    <text x="342" y="40">1바이트</text>
    <text x="342" y="76">1바이트</text>
    <text x="342" y="116">2바이트</text>
    <text x="342" y="164">4바이트</text>
  </g>
  <path d="M398 20 H406 V184 H398" stroke="#727981" stroke-width="1.5" />
  <text x="414" y="98" font-size="12" fill="#727981">일반 헤더</text>
  <text x="414" y="114" font-size="12" fill="#727981">8바이트</text>

  <!-- 페이로드 -->
  <rect x="110.75" y="200.75" width="218.5" height="58.5" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="220" y="235" text-anchor="middle" fill="#727981">페이로드</text>

  <!-- Payload Length가 페이로드의 바이트 수 -->
  <path d="M108 160 H84 V230 H106" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="76" y="199" text-anchor="end" font-size="12" fill="#727981">바이트 수</text>
</svg>
