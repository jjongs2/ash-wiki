<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 480 240" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="TT 태스크의 activate, preempt, resume과 terminate">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상태 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="200" y="20" width="120" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="40" y="180" width="120" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="360" y="180" width="120" height="40" rx="2" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="45">running</text>
    <text x="100" y="205">preempted</text>
    <text x="420" y="205">suspended</text>
  </g>

  <!-- 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="222" y1="62" x2="106" y2="178" marker-end="url(#arrow)" />
    <line x1="126" y1="178" x2="242" y2="62" marker-end="url(#arrow)" />
    <line x1="298" y1="62" x2="414" y2="178" marker-end="url(#arrow)" />
    <line x1="394" y1="178" x2="278" y2="62" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="152" y="116" text-anchor="end">preempt</text>
    <text x="194" y="132">resume</text>
    <text x="326" y="132" text-anchor="end">activate</text>
    <text x="368" y="116">terminate</text>
  </g>
</svg>
