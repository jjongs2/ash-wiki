<svg xmlns="http://www.w3.org/2000/svg" viewBox="58.5 -6.5 462.5 262" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="SOCE 기준 MPR">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 1년 = 45 단위, 처음 = x 110. SOCE 1 % = 8 단위, 80 % = y 40 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="110" y1="40" x2="470" y2="40" />
    <line x1="110" y1="80" x2="470" y2="80" />
    <line x1="110" y1="120" x2="470" y2="120" />
    <line x1="110" y1="160" x2="470" y2="160" />
    <line x1="335" y1="28" x2="335" y2="190" />
    <line x1="470" y1="28" x2="470" y2="190" />
  </g>

  <!-- 축 -->
  <path d="M110 22 V190 H470" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M104 40 H110 M104 80 H110 M104 120 H110 M104 160 H110 M335 190 V196 M470 190 V196" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="98" y="44">80 %</text>
    <text x="98" y="84">75 %</text>
    <text x="98" y="124">70 %</text>
    <text x="98" y="164">65 %</text>
  </g>
  <text x="110" y="14" text-anchor="middle" fill="var(--text, #727981)">SOCE</text>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="212">처음</text>
    <text x="335" y="212">5년 또는</text>
    <text x="335" y="227">10만 km 가운데</text>
    <text x="335" y="242">먼저 오는 때</text>
    <text x="470" y="212">8년 또는</text>
    <text x="470" y="227">16만 km 가운데</text>
    <text x="470" y="242">먼저 오는 때</text>
  </g>

  <!-- MPR -->
  <g stroke="var(--ink, #727981)" stroke-width="3">
    <line x1="110" y1="40" x2="335" y2="40" />
    <line x1="335" y1="120" x2="470" y2="120" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="3">
    <line x1="110" y1="80" x2="335" y2="80" />
    <line x1="335" y1="160" x2="470" y2="160" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="222.5" y="32">범주 1-1과 1-2</text>
    <text x="222.5" y="72">범주 2</text>
    <text x="402.5" y="112">범주 1-1과 1-2</text>
    <text x="402.5" y="152">범주 2</text>
  </g>
</svg>
