<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4.5 564 127.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="AArch64의 stage 1 변환과 stage 2 변환">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">AArch64의 stage 1 변환과 stage 2 변환</text>

  <!-- 주소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="50" width="96" height="36" rx="2" />
    <rect x="234" y="50" width="96" height="36" rx="2" />
    <rect x="448" y="50" width="96" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="68" y="73">가상 주소</text>
    <text x="282" y="73">IPA</text>
    <text x="496" y="73">물리 주소</text>
  </g>

  <!-- 변환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="118" y1="68" x2="232" y2="68" />
    <line x1="332" y1="68" x2="446" y2="68" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="175" y="60">stage 1 변환</text>
    <text x="175" y="86">게스트 운영체제가</text>
    <text x="175" y="102">다스림</text>
    <text x="389" y="60">stage 2 변환</text>
    <text x="389" y="86">하이퍼바이저가</text>
    <text x="389" y="102">다스림</text>
  </g>
</svg>
