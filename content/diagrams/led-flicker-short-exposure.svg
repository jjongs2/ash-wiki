<svg xmlns="http://www.w3.org/2000/svg" viewBox="75.5 8 404.5 185.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="LED의 켜짐·꺼짐과 짧은 노출">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="110" y="74">LED</text>
    <text x="110" y="135">노출</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="450" y="60">켜짐</text>
    <text x="450" y="90">꺼짐</text>
  </g>

  <!-- 주기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="30" x2="120" y2="56" />
    <line x1="200" y1="30" x2="200" y2="56" />
    <line x1="250" y1="86" x2="250" y2="120" />
    <line x1="270" y1="86" x2="270" y2="120" />
  </g>
  <line x1="122" y1="36" x2="198" y2="36" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="160" y="27" text-anchor="middle" font-size="12" fill="var(--text, #727981)">켜짐과 꺼짐의 주기</text>

  <!-- LED -->
  <path d="M120 86 V56 H160 V86 H200 V56 H240 V86 H280 V56 H320 V86 H360 V56 H400 V86 H440" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />

  <!-- 노출 -->
  <rect x="250" y="120" width="20" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="260" y="166">LED가 꺼진 동안 찍혀</text>
    <text x="260" y="182">꺼진 것처럼 보인다</text>
  </g>
</svg>
