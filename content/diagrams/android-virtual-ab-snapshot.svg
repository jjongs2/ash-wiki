<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 260" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g fill="var(--text, #727981)">
    <text x="20" y="32">legacy A/B</text>
    <text x="20" y="114">Virtual A/B</text>
  </g>

  <!-- legacy A/B -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="42" width="242" height="40" rx="2" />
    <rect x="272" y="42" width="242" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="141" y="66.5">슬롯 _a: 모든 파티션</text>
    <text x="393" y="66.5">슬롯 _b: 모든 파티션</text>
  </g>

  <!-- Virtual A/B -->
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="140">부팅에 꼭 필요한 파티션</text>
    <text x="387" y="140">나머지 파티션(dynamic partition)</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="150" width="95" height="40" rx="2" />
    <rect x="125" y="150" width="95" height="40" rx="2" />
    <rect x="260" y="150" width="122" height="40" rx="2" />
  </g>
  <rect x="392" y="150" width="122" height="40" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="67.5" y="174.5">슬롯 _a</text>
    <text x="172.5" y="174.5">슬롯 _b</text>
    <text x="321" y="174.5">기준 파티션</text>
  </g>
  <text x="453" y="174.5" text-anchor="middle" fill="var(--on-fill, #f8fafd)">압축 스냅샷</text>

  <!-- 병합 -->
  <path d="M453 190 V214 H321 V192" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="514" y="238" font-size="12" text-anchor="end" fill="var(--text, #727981)">새 슬롯으로 부팅에 성공한 것을 확인한 뒤 병합</text>
</svg>
