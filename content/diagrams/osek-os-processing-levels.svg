<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 165" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 처리 레벨: 왼쪽이 낮고 오른쪽이 높다 -->
  <rect x="20" y="20" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="215" y="20" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="410" y="20" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="48">태스크 레벨</text>
    <text x="110" y="70" font-size="12">사용자가 정한 우선순위에</text>
    <text x="110" y="86" font-size="12">따라 스케줄링</text>
    <text x="305" y="65">스케줄러의 논리 레벨</text>
    <text x="500" y="48">인터럽트 레벨</text>
    <text x="500" y="70" font-size="12">인터럽트 우선순위 레벨</text>
    <text x="500" y="86" font-size="12">하나 이상</text>
  </g>

  <!-- 우선순위 축 -->
  <line x1="20" y1="124" x2="588" y2="124" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="144">낮음</text>
    <text x="305" y="144" text-anchor="middle">우선순위</text>
    <text x="590" y="144" text-anchor="end">높음</text>
  </g>
</svg>
