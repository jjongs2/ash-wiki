<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 287.5 304" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="OSEK OS의 처리 레벨과 우선순위">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 처리 레벨: 아래가 낮고 위가 높다 -->
  <rect x="20" y="20" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="20" y="112" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="20" y="204" width="180" height="80" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="48">인터럽트 레벨</text>
    <text x="110" y="70" font-size="12">인터럽트 우선순위 레벨</text>
    <text x="110" y="86" font-size="12">하나 이상</text>
    <text x="110" y="157">스케줄러의 논리 레벨</text>
    <text x="110" y="232">태스크 레벨</text>
    <text x="110" y="254" font-size="12">사용자가 정한 우선순위에</text>
    <text x="110" y="270" font-size="12">따라 스케줄링</text>
  </g>

  <!-- 우선순위 축 -->
  <line x1="220" y1="284" x2="220" y2="22" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="228" y="30">높음</text>
    <text x="228" y="156">우선순위</text>
    <text x="228" y="284">낮음</text>
  </g>
</svg>
