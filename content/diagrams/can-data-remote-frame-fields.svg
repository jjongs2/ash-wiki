<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 10.5 620 154.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 데이터 프레임 -->
  <rect x="100.75" y="50.75" width="42.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="122" y="77" text-anchor="middle" fill="var(--text, #727981)">SOF</text>
  <rect x="148.75" y="50.75" width="98.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="198" y="77" text-anchor="middle" fill="var(--text, #727981)">식별자</text>
  <rect x="252.75" y="50.75" width="42.5" height="42.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="274" y="77" text-anchor="middle" fill="var(--on-fill, #f8fafd)">RTR</text>
  <rect x="300.75" y="50.75" width="78.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="340" y="70" text-anchor="middle" fill="var(--text, #727981)">제어 필드</text>
  <text x="340" y="86" text-anchor="middle" font-size="12" fill="var(--text, #727981)">DLC 포함</text>
  <rect x="384.75" y="50.75" width="98.5" height="42.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="434" y="70" text-anchor="middle" fill="var(--on-fill, #f8fafd)">데이터 필드</text>
  <text x="434" y="86" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">0~8바이트</text>
  <rect x="488.75" y="50.75" width="78.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="528" y="77" text-anchor="middle" fill="var(--text, #727981)">CRC 필드</text>
  <rect x="572.75" y="50.75" width="68.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="607" y="77" text-anchor="middle" fill="var(--text, #727981)">ACK 필드</text>
  <rect x="646.75" y="50.75" width="52.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="673" y="77" text-anchor="middle" fill="var(--text, #727981)">EOF</text>
  <!-- 리모트 프레임과 다른 곳 -->
  <path d="M252 44 V38 H296 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="274" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(데이터 D / 리모트 R)</text>
  <path d="M384 44 V38 H484 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="434" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(리모트 프레임에는 없음)</text>
  <path d="M148 100 V106 H296 V100" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="222" y="123" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 필드</text>
  <!-- 범례 -->
  <text x="100" y="154" font-size="12" fill="var(--text, #727981)">기본 포맷의 데이터 프레임. 색 칸은 리모트 프레임과 다른 곳이다. D: dominant · R: recessive</text>
</svg>
