<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 504 184" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="IVS에서 PSAP로 MSD를 보내는 두 길">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 양 끝 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="20.75" width="78.5" height="158.5" rx="2" />
    <rect x="420.75" y="20.75" width="78.5" height="158.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="60" y="104.5">IVS</text>
    <text x="460" y="104.5">PSAP</text>
  </g>

  <!-- 음성 채널 위 in-band modem, IMS 긴급 통화 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="72" x2="419" y2="72" />
    <line x1="100" y1="128" x2="419" y2="128" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="46">이동통신망과 공중 전화망의 음성 채널</text>
    <text x="260" y="62">in-band modem으로 MSD 전송</text>
    <text x="260" y="148">IMS 긴급 통화</text>
    <text x="260" y="164">SIP 메시지의 body part에 MSD</text>
  </g>

  <!-- PSAP가 확인하지 않으면 in-band로 -->
  <line x1="128" y1="122" x2="128" y2="79" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="138" y="104.5" font-size="12" fill="var(--text, #727981)">PSAP의 확인이 없으면 in-band로 되돌아감</text>
</svg>
