<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10.5 730 168.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="40" fill="var(--text, #727981)">전이중 점대점 링크</text>

  <!-- PTP Instance -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="60" width="150" height="52" rx="4" />
    <rect x="290" y="60" width="150" height="52" rx="4" />
    <rect x="560" y="60" width="150" height="52" rx="4" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="82">Grandmaster</text>
    <text x="95" y="99">PTP Instance</text>
    <text x="365" y="82">PTP Relay</text>
    <text x="365" y="99">Instance</text>
    <text x="635" y="82">PTP End</text>
    <text x="635" y="99">Instance</text>
  </g>

  <!-- 시각 정보 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="170" y1="76" x2="288" y2="76" />
    <line x1="440" y1="76" x2="558" y2="76" />
  </g>

  <!-- 링크마다 피어 지연 측정 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="172" y1="98" x2="288" y2="98" />
    <line x1="442" y1="98" x2="558" y2="98" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="230" y="66">Sync, Follow_Up</text>
    <text x="500" y="66">Sync, Follow_Up</text>
    <text x="230" y="118">피어 지연 측정</text>
    <text x="500" y="118">피어 지연 측정</text>
    <text x="365" y="140">correctionField에 더함</text>
    <text x="365" y="158">상류 링크 전파 지연 + 체류 시간</text>
  </g>
</svg>
