<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 10 514 269" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="센서와 액추에이터를 다스리는 세 방식">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M100 48 V90 M100 134 V164" />
    <path d="M272 48 V90 M272 134 V164" />
    <path d="M444 48 V164" />
  </g>
  <text x="452" y="110" font-size="12" fill="var(--text, #727981)">전용 신호선</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40.75" y="20.75" width="462.5" height="26.5" />
    <rect x="25.75" y="90.75" width="148.5" height="42.5" />
    <rect x="197.75" y="90.75" width="148.5" height="42.5" />
    <rect x="25.75" y="164.75" width="148.5" height="26.5" />
    <rect x="197.75" y="164.75" width="148.5" height="26.5" />
    <rect x="369.75" y="164.75" width="148.5" height="26.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="272" y="38">존 제어기</text>
    <text x="100" y="108">칩</text>
    <text x="100" y="125" font-size="11">국소 지능·통신 인터페이스</text>
    <text x="272" y="116">작은 ECU</text>
    <text x="100" y="182">센서·액추에이터</text>
    <text x="272" y="182">복잡한 센서·액추에이터</text>
    <text x="444" y="182">단순한 센서·액추에이터</text>
  </g>

  <!-- 풀이 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="100" y="216">칩이 스스로 다스린다</text>
    <text x="272" y="216">레이더 위성 센서,</text>
    <text x="272" y="232">모터가 여럿인 시트 제어 장치</text>
    <text x="444" y="216">존 제어기가 바로 다스린다</text>
    <text x="272" y="266">TI 백서에 따른 세 방식</text>
  </g>
</svg>
