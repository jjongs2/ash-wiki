<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 5 527 202" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--red, #bb464d)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTAL-TA 강의계획서</text>

  <!-- 주 시나리오: 윗줄 전체 -->
  <text x="75" y="64.5" text-anchor="end" fill="var(--text, #727981)">주 시나리오</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M155 60 H193" />
    <path d="M265 60 H303" />
    <path d="M375 60 H413" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="85" y="44" width="70" height="32" rx="2" />
    <rect x="195" y="44" width="70" height="32" rx="2" />
    <rect x="305" y="44" width="70" height="32" rx="2" />
    <rect x="415" y="44" width="110" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="64.5">동작</text>
    <text x="230" y="64.5">동작</text>
    <text x="340" y="64.5">동작</text>
    <text x="470" y="64.5">목표를 이룸</text>
  </g>

  <!-- 확장: 첫 동작에서 갈라져 셋째 동작으로 합류 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <path d="M120 76 V120 H193" />
    <path d="M265 120 H325 V78" />
  </g>
  <rect x="195" y="104" width="70" height="32" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <text x="230" y="124.5" text-anchor="middle" fill="var(--on-fill, #f8fafd)">동작</text>
  <text x="114" y="102" text-anchor="end" fill="var(--text, #727981)">확장</text>

  <!-- 예외: 셋째 동작에서 갈라져 목표를 이루지 못함 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5" marker-end="url(#arrow-red)">
    <path d="M355 76 V162" />
    <path d="M375 180 H413" />
  </g>
  <g stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)">
    <rect x="305" y="164" width="70" height="32" rx="2" />
    <rect x="415" y="164" width="110" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="340" y="184.5">동작</text>
    <text x="470" y="184.5">목표를 이루지 못함</text>
  </g>
  <text x="361" y="102" fill="var(--text, #727981)">예외</text>
</svg>
