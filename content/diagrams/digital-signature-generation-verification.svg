<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 -5.75 519.5 306" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="60" y="12" font-size="12" fill="var(--text, #727981)">RSA, ECDSA, HashEdDSA</text>

  <!-- 두 쪽과 그 키 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="20" width="140" height="32" rx="2" />
    <rect x="360" y="20" width="140" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="41">서명자</text>
    <text x="430" y="41">검증자</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="52" x2="130" y2="64" />
    <line x1="430" y1="52" x2="430" y2="64" />
    <line x1="130" y1="92" x2="130" y2="290" />
    <line x1="430" y1="92" x2="430" y2="290" />
  </g>
  <rect x="90" y="64" width="80" height="28" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <text x="130" y="83" text-anchor="middle" fill="var(--on-fill, #f8fafd)">개인 키</text>
  <rect x="370" y="64" width="120" height="28" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <text x="430" y="83" text-anchor="middle" fill="var(--on-fill, #f8fafd)">서명자의 공개 키</text>

  <!-- 생성 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="138" y="124">승인된 해시 함수로 다이제스트를</text>
    <text x="138" y="140">구해 개인 키로 서명 생성</text>
  </g>

  <!-- 보냄 -->
  <line x1="132" y1="164" x2="428" y2="180" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터와 서명</text>

  <!-- 검증 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="438" y="210">받은 데이터에서 같은 해시</text>
    <text x="438" y="226">함수로 다이제스트를 다시</text>
    <text x="438" y="242">구해 공개 키로 서명 검증</text>
    <text x="438" y="274">서명한 뒤 데이터가</text>
    <text x="438" y="290">바뀌었는지 알아냄</text>
  </g>
</svg>
