<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 341" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="레벨 3과 레벨 4·5의 DDT fallback">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">ISO/SAE PAS 22736:2021</text>

  <!-- 레벨마다 DDT fallback의 계기: 레벨 5의 ODD는 제한이 없다 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="188" y="48">DDT 관련</text>
    <text x="188" y="63">시스템 failure</text>
    <text x="188" y="78">또는 ODD exit</text>
    <text x="310" y="48">DDT 관련</text>
    <text x="310" y="63">시스템 failure</text>
    <text x="310" y="78">또는 ODD exit</text>
    <text x="432" y="63">DDT 관련</text>
    <text x="432" y="78">시스템 failure</text>
  </g>

  <!-- 상자: 모두 폭 104 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="136" y="106" width="104" height="46" rx="2" />
    <rect x="258" y="106" width="104" height="46" rx="2" />
    <rect x="380" y="106" width="104" height="46" rx="2" />
    <rect x="136" y="190" width="104" height="46" rx="2" />
    <rect x="20" y="274" width="104" height="46" rx="2" />
    <rect x="136" y="274" width="104" height="46" rx="2" />
    <rect x="258" y="274" width="104" height="46" rx="2" />
    <rect x="380" y="274" width="104" height="46" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="188" y="134">레벨 3 ADS</text>
    <text x="310" y="134">레벨 4 ADS</text>
    <text x="432" y="134">레벨 5 ADS</text>
    <text x="188" y="210">fallback-</text>
    <text x="188" y="227">ready user</text>
    <text x="72" y="294">DDT를</text>
    <text x="72" y="311">이어 수행</text>
    <text x="188" y="294">minimal risk</text>
    <text x="188" y="311">condition</text>
    <text x="310" y="294">minimal risk</text>
    <text x="310" y="311">condition</text>
    <text x="432" y="294">minimal risk</text>
    <text x="432" y="311">condition</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="188" y1="84" x2="188" y2="104" marker-end="url(#arrow)" />
    <line x1="310" y1="84" x2="310" y2="104" marker-end="url(#arrow)" />
    <line x1="432" y1="84" x2="432" y2="104" marker-end="url(#arrow)" />
    <line x1="188" y1="152" x2="188" y2="188" marker-end="url(#arrow)" />
    <line x1="188" y1="236" x2="188" y2="272" marker-end="url(#arrow)" />
    <polyline points="136,213 72,213 72,272" marker-end="url(#arrow)" />
    <line x1="310" y1="152" x2="310" y2="272" marker-end="url(#arrow)" />
    <line x1="432" y1="152" x2="432" y2="272" marker-end="url(#arrow)" />
  </g>
  <text x="196" y="174" font-size="12" fill="var(--text, #727981)">개입 요청</text>
</svg>
