<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 319" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="레벨 3과 레벨 4·5의 DDT fallback">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">ISO/SAE PAS 22736:2021</text>

  <!-- 레벨마다 DDT fallback의 계기: 레벨 5의 ODD는 제한이 없다 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="100" y="52">DDT 관련 시스템 failure</text>
    <text x="100" y="68">또는 ODD exit</text>
    <text x="280" y="52">DDT 관련 시스템 failure</text>
    <text x="280" y="68">또는 ODD exit</text>
    <text x="460" y="68">DDT 관련 시스템 failure</text>
  </g>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="98" width="160" height="40" rx="2" />
    <rect x="200" y="98" width="160" height="40" rx="2" />
    <rect x="380" y="98" width="160" height="40" rx="2" />
    <rect x="20" y="178" width="160" height="40" rx="2" />
    <rect x="20" y="258" width="160" height="40" rx="2" />
    <rect x="200" y="258" width="340" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="123">레벨 3 ADS</text>
    <text x="280" y="123">레벨 4 ADS</text>
    <text x="460" y="123">레벨 5 ADS</text>
    <text x="100" y="203">fallback-ready user</text>
    <text x="100" y="283">DDT를 이어 수행</text>
    <text x="370" y="283">minimal risk condition</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="100" y1="76" x2="100" y2="96" marker-end="url(#arrow)" />
    <line x1="280" y1="76" x2="280" y2="96" marker-end="url(#arrow)" />
    <line x1="460" y1="76" x2="460" y2="96" marker-end="url(#arrow)" />
    <line x1="100" y1="138" x2="100" y2="176" marker-end="url(#arrow)" />
    <line x1="100" y1="218" x2="100" y2="256" marker-end="url(#arrow)" />
    <polyline points="180,198 240,198 240,256" marker-end="url(#arrow)" />
    <line x1="280" y1="138" x2="280" y2="256" marker-end="url(#arrow)" />
    <line x1="460" y1="138" x2="460" y2="256" marker-end="url(#arrow)" />
  </g>
  <text x="110" y="162" font-size="12" fill="var(--text, #727981)">개입 요청</text>
</svg>
