<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -6.5 428.5 159" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 열 머리 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="72" y="22">a</text>
    <text x="144" y="22">b</text>
    <text x="216" y="22">a &amp;&amp; b</text>
  </g>

  <!-- 기본 칸 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="184" y="32" width="64" height="28" rx="2" />
    <rect x="112" y="68" width="64" height="28" rx="2" />
    <rect x="184" y="68" width="64" height="28" rx="2" />
    <rect x="40" y="104" width="64" height="28" rx="2" />
    <rect x="184" y="104" width="64" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="216" y="50">참</text>
    <text x="144" y="86">참</text>
    <text x="216" y="86">거짓</text>
    <text x="72" y="122">참</text>
    <text x="216" y="122">거짓</text>
  </g>

  <!-- a의 독립성 쌍 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="40" y="32" width="64" height="28" rx="2" />
    <rect x="40" y="68" width="64" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="72" y="50">참</text>
    <text x="72" y="86">거짓</text>
  </g>
  <path d="M34 46 H22 V82 H34" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="14" y="68" text-anchor="end" fill="var(--text, #727981)">a의 독립성 쌍</text>

  <!-- b의 독립성 쌍 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="112" y="32" width="64" height="28" rx="2" />
    <rect x="112" y="104" width="64" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="144" y="50">참</text>
    <text x="144" y="122">거짓</text>
  </g>
  <path d="M254 46 H266 V118 H254" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="274" y="86" fill="var(--text, #727981)">b의 독립성 쌍</text>
</svg>
