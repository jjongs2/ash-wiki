<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 -1.5 372.5 386.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="처리 시간 Wi(t)와 확인할 태스크 주기의 배수">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 축 -->
  <line x1="80" y1="320" x2="398" y2="320" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="80" y1="320" x2="80" y2="22" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="404" y="324" font-style="italic">t</text>
    <text x="90" y="28">처리 시간</text>
    <text x="80" y="338" text-anchor="middle">0</text>
    <text x="320" y="338" text-anchor="middle"><tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  </g>

  <!-- 대각선 t -->
  <line x1="80" y1="320" x2="360" y2="40" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="368" y="44" font-size="12" font-style="italic" fill="var(--text, #727981)">t</text>

  <!-- W_i(t) 계단 -->
  <path d="M80 200 H240 V160 H320" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="var(--text, #727981)"><tspan font-style="italic">W</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">t</tspan>)</text>

  <!-- 확인할 t -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="240" y1="205" x2="240" y2="320" />
    <line x1="320" y1="165" x2="320" y2="320" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="240" cy="200" r="4" />
    <circle cx="320" cy="160" r="4" />
  </g>
  <text x="332" y="164" font-size="12" fill="var(--text, #727981)"><tspan font-style="italic">W</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">t</tspan>) ≤ <tspan font-style="italic">t</tspan></text>
  <text x="240" y="362" text-anchor="middle" font-size="12" fill="var(--text, #727981)">확인할 <tspan font-style="italic">t</tspan>: 태스크 주기의 배수, 0 &lt; <tspan font-style="italic">t</tspan> ≤ <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
</svg>
