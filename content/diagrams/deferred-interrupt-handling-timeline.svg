<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -9.5 519 196.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="20" fill="var(--text, #727981)">FreeRTOS</text>

  <!-- 줄 이름 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="57">ISR</text>
    <text x="20" y="85.5">처리 태스크</text>
    <text x="20" y="99.5">(높은 우선순위)</text>
    <text x="20" y="121.5">끊긴 태스크</text>
    <text x="20" y="135.5">(낮은 우선순위)</text>
  </g>

  <!-- 인터럽트 -->
  <line x1="181" y1="26" x2="181" y2="142" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="181" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인터럽트</text>

  <!-- ISR -->
  <rect x="181.75" y="40.75" width="63.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="213.5" y="56" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">ISR</text>
  <text x="254" y="56" font-size="12" fill="var(--text, #727981)">원인 기록, 인터럽트 지움, 블록 풀기</text>

  <!-- 처리 태스크 -->
  <rect x="106.75" y="76.75" width="138.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="176" y="92" text-anchor="middle" font-size="12" fill="var(--text, #727981)">블록</text>
  <rect x="246.75" y="76.75" width="128.5" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="311" y="92" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">나머지 처리</text>
  <rect x="376.75" y="76.75" width="73.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="413.5" y="92" text-anchor="middle" font-size="12" fill="var(--text, #727981)">블록</text>

  <!-- 끊긴 태스크 -->
  <rect x="106.75" y="112.75" width="73.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="143.5" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <rect x="181.75" y="112.75" width="193.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="278.5" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">끊김</text>
  <rect x="376.75" y="112.75" width="73.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="413.5" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">이어서 실행</text>

  <!-- 시간 축 -->
  <line x1="106" y1="142" x2="471" y2="142" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="479" y="146" font-size="12" fill="var(--text, #727981)">시간</text>
  <line x1="246" y1="142" x2="246" y2="150" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="246" y="166" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ISR에서 곧바로 처리 태스크로</text>
</svg>
