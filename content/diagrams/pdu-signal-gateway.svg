<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 1 500 348.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- PDU 게이트웨이 -->
  <text x="20" y="22" fill="var(--text, #727981)">PDU 게이트웨이</text>
  <text x="80" y="62" text-anchor="middle" font-size="12" fill="var(--text, #727981)">받은 I-PDU</text>
  <rect x="20.75" y="70.75" width="118.5" height="30.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="200.75" y="70.75" width="98.5" height="30.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="380.75" y="44.75" width="118.5" height="30.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="380.75" y="96.75" width="118.5" height="30.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="80" y="91">I-PDU</text>
    <text x="250" y="91">PDU Router</text>
    <text x="440" y="65">I-PDU</text>
    <text x="440" y="117">I-PDU</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="86" x2="198" y2="86" marker-end="url(#arrow)" />
    <path d="M300 86 H338 V60 H378" marker-end="url(#arrow)" />
    <path d="M338 86 V112 H378" marker-end="url(#arrow)" />
  </g>
  <text x="20" y="152" font-size="12" fill="var(--text, #727981)">I-PDU를 고치지 않고 여러 목적지로 한꺼번에 보낸다 (1:n).</text>

  <!-- 시그널 게이트웨이 -->
  <text x="20" y="196" fill="var(--text, #727981)">시그널 게이트웨이</text>
  <text x="80" y="226" text-anchor="middle" font-size="12" fill="var(--text, #727981)">받은 I-PDU</text>
  <text x="440" y="250" text-anchor="middle" font-size="12" fill="var(--text, #727981)">송신할 I-PDU</text>
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="20.75" y="234.75" width="56.5" height="30.5" />
    <rect x="82.75" y="282.75" width="56.5" height="30.5" />
    <rect x="380.75" y="258.75" width="56.5" height="30.5" />
    <rect x="442.75" y="258.75" width="56.5" height="30.5" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="82.75" y="234.75" width="56.5" height="30.5" fill="var(--surface, none)" />
    <rect x="20.75" y="282.75" width="56.5" height="30.5" fill="var(--surface, none)" />
  </g>
  <rect x="200.75" y="234.75" width="98.5" height="78.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12">
    <text x="49" y="254" fill="var(--on-fill, #f8fafd)">시그널</text>
    <text x="111" y="254" fill="var(--text, #727981)">시그널</text>
    <text x="49" y="302" fill="var(--text, #727981)">시그널</text>
    <text x="111" y="302" fill="var(--on-fill, #f8fafd)">시그널</text>
    <text x="409" y="278" fill="var(--on-fill, #f8fafd)">시그널</text>
    <text x="471" y="278" fill="var(--on-fill, #f8fafd)">시그널</text>
  </g>
  <text x="250" y="279" text-anchor="middle" fill="var(--on-fill, #f8fafd)">COM</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="250" x2="198" y2="250" marker-end="url(#arrow)" />
    <line x1="140" y1="298" x2="198" y2="298" marker-end="url(#arrow)" />
    <line x1="300" y1="274" x2="378" y2="274" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="170" y="278">unpacking</text>
    <text x="339" y="266">packing</text>
  </g>
  <text x="20" y="338" font-size="12" fill="var(--text, #727981)">받은 I-PDU에서 시그널을 꺼내 송신할 I-PDU로 옮긴다.</text>
</svg>
