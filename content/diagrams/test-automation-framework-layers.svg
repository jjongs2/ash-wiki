<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 4.5 367 250" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--red, #bb464d)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">CTAL-TAE 강의계획서가 예로 든 TAF의 세 층</text>

  <!-- 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="220" height="48" rx="2" />
    <rect x="20" y="118" width="220" height="48" rx="2" />
    <rect x="20" y="196" width="220" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="60">테스트 스크립트</text>
    <text x="130" y="78" font-size="12">테스트 케이스 저장소</text>
    <text x="130" y="138">비즈니스 로직</text>
    <text x="130" y="156" font-size="12">SUT에 기대는 라이브러리</text>
    <text x="130" y="216">핵심 라이브러리</text>
    <text x="130" y="234" font-size="12">SUT와 상관없는 라이브러리</text>
  </g>

  <!-- 부르는 관계 -->
  <line x1="130" y1="88" x2="130" y2="116" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="138" y="107" font-size="12" fill="var(--text, #727981)">서비스를 부름</text>

  <!-- 바로 부르지 않는 관계 -->
  <path d="M240 64 H272 V220 H242" stroke="var(--red, #bb464d)" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <g stroke="var(--red, #bb464d)" stroke-width="1.5">
    <line x1="266" y1="136" x2="278" y2="148" />
    <line x1="278" y1="136" x2="266" y2="148" />
  </g>
  <text x="288" y="146" font-size="12" fill="var(--text, #727981)">바로 부르지 않음</text>
</svg>
