<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 526 322" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="Manifest의 종류와 함께 묶이는 소프트웨어">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 함께 묶이는 짝 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="140.75" y="30.75" width="270.5" height="66.5" rx="2" />
    <rect x="140.75" y="112.75" width="270.5" height="66.5" rx="2" />
    <rect x="140.75" y="194.75" width="270.5" height="66.5" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <!-- Application Design -->
    <rect x="20" y="80" width="90" height="50" rx="2" />
    <!-- Manifest -->
    <rect x="148" y="38" width="120" height="52" rx="2" />
    <rect x="148" y="120" width="120" height="52" rx="2" />
    <rect x="148" y="202" width="120" height="52" rx="2" />
    <!-- 함께 묶이는 소프트웨어 -->
    <rect x="274" y="38" width="130" height="52" rx="2" />
    <rect x="274" y="120" width="130" height="52" rx="2" />
    <rect x="274" y="202" width="130" height="52" rx="2" />
    <!-- Machine -->
    <rect x="442" y="30" width="64" height="232" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="101">Application</text>
    <text x="65" y="118">Design</text>
    <text x="208" y="60">Execution</text>
    <text x="208" y="77">Manifest</text>
    <text x="208" y="142">Service Instance</text>
    <text x="208" y="159">Manifest</text>
    <text x="208" y="224">Machine</text>
    <text x="208" y="241">Manifest</text>
    <text x="474" y="150.5" font-size="14">Machine</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="339" y="68">실행 코드</text>
    <text x="339" y="142">서비스 지향 통신을</text>
    <text x="339" y="158">쓰는 실행 코드</text>
    <text x="339" y="216">Adaptive Platform</text>
    <text x="339" y="232">인스턴스를 세우는</text>
    <text x="339" y="248">소프트웨어</text>
    <text x="65" y="150">배치를</text>
    <text x="65" y="165">정하는 것을</text>
    <text x="65" y="180">돕는다</text>
  </g>
  <!-- Application Design이 배치를 정하는 것을 돕는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="95" x2="146" y2="68" />
    <line x1="110" y1="115" x2="146" y2="142" />
  </g>
  <!-- Machine에 올린다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="412" y1="64" x2="440" y2="64" />
    <line x1="412" y1="146" x2="440" y2="146" />
    <line x1="412" y1="228" x2="440" y2="228" />
  </g>

  <!-- 범례 -->
  <rect x="20.75" y="282.75" width="26.5" height="16.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="56" y="295.5" font-size="12" fill="var(--text, #727981)">함께 묶이는 Manifest와 소프트웨어</text>
</svg>
