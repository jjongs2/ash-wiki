<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 270" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 함께 묶이는 짝 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="200.75" y="30.75" width="408.5" height="58.5" rx="2" />
    <rect x="200.75" y="105.75" width="408.5" height="58.5" rx="2" />
    <rect x="200.75" y="180.75" width="408.5" height="58.5" rx="2" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <!-- Application Design -->
    <rect x="20" y="80" width="130" height="50" rx="2" />
    <!-- Manifest -->
    <rect x="215" y="42" width="180" height="36" rx="2" />
    <rect x="215" y="117" width="180" height="36" rx="2" />
    <rect x="215" y="192" width="180" height="36" rx="2" />
    <!-- 함께 묶이는 소프트웨어 -->
    <rect x="405" y="42" width="190" height="36" rx="2" />
    <rect x="405" y="117" width="190" height="36" rx="2" />
    <rect x="405" y="192" width="190" height="36" rx="2" />
    <!-- Machine -->
    <rect x="670" y="30" width="100" height="210" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="101">Application</text>
    <text x="85" y="118">Design</text>
    <text x="305" y="64.5">Execution Manifest</text>
    <text x="305" y="139.5">Service Instance Manifest</text>
    <text x="305" y="214.5">Machine Manifest</text>
    <text x="720" y="139.5">Machine</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="500" y="64.5">실행 코드</text>
    <text x="500" y="139.5">서비스 지향 통신을 쓰는 실행 코드</text>
    <text x="500" y="207">Adaptive Platform 인스턴스를</text>
    <text x="500" y="222">세우는 소프트웨어</text>
    <text x="85" y="150">배치를 정하는 것을</text>
    <text x="85" y="165">돕는다</text>
  </g>

  <!-- Application Design이 배치를 정하는 것을 돕는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="95" x2="213" y2="62" />
    <line x1="150" y1="115" x2="213" y2="133" />
  </g>
  <!-- Machine에 올린다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="610" y1="60" x2="668" y2="60" />
    <line x1="610" y1="135" x2="668" y2="135" />
    <line x1="610" y1="210" x2="668" y2="210" />
  </g>
</svg>
