<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- System Template의 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="180" height="36" rx="2" />
    <rect x="20" y="110" width="180" height="36" rx="2" />
    <rect x="20" y="200" width="180" height="36" rx="2" />
    <rect x="20" y="290" width="180" height="36" rx="2" />
    <rect x="300" y="290" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="43">SW-C의 data element</text>
    <text x="110" y="133">System Signal</text>
    <text x="110" y="223">ISignal</text>
    <text x="110" y="313">ISignalToIPduMapping</text>
    <text x="350" y="313">I-PDU</text>
  </g>

  <!-- AUTOSAR COM 설정 -->
  <rect x="20.75" y="400.75" width="178.5" height="34.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="110" y="423" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ComSignal</text>
  <text x="110" y="458" text-anchor="middle" font-size="12" fill="var(--text, #727981)">AUTOSAR COM 설정</text>
  <text x="350" y="348" text-anchor="middle" font-size="12" fill="var(--text, #727981)">System Template</text>

  <!-- 관계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="58" x2="110" y2="108" marker-end="url(#arrow)" />
    <line x1="110" y1="198" x2="110" y2="148" marker-end="url(#arrow)" />
    <line x1="110" y1="288" x2="110" y2="238" marker-end="url(#arrow)" />
    <line x1="202" y1="308" x2="298" y2="308" marker-end="url(#arrow)" />
    <line x1="110" y1="398" x2="110" y2="328" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="118" y="87">SenderReceiverToSignalMapping</text>
    <text x="118" y="177">가리킨다</text>
    <text x="118" y="267">I-PDU에 넣는다</text>
    <text x="250" y="298" text-anchor="middle">자리</text>
    <text x="118" y="367">참조(매핑마다 하나)</text>
  </g>
</svg>
