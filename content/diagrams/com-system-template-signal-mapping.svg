<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- System Template의 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="180" height="36" rx="4" />
    <rect x="420" y="20" width="180" height="36" rx="4" />
    <rect x="420" y="110" width="180" height="36" rx="4" />
    <rect x="420" y="200" width="180" height="36" rx="4" />
    <rect x="680" y="200" width="100" height="36" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="43">SW-C의 data element</text>
    <text x="510" y="43">System Signal</text>
    <text x="510" y="133">ISignal</text>
    <text x="510" y="223">ISignalToIPduMapping</text>
    <text x="730" y="223">I-PDU</text>
  </g>

  <!-- AUTOSAR COM 설정 -->
  <rect x="20.75" y="200.75" width="178.5" height="34.5" rx="4" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="110" y="223" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ComSignal</text>
  <text x="110" y="258" text-anchor="middle" font-size="12" fill="var(--text, #727981)">AUTOSAR COM 설정</text>

  <!-- 관계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="202" y1="38" x2="418" y2="38" marker-end="url(#arrow)" />
    <line x1="510" y1="108" x2="510" y2="58" marker-end="url(#arrow)" />
    <line x1="510" y1="198" x2="510" y2="148" marker-end="url(#arrow)" />
    <line x1="602" y1="218" x2="678" y2="218" marker-end="url(#arrow)" />
    <line x1="202" y1="218" x2="418" y2="218" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="310" y="30" text-anchor="middle">SenderReceiverToSignalMapping</text>
    <text x="518" y="87">가리킨다</text>
    <text x="518" y="177">I-PDU에 넣는다</text>
    <text x="640" y="208" text-anchor="middle">자리</text>
    <text x="310" y="210" text-anchor="middle">참조</text>
    <text x="310" y="236" text-anchor="middle">매핑마다 하나</text>
  </g>
</svg>
