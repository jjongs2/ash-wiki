<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 4 660 228" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="master switch와 slave switch의 포트 역할">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- host ECU와 스위치 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="20" width="140" height="36" rx="2" />
    <rect x="40" y="120" width="220" height="50" rx="2" />
    <rect x="460" y="120" width="220" height="50" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="43">host ECU</text>
    <text x="150" y="150">master switch</text>
    <text x="570" y="150">slave switch</text>
  </g>

  <!-- 링크 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="56" x2="130" y2="114" />
    <line x1="266" y1="145" x2="454" y2="145" />
    <line x1="80" y1="176" x2="80" y2="196" />
    <line x1="120" y1="176" x2="120" y2="196" />
    <line x1="560" y1="176" x2="560" y2="196" />
    <line x1="600" y1="176" x2="600" y2="196" />
  </g>

  <!-- 포트 -->
  <rect x="124" y="114" width="12" height="12" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="254" y="139" width="12" height="12" />
    <rect x="454" y="139" width="12" height="12" />
  </g>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="74" y="164" width="12" height="12" />
    <rect x="114" y="164" width="12" height="12" />
    <rect x="554" y="164" width="12" height="12" />
    <rect x="594" y="164" width="12" height="12" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="144" y="104">host port</text>
    <text x="272" y="134">up link port</text>
    <text x="448" y="134" text-anchor="end">up link port</text>
    <text x="100" y="216" text-anchor="middle">보통 포트</text>
    <text x="580" y="216" text-anchor="middle">보통 포트</text>
  </g>
</svg>
