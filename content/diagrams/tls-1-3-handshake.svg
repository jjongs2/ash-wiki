<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 9.5 583 477.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130" y="20" width="140" height="32" rx="2" />
    <rect x="450" y="20" width="140" height="32" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="200" y="41">클라이언트</text>
    <text x="520" y="41">서버</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="52" x2="200" y2="450" />
    <line x1="520" y1="52" x2="520" y2="450" />
  </g>

  <!-- 늘 보내는 메시지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="202" y1="100" x2="518" y2="100" />
    <line x1="518" y1="150" x2="202" y2="150" />
    <line x1="518" y1="186" x2="202" y2="186" />
    <line x1="518" y1="322" x2="202" y2="322" />
    <line x1="202" y1="434" x2="518" y2="434" />
  </g>
  <!-- 조건에 따라 보내는 메시지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)">
    <line x1="518" y1="220" x2="202" y2="220" />
    <line x1="518" y1="254" x2="202" y2="254" />
    <line x1="518" y1="288" x2="202" y2="288" />
    <line x1="202" y1="366" x2="518" y2="366" />
    <line x1="202" y1="400" x2="518" y2="400" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="360" y="78">ClientHello</text>
    <text x="360" y="94" font-size="12">key_share나 pre_shared_key</text>
    <text x="360" y="128">ServerHello</text>
    <text x="360" y="144" font-size="12">비대칭 키 교환이면 key_share</text>
    <text x="360" y="180">EncryptedExtensions</text>
    <text x="360" y="214">CertificateRequest</text>
    <text x="360" y="248">Certificate</text>
    <text x="360" y="282">CertificateVerify</text>
    <text x="360" y="316">Finished</text>
    <text x="360" y="360">Certificate</text>
    <text x="360" y="394">CertificateVerify</text>
    <text x="360" y="428">Finished</text>
  </g>

  <!-- 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M150 66 H144 V156 H150" />
    <path d="M570 168 H576 V440 H570" />
  </g>
  <text x="136" y="108" text-anchor="end" fill="var(--text, #727981)">공유 키를 정함</text>
  <text x="136" y="124" text-anchor="end" font-size="12" fill="var(--text, #727981)">한 번의 왕복</text>
  <text x="584" y="309" fill="var(--text, #727981)">암호화</text>

  <!-- 단계 번호 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M192 64 H186 V106 H192" />
    <path d="M192 114 H186 V156 H192" />
    <path d="M192 168 H186 V328 H192" />
    <path d="M192 348 H186 V440 H192" />
  </g>
  <g font-size="12" text-anchor="end" fill="var(--text, #727981)">
    <text x="180" y="89">1</text>
    <text x="180" y="139">2</text>
    <text x="180" y="252">3</text>
    <text x="180" y="398">4</text>
  </g>

  <!-- 범례 -->
  <line x1="200" y1="472" x2="240" y2="472" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="248" y="476" font-size="12" fill="var(--text, #727981)">조건에 따라 보냄</text>
</svg>
