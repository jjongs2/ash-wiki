    <rect x="86" y="139" width="48" height="26" rx="2" />
    <rect x="266" y="47" width="48" height="26" rx="2" />
    <rect x="326" y="47" width="48" height="26" rx="2" />
    <rect x="266" y="139" width="48" height="26" rx="2" />
    <rect x="326" y="139" width="48" height="26" rx="2" />
    <rect x="476" y="47" width="48" height="26" rx="2" />
    <rect x="536" y="47" width="48" height="26" rx="2" />
    <rect x="456" y="155" width="48" height="26" rx="2" />
    <rect x="566" y="155" width="48" height="26" rx="2" />
