    <text x="110" y="156.5">노드</text>
    <text x="290" y="64.5">노드</text>
    <text x="350" y="64.5">노드</text>
    <text x="290" y="156.5">노드</text>
    <text x="350" y="156.5">노드</text>
    <text x="500" y="64.5">노드</text>
    <text x="560" y="64.5">노드</text>
    <text x="480" y="172.5">노드</text>
    <text x="590" y="172.5">노드</text>
