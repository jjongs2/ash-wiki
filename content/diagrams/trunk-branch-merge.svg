<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 515 170.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <text x="20" y="34" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 24765 용어집</text>

  <!-- trunk -->
  <text x="20" y="69" fill="var(--text, #727981)">trunk</text>
  <line x1="68" y1="64" x2="495" y2="64" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g fill="var(--ink, #727981)">
    <circle cx="105" cy="64" r="4" />
    <circle cx="185" cy="64" r="4" />
    <circle cx="355" cy="64" r="4" />
    <circle cx="425" cy="64" r="4" />
  </g>
  <text x="105" y="90" font-size="12" text-anchor="middle" fill="var(--text, #727981)">커밋</text>

  <!-- 브랜치와 병합 -->
  <path d="M185 64 L221 124 H295 L349 72" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <g fill="var(--blue, #336fb8)">
    <circle cx="238" cy="124" r="4" />
    <circle cx="278" cy="124" r="4" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="258" y="150" text-anchor="middle">브랜치</text>
    <text x="334" y="112">병합</text>
  </g>

  <!-- 태그 -->
  <rect x="397" y="20" width="56" height="26" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="425" y="38" text-anchor="middle" fill="var(--text, #727981)">태그</text>
  <line x1="425" y1="46" x2="425" y2="60" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
</svg>
