<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 기기 -->
  <rect x="20" y="20" width="280" height="320" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="36" y="44" fill="var(--text, #727981)">기기</text>

  <!-- 기능 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="64" width="240" height="40" rx="2" />
    <rect x="40" y="170" width="240" height="52" rx="2" />
    <rect x="40" y="268" width="240" height="52" rx="2" />
    <rect x="520" y="64" width="200" height="40" rx="2" />
    <rect x="520" y="170" width="200" height="52" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="88.5">Status tracker 클라이언트</text>
    <text x="160" y="191">Firmware consumer</text>
    <text x="160" y="209" font-size="12">매니페스트 검증, 이미지 저장</text>
    <text x="160" y="289">부트로더</text>
    <text x="160" y="307" font-size="12">리셋 뒤 실행할 코드를 정함</text>
    <text x="620" y="88.5">Status tracker 서버</text>
    <text x="620" y="191">Firmware server</text>
    <text x="620" y="209" font-size="12">이미지와 매니페스트를 저장</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="520" y1="76" x2="282" y2="76" />
    <line x1="280" y1="92" x2="518" y2="92" />
    <line x1="520" y1="206" x2="282" y2="206" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="410" y="40">새 펌웨어 버전을 알림</text>
    <text x="410" y="56">업데이트를 원격으로 시작</text>
    <text x="410" y="124">기기의 소프트웨어·하드웨어 특성</text>
    <text x="410" y="196">펌웨어 이미지와 매니페스트</text>
  </g>
</svg>
