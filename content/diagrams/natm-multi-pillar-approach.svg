<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 557 198" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="NATM 지침의 multi-pillar 접근">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">NATM 지침(ECE/TRANS/WP.29/2023/44/Rev.1)</text>

  <!-- 시나리오 카탈로그와 다섯 검증 방법 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="180" y="44" width="180" height="40" rx="2" />
    <rect x="20" y="132" width="92" height="46" rx="2" />
    <rect x="122" y="132" width="92" height="46" rx="2" />
    <rect x="224" y="132" width="92" height="46" rx="2" />
    <rect x="326" y="132" width="92" height="46" rx="2" />
    <rect x="428" y="132" width="92" height="46" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="270" y="69">시나리오 카탈로그</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="66" y="151">시뮬레이션·</text>
    <text x="66" y="168">가상 테스트</text>
    <text x="168" y="160">시험로 시험</text>
    <text x="270" y="160">실도로 시험</text>
    <text x="372" y="160">감사·평가</text>
    <text x="474" y="151">운행 중</text>
    <text x="474" y="168">모니터링·보고</text>
  </g>

  <!-- 카탈로그를 각 방법이 쓴다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="270" y1="84" x2="270" y2="104" />
    <line x1="66" y1="104" x2="474" y2="104" />
    <line x1="66" y1="104" x2="66" y2="130" marker-end="url(#arrow)" />
    <line x1="168" y1="104" x2="168" y2="130" marker-end="url(#arrow)" />
    <line x1="270" y1="104" x2="270" y2="130" marker-end="url(#arrow)" />
    <line x1="372" y1="104" x2="372" y2="130" marker-end="url(#arrow)" />
    <line x1="474" y1="104" x2="474" y2="130" marker-end="url(#arrow)" />
  </g>

  <!-- 운행 중 모니터링의 데이터로 새 시나리오 -->
  <polyline points="520,155 536,155 536,64 362,64" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="449" y="57" text-anchor="middle" font-size="12" fill="var(--text, #727981)">새 시나리오 추가</text>
</svg>
