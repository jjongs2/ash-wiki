<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 6 440 344" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="V2X 통신의 두 모드와 PC5의 전송 방식">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 두 모드: 단말끼리 PC5, 단말과 기지국 사이 Uu -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="210.75" y="20.75" width="98.5" height="34.5" rx="2" />
    <rect x="60.75" y="130.75" width="98.5" height="34.5" rx="2" />
    <rect x="360.75" y="130.75" width="98.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="42.5">기지국</text>
    <text x="110" y="152.5">단말</text>
    <text x="410" y="152.5">단말</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="130" x2="230" y2="56" />
    <line x1="390" y1="130" x2="290" y2="56" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="172" y="90" text-anchor="end">Uu</text>
    <text x="348" y="90">Uu</text>
  </g>
  <line x1="160" y1="148" x2="360" y2="148" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PC5 (sidelink)</text>

  <!-- PC5의 전송 방식: 왼쪽 원이 보내는 단말, 오른쪽 원이 받을 수 있는 단말 -->
  <text x="260" y="196" text-anchor="middle" fill="var(--text, #727981)">PC5의 전송 방식</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <circle cx="70" cy="256" r="6" />
    <circle cx="150" cy="226" r="6" />
    <circle cx="150" cy="256" r="6" />
    <circle cx="150" cy="286" r="6" />
    <circle cx="220" cy="256" r="6" />
    <circle cx="300" cy="226" r="6" />
    <circle cx="300" cy="256" r="6" />
    <circle cx="300" cy="286" r="6" />
    <circle cx="370" cy="256" r="6" />
    <circle cx="450" cy="226" r="6" />
    <circle cx="450" cy="256" r="6" />
    <circle cx="450" cy="286" r="6" />
  </g>
  <rect x="285" y="211" width="30" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="77" y1="253.4" x2="142.5" y2="228.8" />
    <line x1="77" y1="256" x2="142" y2="256" />
    <line x1="77" y1="258.6" x2="142.5" y2="283.2" />
    <line x1="227" y1="253.4" x2="292.5" y2="228.8" />
    <line x1="227" y1="256" x2="292" y2="256" />
    <line x1="377" y1="256" x2="442" y2="256" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="318">broadcast</text>
    <text x="260" y="318">groupcast</text>
    <text x="410" y="318">unicast</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="110" y="336">LTE·NR</text>
    <text x="260" y="336">NR만</text>
    <text x="410" y="336">NR만</text>
  </g>
</svg>
