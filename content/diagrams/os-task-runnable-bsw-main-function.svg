<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 720 196" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- OS 태스크 -->
  <rect x="240" y="30" width="460" height="100" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="240" y="20" fill="var(--text, #727981)">OS 태스크</text>

  <!-- SW-C 쪽 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="26" width="150" height="36" rx="2" />
    <rect x="256" y="60" width="130" height="40" rx="2" />
    <rect x="560" y="60" width="130" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="49">RTE 이벤트</text>
    <text x="321" y="85">runnable</text>
    <text x="625" y="85">runnable</text>
  </g>

  <!-- BSW 쪽 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="20" y="140" width="150" height="36" rx="2" />
    <rect x="408" y="60" width="130" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="95" y="163">BswEvent</text>
    <text x="473" y="85" font-size="13">BSW main function</text>
  </g>

  <!-- 촉발과 실행 순서 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M170 44 H625 V58" marker-end="url(#arrow)" />
    <path d="M321 44 V58" marker-end="url(#arrow)" />
    <path d="M170 158 H473 V102" marker-end="url(#arrow)" />
    <line x1="386" y1="80" x2="406" y2="80" marker-end="url(#arrow)" />
    <line x1="538" y1="80" x2="558" y2="80" marker-end="url(#arrow)" />
  </g>
</svg>
