<svg xmlns="http://www.w3.org/2000/svg" viewBox="33.5 13.5 770 160" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 규칙 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="110" y="40" width="120" height="36" rx="2" />
    <rect x="290" y="40" width="120" height="36" rx="2" />
    <rect x="510" y="40" width="120" height="36" rx="2" />
    <rect x="690" y="40" width="100" height="36" rx="2" />
    <rect x="110" y="130" width="520" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="63">FirewallRule 1</text>
    <text x="350" y="63">FirewallRule 2</text>
    <text x="570" y="63">FirewallRule n</text>
    <text x="740" y="63">기본 동작</text>
    <text x="370" y="153">맞은 규칙의 동작(허용이나 차단)</text>
  </g>
  <text x="70" y="63" text-anchor="end" fill="var(--text, #727981)">패킷</text>
  <g fill="var(--ink, #727981)">
    <circle cx="452" cy="58" r="1.5" />
    <circle cx="460" cy="58" r="1.5" />
    <circle cx="468" cy="58" r="1.5" />
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="76" y1="58" x2="108" y2="58" marker-end="url(#arrow)" />
    <line x1="232" y1="58" x2="288" y2="58" marker-end="url(#arrow)" />
    <line x1="412" y1="58" x2="444" y2="58" />
    <line x1="476" y1="58" x2="508" y2="58" marker-end="url(#arrow)" />
    <line x1="632" y1="58" x2="688" y2="58" marker-end="url(#arrow)" />
    <line x1="170" y1="78" x2="170" y2="128" marker-end="url(#arrow)" />
    <line x1="350" y1="78" x2="350" y2="128" marker-end="url(#arrow)" />
    <line x1="570" y1="78" x2="570" y2="128" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="260" y="50" text-anchor="middle">안 맞음</text>
    <text x="660" y="50" text-anchor="middle">안 맞음</text>
    <text x="178" y="108">맞음</text>
    <text x="358" y="108">맞음</text>
    <text x="578" y="108">맞음</text>
    <text x="110" y="30">설정한 순서대로 견준다</text>
  </g>
</svg>
