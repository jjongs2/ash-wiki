<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 380 370" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="FirewallRule을 설정한 순서대로 맞춰 보기">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 규칙 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="64" width="120" height="36" rx="2" />
    <rect x="20" y="136" width="120" height="36" rx="2" />
    <rect x="20" y="244" width="120" height="36" rx="2" />
    <rect x="20" y="316" width="120" height="36" rx="2" />
    <rect x="220" y="64" width="140" height="216" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="34">패킷</text>
    <text x="80" y="87">FirewallRule 1</text>
    <text x="80" y="159">FirewallRule 2</text>
    <text x="80" y="267">FirewallRule n</text>
    <text x="80" y="339">기본 동작</text>
    <text x="290" y="168">맞은 규칙의 동작</text>
    <text x="290" y="186">(허용이나 차단)</text>
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="80" cy="200" r="1.5" />
    <circle cx="80" cy="208" r="1.5" />
    <circle cx="80" cy="216" r="1.5" />
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="40" x2="80" y2="62" marker-end="url(#arrow)" />
    <line x1="80" y1="100" x2="80" y2="134" marker-end="url(#arrow)" />
    <line x1="80" y1="172" x2="80" y2="192" />
    <line x1="80" y1="224" x2="80" y2="242" marker-end="url(#arrow)" />
    <line x1="80" y1="280" x2="80" y2="314" marker-end="url(#arrow)" />
    <line x1="140" y1="82" x2="218" y2="82" marker-end="url(#arrow)" />
    <line x1="140" y1="154" x2="218" y2="154" marker-end="url(#arrow)" />
    <line x1="140" y1="262" x2="218" y2="262" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="90" y="56">설정한 순서대로 견준다</text>
    <text x="88" y="122">안 맞음</text>
    <text x="88" y="302">안 맞음</text>
    <text x="179" y="74" text-anchor="middle">맞음</text>
    <text x="179" y="146" text-anchor="middle">맞음</text>
    <text x="179" y="254" text-anchor="middle">맞음</text>
  </g>
</svg>
