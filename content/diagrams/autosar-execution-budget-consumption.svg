<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 19.5 528 267.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축: x = 130 + 20 × 시각. 태스크 B의 execution budget은 6, 세로 1은 15.
       B는 0~3과 5~7에 실행하고(3~5는 A가 선점) 7에 끝난다. 9에 다시 활성화되어 15에 budget을 다 쓴다. -->

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="55">태스크 A</text>
    <text x="20" y="95">태스크 B</text>
    <text x="20" y="180" font-size="12">B의 남은</text>
    <text x="20" y="196" font-size="12">execution budget</text>
  </g>

  <!-- 실행 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="190" y="40" width="40" height="20" />
    <rect x="130" y="80" width="60" height="20" />
    <rect x="230" y="80" width="40" height="20" />
    <rect x="310" y="80" width="120" height="20" />
  </g>
  <text x="238" y="55" font-size="12" fill="var(--text, #727981)">선점</text>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="130" y1="140" x2="450" y2="140" />
    <line x1="190" y1="100" x2="190" y2="185" />
    <line x1="230" y1="100" x2="230" y2="185" />
    <line x1="430" y1="100" x2="430" y2="230" />
  </g>

  <!-- 남은 budget -->
  <path d="M130 140 L190 185 H230 L270 215 V140 H310 L430 230" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="210" y="203" text-anchor="middle">세지 않음</text>
    <text x="276" y="128">SUSPENDED: 다시 채움</text>
    <text x="430" y="250" text-anchor="end">budget을 넘음</text>
    <text x="430" y="266" text-anchor="end">E_OS_PROTECTION_TIME</text>
  </g>

  <!-- 시간 축 -->
  <line x1="130" y1="230" x2="480" y2="230" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="488" y="234" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
