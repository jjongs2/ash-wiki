<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Cortex-R52에서 EL1이 다스리는 MPU와 EL2가 다스리는 MPU">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Arm Cortex-R52, EL2가 다스리는 MPU와 가상화를 켰을 때</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="56" width="200" height="36" rx="2" />
    <rect x="300" y="56" width="200" height="36" rx="2" />
    <rect x="20" y="140" width="200" height="48" rx="2" />
    <rect x="20" y="250" width="480" height="48" rx="2" />
    <rect x="200" y="346" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="79">EL0·EL1의 변환 체계</text>
    <text x="400" y="79">EL2의 변환 체계</text>
    <text x="120" y="160">EL1이 다스리는 MPU</text>
    <text x="120" y="178" font-size="12">영역 16, 20, 24개</text>
    <text x="260" y="270">EL2가 다스리는 MPU</text>
    <text x="260" y="288" font-size="12">영역 0, 16, 20, 24개</text>
    <text x="260" y="369">메모리</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="92" x2="120" y2="138" />
    <line x1="120" y1="188" x2="120" y2="248" />
    <line x1="400" y1="92" x2="400" y2="248" />
    <line x1="260" y1="298" x2="260" y2="344" />
  </g>
  <text x="132" y="223" font-size="12" fill="var(--text, #727981)">두 MPU 가운데 덜 허용하는 쪽을 따름</text>
</svg>
