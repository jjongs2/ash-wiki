<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CUC와 CNC -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="250" y="20" width="180" height="36" rx="2" />
    <rect x="250" y="110" width="180" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="340" y="43">CUC</text>
    <text x="340" y="133">CNC</text>
  </g>

  <!-- 엔드 스테이션과 브리지 -->
  <rect x="168" y="198" width="334" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="210" width="100" height="36" rx="2" />
    <rect x="180" y="210" width="70" height="36" rx="2" />
    <rect x="300" y="210" width="70" height="36" rx="2" />
    <rect x="420" y="210" width="70" height="36" rx="2" />
    <rect x="560" y="210" width="100" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="233">talker</text>
    <text x="215" y="233">브리지</text>
    <text x="335" y="233">브리지</text>
    <text x="455" y="233">브리지</text>
    <text x="610" y="233">listener</text>
  </g>

  <!-- UNI -->
  <line x1="340" y1="58" x2="340" y2="108" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />

  <!-- CUC와 엔드 스테이션 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <path d="M248 38 H70 V208" />
    <path d="M432 38 H610 V208" />
  </g>

  <!-- 브리지 설정 -->
  <line x1="340" y1="146" x2="340" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)" />

  <g fill="var(--text, #727981)">
    <text x="350" y="87">UNI</text>
    <text x="159" y="30" text-anchor="middle">응용마다 정한 프로토콜</text>
    <text x="521" y="30" text-anchor="middle">IEEE 802.1Q 범위 밖</text>
    <text x="350" y="176">브리지의 TSN 기능 설정</text>
  </g>
</svg>
