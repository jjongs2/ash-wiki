<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 524 317.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CUC와 CNC -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="172" y="20" width="180" height="36" rx="2" />
    <rect x="172" y="110" width="180" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="262" y="43">CUC</text>
    <text x="262" y="133">CNC</text>
  </g>

  <!-- 엔드 스테이션과 브리지 -->
  <rect x="126" y="198" width="272" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="210" width="70" height="36" rx="2" />
    <rect x="138" y="210" width="56" height="36" rx="2" />
    <rect x="234" y="210" width="56" height="36" rx="2" />
    <rect x="330" y="210" width="56" height="36" rx="2" />
    <rect x="434" y="210" width="70" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="233">talker</text>
    <text x="166" y="233">브리지</text>
    <text x="262" y="233">브리지</text>
    <text x="358" y="233">브리지</text>
    <text x="469" y="233">listener</text>
  </g>

  <!-- UNI -->
  <line x1="262" y1="58" x2="262" y2="108" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />

  <!-- CUC와 엔드 스테이션 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <path d="M170 38 H55 V208" />
    <path d="M354 38 H469 V208" />
  </g>

  <!-- 브리지 설정 -->
  <line x1="262" y1="146" x2="262" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)" />

  <g fill="var(--text, #727981)">
    <text x="272" y="87">UNI</text>
    <text x="165" y="14" text-anchor="end">응용마다 정한 프로토콜</text>
    <text x="165" y="30" text-anchor="end">(IEEE 802.1Q 범위 밖)</text>
    <text x="359" y="14">응용마다 정한 프로토콜</text>
    <text x="359" y="30">(IEEE 802.1Q 범위 밖)</text>
    <text x="272" y="176">브리지의 TSN 기능 설정</text>
    <text x="262" y="276" text-anchor="middle">네트워크</text>
  </g>
</svg>
