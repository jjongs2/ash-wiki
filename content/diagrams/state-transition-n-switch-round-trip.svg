<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 5 516 163.25" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 범위와 범례 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTAL-TA 강의계획서</text>
  <line x1="388" y1="20" x2="418" y2="20" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="516" y="24" fill="var(--text, #727981)" text-anchor="end">커버리지 항목 하나</text>

  <!-- 커버리지 항목에 들지 않는 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M112 70 H139" />
    <path d="M156 86 Q96 136 36 86" />
    <path d="M328 86 Q268 136 208 86" />
  </g>

  <!-- 커버리지 항목인 전이 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <path d="M52 70 H79" />
    <path d="M224 70 H251" />
    <path d="M284 70 H311" />
    <path d="M396 70 H423" />
    <path d="M456 70 H483" />
    <path d="M500 86 Q440 136 380 86" />
  </g>

  <!-- 상태 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="36" cy="70" r="16" />
    <circle cx="96" cy="70" r="16" />
    <circle cx="156" cy="70" r="16" />
    <circle cx="208" cy="70" r="16" />
    <circle cx="268" cy="70" r="16" />
    <circle cx="328" cy="70" r="16" />
    <circle cx="380" cy="70" r="16" />
    <circle cx="440" cy="70" r="16" />
    <circle cx="500" cy="70" r="16" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="36" y="74.5">A</text>
    <text x="96" y="74.5">B</text>
    <text x="156" y="74.5">C</text>
    <text x="208" y="74.5">A</text>
    <text x="268" y="74.5">B</text>
    <text x="328" y="74.5">C</text>
    <text x="380" y="74.5">A</text>
    <text x="440" y="74.5">B</text>
    <text x="500" y="74.5">C</text>
  </g>

  <!-- 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="96" y="140">0-switch</text>
    <text x="96" y="158">유효한 전이 하나</text>
    <text x="268" y="140">1-switch</text>
    <text x="268" y="158">B로 들어오고 나가는 전이 쌍</text>
    <text x="440" y="140">round trip</text>
    <text x="440" y="158">시작 상태와 끝 상태가 같음</text>
  </g>
</svg>
