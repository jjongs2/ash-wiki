<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -5.5 645.5 184.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 범위와 범례 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTAL-TA 강의계획서</text>
  <line x1="476" y1="20" x2="506" y2="20" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="514" y="24" fill="var(--text, #727981)">커버리지 항목 하나</text>

  <!-- 커버리지 항목에 들지 않는 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M131 70 H173" />
    <path d="M190 86 Q115 136 40 86" />
    <path d="M400 86 Q325 136 250 86" />
  </g>

  <!-- 커버리지 항목인 전이 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <path d="M56 70 H98" />
    <path d="M266 70 H308" />
    <path d="M341 70 H383" />
    <path d="M476 70 H518" />
    <path d="M551 70 H593" />
    <path d="M610 86 Q535 136 460 86" />
  </g>

  <!-- 상태 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="40" cy="70" r="16" />
    <circle cx="115" cy="70" r="16" />
    <circle cx="190" cy="70" r="16" />
    <circle cx="250" cy="70" r="16" />
    <circle cx="325" cy="70" r="16" />
    <circle cx="400" cy="70" r="16" />
    <circle cx="460" cy="70" r="16" />
    <circle cx="535" cy="70" r="16" />
    <circle cx="610" cy="70" r="16" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="40" y="74.5">A</text>
    <text x="115" y="74.5">B</text>
    <text x="190" y="74.5">C</text>
    <text x="250" y="74.5">A</text>
    <text x="325" y="74.5">B</text>
    <text x="400" y="74.5">C</text>
    <text x="460" y="74.5">A</text>
    <text x="535" y="74.5">B</text>
    <text x="610" y="74.5">C</text>
  </g>

  <!-- 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="140">0-switch</text>
    <text x="115" y="158">유효한 전이 하나</text>
    <text x="325" y="140">1-switch</text>
    <text x="325" y="158">B로 들어오고 나가는 전이 쌍</text>
    <text x="535" y="140">round trip</text>
    <text x="535" y="158">시작 상태와 끝 상태가 같음</text>
  </g>
</svg>
