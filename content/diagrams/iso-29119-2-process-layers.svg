<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -11.5 685 400" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 29119-2:2021, 문서는 29119-3:2021</text>

  <!-- 층 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="30" width="644" height="100" rx="2" />
    <rect x="20" y="146" width="644" height="100" rx="2" />
    <rect x="20" y="262" width="644" height="106" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="48">조직</text>
    <text x="32" y="164">테스트 관리</text>
    <text x="32" y="280">동적 테스트</text>
  </g>

  <!-- 프로세스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="58" width="146" height="44" rx="2" />
    <rect x="32" y="174" width="146" height="44" rx="2" />
    <rect x="190" y="174" width="146" height="44" rx="2" />
    <rect x="348" y="174" width="146" height="44" rx="2" />
    <rect x="32" y="290" width="146" height="44" rx="2" />
    <rect x="190" y="290" width="146" height="44" rx="2" />
    <rect x="348" y="290" width="146" height="44" rx="2" />
    <rect x="506" y="290" width="146" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="84.5">조직 테스트 프로세스</text>
    <text x="105" y="200.5">테스트 전략과 계획</text>
    <text x="263" y="200.5">테스트 모니터링과 제어</text>
    <text x="421" y="200.5">테스트 완료</text>
    <text x="105" y="316.5">테스트 설계와 구현</text>
    <text x="263" y="308">테스트 환경과</text>
    <text x="263" y="325">데이터 관리</text>
    <text x="421" y="316.5">테스트 실행</text>
    <text x="579" y="316.5">테스트 사건 보고</text>
  </g>

  <!-- 문서 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="120">조직 테스트 명세: 테스트 정책, 조직 테스트 실무</text>
    <text x="32" y="236">문서: 테스트 계획서, 테스트 상태 보고서, 테스트 완료 보고서</text>
    <text x="32" y="354">문서: 테스트 실행 로그, 테스트 사건 보고서</text>
  </g>
</svg>
