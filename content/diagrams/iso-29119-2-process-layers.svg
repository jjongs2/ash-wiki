<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -11.5 521 476" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 29119-2:2021, 문서는 29119-3:2021</text>

  <!-- 층 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="30" width="480" height="110" rx="2" />
    <rect x="20" y="156" width="480" height="110" rx="2" />
    <rect x="20" y="282" width="480" height="162" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="48">조직</text>
    <text x="32" y="174">테스트 관리</text>
    <text x="32" y="300">동적 테스트</text>
  </g>

  <!-- 프로세스와 문서의 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="112" x2="500" y2="112" />
    <line x1="20" y1="238" x2="500" y2="238" />
    <line x1="20" y1="416" x2="500" y2="416" />
  </g>

  <!-- 프로세스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="58" width="146" height="44" rx="2" />
    <rect x="32" y="184" width="146" height="44" rx="2" />
    <rect x="187" y="184" width="146" height="44" rx="2" />
    <rect x="342" y="184" width="146" height="44" rx="2" />
    <rect x="32" y="310" width="223" height="44" rx="2" />
    <rect x="265" y="310" width="223" height="44" rx="2" />
    <rect x="32" y="362" width="223" height="44" rx="2" />
    <rect x="265" y="362" width="223" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="84.5">조직 테스트 프로세스</text>
    <text x="105" y="210.5">테스트 전략과 계획</text>
    <text x="260" y="210.5">테스트 모니터링과 제어</text>
    <text x="415" y="210.5">테스트 완료</text>
    <text x="143.5" y="336.5">테스트 설계와 구현</text>
    <text x="376.5" y="336.5">테스트 환경과 데이터 관리</text>
    <text x="143.5" y="388.5">테스트 실행</text>
    <text x="376.5" y="388.5">테스트 사건 보고</text>
  </g>

  <!-- 문서 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="130.5">조직 테스트 명세: 테스트 정책, 조직 테스트 실무</text>
    <text x="32" y="256.5">문서: 테스트 계획서, 테스트 상태 보고서, 테스트 완료 보고서</text>
    <text x="32" y="434.5">문서: 테스트 실행 로그, 테스트 사건 보고서</text>
  </g>
</svg>
