<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 236" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="DENM의 종류와 보내는 ITS-S">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 보내는 ITS-S -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="37">New DENM을</text>
    <text x="20" y="53">만든 ITS-S</text>
    <text x="20" y="125">다른 ITS-S</text>
  </g>

  <!-- 두 갱신 사이의 되풀이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="200" y1="41" x2="260" y2="41" />
    <line x1="334" y1="41" x2="394" y2="41" />
    <line x1="215" y1="34" x2="215" y2="48" />
    <line x1="230" y1="34" x2="230" y2="48" />
    <line x1="245" y1="34" x2="245" y2="48" />
    <line x1="349" y1="34" x2="349" y2="48" />
    <line x1="364" y1="34" x2="364" y2="48" />
    <line x1="379" y1="34" x2="379" y2="48" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="230" y="27">되풀이</text>
    <text x="364" y="27">되풀이</text>
  </g>

  <!-- DENM. 점선은 만드는 것이 선택인 DENM -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130.75" y="20.75" width="68.5" height="40.5" rx="2" />
    <rect x="260.75" y="20.75" width="72.5" height="40.5" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)">
    <rect x="394.75" y="20.75" width="102.5" height="40.5" rx="2" />
    <rect x="394.75" y="104.75" width="102.5" height="40.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="165" y="46">New</text>
    <text x="297" y="46">Update</text>
    <text x="446" y="46">Cancellation</text>
    <text x="446" y="130">Negation</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="165" y="80">새 actionId</text>
    <text x="297" y="80">referenceTime 새로</text>
    <text x="446" y="80">사건 끝</text>
    <text x="446" y="164">사건 끝</text>
  </g>

  <!-- 시간 -->
  <line x1="130" y1="182" x2="496" y2="182" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="496" y="200" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <text x="20" y="216" font-size="12" fill="var(--text, #727981)">점선: 만드는 것이 선택인 DENM</text>
</svg>
