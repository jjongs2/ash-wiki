<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 761 240.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 세 후보 시각: 점과 시간축까지 내린 보조선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="28" x2="40" y2="182" />
    <line x1="110" y1="52" x2="110" y2="182" />
    <line x1="480" y1="90" x2="480" y2="182" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="40" cy="24" r="4" />
    <circle cx="110" cy="48" r="4" />
    <circle cx="480" cy="86" r="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="50" y="28">도착 시각</text>
    <text x="120" y="52">그룹이 앞 프레임에 준 eligibility time</text>
    <text x="490" y="90">스케줄러 상태로 계산한 시각</text>
  </g>

  <!-- 스케줄러 상태로 계산한 시각 = BucketEmptyTime + 프레임 길이 ÷ CommittedInformationRate -->
  <line x1="160" y1="78" x2="160" y2="94" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="160" y1="86" x2="474" y2="86" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="160" y="70" fill="var(--text, #727981)">BucketEmptyTime</text>
  <text x="317" y="108" text-anchor="middle" fill="var(--text, #727981)">+ 프레임 길이(오버헤드 포함) ÷ CommittedInformationRate</text>

  <!-- 버리는 기준: 도착 시각 + MaxResidenceTime -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="40" y1="138" x2="620" y2="138" />
    <line x1="40" y1="130" x2="40" y2="146" />
    <line x1="620" y1="130" x2="620" y2="146" />
  </g>
  <line x1="620" y1="146" x2="620" y2="182" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="330" y="130" text-anchor="middle" fill="var(--text, #727981)">MaxResidenceTime</text>
  <rect x="624" y="156" width="112" height="22" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="680" y="171" text-anchor="middle" fill="var(--on-fill, #f8fafd)">이보다 늦으면 버림</text>

  <!-- 시간축과 eligibility time -->
  <line x1="20" y1="182" x2="740" y2="182" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <circle cx="480" cy="182" r="5" fill="var(--ink, #727981)" />
  <text x="740" y="200" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <text x="480" y="202" text-anchor="middle" fill="var(--text, #727981)">eligibility time</text>
  <text x="480" y="218" text-anchor="middle" fill="var(--text, #727981)">셋 가운데 가장 늦은 시각</text>
</svg>
