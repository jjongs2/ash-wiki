<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1.5 530 255" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 세 후보 시각: 점과 시간축까지 내린 보조선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="28" x2="40" y2="196" />
    <line x1="90" y1="52" x2="90" y2="196" />
    <line x1="330" y1="90" x2="330" y2="196" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="40" cy="24" r="4" />
    <circle cx="90" cy="48" r="4" />
    <circle cx="330" cy="86" r="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="50" y="28">도착 시각</text>
    <text x="100" y="52">그룹이 앞 프레임에 준 eligibility time</text>
    <text x="340" y="90">스케줄러 상태로 계산한 시각</text>
  </g>

  <!-- 스케줄러 상태로 계산한 시각 = BucketEmptyTime + 프레임 길이 ÷ CommittedInformationRate -->
  <line x1="130" y1="78" x2="130" y2="94" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="130" y1="86" x2="324" y2="86" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="130" y="70" fill="var(--text, #727981)">BucketEmptyTime</text>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="227" y="108">+ 프레임 길이(오버헤드 포함)</text>
    <text x="227" y="124">÷ CommittedInformationRate</text>
  </g>

  <!-- 버리는 기준: 도착 시각 + MaxResidenceTime -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="40" y1="156" x2="390" y2="156" />
    <line x1="40" y1="148" x2="40" y2="164" />
    <line x1="390" y1="148" x2="390" y2="164" />
  </g>
  <line x1="390" y1="164" x2="390" y2="196" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="215" y="148" text-anchor="middle" fill="var(--text, #727981)">MaxResidenceTime</text>
  <rect x="398" y="145" width="112" height="22" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="454" y="160" text-anchor="middle" fill="var(--on-fill, #f8fafd)">이보다 늦으면 버림</text>

  <!-- 시간축과 eligibility time -->
  <line x1="20" y1="196" x2="510" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <circle cx="330" cy="196" r="5" fill="var(--ink, #727981)" />
  <text x="510" y="214" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <text x="330" y="216" text-anchor="middle" fill="var(--text, #727981)">eligibility time</text>
  <text x="330" y="232" text-anchor="middle" fill="var(--text, #727981)">셋 가운데 가장 늦은 시각</text>
</svg>
