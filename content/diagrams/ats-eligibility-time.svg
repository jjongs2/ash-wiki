<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14.5 761 250.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 시간축으로 내린 보조선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="44" x2="60" y2="210" />
    <line x1="100" y1="84" x2="100" y2="210" />
  </g>

  <!-- 세 후보 시각 -->
  <circle cx="60" cy="40" r="4" fill="var(--ink, #727981)" />
  <text x="70" y="44" fill="var(--text, #727981)">도착 시각</text>

  <circle cx="100" cy="80" r="4" fill="var(--ink, #727981)" />
  <text x="110" y="84" fill="var(--text, #727981)">그룹이 앞 프레임에 준 eligibility time</text>

  <line x1="200" y1="116" x2="200" y2="132" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="200" y="148" text-anchor="middle" fill="var(--text, #727981)">BucketEmptyTime</text>
  <line x1="200" y1="124" x2="434" y2="124" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="317" y="114" text-anchor="middle" fill="var(--text, #727981)">프레임 길이(오버헤드 포함) ÷ CommittedInformationRate</text>
  <circle cx="440" cy="124" r="4" fill="var(--ink, #727981)" />
  <text x="450" y="128" fill="var(--text, #727981)">스케줄러 상태로 계산한 시각</text>

  <!-- 버리는 기준 -->
  <line x1="60" y1="160" x2="60" y2="176" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="60" y1="168" x2="618" y2="168" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="620" y1="160" x2="620" y2="176" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="360" y="158" text-anchor="middle" fill="var(--text, #727981)">MaxResidenceTime</text>
  <text x="628" y="172" fill="var(--text, #727981)">이보다 늦으면 버림</text>

  <!-- eligibility time: 셋 가운데 가장 늦은 시각 -->
  <line x1="440" y1="128" x2="440" y2="210" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 시간축 -->
  <line x1="20" y1="210" x2="740" y2="210" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="740" y="228" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <text x="440" y="228" text-anchor="middle" fill="var(--text, #727981)">eligibility time</text>
  <text x="440" y="244" text-anchor="middle" fill="var(--text, #727981)">셋 가운데 가장 늦은 시각</text>
</svg>
