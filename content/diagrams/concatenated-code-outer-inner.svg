<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.5 8 500 117" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 데이터 -->
  <text x="62" y="43" text-anchor="end" fill="var(--text, #727981)">데이터</text>

  <!-- 부호기 둘 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100.75" y="20.75" width="158.5" height="34.5" rx="2" />
    <rect x="320.75" y="20.75" width="118.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="43">Reed-Solomon 부호</text>
    <text x="380" y="43">길쌈 부호</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="76">외부 부호</text>
    <text x="180" y="92">처음 적용</text>
    <text x="380" y="76">내부 부호</text>
    <text x="380" y="92">마지막 적용</text>
  </g>

  <!-- 흐름: 한 부호기의 출력이 다음 부호기의 입력 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="68" y1="38" x2="98" y2="38" />
    <line x1="262" y1="38" x2="318" y2="38" />
    <line x1="442" y1="38" x2="472" y2="38" />
  </g>
  <text x="480" y="43" fill="var(--text, #727981)">출력</text>

  <text x="270" y="112" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CCSDS 131.0-B-6에서 연접할 때</text>
</svg>
