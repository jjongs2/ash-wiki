<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 112" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="30" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="52" width="90" height="40" rx="2" />
    <rect x="200" y="52" width="90" height="40" rx="2" />
    <rect x="380" y="52" width="124" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="76">정한 버전</text>
    <text x="245" y="76">운영 환경</text>
    <text x="442" y="76">고객 전부나 일부</text>
  </g>

  <!-- 배포와 릴리스는 따로 일어난다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="72" x2="198" y2="72" />
    <line x1="290" y1="72" x2="378" y2="72" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="64">배포</text>
    <text x="155" y="90">환경에 설치</text>
    <text x="335" y="64">릴리스</text>
    <text x="335" y="90">비즈니스 결정</text>
  </g>
</svg>
