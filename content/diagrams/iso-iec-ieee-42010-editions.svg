<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 600 128" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 앞선 문서 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="160" height="32" rx="2" />
    <rect x="20" y="96" width="160" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="61">IEEE 1471-2000</text>
    <text x="100" y="117">ISO/IEC 42010:2007</text>
  </g>

  <!-- ISO/IEC/IEEE 42010의 판 -->
  <text x="300" y="54" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 42010</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="300" y="67" width="110" height="34" rx="2" />
    <rect x="460" y="61" width="120" height="46" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="355" y="89">2011년</text>
    <text x="520" y="81">2022년</text>
    <text x="520" y="98" font-size="12">현행판</text>
  </g>

  <!-- 대체와 개정 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M182 56 H240 V78 H298" marker-end="url(#arrow)" />
    <path d="M182 112 H240 V90 H298" marker-end="url(#arrow)" />
    <line x1="412" y1="84" x2="458" y2="84" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="211" y="49">대체</text>
    <text x="211" y="105">개정</text>
    <text x="435" y="77">대체</text>
  </g>
</svg>
