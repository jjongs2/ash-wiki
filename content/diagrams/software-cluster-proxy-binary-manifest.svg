<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 266" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Software Cluster -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="190" height="226" rx="2" />
    <rect x="320" y="20" width="190" height="226" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="42">Application</text>
    <text x="115" y="59">Software Cluster</text>
    <text x="415" y="42">Host</text>
    <text x="415" y="59">Software Cluster</text>
  </g>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="35" y="74" width="160" height="36" rx="2" />
    <rect x="35" y="134" width="160" height="36" rx="2" />
    <rect x="35" y="194" width="160" height="36" rx="2" />
    <rect x="335" y="74" width="160" height="36" rx="2" />
    <rect x="335" y="134" width="160" height="36" rx="2" />
    <rect x="335" y="194" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="97">위 층·같은 층의 모듈</text>
    <text x="115" y="157">High Proxy Module</text>
    <text x="115" y="217">Binary Manifest</text>
    <text x="415" y="97">BSW 모듈</text>
    <text x="415" y="157">Low Proxy Module</text>
    <text x="415" y="217">Binary Manifest</text>
  </g>

  <!-- 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="115" y1="110" x2="115" y2="132" marker-end="url(#arrow)" />
    <line x1="115" y1="170" x2="115" y2="192" marker-end="url(#arrow)" />
    <line x1="415" y1="194" x2="415" y2="172" marker-end="url(#arrow)" />
    <line x1="415" y1="134" x2="415" y2="112" marker-end="url(#arrow)" />
    <line x1="197" y1="212" x2="333" y2="212" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="265" y="186">Software Cluster</text>
    <text x="265" y="201">Connector가 이음</text>
  </g>
</svg>
