<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Software Cluster -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="216" rx="2" />
    <rect x="460" y="20" width="280" height="216" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="44">Application Software Cluster</text>
    <text x="600" y="44">Host Software Cluster</text>
  </g>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="60" width="240" height="36" rx="2" />
    <rect x="40" y="120" width="240" height="36" rx="2" />
    <rect x="40" y="180" width="240" height="36" rx="2" />
    <rect x="480" y="60" width="240" height="36" rx="2" />
    <rect x="480" y="120" width="240" height="36" rx="2" />
    <rect x="480" y="180" width="240" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="83">위 층·같은 층의 모듈</text>
    <text x="160" y="143">High Proxy Module</text>
    <text x="160" y="203">Binary Manifest</text>
    <text x="600" y="83">BSW 모듈</text>
    <text x="600" y="143">Low Proxy Module</text>
    <text x="600" y="203">Binary Manifest</text>
  </g>

  <!-- 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="160" y1="96" x2="160" y2="118" marker-end="url(#arrow)" />
    <line x1="160" y1="156" x2="160" y2="178" marker-end="url(#arrow)" />
    <line x1="600" y1="180" x2="600" y2="158" marker-end="url(#arrow)" />
    <line x1="600" y1="120" x2="600" y2="98" marker-end="url(#arrow)" />
    <line x1="282" y1="198" x2="478" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="380" y="174">Software Cluster</text>
    <text x="380" y="189">Connector가 이음</text>
  </g>
</svg>
