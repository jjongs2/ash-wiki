<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 -29.5 276.5 394.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 판 -->
  <text x="210" y="0" text-anchor="middle" font-size="13" fill="var(--text, #727981)">Automotive SPICE 4.1</text>

  <!-- 달성 정도 축: 1% = 2.8 단위, 0% = y 320, 100% = y 40 -->
  <text x="120" y="28" text-anchor="middle" fill="var(--text, #727981)">달성 정도 a</text>
  <line x1="120" y1="40" x2="120" y2="320" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M115 320 h5 M115 278 h5 M115 229 h5 M115 180 h5 M115 131 h5 M115 82 h5 M115 40 h5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="110" y="324">0%</text>
    <text x="110" y="282">15%</text>
    <text x="110" y="233">32.5%</text>
    <text x="110" y="184">50%</text>
    <text x="110" y="135">67.5%</text>
    <text x="110" y="86">85%</text>
    <text x="110" y="44">100%</text>
  </g>

  <!-- 경계에서 막대까지 -->
  <path d="M120 320 H140 M120 278 H140 M120 229 H140 M120 180 H140 M120 131 H140 M120 82 H140 M120 40 H140" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 등급 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="278" width="80" height="42" rx="4" />
    <rect x="140" y="180" width="80" height="98" rx="4" />
    <rect x="140" y="82" width="80" height="98" rx="4" />
    <rect x="140" y="40" width="80" height="42" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="303">N</text>
    <text x="180" y="233">P</text>
    <text x="180" y="135">L</text>
    <text x="180" y="65">F</text>
  </g>

  <!-- P와 L의 세분 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="232" y="229" width="80" height="49" rx="4" />
    <rect x="232" y="180" width="80" height="49" rx="4" />
    <rect x="232" y="131" width="80" height="49" rx="4" />
    <rect x="232" y="82" width="80" height="49" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="272" y="257.5">P-</text>
    <text x="272" y="208.5">P+</text>
    <text x="272" y="159.5">L-</text>
    <text x="272" y="110.5">L+</text>
  </g>

  <!-- 막대 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="344">등급</text>
    <text x="272" y="344">세분 척도</text>
  </g>
</svg>
