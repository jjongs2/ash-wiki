<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 509 253.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 29119-4:2021</text>

  <!-- 문장 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="46" width="240" height="48" rx="2" />
    <rect x="40" y="126" width="240" height="48" rx="2" />
    <rect x="40" y="206" width="240" height="48" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="160" y="67">데이터 정의</text>
    <text x="160" y="147">계산 데이터 사용(c-use)</text>
    <text x="160" y="227">술어 데이터 사용(p-use)</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="160" y="85">변수에 값을 대입하는 문장</text>
    <text x="160" y="165">어떤 문장에서든 변수의 값을 씀</text>
    <text x="160" y="245">결정문의 술어 부분</text>
  </g>

  <!-- 실행 순서 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="94" x2="160" y2="124" />
    <line x1="160" y1="174" x2="160" y2="204" />
  </g>

  <!-- 정의-사용 쌍 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)">
    <path d="M280 78 H320 V150 H282" />
    <path d="M280 62 H430 V230 H282" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="328" y="155">정의-사용 쌍</text>
    <text x="438" y="235">정의-사용 쌍</text>
  </g>
</svg>
