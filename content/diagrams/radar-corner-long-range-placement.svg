<svg xmlns="http://www.w3.org/2000/svg" viewBox="131.5 21.5 419 250" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="코너 레이더와 장거리 레이더의 배치">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 감지 영역 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M200 90 L142.04 74.47 A60 60 0 0 1 184.47 32.04 Z" />
