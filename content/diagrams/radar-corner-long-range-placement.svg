<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 19.5 298 362" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="코너 레이더와 장거리 레이더의 배치">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 감지 영역 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M110 150 L61.7 137.06 A50 50 0 0 1 97.06 101.7 Z" />
    <path d="M190 150 L202.94 101.7 A50 50 0 0 1 238.3 137.06 Z" />
    <path d="M110 290 L97.06 338.3 A50 50 0 0 1 61.7 302.94 Z" />
    <path d="M190 290 L238.3 302.94 A50 50 0 0 1 202.94 338.3 Z" />
    <path d="M150 150 L133.3 31.17 A120 120 0 0 1 166.7 31.17 Z" />
  </g>

  <!-- 차 -->
  <rect x="110" y="150" width="80" height="140" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="216">차</text>
    <text x="150" y="236" font-size="12">앞쪽 ↑</text>
  </g>

  <!-- 레이더 -->
  <g fill="var(--ink, #727981)">
    <rect x="106" y="146" width="8" height="8" />
    <rect x="186" y="146" width="8" height="8" />
    <rect x="106" y="286" width="8" height="8" />
    <rect x="186" y="286" width="8" height="8" />
    <rect x="146" y="146" width="8" height="8" />
  </g>

  <!-- 이름표 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="222" y1="200" x2="198" y2="158" />
    <line x1="222" y1="240" x2="198" y2="282" />
    <line x1="78" y1="200" x2="102" y2="158" />
    <line x1="78" y1="240" x2="102" y2="282" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="214" y="216">코너 레이더</text>
    <text x="214" y="230">(단거리·중거리)</text>
    <text x="86" y="216" text-anchor="end">코너 레이더</text>
    <text x="86" y="230" text-anchor="end">(단거리·중거리)</text>
    <text x="174" y="66">장거리 레이더</text>
    <text x="150" y="370" text-anchor="middle">Infineon에 따른 배치</text>
  </g>
</svg>
