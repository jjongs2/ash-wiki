  <!-- 이름표 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <polyline points="230,58 200,58 200,84" />
    <polyline points="330,58 360,58 360,84" />
    <polyline points="230,202 200,202 200,176" />
