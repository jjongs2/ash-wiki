<svg xmlns="http://www.w3.org/2000/svg" viewBox="38.5 -3.5 596 230.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 시점 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="170" y1="24" x2="170" y2="196" />
    <line x1="290" y1="24" x2="290" y2="196" />
    <line x1="540" y1="24" x2="540" y2="196" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="170" y="18">인터럽트</text>
    <text x="290" y="18">스레드를 깨움</text>
    <text x="540" y="18">처리 끝</text>
  </g>

  <!-- IRQ 문맥 -->
  <text x="150" y="61" text-anchor="end" fill="var(--text, #727981)">IRQ 문맥</text>
  <rect x="170" y="34" width="120" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="230" y="53" text-anchor="middle" fill="var(--text, #727981)">1차 처리기</text>
  <text x="230" y="70" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인터럽트를 끈 채</text>

  <!-- 깨움 -->
  <path d="M290 56 H305 V120 H318" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 프로세스 문맥 -->
  <text x="150" y="125" text-anchor="end" fill="var(--text, #727981)">프로세스 문맥</text>
  <rect x="320" y="98" width="220" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="430" y="117" text-anchor="middle" fill="var(--text, #727981)">스레드 처리기</text>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="var(--text, #727981)">SCHED_FIFO, 우선순위 50</text>

  <!-- 인터럽트 컨트롤러 -->
  <text x="150" y="181" text-anchor="end" fill="var(--text, #727981)">인터럽트 컨트롤러</text>
  <rect x="290.75" y="162.75" width="248.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="415" y="181" text-anchor="middle" fill="var(--on-fill, #f8fafd)">이 인터럽트 소스를 가림</text>

  <!-- 시간 -->
  <line x1="170" y1="210" x2="594" y2="210" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="602" y="214" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
