<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 230" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="38" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <!-- 개발자, 소스 저장소, 파이프라인의 단계 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="94" width="76" height="28" rx="2" />
    <rect x="140" y="94" width="100" height="28" rx="2" />
    <rect x="328" y="94" width="92" height="28" rx="2" />
    <rect x="464" y="76" width="164" height="28" rx="2" />
    <rect x="464" y="112" width="164" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="58" y="112">개발자</text>
    <text x="190" y="112">소스 저장소</text>
    <text x="374" y="112">컴파일·링크</text>
    <text x="546" y="94">정적 분석: 코딩 표준 확인</text>
    <text x="546" y="130">단위 테스트·코드 커버리지</text>
  </g>

  <!-- 파이프라인 -->
  <rect x="312" y="20" width="344" height="144" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="324" y="38" fill="var(--text, #727981)">파이프라인</text>
  <rect x="452" y="48" width="188" height="104" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="464" y="66" fill="var(--text, #727981)">함께 두는 일이 많은 단계</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="96" y1="108" x2="138" y2="108" />
    <line x1="240" y1="108" x2="310" y2="108" />
    <line x1="420" y1="108" x2="450" y2="108" />
    <path d="M484 164 V190 H58 V124" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="118" y="100">커밋</text>
    <text x="275" y="100">커밋마다</text>
    <text x="271" y="208">오류를 빠르게 알림</text>
  </g>
</svg>
