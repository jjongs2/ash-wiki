<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -1.5 499.5 198.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 지연 요청 시점 -->
  <line x1="136" y1="36" x2="136" y2="130" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="136" y="28" text-anchor="middle" font-size="12" fill="var(--text, #727981)">지연 요청</text>
  <text x="499" y="28" text-anchor="end" font-size="12" fill="var(--text, #727981)">CMSIS-RTOS2와 RTEMS의 틱 단위 지연</text>

  <!-- 요청한 간격과 실제 지연 -->
  <rect x="136.75" y="40.75" width="238.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="256" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">요청한 간격</text>
  <rect x="136.75" y="72.75" width="190.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="232" y="88" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실제 지연</text>

  <!-- 짧아지는 만큼 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="331" y1="84" x2="373" y2="84" />
    <line x1="331" y1="79" x2="331" y2="89" />
    <line x1="373" y1="79" x2="373" y2="89" />
  </g>
  <text x="384" y="88" font-size="12" fill="var(--text, #727981)">최대 한 틱 짧음</text>

  <!-- 시간 축과 틱 -->
  <line x1="40" y1="130" x2="470" y2="130" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="134" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M88 133 L93 143 L83 143 z" />
    <path d="M168 133 L173 143 L163 143 z" />
    <path d="M248 133 L253 143 L243 143 z" />
    <path d="M328 133 L333 143 L323 143 z" />
    <path d="M408 133 L413 143 L403 143 z" />
  </g>
  <text x="88" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">틱 인터럽트</text>

  <!-- 첫 카운트다운 틱까지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="138" y1="154" x2="166" y2="154" />
    <line x1="138" y1="149" x2="138" y2="159" />
    <line x1="166" y1="149" x2="166" y2="159" />
  </g>
  <text x="152" y="176" text-anchor="middle" font-size="12" fill="var(--text, #727981)">첫 틱까지 한 틱보다 짧음</text>
</svg>
