<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -1.5 606.5 198.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 지연 요청 시점 -->
  <line x1="160" y1="36" x2="160" y2="130" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="160" y="28" text-anchor="middle" font-size="12" fill="var(--text, #727981)">지연 요청</text>
  <text x="600" y="28" text-anchor="end" font-size="12" fill="var(--text, #727981)">CMSIS-RTOS2와 RTEMS의 틱 단위 지연</text>

  <!-- 요청한 간격과 실제 지연 -->
  <rect x="160.75" y="40.75" width="298.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="310" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">요청한 간격</text>
  <rect x="160.75" y="72.75" width="238.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실제 지연</text>

  <!-- 짧아지는 만큼 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="403" y1="84" x2="457" y2="84" />
    <line x1="403" y1="79" x2="403" y2="89" />
    <line x1="457" y1="79" x2="457" y2="89" />
  </g>
  <text x="468" y="88" font-size="12" fill="var(--text, #727981)">최대 한 틱 짧음</text>

  <!-- 시간 축과 틱 -->
  <line x1="40" y1="130" x2="578" y2="130" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="586" y="134" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M100 133 L105 143 L95 143 z" />
    <path d="M200 133 L205 143 L195 143 z" />
    <path d="M300 133 L305 143 L295 143 z" />
    <path d="M400 133 L405 143 L395 143 z" />
    <path d="M500 133 L505 143 L495 143 z" />
  </g>
  <text x="100" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">틱 인터럽트</text>

  <!-- 첫 카운트다운 틱까지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="162" y1="154" x2="198" y2="154" />
    <line x1="162" y1="149" x2="162" y2="159" />
    <line x1="198" y1="149" x2="198" y2="159" />
  </g>
  <text x="180" y="176" text-anchor="middle" font-size="12" fill="var(--text, #727981)">첫 틱까지 한 틱보다 짧음</text>
</svg>
