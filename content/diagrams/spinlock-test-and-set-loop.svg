<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 -3.5 624 176.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="130" y="18" text-anchor="middle" font-size="12" fill="var(--text, #727981)">락 잡기</text>
  <line x1="130" y1="24" x2="130" y2="44" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="30" y="46" width="200" height="52" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="130" y="67" text-anchor="middle" fill="var(--text, #727981)">test-and-set</text>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="var(--text, #727981)">옛 값을 돌려받고 1을 쓴다</text>
  <line x1="230" y1="72" x2="278" y2="72" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M370 30 L460 72 L370 114 L280 72 Z" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="370" y="69" text-anchor="middle" fill="var(--text, #727981)">옛 값이</text>
  <text x="370" y="87" text-anchor="middle" fill="var(--text, #727981)">0(비었음)?</text>
  <line x1="460" y1="72" x2="518" y2="72" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="489" y="64" text-anchor="middle" font-size="12" fill="var(--text, #727981)">예</text>
  <rect x="520" y="52" width="110" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="575" y="77" text-anchor="middle" fill="var(--text, #727981)">락을 얻음</text>
  <path d="M370 114 L370 142 L130 142 L130 100" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">아니오: 락이 풀릴 때까지 되풀이해 검사한다</text>
</svg>
