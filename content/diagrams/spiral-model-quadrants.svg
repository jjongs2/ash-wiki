  <!-- 사분면 -->
  <g fill="var(--text, #727981)">
    <text x="30" y="80">1. 목표, 대안, 제약을</text>
    <text x="42" y="96">정한다</text>
    <text x="520" y="80">2. 대안을 평가하고</text>
    <text x="532" y="96">위험을 찾아 해소한다</text>
    <text x="520" y="446">3. 다음 수준의 제품을</text>
    <text x="532" y="462">개발하고 검증한다</text>
    <text x="30" y="454">4. 다음 단계를 계획한다</text>
