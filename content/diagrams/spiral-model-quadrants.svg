  <!-- 사분면 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="102">1. 목표, 대안, 제약을</text>
    <text x="32" y="118">정한다</text>
    <text x="386" y="102">2. 대안을 평가하고</text>
    <text x="398" y="118">리스크를 찾아 해소한다</text>
    <text x="386" y="302">3. 다음 수준의 제품을</text>
    <text x="398" y="318">개발하고 검증한다</text>
    <text x="20" y="302">4. 다음 단계를</text>
    <text x="32" y="318">계획한다</text>
