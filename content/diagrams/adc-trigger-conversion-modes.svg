    <line x1="288" y1="136" x2="288" y2="124" />
    <line x1="366" y1="136" x2="366" y2="124" />
    <line x1="444" y1="136" x2="444" y2="124" />
    <line x1="522" y1="136" x2="522" y2="124" />
