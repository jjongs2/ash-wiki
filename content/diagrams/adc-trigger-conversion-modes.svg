<svg xmlns="http://www.w3.org/2000/svg" viewBox="86 7 508 300" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="One-shot과 continuous의 그룹 변환">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="186" y="46">Software trigger</text>
    <text x="186" y="62">one-shot</text>
    <text x="186" y="146">Software trigger</text>
    <text x="186" y="162">continuous</text>
    <text x="186" y="246">Hardware trigger</text>
    <text x="186" y="262">one-shot</text>
  </g>

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="60" x2="556" y2="60" />
    <line x1="200" y1="160" x2="556" y2="160" />
    <line x1="200" y1="260" x2="556" y2="260" marker-end="url(#arrow)" />
  </g>
  <text x="562" y="264" fill="var(--text, #727981)">시간</text>

  <!-- 그룹 변환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="212" y="36" width="60" height="24" />
    <rect x="212" y="136" width="60" height="24" />
    <rect x="274" y="136" width="60" height="24" />
    <rect x="336" y="136" width="60" height="24" />
    <rect x="398" y="136" width="60" height="24" />
    <rect x="212" y="236" width="60" height="24" />
    <rect x="342" y="236" width="60" height="24" />
    <rect x="472" y="236" width="60" height="24" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="242" y="52">그룹 변환</text>
    <text x="242" y="152">그룹 변환</text>
    <text x="304" y="152">그룹 변환</text>
    <text x="366" y="152">그룹 변환</text>
    <text x="428" y="152">그룹 변환</text>
    <text x="242" y="252">그룹 변환</text>
    <text x="372" y="252">그룹 변환</text>
    <text x="502" y="252">그룹 변환</text>
  </g>

  <!-- notification -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="272" y1="36" x2="272" y2="24" />
    <line x1="272" y1="136" x2="272" y2="124" />
    <line x1="334" y1="136" x2="334" y2="124" />
    <line x1="396" y1="136" x2="396" y2="124" />
    <line x1="458" y1="136" x2="458" y2="124" />
    <line x1="272" y1="236" x2="272" y2="224" />
    <line x1="402" y1="236" x2="402" y2="224" />
    <line x1="532" y1="236" x2="532" y2="224" />
  </g>
  <g fill="var(--orange, #b0540d)">
    <circle cx="272" cy="22" r="4" />
    <circle cx="272" cy="122" r="4" />
    <circle cx="334" cy="122" r="4" />
    <circle cx="396" cy="122" r="4" />
    <circle cx="458" cy="122" r="4" />
    <circle cx="272" cy="222" r="4" />
    <circle cx="402" cy="222" r="4" />
    <circle cx="532" cy="222" r="4" />
  </g>
  <text x="282" y="26" fill="var(--text, #727981)">notification</text>

  <!-- 트리거 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="212" y1="80" x2="212" y2="63" />
    <line x1="212" y1="180" x2="212" y2="163" />
    <line x1="466" y1="180" x2="466" y2="163" />
    <line x1="212" y1="280" x2="212" y2="263" />
    <line x1="342" y1="280" x2="342" y2="263" />
    <line x1="472" y1="280" x2="472" y2="263" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="200" y="96">Adc_StartGroupConversion</text>
    <text x="200" y="196">Adc_StartGroupConversion</text>
    <text x="466" y="196" text-anchor="middle">Adc_StopGroupConversion</text>
    <text x="200" y="296">하드웨어 이벤트</text>
  </g>
</svg>
