  <text x="236" y="76.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PHASE_SEG1</text>
  <rect x="308" y="50" width="144" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="380" y="76.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PHASE_SEG2</text>

  <!-- time quantum 눈금 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="20" y1="96" x2="20" y2="102" />
    <line x1="68" y1="96" x2="68" y2="102" />
    <line x1="116" y1="96" x2="116" y2="102" />
    <line x1="164" y1="96" x2="164" y2="102" />
    <line x1="212" y1="96" x2="212" y2="102" />
    <line x1="260" y1="96" x2="260" y2="102" />
    <line x1="308" y1="96" x2="308" y2="102" />
    <line x1="356" y1="96" x2="356" y2="102" />
    <line x1="404" y1="96" x2="404" y2="102" />
    <line x1="452" y1="96" x2="452" y2="102" />
  </g>
  <text x="44" y="118" text-anchor="middle" font-size="12" fill="var(--text, #727981)">1 tq</text>
  <path d="M308 106 V112 H404 V106" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="356" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">정보 처리 시간</text>
  <path d="M20 146 V152 H452 V146" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="236" y="170" text-anchor="middle" font-size="12" fill="var(--text, #727981)">공칭 비트 시간</text>

  <!-- 샘플 포인트 -->
  <line x1="308" y1="32" x2="308" y2="94" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M302 24 H314 L308 34 z" fill="var(--ink, #727981)" />
