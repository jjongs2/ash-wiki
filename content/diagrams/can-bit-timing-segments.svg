<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 -5 458 190" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 세그먼트 -->
  <rect x="20" y="50" width="48" height="44" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
