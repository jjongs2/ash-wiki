<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 755.5 169" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">TJA1100의 모드</text>

  <!-- 모드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="50" width="130" height="44" rx="4" />
    <rect x="290" y="50" width="150" height="44" rx="4" />
    <rect x="580" y="50" width="130" height="44" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="77">Normal</text>
    <text x="365" y="77">Sleep Request</text>
    <text x="645" y="77">Sleep</text>
  </g>

  <!-- Sleep Request에서 나가는 전이 -->
  <line x1="288" y1="80" x2="153" y2="80" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="442" y1="80" x2="577" y2="80" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="220" y="54">MDI나 MII에서</text>
    <text x="220" y="70">이더넷 프레임 받음</text>
    <text x="510" y="54">타이머 끝남</text>
    <text x="510" y="70">INH 끔</text>
  </g>

  <!-- 모드마다 일어나는 웨이크업 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="365" y="124">로컬 웨이크업(LED_ENABLE이 0이면)</text>
    <text x="365" y="142">데이터 감지 웨이크업</text>
    <text x="645" y="124">원격 웨이크업</text>
    <text x="645" y="142">로컬 웨이크업(LED_ENABLE이 0이면)</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="365" y1="96" x2="365" y2="110" />
    <line x1="645" y1="96" x2="645" y2="110" />
  </g>
</svg>
