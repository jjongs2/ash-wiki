<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18.5 -15 380 386" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="TJA1100의 모드와 웨이크업">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="0" y="14" font-size="12" fill="var(--text, #727981)">TJA1100의 모드</text>

  <!-- 모드. Standby는 다른 모드와의 전이를 그리지 않는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="0" y="30" width="130" height="44" rx="2" />
    <rect x="0" y="128" width="130" height="44" rx="2" />
    <rect x="0" y="226" width="130" height="44" rx="2" />
    <rect x="0" y="306" width="130" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="57">Normal</text>
    <text x="65" y="155">Sleep Request</text>
    <text x="65" y="253">Sleep</text>
    <text x="65" y="333">Standby</text>
  </g>

  <!-- Sleep Request에서 나가는 전이 -->
  <line x1="65" y1="126" x2="65" y2="77" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="65" y1="174" x2="65" y2="223" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="78" y="97">MDI나 MII에서</text>
    <text x="78" y="113">이더넷 프레임 받음</text>
    <text x="78" y="195">타이머 끝남</text>
    <text x="78" y="211">INH 끔</text>
  </g>

  <!-- 모드마다 일어나는 웨이크업 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="132" y1="150" x2="150" y2="150" />
    <line x1="132" y1="248" x2="150" y2="248" />
    <line x1="132" y1="328" x2="150" y2="328" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="156" y="147">로컬 웨이크업(LED_ENABLE이 0이면)</text>
    <text x="156" y="163">데이터 감지 웨이크업</text>
    <text x="156" y="245">원격 웨이크업</text>
    <text x="156" y="261">로컬 웨이크업(LED_ENABLE이 0이면)</text>
    <text x="156" y="325">원격 웨이크업</text>
    <text x="156" y="341">로컬 웨이크업(LED_ENABLE이 0이면)</text>
  </g>
</svg>
