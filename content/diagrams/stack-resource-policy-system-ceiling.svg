<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -5.5 606 217" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 줄 이름 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="57">높은 우선순위</text>
    <text x="20" y="89">낮은 우선순위</text>
    <text x="20" y="178">system ceiling</text>
  </g>

  <!-- 위쪽 표시 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="212" y1="32" x2="308" y2="32" />
    <line x1="212" y1="27" x2="212" y2="37" />
    <line x1="308" y1="27" x2="308" y2="37" />
    <line x1="312" y1="32" x2="448" y2="32" />
    <line x1="312" y1="27" x2="312" y2="37" />
    <line x1="448" y1="27" x2="448" y2="37" />
  </g>
  <text x="260" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)"><tspan font-style="italic">B</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  <text x="314" y="24" font-size="12" fill="var(--text, #727981)">시작하면 끝날 때까지 블록되지 않음</text>

  <!-- 높은 우선순위 job -->
  <rect x="210.75" y="40.75" width="98.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">준비 큐 대기</text>
  <rect x="310.75" y="40.75" width="38.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="350.75" y="40.75" width="38.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="370" y="56" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">자원</text>
  <rect x="390.75" y="40.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 낮은 우선순위 job -->
  <rect x="110.75" y="72.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="170.75" y="72.75" width="138.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">자원</text>
  <rect x="310.75" y="72.75" width="138.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="380" y="88" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점됨</text>
  <rect x="450.75" y="72.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 시간 축 -->
  <line x1="100" y1="104" x2="558" y2="104" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="566" y="108" font-size="12" fill="var(--text, #727981)">시간</text>
  <path d="M210 107 L215 117 L205 117 z" fill="var(--ink, #727981)" />
  <text x="210" y="134" text-anchor="middle" font-size="12" fill="var(--text, #727981)">도착</text>

  <!-- system ceiling -->
  <path d="M110 190 H170 V158 H310 V190 H350 V158 H390 V190 H520" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="150">자원 잠금</text>
    <text x="240" y="150">자원의 상한</text>
    <text x="310" y="150">자원 풀림</text>
  </g>
</svg>
