<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.5 3 462.5 293.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- binding time: 이른 것부터 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="190" y="32" text-anchor="end">이른 것</text>
    <text x="190" y="276" text-anchor="end">늦은 것</text>
  </g>
  <line x1="200" y1="24" x2="200" y2="270" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M195 56 h10 M195 92 h10 M195 128 h10 M195 164 h10 M195 200 h10 M195 236 h10" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="188" y="60.5">BlueprintDerivationTime</text>
    <text x="188" y="96.5">SystemDesignTime</text>
    <text x="188" y="132.5">CodeGenerationTime</text>
    <text x="188" y="168.5">PreCompileTime</text>
    <text x="188" y="204.5">LinkTime</text>
    <text x="188" y="240.5">PostBuild</text>
  </g>

  <!-- variation point 하나의 예 -->
  <text x="250" y="32" font-size="12" fill="var(--text, #727981)">variation point 하나의 예</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="205" y1="200" x2="250" y2="200" />
    <line x1="205" y1="164" x2="250" y2="164" />
  </g>
  <line x1="250" y1="200" x2="270" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <circle cx="260" cy="164" r="4" fill="var(--ink, #727981)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="280" y="204.5">latest binding time: 메타모델이 정한다</text>
    <text x="280" y="168.5">실제 binding time: 모델에서 정한다</text>
    <text x="280" y="221.5">latest binding time보다 늦게 풀 수 없다</text>
  </g>
</svg>
