<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 3 550 401" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="AURIX TC3xx의 CPU별 PSPR·DSPR과 LMU">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Infineon AURIX TC3xx</text>

  <!-- CPU 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="48" width="236" height="192" rx="2" />
    <rect x="272" y="48" width="236" height="192" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="66">TriCore CPU</text>
    <text x="284" y="66">TriCore CPU</text>
  </g>
  <text x="529" y="147" text-anchor="middle" fill="var(--text, #727981)">…</text>

  <!-- CPU 안 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="78" width="102" height="36" rx="2" />
    <rect x="142" y="78" width="102" height="36" rx="2" />
    <rect x="32" y="134" width="212" height="36" rx="2" />
    <rect x="32" y="190" width="102" height="36" rx="2" />
    <rect x="142" y="190" width="102" height="36" rx="2" />
    <rect x="284" y="78" width="102" height="36" rx="2" />
    <rect x="394" y="78" width="102" height="36" rx="2" />
    <rect x="284" y="134" width="212" height="36" rx="2" />
    <rect x="284" y="190" width="102" height="36" rx="2" />
    <rect x="394" y="190" width="102" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="83" y="101">PSPR</text>
    <text x="193" y="101">DSPR</text>
    <text x="138" y="157">TriCore 코어</text>
    <text x="83" y="213">프로그램 캐시</text>
    <text x="193" y="213">데이터 캐시</text>
    <text x="335" y="101">PSPR</text>
    <text x="445" y="101">DSPR</text>
    <text x="390" y="157">TriCore 코어</text>
    <text x="335" y="213">프로그램 캐시</text>
    <text x="445" y="213">데이터 캐시</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="83" y1="114" x2="83" y2="134" />
    <line x1="193" y1="114" x2="193" y2="134" />
    <line x1="83" y1="170" x2="83" y2="190" />
    <line x1="193" y1="170" x2="193" y2="190" />
    <line x1="335" y1="114" x2="335" y2="134" />
    <line x1="445" y1="114" x2="445" y2="134" />
    <line x1="335" y1="170" x2="335" y2="190" />
    <line x1="445" y1="170" x2="445" y2="190" />
  </g>

  <!-- SRI와 LMU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="272" width="488" height="36" rx="2" />
    <rect x="164" y="336" width="200" height="48" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="138" y1="240" x2="138" y2="272" />
    <line x1="390" y1="240" x2="390" y2="272" />
    <line x1="264" y1="308" x2="264" y2="336" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="264" y="295">SRI</text>
    <text x="264" y="356">LMU</text>
  </g>
  <text x="264" y="374" text-anchor="middle" font-size="12" fill="var(--text, #727981)">로컬 메모리 256 KB까지</text>
</svg>
