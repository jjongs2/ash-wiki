<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 700 371" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 세로 버스 -->
  <line x1="360" y1="20" x2="360" y2="350" stroke="var(--ink, #727981)" stroke-width="3" />
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="var(--text, #727981)">버스</text>

  <!-- 송신 노드 -->
  <rect x="166.75" y="32.75" width="108.5" height="34.5" rx="4" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="221" y="55" text-anchor="middle" fill="var(--on-fill, #f8fafd)">송신 노드</text>
  <line x1="276" y1="50" x2="357" y2="50" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 버스를 지나는 프레임 -->
  <rect x="310.75" y="78.75" width="48.5" height="20.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="335" y="93" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">식별자</text>
  <rect x="360.75" y="78.75" width="48.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="385" y="93" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">데이터</text>
  <text x="302" y="93" text-anchor="end" font-size="12" fill="var(--text, #727981)">프레임</text>

  <!-- 노드마다 수용 필터가 식별자를 보고 가린다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="430.75" y="118.75" width="268.5" height="62.5" rx="4" />
    <rect x="20.75" y="198.75" width="268.5" height="62.5" rx="4" />
    <rect x="430.75" y="278.75" width="268.5" height="62.5" rx="4" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="434" y="112">노드</text>
    <text x="286" y="192" text-anchor="end">노드</text>
    <text x="434" y="272">노드</text>
  </g>

  <!-- 버스에서 필터로: 식별자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="362" y1="150" x2="444" y2="150" marker-end="url(#arrow)" />
    <line x1="358" y1="230" x2="278" y2="230" marker-end="url(#arrow)" />
    <line x1="362" y1="310" x2="444" y2="310" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="396" y="142">식별자</text>
    <text x="324" y="222">식별자</text>
    <text x="396" y="302">식별자</text>
  </g>

  <!-- 수용 필터 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="446" y="132" width="110" height="36" rx="4" fill="var(--surface, none)" />
    <rect x="166" y="212" width="110" height="36" rx="4" fill="var(--surface, none)" />
    <rect x="446" y="292" width="110" height="36" rx="4" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="501" y="155">수용 필터</text>
    <text x="221" y="235">수용 필터</text>
    <text x="501" y="315">수용 필터</text>
  </g>

  <!-- 판정 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="556" y1="150" x2="594" y2="150" marker-end="url(#arrow)" />
    <line x1="166" y1="230" x2="128" y2="230" marker-end="url(#arrow)" />
    <line x1="556" y1="310" x2="594" y2="310" marker-end="url(#arrow)" />
  </g>
  <rect x="596.75" y="132.75" width="88.5" height="34.5" rx="4" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="641" y="155" text-anchor="middle" fill="var(--on-fill, #f8fafd)">받아들임</text>
  <rect x="36.75" y="212.75" width="88.5" height="34.5" rx="4" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="81" y="235" text-anchor="middle" fill="var(--on-fill, #f8fafd)">버림</text>
  <rect x="596.75" y="292.75" width="88.5" height="34.5" rx="4" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="641" y="315" text-anchor="middle" fill="var(--on-fill, #f8fafd)">받아들임</text>
</svg>
