<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 700 371" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 세로 버스 -->
  <line x1="360" y1="20" x2="360" y2="350" stroke="#727981" stroke-width="3" />
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#727981">버스</text>

  <!-- 송신 노드 -->
  <rect x="166" y="32" width="110" height="36" rx="4" fill="#825da9" />
  <text x="221" y="55" text-anchor="middle" fill="#f8fafd">송신 노드</text>
  <line x1="276" y1="50" x2="357" y2="50" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 버스를 지나는 프레임 -->
  <rect x="310" y="78" width="50" height="22" fill="#b0540d" />
  <text x="335" y="93" text-anchor="middle" font-size="12" fill="#f8fafd">식별자</text>
  <rect x="360" y="78" width="50" height="22" fill="#336fb8" />
  <text x="385" y="93" text-anchor="middle" font-size="12" fill="#f8fafd">데이터</text>
  <text x="302" y="93" text-anchor="end" font-size="12" fill="#727981">프레임</text>

  <!-- 노드마다 수용 필터가 식별자를 보고 가린다 -->
  <g stroke="#727981" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="430.75" y="118.75" width="268.5" height="62.5" rx="8" />
    <rect x="20.75" y="198.75" width="268.5" height="62.5" rx="8" />
    <rect x="430.75" y="278.75" width="268.5" height="62.5" rx="8" />
  </g>
  <g font-size="12" fill="#727981">
    <text x="434" y="112">노드</text>
    <text x="286" y="192" text-anchor="end">노드</text>
    <text x="434" y="272">노드</text>
  </g>

  <!-- 버스에서 필터로: 식별자 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="362" y1="150" x2="444" y2="150" marker-end="url(#arrow)" />
    <line x1="358" y1="230" x2="278" y2="230" marker-end="url(#arrow)" />
    <line x1="362" y1="310" x2="444" y2="310" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="396" y="142">식별자</text>
    <text x="324" y="222">식별자</text>
    <text x="396" y="302">식별자</text>
  </g>

  <!-- 수용 필터 -->
  <g fill="#336fb8">
    <rect x="446" y="132" width="110" height="36" rx="4" />
    <rect x="166" y="212" width="110" height="36" rx="4" />
    <rect x="446" y="292" width="110" height="36" rx="4" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="501" y="155">수용 필터</text>
    <text x="221" y="235">수용 필터</text>
    <text x="501" y="315">수용 필터</text>
  </g>

  <!-- 판정 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="556" y1="150" x2="594" y2="150" marker-end="url(#arrow)" />
    <line x1="166" y1="230" x2="128" y2="230" marker-end="url(#arrow)" />
    <line x1="556" y1="310" x2="594" y2="310" marker-end="url(#arrow)" />
  </g>
  <rect x="596" y="132" width="90" height="36" rx="4" fill="#337b47" />
  <text x="641" y="155" text-anchor="middle" fill="#f8fafd">받아들임</text>
  <rect x="36" y="212" width="90" height="36" rx="4" fill="#bb464d" />
  <text x="81" y="235" text-anchor="middle" fill="#f8fafd">버림</text>
  <rect x="596" y="292" width="90" height="36" rx="4" fill="#337b47" />
  <text x="641" y="315" text-anchor="middle" fill="#f8fafd">받아들임</text>
</svg>
