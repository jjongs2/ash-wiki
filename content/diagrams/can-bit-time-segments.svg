<svg xmlns="http://www.w3.org/2000/svg" viewBox="63.5 -13.5 537.5 204.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 샘플 포인트: PHASE_SEG1의 끝 -->
  <text x="436" y="16" text-anchor="middle" font-size="12" fill="#727981">샘플 포인트</text>
  <line x1="436" y1="22" x2="436" y2="41" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 네 구간 -->
  <text x="124" y="36" text-anchor="middle" font-size="12" fill="#727981">SYNC_SEG</text>
  <rect x="100" y="44" width="48" height="44" fill="#825da9" />
  <rect x="148" y="44" width="144" height="44" fill="#336fb8" />
  <rect x="292" y="44" width="144" height="44" fill="#337b47" />
  <rect x="436" y="44" width="144" height="44" fill="#b0540d" />
  <g text-anchor="middle" fill="#f8fafd">
    <text x="220" y="71">PROP_SEG</text>
    <text x="364" y="71">PHASE_SEG1</text>
    <text x="508" y="71">PHASE_SEG2</text>
  </g>

  <!-- time quantum 눈금 -->
  <line x1="100" y1="104" x2="580" y2="104" stroke="#727981" stroke-width="1.5" />
  <g stroke="#727981" stroke-width="1.5">
    <line x1="100" y1="98" x2="100" y2="110" />
    <line x1="148" y1="98" x2="148" y2="110" />
    <line x1="196" y1="98" x2="196" y2="110" />
    <line x1="244" y1="98" x2="244" y2="110" />
    <line x1="292" y1="98" x2="292" y2="110" />
    <line x1="340" y1="98" x2="340" y2="110" />
    <line x1="388" y1="98" x2="388" y2="110" />
    <line x1="436" y1="98" x2="436" y2="110" />
    <line x1="484" y1="98" x2="484" y2="110" />
    <line x1="532" y1="98" x2="532" y2="110" />
    <line x1="580" y1="98" x2="580" y2="110" />
  </g>
  <text x="124" y="126" text-anchor="middle" font-size="12" fill="#727981">1 time quantum</text>

  <!-- 공칭 비트 시간 -->
  <line x1="100" y1="146" x2="580" y2="146" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="340" y="170" text-anchor="middle" fill="#727981">공칭 비트 시간</text>
</svg>
