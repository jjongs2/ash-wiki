<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 8 424 274" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#336fb8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b0540d" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="150" y="20" width="100" height="36" rx="4" fill="#825da9" />
  <text x="200" y="43" text-anchor="middle" fill="#f8fafd">클라이언트</text>
  <rect x="450" y="20" width="100" height="36" rx="4" fill="#825da9" />
  <text x="500" y="43" text-anchor="middle" fill="#f8fafd">서버</text>
  <g stroke="#727981" stroke-width="1.5">
    <line x1="200" y1="56" x2="200" y2="270" />
    <line x1="500" y1="56" x2="500" y2="270" />
  </g>

  <!-- OfferService -->
  <line x1="498" y1="84" x2="202" y2="98" stroke="#336fb8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="350" y="84" text-anchor="middle" font-size="12" fill="#727981">OfferService</text>

  <!-- TCP 연결 (이벤트 그룹을 TCP로 받을 때) -->
  <line x1="202" y1="132" x2="498" y2="132" stroke="#727981" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="350" y="124" text-anchor="middle" font-size="12" fill="#727981">TCP 연결 (이벤트 그룹을 TCP로 받을 때)</text>

  <!-- 구독 -->
  <line x1="202" y1="166" x2="498" y2="180" stroke="#336fb8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="350" y="166" text-anchor="middle" font-size="12" fill="#727981">SubscribeEventgroup</text>
  <line x1="498" y1="206" x2="202" y2="220" stroke="#336fb8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="350" y="206" text-anchor="middle" font-size="12" fill="#727981">SubscribeEventgroupAck</text>

  <!-- 필드 notifier 초기값 -->
  <line x1="498" y1="246" x2="202" y2="260" stroke="#b0540d" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="350" y="246" text-anchor="middle" font-size="12" fill="#727981">필드 notifier의 초기값</text>
</svg>
