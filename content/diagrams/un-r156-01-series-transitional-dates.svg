<svg xmlns="http://www.w3.org/2000/svg" viewBox="44.5 1 737 191.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 1년 = 120 단위, 2026년 1월 1일 = x 150 -->
  <g fill="var(--text, #727981)" text-anchor="end">
    <text x="136" y="82.5">UN R156</text>
    <text x="136" y="98" font-size="12">01 시리즈 13절</text>
  </g>
  <line x1="150" y1="78" x2="750" y2="78" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 날짜 -->
  <g fill="var(--ink, #727981)">
    <circle cx="200.6" cy="78" r="4" />
    <circle cx="470" cy="78" r="4" />
    <circle cx="709.9" cy="78" r="4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="200.6" y="46">01 시리즈 구속</text>
    <text x="200.6" y="62">2026년 6월 4일</text>
    <text x="470" y="30">그날 뒤 처음 나온 원판 승인을</text>
    <text x="470" y="46">받아들일 의무 없음</text>
    <text x="470" y="62">2028년 9월 1일</text>
    <text x="709.9" y="30">모든 원판 승인을</text>
    <text x="709.9" y="46">받아들일 의무 없음</text>
    <text x="709.9" y="62">2030년 9월 1일</text>
  </g>

  <!-- 연도 축 -->
  <line x1="150" y1="122" x2="750" y2="122" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M150 122 v5 M270 122 v5 M390 122 v5 M510 122 v5 M630 122 v5 M750 122 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="143">2026</text>
    <text x="270" y="143">2027</text>
    <text x="390" y="143">2028</text>
    <text x="510" y="143">2029</text>
    <text x="630" y="143">2030</text>
    <text x="750" y="143">2031</text>
  </g>
  <text x="150" y="172" font-size="12" fill="var(--text, #727981)">01 시리즈가 바꾼 내용과 무관한 차량의 원판 승인은 계속 받아들인다</text>
</svg>
