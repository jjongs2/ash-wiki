<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 640 184.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- 양 끝의 PHY -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="28" width="110" height="44" rx="2" />
    <rect x="510" y="28" width="110" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="55">PHY</text>
    <text x="565" y="55">PHY</text>
  </g>

  <!-- PSE와 PD -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="20.75" y="108.75" width="108.5" height="42.5" rx="2" />
    <rect x="510.75" y="108.75" width="108.5" height="42.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="75" y="135">PSE</text>
    <text x="565" y="135">PD</text>
  </g>

  <!-- MDI에서 한 쌍으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M130 50 H150 V130 H130" />
    <path d="M510 50 H490 V130 H510" />
    <line x1="150" y1="84" x2="490" y2="84" />
    <line x1="150" y1="96" x2="490" y2="96" />
  </g>

  <!-- 데이터와 전력 -->
  <line x1="200" y1="62" x2="440" y2="62" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터</text>
  <line x1="200" y1="118" x2="440" y2="118" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="320" y="138" text-anchor="middle" font-size="12" fill="var(--text, #727981)">전력</text>

  <!-- 링크 세그먼트 -->
  <path d="M150 150 V156 H490 V150" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="var(--text, #727981)">링크 세그먼트 · 한 쌍</text>
</svg>
