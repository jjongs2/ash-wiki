<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 10 710 236" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150" y="20" width="120" height="36" rx="2" />
    <rect x="510" y="20" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="43">Time Master</text>
    <text x="570" y="43">Time Slave</text>
  </g>
  <text x="390" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Time Synchronization over CAN</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="210" y1="56" x2="210" y2="206" />
    <line x1="570" y1="56" x2="570" y2="206" />
  </g>

  <!-- SYNC와 FUP -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="210" y1="90" x2="566" y2="110" marker-end="url(#arrow)" />
    <line x1="210" y1="170" x2="566" y2="190" marker-end="url(#arrow)" />
    <path d="M578 110 H584 V190 H578" stroke-width="1" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="210" cy="90" r="3.5" />
    <circle cx="570" cy="110" r="3.5" />
    <circle cx="570" cy="190" r="3.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="390" y="82">SYNC: 현재 시간의 초 부분</text>
    <text x="390" y="162">FUP: 초 값과 SYNC 송신 시점 사이의 오프셋</text>
    <text x="390" y="234">Time Slave의 시간 = 두 메시지에 실린 시간 + SYNC 전달 시간 + SYNC 수신 뒤 지난 시간</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="198" y="94" text-anchor="end">SYNC 송신 시점 타임스탬프</text>
    <text x="592" y="114">SYNC 수신 시점 타임스탬프</text>
    <text x="592" y="154">SYNC 수신 뒤 지난 시간</text>
    <text x="592" y="194">FUP 수신: 시간 맞추기</text>
  </g>
</svg>
