<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 522 276" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="SYNC와 FUP로 시간을 맞추는 두 단계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="70" y="20" width="110" height="36" rx="2" />
    <rect x="345" y="20" width="110" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="125" y="43">Time Master</text>
    <text x="400" y="43">Time Slave</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="262" y="35">Time Synchronization</text>
    <text x="262" y="50">over CAN</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="125" y1="56" x2="125" y2="216" />
    <line x1="400" y1="56" x2="400" y2="216" />
  </g>

  <!-- SYNC와 FUP -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="125" y1="90" x2="396" y2="110" marker-end="url(#arrow)" />
    <line x1="125" y1="170" x2="396" y2="190" marker-end="url(#arrow)" />
    <path d="M408 110 H414 V190 H408" stroke-width="1" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="125" cy="90" r="3.5" />
    <circle cx="400" cy="110" r="3.5" />
    <circle cx="400" cy="190" r="3.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="262" y="82">SYNC: 현재 시간의 초 부분</text>
    <text x="262" y="162">FUP: 초 값과 SYNC 송신 시점 사이의 오프셋</text>
    <text x="262" y="240">Time Slave의 시간 = 두 메시지에 실린 시간</text>
    <text x="262" y="256">+ SYNC 전달 시간 + SYNC 수신 뒤 지난 시간</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="113" y="88" text-anchor="end">SYNC 송신 시점</text>
    <text x="113" y="102" text-anchor="end">타임스탬프</text>
    <text x="422" y="108">SYNC 수신 시점</text>
    <text x="422" y="122">타임스탬프</text>
    <text x="422" y="148">SYNC 수신 뒤</text>
    <text x="422" y="162">지난 시간</text>
    <text x="422" y="192">FUP 수신:</text>
    <text x="422" y="206">시간 맞추기</text>
  </g>
</svg>
