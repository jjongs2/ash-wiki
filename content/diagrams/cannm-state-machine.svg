<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 82 472 570" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Network Mode에서 Bus-Sleep Mode까지의 상태 기계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Network Mode와 그 안의 세 상태 -->
  <rect x="40" y="100" width="390" height="330" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="56" y="124" fill="var(--text, #727981)">Network Mode</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="140" width="190" height="44" rx="2" />
    <rect x="60" y="254" width="190" height="44" rx="2" />
    <rect x="60" y="368" width="190" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="167">Repeat Message State</text>
    <text x="155" y="281">Normal Operation State</text>
    <text x="155" y="395">Ready Sleep State</text>
  </g>

  <!-- Network Mode 밖의 두 모드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="470" width="190" height="44" rx="2" />
    <rect x="60" y="570" width="190" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="497">Prepare Bus-Sleep Mode</text>
    <text x="155" y="597">Bus-Sleep Mode</text>
  </g>

  <!-- 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="155" y1="186" x2="155" y2="252" marker-end="url(#arrow)" />
    <path d="M252 172 H400 V390 H252" marker-end="url(#arrow)" />
    <line x1="135" y1="300" x2="135" y2="366" marker-end="url(#arrow)" />
    <line x1="185" y1="366" x2="185" y2="300" marker-end="url(#arrow)" />
    <line x1="155" y1="414" x2="155" y2="468" marker-end="url(#arrow)" />
    <line x1="155" y1="516" x2="155" y2="568" marker-end="url(#arrow)" />
    <path d="M252 592 H470 V150 H252" marker-end="url(#arrow)" />
    <line x1="252" y1="492" x2="470" y2="492" />
  </g>
  <circle cx="470" cy="492" r="3" fill="var(--ink, #727981)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="163" y="214">CanNmRepeatMessageTime 경과</text>
    <text x="163" y="232">네트워크 요청됨</text>
    <text x="392" y="322" text-anchor="end">CanNmRepeatMessageTime 경과</text>
    <text x="392" y="340" text-anchor="end">네트워크 해제됨</text>
    <text x="127" y="338" text-anchor="end">네트워크 해제</text>
    <text x="193" y="356">네트워크 요청</text>
    <text x="262" y="486">네트워크 요청, NM 메시지 수신</text>
    <text x="163" y="446">NM-Timeout 타이머 만료</text>
    <text x="163" y="546">Wait Bus-Sleep 타이머 만료</text>
    <text x="340" y="142" text-anchor="middle">네트워크 요청</text>
    <text x="60" y="634">NM 메시지를 받으면 Nm interface를 거쳐 ComM에 알리기만 한다</text>
  </g>
</svg>
