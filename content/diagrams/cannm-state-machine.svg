<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 -1.5 860 345" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Network Mode와 그 안의 세 상태 -->
  <rect x="210" y="20" width="610" height="194" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="226" y="44" fill="var(--text, #727981)">Network Mode</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="230" y="60" width="180" height="44" rx="2" />
    <rect x="630" y="60" width="170" height="44" rx="2" />
    <rect x="630" y="150" width="170" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="87">Repeat Message State</text>
    <text x="715" y="87">Normal Operation State</text>
    <text x="715" y="177">Ready Sleep State</text>
  </g>

  <!-- Network Mode 밖의 두 모드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="258" width="160" height="44" rx="2" />
    <rect x="620" y="258" width="190" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="285">Bus-Sleep Mode</text>
    <text x="715" y="285">Prepare Bus-Sleep Mode</text>
  </g>

  <!-- 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M100 256 V82 H228" marker-end="url(#arrow)" />
    <line x1="412" y1="82" x2="628" y2="82" marker-end="url(#arrow)" />
    <path d="M320 106 V172 H628" marker-end="url(#arrow)" />
    <line x1="715" y1="106" x2="715" y2="148" marker-end="url(#arrow)" />
    <line x1="715" y1="196" x2="715" y2="256" marker-end="url(#arrow)" />
    <line x1="618" y1="280" x2="182" y2="280" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="108" y="170">네트워크 요청</text>
    <text x="520" y="74" text-anchor="middle">CanNmRepeatMessageTime 경과</text>
    <text x="520" y="98" text-anchor="middle">네트워크 요청됨</text>
    <text x="330" y="146">CanNmRepeatMessageTime 경과</text>
    <text x="330" y="164">네트워크 해제됨</text>
    <text x="723" y="131">네트워크 해제</text>
    <text x="723" y="240">NM-Timeout 타이머 만료</text>
    <text x="400" y="272" text-anchor="middle">Wait Bus-Sleep 타이머 만료</text>
    <text x="20" y="322">NM 메시지를 받으면 상위 계층에 알리기만 한다</text>
  </g>
</svg>
