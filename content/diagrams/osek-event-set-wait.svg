<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 184" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 설정하는 쪽 -->
  <rect x="20.75" y="20.75" width="158.5" height="46.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="20.75" y="116.75" width="158.5" height="46.5" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="100" y="40">태스크</text>
    <text x="100" y="57" font-size="12">basic 또는 extended</text>
    <text x="100" y="145">category 2 ISR</text>
  </g>

  <!-- 이벤트 비트 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="270" y="78" width="24" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="302" y="78" width="24" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="334" y="78" width="24" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="366" y="78" width="24" height="28" rx="2" fill="var(--surface, none)" />
  </g>
  <text x="330" y="126" text-anchor="middle" font-size="12" fill="var(--text, #727981)">이벤트 비트</text>

  <!-- 소유자 -->
  <rect x="460.75" y="68.75" width="158.5" height="46.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="540" y="88">소유자</text>
    <text x="540" y="105" font-size="12">extended 태스크</text>
  </g>

  <!-- 서비스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M182 44 H224 L262 84" marker-end="url(#arrow)" />
    <path d="M182 140 H224 L262 100" marker-end="url(#arrow)" />
    <line x1="458" y1="92" x2="398" y2="92" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="210" y="36">SetEvent</text>
    <text x="210" y="132">SetEvent</text>
    <text x="428" y="82">WaitEvent</text>
    <text x="428" y="112">ClearEvent</text>
  </g>
</svg>
