<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.5 532 450" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Platform Health Management 틀 -->
  <rect x="20.75" y="80.75" width="478.5" height="210" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="34" y="104" fill="var(--text, #727981)">Platform Health Management</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="185" y="20" width="150" height="32" rx="2" />
    <rect x="50" y="144" width="120" height="28" rx="2" />
    <rect x="200" y="144" width="120" height="28" rx="2" />
    <rect x="350" y="144" width="120" height="28" rx="2" />
    <rect x="185" y="222" width="150" height="44" rx="2" />
    <rect x="20" y="370" width="160" height="36" rx="2" />
    <rect x="270" y="370" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="41">Supervised Entity</text>
    <text x="110" y="163">Alive</text>
    <text x="260" y="163">Deadline</text>
    <text x="410" y="163">Logical</text>
    <text x="260" y="240">Global</text>
    <text x="260" y="257">Supervision Status</text>
    <text x="100" y="393">WatchdogInterface</text>
    <text x="350" y="393">State Management</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="50" y="134">Elementary Supervision Status</text>
    <text x="345" y="249">Function Group에 대응</text>
    <text x="100" y="428" text-anchor="middle">watchdog 반응을 일으킨다</text>
    <text x="350" y="428" text-anchor="middle">Function Group을 다른 상태로 바꿔 복구</text>
  </g>

  <!-- 체크포인트에서 상태로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="260" y1="52" x2="260" y2="142" />
    <line x1="110" y1="172" x2="223" y2="220" />
    <line x1="260" y1="172" x2="260" y2="220" />
    <line x1="410" y1="172" x2="297" y2="220" />
  </g>
  <text x="268" y="71" font-size="12" fill="var(--text, #727981)">체크포인트</text>

  <!-- 복구와 watchdog 반응 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="291" x2="100" y2="368" />
    <line x1="290" y1="266" x2="290" y2="368" />
    <line x1="350" y1="370" x2="350" y2="293" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="108" y="315">alive 알림을 멈춘다</text>
    <text x="282" y="330" text-anchor="end">kEXPIRED</text>
    <text x="282" y="345" text-anchor="end">RecoveryHandler</text>
    <text x="358" y="315">RecoveryHandler 반환</text>
    <text x="358" y="330">kSMCanNotHandleRecovery</text>
    <text x="358" y="345">watchdog 반응 요청</text>
  </g>
</svg>
