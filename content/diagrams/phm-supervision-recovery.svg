<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.5 802 349.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Platform Health Management 틀 -->
  <rect x="220.75" y="20.75" width="440.5" height="200.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="234" y="44" fill="var(--text, #727981)">Platform Health Management</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="106" width="120" height="44" rx="2" />
    <rect x="260" y="76" width="140" height="28" rx="2" />
    <rect x="260" y="114" width="140" height="28" rx="2" />
    <rect x="260" y="152" width="140" height="28" rx="2" />
    <rect x="470" y="106" width="160" height="44" rx="2" />
    <rect x="220" y="270" width="160" height="36" rx="2" />
    <rect x="470" y="270" width="180" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="124">Supervised</text>
    <text x="80" y="141">Entity</text>
    <text x="330" y="95">Alive</text>
    <text x="330" y="133">Deadline</text>
    <text x="330" y="171">Logical</text>
    <text x="550" y="124">Global</text>
    <text x="550" y="141">Supervision Status</text>
    <text x="300" y="293">하드웨어 watchdog</text>
    <text x="560" y="293">State Management</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="330" y="66">Elementary Supervision Status</text>
    <text x="550" y="96">Function Group에 대응</text>
    <text x="560" y="328">Function Group을 다른 상태로 바꿔 복구</text>
  </g>

  <!-- 체크포인트에서 상태로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="140" y1="128" x2="258" y2="128" />
    <line x1="400" y1="90" x2="468" y2="120" />
    <line x1="400" y1="128" x2="468" y2="128" />
    <line x1="400" y1="166" x2="468" y2="136" />
  </g>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="var(--text, #727981)">체크포인트</text>

  <!-- 복구와 watchdog 반응 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="510" y1="150" x2="510" y2="268" />
    <line x1="620" y1="270" x2="620" y2="223" />
    <line x1="300" y1="221" x2="300" y2="268" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="500" y="242" text-anchor="end">kEXPIRED</text>
    <text x="500" y="257" text-anchor="end">RecoveryHandler</text>
    <text x="630" y="242">watchdog 반응 요청</text>
    <text x="630" y="257">kSMCanNotHandleRecovery</text>
    <text x="290" y="250" text-anchor="end">alive 알림을 멈춘다</text>
  </g>
</svg>
