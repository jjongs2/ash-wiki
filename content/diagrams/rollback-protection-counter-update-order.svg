<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -9 590 379" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="20">유효 표시 뒤에 올릴 때</text>
    <text x="40" y="200">부팅 성공 표시 전에 갱신할 때(Android 문서)</text>
  </g>

  <!-- 유효 표시 뒤에 올릴 때 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="32" width="150" height="48" rx="2" />
    <rect x="240" y="32" width="150" height="48" rx="2" />
    <rect x="40" y="122" width="150" height="36" rx="2" />
  </g>
  <rect x="440" y="32" width="150" height="48" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="61">새 이미지로 부팅</text>
    <text x="315" y="61">유효 표시</text>
    <text x="115" y="145">이전 이미지로 롤백</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="515" y="52">저장된</text>
    <text x="515" y="70">보안 버전 올림</text>
  </g>

  <!-- 부팅 성공 표시 전에 갱신할 때 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="212" width="150" height="48" rx="2" />
    <rect x="215" y="302" width="200" height="48" rx="2" />
  </g>
  <rect x="240" y="212" width="150" height="48" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="241">새 슬롯으로 부팅</text>
    <text x="315" y="322">이전 슬롯으로 돌아가도</text>
    <text x="315" y="340">이전 버전이 부팅되지 않음</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="315" y="232">롤백 방지</text>
    <text x="315" y="250">메타데이터 갱신</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="192" y1="56" x2="238" y2="56" marker-end="url(#arrow)" />
    <line x1="392" y1="56" x2="438" y2="56" marker-end="url(#arrow)" />
    <line x1="115" y1="82" x2="115" y2="120" marker-end="url(#arrow)" />
    <line x1="192" y1="236" x2="238" y2="236" marker-end="url(#arrow)" />
    <line x1="315" y1="262" x2="315" y2="300" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="123" y="105">점검 실패</text>
    <text x="323" y="285">업데이트 실패</text>
  </g>
</svg>
