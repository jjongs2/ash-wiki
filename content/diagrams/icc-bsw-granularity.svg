<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 720 214" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 등급 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="26">ICC3</text>
    <text x="360" y="26">ICC2</text>
    <text x="600" y="26">ICC1</text>
  </g>

  <!-- RTE와 ICC3 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="60" width="200" height="30" rx="2" />
    <rect x="20" y="100" width="95" height="34" rx="2" />
    <rect x="125" y="100" width="95" height="34" rx="2" />
    <rect x="20" y="144" width="95" height="34" rx="2" />
    <rect x="125" y="144" width="95" height="34" rx="2" />
    <rect x="260" y="60" width="200" height="30" rx="2" />
    <rect x="260" y="144" width="95" height="34" rx="2" />
    <rect x="365" y="144" width="95" height="34" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="80">RTE</text>
    <text x="360" y="80">RTE</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="67.5" y="121">ICC3 모듈</text>
    <text x="172.5" y="121">ICC3 모듈</text>
    <text x="67.5" y="165">ICC3 모듈</text>
    <text x="172.5" y="165">ICC3 모듈</text>
    <text x="307.5" y="165">ICC3 모듈</text>
    <text x="412.5" y="165">ICC3 모듈</text>
  </g>

  <!-- 클러스터 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="260" y="100" width="200" height="34" rx="2" />
    <rect x="500" y="60" width="200" height="118" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="360" y="121">ICC2 클러스터</text>
    <text x="600" y="123">ICC1 클러스터</text>
  </g>

  <!-- ICC1의 인터페이스 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="600" y="52">SW-CI</text>
    <text x="600" y="196">NWI</text>
  </g>
</svg>
