<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 524 214" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="ICC3 모듈과 ICC2·ICC1 클러스터의 BSW 구조">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 등급 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="92" y="26">ICC3</text>
    <text x="262" y="26">ICC2</text>
    <text x="432" y="26">ICC1</text>
  </g>

  <!-- RTE와 ICC3 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="16" y="60" width="152" height="30" rx="2" />
    <rect x="16" y="100" width="72" height="34" rx="2" />
    <rect x="96" y="100" width="72" height="34" rx="2" />
    <rect x="16" y="144" width="72" height="34" rx="2" />
    <rect x="96" y="144" width="72" height="34" rx="2" />
    <rect x="186" y="60" width="152" height="30" rx="2" />
    <rect x="186" y="144" width="72" height="34" rx="2" />
    <rect x="266" y="144" width="72" height="34" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="92" y="80">RTE</text>
    <text x="262" y="80">RTE</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="52" y="121">ICC3 모듈</text>
    <text x="132" y="121">ICC3 모듈</text>
    <text x="52" y="165">ICC3 모듈</text>
    <text x="132" y="165">ICC3 모듈</text>
    <text x="222" y="165">ICC3 모듈</text>
    <text x="302" y="165">ICC3 모듈</text>
  </g>

  <!-- 클러스터 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="186" y="100" width="152" height="34" rx="2" />
    <rect x="356" y="60" width="152" height="118" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="262" y="121">ICC2 클러스터</text>
    <text x="432" y="123">ICC1 클러스터</text>
  </g>

  <!-- ICC1의 인터페이스 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="432" y="52">SW-CI</text>
    <text x="432" y="196">NWI</text>
  </g>
</svg>
