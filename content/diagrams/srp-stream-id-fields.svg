<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5.5 488 150.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="StreamID를 이루는 MAC 주소와 Unique ID">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 전체 길이 -->
  <path d="M20.5 40 V32 H467.5 V40" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="244" y="24" text-anchor="middle" fill="var(--text, #727981)">StreamID 64비트</text>

  <!-- 필드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="44.75" width="335.25" height="42.5" />
    <rect x="356" y="44.75" width="111.25" height="42.5" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="188" y="63" font-size="14">MAC 주소</text>
    <text x="188" y="79">48비트</text>
    <text x="412" y="63" font-size="14">Unique ID</text>
    <text x="412" y="79">16비트</text>
    <text x="188" y="108">talker에 연관된 MAC 주소</text>
    <text x="412" y="108">같은 talker의</text>
    <text x="412" y="124">스트림을 가림</text>
  </g>
</svg>
