<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 9.5 331 276" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="에코 신호의 처리 단계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="80" y="20" width="120" height="36" rx="2" />
    <rect x="230" y="20" width="60" height="36" rx="2" />
    <rect x="20" y="100" width="100" height="36" rx="2" />
    <rect x="150" y="100" width="60" height="36" rx="2" />
    <rect x="240" y="100" width="90" height="36" rx="2" />
    <rect x="20" y="200" width="90" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="43">잡음 거름·증폭</text>
    <text x="260" y="43">ADC</text>
    <text x="70" y="123">밴드패스 필터</text>
    <text x="180" y="123">정류</text>
    <text x="285" y="123">저역 필터</text>
    <text x="65" y="223">문턱값 적용</text>
  </g>
  <text x="20" y="43" fill="var(--text, #727981)">에코</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="52" y1="38" x2="78" y2="38" />
    <line x1="200" y1="38" x2="228" y2="38" />
    <polyline points="260,56 260,78 70,78 70,98" />
    <line x1="120" y1="118" x2="148" y2="118" />
    <line x1="210" y1="118" x2="238" y2="118" />
    <polyline points="285,136 285,168 65,168 65,198" />
    <line x1="110" y1="218" x2="138" y2="218" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="175" y="160" text-anchor="middle">포락선</text>
    <text x="144" y="222">비행 시간, 폭, 세기</text>
    <text x="175" y="274" text-anchor="middle">TI 앱노트에 따른 처리 단계</text>
  </g>
</svg>
