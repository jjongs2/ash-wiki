<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 432.5 372.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Cortex-M4 MPU에서 겹친 영역이 따르는 속성">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Arm Cortex-M4</text>

  <!-- 주소 축 -->
  <line x1="30" y1="356" x2="30" y2="94" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 열 이름 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="30" y="78">주소</text>
    <text x="100" y="78">번호가 작은 영역</text>
    <text x="216" y="78">번호가 큰 영역</text>
    <text x="357" y="78">따르는 속성</text>
  </g>

  <!-- 번호가 작은 영역 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="50" y="190" width="100" height="140" />
    <rect x="302" y="260" width="110" height="70" />
  </g>
  <!-- 번호가 큰 영역 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="166" y="120" width="100" height="140" />
    <rect x="302" y="120" width="110" height="140" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="357" y="194">번호가 큰 영역</text>
    <text x="357" y="299">번호가 작은 영역</text>
  </g>

  <line x1="272" y1="225" x2="296" y2="225" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
