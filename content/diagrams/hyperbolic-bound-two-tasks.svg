<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 -2.5 436 382.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="두 태스크에서 Liu와 Layland의 상한과 hyperbolic bound가 받아들이는 이용률">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- hyperbolic bound만 받아들이는 영역: (U1+1)(U2+1) = 2 아래이고 U1+U2 = 0.828 위 -->
  <path d="M80.0 40.0 L87.5 54.6 L95.0 68.6 L102.5 81.9 L110.0 94.5 L117.5 106.7 L125.0 118.3 L132.5 129.4 L140.0 140.0 L147.5 150.2 L155.0 160.0 L162.5 169.4 L170.0 178.5 L177.5 187.2 L185.0 195.6 L192.5 203.6 L200.0 211.4 L207.5 218.9 L215.0 226.2 L222.5 233.2 L230.0 240.0 L237.5 246.6 L245.0 252.9 L252.5 259.0 L260.0 265.0 L267.5 270.8 L275.0 276.4 L282.5 281.8 L290.0 287.1 L297.5 292.2 L305.0 297.1 L312.5 302.0 L320.0 306.7 L327.5 311.2 L335.0 315.7 L342.5 320.0 L350.0 324.2 L357.5 328.3 L365.0 332.3 L372.5 336.2 L380.0 340.0 L328.5 340 L80 91.5 Z" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Liu와 Layland 상한: U1+U2 <= 0.828 -->
  <path d="M80 340 L328.5 340 L80 91.5 Z" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-linejoin="round" />
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Liu와 Layland 상한</text>

  <line x1="110" y1="106" x2="178" y2="74" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="182" y="72" font-size="12" fill="var(--text, #727981)">hyperbolic bound만 받아들임</text>

  <text x="300" y="150" font-size="12" fill="var(--text, #727981)"><tspan font-style="italic">n</tspan> = 2</text>

  <!-- 축 -->
  <line x1="80" y1="340" x2="418" y2="340" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="80" y1="340" x2="80" y2="20" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="424" y="344"><tspan font-style="italic">U</tspan><tspan font-style="italic" dy="3" font-size="9">1</tspan></text>
    <text x="90" y="26"><tspan font-style="italic">U</tspan><tspan font-style="italic" dy="3" font-size="9">2</tspan></text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="328.5" y1="340" x2="328.5" y2="346" />
    <line x1="380" y1="340" x2="380" y2="346" />
    <line x1="74" y1="91.5" x2="80" y2="91.5" />
    <line x1="74" y1="40" x2="80" y2="40" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="80" y="360" text-anchor="middle">0</text>
    <text x="328.5" y="360" text-anchor="middle">0.828</text>
    <text x="380" y="360" text-anchor="middle">1</text>
    <text x="70" y="95.5" text-anchor="end">0.828</text>
    <text x="70" y="44" text-anchor="end">1</text>
  </g>
</svg>
