<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 630 390" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">ISTQB CTFL 강의계획서</text>

  <!-- 열: 팀 지원, 제품 비평 -->
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="240" y="60">팀 지원</text>
    <text x="500" y="60">제품 비평</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="240" y="78">개발을 이끔</text>
    <text x="500" y="78">동작을 기대에 비추어 잰다</text>
  </g>

  <!-- 행: 비즈니스 쪽, 기술 쪽 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="170">비즈니스 쪽</text>
    <text x="20" y="320">기술 쪽</text>
  </g>

  <!-- 사분면 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="110" y="90" width="260" height="150" rx="0" />
    <rect x="370" y="90" width="260" height="150" rx="0" />
    <rect x="110" y="240" width="260" height="150" rx="0" />
    <rect x="370" y="240" width="260" height="150" rx="0" />
  </g>

  <g fill="var(--text, #727981)" font-weight="600">
    <text x="126" y="116">Q2</text>
    <text x="386" y="116">Q3</text>
    <text x="126" y="266">Q1</text>
    <text x="386" y="266">Q4</text>
  </g>

  <g fill="var(--text, #727981)">
    <text x="126" y="142">기능 테스트, 예제,</text>
    <text x="126" y="160">사용자 스토리 테스트,</text>
    <text x="126" y="178">사용자 경험 프로토타입,</text>
    <text x="126" y="196">API 테스트, 시뮬레이션</text>

    <text x="386" y="142">탐색적 테스트,</text>
    <text x="386" y="160">사용성 테스트,</text>
    <text x="386" y="178">사용자 인수 테스트</text>

    <text x="126" y="292">컴포넌트 테스트,</text>
    <text x="126" y="310">컴포넌트 통합 테스트</text>

    <text x="386" y="292">스모크 테스트,</text>
    <text x="386" y="310">사용성 테스트를 뺀</text>
    <text x="386" y="328">비기능 테스트</text>
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="126" y="226">인수 기준 확인, 수동이나 자동</text>
    <text x="386" y="226">사용자 중심, 흔히 수동</text>
    <text x="126" y="376">자동화해 지속적 통합에 넣음</text>
    <text x="386" y="376">흔히 자동화</text>
  </g>
</svg>
