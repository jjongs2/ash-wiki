<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 247" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 역할 -->
  <rect x="20" y="20" width="210" height="36" rx="4" fill="#825da9" />
  <text x="125" y="43" text-anchor="middle" fill="#f8fafd">talker</text>
  <rect x="242" y="20" width="210" height="36" rx="4" fill="#337b47" />
  <text x="347" y="43" text-anchor="middle" fill="#f8fafd">브리지</text>
  <rect x="464" y="20" width="210" height="36" rx="4" fill="#336fb8" />
  <text x="569" y="43" text-anchor="middle" fill="#f8fafd">listener</text>

  <!-- 역할마다 하는 일 -->
  <g stroke="#727981" stroke-width="1.5">
    <rect x="20.75" y="64.75" width="208.5" height="50.5" rx="3" />
    <rect x="242.75" y="64.75" width="208.5" height="50.5" rx="3" />
    <rect x="242.75" y="123.75" width="208.5" height="68.5" rx="3" />
    <rect x="464.75" y="64.75" width="208.5" height="50.5" rx="3" />
  </g>
  <g fill="#727981" text-anchor="middle">
    <text x="125" y="86">보낼 수 있는 스트림과</text>
    <text x="125" y="104">그 속성을 선언</text>
    <text x="347" y="86">선언을 조정하고</text>
    <text x="347" y="104">병합해 퍼뜨림</text>
    <text x="347" y="145">예약이 실패하면</text>
    <text x="347" y="163">talker나 listener의</text>
    <text x="347" y="181">선언을 바꿀 수 있음</text>
    <text x="569" y="86">스트림을 받으려는</text>
    <text x="569" y="104">뜻을 선언</text>
  </g>

  <!-- 경로 예약 -->
  <text x="347" y="226" text-anchor="middle" font-size="12" fill="#727981">브리지가 대역폭이 보장된 종단 간 경로를 예약</text>
</svg>
