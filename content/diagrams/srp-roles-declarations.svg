<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 213" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="브리지를 거쳐 퍼지는 talker와 listener의 선언">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 역할 -->
  <rect x="20.75" y="20.75" width="148.5" height="34.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="95" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">talker</text>
  <rect x="182.75" y="20.75" width="148.5" height="34.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="257" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">브리지</text>
  <rect x="344.75" y="20.75" width="148.5" height="34.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="419" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">listener</text>

  <!-- 역할마다 하는 일 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="64.75" width="148.5" height="50.5" rx="2" fill="var(--surface, none)" />
    <rect x="182.75" y="64.75" width="148.5" height="50.5" rx="2" fill="var(--surface, none)" />
    <rect x="182.75" y="123.75" width="148.5" height="68.5" rx="2" fill="var(--surface, none)" />
    <rect x="344.75" y="64.75" width="148.5" height="50.5" rx="2" fill="var(--surface, none)" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="95" y="86">보낼 수 있는 스트림과</text>
    <text x="95" y="104">그 속성을 선언</text>
    <text x="257" y="86">선언을 조정하고</text>
    <text x="257" y="104">병합해 퍼뜨림</text>
    <text x="257" y="145">예약이 실패하면</text>
    <text x="257" y="163">talker나 listener의</text>
    <text x="257" y="181">선언을 바꿀 수 있음</text>
    <text x="419" y="86">스트림을 받으려는</text>
    <text x="419" y="104">뜻을 선언</text>
  </g>
</svg>
