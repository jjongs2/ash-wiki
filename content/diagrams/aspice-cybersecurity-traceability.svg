<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 422.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 프로세스 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="20.75" width="638.5" height="70.5" rx="4" />
    <rect x="20.75" y="106.75" width="638.5" height="175.5" rx="4" />
    <rect x="20.75" y="297.75" width="638.5" height="70.5" rx="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="34" y="41">SEC.1 BP2 (Cybersecurity Requirements Elicitation)</text>
    <text x="34" y="127">SEC.3 BP4 (Risk Treatment Verification)</text>
    <text x="34" y="318">SEC.4 BP4 (Risk Treatment Validation)</text>
  </g>

  <!-- 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40.75" y="52.75" width="178.5" height="26.5" rx="2" />
    <rect x="270.75" y="52.75" width="138.5" height="26.5" rx="2" />
    <rect x="460.75" y="52.75" width="178.5" height="26.5" rx="2" />

    <rect x="40.75" y="173.75" width="178.5" height="26.5" rx="2" />
    <rect x="270.75" y="173.75" width="138.5" height="26.5" rx="2" />
    <rect x="270.75" y="243.75" width="138.5" height="26.5" rx="2" />
    <rect x="460.75" y="138.75" width="178.5" height="26.5" rx="2" />
    <rect x="460.75" y="173.75" width="178.5" height="26.5" rx="2" />
    <rect x="460.75" y="208.75" width="178.5" height="26.5" rx="2" />

    <rect x="40.75" y="329.75" width="178.5" height="26.5" rx="2" />
    <rect x="270.75" y="329.75" width="138.5" height="26.5" rx="2" />
    <rect x="460.75" y="329.75" width="178.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="70">위협 시나리오</text>
    <text x="340" y="70">Cybersecurity goal</text>
    <text x="550" y="70">사이버보안 요구사항</text>

    <text x="130" y="191">사이버보안 요구사항</text>
    <text x="340" y="191">검증 수단</text>
    <text x="340" y="261">검증 결과</text>
    <text x="550" y="156">정련한 architectural design</text>
    <text x="550" y="191">상세 설계</text>
    <text x="550" y="226">소프트웨어 유닛</text>

    <text x="130" y="347">Cybersecurity goal</text>
    <text x="340" y="347">확인 수단</text>
    <text x="550" y="347">확인 결과</text>
  </g>
  <path d="M455 139 H447 V235 H455" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 일관성과 양방향 추적성 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="221" y1="66" x2="269" y2="66" />
    <line x1="411" y1="66" x2="459" y2="66" />
    <line x1="221" y1="187" x2="269" y2="187" />
    <line x1="411" y1="187" x2="445" y2="187" />
    <line x1="221" y1="343" x2="269" y2="343" />
  </g>

  <!-- 양방향 추적성 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="340" y1="202" x2="340" y2="242" />
    <line x1="411" y1="343" x2="459" y2="343" />
  </g>

  <!-- 범례 -->
  <line x1="22" y1="396" x2="62" y2="396" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="206" y1="396" x2="246" y2="396" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <g fill="var(--text, #727981)">
    <text x="70" y="400">일관성과 양방향 추적성</text>
    <text x="254" y="400">양방향 추적성</text>
    <text x="659" y="400" text-anchor="end">Automotive SPICE for Cybersecurity 2.0</text>
  </g>
</svg>
