<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -5.5 833 246.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">일본 국토교통성이 2020년 12월 발표한 보안기준 개정의 적용 시기</text>

  <!-- 1년 = 120 단위, 2022년 1월 1일 = x 200 -->
  <g fill="var(--text, #727981)" text-anchor="end">
    <text x="186" y="88">무선 소프트웨어 업데이트에</text>
    <text x="186" y="104">대응하는 차량</text>
    <text x="186" y="172">대응하지 않는 차량</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="200" y1="92" x2="800" y2="92" />
    <line x1="200" y1="168" x2="800" y2="168" />
  </g>

  <!-- 날짜 -->
  <g fill="var(--ink, #727981)">
    <circle cx="259.5" cy="92" r="4" />
    <circle cx="499.7" cy="92" r="4" />
    <circle cx="440" cy="168" r="4" />
    <circle cx="719.5" cy="168" r="4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="259.5" y="60">신형 차</text>
    <text x="259.5" y="76">2022년 7월 1일</text>
    <text x="499.7" y="60">계속 생산하는 차</text>
    <text x="499.7" y="76">2024년 7월 1일</text>
    <text x="440" y="136">신형 차</text>
    <text x="440" y="152">2024년 1월 1일</text>
    <text x="719.5" y="136">계속 생산하는 차</text>
    <text x="719.5" y="152">2026년 5월 1일</text>
  </g>

  <!-- 연도 축 -->
  <line x1="200" y1="200" x2="800" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M200 200 v5 M320 200 v5 M440 200 v5 M560 200 v5 M680 200 v5 M800 200 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="200" y="221">2022</text>
    <text x="320" y="221">2023</text>
    <text x="440" y="221">2024</text>
    <text x="560" y="221">2025</text>
    <text x="680" y="221">2026</text>
    <text x="800" y="221">2027</text>
  </g>
</svg>
