<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 480 280" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="34" font-size="12" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <!-- 설계 단계 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="48" width="440" height="46" rx="2" />
    <rect x="20" y="134" width="440" height="46" rx="2" />
    <rect x="20" y="220" width="440" height="46" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="240" y="67">아키텍처 설계</text>
    <text x="240" y="84" font-size="12">시스템 전체의 기본 사항을 환경과의 관계 안에서</text>
    <text x="240" y="153">상위 설계</text>
    <text x="240" y="170" font-size="12">바깥을 향해: 최상위 구조와 구성, 컴포넌트, 환경과의 상호작용</text>
    <text x="240" y="239">상세 설계</text>
    <text x="240" y="256" font-size="12">안을 향해: 컴포넌트마다 만들 수 있을 만큼 자세히</text>
  </g>

  <!-- 의무 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="240" y1="96" x2="240" y2="132" marker-end="url(#arrow)" />
    <line x1="240" y1="182" x2="240" y2="218" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="252" y="118">다음 단계에 의무</text>
    <text x="252" y="204">다음 단계에 의무</text>
  </g>
</svg>
