<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 540 146" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="방향 변경 가능 핀과 방향 변경 불가 핀">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 함수 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="200" height="36" rx="2" />
    <rect x="20" y="110" width="200" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="42">Port_SetPinDirection</text>
    <text x="120" y="132">Port_RefreshPortDirection</text>
  </g>

  <!-- 핀 -->
  <rect x="380.75" y="20.75" width="158.5" height="34.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="460" y="42" text-anchor="middle" fill="var(--on-fill, #f8fafd)">방향 변경 가능 핀</text>
  <rect x="380" y="110" width="160" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="460" y="132" text-anchor="middle" fill="var(--text, #727981)">방향 변경 불가 핀</text>

  <!-- 동작 -->
  <line x1="222" y1="38" x2="378" y2="38" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="31" text-anchor="middle" fill="var(--text, #727981)">방향을 바꿈</text>
  <line x1="222" y1="128" x2="378" y2="128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="121" text-anchor="middle" fill="var(--text, #727981)">설정값으로 다시 씀</text>
  <line x1="222" y1="110" x2="378" y2="56" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="318" y="89" fill="var(--text, #727981)">건너뜀</text>
</svg>
