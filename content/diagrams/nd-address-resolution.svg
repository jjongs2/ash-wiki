<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 22 520 240" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="링크 계층 주소를 주고받는 요청과 응답 한 쌍">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <rect x="60" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="53" text-anchor="middle" fill="var(--text, #727981)">묻는 노드</text>
  <rect x="440" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="500" y="53" text-anchor="middle" fill="var(--text, #727981)">대상 노드</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="120" y1="64" x2="120" y2="252" />
    <line x1="500" y1="64" x2="500" y2="252" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="122" y1="140" x2="498" y2="156" />
    <line x1="498" y1="218" x2="122" y2="234" />
  </g>

  <!-- Neighbor Solicitation -->
  <text x="310" y="94" text-anchor="middle" fill="var(--text, #727981)">Neighbor Solicitation</text>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="var(--text, #727981)">목적지: 대상의 solicited-node 멀티캐스트 주소</text>
  <text x="310" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">담는 것: 묻는 노드의 링크 계층 주소</text>

  <!-- Neighbor Advertisement -->
  <text x="310" y="190" text-anchor="middle" fill="var(--text, #727981)">Neighbor Advertisement (유니캐스트)</text>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="var(--text, #727981)">담는 것: 대상 노드의 링크 계층 주소</text>
</svg>
