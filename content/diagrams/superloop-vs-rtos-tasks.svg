<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 420 552" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="superloop와 RTOS 기반 소프트웨어의 비교">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- superloop -->
  <text x="20" y="28" fill="var(--text, #727981)">superloop</text>
  <rect x="20" y="50" width="150" height="34" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="72" text-anchor="middle" fill="var(--text, #727981)">모듈 A의 함수</text>
  <rect x="20" y="100" width="150" height="34" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="122" text-anchor="middle" fill="var(--text, #727981)">모듈 B의 함수</text>
  <rect x="20" y="150" width="150" height="34" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="172" text-anchor="middle" fill="var(--text, #727981)">모듈 C의 함수</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="95" y1="84" x2="95" y2="97" />
    <line x1="95" y1="134" x2="95" y2="147" />
    <path d="M170 167 H200 V67 H173" />
  </g>
  <text x="208" y="121" font-size="12" fill="var(--text, #727981)">무한 루프</text>

  <rect x="20.75" y="234.75" width="148.5" height="32.5" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="95" y="256" text-anchor="middle" fill="var(--on-fill, #f8fafd)">인터럽트 처리기</text>
  <line x1="95" y1="234" x2="95" y2="187" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="103" y="215" font-size="12" fill="var(--text, #727981)">넘긴 일은 차례가 오면 처리</text>
  <line x1="260" y1="251" x2="173" y2="251" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="216" y="244" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비동기 사건</text>

  <!-- RTOS -->
  <text x="20" y="310" fill="var(--text, #727981)">RTOS</text>
  <rect x="20.75" y="332.75" width="378.5" height="32.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="210" y="354" text-anchor="middle" fill="var(--on-fill, #f8fafd)">스케줄러</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="80" y1="366" x2="80" y2="389" />
    <line x1="210" y1="366" x2="210" y2="389" />
    <line x1="340" y1="366" x2="340" y2="389" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="392" width="120" height="48" rx="2" fill="var(--surface, none)" />
    <rect x="150" y="392" width="120" height="48" rx="2" fill="var(--surface, none)" />
    <rect x="280" y="392" width="120" height="48" rx="2" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="413">태스크 1</text>
    <text x="80" y="431" font-size="12">우선순위 높음</text>
    <text x="210" y="413">태스크 2</text>
    <text x="210" y="431" font-size="12">우선순위 중간</text>
    <text x="340" y="413">태스크 3</text>
    <text x="340" y="431" font-size="12">우선순위 낮음</text>
  </g>

  <rect x="20.75" y="496.75" width="148.5" height="32.5" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="95" y="518" text-anchor="middle" fill="var(--on-fill, #f8fafd)">인터럽트 처리기</text>
  <line x1="95" y1="496" x2="95" y2="443" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="103" y="474" font-size="12" fill="var(--text, #727981)">태스크를 깨워 넘김</text>
  <line x1="260" y1="513" x2="173" y2="513" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="216" y="506" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비동기 사건</text>
</svg>
