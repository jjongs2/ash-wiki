<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 22 520 318" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="50" y="32" width="110" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="105" y="53" text-anchor="middle" fill="var(--text, #727981)">클라이언트</text>
  <rect x="280" y="32" width="110" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="335" y="53" text-anchor="middle" fill="var(--text, #727981)">고른 서버</text>
  <rect x="440" y="32" width="110" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="495" y="53" text-anchor="middle" fill="var(--text, #727981)">다른 서버</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="105" y1="64" x2="105" y2="330" />
    <line x1="335" y1="64" x2="335" y2="330" />
    <line x1="495" y1="64" x2="495" y2="330" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <!-- DHCPDISCOVER 브로드캐스트 -->
    <line x1="107" y1="100" x2="333" y2="112" />
    <line x1="337" y1="112" x2="493" y2="120" />
    <!-- 서버마다 DHCPOFFER -->
    <line x1="333" y1="148" x2="107" y2="160" />
    <line x1="493" y1="170" x2="107" y2="192" />
    <!-- DHCPREQUEST 브로드캐스트 -->
    <line x1="107" y1="240" x2="333" y2="252" />
    <line x1="337" y1="252" x2="493" y2="260" />
    <!-- 고른 서버의 DHCPACK -->
    <line x1="333" y1="300" x2="107" y2="312" />
  </g>

  <text x="220" y="94" text-anchor="middle" fill="var(--text, #727981)">DHCPDISCOVER (브로드캐스트)</text>
  <text x="220" y="142" text-anchor="middle" fill="var(--text, #727981)">DHCPOFFER</text>
  <text x="415" y="166" text-anchor="middle" fill="var(--text, #727981)">DHCPOFFER</text>
  <text x="220" y="216" text-anchor="middle" fill="var(--text, #727981)">DHCPREQUEST (브로드캐스트)</text>
  <text x="220" y="233" text-anchor="middle" font-size="12" fill="var(--text, #727981)">server identifier 옵션: 고른 서버</text>
  <text x="345" y="284" font-size="12" fill="var(--text, #727981)">바인딩 저장</text>
  <text x="220" y="294" text-anchor="middle" fill="var(--text, #727981)">DHCPACK (설정 파라미터)</text>
</svg>
