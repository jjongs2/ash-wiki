<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 22 660 318" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="50" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="110" y="53" text-anchor="middle" fill="var(--text, #727981)">클라이언트</text>
  <rect x="330" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="390" y="53" text-anchor="middle" fill="var(--text, #727981)">고른 서버</text>
  <rect x="570" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="630" y="53" text-anchor="middle" fill="var(--text, #727981)">다른 서버</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="64" x2="110" y2="330" />
    <line x1="390" y1="64" x2="390" y2="330" />
    <line x1="630" y1="64" x2="630" y2="330" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <!-- DHCPDISCOVER 브로드캐스트 -->
    <line x1="112" y1="100" x2="388" y2="112" />
    <line x1="392" y1="112" x2="628" y2="122" />
    <!-- 서버마다 DHCPOFFER -->
    <line x1="388" y1="148" x2="112" y2="160" />
    <line x1="628" y1="170" x2="112" y2="192" />
    <!-- DHCPREQUEST 브로드캐스트 -->
    <line x1="112" y1="240" x2="388" y2="252" />
    <line x1="392" y1="252" x2="628" y2="262" />
    <!-- 고른 서버의 DHCPACK -->
    <line x1="388" y1="300" x2="112" y2="312" />
  </g>

  <text x="250" y="94" text-anchor="middle" fill="var(--text, #727981)">DHCPDISCOVER (브로드캐스트)</text>
  <text x="250" y="142" text-anchor="middle" fill="var(--text, #727981)">DHCPOFFER</text>
  <text x="510" y="166" text-anchor="middle" fill="var(--text, #727981)">DHCPOFFER</text>
  <text x="250" y="216" text-anchor="middle" fill="var(--text, #727981)">DHCPREQUEST (브로드캐스트)</text>
  <text x="250" y="233" text-anchor="middle" font-size="12" fill="var(--text, #727981)">server identifier 옵션: 고른 서버</text>
  <text x="400" y="284" font-size="12" fill="var(--text, #727981)">바인딩 저장</text>
  <text x="250" y="294" text-anchor="middle" fill="var(--text, #727981)">DHCPACK (설정 파라미터)</text>
</svg>
