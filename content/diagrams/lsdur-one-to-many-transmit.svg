<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 9.5 650 346" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="50" y="20" width="120" height="36" rx="2" />
    <rect x="240" y="20" width="100" height="36" rx="2" />
    <rect x="420" y="20" width="100" height="36" rx="2" />
    <rect x="580" y="20" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="43">위 모듈</text>
    <text x="290" y="43">LSduR</text>
    <text x="470" y="43">목적지</text>
    <text x="630" y="43">목적지</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="110" y1="56" x2="110" y2="346" />
    <line x1="290" y1="56" x2="290" y2="346" />
    <line x1="470" y1="56" x2="470" y2="346" />
    <line x1="630" y1="56" x2="630" y2="346" />
  </g>

  <!-- 송신 요청과 반환값 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="90" x2="288" y2="90" marker-end="url(#arrow)" />
    <line x1="290" y1="120" x2="468" y2="120" marker-end="url(#arrow)" />
    <line x1="470" y1="146" x2="292" y2="146" stroke-dasharray="5 4" marker-end="url(#arrow)" />
    <line x1="290" y1="176" x2="628" y2="176" marker-end="url(#arrow)" />
    <line x1="630" y1="202" x2="292" y2="202" stroke-dasharray="5 4" marker-end="url(#arrow)" />
    <line x1="290" y1="232" x2="112" y2="232" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>

  <!-- 송신 확인 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="470" y1="270" x2="292" y2="270" marker-end="url(#arrow)" />
    <line x1="630" y1="300" x2="292" y2="300" marker-end="url(#arrow)" />
    <line x1="290" y1="330" x2="112" y2="330" marker-end="url(#arrow)" />
  </g>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="200" y="82">송신 요청</text>
    <text x="380" y="112">송신 요청</text>
    <text x="380" y="138">E_OK</text>
    <text x="550" y="168">송신 요청</text>
    <text x="550" y="194">E_OK</text>
    <text x="200" y="224">E_OK</text>
    <text x="380" y="262">송신 확인</text>
    <text x="550" y="292">마지막 송신 확인</text>
    <text x="200" y="322">송신 확인</text>
  </g>
</svg>
