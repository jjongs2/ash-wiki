    <rect x="340" y="20" width="170" height="36" rx="2" />
    <rect x="150" y="96" width="170" height="44" rx="2" />
    <rect x="340" y="96" width="170" height="44" rx="2" />
    <rect x="150" y="180" width="360" height="36" rx="2" />
