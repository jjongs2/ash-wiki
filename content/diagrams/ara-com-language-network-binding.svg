  <text x="420" y="194.5" text-anchor="middle" font-size="13" fill="var(--text, #727981)">SOME/IP · DDS · IPC · Signal PDU · 시그널 기반 정적</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
