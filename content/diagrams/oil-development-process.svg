<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 단계 열 -->
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="90" y="30">입력</text>
    <text x="270" y="30">생성·컴파일</text>
    <text x="440" y="30">링크</text>
    <text x="600" y="30">출력</text>
  </g>

  <!-- 입력 -->
  <g fill="#337b47">
    <rect x="20" y="50" width="140" height="44" rx="4" />
    <rect x="20" y="124" width="140" height="44" rx="4" />
  </g>
  <rect x="20" y="198" width="140" height="44" rx="4" fill="#b0540d" />
  <g text-anchor="middle" fill="#f8fafd">
    <text x="90" y="77">OIL 구성 파일</text>
    <text x="90" y="151">사용자 소스 코드</text>
    <text x="90" y="225">OS 커널, OSEK COM</text>
  </g>

  <!-- 도구 -->
  <g fill="#336fb8">
    <rect x="200" y="50" width="140" height="44" rx="22" />
    <rect x="200" y="124" width="140" height="44" rx="22" />
    <rect x="380" y="124" width="120" height="44" rx="22" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="270" y="77">System Generator</text>
    <text x="270" y="151">컴파일러</text>
    <text x="440" y="151">링커</text>
  </g>

  <!-- 출력 -->
  <rect x="540" y="124" width="120" height="44" rx="4" fill="#337b47" />
  <text x="600" y="151" text-anchor="middle" fill="#f8fafd">실행 파일</text>

  <!-- 흐름 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="162" y1="72" x2="198" y2="72" marker-end="url(#arrow)" />
    <line x1="270" y1="96" x2="270" y2="122" marker-end="url(#arrow)" />
    <line x1="162" y1="146" x2="198" y2="146" marker-end="url(#arrow)" />
    <path d="M162 212 H250 V170" marker-end="url(#arrow)" />
    <path d="M162 230 H440 V170" marker-end="url(#arrow)" />
    <line x1="342" y1="146" x2="378" y2="146" marker-end="url(#arrow)" />
    <line x1="502" y1="146" x2="538" y2="146" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="#727981">
    <text x="278" y="113">C 코드</text>
    <text x="258" y="200">소스 코드</text>
    <text x="448" y="206">라이브러리</text>
  </g>
</svg>
