<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 262" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 열 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="88" y="30">입력</text>
    <text x="254" y="30">생성·컴파일</text>
    <text x="384" y="30">링크</text>
    <text x="478" y="30">출력</text>
  </g>

  <!-- 입력 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="50" width="136" height="44" rx="2" fill="var(--surface, none)" />
    <rect x="20" y="124" width="136" height="44" rx="2" fill="var(--surface, none)" />
  </g>
  <rect x="20" y="198" width="136" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="88" y="77">OIL 구성 파일</text>
    <text x="88" y="151">사용자 소스 코드</text>
    <text x="88" y="225">OS 커널, OSEK COM</text>
  </g>

  <!-- 도구 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="186.75" y="50.75" width="134.5" height="42.5" rx="2" />
    <rect x="186.75" y="124.75" width="134.5" height="42.5" rx="2" />
    <rect x="352.75" y="124.75" width="62.5" height="42.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="254" y="77">System Generator</text>
    <text x="254" y="151">컴파일러</text>
    <text x="384" y="151">링커</text>
  </g>

  <!-- 출력 -->
  <rect x="446" y="124" width="64" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="478" y="151" text-anchor="middle" fill="var(--text, #727981)">실행 파일</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="158" y1="72" x2="184" y2="72" marker-end="url(#arrow)" />
    <line x1="254" y1="96" x2="254" y2="122" marker-end="url(#arrow)" />
    <line x1="158" y1="146" x2="184" y2="146" marker-end="url(#arrow)" />
    <path d="M158 212 H234 V170" marker-end="url(#arrow)" />
    <path d="M158 230 H384 V170" marker-end="url(#arrow)" />
    <line x1="324" y1="146" x2="350" y2="146" marker-end="url(#arrow)" />
    <line x1="418" y1="146" x2="444" y2="146" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="262" y="113">C 코드</text>
    <text x="242" y="200">소스 코드</text>
    <text x="392" y="206">라이브러리</text>
  </g>
</svg>
