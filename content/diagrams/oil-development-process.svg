<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 262" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 열 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="90" y="30">입력</text>
    <text x="254" y="30">생성·컴파일</text>
    <text x="378" y="30">링크</text>
    <text x="473" y="30">출력</text>
  </g>

  <!-- 입력 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="50" width="140" height="44" rx="2" fill="var(--surface, none)" />
    <rect x="20" y="124" width="140" height="44" rx="2" fill="var(--surface, none)" />
  </g>
  <rect x="20" y="198" width="140" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="77">OIL 구성 파일</text>
    <text x="90" y="151">사용자 소스 코드</text>
    <text x="90" y="225">OS 커널, OSEK COM</text>
  </g>

  <!-- 도구 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="190.75" y="50.75" width="126.5" height="42.5" rx="2" />
    <rect x="190.75" y="124.75" width="126.5" height="42.5" rx="2" />
    <rect x="348.75" y="124.75" width="58.5" height="42.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="254" y="77">System Generator</text>
    <text x="254" y="151">컴파일러</text>
    <text x="378" y="151">링커</text>
  </g>

  <!-- 출력 -->
  <rect x="438" y="124" width="70" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="473" y="151" text-anchor="middle" fill="var(--text, #727981)">실행 파일</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="162" y1="72" x2="188" y2="72" marker-end="url(#arrow)" />
    <line x1="254" y1="96" x2="254" y2="122" marker-end="url(#arrow)" />
    <line x1="162" y1="146" x2="188" y2="146" marker-end="url(#arrow)" />
    <path d="M162 212 H234 V170" marker-end="url(#arrow)" />
    <path d="M162 230 H378 V170" marker-end="url(#arrow)" />
    <line x1="320" y1="146" x2="346" y2="146" marker-end="url(#arrow)" />
    <line x1="410" y1="146" x2="436" y2="146" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="262" y="113">C 코드</text>
    <text x="242" y="200">소스 코드</text>
    <text x="386" y="206">라이브러리</text>
  </g>
</svg>
