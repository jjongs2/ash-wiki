<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- 동기 호출 -->
  <text x="160" y="30" text-anchor="middle" fill="var(--text, #727981)">동기 호출</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30.75" y="44.75" width="98.5" height="30.5" rx="4" />
    <rect x="190.75" y="44.75" width="98.5" height="30.5" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="65">클라이언트</text>
    <text x="240" y="65">서버</text>
  </g>
  <path d="M80 76 V90 M80 230 V262 M240 76 V110 M240 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="73.75" y="90.75" width="12.5" height="18.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="73.75" y="110.75" width="12.5" height="88.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="73.75" y="200.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="233.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="87" y1="110" x2="231" y2="110" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="233" y1="200" x2="89" y2="200" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="160" y="104">Rte_Call</text>
    <text x="160" y="194">응답</text>
    <text x="50" y="160">막힘</text>
  </g>

  <!-- 비동기 호출 -->
  <text x="480" y="30" text-anchor="middle" fill="var(--text, #727981)">비동기 호출</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="350.75" y="44.75" width="98.5" height="30.5" rx="4" />
    <rect x="510.75" y="44.75" width="98.5" height="30.5" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="400" y="65">클라이언트</text>
    <text x="560" y="65">서버</text>
  </g>
  <path d="M400 76 V90 M400 140 V220 M400 250 V262 M560 76 V110 M560 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="393.75" y="90.75" width="12.5" height="48.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="393.75" y="220.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="553.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="407" y1="110" x2="551" y2="110" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="553" y1="200" x2="402" y2="200" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="480" y="104">Rte_Call</text>
    <text x="480" y="194">결과 준비</text>
    <text x="480" y="134">막히지 않음</text>
  </g>
  <text x="412" y="240" font-size="12" fill="var(--text, #727981)">Rte_Result로 결과 받음</text>
</svg>
