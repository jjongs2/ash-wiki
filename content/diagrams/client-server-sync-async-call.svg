    <text x="135" y="194">응답</text>
    <text x="34" y="160">막힘</text>
  </g>

  <!-- 비동기 호출 -->
  <text x="385" y="30" text-anchor="middle" fill="var(--text, #727981)">비동기 호출</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="270.75" y="44.75" width="78.5" height="30.5" rx="2" />
    <rect x="420.75" y="44.75" width="78.5" height="30.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="310" y="65">클라이언트</text>
    <text x="460" y="65">서버</text>
  </g>
  <path d="M310 76 V90 M310 140 V220 M310 250 V262 M460 76 V110 M460 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
