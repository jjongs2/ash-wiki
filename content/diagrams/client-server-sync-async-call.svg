  <rect x="303.75" y="220.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="453.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
