  </g>
  <path d="M60 76 V90 M60 230 V262 M210 76 V110 M210 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="53.75" y="90.75" width="12.5" height="18.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="53.75" y="110.75" width="12.5" height="88.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="53.75" y="200.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="203.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="67" y1="110" x2="201" y2="110" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="203" y1="200" x2="69" y2="200" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
