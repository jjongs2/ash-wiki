<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 519 280" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="동기 호출과 비동기 호출">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- 동기 호출 -->
  <text x="126.5" y="30" text-anchor="middle" fill="var(--text, #727981)">동기 호출</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="44.75" width="78.5" height="30.5" rx="2" />
    <rect x="153.75" y="44.75" width="78.5" height="30.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="60" y="65">클라이언트</text>
    <text x="193" y="65">서버</text>
  </g>
  <path d="M60 76 V90 M60 230 V262 M193 76 V110 M193 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="53.75" y="90.75" width="12.5" height="18.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="53.75" y="110.75" width="12.5" height="88.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="53.75" y="200.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="186.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="67" y1="110" x2="184" y2="110" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="186" y1="200" x2="69" y2="200" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="126.5" y="104">Rte_Call</text>
    <text x="126.5" y="194">응답</text>
    <text x="34" y="160">막힘</text>
  </g>

  <!-- 비동기 호출 -->
  <text x="392.5" y="30" text-anchor="middle" fill="var(--text, #727981)">비동기 호출</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="286.75" y="44.75" width="78.5" height="30.5" rx="2" />
    <rect x="419.75" y="44.75" width="78.5" height="30.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="326" y="65">클라이언트</text>
    <text x="459" y="65">서버</text>
  </g>
  <path d="M326 76 V90 M326 140 V220 M326 250 V262 M459 76 V110 M459 200 V262" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="319.75" y="90.75" width="12.5" height="48.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="319.75" y="220.75" width="12.5" height="28.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="452.75" y="110.75" width="12.5" height="88.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="333" y1="110" x2="450" y2="110" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="452" y1="200" x2="328" y2="200" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="392.5" y="104">Rte_Call</text>
    <text x="392.5" y="194">결과 준비</text>
    <text x="392.5" y="134">막히지 않음</text>
  </g>
  <text x="338" y="240" font-size="12" fill="var(--text, #727981)">Rte_Result로 결과 받음</text>
</svg>
