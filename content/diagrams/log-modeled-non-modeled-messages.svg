<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 12.5 600 270" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="modeled 메시지와 non-modeled 메시지">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 제목 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="30">Non-modeled 메시지(LT 프로토콜의 verbose 메시지)</text>
    <text x="40" y="130">Modeled 메시지(LT 프로토콜의 non-verbose 메시지)</text>
  </g>

  <!-- 응용과 로그 뷰어 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="40" width="90" height="36" rx="2" />
    <rect x="470" y="40" width="130" height="36" rx="2" />
    <rect x="40" y="140" width="90" height="36" rx="2" />
    <rect x="470" y="140" width="130" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="63">응용</text>
    <text x="535" y="63">로그 뷰어</text>
    <text x="85" y="163">응용</text>
    <text x="535" y="163">로그 뷰어</text>
  </g>

  <!-- 네트워크로 보내는 부분 -->
  <g stroke-width="1.5">
    <rect x="200" y="40" width="100" height="36" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" />
    <rect x="300" y="40" width="100" height="36" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" />
    <rect x="250" y="140" width="100" height="36" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="250" y="63">정적 부분</text>
    <text x="350" y="63">동적 부분</text>
    <text x="300" y="163">동적 부분</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="300" y="94">네트워크로 보냄</text>
    <text x="300" y="194">네트워크로 보냄</text>
  </g>

  <!-- 응용의 AUTOSAR 모델 -->
  <rect x="450" y="214" width="170" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="535" y="230" text-anchor="middle" font-size="12" fill="var(--text, #727981)">응용의 AUTOSAR 모델</text>
  <rect x="485" y="236" width="100" height="30" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="535" y="256" text-anchor="middle" fill="var(--on-fill, #f8fafd)">정적 부분</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="132" y1="58" x2="198" y2="58" marker-end="url(#arrow)" />
    <line x1="402" y1="58" x2="468" y2="58" marker-end="url(#arrow)" />
    <line x1="132" y1="158" x2="248" y2="158" marker-end="url(#arrow)" />
    <line x1="352" y1="158" x2="468" y2="158" marker-end="url(#arrow)" />
    <line x1="535" y1="212" x2="535" y2="178" marker-end="url(#arrow)" />
  </g>
  <text x="543" y="199" font-size="12" fill="var(--text, #727981)">합쳐 보여 줌</text>
</svg>
