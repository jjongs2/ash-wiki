<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 569.5 231.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">Eclipse hawkBit</text>

  <!-- 그룹 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="70" width="150" height="40" rx="2" />
    <rect x="330" y="70" width="150" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="94.5">앞 그룹</text>
    <text x="405" y="94.5">다음 그룹</text>
    <text x="545" y="94.5">…</text>
  </g>

  <!-- 긴급 중단 -->
  <rect x="165" y="170" width="170" height="40" rx="2" stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)" />
  <text x="250" y="194.5" text-anchor="middle" fill="var(--on-fill, #f8fafd)">배포 전체 긴급 중단</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="90" x2="328" y2="90" />
    <line x1="480" y1="90" x2="528" y2="90" />
    <path d="M95 110 V190 H163" />
    <path d="M405 110 V190 H337" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="250" y="52">설치에 성공한 대상의 비율이</text>
    <text x="250" y="68">정한 값에 이르면 시작(기본 설정)</text>
    <text x="250" y="152">설치 실패가 정한 수나 비율을 넘으면</text>
  </g>
</svg>
