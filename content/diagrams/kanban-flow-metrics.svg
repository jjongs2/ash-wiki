<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 11 500 324" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="작업 항목으로 본 흐름 지표">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="28" fill="var(--text, #727981)">The Kanban Guide 2025.5</text>

  <!-- 작업 항목: 행마다 시작부터 끝(또는 지금)까지 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="64">작업 항목 1</text>
    <text x="20" y="120">작업 항목 2</text>
    <text x="20" y="176">작업 항목 3</text>
    <text x="20" y="232">작업 항목 4</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="300" y="50" width="36" height="20" />
    <rect x="222" y="106" width="114" height="20" />
    <rect x="96" y="162" width="84" height="20" />
    <rect x="192" y="218" width="84" height="20" />
  </g>
  <!-- 끝나지 않은 항목 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M336 50 H372 V70 H336" />
    <path d="M336 106 H372 V126 H336" />
  </g>

  <!-- 지금 -->
  <line x1="336" y1="36" x2="336" y2="290" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="336" y="28" text-anchor="middle" fill="var(--text, #727981)">지금</text>

  <!-- Work Item Age -->
  <path d="M222 130 V136 H336 V130" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="279" y="154">Work Item Age</text>
    <text x="279" y="170">시작부터 지금까지</text>
  </g>

  <!-- Cycle Time -->
  <path d="M96 158 V152 H180 V158" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="138" y="128">Cycle Time</text>
    <text x="138" y="144">시작부터 끝까지</text>
  </g>

  <!-- WIP -->
  <path d="M378 60 H384 V116 H378" stroke="var(--ink, #727981)" stroke-width="1" />
  <g fill="var(--text, #727981)">
    <text x="394" y="84">WIP: 시작했지만</text>
    <text x="394" y="100">끝나지 않은 항목의 수</text>
  </g>

  <!-- 시간 축과 끝난 시점 -->
  <line x1="90" y1="290" x2="408" y2="290" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="416" y="294" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="180" y1="182" x2="180" y2="290" />
    <line x1="276" y1="238" x2="276" y2="290" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="180" cy="290" r="3.5" />
    <circle cx="276" cy="290" r="3.5" />
  </g>

  <!-- Throughput -->
  <path d="M168 300 V306 H336 V300" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="252" y="324" text-anchor="middle" fill="var(--text, #727981)">Throughput: 단위 시간마다 끝난 항목의 수</text>
</svg>
