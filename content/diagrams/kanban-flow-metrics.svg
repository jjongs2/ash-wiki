<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10.5 704 324" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="28" fill="var(--text, #727981)">The Kanban Guide 2025.5</text>

  <!-- 작업 항목: 행마다 시작부터 끝(또는 지금)까지 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="64">작업 항목 1</text>
    <text x="20" y="120">작업 항목 2</text>
    <text x="20" y="176">작업 항목 3</text>
    <text x="20" y="232">작업 항목 4</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="460" y="50" width="60" height="20" />
    <rect x="330" y="106" width="190" height="20" />
    <rect x="120" y="162" width="140" height="20" />
    <rect x="280" y="218" width="140" height="20" />
  </g>
  <!-- 끝나지 않은 항목 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M520 50 H580 V70 H520" />
    <path d="M520 106 H580 V126 H520" />
  </g>

  <!-- 지금 -->
  <line x1="520" y1="36" x2="520" y2="290" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="520" y="28" text-anchor="middle" fill="var(--text, #727981)">지금</text>

  <!-- Work Item Age -->
  <path d="M330 130 V136 H520 V130" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="425" y="154">Work Item Age</text>
    <text x="425" y="170">시작부터 지금까지</text>
  </g>

  <!-- Cycle Time -->
  <path d="M120 158 V152 H260 V158" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="128">Cycle Time</text>
    <text x="190" y="144">시작부터 끝까지</text>
  </g>

  <!-- WIP -->
  <path d="M586 60 H592 V116 H586" stroke="var(--ink, #727981)" stroke-width="1" />
  <g fill="var(--text, #727981)">
    <text x="602" y="84">WIP: 시작했지만</text>
    <text x="602" y="100">끝나지 않은 항목의 수</text>
  </g>

  <!-- 시간 축과 끝난 시점 -->
  <line x1="110" y1="290" x2="640" y2="290" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="648" y="294" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="182" x2="260" y2="290" />
    <line x1="420" y1="238" x2="420" y2="290" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="260" cy="290" r="3.5" />
    <circle cx="420" cy="290" r="3.5" />
  </g>

  <!-- Throughput -->
  <path d="M240 300 V306 H520 V300" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="380" y="324" text-anchor="middle" fill="var(--text, #727981)">Throughput: 단위 시간마다 끝난 항목의 수</text>
</svg>
