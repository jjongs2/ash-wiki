<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 640 184" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- ISO/SAE 21434의 두 측면 -->
  <text x="20" y="26" fill="var(--text, #727981)">ISO/SAE 21434</text>
  <rect x="20" y="36" width="600" height="68" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="36" y="52" width="276" height="36" rx="4" />
    <rect x="328" y="52" width="276" height="36" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="174" y="74.5">개발 프로젝트 안에서 하는 측면</text>
    <text x="466" y="74.5">개발 프로젝트 안에서 하지 않는 측면</text>
  </g>

  <!-- 다루는 문서 -->
  <path d="M328 118 V124 H604 V118" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="466" y="146" font-size="12">Automotive SPICE for Cybersecurity 2.0의 범위 밖</text>
    <text x="466" y="164" font-size="12">ISO/PAS 5112와 CSMS 감사의 몫</text>
  </g>
</svg>
