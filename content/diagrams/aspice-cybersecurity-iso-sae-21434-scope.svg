<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 528 202" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- ISO/SAE 21434의 두 측면 -->
  <text x="20" y="26" fill="var(--text, #727981)">ISO/SAE 21434</text>
  <rect x="20" y="36" width="488" height="68" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="36" y="52" width="220" height="36" rx="2" />
    <rect x="272" y="52" width="220" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="146" y="74.5">개발 프로젝트 안에서 하는 측면</text>
    <text x="382" y="74.5">개발 프로젝트 안에서 하지 않는 측면</text>
  </g>

  <!-- 다루는 문서 -->
  <path d="M272 118 V124 H492 V118" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="382" y="146">Automotive SPICE for</text>
    <text x="382" y="164">Cybersecurity 2.0의 범위 밖</text>
    <text x="382" y="182">ISO/PAS 5112와 CSMS 감사의 몫</text>
  </g>
</svg>
