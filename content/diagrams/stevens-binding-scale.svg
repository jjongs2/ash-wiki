<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 1 631.5 148" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="32" fill="var(--text, #727981)">Stevens 외의 binding</text>

  <!-- 척도 -->
  <line x1="66" y1="92" x2="578" y2="92" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g fill="var(--text, #727981)">
    <text x="56" y="97" text-anchor="end">약함</text>
    <text x="588" y="97">강함</text>
  </g>

  <!-- 단계 -->
  <g fill="var(--ink, #727981)">
    <circle cx="100" cy="92" r="4" />
    <circle cx="160" cy="92" r="4" />
    <circle cx="290" cy="92" r="4" />
    <circle cx="350" cy="92" r="4" />
    <circle cx="410" cy="92" r="4" />
    <circle cx="540" cy="92" r="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="76">우연적</text>
    <text x="160" y="76">논리적</text>
    <text x="290" y="76">시간적</text>
    <text x="350" y="76">교환적</text>
    <text x="410" y="76">순차적</text>
    <text x="540" y="76">기능적</text>
  </g>

  <!-- 비선형 -->
  <path d="M94 106 V112 H166 V106" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="128">나머지보다 훨씬 약함</text>
    <text x="540" y="128">나머지보다 훨씬 강함</text>
  </g>
</svg>
