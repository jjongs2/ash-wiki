<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 1 516 148" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="32" fill="var(--text, #727981)">Stevens 외의 binding</text>

  <!-- 척도 -->
  <line x1="66" y1="92" x2="462" y2="92" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g fill="var(--text, #727981)">
    <text x="56" y="97" text-anchor="end">약함</text>
    <text x="472" y="97">강함</text>
  </g>

  <!-- 단계 -->
  <g fill="var(--ink, #727981)">
    <circle cx="96" cy="92" r="4" />
    <circle cx="144" cy="92" r="4" />
    <circle cx="240" cy="92" r="4" />
    <circle cx="288" cy="92" r="4" />
    <circle cx="336" cy="92" r="4" />
    <circle cx="432" cy="92" r="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="96" y="76">우연적</text>
    <text x="144" y="76">논리적</text>
    <text x="240" y="76">시간적</text>
    <text x="288" y="76">교환적</text>
    <text x="336" y="76">순차적</text>
    <text x="432" y="76">기능적</text>
  </g>

  <!-- 비선형 -->
  <path d="M90 106 V112 H150 V106" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="128">나머지보다 훨씬 약함</text>
    <text x="432" y="128">나머지보다 훨씬 강함</text>
  </g>
</svg>
