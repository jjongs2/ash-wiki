<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 640 220" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 초기화 -->
  <text x="120" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">초기화</text>
  <line x1="120" y1="30" x2="120" y2="62" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 기본 세션 -->
  <rect x="40.75" y="64.75" width="158.5" height="46.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="120" y="93" text-anchor="middle" fill="var(--on-fill, #f8fafd)">기본 세션 (0x01)</text>

  <!-- 기본이 아닌 세션 -->
  <rect x="380.75" y="16.75" width="258.5" height="142.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="510" y="36" text-anchor="middle" font-size="12" fill="var(--text, #727981)">기본이 아닌 세션</text>
  <rect x="400" y="46" width="220" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="510" y="73" text-anchor="middle" fill="var(--text, #727981)">프로그래밍 세션 (0x02)</text>
  <rect x="400" y="100" width="220" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="510" y="127" text-anchor="middle" fill="var(--text, #727981)">확장 진단 세션 (0x03)</text>

  <!-- 세션 전환 -->
  <line x1="202" y1="76" x2="378" y2="76" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="var(--text, #727981)">DiagnosticSessionControl</text>
  <line x1="378" y1="100" x2="202" y2="100" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="var(--text, #727981)">S3Server 타이머 만료</text>

  <!-- TesterPresent: 세션 유지 -->
  <path d="M470 160 V186 H550 V162" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="510" y="206" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Concurrent TesterPresent: S3 타이머 다시 시작</text>
</svg>
