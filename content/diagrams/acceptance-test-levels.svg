<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 272" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- ECU: 응용 아래의 ICC1 스택 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="260" height="40" rx="2" />
    <rect x="40" y="114" width="220" height="32" rx="2" />
    <rect x="40" y="156" width="220" height="32" rx="2" />
  </g>
  <rect x="20.75" y="80.75" width="258.5" height="118.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="45">응용</text>
    <text x="150" y="135">RTE</text>
    <text x="150" y="177">BSW</text>
  </g>
  <text x="34" y="102" font-size="12" fill="var(--text, #727981)">ICC1 스택</text>
  <!-- 버스 -->
  <line x1="20" y1="236" x2="280" y2="236" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="150" y1="200" x2="150" y2="236" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="30" y="228" font-size="12" fill="var(--text, #727981)">버스</text>

  <!-- 시험에서 보는 자리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="280" y1="70" x2="330" y2="70" />
    <line x1="280" y1="236" x2="330" y2="236" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="340" y="66">응용 수준</text>
    <text x="340" y="232">버스 수준</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="340" y="84">RTE 요구사항, BSW 서비스, 라이브러리</text>
    <text x="340" y="250">버스 동작, 버스 프로토콜</text>
  </g>
</svg>
