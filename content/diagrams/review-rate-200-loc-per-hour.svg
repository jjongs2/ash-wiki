<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 12.5 508 160.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="시간당 200 LOC를 넘는 리뷰 속도와 결함 제거 효과">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Kemerer와 Paulk(2009), PSP 과정의 개인 리뷰 데이터</text>

  <!-- 리뷰 속도 축과 권장 상한 -->
  <line x1="260" y1="56" x2="260" y2="128" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="40" y1="128" x2="508" y2="128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="260" y="146">시간당 200 LOC</text>
    <text x="260" y="162">권장 상한</text>
  </g>
  <text x="508" y="146" text-anchor="end" font-size="12" fill="var(--text, #727981)">리뷰 속도</text>

  <!-- 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M44 118 V112 H254 V118" />
    <path d="M266 118 V112 H500 V118" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="149" y="78">설계 리뷰: 결함의 약 3분의 2를 찾음</text>
    <text x="149" y="96">코드 리뷰: 결함의 절반 넘게 찾음</text>
    <text x="383" y="96">결함 제거 효과가 떨어짐</text>
  </g>
</svg>
