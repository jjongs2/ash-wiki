    <rect x="160" y="214" width="170" height="40" rx="2" />
    <rect x="160" y="264" width="170" height="40" rx="2" />
    <rect x="160" y="314" width="170" height="40" rx="2" />
    <rect x="346" y="214" width="194" height="40" rx="2" />
    <rect x="346" y="264" width="194" height="40" rx="2" />
