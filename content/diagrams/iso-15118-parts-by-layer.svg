<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="ISO 15118 시리즈의 부와 계층">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 열 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
