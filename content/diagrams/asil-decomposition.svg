<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 10 580 138" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="39" fill="var(--text, #727981)">ISO 26262-1:2018</text>

  <!-- safety goal -->
  <rect x="250.75" y="20.75" width="139.5" height="28.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="320.5" y="39" font-size="13" text-anchor="middle" fill="var(--text, #727981)">Safety goal</text>

  <!-- 나누어 할당 -->
  <path d="M320.5 50 V70 H170 M320.5 70 H470" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="70" x2="170" y2="89" />
    <line x1="470" y1="70" x2="470" y2="89" />
  </g>
  <text x="245" y="64" text-anchor="middle" fill="var(--text, #727981)">나누어 할당</text>

  <!-- 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60.75" y="90.75" width="219.5" height="46.5" rx="2" />
    <rect x="360.75" y="90.75" width="219.5" height="46.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170.5" y="109" font-size="13">요소</text>
    <text x="170.5" y="127">중복된 안전 요구사항 · 낮춘 ASIL</text>
    <text x="470.5" y="109" font-size="13">요소</text>
    <text x="470.5" y="127">중복된 안전 요구사항 · 낮춘 ASIL</text>
  </g>
  <line x1="283" y1="122" x2="358" y2="122" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="320.5" y="114" text-anchor="middle" fill="var(--text, #727981)">충분히 독립</text>
</svg>
