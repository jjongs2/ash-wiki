<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- 우선순위 처리를 켰을 때: 큐 둘 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">NvMJobPrioritization을 켰을 때</text>
  <rect x="20.75" y="44.75" width="238.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="140" y="67" text-anchor="middle" fill="var(--on-fill, #f8fafd)">immediate 쓰기 job 큐</text>
  <rect x="20" y="104" width="240" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="125" text-anchor="middle" fill="var(--text, #727981)">그 밖의 job 큐</text>
  <text x="140" y="143" text-anchor="middle" font-size="12" fill="var(--text, #727981)">immediate 읽기·지우기 포함</text>

  <rect x="400" y="75" width="180" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="490" y="96" text-anchor="middle" fill="var(--text, #727981)">NvM_MainFunction</text>
  <text x="490" y="114" text-anchor="middle" font-size="12" fill="var(--text, #727981)">하나씩 처리</text>

  <line x1="262" y1="62" x2="398" y2="90" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <line x1="262" y1="129" x2="398" y2="110" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="270" y="50" font-size="12" fill="var(--text, #727981)">진행 중인 job을 끊고 먼저</text>
  <text x="490" y="145" text-anchor="middle" font-size="12" fill="var(--text, #727981)">끊긴 job은 그 뒤 다시 시작</text>

  <line x1="20" y1="174" x2="580" y2="174" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 우선순위 처리를 껐을 때: 큐 하나 -->
  <text x="20" y="204" font-size="12" fill="var(--text, #727981)">NvMJobPrioritization을 껐을 때</text>
  <rect x="20" y="218" width="240" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="239" text-anchor="middle" fill="var(--text, #727981)">모든 job 큐</text>
  <text x="140" y="257" text-anchor="middle" font-size="12" fill="var(--text, #727981)">온 순서대로</text>
  <rect x="400" y="218" width="180" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="490" y="239" text-anchor="middle" fill="var(--text, #727981)">NvM_MainFunction</text>
  <text x="490" y="257" text-anchor="middle" font-size="12" fill="var(--text, #727981)">하나씩 처리</text>
  <line x1="262" y1="243" x2="398" y2="243" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
