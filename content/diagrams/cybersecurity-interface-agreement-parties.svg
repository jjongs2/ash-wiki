<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 296" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 분산 사이버보안 활동 -->
  <rect x="20.75" y="20.75" width="558.5" height="50.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32.75" y="32.75" width="138.5" height="26.5" rx="2" />
    <rect x="428.75" y="32.75" width="138.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="102" y="50">고객의 책임</text>
    <text x="498" y="50">공급자의 책임</text>
    <text x="300" y="51" font-size="13">분산 사이버보안 활동</text>
  </g>

  <!-- 고객과 공급자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32.75" y="164.75" width="138.5" height="26.5" rx="2" />
    <rect x="428.75" y="164.75" width="138.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="102" y="182">고객</text>
    <text x="498" y="182">공급자</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="102" y1="60" x2="102" y2="164" />
    <line x1="498" y1="60" x2="498" y2="164" />
    <line x1="172" y1="178" x2="190" y2="178" />
    <line x1="410" y1="178" x2="428" y2="178" />
  </g>

  <!-- Cybersecurity interface agreement -->
  <rect x="190.75" y="110.75" width="218.5" height="134.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="300" y="131" text-anchor="middle" fill="var(--text, #727981)">Cybersecurity interface agreement</text>
  <line x1="191" y1="141" x2="409" y2="141" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="11" fill="var(--text, #727981)">
    <text x="206" y="159">이해관계자와 연락 담당</text>
    <text x="206" y="175">Tailoring에 관한 합의</text>
    <text x="206" y="191">분산 활동에 대한 책임</text>
    <text x="206" y="207">문제가 생겼을 때의 정보·산출물 공유</text>
    <text x="206" y="223">합의한 마일스톤</text>
    <text x="206" y="239">공급자의 지원과 유지보수 기간</text>
  </g>

  <text x="579" y="275" text-anchor="end" fill="var(--text, #727981)">목록: Automotive SPICE for Cybersecurity 2.0의 02-50</text>
</svg>
