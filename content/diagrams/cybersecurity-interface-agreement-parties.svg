<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 296" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="고객과 공급자의 합의에 담는 것">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 분산 사이버보안 활동 -->
  <rect x="20.75" y="20.75" width="476.5" height="50.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32.75" y="32.75" width="96.5" height="26.5" rx="2" />
    <rect x="388.75" y="32.75" width="96.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="81" y="50">고객의 책임</text>
    <text x="437" y="50">공급자의 책임</text>
    <text x="259" y="51" font-size="13">분산 사이버보안 활동</text>
  </g>

  <!-- 고객과 공급자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32.75" y="164.75" width="96.5" height="26.5" rx="2" />
    <rect x="388.75" y="164.75" width="96.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="81" y="182">고객</text>
    <text x="437" y="182">공급자</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="81" y1="60" x2="81" y2="164" />
    <line x1="437" y1="60" x2="437" y2="164" />
    <line x1="130" y1="178" x2="145" y2="178" />
    <line x1="373" y1="178" x2="388" y2="178" />
  </g>

  <!-- Cybersecurity interface agreement -->
  <rect x="145.75" y="110.75" width="226.5" height="134.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="259" y="131" text-anchor="middle" fill="var(--text, #727981)">Cybersecurity interface agreement</text>
  <line x1="146" y1="141" x2="372" y2="141" stroke="var(--ink, #727981)" stroke-width="1" />
  <g fill="var(--text, #727981)">
    <text x="158" y="159">이해관계자와 연락 담당</text>
    <text x="158" y="175">Tailoring에 관한 합의</text>
    <text x="158" y="191">분산 활동에 대한 책임</text>
    <text x="158" y="207">문제가 생겼을 때의 정보·산출물 공유</text>
    <text x="158" y="223">합의한 마일스톤</text>
    <text x="158" y="239">공급자의 지원과 유지보수 기간</text>
  </g>

  <text x="497" y="275" text-anchor="end" fill="var(--text, #727981)">목록: Automotive SPICE for Cybersecurity 2.0의 02-50</text>
</svg>
