<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1 490 285.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- queued가 아닌 data element -->
  <text x="20" y="30" fill="var(--text, #727981)">queued가 아닌 data element: last-is-best</text>
  <text x="20" y="75" fill="var(--text, #727981)">새 값</text>
  <rect x="190.75" y="52.75" width="158.5" height="34.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="270" y="75" text-anchor="middle" fill="var(--text, #727981)">마지막으로 받은 값</text>
  <text x="448" y="75" fill="var(--text, #727981)">읽기</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="60" y1="70" x2="188" y2="70" />
    <line x1="352" y1="70" x2="440" y2="70" />
    <line x1="270" y1="89" x2="270" y2="112" stroke-dasharray="5 4" />
  </g>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">이전 값은 읽혔는지와 상관없이 버림</text>

  <!-- queued data element -->
  <text x="20" y="170" fill="var(--text, #727981)">queued data element: FIFO</text>
  <text x="20" y="221" fill="var(--text, #727981)">새 값</text>
  <rect x="190.75" y="198.75" width="158.5" height="34.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M230 199.5 V232.5 M270 199.5 V232.5 M310 199.5 V232.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="210" y="192">끝</text>
    <text x="330" y="192">앞</text>
  </g>
  <text x="448" y="221" fill="var(--text, #727981)">읽기</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="60" y1="216" x2="188" y2="216" />
    <line x1="352" y1="216" x2="440" y2="216" />
  </g>
  <path d="M190.75 240 V246 H349.25 V240" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="270" y="262" text-anchor="middle" font-size="12" fill="var(--text, #727981)">큐 길이: RteQueuedReceiverQueueLength 또는 queueLength</text>
</svg>
