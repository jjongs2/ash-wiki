<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.5 -1.5 620 250" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 머리: 나가는 순서 -->
  <text x="160" y="20" font-size="12" fill="var(--text, #727981)">최상위 비트</text>
  <line x1="236" y1="16" x2="530" y2="16" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="600" y="20" text-anchor="end" font-size="12" fill="var(--text, #727981)">나중 비트</text>

  <!-- 송신 노드 1: 이긴 쪽 -->
  <text x="146" y="55" text-anchor="end" fill="var(--text, #727981)">송신 노드 1</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="160.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="220.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="280.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="340.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="400.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="460.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="520.75" y="30.75" width="58.5" height="38.5" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="55">D</text><text x="250" y="55">R</text><text x="310" y="55">R</text><text x="370" y="55">D</text><text x="430" y="55">R</text><text x="490" y="55">D</text><text x="550" y="55">D</text>
  </g>

  <!-- 송신 노드 2: 여섯째 비트에서 짐 -->
  <text x="146" y="105" text-anchor="end" fill="var(--text, #727981)">송신 노드 2</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="160.75" y="80.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="220.75" y="80.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="280.75" y="80.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="340.75" y="80.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="400.75" y="80.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="520.75" y="80.75" width="58.5" height="38.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  </g>
  <rect x="460.75" y="80.75" width="58.5" height="38.5" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="105">D</text><text x="250" y="105">R</text><text x="310" y="105">R</text><text x="370" y="105">D</text><text x="430" y="105">R</text><text x="550" y="105">수신</text>
  </g>
  <text x="490" y="105" text-anchor="middle" fill="var(--on-fill, #f8fafd)">R</text>

  <!-- 되읽은 버스 -->
  <text x="146" y="165" text-anchor="end" fill="var(--text, #727981)">버스에서 읽은 값</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="160" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="220" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="280" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="340" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="400" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="460" y="140" width="59" height="40" fill="var(--surface, none)" />
    <rect x="520" y="140" width="60" height="40" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="165">D</text><text x="250" y="165">R</text><text x="310" y="165">R</text><text x="370" y="165">D</text><text x="430" y="165">R</text><text x="490" y="165">D</text><text x="550" y="165">D</text>
  </g>

  <!-- 범례 -->
  <text x="160" y="208" font-size="12" fill="var(--text, #727981)">D: dominant (논리 0) · R: recessive (논리 1)</text>
  <rect x="160.75" y="222.75" width="12.5" height="12.5" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="182" y="234" font-size="12" fill="var(--text, #727981)">R을 냈으나 D로 읽힌 비트. 노드 2는 여기서 송신을 그만둔다</text>
</svg>
