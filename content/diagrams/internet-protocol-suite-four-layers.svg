<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 524 188" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="인터넷 프로토콜 스위트의 네 계층과 프로토콜">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 응용 계층 -->
  <rect x="20" y="20" width="110" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="75" y="43" text-anchor="middle" fill="var(--text, #727981)">응용 계층</text>
  <rect x="142.75" y="20.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="177" y="43" text-anchor="middle" fill="var(--text, #727981)">Telnet</text>
  <rect x="220.75" y="20.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="255" y="43" text-anchor="middle" fill="var(--text, #727981)">FTP</text>
  <rect x="298.75" y="20.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="333" y="43" text-anchor="middle" fill="var(--text, #727981)">SMTP</text>
  <rect x="376.75" y="20.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="411" y="43" text-anchor="middle" fill="var(--text, #727981)">DNS</text>
  <rect x="454.75" y="20.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="489" y="43" text-anchor="middle" fill="var(--text, #727981)">SNMP</text>
  <!-- 전송 계층 -->
  <rect x="20" y="64" width="110" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="75" y="87" text-anchor="middle" fill="var(--text, #727981)">전송 계층</text>
  <rect x="142.75" y="64.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="177" y="87" text-anchor="middle" fill="var(--text, #727981)">TCP</text>
  <rect x="220.75" y="64.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="255" y="87" text-anchor="middle" fill="var(--text, #727981)">UDP</text>
  <!-- 인터넷 계층 -->
  <rect x="20" y="108" width="110" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="75" y="131" text-anchor="middle" fill="var(--text, #727981)">인터넷 계층</text>
  <rect x="142.75" y="108.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="177" y="131" text-anchor="middle" fill="var(--text, #727981)">IP</text>
