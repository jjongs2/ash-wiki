  <text x="255" y="131" text-anchor="middle" fill="var(--text, #727981)">ICMP</text>
  <rect x="298.75" y="108.75" width="68.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
