<svg xmlns="http://www.w3.org/2000/svg" viewBox="119.5 -8.5 521 292.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--green, #337b47)" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="140" y="12" width="160" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="220" y="32" text-anchor="middle" fill="var(--text, #727981)">보내는 쪽</text>
  <rect x="460" y="12" width="160" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="540" y="32" text-anchor="middle" fill="var(--text, #727981)">링크 상대</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="220" y1="44" x2="220" y2="264" />
    <line x1="540" y1="44" x2="540" y2="264" />
  </g>

  <!-- 선점 지원 알림 -->
  <text x="380" y="64" text-anchor="middle" fill="var(--text, #727981)">LLDPDU의 Additional Ethernet Capabilities TLV</text>
  <text x="380" y="80" text-anchor="middle" fill="var(--text, #727981)">(선점 지원을 알림)</text>
  <line x1="538" y1="86" x2="222" y2="98" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 검증 -->
  <rect x="160" y="110" width="440" height="108" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="380" y="128" text-anchor="middle" fill="var(--text, #727981)">검증을 켰을 때</text>
  <line x1="222" y1="154" x2="538" y2="166" stroke="var(--green, #337b47)" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="380" y="150" text-anchor="middle" fill="var(--text, #727981)">verify mPacket (SMD-V, mCRC)</text>
  <line x1="538" y1="190" x2="222" y2="202" stroke="var(--violet, #825da9)" stroke-width="1.5" marker-end="url(#arrow-violet)" />
  <text x="380" y="186" text-anchor="middle" fill="var(--text, #727981)">respond mPacket (SMD-R, mCRC)</text>

  <!-- 선점 동작 -->
  <text x="228" y="240" fill="var(--text, #727981)">선점 기능이 확인됨</text>
  <text x="228" y="256" fill="var(--text, #727981)">송신 방향의 선점이 동작함</text>
</svg>
