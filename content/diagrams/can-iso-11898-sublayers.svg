<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 600 310" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 왼쪽: OSI 계층 -->
  <path d="M146 20 H140 V60 H146" stroke="#727981" stroke-width="1.5" />
  <text x="132" y="45" text-anchor="end" fill="#727981">데이터 링크 계층</text>
  <path d="M146 70 H140 V290 H146" stroke="#727981" stroke-width="1.5" />
  <text x="132" y="185" text-anchor="end" fill="#727981">물리 계층</text>

  <!-- ISO 11898-1: LLC, MAC, PCS -->
  <rect x="150" y="20" width="150" height="40" rx="4" fill="#336fb8" />
  <text x="225" y="45" text-anchor="middle" fill="#f8fafd">LLC</text>
  <rect x="310" y="20" width="150" height="40" rx="4" fill="#336fb8" />
  <text x="385" y="45" text-anchor="middle" fill="#f8fafd">MAC</text>
  <rect x="150" y="70" width="310" height="40" rx="4" fill="#336fb8" />
  <text x="305" y="95" text-anchor="middle" fill="#f8fafd">PCS</text>
  <path d="M470 20 H476 V110 H470" stroke="#727981" stroke-width="1.5" />
  <text x="484" y="70" fill="#727981">ISO 11898-1</text>

  <!-- AUI -->
  <line x1="225" y1="112" x2="225" y2="158" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="385" y1="112" x2="385" y2="158" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="305" y="132" text-anchor="middle" fill="#727981">AUI</text>
  <text x="305" y="150" text-anchor="middle" font-size="12" fill="#727981">TXD · RXD</text>

  <!-- PMA: 고속과 저속 내결함성 -->
  <rect x="150" y="160" width="150" height="50" rx="4" fill="#b0540d" />
  <text x="225" y="181" text-anchor="middle" fill="#f8fafd">고속 PMA</text>
  <text x="225" y="199" text-anchor="middle" font-size="12" fill="#f8fafd">ISO 11898-2</text>
  <rect x="310" y="160" width="150" height="50" rx="4" fill="#337b47" />
  <text x="385" y="181" text-anchor="middle" fill="#f8fafd">저속 내결함성</text>
  <text x="385" y="199" text-anchor="middle" fill="#f8fafd">PMA</text>

  <!-- MDI -->
  <line x1="225" y1="210" x2="225" y2="240" stroke="#727981" stroke-width="1.5" />
  <line x1="385" y1="210" x2="385" y2="240" stroke="#727981" stroke-width="1.5" />
  <rect x="150.75" y="240.75" width="148.5" height="48.5" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="225" y="261" text-anchor="middle" fill="#727981">MDI</text>
  <text x="225" y="279" text-anchor="middle" font-size="12" fill="#727981">CAN_H · CAN_L</text>
  <rect x="310" y="240" width="150" height="50" rx="4" fill="#337b47" />
  <text x="385" y="261" text-anchor="middle" fill="#f8fafd">MDI</text>
  <text x="385" y="279" text-anchor="middle" font-size="12" fill="#f8fafd">CAN_H · CAN_L</text>
  <path d="M470 160 H476 V290 H470" stroke="#727981" stroke-width="1.5" />
  <text x="484" y="230" fill="#727981">ISO 11898-3</text>
</svg>
