<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 0 515.5 345.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="ISO 11898이 규정하는 데이터 링크 계층과 물리 계층">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 왼쪽: OSI 계층 -->
  <path d="M146 20 H140 V60 H146" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="132" y="45" text-anchor="end" fill="var(--text, #727981)">데이터 링크 계층</text>
  <path d="M146 70 H140 V290 H146" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="132" y="185" text-anchor="end" fill="var(--text, #727981)">물리 계층</text>

  <!-- ISO 11898-1: LLC, MAC, PCS -->
  <rect x="150.75" y="20.75" width="128.5" height="38.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="215" y="45" text-anchor="middle" fill="var(--on-fill, #f8fafd)">LLC</text>
  <rect x="290.75" y="20.75" width="128.5" height="38.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="355" y="45" text-anchor="middle" fill="var(--on-fill, #f8fafd)">MAC</text>
  <rect x="150.75" y="70.75" width="268.5" height="38.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="285" y="95" text-anchor="middle" fill="var(--on-fill, #f8fafd)">PCS</text>
  <path d="M430 20 H436 V110 H430" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="444" y="70" fill="var(--text, #727981)">ISO 11898-1</text>

  <!-- AUI -->
  <line x1="165" y1="112" x2="165" y2="158" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="405" y1="112" x2="405" y2="158" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="285" y="132" text-anchor="middle" fill="var(--text, #727981)">AUI(Attachment Unit Interface)</text>
  <text x="285" y="150" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TXD · RXD</text>

  <!-- 고속: ISO 11898-2 -->
  <rect x="150.75" y="160.75" width="128.5" height="48.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="215" y="181" text-anchor="middle" fill="var(--on-fill, #f8fafd)">고속</text>
  <text x="215" y="199" text-anchor="middle" fill="var(--on-fill, #f8fafd)">PMA</text>
  <line x1="215" y1="210" x2="215" y2="240" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="150.75" y="240.75" width="128.5" height="48.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="215" y="261" text-anchor="middle" fill="var(--on-fill, #f8fafd)">MDI</text>
  <text x="215" y="279" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">CAN_H · CAN_L</text>
  <path d="M150 300 V306 H280 V300" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="215" y="326" text-anchor="middle" fill="var(--text, #727981)">ISO 11898-2</text>

  <!-- 저속 내결함성: ISO 11898-3 -->
  <rect x="290.75" y="160.75" width="128.5" height="48.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="355" y="181" text-anchor="middle" fill="var(--on-fill, #f8fafd)">저속 내결함성</text>
  <text x="355" y="199" text-anchor="middle" fill="var(--on-fill, #f8fafd)">PMA</text>
  <line x1="355" y1="210" x2="355" y2="240" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="290.75" y="240.75" width="128.5" height="48.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="355" y="261" text-anchor="middle" fill="var(--on-fill, #f8fafd)">MDI</text>
  <text x="355" y="279" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">CAN_H · CAN_L</text>
  <path d="M290 300 V306 H420 V300" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="355" y="326" text-anchor="middle" fill="var(--text, #727981)">ISO 11898-3</text>
</svg>
