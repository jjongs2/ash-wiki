<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 666.5 271" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범례 -->
  <rect x="510.75" y="12.75" width="10.5" height="14.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="530" y="24" font-size="12" fill="var(--text, #727981)">틱 ISR</text>

  <!-- idle hook으로 절전: 틱마다 깨어남 -->
  <text x="20" y="24" fill="var(--text, #727981)">FreeRTOS idle hook으로 절전</text>
  <text x="295" y="46" text-anchor="middle" font-size="12" fill="var(--text, #727981)">틱마다 저전력 상태를 나왔다가 다시 들어감</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="110" y1="54" x2="480" y2="54" />
    <line x1="110" y1="54" x2="110" y2="58" />
    <line x1="480" y1="54" x2="480" y2="58" />
  </g>
  <rect x="30.75" y="62.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="70" y="78" text-anchor="middle" font-size="12" fill="var(--text, #727981)">응용 태스크</text>
  <rect x="110.75" y="62.75" width="368.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="492.75" y="62.75" width="46.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="552.75" y="62.75" width="46.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="120.75" y="62.75" width="10.5" height="22.5" />
    <rect x="180.75" y="62.75" width="10.5" height="22.5" />
    <rect x="240.75" y="62.75" width="10.5" height="22.5" />
    <rect x="300.75" y="62.75" width="10.5" height="22.5" />
    <rect x="360.75" y="62.75" width="10.5" height="22.5" />
    <rect x="420.75" y="62.75" width="10.5" height="22.5" />
    <rect x="480.75" y="62.75" width="10.5" height="22.5" />
    <rect x="540.75" y="62.75" width="10.5" height="22.5" />
  </g>
  <line x1="20" y1="92" x2="618" y2="92" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="626" y="96" font-size="12" fill="var(--text, #727981)">시간</text>
  <text x="295" y="112" text-anchor="middle" font-size="12" fill="var(--text, #727981)">idle: 저전력 상태</text>

  <!-- tickless idle: 틱 인터럽트를 멈춤 -->
  <text x="20" y="154" fill="var(--text, #727981)">FreeRTOS tickless idle 모드</text>
  <text x="295" y="176" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주기 틱 인터럽트를 멈춤</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="110" y1="184" x2="480" y2="184" />
    <line x1="110" y1="184" x2="110" y2="188" />
    <line x1="480" y1="184" x2="480" y2="188" />
  </g>
  <rect x="30.75" y="192.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="70" y="208" text-anchor="middle" font-size="12" fill="var(--text, #727981)">응용 태스크</text>
  <rect x="110.75" y="192.75" width="368.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="295" y="208" text-anchor="middle" font-size="12" fill="var(--text, #727981)">idle: 깊은 절전 상태</text>
  <rect x="492.75" y="192.75" width="46.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="552.75" y="192.75" width="46.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="480.75" y="192.75" width="10.5" height="22.5" />
    <rect x="540.75" y="192.75" width="10.5" height="22.5" />
  </g>
  <line x1="20" y1="222" x2="618" y2="222" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="626" y="226" font-size="12" fill="var(--text, #727981)">시간</text>
  <text x="486" y="242" text-anchor="middle" font-size="12" fill="var(--text, #727981)">틱 카운트 보정</text>
</svg>
