<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -5.5 521 212" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="세션 기반 테스트의 흐름">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTFL·CTAL-TA 강의계획서</text>

  <!-- 시간 상자 -->
  <rect x="166" y="40" width="188" height="146" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="260" y="32" text-anchor="middle" fill="var(--text, #727981)">시간 상자</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M144 76 H184" />
    <path d="M334 76 H374" />
  </g>

  <!-- 적을 수 있는 기록 -->
  <path d="M260 100 V128" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="186" y="130" width="148" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="52" width="124" height="48" rx="2" />
    <rect x="186" y="52" width="148" height="48" rx="2" />
    <rect x="376" y="52" width="124" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="82" y="72">테스트 차터</text>
    <text x="82" y="90">테스트 목표</text>
    <text x="260" y="72">테스트 세션</text>
    <text x="260" y="90">설계·실행·평가를 함께</text>
    <text x="260" y="154.5">테스트 세션 시트에 기록</text>
    <text x="438" y="72">디브리핑</text>
    <text x="438" y="90">테스터와 이해관계자</text>
  </g>
</svg>
