<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -5.5 621 212" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTFL·CTAL-TA 강의계획서</text>

  <!-- 시간 상자 -->
  <rect x="190" y="40" width="240" height="146" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="310" y="32" text-anchor="middle" fill="var(--text, #727981)">시간 상자</text>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M150 76 H208" />
    <path d="M410 76 H468" />
  </g>

  <!-- 적을 수 있는 기록 -->
  <path d="M310 100 V128" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="210" y="130" width="200" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="52" width="130" height="48" rx="2" />
    <rect x="210" y="52" width="200" height="48" rx="2" />
    <rect x="470" y="52" width="130" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="72">테스트 차터</text>
    <text x="85" y="90">테스트 목표</text>
    <text x="310" y="72">테스트 세션</text>
    <text x="310" y="90">설계·실행·평가를 함께</text>
    <text x="310" y="154.5">테스트 세션 시트에 기록</text>
    <text x="535" y="72">디브리핑</text>
    <text x="535" y="90">테스터와 이해관계자</text>
  </g>
</svg>
