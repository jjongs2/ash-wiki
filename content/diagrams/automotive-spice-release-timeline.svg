<svg xmlns="http://www.w3.org/2000/svg" viewBox="47.5 1.5 507 225.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 1년 = 17 단위, 2005년 = x 170. 따로 있던 두 문서가 3.0에서 한 문서로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M170 40 H294 C313 40 313 70 332 70" />
    <path d="M170 100 H294 C313 100 313 70 332 70" />
    <path d="M332 70 H527" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="end">
    <text x="156" y="44">프로세스 참조 모델</text>
    <text x="156" y="104">프로세스 평가 모델</text>
  </g>

  <!-- 판 -->
  <g fill="var(--ink, #727981)">
    <circle cx="170" cy="40" r="4" />
    <circle cx="255" cy="40" r="4" />
    <circle cx="170" cy="100" r="4" />
    <circle cx="255" cy="100" r="4" />
    <circle cx="340" cy="70" r="4" />
    <circle cx="374" cy="70" r="4" />
    <circle cx="476" cy="70" r="4" />
    <circle cx="527" cy="70" r="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="30">4.2</text>
    <text x="255" y="30">4.5</text>
    <text x="170" y="119">2.2</text>
    <text x="255" y="119">2.5</text>
    <text x="340" y="60">3.0</text>
    <text x="374" y="60">3.1</text>
    <text x="476" y="60">4.0</text>
    <text x="527" y="60">4.1</text>
    <text x="425" y="89">한 문서</text>
  </g>

  <!-- 연도 축 -->
  <line x1="170" y1="146" x2="527" y2="146" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M170 146 v5 M187 146 v5 M204 146 v5 M221 146 v5 M238 146 v5 M255 146 v5 M272 146 v5 M289 146 v5 M306 146 v5 M323 146 v5 M340 146 v5 M357 146 v5 M374 146 v5 M391 146 v5 M408 146 v5 M425 146 v5 M442 146 v5 M459 146 v5 M476 146 v5 M493 146 v5 M510 146 v5 M527 146 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="167">2005</text>
    <text x="255" y="167">2010</text>
    <text x="340" y="167">2015</text>
    <text x="425" y="167">2020</text>
    <text x="510" y="167">2025</text>
  </g>

  <!-- 펴낸 곳 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M170 182 V188 H255 V182" />
    <path d="M340 182 V188 H527 V182" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="212.5" y="206">Automotive SIG</text>
    <text x="433.5" y="206">VDA QMC</text>
  </g>
</svg>
