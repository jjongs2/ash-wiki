<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 790 310" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="190" height="40" rx="2" />
    <rect x="340" y="40" width="190" height="40" rx="2" />
    <rect x="20" y="120" width="190" height="60" rx="2" />
    <rect x="340" y="130" width="190" height="40" rx="2" />
    <rect x="630" y="40" width="140" height="130" rx="2" />
    <rect x="340" y="220" width="430" height="90" rx="2" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="65">SMControlApplication</text>
    <text x="435" y="65">TransitionRequestTable</text>
    <text x="435" y="155">ErrorRecoveryTable</text>
    <text x="700" y="101">StateMachine</text>
    <text x="700" y="119">State</text>
  </g>
  <!-- 오류를 알리는 쪽 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="115" y="139.5">Platform Health Management</text>
    <text x="115" y="154.5">Execution Management</text>
    <text x="115" y="169.5">State Management</text>
    <text x="435" y="100">입력값과 현재 상태로 정한다</text>
    <text x="435" y="192">ErrorCode ANY 항목을 정확히 하나 둔다</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="210" y1="60" x2="338" y2="60" />
    <line x1="530" y1="60" x2="628" y2="60" />
    <line x1="210" y1="150" x2="338" y2="150" />
    <line x1="530" y1="150" x2="628" y2="150" />
    <line x1="700" y1="170" x2="700" y2="218" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="275" y="52">RequestTransition</text>
    <text x="580" y="52">다음 상태</text>
    <text x="275" y="142">ErrorCode</text>
    <text x="580" y="128">복구용</text>
    <text x="580" y="142">다음 상태</text>
  </g>
  <text x="692" y="199" text-anchor="end" font-size="12" fill="var(--text, #727981)">상태에 들면 모두 실행</text>

  <!-- ActionList -->
  <text x="356" y="244" fill="var(--text, #727981)">ActionList의 ActionListItem</text>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="356" y="266">Function Group State 요청</text>
    <text x="356" y="283">SYNC</text>
    <text x="356" y="300">StateMachine 시작·정지</text>
    <text x="570" y="266">Sleep</text>
    <text x="570" y="283">NetworkHandle 전환</text>
    <text x="570" y="300">Suspend-to-RAM 제어</text>
  </g>
</svg>
