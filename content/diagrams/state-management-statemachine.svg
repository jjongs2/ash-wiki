<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 530 430" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="230" height="60" rx="2" />
    <rect x="280" y="40" width="230" height="60" rx="2" />
    <rect x="20" y="150" width="230" height="40" rx="2" />
    <rect x="280" y="150" width="230" height="40" rx="2" />
    <rect x="180" y="250" width="170" height="40" rx="2" />
    <rect x="20" y="340" width="490" height="90" rx="2" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="135" y="75">SMControlApplication</text>
    <text x="135" y="175">TransitionRequestTable</text>
    <text x="395" y="175">ErrorRecoveryTable</text>
    <text x="265" y="275">StateMachine State</text>
  </g>
  <!-- 오류를 알리는 쪽 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="395" y="59.5">Platform Health Management</text>
    <text x="395" y="74.5">Execution Management</text>
    <text x="395" y="89.5">State Management</text>
    <text x="110" y="210">입력값과 현재 상태로 정한다</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="332" y="210">ErrorCode ANY 항목을</text>
    <text x="332" y="226">정확히 하나 둔다</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="135" y1="100" x2="135" y2="148" />
    <line x1="395" y1="100" x2="395" y2="148" />
    <line x1="210" y1="190" x2="210" y2="248" />
    <line x1="320" y1="190" x2="320" y2="248" />
    <line x1="265" y1="290" x2="265" y2="338" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="143" y="128.5">RequestTransition</text>
    <text x="403" y="128.5">ErrorCode</text>
    <text x="202" y="240" text-anchor="end">다음 상태</text>
    <text x="328" y="244">복구용 다음 상태</text>
    <text x="273" y="318.5">상태에 들면 모두 실행</text>
  </g>

  <!-- ActionList -->
  <text x="36" y="364" fill="var(--text, #727981)">ActionList의 ActionListItem</text>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="36" y="386">Function Group State 요청</text>
    <text x="36" y="403">SYNC</text>
    <text x="36" y="420">StateMachine 시작·정지</text>
    <text x="280" y="386">Sleep</text>
    <text x="280" y="403">NetworkHandle 전환</text>
    <text x="280" y="420">Suspend-to-RAM 제어</text>
  </g>
</svg>
