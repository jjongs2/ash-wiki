<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 19 378 279" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="물체 하나의 송신 신호와 수신 신호">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="220" x2="100" y2="34" />
    <line x1="100" y1="220" x2="440" y2="220" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="108" y="38">주파수</text>
    <text x="440" y="240" text-anchor="end">시간</text>
  </g>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="180" x2="120" y2="200" />
    <line x1="200" y1="180" x2="200" y2="200" />
  </g>

  <!-- 송신 신호와 수신 신호 -->
  <line x1="120" y1="180" x2="320" y2="60" stroke="var(--ink, #727981)" stroke-width="3" stroke-linecap="round" />
  <line x1="200" y1="180" x2="400" y2="60" stroke="var(--blue, #336fb8)" stroke-width="3" stroke-linecap="round" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="312" y="50" text-anchor="end">송신 신호</text>
    <text x="408" y="64">수신 신호</text>
  </g>

  <!-- 주파수 차와 지연 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="280" y1="87" x2="280" y2="129" />
    <line x1="122" y1="196" x2="198" y2="196" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="288" y="113"><tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="10">0</tspan></text>
    <text x="160" y="214" text-anchor="middle">2<tspan font-style="italic">d</tspan>/<tspan font-style="italic">c</tspan></text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="270" y="268">TI 백서에 따른 물체 하나의 신호. 물체의 속도가 주는 영향은 무시했다.</text>
    <text x="270" y="286">두 신호의 주파수 차 <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="9">0</tspan>이 IF 신호의 주파수다.</text>
  </g>
</svg>
