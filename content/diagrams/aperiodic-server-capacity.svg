<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 4 686 419" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- polling server -->
  <text x="20" y="34" fill="var(--text, #727981)">polling server</text>
  <line x1="60" y1="100" x2="60" y2="48" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="52" y="68" text-anchor="end" font-size="12" fill="var(--text, #727981)">용량</text>
  <line x1="60" y1="100" x2="638" y2="100" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="646" y="104" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)">
    <rect x="80.75" y="60.75" width="48.5" height="38.5" />
    <rect x="480.75" y="60.75" width="48.5" height="38.5" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="84">버려짐</text>
    <text x="505" y="84">버려짐</text>
  </g>
  <path d="M80 100 H280 V60 L340 100 H620" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <line x1="164" y1="88" x2="276" y2="88" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="220" y="80" text-anchor="middle" font-size="12" fill="var(--text, #727981)">release까지 대기</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="100" x2="80" y2="110" />
    <line x1="280" y1="100" x2="280" y2="110" />
    <line x1="480" y1="100" x2="480" y2="110" />
  </g>
  <path d="M160 103 L165 113 L155 113 z" fill="var(--orange, #b0540d)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="128">release</text>
    <text x="160" y="128">aperiodic 요청</text>
  </g>

  <!-- deferrable server -->
  <text x="20" y="164" fill="var(--text, #727981)">deferrable server</text>
  <line x1="60" y1="230" x2="60" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="52" y="198" text-anchor="end" font-size="12" fill="var(--text, #727981)">용량</text>
  <line x1="60" y1="230" x2="638" y2="230" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="646" y="234" font-size="12" fill="var(--text, #727981)">시간</text>
  <path d="M80 230 V190 H160 L220 230 H280 V190 H620" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="200" y="216">곧바로 처리</text>
    <text x="288" y="182">서버 주기가 시작될 때 가득 보충</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="230" x2="80" y2="240" />
    <line x1="280" y1="230" x2="280" y2="240" />
    <line x1="480" y1="230" x2="480" y2="240" />
  </g>
  <path d="M160 233 L165 243 L155 243 z" fill="var(--orange, #b0540d)" />

  <!-- sporadic server -->
  <text x="20" y="294" fill="var(--text, #727981)">sporadic server <tspan font-size="12">(1989년 기술 보고서의 보충 규칙)</tspan></text>
  <line x1="60" y1="360" x2="60" y2="308" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="52" y="328" text-anchor="end" font-size="12" fill="var(--text, #727981)">용량</text>
  <line x1="60" y1="360" x2="638" y2="360" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="646" y="364" font-size="12" fill="var(--text, #727981)">시간</text>
  <path d="M80 360 V320 H160 L220 360 H360 V320 H620" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="200" y="346">곧바로 처리</text>
    <text x="368" y="312">쓴 만큼 보충</text>
  </g>
  <path d="M160 363 L165 373 L155 373 z" fill="var(--orange, #b0540d)" />
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="162" y1="384" x2="358" y2="384" />
    <line x1="162" y1="379" x2="162" y2="389" />
    <line x1="358" y1="379" x2="358" y2="389" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="260" y="402" text-anchor="middle">서버 주기</text>
    <text x="152" y="402" text-anchor="end">active가 된 시각</text>
  </g>
</svg>
