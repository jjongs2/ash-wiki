<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 230" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 패킷과 MAC 프레임 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M110 44 V36 H644 V44" />
    <path d="M254 72 V64 H644 V72" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="377" y="28">패킷: 프리앰블과 SFD를 붙여 물리 계층에 맞게 부호화</text>
    <text x="449" y="56">MAC 프레임</text>
  </g>

  <!-- 프레임의 필드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="110" y="80" width="100" height="28" rx="2" />
    <rect x="214" y="80" width="36" height="28" rx="2" />
    <rect x="254" y="80" width="76" height="28" rx="2" />
    <rect x="334" y="80" width="76" height="28" rx="2" />
    <rect x="414" y="80" width="66" height="28" rx="2" />
    <rect x="484" y="80" width="116" height="28" rx="2" />
    <rect x="604" y="80" width="40" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="98">프리앰블</text>
    <text x="232" y="98">SFD</text>
    <text x="292" y="98">목적지 주소</text>
    <text x="372" y="98">출발지 주소</text>
    <text x="447" y="98">길이/타입</text>
    <text x="542" y="98">데이터와 패드</text>
    <text x="624" y="98">FCS</text>
  </g>

  <!-- 100BASE-X의 SSD와 ESD -->
  <text x="20" y="158" fill="var(--text, #727981)">100BASE-X</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="154" y="140" width="56" height="28" rx="2" />
    <rect x="214" y="140" width="36" height="28" rx="2" />
    <rect x="254" y="140" width="390" height="28" rx="2" />
  </g>
  <g fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5">
    <rect x="110" y="140" width="40" height="28" rx="2" />
    <rect x="648" y="140" width="40" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="182" y="158">프리앰블</text>
    <text x="232" y="158">SFD</text>
    <text x="449" y="158">MAC 프레임</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="130" y="158">SSD</text>
    <text x="668" y="158">ESD</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="186">/J/K/</text>
    <text x="668" y="186">/T/R/</text>
  </g>
  <text x="110" y="210" fill="var(--text, #727981)">프리앰블의 첫 8비트를 SSD로 바꾼다.</text>
</svg>
