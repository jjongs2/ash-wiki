<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 230" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 패킷과 MAC 프레임 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 44 V36 H446 V44" />
    <path d="M144 72 V64 H446 V72" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="233" y="28">패킷: 프리앰블과 SFD를 붙여 물리 계층에 맞게 부호화</text>
    <text x="295" y="56">MAC 프레임</text>
  </g>

  <!-- 프레임의 필드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="80" width="84" height="28" />
    <rect x="108" y="80" width="32" height="28" />
    <rect x="144" y="80" width="62" height="28" />
    <rect x="210" y="80" width="62" height="28" />
    <rect x="276" y="80" width="52" height="28" />
    <rect x="332" y="80" width="76" height="28" />
    <rect x="412" y="80" width="34" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="62" y="98">프리앰블</text>
    <text x="124" y="98">SFD</text>
    <text x="175" y="98">목적지 주소</text>
    <text x="241" y="98">출발지 주소</text>
    <text x="302" y="98">길이/타입</text>
    <text x="370" y="98">데이터와 패드</text>
    <text x="429" y="98">FCS</text>
  </g>

  <!-- 위 줄 프리앰블의 앞부분을 SSD가 대신한다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="109" x2="20" y2="139" />
    <line x1="52" y1="109" x2="52" y2="139" />
  </g>

  <!-- 100BASE-X의 SSD와 ESD -->
  <text x="60" y="132" fill="var(--text, #727981)">100BASE-X</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="52" y="140" width="52" height="28" />
    <rect x="108" y="140" width="32" height="28" />
    <rect x="144" y="140" width="302" height="28" />
  </g>
  <g fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5">
    <rect x="20" y="140" width="32" height="28" />
    <rect x="450" y="140" width="34" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="78" y="158">프리앰블</text>
    <text x="124" y="158">SFD</text>
    <text x="295" y="158">MAC 프레임</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="36" y="158">SSD</text>
    <text x="467" y="158">ESD</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="36" y="186">/J/K/</text>
    <text x="467" y="186">/T/R/</text>
  </g>
  <text x="20" y="210" fill="var(--text, #727981)">프리앰블의 첫 8비트를 SSD로 바꾼다.</text>
</svg>
