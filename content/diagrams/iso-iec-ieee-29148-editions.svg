<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 485 210" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 대체된 IEEE 문서 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="120" height="32" rx="2" />
    <rect x="152" y="40" width="120" height="32" rx="2" />
    <rect x="284" y="40" width="120" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="61">IEEE 830-1998</text>
    <text x="212" y="61">IEEE 1233-1998</text>
    <text x="344" y="61">IEEE 1362-1998</text>
  </g>

  <!-- ISO/IEC/IEEE 29148의 판 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="25" y="130" width="110" height="46" rx="2" />
    <rect x="185" y="130" width="130" height="46" rx="2" />
    <rect x="365" y="130" width="100" height="46" rx="2" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="150">2011년</text>
    <text x="80" y="167" font-size="12">첫판</text>
    <text x="250" y="150">2018년</text>
    <text x="250" y="167" font-size="12">둘째 판, 현행판</text>
    <text x="415" y="150">다음 판</text>
    <text x="415" y="167" font-size="12">개발 중</text>
  </g>
  <path d="M25 184 V192 H465 V184" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="245" y="210" font-size="12" text-anchor="middle" fill="var(--text, #727981)">ISO/IEC/IEEE 29148</text>

  <!-- 대체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M344 72 V88 H80 M212 72 V88" />
    <line x1="80" y1="72" x2="80" y2="128" marker-end="url(#arrow)" />
    <line x1="137" y1="153" x2="183" y2="153" marker-end="url(#arrow)" />
    <line x1="317" y1="153" x2="363" y2="153" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="88" y="113">대체</text>
    <text x="160" y="146" text-anchor="middle">대체</text>
  </g>
</svg>
