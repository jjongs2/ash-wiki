<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 19.5 700 161" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 대체된 IEEE 문서 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="130" height="32" rx="2" />
    <rect x="20" y="84" width="130" height="32" rx="2" />
    <rect x="20" y="128" width="130" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="61">IEEE 830-1998</text>
    <text x="85" y="105">IEEE 1233-1998</text>
    <text x="85" y="149">IEEE 1362-1998</text>
  </g>

  <!-- ISO/IEC/IEEE 29148의 판 -->
  <text x="240" y="64" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 29148</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="240" y="77" width="110" height="46" rx="2" />
    <rect x="400" y="77" width="130" height="46" rx="2" />
    <rect x="580" y="77" width="100" height="46" rx="2" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="295" y="97">2011년</text>
    <text x="295" y="114" font-size="12">첫판</text>
    <text x="465" y="97">2018년</text>
    <text x="465" y="114" font-size="12">둘째 판, 현행판</text>
    <text x="630" y="97">다음 판</text>
    <text x="630" y="114" font-size="12">개발 중</text>
  </g>

  <!-- 대체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M152 56 H176 V144 H152 M152 100 H176" />
    <line x1="176" y1="100" x2="238" y2="100" marker-end="url(#arrow)" />
    <line x1="352" y1="100" x2="398" y2="100" marker-end="url(#arrow)" />
    <line x1="532" y1="100" x2="578" y2="100" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="207" y="93">대체</text>
    <text x="375" y="93">대체</text>
  </g>
</svg>
