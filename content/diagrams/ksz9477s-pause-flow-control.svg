<svg xmlns="http://www.w3.org/2000/svg" viewBox="103.5 -0.5 605 276.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="140" y="20" width="160" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="220" y="40" text-anchor="middle" fill="var(--text, #727981)">KSZ9477S 포트</text>
  <rect x="480" y="20" width="160" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="560" y="40" text-anchor="middle" fill="var(--text, #727981)">링크 상대</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="220" y1="52" x2="220" y2="256" />
    <line x1="560" y1="52" x2="560" y2="256" />
  </g>

  <!-- 데이터 프레임 -->
  <line x1="558" y1="76" x2="222" y2="88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="72" text-anchor="middle" fill="var(--text, #727981)">데이터 프레임</text>

  <!-- 흐름 제어를 걺 -->
  <text x="212" y="116" text-anchor="end" fill="var(--text, #727981)">자원 여유가 모자람</text>
  <line x1="222" y1="120" x2="558" y2="132" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="390" y="116" text-anchor="middle" fill="var(--text, #727981)">PAUSE (최대 pause time)</text>

  <!-- 송신을 멈춘 구간 -->
  <rect x="552" y="136" width="16" height="68" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="576" y="174" fill="var(--text, #727981)">데이터 프레임 송신 멈춤</text>

  <!-- 흐름 제어를 풂 -->
  <text x="212" y="188" text-anchor="end" fill="var(--text, #727981)">자원이 풀림</text>
  <line x1="222" y1="192" x2="558" y2="204" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="390" y="188" text-anchor="middle" fill="var(--text, #727981)">흐름 제어 프레임 (pause time 0)</text>

  <line x1="558" y1="228" x2="222" y2="240" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="390" y="224" text-anchor="middle" fill="var(--text, #727981)">데이터 프레임</text>
</svg>
