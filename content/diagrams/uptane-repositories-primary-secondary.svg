<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 540 378" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Primary ECU와 secondary ECU의 검증">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 저장소와 ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="20" width="200" height="36" rx="2" />
    <rect x="340" y="20" width="200" height="36" rx="2" />
    <rect x="190" y="150" width="200" height="48" rx="2" />
    <rect x="60" y="280" width="200" height="48" rx="2" />
    <rect x="320" y="280" width="200" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="43">Image repository</text>
    <text x="440" y="43">Director repository</text>
    <text x="290" y="170">Primary ECU</text>
    <text x="290" y="188" font-size="12">받아 검증</text>
    <text x="160" y="300">Secondary ECU</text>
    <text x="160" y="318" font-size="12">설치 전에 스스로 검증</text>
    <text x="420" y="300">Secondary ECU</text>
    <text x="420" y="318" font-size="12">설치 전에 스스로 검증</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M140 58 V174 H188" marker-end="url(#arrow)" />
    <path d="M440 58 V174 H392" marker-end="url(#arrow)" />
    <path d="M290 200 V240 H160 V278" marker-end="url(#arrow)" />
    <path d="M290 240 H420 V278" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="148" y="110">이미지와 메타데이터</text>
    <text x="432" y="110" text-anchor="end">지시를 담은 메타데이터</text>
    <text x="290" y="262" text-anchor="middle">메타데이터, 이미지</text>
    <text x="290" y="356" text-anchor="middle">Uptane Standard 2.1.0</text>
  </g>
</svg>
