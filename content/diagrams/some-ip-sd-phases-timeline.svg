<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.25 -4 528 211.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="단계마다 메시지를 보내는 간격">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 -->
  <rect x="20" y="16" width="128" height="32" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="84" y="37" text-anchor="middle" fill="var(--text, #727981)">초기 대기 단계</text>
  <rect x="152" y="16" width="140" height="32" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="222" y="37" text-anchor="middle" fill="var(--text, #727981)">반복 단계</text>
  <rect x="296" y="16" width="212" height="32" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="402" y="37" text-anchor="middle" fill="var(--text, #727981)">주 단계</text>

  <!-- 시간 축 -->
  <line x1="20" y1="120" x2="508" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="508" y="110" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 보내는 메시지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="150" y1="120" x2="150" y2="80" marker-end="url(#arrow)" />
    <line x1="198" y1="120" x2="198" y2="80" marker-end="url(#arrow)" />
    <line x1="294" y1="120" x2="294" y2="80" marker-end="url(#arrow)" />
    <line x1="384" y1="120" x2="384" y2="80" marker-end="url(#arrow)" />
    <line x1="474" y1="120" x2="474" y2="80" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="150" y="70">메시지</text>
    <text x="198" y="70">메시지</text>
    <text x="294" y="70">메시지</text>
    <text x="384" y="70">OfferService</text>
    <text x="474" y="70">OfferService</text>
  </g>

  <!-- 간격: 이름표는 각 간격 화살표 바로 아래 가운데 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="22" y1="138" x2="148" y2="138" />
    <line x1="152" y1="138" x2="196" y2="138" />
    <line x1="200" y1="138" x2="292" y2="138" />
    <line x1="296" y1="138" x2="382" y2="138" />
    <line x1="386" y1="138" x2="472" y2="138" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="85" y="156">임의 시간</text>
    <text x="85" y="172">INITIAL_DELAY_</text>
    <text x="85" y="188">MIN~MAX</text>
    <text x="174" y="156">REPETITIONS_</text>
    <text x="174" y="172">BASE_DELAY</text>
    <text x="246" y="156">앞 간격의</text>
    <text x="246" y="172">두 배</text>
    <text x="339" y="156">CYCLIC_</text>
    <text x="339" y="172">OFFER_DELAY</text>
    <text x="429" y="156">CYCLIC_</text>
    <text x="429" y="172">OFFER_DELAY</text>
  </g>
</svg>
