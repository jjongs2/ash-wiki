<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 4 730.5 207" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 단계 -->
  <rect x="20" y="16" width="178" height="32" rx="4" fill="#336fb8" />
  <text x="109" y="37" text-anchor="middle" fill="#f8fafd">초기 대기 단계</text>
  <rect x="202" y="16" width="176" height="32" rx="4" fill="#b0540d" />
  <text x="290" y="37" text-anchor="middle" fill="#f8fafd">반복 단계</text>
  <rect x="382" y="16" width="318" height="32" rx="4" fill="#337b47" />
  <text x="541" y="37" text-anchor="middle" fill="#f8fafd">주 단계</text>

  <!-- 시간 축 -->
  <line x1="20" y1="120" x2="698" y2="120" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="706" y="124" font-size="12" fill="#727981">시간</text>

  <!-- 보내는 메시지 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="200" y1="120" x2="200" y2="80" marker-end="url(#arrow)" />
    <line x1="260" y1="120" x2="260" y2="80" marker-end="url(#arrow)" />
    <line x1="380" y1="120" x2="380" y2="80" marker-end="url(#arrow)" />
    <line x1="500" y1="120" x2="500" y2="80" marker-end="url(#arrow)" />
    <line x1="620" y1="120" x2="620" y2="80" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="200" y="70">메시지</text>
    <text x="260" y="70">메시지</text>
    <text x="380" y="70">메시지</text>
    <text x="500" y="70">OfferService</text>
    <text x="620" y="70">OfferService</text>
  </g>

  <!-- 간격 -->
  <g stroke="#727981" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="22" y1="138" x2="198" y2="138" />
    <line x1="202" y1="138" x2="258" y2="138" />
    <line x1="262" y1="138" x2="378" y2="138" />
    <line x1="382" y1="138" x2="498" y2="138" />
    <line x1="502" y1="138" x2="618" y2="138" />
  </g>
  <line x1="230" y1="142" x2="230" y2="184" stroke="#727981" stroke-width="1" />
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="110" y="156">임의 시간</text>
    <text x="110" y="174">INITIAL_DELAY_MIN~MAX</text>
    <text x="230" y="198">REPETITIONS_BASE_DELAY</text>
    <text x="320" y="156">앞 간격의 두 배</text>
    <text x="440" y="156">CYCLIC_OFFER_DELAY</text>
    <text x="560" y="174">CYCLIC_OFFER_DELAY</text>
  </g>
</svg>
