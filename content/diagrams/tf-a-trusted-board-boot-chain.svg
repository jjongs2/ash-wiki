<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 -2 480 338" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 신뢰의 기점 -->
  <rect x="28" y="18" width="364" height="72" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="30" width="140" height="48" rx="2" />
    <rect x="200" y="30" width="180" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="59">ROTPK 해시</text>
    <text x="290" y="50">BL1</text>
    <text x="290" y="68" font-size="12">ROM, 바꿀 수 없다고 가정</text>
  </g>

  <!-- BL2 -->
  <rect x="210" y="150" width="160" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="290" y="173" text-anchor="middle" fill="var(--text, #727981)">BL2</text>

  <!-- 나머지 이미지 -->
  <rect x="28" y="228" width="364" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="240" width="110" height="36" rx="2" />
    <rect x="155" y="240" width="110" height="36" rx="2" />
    <rect x="270" y="240" width="110" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="263">BL31</text>
    <text x="210" y="263">BL32</text>
    <text x="325" y="263">BL33</text>
  </g>

  <!-- 검증과 제어 넘김 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="290" y1="80" x2="290" y2="148" marker-end="url(#arrow)" />
    <path d="M110 78 V114 H290" />
    <line x1="290" y1="188" x2="290" y2="226" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="404" y="58">신뢰의 기점</text>
    <text x="404" y="262">나머지 이미지</text>
    <text x="300" y="112">ROTPK 해시로 BL2 인증서 검증</text>
    <text x="300" y="128">BL2 해시 확인 뒤 제어 넘김</text>
    <text x="300" y="211">인증서 사슬로 확인</text>
    <text x="210" y="316" text-anchor="middle">TF-A Trusted Board Boot</text>
  </g>
</svg>
