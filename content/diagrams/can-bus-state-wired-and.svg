<svg xmlns="http://www.w3.org/2000/svg" viewBox="80.5 10 369.5 229" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <text x="126" y="45" text-anchor="end" fill="var(--text, #727981)">노드 1</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="140.75" y="20.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="220.75" y="20.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="300.75" y="20.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="380.75" y="20.75" width="58.5" height="38.5" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="45">D</text><text x="250" y="45">D</text><text x="330" y="45">R</text><text x="410" y="45">R</text>
  </g>
  <text x="126" y="95" text-anchor="end" fill="var(--text, #727981)">노드 2</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="140.75" y="70.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="220.75" y="70.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="300.75" y="70.75" width="58.5" height="38.5" fill="var(--surface, none)" />
    <rect x="380.75" y="70.75" width="58.5" height="38.5" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="95">D</text><text x="250" y="95">R</text><text x="330" y="95">D</text><text x="410" y="95">R</text>
  </g>

  <!-- 버스 -->
  <line x1="140" y1="126" x2="440" y2="126" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="126" y="165" text-anchor="end" fill="var(--text, #727981)">버스</text>
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="140.75" y="140.75" width="58.5" height="38.5" />
    <rect x="220.75" y="140.75" width="58.5" height="38.5" />
    <rect x="300.75" y="140.75" width="58.5" height="38.5" />
    <rect x="380.75" y="140.75" width="58.5" height="38.5" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="170" y="165">D</text><text x="250" y="165">D</text><text x="330" y="165">D</text><text x="410" y="165">R</text>
  </g>

  <!-- 범례 -->
  <text x="140" y="208" font-size="12" fill="var(--text, #727981)">D: dominant (논리 0) · R: recessive (논리 1)</text>
  <text x="140" y="228" font-size="12" fill="var(--text, #727981)">중재 모드에서 한 노드라도 D를 내면 버스는 D가 된다.</text>
</svg>
