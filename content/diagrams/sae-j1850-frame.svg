<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 444 103" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="J1850 프레임의 구성">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 프레임의 부분 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="40" height="60" />
    <rect x="64" y="20" width="70" height="60" />
    <rect x="138" y="20" width="70" height="60" />
    <rect x="212" y="20" width="70" height="60" />
    <rect x="286" y="20" width="40" height="60" />
    <rect x="330.75" y="20.75" width="68.5" height="58.5" stroke-dasharray="5 4" />
    <rect x="404" y="20" width="40" height="60" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="40" y="54">SOF</text>
    <text x="99" y="38">헤더</text>
    <text x="99" y="54">1바이트나</text>
    <text x="99" y="70">3바이트</text>
    <text x="173" y="46">데이터</text>
    <text x="173" y="62">0~8바이트</text>
    <text x="247" y="46">CRC나</text>
    <text x="247" y="62">체크섬</text>
    <text x="306" y="54">EOD</text>
    <text x="365" y="38">in-frame</text>
    <text x="365" y="54">response</text>
    <text x="365" y="70">선택 사항</text>
    <text x="424" y="54">EOF</text>
  </g>

  <text x="20" y="102" fill="var(--text, #727981)">Freescale AN1212에 따른 J1850 프레임. SOF, EOD, EOF는 구분자다.</text>
</svg>
