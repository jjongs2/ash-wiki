<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.5 10 441 374.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="recovery block의 실행 흐름">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 들어오는 선과 recovery point -->
  <line x1="200" y1="20" x2="200" y2="48" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <circle cx="200" cy="30" r="4" fill="var(--ink, #727981)" />
  <text x="212" y="34" font-size="12" fill="var(--text, #727981)">recovery point</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="110" y="50" width="180" height="36" rx="2" />
    <rect x="120" y="116" width="160" height="36" rx="2" />
    <path d="M200 182 L290 212 L200 242 L110 212 Z" />
    <rect x="330" y="194" width="150" height="36" rx="2" />
    <rect x="80" y="272" width="240" height="36" rx="2" />
    <rect x="120" y="338" width="160" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="200" y="73">primary alternate 실행</text>
    <text x="200" y="139">acceptance test</text>
    <text x="200" y="216" font-size="12">마지막 alternate인가</text>
    <text x="405" y="217">recovery block 실패</text>
    <text x="200" y="295">상태를 recovery point로 되돌림</text>
    <text x="200" y="361">다음 alternate 실행</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="86" x2="200" y2="114" />
    <line x1="280" y1="134" x2="378" y2="134" />
    <line x1="200" y1="152" x2="200" y2="180" />
    <line x1="290" y1="212" x2="328" y2="212" />
    <line x1="200" y1="242" x2="200" y2="270" />
    <line x1="200" y1="308" x2="200" y2="336" />
    <path d="M120 356 H60 V134 H118" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="329" y="126" text-anchor="middle">통과</text>
    <text x="208" y="170">통과하지 못함</text>
    <text x="309" y="204" text-anchor="middle">예</text>
    <text x="208" y="260">아니요</text>
  </g>
</svg>
