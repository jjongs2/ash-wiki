<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -1.5 870 131.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">Avizienis 외(2004)</text>

  <!-- 틀: 구성 요소, 그 구성 요소를 포함하는 시스템, 서비스를 받는 다른 시스템 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="30" width="304" height="90" rx="2" />
    <rect x="360" y="30" width="304" height="90" rx="2" />
    <rect x="700" y="30" width="170" height="90" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="172" y="50">구성 요소</text>
    <text x="512" y="50">구성 요소를 포함하는 시스템</text>
    <text x="785" y="50">서비스를 받는 다른 시스템</text>
  </g>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="64" width="60" height="36" rx="2" />
    <rect x="142" y="64" width="60" height="36" rx="2" />
    <rect x="252" y="64" width="60" height="36" rx="2" />
    <rect x="372" y="64" width="60" height="36" rx="2" />
    <rect x="482" y="64" width="60" height="36" rx="2" />
    <rect x="592" y="64" width="60" height="36" rx="2" />
    <rect x="729" y="64" width="112" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="62" y="87">fault</text>
    <text x="172" y="87">error</text>
    <text x="282" y="87">failure</text>
    <text x="402" y="87">fault</text>
    <text x="512" y="87">error</text>
    <text x="622" y="87">failure</text>
    <text x="785" y="87">external fault</text>
  </g>

  <!-- 화살표 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="92" y1="82" x2="140" y2="82" />
    <line x1="202" y1="82" x2="250" y2="82" />
    <line x1="312" y1="82" x2="370" y2="82" />
    <line x1="432" y1="82" x2="480" y2="82" />
    <line x1="542" y1="82" x2="590" y2="82" />
    <line x1="652" y1="82" x2="727" y2="82" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="117" y="74">활성화</text>
    <text x="227" y="74">전파</text>
    <text x="457" y="74">활성화</text>
    <text x="567" y="74">전파</text>
  </g>
</svg>
