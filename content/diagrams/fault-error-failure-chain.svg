<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -1.5 518 261.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">Avizienis 외(2004)</text>

  <!-- 틀: 구성 요소(위), 그 구성 요소를 포함하는 시스템과 서비스를 받는 다른 시스템(아래) -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="30" width="292" height="90" rx="2" />
    <rect x="20" y="160" width="292" height="90" rx="2" />
    <rect x="348" y="160" width="170" height="90" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="166" y="50">구성 요소</text>
    <text x="166" y="180">구성 요소를 포함하는 시스템</text>
    <text x="433" y="180">서비스를 받는 다른 시스템</text>
  </g>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="64" width="60" height="36" rx="2" />
    <rect x="136" y="64" width="60" height="36" rx="2" />
    <rect x="240" y="64" width="60" height="36" rx="2" />
    <rect x="32" y="194" width="60" height="36" rx="2" />
    <rect x="136" y="194" width="60" height="36" rx="2" />
    <rect x="240" y="194" width="60" height="36" rx="2" />
    <rect x="377" y="194" width="112" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="62" y="87">fault</text>
    <text x="166" y="87">error</text>
    <text x="270" y="87">failure</text>
    <text x="62" y="217">fault</text>
    <text x="166" y="217">error</text>
    <text x="270" y="217">failure</text>
    <text x="433" y="217">external fault</text>
  </g>

  <!-- 화살표 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="92" y1="82" x2="134" y2="82" />
    <line x1="196" y1="82" x2="238" y2="82" />
    <path d="M270 100 V140 H62 V192" />
    <line x1="92" y1="212" x2="134" y2="212" />
    <line x1="196" y1="212" x2="238" y2="212" />
    <line x1="300" y1="212" x2="375" y2="212" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="114" y="74">활성화</text>
    <text x="218" y="74">전파</text>
    <text x="114" y="204">활성화</text>
    <text x="218" y="204">전파</text>
  </g>
</svg>
