<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 646 224" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CA 인증서와 최종 개체 인증서로 이은 인증 경로">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 믿을 수 있는 CA 공개 키 -->
  <rect x="20.75" y="80.75" width="128.5" height="42.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="85" y="98">믿을 수 있는</text>
    <text x="85" y="115">CA 공개 키</text>
  </g>

  <!-- 인증서 틀: CA 인증서는 0장 이상이라 윤곽 점선 -->
  <rect x="220.75" y="20.75" width="150.5" height="176.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <rect x="440.75" y="20.75" width="150.5" height="176.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="296" y="43">CA 인증서</text>
    <text x="516" y="43">최종 개체 인증서</text>
    <text x="296" y="219" font-size="12">0장 이상</text>
  </g>

  <!-- 서명된 내용 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="232.75" y="54.75" width="126.5" height="26.5" rx="2" />
    <rect x="232.75" y="122.75" width="126.5" height="26.5" rx="2" />
    <rect x="452.75" y="54.75" width="126.5" height="26.5" rx="2" />
    <rect x="452.75" y="122.75" width="126.5" height="26.5" rx="2" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="232.75" y="88.75" width="126.5" height="26.5" rx="2" />
    <rect x="452.75" y="88.75" width="126.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="296" y="73">주체</text>
    <text x="296" y="141">유효 기간</text>
    <text x="516" y="73">주체</text>
    <text x="516" y="141">유효 기간</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="296" y="107">공개 키</text>
    <text x="516" y="107">공개 키</text>
  </g>

  <!-- CA의 디지털 서명 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="232.75" y="158.75" width="126.5" height="26.5" rx="2" />
    <rect x="452.75" y="158.75" width="126.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="296" y="177">CA의 서명</text>
    <text x="516" y="177">CA의 서명</text>
  </g>

  <!-- 서명된 내용의 범위 -->
  <path d="M598 55 H604 V149 H598" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="612" y="98">서명된</text>
    <text x="612" y="114">내용</text>
  </g>

  <!-- 그 공개 키의 CA가 다음 인증서에 서명 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M151 102 H184 V172 H230" />
    <path d="M361 102 H404 V172 H450" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="202" y="134">CA가</text>
    <text x="202" y="150">서명</text>
    <text x="422" y="134">CA가</text>
    <text x="422" y="150">서명</text>
  </g>
</svg>
