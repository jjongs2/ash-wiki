<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 1 390 301" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="대칭 키 암호와 공개 키 암호의 암호화">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 대칭 키 암호 -->
  <text x="20" y="20" font-size="12" fill="var(--text, #727981)">대칭 키 암호</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="32" width="130" height="110" rx="2" />
    <rect x="260" y="32" width="130" height="110" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="54">송신자</text>
    <text x="325" y="54">수신자</text>
    <text x="85" y="128" font-size="12">암호화</text>
    <text x="325" y="128" font-size="12">복호화</text>
  </g>
  <line x1="135" y1="86" x2="275" y2="86" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="35" y="72" width="100" height="28" rx="2" />
    <rect x="275" y="72" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="85" y="91">비밀 키</text>
    <text x="325" y="91">같은 비밀 키</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="205" y="62">안전한 채널로</text>
    <text x="205" y="77">미리 나눠 가짐</text>
    <text x="205" y="116">암호문</text>
  </g>
  <line x1="150" y1="124" x2="258" y2="124" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 공개 키 암호 -->
  <text x="20" y="170" font-size="12" fill="var(--text, #727981)">공개 키 암호</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="182" width="130" height="110" rx="2" />
    <rect x="260" y="182" width="130" height="110" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="204">송신자</text>
    <text x="325" y="204">수신자</text>
    <text x="85" y="278" font-size="12">암호화</text>
    <text x="325" y="278" font-size="12">복호화</text>
  </g>
  <rect x="27" y="222" width="116" height="28" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <text x="85" y="241" text-anchor="middle" fill="var(--on-fill, #f8fafd)">수신자의 공개 키</text>
  <rect x="275" y="222" width="100" height="28" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <text x="325" y="241" text-anchor="middle" fill="var(--on-fill, #f8fafd)">개인 키</text>
  <line x1="260" y1="236" x2="145" y2="236" stroke="var(--blue, #336fb8)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="205" y="227">공개 키만 알림</text>
    <text x="205" y="266">암호문</text>
  </g>
  <line x1="150" y1="274" x2="258" y2="274" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
