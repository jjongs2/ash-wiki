<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 10 550 110" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="센서 영상을 ECU로 나르는 SerDes 링크">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 쪽 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="14" y="20" width="218" height="90" rx="2" />
    <rect x="320" y="20" width="224" height="90" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="24" y="36">센서 쪽</text>
    <text x="330" y="36">ECU 쪽</text>
  </g>

  <!-- 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="24" y="56" width="84" height="36" rx="2" />
    <rect x="146" y="56" width="76" height="36" rx="2" />
    <rect x="330" y="56" width="90" height="36" rx="2" />
    <rect x="458" y="56" width="76" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="66" y="79">이미지 센서</text>
    <text x="184" y="79">직렬화기</text>
    <text x="375" y="79">역직렬화기</text>
    <text x="496" y="79">프로세서</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="108" y1="74" x2="144" y2="74" />
    <line x1="222" y1="74" x2="328" y2="74" />
    <line x1="420" y1="74" x2="456" y2="74" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="127" y="66">CSI-2</text>
    <text x="439" y="66">CSI-2</text>
    <text x="276" y="66">케이블 한 가닥</text>
    <text x="276" y="92">동축이나</text>
    <text x="276" y="106">차폐 꼬임쌍선</text>
  </g>
</svg>
