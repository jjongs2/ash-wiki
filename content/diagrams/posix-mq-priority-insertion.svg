<svg xmlns="http://www.w3.org/2000/svg" viewBox="49 -4 474 176.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- mq_send가 넣는 자리 -->
  <text x="375" y="18" text-anchor="middle" fill="var(--text, #727981)">mq_send</text>
  <line x1="375" y1="26" x2="375" y2="58" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 큐 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150" y="60" width="90" height="56" />
    <rect x="240" y="60" width="90" height="56" />
    <rect x="420" y="60" width="90" height="56" />
  </g>
  <rect x="330.75" y="60.75" width="88.5" height="54.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="195" y="77">msg_prio가</text>
    <text x="285" y="77">msg_prio가</text>
    <text x="465" y="77">msg_prio가</text>
    <text x="195" y="91">새 메시지보다</text>
    <text x="285" y="91">새 메시지와</text>
    <text x="465" y="91">새 메시지보다</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="195" y="107">큼</text>
    <text x="285" y="107">같음</text>
    <text x="465" y="107">작음</text>
  </g>
  <text x="375" y="93" text-anchor="middle" fill="var(--on-fill, #f8fafd)">새 메시지</text>

  <!-- mq_receive가 꺼내는 쪽 -->
  <line x1="150" y1="88" x2="62" y2="88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="104" y="78" text-anchor="middle" fill="var(--text, #727981)">mq_receive</text>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="150" y="134">큐의 앞</text>
    <text x="510" y="134" text-anchor="end">뒤</text>
    <text x="330" y="158" text-anchor="middle">msg_prio 값이 큰 메시지가 앞에, 값이 같으면 먼저 넣은 메시지가 앞에 있다</text>
  </g>
</svg>
