<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 4.5 498.5 201.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">AUTOSAR R25-11 Watchdog Driver 명세의 예</text>
  <circle cx="292" cy="20" r="4" fill="var(--ink, #727981)" />
  <text x="302" y="24" fill="var(--text, #727981)">트리거</text>

  <!-- 모드 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="78" font-size="14">Window mode</text>
    <text x="20" y="96">Fast-Mode의 예</text>
    <text x="20" y="178" font-size="14">Toggle mode</text>
    <text x="20" y="196">Slow-Mode의 예</text>
  </g>

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="80" x2="470" y2="80" />
    <line x1="130" y1="180" x2="470" y2="180" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="478" y="84">시간</text>
    <text x="478" y="184">시간</text>
  </g>

  <!-- window mode -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="72" x2="130" y2="88" />
    <line x1="450" y1="72" x2="450" y2="88" />
  </g>
  <rect x="250" y="70" width="135" height="20" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="250" y="60">최소 경계</text>
    <text x="385" y="60">최대 경계</text>
  </g>
  <circle cx="318" cy="80" r="4" fill="var(--ink, #727981)" />
  <line x1="131" y1="108" x2="449" y2="108" stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)" />
  <text x="290" y="124" text-anchor="middle" fill="var(--text, #727981)">timeout 주기</text>

  <!-- toggle mode -->
  <text x="300" y="164" text-anchor="middle" fill="var(--text, #727981)">트리거 시점에 제약 없음</text>
  <g fill="var(--ink, #727981)">
    <circle cx="167" cy="180" r="4" />
    <circle cx="265" cy="180" r="4" />
    <circle cx="298" cy="180" r="4" />
    <circle cx="405" cy="180" r="4" />
  </g>
</svg>
