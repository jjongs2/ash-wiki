<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 12.5 529 153.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--red, #bb464d)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- time frame은 175. 도착은 x=150(수행), 220(이른 도착), 395(수행). 수행하지 않은 도착은 time frame을 새로 시작하지 않는다 -->

  <!-- 시간 축 -->
  <line x1="130" y1="100" x2="590" y2="100" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="598" y="104" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 도착 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="52" x2="150" y2="98" />
    <line x1="395" y1="52" x2="395" y2="98" />
  </g>
  <line x1="220" y1="52" x2="220" y2="98" stroke="var(--red, #bb464d)" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="150" y="42">도착</text>
    <text x="220" y="42">이른 도착</text>
    <text x="395" y="42">도착</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="230" y="68">수행하지 않고 protection hook</text>
    <text x="230" y="84">E_OS_PROTECTION_ARRIVAL</text>
  </g>

  <!-- time frame -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="325" y1="100" x2="325" y2="130" />
    <line x1="570" y1="100" x2="570" y2="130" />
    <line x1="150" y1="100" x2="150" y2="130" />
    <line x1="395" y1="100" x2="395" y2="130" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="151" y1="126" x2="324" y2="126" />
    <line x1="396" y1="126" x2="569" y2="126" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="237.5" y="146">time frame</text>
    <text x="482.5" y="146">time frame</text>
  </g>
</svg>
