<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 12.5 531 190" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">ISO/IEC 9899:2024의 정의</text>

  <g transform="translate(0 24)">
  <!-- 미정의 동작: 미지정 동작과 겹치지 않음 -->
  <rect x="20" y="20" width="151" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95.5" y="85">미정의 동작</text>
    <text x="95.5" y="109" font-size="12">표준이 아무 요구도</text>
    <text x="95.5" y="125" font-size="12">두지 않는다</text>
  </g>

  <!-- 미지정 동작과 그 안의 구현 정의 동작 -->
  <rect x="182" y="20" width="186" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="196" y="44">미지정 동작</text>
    <text x="196" y="64" font-size="12">둘 이상의 가능성 가운데</text>
    <text x="196" y="80" font-size="12">어느 것을 고를지 더 정하지 않는다</text>
  </g>
  <rect x="194" y="94" width="162" height="62" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="275" y="113">구현 정의 동작</text>
    <text x="275" y="130" font-size="12">구현이 무엇을 골랐는지</text>
    <text x="275" y="146" font-size="12">문서로 밝힌다</text>
  </g>

  <!-- 로캘 특정 동작: 미지정 동작과 따로 정의 -->
  <rect x="379" y="20" width="151" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="454.5" y="85">로캘 특정 동작</text>
    <text x="454.5" y="109" font-size="12">지역 관례에 따라 달라지고</text>
    <text x="454.5" y="125" font-size="12">구현마다 문서로 밝힌다</text>
  </g>
  </g>
</svg>
