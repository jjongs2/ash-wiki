<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 12.5 551 172" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">ISO/IEC 9899:2024의 정의</text>

  <g transform="translate(0 24)">
  <!-- 미정의 동작: 미지정 동작과 겹치지 않음 -->
  <rect x="20" y="20" width="200" height="130" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="76">미정의 동작</text>
    <text x="120" y="100" font-size="12">표준이 아무 요구도</text>
    <text x="120" y="116" font-size="12">두지 않는다</text>
  </g>

  <!-- 미지정 동작과 그 안의 구현 정의 동작 -->
  <rect x="250" y="20" width="300" height="130" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="266" y="44">미지정 동작</text>
    <text x="266" y="64" font-size="12">둘 이상의 가능성 가운데</text>
    <text x="266" y="80" font-size="12">어느 것을 고를지 더 정하지 않는다</text>
  </g>
  <rect x="266" y="94" width="268" height="44" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="400" y="112">구현 정의 동작</text>
    <text x="400" y="129" font-size="12">구현이 무엇을 골랐는지 문서로 밝힌다</text>
  </g>
  </g>
</svg>
