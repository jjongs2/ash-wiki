<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -7 522.5 259.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="상대 sleep과 절대 시각의 주기 활성화">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상대 sleep -->
  <text x="20" y="24" fill="var(--text, #727981)">상대 sleep: nanosleep()</text>
  <text x="195" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주기 <tspan font-style="italic">T</tspan></text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="62" y1="50" x2="328" y2="50" />
    <line x1="62" y1="45" x2="62" y2="55" />
    <line x1="328" y1="45" x2="328" y2="55" />
    <line x1="330" y1="56" x2="330" y2="90" stroke-dasharray="3 3" />
  </g>
  <rect x="60.75" y="60.75" width="53.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="87.5" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <rect x="115.75" y="60.75" width="53.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="142.5" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점됨</text>
  <line x1="172" y1="76" x2="408" y2="76" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="250" y="69" text-anchor="middle" font-size="12" fill="var(--text, #727981)">계산한 간격만큼 멈춤</text>
  <rect x="410.75" y="60.75" width="48.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="435" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <line x1="40" y1="90" x2="474" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="482" y="94" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M90 93 L95 103 L85 103 z" />
    <path d="M170 93 L175 103 L165 103 z" />
    <path d="M330 93 L335 103 L325 103 z" />
    <path d="M410 93 L415 103 L405 103 z" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="120">지금 시각 읽음</text>
    <text x="170" y="120">nanosleep()</text>
    <text x="330" y="120">다음 활성화 시각</text>
    <text x="410" y="120">늦게 깨어남</text>
  </g>

  <!-- 절대 시각 sleep -->
  <text x="20" y="160" fill="var(--text, #727981)">절대 시각: clock_nanosleep()</text>
  <rect x="60.75" y="170.75" width="53.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="87.5" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <rect x="115.75" y="170.75" width="53.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="142.5" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점됨</text>
  <line x1="172" y1="186" x2="328" y2="186" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="250" y="179" text-anchor="middle" font-size="12" fill="var(--text, #727981)">원하는 시각까지 멈춤</text>
  <rect x="330.75" y="170.75" width="48.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="355" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <line x1="40" y1="200" x2="474" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="482" y="204" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M170 203 L175 213 L165 213 z" />
    <path d="M330 203 L335 213 L325 213 z" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="230">clock_nanosleep()</text>
    <text x="330" y="230">다음 활성화 시각</text>
  </g>
</svg>
