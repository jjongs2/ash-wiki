<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -7 696 259.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상대 sleep -->
  <text x="20" y="24" fill="var(--text, #727981)">상대 sleep: nanosleep()</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주기 <tspan font-style="italic">T</tspan></text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="62" y1="50" x2="458" y2="50" />
    <line x1="62" y1="45" x2="62" y2="55" />
    <line x1="458" y1="45" x2="458" y2="55" />
    <line x1="460" y1="56" x2="460" y2="90" stroke-dasharray="3 3" />
  </g>
  <rect x="60.75" y="60.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="100" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <rect x="140.75" y="60.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="180" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점됨</text>
  <line x1="222" y1="76" x2="558" y2="76" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="390" y="69" text-anchor="middle" font-size="12" fill="var(--text, #727981)">계산한 간격만큼 멈춤</text>
  <rect x="560.75" y="60.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="590" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <line x1="40" y1="90" x2="648" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="656" y="94" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M120 93 L125 103 L115 103 z" />
    <path d="M220 93 L225 103 L215 103 z" />
    <path d="M460 93 L465 103 L455 103 z" />
    <path d="M560 93 L565 103 L555 103 z" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="120">지금 시각 읽음</text>
    <text x="220" y="120">nanosleep()</text>
    <text x="460" y="120">다음 활성화 시각</text>
    <text x="560" y="120">늦게 깨어남</text>
  </g>

  <!-- 절대 시각 sleep -->
  <text x="20" y="160" fill="var(--text, #727981)">절대 시각: clock_nanosleep()</text>
  <rect x="60.75" y="170.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="100" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <rect x="140.75" y="170.75" width="78.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="180" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점됨</text>
  <line x1="222" y1="186" x2="458" y2="186" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="340" y="179" text-anchor="middle" font-size="12" fill="var(--text, #727981)">원하는 시각까지 멈춤</text>
  <rect x="460.75" y="170.75" width="58.5" height="22.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="490" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실행</text>
  <line x1="40" y1="200" x2="648" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="656" y="204" font-size="12" fill="var(--text, #727981)">시간</text>
  <g fill="var(--ink, #727981)">
    <path d="M220 203 L225 213 L215 213 z" />
    <path d="M460 203 L465 213 L455 213 z" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="220" y="230">clock_nanosleep()</text>
    <text x="460" y="230">다음 활성화 시각</text>
  </g>
</svg>
