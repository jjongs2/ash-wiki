<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 413" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="talker에서 listener까지의 예약 과정">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 역할 -->
  <rect x="20.75" y="20.75" width="108.5" height="32.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <rect x="200.75" y="20.75" width="108.5" height="32.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <rect x="380.75" y="20.75" width="108.5" height="32.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g font-size="14" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="75" y="42">talker</text>
    <text x="255" y="42">브리지</text>
    <text x="435" y="42">listener</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="75" y1="54" x2="75" y2="396" />
    <line x1="255" y1="54" x2="255" y2="98" />
    <line x1="255" y1="124" x2="255" y2="220" />
    <line x1="255" y1="282" x2="255" y2="396" />
    <line x1="435" y1="54" x2="435" y2="396" />
  </g>

  <!-- talker 선언 -->
  <g stroke="var(--violet, #825da9)" stroke-width="1.5" marker-end="url(#arrow-violet)">
    <line x1="75" y1="86" x2="253" y2="86" />
    <line x1="255" y1="150" x2="433" y2="150" />
  </g>
  <rect x="185" y="98" width="140" height="26" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="165" y="79">Talker Advertise</text>
    <text x="255" y="115">등록하고 일부 정보를 고침</text>
    <text x="345" y="143">Talker Advertise</text>
    <text x="345" y="168" font-size="11">자원이 모자라면 Talker Failed</text>
  </g>

  <!-- listener 선언 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="435" y1="205" x2="257" y2="205" />
    <line x1="255" y1="312" x2="77" y2="312" />
  </g>
  <rect x="180" y="220" width="150" height="62" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="345" y="198">Listener Ready</text>
    <text x="255" y="240">StreamID로 짝지음</text>
    <text x="255" y="256">대역폭 예약</text>
    <text x="255" y="272">큐·필터링 데이터베이스 설정</text>
    <text x="165" y="305">Listener Ready</text>
    <text x="165" y="328" font-size="11">자원이 모자라면</text>
    <text x="165" y="342" font-size="11">Listener Asking Failed</text>
  </g>

  <!-- 스트림 -->
  <line x1="75" y1="376" x2="433" y2="376" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="165" y="369" text-anchor="middle" fill="var(--text, #727981)">스트림 전송 시작</text>
</svg>
