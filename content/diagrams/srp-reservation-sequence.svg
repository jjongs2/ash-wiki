<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 407" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 역할 -->
  <rect x="20.75" y="20.75" width="138.5" height="32.5" rx="4" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <rect x="260.75" y="20.75" width="138.5" height="32.5" rx="4" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <rect x="500.75" y="20.75" width="138.5" height="32.5" rx="4" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g font-size="14" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="90" y="42">talker</text>
    <text x="330" y="42">브리지</text>
    <text x="570" y="42">listener</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="90" y1="54" x2="90" y2="390" />
    <line x1="330" y1="54" x2="330" y2="98" />
    <line x1="330" y1="124" x2="330" y2="220" />
    <line x1="330" y1="282" x2="330" y2="390" />
    <line x1="570" y1="54" x2="570" y2="390" />
  </g>

  <!-- talker 선언 -->
  <g stroke="var(--violet, #825da9)" stroke-width="1.5" marker-end="url(#arrow-violet)">
    <line x1="90" y1="86" x2="328" y2="86" />
    <line x1="330" y1="150" x2="568" y2="150" />
  </g>
  <rect x="245" y="98" width="170" height="26" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="79">Talker Advertise</text>
    <text x="330" y="115">등록하고 일부 정보를 고침</text>
    <text x="450" y="143">Talker Advertise</text>
    <text x="450" y="168" font-size="11">자원이 모자라면 Talker Failed</text>
  </g>

  <!-- listener 선언 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="570" y1="205" x2="332" y2="205" />
    <line x1="330" y1="312" x2="92" y2="312" />
  </g>
  <rect x="235" y="220" width="190" height="62" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="450" y="198">Listener Ready</text>
    <text x="330" y="240">StreamID로 짝지음</text>
    <text x="330" y="256">대역폭 예약</text>
    <text x="330" y="272">큐·필터링 데이터베이스 설정</text>
    <text x="210" y="305">Listener Ready</text>
    <text x="210" y="330" font-size="11">자원이 모자라면 Listener Asking Failed</text>
  </g>

  <!-- 스트림 -->
  <line x1="90" y1="370" x2="568" y2="370" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="210" y="363" text-anchor="middle" fill="var(--text, #727981)">스트림 전송 시작</text>
</svg>
