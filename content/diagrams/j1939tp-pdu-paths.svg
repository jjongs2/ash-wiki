<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 10 380 326" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="J1939Tp를 거치는 PGN과 거치지 않는 I-PDU">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="20" width="360" height="36" rx="2" />
    <rect x="140" y="110" width="140" height="36" rx="2" />
    <rect x="140" y="200" width="360" height="36" rx="2" />
    <rect x="140" y="290" width="360" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="43">PduR</text>
    <text x="210" y="133">J1939Tp</text>
    <text x="320" y="223">L-SDU Router</text>
    <text x="320" y="313">CanIf</text>
  </g>

  <!-- 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="210" y1="58" x2="210" y2="108" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="210" y1="148" x2="210" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="430" y1="58" x2="430" y2="198" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="320" y1="238" x2="320" y2="288" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="218" y="88">8바이트보다 긴 PGN</text>
    <text x="422" y="122" text-anchor="end">8바이트를 넘지 않는</text>
    <text x="422" y="140" text-anchor="end">I-PDU</text>
  </g>
</svg>
