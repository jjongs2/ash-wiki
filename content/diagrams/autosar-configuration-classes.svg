<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 526 194" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 빌드 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="16" y="20" width="90" height="36" rx="2" />
    <rect x="150" y="20" width="90" height="36" rx="2" />
    <rect x="284" y="20" width="90" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="61" y="43">소스 코드</text>
    <text x="195" y="43">오브젝트 코드</text>
    <text x="329" y="43">실행 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="106" y1="38" x2="149" y2="38" />
    <line x1="240" y1="38" x2="283" y2="38" />
    <line x1="374" y1="38" x2="409" y2="38" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="128" y="30">컴파일</text>
    <text x="262" y="30">링크</text>
  </g>

  <!-- ECU 메모리와 따로 둔 설정 데이터 구역 -->
  <rect x="410" y="20" width="100" height="144" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="460" y="43" text-anchor="middle" fill="var(--text, #727981)">ECU 메모리</text>
  <rect x="418" y="96" width="84" height="54" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="460" y="119.5">post-build</text>
    <text x="460" y="134.5">설정 데이터</text>
  </g>

  <!-- 설정 클래스마다 설정이 들어가는 자리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="83" y="96" width="90" height="54" rx="2" />
    <rect x="220" y="96" width="84" height="54" rx="2" />
    <rect x="316" y="96" width="84" height="54" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="128" y="127">#define 설정</text>
    <text x="262" y="112">다른</text>
    <text x="262" y="127">오브젝트 파일</text>
    <text x="262" y="142">링커 옵션</text>
    <text x="358" y="127">설정 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="128" y1="96" x2="128" y2="39" />
    <line x1="262" y1="96" x2="262" y2="39" />
    <line x1="400" y1="123" x2="417" y2="123" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="128" y="172">pre-compile time</text>
    <text x="262" y="172">link time</text>
    <text x="358" y="172">post-build time</text>
  </g>
</svg>
