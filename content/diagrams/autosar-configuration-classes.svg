<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 526 182" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 빌드 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="16" y="20" width="84" height="36" rx="2" />
    <rect x="144" y="20" width="100" height="36" rx="2" />
    <rect x="288" y="20" width="84" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="58" y="43">소스 코드</text>
    <text x="194" y="43">오브젝트 코드</text>
    <text x="330" y="43">실행 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="38" x2="143" y2="38" />
    <line x1="244" y1="38" x2="287" y2="38" />
    <line x1="372" y1="38" x2="409" y2="38" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="122" y="30">컴파일</text>
    <text x="266" y="30">링크</text>
  </g>

  <!-- ECU 메모리와 따로 둔 설정 데이터 구역 -->
  <rect x="410" y="20" width="100" height="130" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="460" y="43" text-anchor="middle" fill="var(--text, #727981)">ECU 메모리</text>
  <rect x="418" y="96" width="84" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="460" y="112">post-build</text>
    <text x="460" y="127">설정 데이터</text>
  </g>

  <!-- 설정 클래스마다 설정이 들어가는 자리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="80" y="96" width="84" height="40" rx="2" />
    <rect x="210" y="96" width="112" height="40" rx="2" />
    <rect x="334" y="96" width="60" height="40" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="122" y="120">#define 설정</text>
    <text x="266" y="112">다른 오브젝트 파일</text>
    <text x="266" y="127">링커 옵션</text>
    <text x="364" y="120">설정 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="122" y1="96" x2="122" y2="39" />
    <line x1="266" y1="96" x2="266" y2="39" />
    <line x1="394" y1="116" x2="417" y2="116" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="122" y="158">pre-compile time</text>
    <text x="266" y="158">link time</text>
    <text x="360" y="158">post-build time</text>
  </g>
</svg>
