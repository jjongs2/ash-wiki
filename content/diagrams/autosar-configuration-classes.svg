<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 182" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 빌드 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="100" height="36" rx="2" />
    <rect x="190" y="20" width="100" height="36" rx="2" />
    <rect x="360" y="20" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="43">소스 코드</text>
    <text x="240" y="43">목적 코드</text>
    <text x="410" y="43">실행 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="38" x2="189" y2="38" />
    <line x1="290" y1="38" x2="359" y2="38" />
    <line x1="460" y1="38" x2="559" y2="38" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="30">컴파일</text>
    <text x="325" y="30">링크</text>
  </g>

  <!-- ECU 메모리와 따로 둔 설정 데이터 구역 -->
  <rect x="560" y="20" width="140" height="130" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="630" y="43" text-anchor="middle" fill="var(--text, #727981)">ECU 메모리</text>
  <rect x="575" y="96" width="110" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="630" y="112">post-build</text>
    <text x="630" y="127">설정 데이터</text>
  </g>

  <!-- 설정 클래스마다 설정이 들어가는 자리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="105" y="96" width="100" height="40" rx="2" />
    <rect x="270" y="96" width="110" height="40" rx="2" />
    <rect x="410" y="96" width="110" height="40" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="120">#define 설정</text>
    <text x="325" y="112">다른 목적 파일</text>
    <text x="325" y="127">링커 옵션</text>
    <text x="465" y="120">설정 파일</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="155" y1="96" x2="155" y2="39" />
    <line x1="325" y1="96" x2="325" y2="39" />
    <line x1="520" y1="116" x2="574" y2="116" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="158">pre-compile time</text>
    <text x="325" y="158">link time</text>
    <text x="465" y="158">post-build time</text>
  </g>
</svg>
