<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6.5 720 349" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 점대점 링크 세그먼트 -->
  <text x="20" y="24" fill="var(--text, #727981)">점대점 링크 세그먼트</text>
  <rect x="20" y="50" width="90" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="65" y="77" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <rect x="610" y="50" width="90" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="655" y="77" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <line x1="110" y1="65" x2="610" y2="65" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="110" y1="79" x2="610" y2="79" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="200.75" y="54.75" width="18.5" height="34.5" rx="2" />
    <rect x="300.75" y="54.75" width="18.5" height="34.5" rx="2" />
    <rect x="400.75" y="54.75" width="18.5" height="34.5" rx="2" />
    <rect x="500.75" y="54.75" width="18.5" height="34.5" rx="2" />
  </g>
  <path d="M210 48 V42 H510 V48" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="360" y="34" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인라인 커넥터 4개까지</text>
  <line x1="112" y1="112" x2="608" y2="112" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="360" y="132" text-anchor="middle" font-size="12" fill="var(--text, #727981)">적어도 15 m</text>

  <!-- 멀티드롭 모드의 mixing segment -->
  <text x="20" y="176" fill="var(--text, #727981)">멀티드롭 모드의 mixing segment</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="236" width="56" height="36" rx="2" />
    <rect x="86" y="196" width="56" height="36" rx="2" />
    <rect x="152" y="236" width="56" height="36" rx="2" />
    <rect x="218" y="196" width="56" height="36" rx="2" />
    <rect x="284" y="236" width="56" height="36" rx="2" />
    <rect x="350" y="196" width="56" height="36" rx="2" />
    <rect x="416" y="236" width="56" height="36" rx="2" />
    <rect x="482" y="196" width="56" height="36" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="48" y="258">PHY</text>
    <text x="114" y="218">PHY</text>
    <text x="180" y="258">PHY</text>
    <text x="246" y="218">PHY</text>
    <text x="312" y="258">PHY</text>
    <text x="378" y="218">PHY</text>
    <text x="444" y="258">PHY</text>
    <text x="510" y="218">PHY</text>
  </g>
  <!-- 스텁 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M108 232 V272 M120 232 V272" />
    <path d="M240 232 V272 M252 232 V272" />
    <path d="M372 232 V272 M384 232 V272" />
    <path d="M504 232 V272 M516 232 V272" />
  </g>
  <!-- trunk -->
  <line x1="20" y1="272" x2="538" y2="272" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="20" y1="284" x2="538" y2="284" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="556" y="218">PHY 적어도 8개</text>
    <text x="556" y="256">스텁 10 cm까지</text>
  </g>
  <line x1="550" y1="252" x2="520" y2="252" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="22" y1="302" x2="536" y2="302" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="279" y="322" text-anchor="middle" font-size="12" fill="var(--text, #727981)">trunk 적어도 25 m</text>
</svg>
