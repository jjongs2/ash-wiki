    <text x="205" y="89">메타데이터와 이미지</text>
    <text x="484" y="54">이미지</text>
    <text x="350" y="108">메타데이터와 이미지 검증</text>
    <text x="620" y="108">이미지 검증 뒤 설치</text>
    <text x="75" y="108">Uptane 표준 2.1.0</text>
