<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 716 114.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="110" height="44" rx="4" />
    <rect x="280" y="40" width="140" height="44" rx="4" />
    <path d="M556 40 V34 H696 V78 H690" fill="none" />
    <rect x="550" y="40" width="140" height="44" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="66.5">서버</text>
    <text x="350" y="66.5">primary ECU</text>
    <text x="620" y="66.5">secondary ECU</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="280" y1="54" x2="132" y2="54" />
    <line x1="130" y1="70" x2="278" y2="70" />
    <line x1="420" y1="62" x2="548" y2="62" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
