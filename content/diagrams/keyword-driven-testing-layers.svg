<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 4.5 475 320" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">ISO/IEC/IEEE 29119-5:2024</text>

  <!-- 층 틀: 중간 층만 둘 수 있는 요소라 점선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="36" width="454" height="60" rx="2" />
    <rect x="20" y="188" width="454" height="60" rx="2" />
  </g>
  <rect x="20" y="112" width="454" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="70">도메인 층</text>
    <text x="32" y="138">중간 층</text>
    <text x="32" y="154">둘 수 있음</text>
    <text x="32" y="214">테스트</text>
    <text x="32" y="230">인터페이스 층</text>
  </g>

  <!-- 키워드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="230" y="50" width="120" height="32" rx="2" />
    <rect x="118" y="202" width="80" height="32" rx="2" />
    <rect x="206" y="202" width="80" height="32" rx="2" />
    <rect x="294" y="202" width="80" height="32" rx="2" />
    <rect x="382" y="202" width="80" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="290" y="71">상위 키워드</text>
    <text x="158" y="223">하위 키워드</text>
    <text x="246" y="223">하위 키워드</text>
    <text x="334" y="223">하위 키워드</text>
    <text x="422" y="223">하위 키워드</text>
  </g>

  <!-- decomposer가 상위 키워드를 하위 키워드의 순서로 풀어낸다 -->
  <line x1="290" y1="82" x2="290" y2="186" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="300" y="138">decomposer가 하위 키워드의</text>
    <text x="300" y="154">순서로 풀어냄</text>
  </g>

  <!-- 테스트 항목 -->
  <rect x="220" y="282" width="140" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="290" y="303" text-anchor="middle" fill="var(--text, #727981)">테스트 항목</text>
  <line x1="290" y1="250" x2="290" y2="280" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="300" y="270" font-size="12" fill="var(--text, #727981)">바로 상호작용</text>
</svg>
