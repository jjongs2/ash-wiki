<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 610 199" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">CTAL-TA 강의계획서</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="110" width="100" height="48" rx="2" />
    <rect x="170" y="110" width="120" height="48" rx="2" />
    <rect x="340" y="110" width="100" height="48" rx="2" />
  </g>
  <rect x="490" y="110" width="120" height="48" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="70" y="139">확률 분포</text>
    <text x="230" y="130">입력 영역에서</text>
    <text x="230" y="148">무작위로 고름</text>
    <text x="390" y="139">테스트 실행</text>
    <text x="550" y="130">자동화된</text>
    <text x="550" y="148">테스트 오라클</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="134" x2="168" y2="134" />
    <line x1="290" y1="134" x2="338" y2="134" />
    <line x1="440" y1="134" x2="488" y2="134" />
  </g>

  <!-- 유도형: 앞서 고른 값으로 분포를 고침 -->
  <path d="M230 110 V84 H70 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="80" y="58">비유도형: 분포가 내내 그대로</text>
    <text x="80" y="76">유도형: 앞서 고른 값에 따라 분포를 고침</text>
  </g>

  <!-- 주석 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="182">확인 목적: 운용 프로파일에 바탕</text>
    <text x="20" y="198">검증 목적: 사용과 무관</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="390" y="182">종료 기준: 실행한</text>
    <text x="390" y="198">테스트 수, 테스트 시간</text>
    <text x="550" y="182">기대 결과를 더할 때</text>
  </g>
</svg>
