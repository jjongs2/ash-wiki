<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 510 199" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="확률 분포로 입력을 고르는 무작위 테스트">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">CTAL-TA 강의계획서</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="110" width="90" height="48" rx="2" />
    <rect x="140" y="110" width="110" height="48" rx="2" />
    <rect x="280" y="110" width="90" height="48" rx="2" />
  </g>
  <rect x="400" y="110" width="110" height="48" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="65" y="139">확률 분포</text>
    <text x="195" y="130">입력 영역에서</text>
    <text x="195" y="148">무작위로 고름</text>
    <text x="325" y="139">테스트 실행</text>
    <text x="455" y="130">자동화된</text>
    <text x="455" y="148">테스트 오라클</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="134" x2="138" y2="134" />
    <line x1="250" y1="134" x2="278" y2="134" />
    <line x1="370" y1="134" x2="398" y2="134" />
  </g>

  <!-- 유도형: 앞서 고른 값으로 분포를 고침 -->
  <path d="M195 110 V84 H65 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="75" y="58">비유도형: 분포가 내내 그대로</text>
    <text x="75" y="76">유도형: 앞서 고른 값에 따라 분포를 고침</text>
  </g>

  <!-- 주석 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="182">확인 목적: 운용 프로파일에 바탕</text>
    <text x="20" y="198">검증 목적: 사용과 무관</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="325" y="182">종료 기준: 실행한</text>
    <text x="325" y="198">테스트 수, 테스트 시간</text>
    <text x="455" y="182">기대 결과를 더할 때</text>
  </g>
</svg>
