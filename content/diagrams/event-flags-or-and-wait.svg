<svg xmlns="http://www.w3.org/2000/svg" viewBox="49.5 -3.5 501 210" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 설정하는 쪽 -->
  <text x="300" y="18" text-anchor="middle" font-size="12" fill="var(--text, #727981)">태스크나 인터럽트 처리기가 비트를 설정</text>
  <line x1="320" y1="24" x2="320" y2="44" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 플래그 비트 -->
  <text x="130" y="69" text-anchor="end" fill="var(--text, #727981)">플래그 묶음</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="46" width="40" height="36" />
    <rect x="220" y="46" width="40" height="36" />
    <rect x="260" y="46" width="40" height="36" />
    <rect x="340" y="46" width="40" height="36" />
    <rect x="420" y="46" width="40" height="36" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="180.75" y="46.75" width="38.5" height="34.5" />
    <rect x="300.75" y="46.75" width="38.5" height="34.5" />
    <rect x="380.75" y="46.75" width="38.5" height="34.5" />
  </g>

  <!-- 기다리는 태스크가 고른 비트 -->
  <g fill="var(--ink, #727981)">
    <path d="M240 88 L246 98 L234 98 Z" />
    <path d="M320 88 L326 98 L314 98 Z" />
    <path d="M440 88 L446 98 L434 98 Z" />
  </g>

  <!-- 범례 -->
  <rect x="140.75" y="110.75" width="12.5" height="12.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="160" y="122" font-size="12" fill="var(--text, #727981)">설정된 비트</text>
  <path d="M276 111 L282 121 L270 121 Z" fill="var(--ink, #727981)" />
  <text x="290" y="122" font-size="12" fill="var(--text, #727981)">기다리는 태스크가 고른 비트</text>

  <!-- 기다리는 조건 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="62" y="142" width="230" height="52" rx="2" />
    <rect x="308" y="142" width="230" height="52" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="177" y="163">OR: 하나라도 설정되기를 기다림</text>
    <text x="177" y="182" font-size="12">고른 비트 하나가 설정됨: 깨어난다</text>
    <text x="423" y="163">AND: 모두 설정되기를 기다림</text>
    <text x="423" y="182" font-size="12">모두 설정되지는 않음: 계속 기다린다</text>
  </g>
</svg>
