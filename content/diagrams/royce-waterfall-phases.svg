    <rect x="88" y="84" width="84" height="40" rx="2" />
    <rect x="156" y="148" width="84" height="40" rx="2" />
    <rect x="224" y="212" width="84" height="40" rx="2" />
    <rect x="292" y="276" width="84" height="40" rx="2" />
