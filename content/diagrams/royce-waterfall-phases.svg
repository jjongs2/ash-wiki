<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 760 446" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="140" height="30" rx="4" />
    <rect x="120" y="86" width="140" height="30" rx="4" />
    <rect x="220" y="152" width="140" height="30" rx="4" />
    <rect x="320" y="218" width="140" height="30" rx="4" />
    <rect x="420" y="284" width="140" height="30" rx="4" />
    <rect x="520" y="350" width="140" height="30" rx="4" />
    <rect x="620" y="416" width="140" height="30" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="39">시스템 요구사항</text>
    <text x="190" y="105">소프트웨어 요구사항</text>
    <text x="290" y="171">분석</text>
    <text x="390" y="237">프로그램 설계</text>
    <text x="490" y="303">코딩</text>
    <text x="590" y="369">테스트</text>
    <text x="690" y="435">운용</text>
  </g>
  <!-- 차례 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <path d="M160 35 H190 V85" />
    <path d="M260 101 H290 V151" />
    <path d="M360 167 H390 V217" />
    <path d="M460 233 H490 V283" />
    <path d="M560 299 H590 V349" />
    <path d="M660 365 H690 V415" />
  </g>
  <!-- 바로 앞 단계와 오감 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="145" y1="86" x2="145" y2="51" />
    <line x1="245" y1="152" x2="245" y2="117" />
    <line x1="345" y1="218" x2="345" y2="183" />
    <line x1="445" y1="284" x2="445" y2="249" />
    <line x1="545" y1="350" x2="545" y2="315" />
    <line x1="645" y1="416" x2="645" y2="381" />
  </g>
  <text x="20" y="384" fill="var(--text, #727981)">Royce 1970년 논문의 단계</text>
  <!-- 범례 -->
  <line x1="30" y1="432" x2="30" y2="406" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="42" y="423" fill="var(--text, #727981)">바로 앞뒤 단계와 오가며 다듬음</text>
</svg>
