    <line x1="164" y1="148" x2="164" y2="125" />
    <line x1="232" y1="212" x2="232" y2="189" />
    <line x1="300" y1="276" x2="300" y2="253" />
    <line x1="368" y1="340" x2="368" y2="317" />
