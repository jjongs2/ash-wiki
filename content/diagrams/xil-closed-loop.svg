<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 52 380 154.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="50" y="62" width="110" height="36" rx="2" />
    <rect x="300" y="62" width="110" height="36" rx="2" />
  </g>
  <rect x="180" y="142" width="100" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="105" y="85">테스트 대상</text>
    <text x="355" y="85">환경 모델</text>
    <text x="230" y="165">다른 요소</text>
  </g>

  <!-- 출력이 환경 모델을 거쳐 입력으로 돌아온다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="160" y1="80" x2="298" y2="80" marker-end="url(#arrow)" />
    <path d="M355 98 V160 H282" marker-end="url(#arrow)" />
    <path d="M180 160 H105 V100" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="229" y="72" text-anchor="middle">출력</text>
    <text x="113" y="134">입력</text>
    <text x="230" y="122" text-anchor="middle">closed loop</text>
    <text x="230" y="196" text-anchor="middle">거치지 않기도 함</text>
  </g>
</svg>
