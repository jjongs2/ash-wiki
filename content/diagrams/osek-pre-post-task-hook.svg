<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.5 0 600 310" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="PostTaskHook과 PreTaskHook이 불리는 시점">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 열 머리 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="150" y="30">running을 떠나는 태스크</text>
    <text x="320" y="30">운영체제</text>
    <text x="490" y="30">새 태스크</text>
  </g>

  <!-- 시간: 위에서 아래로 -->
  <line x1="36" y1="46" x2="36" y2="266" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="36" y="288" text-anchor="middle" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="140" x2="580" y2="140" />
    <line x1="60" y1="184" x2="580" y2="184" />
  </g>

  <!-- 떠나는 태스크 -->
  <rect x="85.75" y="46.75" width="128.5" height="92.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="150" y="98" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">running</text>
  <line x1="150" y1="140" x2="150" y2="272" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 운영체제 -->
  <rect x="250.75" y="100.75" width="138.5" height="34.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <rect x="250.75" y="144.75" width="138.5" height="34.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="250.75" y="188.75" width="138.5" height="34.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12">
    <text x="320" y="122" fill="var(--on-fill, #f8fafd)">PostTaskHook</text>
    <text x="320" y="166" fill="var(--text, #727981)">운영체제 내부 처리</text>
    <text x="320" y="210" fill="var(--on-fill, #f8fafd)">PreTaskHook</text>
  </g>

  <!-- 새 태스크 -->
  <rect x="425.75" y="46.75" width="128.5" height="136.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="425.75" y="184.75" width="128.5" height="86.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="490" y="119">ready</text>
    <text x="490" y="232">running</text>
  </g>
</svg>
