<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 714.5 180" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">CTAL-TA 강의계획서</text>

  <!-- 테스트 절차 하나 -->
  <rect x="20" y="44" width="412" height="136" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="36" y="66" font-size="12" fill="var(--text, #727981)">테스트 절차 하나</text>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="98" width="140" height="36" rx="2" />
    <!-- 후속 테스트 케이스 여럿 -->
    <rect x="278" y="86" width="140" height="36" rx="2" />
    <rect x="272" y="92" width="140" height="36" rx="2" />
    <rect x="266" y="98" width="140" height="36" rx="2" />
    <rect x="470" y="98" width="130" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="110" y="121">원본 테스트 케이스</text>
    <text x="336" y="121">후속 테스트 케이스</text>
    <text x="535" y="121">결과를 함께 판정</text>
  </g>
  <text x="336" y="156" font-size="12" text-anchor="middle" fill="var(--text, #727981)">하나 이상</text>

  <!-- 메타모픽 관계로 바꿈 -->
  <line x1="180" y1="116" x2="264" y2="116" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="222" y="106" font-size="12" text-anchor="middle" fill="var(--text, #727981)">메타모픽 관계</text>

  <!-- 판정 -->
  <line x1="432" y1="116" x2="468" y2="116" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="116" x2="620" y2="116" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M620 116 V86 H678" />
    <path d="M620 116 V146 H678" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="649" y="78">만족하면</text>
    <text x="649" y="138">아니면</text>
  </g>
  <g fill="var(--text, #727981)">
    <text x="686" y="91">pass</text>
    <text x="686" y="151">fail</text>
  </g>
</svg>
