<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 227" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="리셋 뒤 프로그램 카운터에 담기는 시작 주소">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상자: 위는 고정 주소, 아래는 reset vector -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="140" height="60" rx="2" />
    <rect x="204" y="20" width="140" height="60" rx="2" />
    <rect x="388" y="20" width="140" height="60" rx="2" />
    <rect x="20" y="110" width="140" height="68" rx="2" />
    <rect x="204" y="110" width="140" height="68" rx="2" />
    <rect x="388" y="110" width="140" height="68" rx="2" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="46">고정 주소</text>
    <text x="274" y="46">프로그램 카운터</text>
    <text x="458" y="55">첫 프로그램</text>
    <text x="90" y="131">reset vector</text>
    <text x="274" y="140">프로그램 카운터</text>
    <text x="458" y="149">첫 프로그램</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="90" y="64">MCU 모델마다 정해짐</text>
    <text x="274" y="64">= 고정 주소</text>
    <text x="90" y="149">ROM의 고정 주소</text>
    <text x="90" y="166">포인터 값을 담음</text>
    <text x="274" y="158">= 포인터 값</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="50" x2="202" y2="50" />
    <line x1="344" y1="50" x2="386" y2="50" />
    <line x1="160" y1="144" x2="202" y2="144" />
    <line x1="344" y1="144" x2="386" y2="144" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="182" y="42">리셋</text>
    <text x="182" y="136">리셋</text>
  </g>
  <text x="274" y="206" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Renesas 자료에 따른 첫 프로그램의 시작 주소</text>
</svg>
