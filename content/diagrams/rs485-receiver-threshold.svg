<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 567 159" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>


  <!-- 수신기 출력이 정해지는 구간 -->
  <rect x="20" y="20" width="200" height="40" fill="#b0540d" />
  <text x="120" y="45" text-anchor="middle" fill="#f8fafd">Low 출력</text>
  <rect x="340" y="20" width="200" height="40" fill="#336fb8" />
  <text x="440" y="45" text-anchor="middle" fill="#f8fafd">High 출력</text>

  <!-- 축: 차동 입력 전압 -->
  <line x1="20" y1="80" x2="546" y2="80" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="#727981" stroke-width="1.5">
    <line x1="220" y1="14" x2="220" y2="86" />
    <line x1="340" y1="14" x2="340" y2="86" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="220" y="102">−200 mV</text>
    <text x="340" y="102">200 mV</text>
  </g>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#727981">차동 입력 전압 V<tspan font-size="10" dy="3">ID</tspan><tspan dx="4" dy="-3">(SN65HVD178x)</tspan></text>
</svg>
