<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 2.5 412.5 177.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 데이터 비트 -->
  <path d="M20 38 V32 H216 V38" stroke="#727981" stroke-width="1.5" />
  <text x="118" y="24" text-anchor="middle" font-size="12" fill="#727981">데이터 비트</text>
  <g stroke="#727981" stroke-width="1.5">
    <rect x="20.75" y="44.75" width="34.5" height="38.5" />
    <rect x="60.75" y="44.75" width="34.5" height="38.5" />
    <rect x="100.75" y="44.75" width="34.5" height="38.5" />
    <rect x="140.75" y="44.75" width="34.5" height="38.5" />
    <rect x="180.75" y="44.75" width="34.5" height="38.5" />
  </g>
  <text x="118" y="68" text-anchor="middle" fill="#727981">…</text>

  <!-- 패리티 비트, 정지 비트 -->
  <rect x="220" y="44" width="100" height="40" fill="#b0540d" />
  <text x="270" y="69" text-anchor="middle" fill="#f8fafd">패리티 비트</text>
  <rect x="324.75" y="44.75" width="82.5" height="38.5" stroke="#727981" stroke-width="1.5" />
  <text x="366" y="69" text-anchor="middle" fill="#727981">정지 비트</text>

  <!-- 데이터 비트를 모두 XOR -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="38" y1="84" x2="38" y2="130" marker-end="url(#arrow)" />
    <line x1="78" y1="84" x2="78" y2="130" marker-end="url(#arrow)" />
    <line x1="158" y1="84" x2="158" y2="130" marker-end="url(#arrow)" />
    <line x1="198" y1="84" x2="198" y2="130" marker-end="url(#arrow)" />
  </g>
  <rect x="20" y="132" width="196" height="36" fill="#336fb8" />
  <text x="118" y="155" text-anchor="middle" fill="#f8fafd">모두 XOR</text>

  <!-- 홀수 패리티면 뒤집기 -->
  <line x1="216" y1="150" x2="234" y2="150" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="236" y="132" width="172" height="36" fill="#336fb8" />
  <text x="322" y="155" text-anchor="middle" fill="#f8fafd">홀수 패리티면 뒤집기</text>
  <line x1="270" y1="132" x2="270" y2="86" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
