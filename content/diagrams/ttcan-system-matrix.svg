<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 17.5 530 201" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- transmission column 표시 -->
  <rect x="355" y="46" width="70" height="120" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="390" y="36" text-anchor="middle" fill="var(--text, #727981)">transmission column</text>

  <!-- reference message -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="30" y="50" width="112" height="32" />
    <rect x="30" y="90" width="112" height="32" />
    <rect x="30" y="130" width="112" height="32" />
  </g>

  <!-- exclusive time window -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="148" y="50" width="64" height="32" />
    <rect x="358" y="50" width="64" height="32" />
    <rect x="148" y="90" width="64" height="32" />
    <rect x="358" y="90" width="64" height="32" />
    <rect x="148" y="130" width="64" height="32" />
    <rect x="358" y="130" width="64" height="32" />
  </g>

  <!-- arbitrating time window -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="218" y="50" width="64" height="32" />
    <rect x="428" y="50" width="64" height="32" />
    <rect x="218" y="90" width="134" height="32" />
    <rect x="288" y="130" width="64" height="32" />
    <rect x="428" y="130" width="64" height="32" />
  </g>

  <!-- free time window -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="288" y="50" width="64" height="32" />
    <rect x="428" y="90" width="64" height="32" />
    <rect x="218" y="130" width="64" height="32" />
  </g>

  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="86" y="70">reference message</text>
    <text x="86" y="110">reference message</text>
    <text x="86" y="150">reference message</text>
    <text x="180" y="70">exclusive</text>
    <text x="390" y="70">exclusive</text>
    <text x="180" y="110">exclusive</text>
    <text x="390" y="110">exclusive</text>
    <text x="180" y="150">exclusive</text>
    <text x="390" y="150">exclusive</text>
    <text x="250" y="70">arbitrating</text>
    <text x="460" y="70">arbitrating</text>
    <text x="285" y="110">합친 arbitrating</text>
    <text x="320" y="150">arbitrating</text>
    <text x="460" y="150">arbitrating</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="70">free</text>
    <text x="460" y="110">free</text>
    <text x="250" y="150">free</text>
  </g>

  <!-- basic cycle 표시 -->
  <path d="M498 50 H504 V82 H498" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="512" y="63">basic</text>
    <text x="512" y="77">cycle</text>
  </g>

  <!-- 시간 축 -->
  <line x1="30" y1="178" x2="490" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="500" y="182" fill="var(--text, #727981)">시간</text>
  <text x="261" y="206" text-anchor="middle" fill="var(--text, #727981)">system matrix: 칸 하나가 time window</text>
</svg>
