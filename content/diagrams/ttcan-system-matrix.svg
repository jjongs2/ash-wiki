<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 9.5 713.5 209" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- transmission column 표시 -->
  <path d="M454 42 V36 H546 V42" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="500" y="28" text-anchor="middle" fill="var(--text, #727981)">transmission column</text>

  <!-- reference message -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="30" y="50" width="128" height="32" />
    <rect x="30" y="90" width="128" height="32" />
    <rect x="30" y="130" width="128" height="32" />
  </g>

  <!-- exclusive time window -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="166" y="50" width="92" height="32" />
    <rect x="454" y="50" width="92" height="32" />
    <rect x="166" y="90" width="92" height="32" />
    <rect x="454" y="90" width="92" height="32" />
    <rect x="166" y="130" width="92" height="32" />
    <rect x="454" y="130" width="92" height="32" />
  </g>

  <!-- arbitrating time window -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="262" y="50" width="92" height="32" />
    <rect x="550" y="50" width="92" height="32" />
    <rect x="262" y="90" width="188" height="32" />
    <rect x="358" y="130" width="92" height="32" />
    <rect x="550" y="130" width="92" height="32" />
  </g>

  <!-- free time window -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="358" y="50" width="92" height="32" />
    <rect x="550" y="90" width="92" height="32" />
    <rect x="262" y="130" width="92" height="32" />
  </g>

  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="94" y="70">reference message</text>
    <text x="94" y="110">reference message</text>
    <text x="94" y="150">reference message</text>
    <text x="212" y="70">exclusive</text>
    <text x="500" y="70">exclusive</text>
    <text x="212" y="110">exclusive</text>
    <text x="500" y="110">exclusive</text>
    <text x="212" y="150">exclusive</text>
    <text x="500" y="150">exclusive</text>
    <text x="308" y="70">arbitrating</text>
    <text x="596" y="70">arbitrating</text>
    <text x="356" y="110">합친 arbitrating</text>
    <text x="404" y="150">arbitrating</text>
    <text x="596" y="150">arbitrating</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="404" y="70">free</text>
    <text x="596" y="110">free</text>
    <text x="308" y="150">free</text>
  </g>

  <!-- basic cycle 표시 -->
  <path d="M650 50 H656 V82 H650" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="664" y="70" fill="var(--text, #727981)">basic cycle</text>

  <!-- 시간 축 -->
  <line x1="30" y1="178" x2="640" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="650" y="182" fill="var(--text, #727981)">시간</text>
  <text x="336" y="206" text-anchor="middle" fill="var(--text, #727981)">system matrix: 칸 하나가 time window</text>
</svg>
