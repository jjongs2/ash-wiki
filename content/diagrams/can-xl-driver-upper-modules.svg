<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 10 420 146" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="20" width="160" height="36" rx="2" />
    <rect x="380" y="20" width="160" height="36" rx="2" />
    <rect x="140" y="110" width="400" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="220" y="43">CanIf</text>
    <text x="460" y="43">Ethernet Interface</text>
    <text x="340" y="133">CAN XL Driver</text>
  </g>

  <!-- 송신 요청과 콜백 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="58" x2="200" y2="108" marker-end="url(#arrow)" />
    <line x1="240" y1="108" x2="240" y2="58" marker-end="url(#arrow)" />
    <line x1="440" y1="58" x2="440" y2="108" marker-end="url(#arrow)" />
    <line x1="480" y1="108" x2="480" y2="58" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="192" y="87" text-anchor="end">송신</text>
    <text x="248" y="87">콜백</text>
    <text x="432" y="87" text-anchor="end">송신</text>
    <text x="488" y="87">콜백</text>
  </g>
</svg>
