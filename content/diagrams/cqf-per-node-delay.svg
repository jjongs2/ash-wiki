<svg xmlns="http://www.w3.org/2000/svg" viewBox="57.5 -6.5 619.5 227" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- cycle time -->
  <path d="M121 38 V30 H375 V38" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="248" y="22" text-anchor="middle" fill="var(--text, #727981)">cycle time</text>
  <path d="M377 38 V30 H631 V38" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="504" y="22" text-anchor="middle" fill="var(--text, #727981)">cycle time</text>

  <!-- gate open time 칸 -->
  <path d="M120 44 V160 M184 44 V160 M248 44 V160 M312 44 V160 M376 44 V160 M440 44 V160 M504 44 V160 M568 44 V160 M632 44 V160" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 경로의 노드 -->
  <text x="108" y="66" text-anchor="end" fill="var(--text, #727981)">노드 1</text>
  <text x="108" y="106" text-anchor="end" fill="var(--text, #727981)">노드 2</text>
  <text x="108" y="146" text-anchor="end" fill="var(--text, #727981)">노드 3</text>

  <!-- 노드마다 gate open time 하나만큼 늦게 나감 -->
  <rect x="124" y="50" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="152" y="66" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M180 62 H216 V88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="188" y="90" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="216" y="106" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M244 102 H280 V128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="252" y="130" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="280" y="146" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <rect x="380" y="50" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="408" y="66" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M436 62 H472 V88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="444" y="90" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="472" y="106" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M500 102 H536 V128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="508" y="130" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="536" y="146" text-anchor="middle" fill="var(--text, #727981)">패킷</text>

  <!-- 시간 축 -->
  <line x1="120" y1="168" x2="656" y2="168" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="656" y="186" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <path d="M121 176 V182 H183 V176" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="152" y="198" text-anchor="middle" fill="var(--text, #727981)">gate open time</text>
</svg>
