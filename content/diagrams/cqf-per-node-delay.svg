<svg xmlns="http://www.w3.org/2000/svg" viewBox="57.5 -6.5 523 227" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- cycle time -->
  <path d="M121 38 V30 H327 V38" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="224" y="22" text-anchor="middle" fill="var(--text, #727981)">cycle time</text>
  <path d="M329 38 V30 H535 V38" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="432" y="22" text-anchor="middle" fill="var(--text, #727981)">cycle time</text>

  <!-- gate open time 칸 -->
  <path d="M120 44 V160 M172 44 V160 M224 44 V160 M276 44 V160 M328 44 V160 M380 44 V160 M432 44 V160 M484 44 V160 M536 44 V160" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 경로의 노드 -->
  <text x="108" y="66" text-anchor="end" fill="var(--text, #727981)">노드 1</text>
  <text x="108" y="106" text-anchor="end" fill="var(--text, #727981)">노드 2</text>
  <text x="108" y="146" text-anchor="end" fill="var(--text, #727981)">노드 3</text>

  <!-- 노드마다 gate open time 하나만큼 늦게 나감 -->
  <rect x="124" y="50" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="146" y="66" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M168 62 H198 V88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="176" y="90" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="198" y="106" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M220 102 H250 V128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="228" y="130" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="250" y="146" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <rect x="332" y="50" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="354" y="66" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M376 62 H406 V88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="384" y="90" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="406" y="106" text-anchor="middle" fill="var(--text, #727981)">패킷</text>
  <path d="M428 102 H458 V128" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="436" y="130" width="44" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="458" y="146" text-anchor="middle" fill="var(--text, #727981)">패킷</text>

  <!-- 시간 축 -->
  <line x1="120" y1="168" x2="560" y2="168" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="560" y="186" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <path d="M121 176 V182 H171 V176" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="146" y="198" text-anchor="middle" fill="var(--text, #727981)">gate open time</text>
</svg>
