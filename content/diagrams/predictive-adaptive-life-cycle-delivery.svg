<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -10 428.5 346" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 열마다 세로축 하나: 시작 y=102, 인도 y=282. 위에서 아래로 흐른다. 오른쪽 화살표가 인도다 -->

  <!-- 열 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="24" font-size="14">예측형</text>
    <text x="20" y="42">폭포수 모델을 적용한 프로젝트</text>
    <text x="236" y="24" font-size="14">적응형</text>
    <text x="236" y="42">애자일 방법</text>
  </g>

  <!-- 예측형(폭포수 모델을 적용한 프로젝트): 초기에 정하고 끝에 한 번 인도 -->
  <text x="20" y="70" fill="var(--text, #727981)">범위·일정·비용을 초기에 정함</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="28" y1="102" x2="28" y2="312" marker-end="url(#arrow)" />
    <line x1="20" y1="102" x2="36" y2="102" />
    <line x1="28" y1="282" x2="72" y2="282" marker-end="url(#arrow)" />
  </g>
  <path d="M38 102 H46 V282" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="54" y="196" fill="var(--text, #727981)">몇 달이나 몇 년</text>
  <text x="80" y="286" fill="var(--text, #727981)">프로젝트를 마칠 때 한 번 인도</text>

  <!-- 적응형: 반복이 끝날 때마다 인도 -->
  <g fill="var(--text, #727981)">
    <text x="236" y="70">반복: 대개 2~4주, 시간과 자원 고정</text>
    <text x="236" y="86">반복마다 계획을 고침</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="244" y1="102" x2="244" y2="312" marker-end="url(#arrow)" />
    <line x1="236" y1="102" x2="252" y2="102" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="244" y1="162" x2="288" y2="162" />
    <line x1="244" y1="222" x2="288" y2="222" />
    <line x1="244" y1="282" x2="288" y2="282" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="256" y="136">반복</text>
    <text x="256" y="196">반복</text>
    <text x="256" y="256">반복</text>
  </g>
  <path d="M294 162 H300 V282 H294" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="308" y="226" fill="var(--text, #727981)">점진적 인도</text>
</svg>
