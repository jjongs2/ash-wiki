<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 -7 428.5 428" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가운데 세로축 x=300: 시작 y=60, 끝 y=360. 위에서 아래로 흐른다 -->

  <!-- 열 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="24" font-size="14">예측형</text>
    <text x="190" y="40">예: 폭포수 모델</text>
    <text x="410" y="24" font-size="14">적응형</text>
    <text x="410" y="40">애자일 방법</text>
  </g>

  <!-- 축과 시작 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="300" y1="60" x2="300" y2="400" marker-end="url(#arrow)" />
    <line x1="288" y1="60" x2="312" y2="60" />
  </g>

  <!-- 예측형: 초기에 정하고 끝에 한 번 인도 -->
  <text x="284" y="64" text-anchor="end" fill="var(--text, #727981)">범위·일정·비용을 초기에 정함</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="100" y1="60" x2="100" y2="360" />
    <line x1="94" y1="60" x2="106" y2="60" />
    <line x1="94" y1="360" x2="106" y2="360" />
  </g>
  <text x="112" y="214" fill="var(--text, #727981)">몇 달이나 몇 년</text>
  <line x1="300" y1="360" x2="202" y2="360" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="284" y="384" text-anchor="end" fill="var(--text, #727981)">프로젝트를 마칠 때 한 번 인도</text>

  <!-- 적응형: 반복이 끝날 때마다 인도 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="300" y1="120" x2="358" y2="120" />
    <line x1="300" y1="180" x2="358" y2="180" />
    <line x1="300" y1="240" x2="358" y2="240" />
    <line x1="300" y1="300" x2="358" y2="300" />
    <line x1="300" y1="360" x2="358" y2="360" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="316" y="94">반복: 대개 2~4주, 시간과 자원 고정</text>
    <text x="316" y="154">반복마다 계획을 고침</text>
    <text x="316" y="214">반복</text>
    <text x="316" y="274">반복</text>
    <text x="316" y="334">반복</text>
    <text x="316" y="384">작은 단위로 점진적으로 인도</text>
  </g>
</svg>
