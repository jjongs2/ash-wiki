<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -3 560 254" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="주소 표에 따른 학습과 프레임 전달">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="frame" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
  </defs>

  <!-- 목적지를 알 때 -->
  <g>
    <text x="150" y="18" text-anchor="middle" fill="var(--text, #727981)">B가 주소 표에 있을 때</text>
    <rect x="30.75" y="30.75" width="238.5" height="98.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
    <text x="44" y="52" fill="var(--text, #727981)">스위치</text>
    <!-- 주소 표 -->
    <rect x="120.75" y="84.75" width="128.5" height="20.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
    <g stroke="var(--ink, #727981)" stroke-width="1">
      <rect x="120.5" y="40.5" width="129" height="65" />
      <line x1="120" y1="62.5" x2="250" y2="62.5" />
      <line x1="120" y1="84.5" x2="250" y2="84.5" />
      <line x1="200.5" y1="40" x2="200.5" y2="106" />
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="160" y="56" fill="var(--text, #727981)">MAC 주소</text>
      <text x="225" y="56" fill="var(--text, #727981)">포트</text>
      <text x="160" y="78" fill="var(--text, #727981)">B</text>
      <text x="225" y="78" fill="var(--text, #727981)">3</text>
      <text x="160" y="100" fill="var(--on-fill, #f8fafd)">A</text>
      <text x="225" y="100" fill="var(--on-fill, #f8fafd)">1</text>
    </g>
    <text x="112" y="100" text-anchor="end" font-size="12" fill="var(--text, #727981)">학습</text>
    <!-- 포트와 스테이션 -->
    <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
      <text x="60" y="124">포트 1</text>
      <text x="120" y="124">포트 2</text>
      <text x="180" y="124">포트 3</text>
      <text x="240" y="124">포트 4</text>
    </g>
    <g stroke="var(--ink, #727981)" stroke-width="1.5">
      <line x1="120" y1="130" x2="120" y2="170" />
      <line x1="240" y1="130" x2="240" y2="170" />
    </g>
    <g stroke="var(--violet, #825da9)" stroke-width="3" marker-end="url(#frame)">
      <line x1="60" y1="170" x2="60" y2="134" />
      <line x1="180" y1="130" x2="180" y2="166" />
    </g>
    <g stroke="var(--ink, #727981)" stroke-width="1.5">
      <rect x="40" y="172" width="40" height="26" rx="2" />
      <rect x="100" y="172" width="40" height="26" rx="2" />
      <rect x="160" y="172" width="40" height="26" rx="2" />
      <rect x="220" y="172" width="40" height="26" rx="2" />
    </g>
    <g fill="var(--text, #727981)" text-anchor="middle">
      <text x="60" y="190">A</text>
      <text x="120" y="190">C</text>
      <text x="180" y="190">B</text>
      <text x="240" y="190">D</text>
    </g>
  </g>

  <!-- 목적지를 모를 때 -->
  <g transform="translate(300 0)">
    <text x="150" y="18" text-anchor="middle" fill="var(--text, #727981)">B가 주소 표에 없을 때</text>
    <rect x="30.75" y="30.75" width="238.5" height="98.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
    <text x="44" y="52" fill="var(--text, #727981)">스위치</text>
    <!-- 주소 표 -->
    <rect x="120.75" y="62.75" width="128.5" height="20.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
    <g stroke="var(--ink, #727981)" stroke-width="1">
      <rect x="120.5" y="40.5" width="129" height="65" />
      <line x1="120" y1="62.5" x2="250" y2="62.5" />
      <line x1="120" y1="84.5" x2="250" y2="84.5" />
      <line x1="200.5" y1="40" x2="200.5" y2="106" />
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="160" y="56" fill="var(--text, #727981)">MAC 주소</text>
      <text x="225" y="56" fill="var(--text, #727981)">포트</text>
      <text x="160" y="78" fill="var(--on-fill, #f8fafd)">A</text>
      <text x="225" y="78" fill="var(--on-fill, #f8fafd)">1</text>
    </g>
    <text x="112" y="78" text-anchor="end" font-size="12" fill="var(--text, #727981)">학습</text>
    <!-- 포트와 스테이션 -->
    <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
      <text x="60" y="124">포트 1</text>
      <text x="120" y="124">포트 2</text>
      <text x="180" y="124">포트 3</text>
      <text x="240" y="124">포트 4</text>
    </g>
    <g stroke="var(--violet, #825da9)" stroke-width="3" marker-end="url(#frame)">
      <line x1="60" y1="170" x2="60" y2="134" />
      <line x1="120" y1="130" x2="120" y2="166" />
      <line x1="180" y1="130" x2="180" y2="166" />
      <line x1="240" y1="130" x2="240" y2="166" />
    </g>
    <g stroke="var(--ink, #727981)" stroke-width="1.5">
      <rect x="40" y="172" width="40" height="26" rx="2" />
      <rect x="100" y="172" width="40" height="26" rx="2" />
      <rect x="160" y="172" width="40" height="26" rx="2" />
      <rect x="220" y="172" width="40" height="26" rx="2" />
    </g>
    <g fill="var(--text, #727981)" text-anchor="middle">
      <text x="60" y="190">A</text>
      <text x="120" y="190">C</text>
      <text x="180" y="190">B</text>
      <text x="240" y="190">D</text>
    </g>
  </g>

  <!-- 설명 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="30" y="222">보라 화살표: A가 B에게 보낸 프레임이 지나는 길. 받은 포트로는 돌려보내지 않는다.</text>
    <text x="30" y="240">학습: 이 프레임의 출발지 주소 A와 받은 포트 1을 주소 표에 기록한 행.</text>
  </g>
</svg>
