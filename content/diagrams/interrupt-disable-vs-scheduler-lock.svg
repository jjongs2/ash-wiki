<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.5 -3.5 586 298.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 인터럽트 금지 -->
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">인터럽트 금지: 임계 구역 동안 인터럽트를 모두 끈다</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="190" y1="46" x2="190" y2="108" />
    <line x1="290" y1="46" x2="290" y2="108" />
    <line x1="420" y1="46" x2="420" y2="108" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="190" y="40">인터럽트를 끔</text>
    <text x="290" y="40">인터럽트 요청</text>
    <text x="420" y="40">다시 켬</text>
  </g>
  <text x="130" y="71" text-anchor="end" fill="var(--text, #727981)">인터럽트 처리기</text>
  <rect x="290.75" y="52.75" width="128.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="355" y="71" text-anchor="middle" fill="var(--text, #727981)">대기</text>
  <rect x="420" y="52" width="60" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="450" y="71" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <text x="130" y="99" text-anchor="end" fill="var(--text, #727981)">태스크 A</text>
  <rect x="140" y="80" width="50" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="165" y="99" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <rect x="190.75" y="80.75" width="228.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="305" y="99" text-anchor="middle" fill="var(--on-fill, #f8fafd)">임계 구역</text>
  <rect x="480" y="80" width="60" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="510" y="99" text-anchor="middle" fill="var(--text, #727981)">실행</text>

  <!-- 스케줄러 잠금 -->
  <text x="20" y="140" font-size="12" fill="var(--text, #727981)">스케줄러 잠금: FreeRTOS에서 임계 구역 동안 스케줄러를 멈춘다</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="190" y1="168" x2="190" y2="258" />
    <line x1="290" y1="168" x2="290" y2="258" />
    <line x1="420" y1="168" x2="420" y2="258" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="190" y="162">스케줄러를 멈춤</text>
    <text x="290" y="162">인터럽트 요청</text>
    <text x="420" y="162">다시 켬</text>
  </g>
  <text x="130" y="193" text-anchor="end" fill="var(--text, #727981)">인터럽트 처리기</text>
  <rect x="290" y="174" width="60" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="320" y="193" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <text x="130" y="221" text-anchor="end" fill="var(--text, #727981)">태스크 A</text>
  <rect x="140" y="202" width="50" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="165" y="221" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <rect x="190.75" y="202.75" width="98.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="240" y="221" text-anchor="middle" fill="var(--on-fill, #f8fafd)">임계 구역</text>
  <rect x="350.75" y="202.75" width="68.5" height="26.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="385" y="221" text-anchor="middle" fill="var(--on-fill, #f8fafd)">임계 구역</text>
  <text x="130" y="249" text-anchor="end" fill="var(--text, #727981)">태스크 B</text>
  <rect x="350.75" y="230.75" width="68.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="385" y="249" text-anchor="middle" fill="var(--text, #727981)">전환 보류</text>
  <rect x="420" y="230" width="100" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="470" y="249" text-anchor="middle" fill="var(--text, #727981)">실행</text>

  <!-- 시간 -->
  <line x1="140" y1="278" x2="554" y2="278" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="562" y="282" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
