<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="end" fill="var(--text, #727981)">GoogleTest</text>

  <!-- fatal assertion -->
  <text x="20" y="30" font-size="14" fill="var(--text, #727981)">fatal assertion(ASSERT_*)</text>
  <rect x="20" y="42" width="480" height="64" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="60" fill="var(--text, #727981)">현재 함수</text>
  <rect x="36" y="68" width="140" height="28" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="106" y="86" text-anchor="middle" fill="var(--text, #727981)">ASSERT_* 실패</text>
  <line x1="106" y1="96" x2="106" y2="130" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="116" y="126" fill="var(--text, #727981)">fatal failure를 내고 곧바로 빠져나감</text>

  <!-- non-fatal assertion -->
  <text x="20" y="162" font-size="14" fill="var(--text, #727981)">non-fatal assertion(EXPECT_*)</text>
  <rect x="20" y="174" width="480" height="64" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="192" fill="var(--text, #727981)">현재 함수</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="36" y="200" width="140" height="28" rx="2" />
    <rect x="256" y="200" width="140" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="106" y="218">EXPECT_* 실패</text>
    <text x="326" y="218">EXPECT_* 실패</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="176" y1="214" x2="254" y2="214" />
    <line x1="396" y1="214" x2="484" y2="214" />
  </g>
  <text x="216" y="206" text-anchor="middle" fill="var(--text, #727981)">계속 실행</text>
  <text x="20" y="260" fill="var(--text, #727981)">실패마다 non-fatal failure를 기록해, 한 테스트에서 실패를 여럿 보고</text>
</svg>
