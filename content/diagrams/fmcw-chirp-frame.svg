<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 19 366 245.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="chirp N개로 된 chirp frame">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="220" x2="100" y2="34" />
    <line x1="100" y1="220" x2="440" y2="220" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="108" y="38">주파수</text>
    <text x="440" y="240" text-anchor="end">시간</text>
  </g>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="64" x2="120" y2="196" />
    <line x1="180" y1="64" x2="180" y2="150" />
    <line x1="400" y1="150" x2="400" y2="196" />
  </g>

  <!-- chirp -->
  <g stroke="var(--ink, #727981)" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="150" x2="180" y2="80" />
    <line x1="180" y1="150" x2="240" y2="80" />
    <line x1="240" y1="150" x2="300" y2="80" />
    <line x1="340" y1="150" x2="400" y2="80" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="120">⋯</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="150" y="168">1</text>
    <text x="210" y="168">2</text>
    <text x="270" y="168">3</text>
    <text x="370" y="168" font-style="italic">N</text>
  </g>

  <!-- chirp 간격과 frame 시간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="122" y1="68" x2="178" y2="68" />
    <line x1="122" y1="190" x2="398" y2="190" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="58"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">c</tspan></text>
    <text x="260" y="208">chirp frame: <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">f</tspan> = <tspan font-style="italic">N T</tspan><tspan baseline-shift="sub" font-size="10">c</tspan></text>
  </g>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TI 백서에 따른 chirp frame</text>
</svg>
