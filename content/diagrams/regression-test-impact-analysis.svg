<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 4.5 530 202" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <text x="20" y="24" font-size="12" fill="var(--text, #727981)">CTAL-TA 강의계획서의 영향 분석</text>

  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="90" y="54">테스트 케이스</text>
    <text x="250" y="54">실행 중 활성화</text>
    <text x="410" y="54">형상 항목</text>
  </g>

  <!-- 기록해 둔 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="160" y1="81" x2="340" y2="81" />
    <line x1="160" y1="181" x2="340" y2="181" />
  </g>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="160" y1="81" x2="340" y2="131" />
    <line x1="160" y1="131" x2="340" y2="131" />
  </g>

  <!-- 테스트 케이스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="166" width="140" height="30" rx="2" />
    <rect x="340" y="66" width="140" height="30" rx="2" />
    <rect x="340" y="166" width="140" height="30" rx="2" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="20" y="66" width="140" height="30" rx="2" />
    <rect x="20" y="116" width="140" height="30" rx="2" />
  </g>
  <rect x="340" y="116" width="140" height="30" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="90" y="86">고른 회귀 테스트</text>
    <text x="90" y="136">고른 회귀 테스트</text>
    <text x="410" y="136">바뀐 형상 항목</text>
  </g>

  <!-- 변경 -->
  <line x1="530" y1="131" x2="482" y2="131" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="506" y="123" font-size="12" text-anchor="middle" fill="var(--text, #727981)">변경</text>
</svg>
