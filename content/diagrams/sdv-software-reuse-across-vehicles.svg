<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 308.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="여러 차종에 다시 쓰는 응용 소프트웨어">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150" y="20" width="160" height="36" rx="2" />
    <rect x="20" y="100" width="420" height="40" rx="2" />
    <rect x="20" y="156" width="420" height="40" rx="2" />
    <rect x="20" y="212" width="128" height="40" rx="2" />
    <rect x="166" y="212" width="128" height="40" rx="2" />
    <rect x="312" y="212" width="128" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="230" y="42.5">OTA 업데이트</text>
    <text x="230" y="124.5">응용 소프트웨어</text>
    <text x="230" y="180.5">특정 하드웨어에 묶지 않는 플랫폼</text>
    <text x="84" y="236.5">하드웨어</text>
    <text x="230" y="236.5">하드웨어</text>
    <text x="376" y="236.5">하드웨어</text>
  </g>

  <!-- 출고 뒤 -->
  <line x1="230" y1="56" x2="230" y2="98" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="240" y="82" font-size="12" fill="var(--text, #727981)">출고 뒤의 기능 변경</text>

  <!-- 여러 차종 -->
  <path d="M20 264 V270 H440 V264" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="230" y="288" font-size="12" text-anchor="middle" fill="var(--text, #727981)">여러 차종</text>
</svg>
