<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -17 520 263" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 부트로더와 응용 프로그램 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="60" width="200" height="48" rx="2" />
    <rect x="320" y="60" width="200" height="48" rx="2" />
    <rect x="320" y="190" width="200" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="80">1단계 부트로더</text>
    <text x="140" y="98" font-size="12">칩 안의 ROM, 고칠 수 없음</text>
    <text x="420" y="80">2단계 부트로더</text>
    <text x="420" y="98" font-size="12">플래시, 고칠 수 있음</text>
    <text x="420" y="213">응용 프로그램</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="22" x2="140" y2="58" marker-end="url(#arrow)" />
    <line x1="242" y1="84" x2="318" y2="84" marker-end="url(#arrow)" />
    <line x1="420" y1="110" x2="420" y2="188" marker-end="url(#arrow)" />
    <path d="M140 110 V208 H318" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="140" y="12" text-anchor="middle">전원 켜짐, 리셋</text>
    <text x="280" y="76" text-anchor="middle">불러 실행</text>
    <text x="412" y="153" text-anchor="end">실행할 응용 프로그램을 고름</text>
    <text x="152" y="178">내장 플래시가 있는 MCU에서</text>
    <text x="152" y="196">곧바로 넘어가기도 함</text>
  </g>
</svg>
