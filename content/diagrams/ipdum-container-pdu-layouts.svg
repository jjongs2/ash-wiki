<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.5 8 520 178" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="340" y="28" text-anchor="middle" font-size="12" fill="var(--text, #727981)">container PDU</text>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="128" y="62">동적 레이아웃</text>
    <text x="128" y="142">정적 레이아웃</text>
  </g>

  <!-- 동적 레이아웃 -->
  <g stroke-width="1.5">
    <rect x="140" y="40" width="50" height="34" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" />
    <rect x="190" y="40" width="130" height="34" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="320" y="40" width="50" height="34" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" />
    <rect x="370" y="40" width="130" height="34" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="140" y="40" width="400" height="34" stroke="var(--ink, #727981)" />
  </g>
  <g text-anchor="middle">
    <text x="165" y="62" fill="var(--on-fill, #f8fafd)">헤더</text>
    <text x="255" y="62" fill="var(--text, #727981)">contained I-PDU</text>
    <text x="345" y="62" fill="var(--on-fill, #f8fafd)">헤더</text>
    <text x="435" y="62" fill="var(--text, #727981)">contained I-PDU</text>
  </g>
  <text x="340" y="94" text-anchor="middle" font-size="12" fill="var(--text, #727981)">contained I-PDU마다 앞에 헤더를 붙인다</text>

  <!-- 정적 레이아웃 -->
  <g stroke-width="1.5">
    <rect x="140" y="120" width="130" height="34" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="270" y="120" width="130" height="34" fill="var(--surface, none)" stroke="var(--ink, #727981)" />
    <rect x="140" y="120" width="400" height="34" stroke="var(--ink, #727981)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="205" y="142">contained I-PDU</text>
    <text x="335" y="142">contained I-PDU</text>
  </g>
  <text x="340" y="174" text-anchor="middle" font-size="12" fill="var(--text, #727981)">헤더 없이 자리를 미리 정해 둔다</text>

  <!-- 생략 -->
  <g fill="var(--ink, #727981)">
    <circle cx="512" cy="57" r="1.5" />
    <circle cx="520" cy="57" r="1.5" />
    <circle cx="528" cy="57" r="1.5" />
    <circle cx="462" cy="137" r="1.5" />
    <circle cx="470" cy="137" r="1.5" />
    <circle cx="478" cy="137" r="1.5" />
  </g>
</svg>
