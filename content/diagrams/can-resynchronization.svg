  <rect x="500" y="300" width="14" height="14" fill="#b0540d" />
  <text x="520" y="312" font-size="12" fill="#727981">PHASE_SEG2</text>
  <path d="M617 301 L623 310 H611 z" fill="#727981" />
  <text x="630" y="312" font-size="12" fill="#727981">샘플 포인트</text>
  <text x="170" y="336" font-size="12" fill="#727981">점선: 공칭 비트의 시작과 샘플 포인트. 늘이거나 줄이는 양의 상한은 SJW다.</text>
</svg>
