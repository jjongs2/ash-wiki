  <text x="154" y="157" text-anchor="end" font-size="12" fill="#727981">송신 노드가 느림</text>
  <rect x="170" y="126" width="144" height="34" fill="#b0540d" />
  <rect x="314" y="126" width="48" height="34" fill="#825da9" />
  <rect x="362" y="126" width="96" height="34" fill="#336fb8" />
