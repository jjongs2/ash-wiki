  <text x="594" y="122" text-anchor="end" font-size="12" fill="#727981">PHASE_SEG1이 늘어남</text>

  <!-- 위상 오차 < 0: PHASE_SEG2가 줄어듦 -->
  <text x="154" y="230" text-anchor="end" fill="#727981">위상 오차 &lt; 0</text>
  <text x="154" y="247" text-anchor="end" font-size="12" fill="#727981">송신 노드가 빠름</text>
