  <text x="258" y="212" text-anchor="end" font-size="12" fill="#727981">PHASE_SEG2가 줄어듦</text>

  <!-- 범례 -->
  <rect x="170" y="300" width="14" height="14" fill="#825da9" />
  <text x="190" y="312" font-size="12" fill="#727981">SYNC_SEG</text>
