<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6.5 620 352" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 열 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)" font-size="13">
    <text x="115" y="24">ISO/IEC 15504 시리즈</text>
    <text x="525" y="24">ISO/IEC 330xx 계열</text>
  </g>

  <!-- 앞 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="190" height="30" rx="2" />
    <rect x="20" y="110" width="190" height="30" rx="2" />
    <rect x="20" y="180" width="190" height="44" rx="2" />
    <rect x="20" y="296" width="190" height="30" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="59">ISO/IEC 15504-1:2004</text>
    <text x="115" y="129">ISO/IEC TR 15504-7:2008</text>
    <text x="115" y="198">ISO/IEC 15504-2:2003</text>
    <text x="115" y="215">와 Cor 1:2004</text>
    <text x="115" y="315">ISO/IEC 15504-5:2012</text>
  </g>

  <!-- 이은 표준 -->
  <rect x="430" y="128" width="190" height="110" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="440" y="40" width="170" height="30" rx="2" />
    <rect x="440" y="84" width="170" height="30" rx="2" />
    <rect x="440" y="138" width="170" height="26" rx="2" />
    <rect x="440" y="170" width="170" height="26" rx="2" />
    <rect x="440" y="202" width="170" height="26" rx="2" />
    <rect x="440" y="252" width="170" height="30" rx="2" />
    <rect x="440" y="296" width="170" height="30" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="525" y="59">ISO/IEC 33001:2015</text>
    <text x="525" y="103">ISO/IEC TR 33014:2013</text>
    <text x="525" y="155">ISO/IEC 33002:2015</text>
    <text x="525" y="187">ISO/IEC 33003:2015</text>
    <text x="525" y="219">ISO/IEC 33004:2015</text>
    <text x="525" y="271">ISO/IEC 33020:2019</text>
    <text x="525" y="315">ISO/IEC TS 33061:2021</text>
  </g>

  <!-- 이음 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="210" y1="51" x2="438" y2="51" />
    <line x1="210" y1="121" x2="438" y2="62" />
    <line x1="210" y1="125" x2="438" y2="99" />
    <line x1="210" y1="129" x2="428" y2="172" />
    <line x1="210" y1="196" x2="428" y2="196" />
    <line x1="210" y1="212" x2="438" y2="267" />
    <line x1="210" y1="311" x2="438" y2="311" />
  </g>
  <text x="300" y="256" fill="var(--text, #727981)">5절</text>

  <!-- 범례 -->
  <line x1="20" y1="346" x2="60" y2="346" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="70" y="350" fill="var(--text, #727981)">이은 표준</text>
</svg>
