<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 10 498.5 230" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 제목 -->
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="112" y="30">QoS 0</text>
    <text x="280" y="30">QoS 1</text>
    <text x="448" y="30">QoS 2</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="112" y="46">at most once</text>
    <text x="280" y="46">at least once</text>
    <text x="448" y="46">exactly once</text>
    <text x="60" y="76">보내는 쪽</text>
    <text x="164" y="76">받는 쪽</text>
    <text x="228" y="76">보내는 쪽</text>
    <text x="332" y="76">받는 쪽</text>
    <text x="396" y="76">보내는 쪽</text>
    <text x="500" y="76">받는 쪽</text>
  </g>

  <!-- 생명선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="60" y1="84" x2="60" y2="230" />
    <line x1="164" y1="84" x2="164" y2="230" />
    <line x1="228" y1="84" x2="228" y2="230" />
    <line x1="332" y1="84" x2="332" y2="230" />
    <line x1="396" y1="84" x2="396" y2="230" />
    <line x1="500" y1="84" x2="500" y2="230" />
  </g>

  <!-- 패킷 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="62" y1="112" x2="162" y2="112" />
    <line x1="230" y1="112" x2="330" y2="112" />
    <line x1="330" y1="148" x2="230" y2="148" />
    <line x1="398" y1="112" x2="498" y2="112" />
    <line x1="498" y1="148" x2="398" y2="148" />
    <line x1="398" y1="184" x2="498" y2="184" />
    <line x1="498" y1="220" x2="398" y2="220" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="112" y="106">메시지</text>
    <text x="280" y="106">메시지</text>
    <text x="280" y="142">PUBACK</text>
    <text x="448" y="106">메시지</text>
    <text x="448" y="142">PUBREC</text>
    <text x="448" y="178">PUBREL</text>
    <text x="448" y="214">PUBCOMP</text>
  </g>
</svg>
