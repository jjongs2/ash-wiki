<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 10 698.5 230" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 제목 -->
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="130" y="30">QoS 0</text>
    <text x="380" y="30">QoS 1</text>
    <text x="630" y="30">QoS 2</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="130" y="46">at most once</text>
    <text x="380" y="46">at least once</text>
    <text x="630" y="46">exactly once</text>
    <text x="60" y="76">보내는 쪽</text>
    <text x="200" y="76">받는 쪽</text>
    <text x="310" y="76">보내는 쪽</text>
    <text x="450" y="76">받는 쪽</text>
    <text x="560" y="76">보내는 쪽</text>
    <text x="700" y="76">받는 쪽</text>
  </g>

  <!-- 생명선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="60" y1="84" x2="60" y2="230" />
    <line x1="200" y1="84" x2="200" y2="230" />
    <line x1="310" y1="84" x2="310" y2="230" />
    <line x1="450" y1="84" x2="450" y2="230" />
    <line x1="560" y1="84" x2="560" y2="230" />
    <line x1="700" y1="84" x2="700" y2="230" />
  </g>

  <!-- 패킷 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="62" y1="112" x2="198" y2="112" />
    <line x1="312" y1="112" x2="448" y2="112" />
    <line x1="448" y1="148" x2="312" y2="148" />
    <line x1="562" y1="112" x2="698" y2="112" />
    <line x1="698" y1="148" x2="562" y2="148" />
    <line x1="562" y1="184" x2="698" y2="184" />
    <line x1="698" y1="220" x2="562" y2="220" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="130" y="106">메시지</text>
    <text x="380" y="106">메시지</text>
    <text x="380" y="142">PUBACK</text>
    <text x="630" y="106">메시지</text>
    <text x="630" y="142">PUBREC</text>
    <text x="630" y="178">PUBREL</text>
    <text x="630" y="214">PUBCOMP</text>
  </g>
</svg>
