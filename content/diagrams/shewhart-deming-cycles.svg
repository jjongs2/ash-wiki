<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.5 -6.5 596 319.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="Shewhart와 Deming의 순환">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Shewhart: 세 단계는 직선이 아니라 원을 이룬다 -->
  <text x="170" y="24" text-anchor="middle" font-size="13" fill="var(--text, #727981)">Shewhart(1939)</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="55" y="40" width="60" height="28" rx="2" />
    <rect x="140" y="40" width="60" height="28" rx="2" />
    <rect x="225" y="40" width="60" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="58">명세</text>
    <text x="170" y="58">생산</text>
    <text x="255" y="58">검사</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="115" y1="54" x2="139" y2="54" />
    <line x1="200" y1="54" x2="224" y2="54" />
  </g>
  <text x="170" y="92" text-anchor="middle" fill="var(--text, #727981)">직선이 아니라</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M217.2 141.7 A72 72 0 0 1 241 207.9" />
    <path d="M208.2 257.1 A72 72 0 0 1 130.3 256" />
    <path d="M98.8 207 A72 72 0 0 1 124 140.6" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="128" y="104" width="84" height="40" rx="2" />
    <rect x="190.4" y="212" width="84" height="40" rx="2" />
    <rect x="65.6" y="212" width="84" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="121">명세</text>
    <text x="170" y="137" font-size="11">가설 세우기</text>
    <text x="232.4" y="229">생산</text>
    <text x="232.4" y="245" font-size="11">실험</text>
    <text x="107.6" y="229">검사</text>
    <text x="107.6" y="245" font-size="11">가설 검증</text>
  </g>
  <text x="170" y="292" text-anchor="middle" fill="var(--text, #727981)">원을 이룬다</text>

  <!-- Deming: 설계, 제조, 판매, 사용 중 시험을 되풀이한다 -->
  <text x="480" y="24" text-anchor="middle" font-size="13" fill="var(--text, #727981)">Deming(1950년부터)</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M530.3 82.7 A84 84 0 0 1 562 131.8" />
    <path d="M561.8 169.3 A84 84 0 0 1 529.7 217.7" />
    <path d="M429.7 217.3 A84 84 0 0 1 398 168.2" />
    <path d="M398.2 130.7 A84 84 0 0 1 430.3 82.3" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="434" y="52" width="92" height="28" rx="2" />
    <rect x="518" y="136" width="92" height="28" rx="2" />
    <rect x="434" y="220" width="92" height="28" rx="2" />
    <rect x="350" y="136" width="92" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="480" y="70">설계</text>
    <text x="564" y="154">제조</text>
    <text x="480" y="238">판매</text>
    <text x="396" y="154">사용 중 시험</text>
  </g>
</svg>
