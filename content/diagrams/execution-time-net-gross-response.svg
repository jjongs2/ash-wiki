<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 10 525.5 190" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 실행을 시작해서 끝낼 때까지 -->
  <g>
    <rect x="130" y="30" width="70" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
    <rect x="200.75" y="30.75" width="60.5" height="26.5" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
    <rect x="262" y="30" width="56" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
    <rect x="318.75" y="30.75" width="67.5" height="26.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
    <rect x="387" y="30" width="63" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="165" y="48">실행</text>
    <text x="231" y="48" fill="var(--on-fill, #f8fafd)">다른 개체</text>
    <text x="290" y="48">실행</text>
    <text x="352.5" y="48" fill="var(--on-fill, #f8fafd)">외부 호출</text>
    <text x="418.5" y="48">실행</text>
  </g>
  <line x1="130" y1="64" x2="478" y2="64" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="486" y="68" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 응답 시간 -->
  <text x="20" y="100" fill="var(--text, #727981)">응답 시간</text>
  <line x1="132" y1="96" x2="448" y2="96" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />

  <!-- gross: 끼어든 시간을 빼고 외부 호출은 넣는다 -->
  <text x="20" y="136" fill="var(--text, #727981)">gross 실행 시간</text>
  <rect x="130" y="118" width="70" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="200.75" y="118.75" width="60.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <rect x="262" y="118" width="56" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="318.75" y="118.75" width="67.5" height="22.5" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <rect x="387" y="118" width="63" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />

  <!-- net: 끼어든 시간과 외부 호출을 모두 뺀다 -->
  <text x="20" y="174" fill="var(--text, #727981)">net 실행 시간</text>
  <rect x="130" y="156" width="70" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="200.75" y="156.75" width="60.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <rect x="262" y="156" width="56" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="318.75" y="156.75" width="67.5" height="22.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <rect x="387" y="156" width="63" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />

  <g font-size="12" text-anchor="middle">
    <text x="231" y="135" fill="var(--text, #727981)">뺌</text>
    <text x="352.5" y="135" fill="var(--on-fill, #f8fafd)">넣음</text>
    <text x="231" y="173" fill="var(--text, #727981)">뺌</text>
    <text x="352.5" y="173" fill="var(--text, #727981)">뺌</text>
  </g>
</svg>
