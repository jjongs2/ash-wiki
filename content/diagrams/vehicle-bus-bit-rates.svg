<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 16 530 192.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축은 로그 스케일: x = 200 + 90 × (log10(비트율 bit/s) − 3) -->

  <!-- 행 이름 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="178" y="37">LIN</text>
    <text x="178" y="77">저속 내결함성 CAN</text>
    <text x="178" y="117">Classical CAN</text>
    <text x="178" y="157">FlexRay</text>
  </g>

  <!-- 상한만 있는 버스는 점, 두 끝이 있는 버스는 구간(열린 원은 그 값을 빼는 끝) -->
  <circle cx="200" cy="32" r="6" fill="var(--ink, #727981)" />
  <line x1="206" y1="32" x2="311.1" y2="32" stroke="var(--ink, #727981)" stroke-width="3" />
  <circle cx="317.1" cy="32" r="6" fill="var(--ink, #727981)" />
  <line x1="349.2" y1="72" x2="382.7" y2="72" stroke="var(--ink, #727981)" stroke-width="3" />
  <circle cx="344.2" cy="72" r="5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <circle cx="388.7" cy="72" r="6" fill="var(--ink, #727981)" />
  <circle cx="470" cy="112" r="6" fill="var(--ink, #727981)" />
  <circle cx="560" cy="152" r="6" fill="var(--ink, #727981)" />

  <!-- 값 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="331.1" y="36">1 kbit/s 이상, 20 kbit/s 이하</text>
    <text x="402.7" y="76">40 kbit/s 초과, 125 kbit/s 이하</text>
    <text x="484" y="116">1 Mbit/s까지</text>
    <text x="546" y="156" text-anchor="end">최대 10 Mbit/s</text>
  </g>

  <!-- 축 -->
  <line x1="190" y1="174" x2="580" y2="174" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="580" y="196" text-anchor="end" font-size="12" fill="var(--text, #727981)">비트율 (로그 스케일)</text>
</svg>
