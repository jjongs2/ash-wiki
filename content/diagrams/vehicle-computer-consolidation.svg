<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 9 350 250" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="따로 된 제어기의 기능을 모은 차량 컴퓨터">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="30">따로 된 제어기</text>
    <text x="285" y="30">차량 컴퓨터</text>
  </g>

  <!-- 차량 컴퓨터 -->
  <rect x="220.75" y="40.75" width="128.5" height="154.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="50.75" width="108.5" height="26.5" />
    <rect x="20.75" y="86.75" width="108.5" height="26.5" />
    <rect x="20.75" y="122.75" width="108.5" height="26.5" />
    <rect x="20.75" y="158.75" width="108.5" height="26.5" />
    <rect x="230.75" y="50.75" width="108.5" height="26.5" />
    <rect x="230.75" y="86.75" width="108.5" height="26.5" />
    <rect x="230.75" y="122.75" width="108.5" height="26.5" />
    <rect x="230.75" y="158.75" width="108.5" height="26.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="75" y="68">파워트레인</text>
    <text x="75" y="104">섀시</text>
    <text x="75" y="140">운전자 보조</text>
    <text x="75" y="176">인포테인먼트</text>
    <text x="285" y="68">파워트레인</text>
    <text x="285" y="104">섀시</text>
    <text x="285" y="140">운전자 보조</text>
    <text x="285" y="176">인포테인먼트</text>
  </g>

  <line x1="140" y1="118" x2="208" y2="118" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="185" y="228">Bosch에 따르면 차량 컴퓨터 하나가</text>
    <text x="185" y="246">여러 도메인의 소프트웨어 기능을 함께 돌리게 된다</text>
  </g>
</svg>
