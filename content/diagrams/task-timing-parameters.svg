<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 -7.5 501 210.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="상대 마감 시한과 절대 마감 시한">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 길이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="50" y1="94" x2="50" y2="24" />
    <line x1="300" y1="94" x2="300" y2="60" />
    <line x1="410" y1="94" x2="410" y2="24" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="52" y1="30" x2="408" y2="30" />
    <line x1="52" y1="66" x2="298" y2="66" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="230" y="22">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="175" y="58">상대 마감 시한 <tspan font-style="italic">D</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  </g>

  <!-- 실행 -->
  <rect x="80" y="124" width="120" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="147" text-anchor="middle" fill="var(--text, #727981)">실행 시간 <tspan font-style="italic">C</tspan><tspan font-style="italic" dy="3" font-size="10">i</tspan></text>

  <!-- 시간 축 -->
  <line x1="30" y1="160" x2="460" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="468" y="164" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 도착과 마감 시한 -->
  <line x1="50" y1="160" x2="50" y2="96" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="410" y1="160" x2="410" y2="96" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="300" y1="96" x2="300" y2="158" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="50" y="180">도착 <tspan font-style="italic">r</tspan></text>
    <text x="300" y="180">절대 마감 시한 <tspan font-style="italic">r</tspan> + <tspan font-style="italic">D</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="410" y="180">다음 도착</text>
  </g>
</svg>
