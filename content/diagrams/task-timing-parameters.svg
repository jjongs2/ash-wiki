<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -7.5 636.5 210.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 길이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="50" y1="94" x2="50" y2="24" />
    <line x1="360" y1="94" x2="360" y2="60" />
    <line x1="500" y1="94" x2="500" y2="24" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="52" y1="30" x2="498" y2="30" />
    <line x1="52" y1="66" x2="358" y2="66" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="275" y="22">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="205" y="58">상대 마감 시한 <tspan font-style="italic">D</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  </g>

  <!-- 실행 -->
  <rect x="90" y="124" width="140" height="36" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="160" y="147" text-anchor="middle" fill="var(--text, #727981)">실행 시간 <tspan font-style="italic">C</tspan><tspan font-style="italic" dy="3" font-size="10">i</tspan></text>

  <!-- 시간 축 -->
  <line x1="30" y1="160" x2="598" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="606" y="164" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 도착과 마감 시한 -->
  <line x1="50" y1="160" x2="50" y2="96" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="500" y1="160" x2="500" y2="96" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="360" y1="96" x2="360" y2="158" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="50" y="180">도착 <tspan font-style="italic">r</tspan></text>
    <text x="360" y="180">절대 마감 시한 <tspan font-style="italic">r</tspan> + <tspan font-style="italic">D</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="500" y="180">다음 도착</text>
  </g>
</svg>
