<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -5.5 651 202" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="독립성의 네 수준">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTFL 강의계획서</text>

  <!-- 조직과 팀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="40" width="450" height="136" rx="2" />
    <rect x="40" y="70" width="270" height="92" rx="2" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="32" y="60">조직</text>
    <text x="52" y="88">저자의 팀</text>
  </g>

  <!-- 테스트하는 사람 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="52" y="100" width="120" height="48" rx="2" />
    <rect x="178" y="100" width="120" height="48" rx="2" />
    <rect x="330" y="100" width="120" height="48" rx="2" />
    <rect x="510" y="100" width="120" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="112" y="120">저자 자신</text>
    <text x="112" y="138">독립성 없음</text>
    <text x="238" y="120">같은 팀의 동료</text>
    <text x="238" y="138">약간의 독립성</text>
    <text x="390" y="120">팀 밖의 테스터</text>
    <text x="390" y="138">높은 독립성</text>
    <text x="570" y="120">조직 밖의 테스터</text>
    <text x="570" y="138">매우 높은 독립성</text>
  </g>
</svg>
