  <text x="140" y="315" text-anchor="middle" fill="var(--text, #727981)">물리 계층</text>
  <!-- HLP 스택이 맡는 계층 -->
  <rect x="280.75" y="40.75" width="158.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
