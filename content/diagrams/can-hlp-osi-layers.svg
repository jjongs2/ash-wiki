  <text x="140" y="273" text-anchor="middle" fill="var(--text, #727981)">데이터 링크 계층</text>
  <rect x="40.75" y="292.75" width="198.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
