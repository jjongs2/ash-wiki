  <text x="140" y="189" text-anchor="middle" fill="var(--text, #727981)">전송 계층</text>
  <rect x="40.75" y="208.75" width="198.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="231" font-size="12" fill="var(--text, #727981)">3</text>
  <text x="140" y="231" text-anchor="middle" fill="var(--text, #727981)">네트워크 계층</text>
  <rect x="40.75" y="250.75" width="198.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
