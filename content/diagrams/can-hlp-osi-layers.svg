  <rect x="280.75" y="82.75" width="158.5" height="76.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="360" y="125" text-anchor="middle" font-size="12" fill="var(--text, #727981)">기능 일부</text>
  <rect x="280.75" y="166.75" width="158.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="360" y="189" text-anchor="middle" font-size="12" fill="var(--text, #727981)">대개 구현</text>
  <rect x="280.75" y="208.75" width="158.5" height="34.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="360" y="231" text-anchor="middle" font-size="12" fill="var(--text, #727981)">기능 일부</text>
  <!-- HLP와 ISO 11898 시리즈 -->
  <path d="M452 40 H458 V244 H452" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="468" y="147" fill="var(--text, #727981)">HLP</text>
  <path d="M452 250 H458 V328 H452" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="468" y="294" fill="var(--text, #727981)">ISO 11898 시리즈</text>
