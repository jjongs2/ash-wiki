<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 19 375.5 255.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="chirp의 시작 주파수, 대역폭, 지속 시간">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="200" x2="100" y2="34" />
    <line x1="100" y1="200" x2="420" y2="200" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="108" y="38">주파수</text>
    <text x="420" y="220" text-anchor="end">시간</text>
  </g>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="160" x2="380" y2="160" />
    <line x1="100" y1="70" x2="380" y2="70" />
    <line x1="120" y1="160" x2="120" y2="216" />
    <line x1="340" y1="70" x2="340" y2="216" />
  </g>

  <!-- chirp -->
  <line x1="120" y1="160" x2="340" y2="70" stroke="var(--ink, #727981)" stroke-width="3" stroke-linecap="round" />

  <!-- 대역폭과 지속 시간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="370" y1="72" x2="370" y2="158" />
    <line x1="122" y1="210" x2="338" y2="210" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="92" y="165" text-anchor="end"><tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="10">c</tspan></text>
    <text x="380" y="120" font-style="italic">B</text>
    <text x="230" y="232" text-anchor="middle"><tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="10">c</tspan></text>
    <text x="214" y="102" text-anchor="end">기울기 <tspan font-style="italic">S</tspan></text>
  </g>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TI 백서의 예: <tspan font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="9">c</tspan> = 77 GHz, <tspan font-style="italic">B</tspan> = 4 GHz, <tspan font-style="italic">T</tspan><tspan baseline-shift="sub" font-size="9">c</tspan> = 40 µs이면 <tspan font-style="italic">S</tspan> = 100 MHz/µs</text>
</svg>
