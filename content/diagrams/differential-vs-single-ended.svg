<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1 597.5 266" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>


  <!-- 차동: 두 선에 반대 극성 -->
  <text x="20" y="30" fill="#727981">차동</text>
  <line x1="30" y1="80" x2="87" y2="80" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="56" y="72" text-anchor="middle" font-size="12" fill="#727981">입력</text>
  <rect x="90" y="46" width="100" height="68" rx="4" fill="#825da9" />
  <text x="140" y="85" text-anchor="middle" fill="#f8fafd">드라이버</text>

  <g stroke="#727981" stroke-width="2">
    <line x1="190" y1="62" x2="410" y2="62" />
    <line x1="190" y1="98" x2="410" y2="98" />
  </g>
  <g font-size="12" fill="#727981">
    <text x="204" y="55">A</text>
    <text x="204" y="115">B</text>
  </g>
  <!-- 같은 비트에서 A는 오르고 B는 내린다 -->
  <g stroke="#727981" stroke-width="1.5">
    <path d="M270 52 H285 V40 H325 V52 H340" />
    <path d="M270 108 H285 V120 H325 V108 H340" />
  </g>

  <rect x="410" y="46" width="110" height="68" rx="4" fill="#337b47" />
  <text x="465" y="76" text-anchor="middle" fill="#f8fafd">수신기</text>
  <text x="465" y="96" text-anchor="middle" font-size="12" fill="#f8fafd">A − B로 판정</text>
  <line x1="520" y1="80" x2="577" y2="80" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="548" y="72" text-anchor="middle" font-size="12" fill="#727981">출력</text>

  <!-- 단일 종단: 선 하나를 접지 기준으로 -->
  <text x="20" y="160" fill="#727981">단일 종단</text>
  <line x1="30" y1="210" x2="87" y2="210" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="56" y="202" text-anchor="middle" font-size="12" fill="#727981">입력</text>
  <rect x="90" y="176" width="100" height="68" rx="4" fill="#825da9" />
  <text x="140" y="215" text-anchor="middle" fill="#f8fafd">드라이버</text>

  <line x1="190" y1="192" x2="410" y2="192" stroke="#727981" stroke-width="2" />
  <line x1="190" y1="228" x2="410" y2="228" stroke="#727981" stroke-width="1.5" stroke-dasharray="6 4" />
  <g font-size="12" fill="#727981">
    <text x="204" y="185">신호 선</text>
    <text x="204" y="245">GND</text>
  </g>
  <path d="M270 182 H285 V170 H325 V182 H340" stroke="#727981" stroke-width="1.5" />

  <rect x="410" y="176" width="110" height="68" rx="4" fill="#337b47" />
  <text x="465" y="206" text-anchor="middle" fill="#f8fafd">수신기</text>
  <text x="465" y="226" text-anchor="middle" font-size="12" fill="#f8fafd">문턱 전압과 비교</text>
  <line x1="520" y1="210" x2="577" y2="210" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="548" y="202" text-anchor="middle" font-size="12" fill="#727981">출력</text>
</svg>
