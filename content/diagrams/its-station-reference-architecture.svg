<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 240" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="ITS station 참조 구조">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 가운데 블록: 위에서부터 Applications, Facilities, Networking & Transport, Access -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="134.75" y="20.75" width="258.5" height="42.5" rx="2" />
    <rect x="134.75" y="72.75" width="258.5" height="42.5" rx="2" />
    <rect x="134.75" y="124.75" width="258.5" height="42.5" rx="2" />
    <rect x="134.75" y="176.75" width="258.5" height="42.5" rx="2" />
    <!-- 곁의 개체: 왼쪽 Management, 오른쪽 Security -->
    <rect x="20.75" y="20.75" width="102.5" height="198.5" rx="2" />
