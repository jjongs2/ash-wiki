<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 7 482 184" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- edge -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="26">rising edge</text>
    <text x="260" y="26">falling edge</text>
    <text x="340" y="26">rising edge</text>
  </g>

  <!-- 입력 신호 -->
  <text x="50" y="54" text-anchor="end" fill="var(--text, #727981)">high</text>
  <text x="50" y="94" text-anchor="end" fill="var(--text, #727981)">low</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="140" y1="34" x2="140" y2="164" />
    <line x1="260" y1="34" x2="260" y2="122" />
    <line x1="340" y1="34" x2="340" y2="164" />
  </g>
  <path d="M60 90 H140 V50 H260 V90 H340 V50 H460 V90 H490" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- 잰 값 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="142" y1="116" x2="258" y2="116" />
    <line x1="262" y1="116" x2="338" y2="116" />
    <line x1="142" y1="160" x2="338" y2="160" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="200" y="136">high 구간</text>
    <text x="300" y="136">low 구간</text>
    <text x="240" y="180">주기</text>
  </g>
</svg>
