<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.25 -9.5 525.75 280" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
