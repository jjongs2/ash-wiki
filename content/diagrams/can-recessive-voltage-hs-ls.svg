<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.5 -9.5 600 280" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <text x="300" y="16" text-anchor="middle" fill="var(--text, #727981)">recessive 출력 전압</text>

  <!-- 고속: TJA1042 -->
  <line x1="80" y1="30" x2="80" y2="220" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="74" y1="40" x2="86" y2="40" />
    <line x1="74" y1="130" x2="86" y2="130" />
    <line x1="74" y1="220" x2="86" y2="220" />
  </g>
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="68" y="44">VCC</text>
    <text x="68" y="134">0.5 VCC</text>
    <text x="68" y="224">0 V</text>
  </g>
  <line x1="90" y1="126" x2="190" y2="126" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <line x1="90" y1="134" x2="190" y2="134" stroke="var(--orange, #b0540d)" stroke-width="3" stroke-dasharray="5 4" />
  <text x="198" y="124" font-size="12" fill="var(--text, #727981)">CAN_H, CAN_L</text>
  <text x="198" y="140" font-size="12" fill="var(--text, #727981)">약 0.5 VCC (2~3 V)</text>
  <text x="165" y="255" text-anchor="middle" fill="var(--text, #727981)">고속 · TJA1042</text>

  <!-- 저속 내결함성: TJA1055 -->
  <line x1="380" y1="30" x2="380" y2="220" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="374" y1="40" x2="386" y2="40" />
    <line x1="374" y1="220" x2="386" y2="220" />
  </g>
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="368" y="44">VCC</text>
    <text x="368" y="224">0 V</text>
  </g>
  <line x1="390" y1="47" x2="460" y2="47" stroke="var(--orange, #b0540d)" stroke-width="3" stroke-dasharray="5 4" />
  <text x="468" y="44" font-size="12" fill="var(--text, #727981)">CAN_L</text>
  <text x="468" y="60" font-size="12" fill="var(--text, #727981)">VCC − 0.2 V 이상</text>
  <line x1="390" y1="213" x2="460" y2="213" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <text x="468" y="202" font-size="12" fill="var(--text, #727981)">CAN_H</text>
  <text x="468" y="218" font-size="12" fill="var(--text, #727981)">0.2 V 이하</text>
  <text x="465" y="255" text-anchor="middle" fill="var(--text, #727981)">저속 내결함성 · TJA1055</text>
