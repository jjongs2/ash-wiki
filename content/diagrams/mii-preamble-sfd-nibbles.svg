    <rect x="218" y="96" width="44" height="28" />
    <rect x="262" y="96" width="44" height="28" />
    <rect x="130" y="124" width="44" height="28" />
    <rect x="174" y="124" width="44" height="28" />
    <rect x="218" y="124" width="44" height="28" />
    <rect x="262" y="124" width="44" height="28" />
    <rect x="130" y="152" width="44" height="28" />
    <rect x="174" y="152" width="44" height="28" />
    <rect x="218" y="152" width="44" height="28" />
    <rect x="262" y="152" width="44" height="28" />
    <rect x="130" y="180" width="44" height="28" />
    <rect x="174" y="180" width="44" height="28" />
    <rect x="218" y="180" width="44" height="28" />
    <rect x="262" y="180" width="44" height="28" />
