<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 -7 448 255.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="MII로 보내는 프리앰블과 SFD의 니블">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 묶음 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M130 36 V30 H304 V36" />
    <path d="M308 36 V30 H418 V36" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="217" y="22">프리앰블 니블 14개</text>
    <text x="363" y="22">SFD</text>
    <text x="152" y="54">1</text>
    <text x="196" y="54">2</text>
    <text x="240" y="54">⋯</text>
    <text x="284" y="54">14</text>
    <text x="334" y="54">첫 니블</text>
    <text x="390" y="54">둘째 니블</text>
  </g>

  <!-- 행 이름 -->
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
