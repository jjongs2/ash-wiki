    <text x="152" y="143">0</text><text x="196" y="143">0</text><text x="240" y="143">⋯</text><text x="284" y="143">0</text>
    <text x="152" y="171">1</text><text x="196" y="171">1</text><text x="240" y="171">⋯</text><text x="284" y="171">1</text>
    <text x="152" y="199">0</text><text x="196" y="199">0</text><text x="240" y="199">⋯</text><text x="284" y="199">0</text>
  </g>

  <!-- SFD 칸 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="306.75" y="96.75" width="54.5" height="26.5" />
    <rect x="362.75" y="96.75" width="54.5" height="26.5" />
    <rect x="306.75" y="124.75" width="54.5" height="26.5" />
    <rect x="362.75" y="124.75" width="54.5" height="26.5" />
    <rect x="306.75" y="152.75" width="54.5" height="26.5" />
    <rect x="362.75" y="152.75" width="54.5" height="26.5" />
    <rect x="306.75" y="180.75" width="54.5" height="26.5" />
    <rect x="362.75" y="180.75" width="54.5" height="26.5" />
