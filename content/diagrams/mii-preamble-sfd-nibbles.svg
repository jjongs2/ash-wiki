    <text x="88" y="114">TXD0</text>
    <text x="88" y="142">TXD1</text>
    <text x="88" y="170">TXD2</text>
    <text x="88" y="198">TXD3</text>
  </g>

  <!-- TX_EN -->
  <path d="M96 84 H130 V64 H434" stroke="var(--ink, #727981)" stroke-width="3" />

