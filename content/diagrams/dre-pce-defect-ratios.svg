<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 210" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 범위 -->
  <text x="20" y="24" fill="var(--text, #727981)">ISTQB CTAL-TA 강의계획서</text>

  <!-- 지표 이름 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="90" y="64.5">DRE</text>
    <text x="90" y="154.5">PCE</text>
  </g>

  <!-- 새어 나간 결함 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="380" y="44" width="150" height="32" />
    <rect x="340" y="134" width="190" height="32" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="455" y="64.5">운영으로 샌 결함</text>
    <text x="435" y="154.5">뒤 단계로 샌 결함</text>
  </g>

  <!-- 그 안에서 없앤 결함 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="110" y="44" width="270" height="32" />
    <rect x="110" y="134" width="230" height="32" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="245" y="64.5">릴리스 전에 없앤 결함</text>
    <text x="225" y="154.5">같은 단계에서 없앤 결함</text>
  </g>

  <!-- 전체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M110 82 V88 H530 V82" />
    <path d="M110 172 V178 H530 V172" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="320" y="104">전체 결함</text>
    <text x="320" y="194">어느 단계에 들어간 결함</text>
  </g>
</svg>
