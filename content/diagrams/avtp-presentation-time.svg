<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -7.5 530 234" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="talker와 listener의 표현 시각">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-stream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="20" y="40" width="96" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="68" y="63" text-anchor="middle" fill="var(--text, #727981)">talker</text>
  <rect x="20" y="130" width="96" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="68" y="153" text-anchor="middle" fill="var(--text, #727981)">listener</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="116" y1="58" x2="450" y2="58" />
    <line x1="116" y1="148" x2="450" y2="148" />
  </g>

  <!-- 표현 시각을 적어 보냄 -->
  <line x1="170" y1="58" x2="290" y2="145" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-stream)" />
  <circle cx="170" cy="58" r="3.5" fill="var(--ink, #727981)" />
  <text x="215" y="118" text-anchor="end" font-size="12" fill="var(--text, #727981)">표현 시각을 적은 스트림</text>

  <!-- 표현 시각 -->
  <line x1="330" y1="30" x2="330" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="330" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">표현 시각</text>

  <!-- 데이터를 내놓음 -->
  <rect x="330.75" y="136.75" width="118.5" height="22.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="390" y="152" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">데이터를 내놓음</text>

  <!-- gPTP 시각 축 -->
  <line x1="116" y1="200" x2="450" y2="200" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="458" y="204" font-size="12" fill="var(--text, #727981)">gPTP 시각</text>
</svg>
