<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -7.5 680.5 234" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
    <marker id="arrow-stream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="20" y="40" width="96" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="68" y="63" text-anchor="middle" fill="#727981">talker</text>
  <rect x="20" y="130" width="96" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="68" y="153" text-anchor="middle" fill="#727981">listener</text>
  <g stroke="#727981" stroke-width="1.5">
    <line x1="116" y1="58" x2="600" y2="58" />
    <line x1="116" y1="148" x2="600" y2="148" />
  </g>

  <!-- 표현 시각을 적어 보냄 -->
  <line x1="180" y1="58" x2="318" y2="145" stroke="#727981" stroke-width="2" marker-end="url(#arrow-stream)" />
  <circle cx="180" cy="58" r="3.5" fill="#727981" />
  <text x="238" y="118" text-anchor="end" font-size="12" fill="#727981">표현 시각을 적은 스트림</text>

  <!-- 표현 시각 -->
  <line x1="480" y1="30" x2="480" y2="200" stroke="#727981" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="480" y="22" text-anchor="middle" font-size="12" fill="#727981">표현 시각</text>

  <!-- 데이터를 내놓음 -->
  <rect x="480" y="136" width="120" height="24" rx="3" fill="#337b47" />
  <text x="540" y="152" text-anchor="middle" font-size="12" fill="#f8fafd">데이터를 내놓음</text>

  <!-- gPTP 시각 축 -->
  <line x1="116" y1="200" x2="600" y2="200" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="608" y="204" font-size="12" fill="#727981">gPTP 시각</text>
</svg>
