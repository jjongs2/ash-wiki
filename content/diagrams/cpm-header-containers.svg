<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 4 464 268" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CPM의 header와 container">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 메시지: header, Management Container, 그 뒤의 container 1~8개 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="46.75" width="62.5" height="176.5" rx="2" />
    <rect x="90.75" y="46.75" width="100.5" height="176.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="52" y="140">header</text>
    <text x="141" y="131">Management</text>
    <text x="141" y="149">Container</text>
  </g>

  <!-- 넣을 수 있는 container -->
  <text x="322" y="34" text-anchor="middle" font-size="12" fill="var(--text, #727981)">합해 1~8개</text>
  <rect x="199.75" y="46.75" width="244.5" height="176.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="211.75" y="58.75" width="220.5" height="32.5" rx="2" />
    <rect x="211.75" y="98.75" width="220.5" height="32.5" rx="2" />
    <rect x="211.75" y="138.75" width="220.5" height="32.5" rx="2" />
    <rect x="211.75" y="178.75" width="220.5" height="32.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="322" y="80">originating container</text>
    <text x="322" y="120">Sensor Information Container</text>
    <text x="322" y="160">Perception Region Container</text>
    <text x="322" y="200">Perceived Object Container</text>
  </g>

  <text x="20" y="248" font-size="12" fill="var(--text, #727981)">차량 ITS-S의 CPM: originating container로 Originating Vehicle Container 하나</text>
</svg>
