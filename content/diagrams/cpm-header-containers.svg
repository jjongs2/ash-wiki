<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 1.5 340 318" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CPM의 header와 container">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- header, 그 곁에 Management Container와 그 뒤의 container 1~8개 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="20.75" width="62.5" height="241.5" rx="2" />
    <rect x="91.75" y="20.75" width="228.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="52" y="146">header</text>
    <text x="206" y="43">Management Container</text>
  </g>

  <!-- 넣을 수 있는 container 묶음(실선 틀) -->
  <text x="206" y="76" text-anchor="middle" font-size="12" fill="var(--text, #727981)">합해 1~8개</text>
  <rect x="91.75" y="85.75" width="228.5" height="176.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="103.75" y="97.75" width="204.5" height="32.5" rx="2" />
    <rect x="103.75" y="137.75" width="204.5" height="32.5" rx="2" />
    <rect x="103.75" y="177.75" width="204.5" height="32.5" rx="2" />
    <rect x="103.75" y="217.75" width="204.5" height="32.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="206" y="119">originating container</text>
    <text x="206" y="159">Sensor Information Container</text>
    <text x="206" y="199">Perception Region Container</text>
    <text x="206" y="239">Perceived Object Container</text>
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="282">차량 ITS-S의 CPM: originating container로</text>
    <text x="20" y="298">Originating Vehicle Container 하나</text>
  </g>
</svg>
