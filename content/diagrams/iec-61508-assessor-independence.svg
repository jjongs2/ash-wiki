<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 4.5 529.5 170.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">IEC 61508:2010 · functional safety assessment의 평가자</text>

  <!-- SIL -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="36.75" width="127" height="28.5" />
    <rect x="147.75" y="36.75" width="127" height="28.5" />
    <rect x="274.75" y="36.75" width="127" height="28.5" />
    <rect x="401.75" y="36.75" width="127" height="28.5" />
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="84.25" y="55">SIL 1</text>
    <text x="211.25" y="55">SIL 2</text>
    <text x="338.25" y="55">SIL 3</text>
    <text x="465.25" y="55">SIL 4</text>
  </g>

  <!-- 요구하는 독립성 -->
  <path d="M26 70 V76 H142.5 V70 M153 70 V76 H396.5 V70 M407 70 V76 H523.5 V70" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="84.25" y="94">같은 조직 안</text>
    <text x="84.25" y="110">독립된 사람</text>
    <text x="274.75" y="94">요인에 따라 달라짐</text>
    <text x="274.75" y="110">예: 시스템 복잡도, 설계의 새로움,</text>
    <text x="274.75" y="126">개발자의 이전 경험</text>
    <text x="465.25" y="94">독립된 조직</text>
  </g>
  <line x1="20.75" y1="146" x2="527" y2="146" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="274.75" y="164" text-anchor="middle" fill="var(--text, #727981)">요구하는 독립성이 오름</text>
</svg>
