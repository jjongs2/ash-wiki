<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 524 434" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
  </defs>

  <!-- ISO 11898:1993과 추록 -->
  <rect x="84" y="30" width="128" height="92" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="94" y="40" width="108" height="32" rx="2" />
    <rect x="94" y="80" width="108" height="32" rx="2" />
    <rect x="30" y="150" width="108" height="32" rx="2" />
    <rect x="30" y="300" width="108" height="32" rx="2" />
    <rect x="30" y="356" width="108" height="32" rx="2" />
    <rect x="158" y="150" width="108" height="32" rx="2" />
    <rect x="158" y="300" width="108" height="32" rx="2" />
    <rect x="158" y="356" width="108" height="32" rx="2" />
    <rect x="158" y="412" width="108" height="32" rx="2" />
    <rect x="302" y="200" width="108" height="32" rx="2" />
    <rect x="302" y="250" width="108" height="32" rx="2" />
    <rect x="426" y="40" width="108" height="32" rx="2" />
    <rect x="426" y="150" width="108" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="148" y="60">ISO 11898:1993</text>
    <text x="148" y="100">Amd 1:1995</text>
    <text x="84" y="170">ISO 11898-1:2003</text>
    <text x="84" y="320">ISO 11898-1:2015</text>
    <text x="84" y="376">ISO 11898-1:2024</text>
    <text x="212" y="170">ISO 11898-2:2003</text>
    <text x="212" y="320">ISO 11898-2:2016</text>
    <text x="212" y="376">ISO 11898-2:2024</text>
    <text x="212" y="432">ISO 11898-2:2026</text>
    <text x="356" y="220">ISO 11898-5:2007</text>
    <text x="356" y="270">ISO 11898-6:2013</text>
    <text x="480" y="60">ISO 11519-2:1994</text>
    <text x="480" y="170">ISO 11898-3:2006</text>
  </g>

  <!-- 다음 판 -->
