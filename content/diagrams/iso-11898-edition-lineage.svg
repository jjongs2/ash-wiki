    <path d="M168 122 V136 H212 V148" />
    <line x1="84" y1="182" x2="84" y2="298" />
    <line x1="84" y1="332" x2="84" y2="354" />
    <line x1="212" y1="182" x2="212" y2="298" />
    <line x1="212" y1="332" x2="212" y2="354" />
    <line x1="212" y1="388" x2="212" y2="410" />
    <line x1="480" y1="72" x2="480" y2="148" />
  </g>

  <!-- 통합 -->
  <g stroke="var(--violet, #825da9)" stroke-width="1.5" marker-end="url(#arrow-violet)">
    <path d="M302 216 H278 V310 H268" />
    <path d="M302 266 H290 V322 H268" />
