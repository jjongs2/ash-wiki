<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 768 272" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--violet, #825da9)" />
    </marker>
  </defs>

  <!-- ISO 11898:1993과 추록 -->
  <rect x="20" y="30" width="136" height="92" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30" y="40" width="116" height="32" rx="2" />
    <rect x="30" y="80" width="116" height="32" rx="2" />
    <rect x="196" y="30" width="116" height="32" rx="2" />
    <rect x="348" y="30" width="116" height="32" rx="2" />
    <rect x="500" y="30" width="116" height="32" rx="2" />
    <rect x="196" y="90" width="116" height="32" rx="2" />
    <rect x="348" y="90" width="116" height="32" rx="2" />
    <rect x="500" y="90" width="116" height="32" rx="2" />
    <rect x="652" y="90" width="116" height="32" rx="2" />
    <rect x="196" y="150" width="116" height="32" rx="2" />
    <rect x="196" y="200" width="116" height="32" rx="2" />
    <rect x="30" y="250" width="116" height="32" rx="2" />
    <rect x="196" y="250" width="116" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="88" y="60">ISO 11898:1993</text>
    <text x="88" y="100">Amd 1:1995</text>
    <text x="254" y="50">ISO 11898-1:2003</text>
    <text x="406" y="50">ISO 11898-1:2015</text>
    <text x="558" y="50">ISO 11898-1:2024</text>
    <text x="254" y="110">ISO 11898-2:2003</text>
    <text x="406" y="110">ISO 11898-2:2016</text>
    <text x="558" y="110">ISO 11898-2:2024</text>
    <text x="710" y="110">ISO 11898-2:2026</text>
    <text x="254" y="170">ISO 11898-5:2007</text>
    <text x="254" y="220">ISO 11898-6:2013</text>
    <text x="88" y="270">ISO 11519-2:1994</text>
    <text x="254" y="270">ISO 11898-3:2006</text>
  </g>

  <!-- 다음 판 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <path d="M156 60 H170 V46 H194" />
    <path d="M156 92 H170 V106 H194" />
    <line x1="312" y1="46" x2="346" y2="46" />
    <line x1="464" y1="46" x2="498" y2="46" />
    <line x1="312" y1="106" x2="346" y2="106" />
    <line x1="464" y1="106" x2="498" y2="106" />
    <line x1="616" y1="106" x2="650" y2="106" />
    <line x1="146" y1="266" x2="194" y2="266" />
  </g>

  <!-- 통합 -->
  <g stroke="var(--violet, #825da9)" stroke-width="1.5" marker-end="url(#arrow-violet)">
    <path d="M312 166 H390 V124" />
    <path d="M312 216 H420 V124" />
