<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 252" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 하드웨어 하나에 Machine 둘 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="20.75" width="600.5" height="210.5" rx="2" />
    <rect x="40.75" y="56.75" width="270.5" height="154.5" rx="2" />
    <rect x="330.75" y="56.75" width="270.5" height="154.5" rx="2" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="34" y="44">하드웨어</text>
    <text x="54" y="80">Machine</text>
    <text x="344" y="80">Machine</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="54" y="98">Adaptive Platform 인스턴스 하나</text>
    <text x="344" y="98">Adaptive Platform 인스턴스 하나</text>
  </g>

  <!-- 프로세스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="56" y="114" width="115" height="32" rx="2" />
    <rect x="56" y="160" width="239" height="32" rx="2" />
    <rect x="346" y="160" width="239" height="32" rx="2" />
  </g>
  <!-- AA 2: 여러 인스턴스에 나뉜 프로세스 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="180" y="114" width="115" height="32" rx="2" />
    <rect x="346" y="114" width="115" height="32" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="113.5" y="134.5">AA 1 프로세스</text>
    <text x="175.5" y="180.5">functional cluster 프로세스</text>
    <text x="465.5" y="180.5">functional cluster 프로세스</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="237.5" y="134.5">AA 2 프로세스</text>
    <text x="403.5" y="134.5">AA 2 프로세스</text>
  </g>
</svg>
