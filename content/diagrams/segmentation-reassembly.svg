<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 620 397" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>


  <!-- 방향: 분할은 왼쪽에서, 재조립은 오른쪽(받는 쪽)에서 -->
  <g text-anchor="middle" fill="#727981">
    <text x="95" y="66">(N) SDU</text>
    <text x="565" y="66">(N) SDU</text>
    <text x="210" y="40">분할</text>
    <text x="450" y="40">재조립</text>
    <text x="330" y="374">(N) PDU</text>
  </g>
  <text x="565" y="310" text-anchor="middle" font-size="12" fill="#727981">받는 쪽</text>

  <!-- 나누기 전의 (N) SDU: 마지막 조각이 짧다 -->
  <rect x="40" y="78" width="110" height="210" rx="4" fill="#336fb8" />
  <g stroke="#f8fafd" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="44" y1="138" x2="146" y2="138" />
    <line x1="44" y1="198" x2="146" y2="198" />
    <line x1="44" y1="258" x2="146" y2="258" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="95" y="113">조각 1</text>
    <text x="95" y="173">조각 2</text>
    <text x="95" y="233">조각 3</text>
    <text x="95" y="278">조각 4</text>
  </g>

  <!-- 위에서 아래로 쌓인 (N) PDU 넷: 조각마다 PCI가 붙는다 -->
  <g fill="#b0540d">
    <rect x="270" y="20" width="120" height="20" rx="3" />
    <rect x="270" y="112" width="120" height="20" rx="3" />
    <rect x="270" y="204" width="120" height="20" rx="3" />
    <rect x="270" y="296" width="120" height="20" rx="3" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#f8fafd">
    <text x="330" y="34">PCI</text>
    <text x="330" y="126">PCI</text>
    <text x="330" y="218">PCI</text>
    <text x="330" y="310">PCI</text>
  </g>
  <g fill="#336fb8">
    <rect x="270" y="41" width="120" height="59" rx="3" />
    <rect x="270" y="133" width="120" height="59" rx="3" />
    <rect x="270" y="225" width="120" height="59" rx="3" />
    <rect x="270" y="317" width="120" height="29" rx="3" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="330" y="75">조각 1</text>
    <text x="330" y="167">조각 2</text>
    <text x="330" y="259">조각 3</text>
    <text x="330" y="336">조각 4</text>
  </g>

  <!-- 분할: SDU의 조각이 PDU로 -->
  <g stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="152" y1="108" x2="267" y2="70" />
    <line x1="152" y1="168" x2="267" y2="162" />
    <line x1="152" y1="228" x2="267" y2="254" />
    <line x1="152" y1="273" x2="267" y2="331" />
  </g>

  <!-- 재조립: PDU의 조각이 다시 SDU로 -->
  <g stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="392" y1="70" x2="507" y2="108" />
    <line x1="392" y1="162" x2="507" y2="168" />
    <line x1="392" y1="254" x2="507" y2="228" />
    <line x1="392" y1="331" x2="507" y2="273" />
  </g>

  <!-- 받는 쪽이 되돌린 (N) SDU -->
  <rect x="510" y="78" width="110" height="210" rx="4" fill="#336fb8" />
  <g stroke="#f8fafd" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="514" y1="138" x2="616" y2="138" />
    <line x1="514" y1="198" x2="616" y2="198" />
    <line x1="514" y1="258" x2="616" y2="258" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="565" y="113">조각 1</text>
    <text x="565" y="173">조각 2</text>
    <text x="565" y="233">조각 3</text>
    <text x="565" y="278">조각 4</text>
  </g>
</svg>
