<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 27 521 229" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="구문·분기·결정·조건 커버리지와 MC/DC의 포함 관계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <g fill="var(--text, #727981)">
    <text x="416" y="60">CTFL 강의계획서</text>
  </g>

  <!-- 포함 화살표: 포함하는 쪽에서 포함되는 쪽으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="260" y1="56" x2="160" y2="56" />
    <line x1="260" y1="180" x2="160" y2="148" />
    <line x1="260" y1="196" x2="160" y2="228" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="48">포함</text>
    <text x="210" y="148">포함</text>
    <text x="210" y="236">포함</text>
  </g>

  <!-- 커버리지 기준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="140" height="32" rx="2" />
    <rect x="260" y="40" width="140" height="32" rx="2" />
    <rect x="20" y="132" width="140" height="32" rx="2" />
    <rect x="20" y="212" width="140" height="32" rx="2" />
    <rect x="260" y="172" width="140" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="60">구문 커버리지</text>
    <text x="330" y="60">분기 커버리지</text>
    <text x="90" y="152">결정 커버리지</text>
    <text x="90" y="232">조건 커버리지</text>
    <text x="330" y="192">MC/DC</text>
  </g>
</svg>
