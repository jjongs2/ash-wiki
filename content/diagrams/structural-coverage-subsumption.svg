<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -5.5 621 269" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 범위 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="24">CTFL 강의계획서</text>
    <text x="20" y="112">NASA MC/DC 튜토리얼</text>
  </g>

  <!-- 포함 화살표: 포함되는 쪽에서 포함하는 쪽으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="56" x2="260" y2="56" />
    <line x1="160" y1="148" x2="260" y2="180" />
    <line x1="160" y1="228" x2="260" y2="196" />
    <line x1="400" y1="188" x2="460" y2="188" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="48">포함됨</text>
    <text x="210" y="148">포함됨</text>
    <text x="210" y="236">포함됨</text>
    <text x="430" y="180">포함됨</text>
  </g>

  <!-- 서로 포함하지 않음 -->
  <path d="M90 164 V174 M90 202 V212" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="90" y="192" text-anchor="middle" fill="var(--text, #727981)">서로 포함하지 않음</text>

  <!-- 커버리지 기준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="140" height="32" rx="4" />
    <rect x="260" y="40" width="140" height="32" rx="4" />
    <rect x="20" y="132" width="140" height="32" rx="4" />
    <rect x="20" y="212" width="140" height="32" rx="4" />
    <rect x="260" y="172" width="140" height="32" rx="4" />
    <rect x="460" y="172" width="140" height="32" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="60">구문 커버리지</text>
    <text x="330" y="60">분기 커버리지</text>
    <text x="90" y="152">결정 커버리지</text>
    <text x="90" y="232">조건 커버리지</text>
    <text x="330" y="192">조건/결정 커버리지</text>
    <text x="530" y="192">MC/DC</text>
  </g>
</svg>
