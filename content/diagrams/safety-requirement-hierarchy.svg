<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 439.5 220" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="290" y="48" fill="var(--text, #727981)">ISO 26262-1:2018</text>

  <!-- 요구사항 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="20.75" width="219.5" height="46.5" rx="2" />
    <rect x="20.75" y="96.75" width="219.5" height="46.5" rx="2" />
    <rect x="20.75" y="172.75" width="219.5" height="46.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="39" font-size="13">Safety goal</text>
    <text x="130" y="57">HARA 결과 · 최상위</text>
    <text x="130" y="115" font-size="13">FSR</text>
    <text x="130" y="133">구현과 상관없는 안전 동작·조치</text>
    <text x="130" y="191" font-size="13">TSR</text>
    <text x="130" y="209">완화 요구사항 포함</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="68" x2="130" y2="95" />
    <line x1="130" y1="144" x2="130" y2="171" />
  </g>
  <text x="140" y="162" fill="var(--text, #727981)">구현하려고 끌어냄</text>

  <!-- concept -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="241" y1="120" x2="280" y2="120" />
    <line x1="241" y1="196" x2="280" y2="196" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="290" y="115" font-size="13">Functional safety concept</text>
    <text x="290" y="133">ISO 26262-3</text>
    <text x="290" y="191" font-size="13">Technical safety concept</text>
    <text x="290" y="209">ISO 26262-4</text>
  </g>
</svg>
