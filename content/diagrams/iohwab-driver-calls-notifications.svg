<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 9.5 528 381.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- SW-C와 RTE -->
  <rect x="172" y="20" width="180" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="262" y="40" text-anchor="middle" fill="var(--text, #727981)">Sensor/actuator SW-C</text>
  <line x1="262" y1="54" x2="262" y2="78" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="272" y="70" fill="var(--text, #727981)">GET · SET</text>
  <rect x="172" y="80" width="180" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="262" y="100" text-anchor="middle" fill="var(--text, #727981)">RTE</text>
  <line x1="262" y1="114" x2="262" y2="164" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ECU Abstraction Layer -->
  <rect x="8.75" y="140.75" width="506.5" height="76.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="20" y="158" fill="var(--text, #727981)">ECU Abstraction Layer</text>
  <rect x="26" y="166" width="472" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="262" y="188" text-anchor="middle" fill="var(--text, #727981)">IoHwAb</text>

  <!-- MCAL -->
  <rect x="8.75" y="262.75" width="506.5" height="84.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="60" y="280" fill="var(--text, #727981)">MCAL</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="26" y="290" width="52" height="40" rx="2" />
    <rect x="86" y="290" width="52" height="40" rx="2" />
    <rect x="146" y="290" width="52" height="40" rx="2" />
    <rect x="206" y="290" width="52" height="40" rx="2" />
    <rect x="266" y="290" width="52" height="40" rx="2" />
    <rect x="326" y="290" width="52" height="40" rx="2" />
    <rect x="386" y="290" width="52" height="40" rx="2" />
    <rect x="446" y="290" width="52" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="52" y="314">Port</text>
    <text x="112" y="314">DIO</text>
    <text x="172" y="314">ADC</text>
    <text x="232" y="314">PWM</text>
    <text x="292" y="314">ICU</text>
    <text x="352" y="314">OCU</text>
    <text x="412" y="314">GPT</text>
    <text x="472" y="314">SPI</text>
  </g>

  <!-- API 호출 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="52" y1="204" x2="52" y2="288" />
    <line x1="112" y1="204" x2="112" y2="288" />
    <line x1="165" y1="204" x2="165" y2="288" />
    <line x1="225" y1="204" x2="225" y2="288" />
    <line x1="285" y1="204" x2="285" y2="288" />
    <line x1="345" y1="204" x2="345" y2="288" />
    <line x1="405" y1="204" x2="405" y2="288" />
    <line x1="472" y1="204" x2="472" y2="288" />
  </g>

  <!-- notification -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)">
    <line x1="179" y1="288" x2="179" y2="204" />
    <line x1="239" y1="288" x2="239" y2="204" />
    <line x1="299" y1="288" x2="299" y2="204" />
    <line x1="359" y1="288" x2="359" y2="204" />
    <line x1="419" y1="288" x2="419" y2="204" />
  </g>

  <!-- 범례 -->
  <line x1="139" y1="376" x2="175" y2="376" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="183" y="380" fill="var(--text, #727981)">API 호출</text>
  <line x1="279" y1="376" x2="315" y2="376" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="323" y="380" fill="var(--text, #727981)">notification</text>
</svg>
