<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 9.5 663 381.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- SW-C와 RTE -->
  <rect x="230" y="20" width="180" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="320" y="40" text-anchor="middle" fill="var(--text, #727981)">Sensor/actuator SW-C</text>
  <line x1="320" y1="54" x2="320" y2="78" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="330" y="70" fill="var(--text, #727981)">GET · SET</text>
  <rect x="230" y="80" width="180" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="320" y="100" text-anchor="middle" fill="var(--text, #727981)">RTE</text>
  <line x1="320" y1="114" x2="320" y2="164" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ECU Abstraction Layer -->
  <rect x="8.75" y="140.75" width="642.5" height="76.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="20" y="158" fill="var(--text, #727981)">ECU Abstraction Layer</text>
  <rect x="40" y="166" width="580" height="36" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="188" text-anchor="middle" fill="var(--text, #727981)">IoHwAb</text>

  <!-- MCAL -->
  <rect x="8.75" y="262.75" width="642.5" height="84.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="20" y="280" fill="var(--text, #727981)">MCAL</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="290" width="62" height="40" rx="4" />
    <rect x="114" y="290" width="62" height="40" rx="4" />
    <rect x="188" y="290" width="62" height="40" rx="4" />
    <rect x="262" y="290" width="62" height="40" rx="4" />
    <rect x="336" y="290" width="62" height="40" rx="4" />
    <rect x="410" y="290" width="62" height="40" rx="4" />
    <rect x="484" y="290" width="62" height="40" rx="4" />
    <rect x="558" y="290" width="62" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="71" y="314">Port</text>
    <text x="145" y="314">DIO</text>
    <text x="219" y="314">ADC</text>
    <text x="293" y="314">PWM</text>
    <text x="367" y="314">ICU</text>
    <text x="441" y="314">OCU</text>
    <text x="515" y="314">GPT</text>
    <text x="589" y="314">SPI</text>
  </g>

  <!-- API 호출 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="71" y1="204" x2="71" y2="288" />
    <line x1="145" y1="204" x2="145" y2="288" />
    <line x1="212" y1="204" x2="212" y2="288" />
    <line x1="286" y1="204" x2="286" y2="288" />
    <line x1="360" y1="204" x2="360" y2="288" />
    <line x1="434" y1="204" x2="434" y2="288" />
    <line x1="508" y1="204" x2="508" y2="288" />
    <line x1="589" y1="204" x2="589" y2="288" />
  </g>

  <!-- notification -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)">
    <line x1="226" y1="288" x2="226" y2="204" />
    <line x1="300" y1="288" x2="300" y2="204" />
    <line x1="374" y1="288" x2="374" y2="204" />
    <line x1="448" y1="288" x2="448" y2="204" />
    <line x1="522" y1="288" x2="522" y2="204" />
  </g>

  <!-- 범례 -->
  <line x1="200" y1="376" x2="236" y2="376" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="244" y="380" fill="var(--text, #727981)">API 호출</text>
  <line x1="340" y1="376" x2="376" y2="376" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="384" y="380" fill="var(--text, #727981)">notification</text>
</svg>
