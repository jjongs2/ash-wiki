<svg xmlns="http://www.w3.org/2000/svg" viewBox="52.5 7.5 529.5 199.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- polarity -->
  <text x="124" y="26" text-anchor="end" fill="var(--text, #727981)">polarity</text>
  <text x="124" y="60" text-anchor="end" fill="var(--text, #727981)">PWM_HIGH</text>
  <text x="124" y="140" text-anchor="end" fill="var(--text, #727981)">PWM_LOW</text>
  <g text-anchor="start" fill="var(--text, #727981)">
    <text x="550" y="44">high</text>
    <text x="550" y="76">low</text>
    <text x="550" y="124">high</text>
    <text x="550" y="156">low</text>
  </g>

  <!-- 주기 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="140" y1="34" x2="140" y2="196" />
    <line x1="210" y1="34" x2="210" y2="172" />
    <line x1="340" y1="34" x2="340" y2="196" />
    <line x1="410" y1="34" x2="410" y2="152" />
    <line x1="540" y1="34" x2="540" y2="152" />
  </g>

  <!-- 파형 -->
  <path d="M140 72 V40 H210 V72 H340 V40 H410 V72 H540" stroke="var(--ink, #727981)" stroke-width="3" />
  <path d="M140 120 V152 H210 V120 H340 V152 H410 V120 H540" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- duty cycle과 주기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="142" y1="168" x2="208" y2="168" />
    <line x1="142" y1="192" x2="338" y2="192" />
  </g>
  <text x="216" y="172" fill="var(--text, #727981)">duty cycle</text>
  <text x="346" y="196" fill="var(--text, #727981)">주기</text>
</svg>
