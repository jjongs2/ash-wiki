<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 620 270" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 신호 이름 -->
  <text x="96" y="60" text-anchor="end" fill="var(--text, #727981)">보낸 비트</text>
  <text x="96" y="130" text-anchor="end" fill="var(--text, #727981)">받은 비트</text>

  <!-- 지연 재기 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="150" y="30">EDL</text>
    <text x="245" y="30">r0</text>
  </g>
  <path d="M110 40 H190 V70 H300" stroke="var(--ink, #727981)" stroke-width="3" />
  <path d="M110 110 H240 V140 H300" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M190 72 V164" />
    <path d="M240 142 V164" />
  </g>
  <line x1="192" y1="160" x2="238" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="215" y="180" text-anchor="middle" font-size="12" fill="var(--text, #727981)">잰 지연</text>
  <text x="205" y="210" text-anchor="middle" font-size="12" fill="var(--text, #727981)">EDL에서 r0으로 넘어가는 에지</text>

  <!-- 데이터 구간 -->
  <path d="M360 70 H420 V40 H500 V70 H620" stroke="var(--ink, #727981)" stroke-width="3" />
  <path d="M360 140 H490 V110 H570 V140 H620" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M420 72 V164" />
    <path d="M490 142 V164" />
  </g>
  <path d="M480 24 V150" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="476" y="18" text-anchor="end" font-size="12" fill="var(--text, #727981)">샘플 포인트(무시)</text>
  <path d="M530 24 V164" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="534" y="18" font-size="12" fill="var(--text, #727981)">보조 샘플 포인트</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="422" y1="160" x2="488" y2="160" />
    <line x1="492" y1="160" x2="528" y2="160" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="455" y="180">잰 지연</text>
    <text x="510" y="180">오프셋</text>
    <text x="490" y="210">데이터 구간의 송신 노드</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="240">Bosch CAN FD 1.0. 보조 샘플 포인트는 잰 지연에 오프셋(예: 데이터 비트 시간의 절반)을 더해 tq 단위로 내림한 자리다.</text>
    <text x="40" y="260">보낸 비트가 끝난 뒤에 놓일 수도 있다. 송신 노드는 샘플 포인트에서 받은 비트 값을 무시한다.</text>
  </g>
</svg>
