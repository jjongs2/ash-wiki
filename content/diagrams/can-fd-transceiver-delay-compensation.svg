<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.5 -1 527 292" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 신호 이름 -->
  <text x="96" y="60" text-anchor="end" fill="var(--text, #727981)">보낸 비트</text>
  <text x="96" y="130" text-anchor="end" fill="var(--text, #727981)">받은 비트</text>

  <!-- 지연 재기 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="140" y="30">EDL</text>
    <text x="215" y="30">r0</text>
  </g>
  <path d="M110 40 H170 V70 H260" stroke="var(--ink, #727981)" stroke-width="3" />
  <path d="M110 110 H220 V140 H260" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M170 72 V164" />
    <path d="M220 142 V164" />
  </g>
  <line x1="172" y1="160" x2="218" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="195" y="180" text-anchor="middle" font-size="12" fill="var(--text, #727981)">잰 지연</text>
  <text x="185" y="210" text-anchor="middle" font-size="12" fill="var(--text, #727981)">EDL에서 r0으로 넘어가는 에지</text>

  <!-- 데이터 구간 -->
  <path d="M295 70 H355 V40 H435 V70 H545" stroke="var(--ink, #727981)" stroke-width="3" />
  <path d="M295 140 H425 V110 H505 V140 H545" stroke="var(--blue, #336fb8)" stroke-width="3" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <path d="M355 72 V164" />
    <path d="M425 142 V164" />
  </g>
  <path d="M415 24 V150" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="411" y="18" text-anchor="end" font-size="12" fill="var(--text, #727981)">샘플 포인트(무시)</text>
  <path d="M465 24 V164" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="469" y="18" font-size="12" fill="var(--text, #727981)">보조 샘플 포인트</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="357" y1="160" x2="423" y2="160" />
    <line x1="427" y1="160" x2="463" y2="160" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="390" y="180">잰 지연</text>
    <text x="445" y="180">오프셋</text>
    <text x="425" y="210">데이터 구간의 송신 노드</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="240">Bosch CAN FD 1.0. 보조 샘플 포인트는 잰 지연에 오프셋(예: 데이터 비트 시간의 절반)을 더해</text>
    <text x="40" y="260">tq 단위로 내림한 자리다. 보낸 비트가 끝난 뒤에 놓일 수도 있다.</text>
    <text x="40" y="280">송신 노드는 샘플 포인트에서 받은 비트 값을 무시한다.</text>
  </g>
</svg>
