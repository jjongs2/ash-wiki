<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 -7 552 385" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="PnC에서 인증서를 쓰는 곳">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="300" y="22" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ISO 15118-20:2022</text>

  <!-- 참여자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="36" width="100" height="32" rx="2" />
    <rect x="260" y="36" width="100" height="32" rx="2" />
    <rect x="400" y="36" width="140" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="57">EVCC</text>
    <text x="310" y="57">SECC</text>
    <text x="470" y="57">secondary actor</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="150" y1="68" x2="150" y2="320" />
    <line x1="310" y1="68" x2="310" y2="320" />
    <line x1="470" y1="68" x2="470" y2="320" />
  </g>

  <!-- 인증서와 서명 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="308" y1="110" x2="152" y2="110" />
    <line x1="152" y1="160" x2="308" y2="160" />
    <line x1="152" y1="230" x2="308" y2="230" />
    <line x1="152" y1="290" x2="468" y2="290" />
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="230" y="102">SECC 인증서</text>
    <text x="230" y="152">차량 인증서</text>
    <text x="230" y="222">XML 서명(계약 인증서)</text>
    <text x="390" y="282">XML 서명(계약 인증서)</text>
  </g>

  <!-- 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M126 92 H120 V170 H126" />
    <path d="M126 210 H120 V300 H126" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="112" y="136">TLS</text>
    <text x="112" y="250">응용 계층</text>
    <text x="112" y="268" font-size="12">둘 중 하나가 검증</text>
  </g>

  <!-- 범례 -->
  <line x1="150" y1="352" x2="190" y2="352" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="198" y="356" font-size="12" fill="var(--text, #727981)">화살표가 닿는 쪽이 진위를 확인하거나 서명을 검증함</text>
</svg>
