<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -9 520 233.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 3년 = 240 단위, 발급 = x 20, 만료 = x 260 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="36" width="240" height="32" />
    <rect x="260" y="36" width="240" height="32" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="56.5">적합 인증서의 유효 기간</text>
    <text x="380" y="56.5">유효 기간 3년 연장</text>
  </g>

  <!-- 또는 새 인증서 -->
  <circle cx="260" cy="96" r="4" fill="var(--ink, #727981)" />
  <text x="272" y="100.5" fill="var(--text, #727981)">또는 새 인증서 발급</text>

  <!-- 만료 전 신청 -->
  <line x1="226" y1="28" x2="226" y2="124" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="226" y="20">만료 전 신청</text>
    <text x="226" y="140">긍정적 평가를 거쳐</text>
  </g>

  <!-- 기간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M20 154 V160 H260 V154" />
    <path d="M260 154 V160 H500 V154" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="178">발급일부터 최대 3년</text>
    <text x="380" y="178">3년</text>
  </g>
  <text x="20" y="204" font-size="12" fill="var(--text, #727981)">요구를 더는 충족하지 않으면 승인 당국이 인증서를 철회한다</text>
</svg>
