<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -9 640 233.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 3년 = 300 단위, 발급 = x 20 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="36" width="300" height="32" rx="4" />
    <rect x="320" y="36" width="300" height="32" rx="4" stroke-dasharray="5 4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="56.5">적합 인증서의 유효 기간</text>
    <text x="470" y="56.5">유효 기간 3년 연장</text>
  </g>

  <!-- 또는 새 인증서 -->
  <circle cx="320" cy="96" r="4" fill="var(--ink, #727981)" />
  <text x="332" y="100.5" fill="var(--text, #727981)">또는 새 인증서 발급</text>

  <!-- 만료 전 신청 -->
  <line x1="270" y1="28" x2="270" y2="124" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="270" y="20">만료 전 신청</text>
    <text x="270" y="140">긍정적 평가를 거쳐</text>
  </g>

  <!-- 기간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M20 154 V160 H320 V154" />
    <path d="M320 154 V160 H620 V154" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="178">발급일부터 최대 3년</text>
    <text x="470" y="178">3년</text>
  </g>
  <text x="20" y="204" font-size="12" fill="var(--text, #727981)">요구를 더는 충족하지 않으면 승인 당국이 인증서를 철회한다</text>
</svg>
