  <!-- 심볼 윈도, 네트워크 idle 시간 -->
  <rect x="366" y="70" width="64" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="432" y="70" width="70" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />

  <!-- 단위 이름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="39" y1="112" x2="39" y2="126" />
