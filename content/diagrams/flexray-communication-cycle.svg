    <text x="293" y="32">동적 세그먼트</text>
    <text x="293" y="50" font-size="12">선택 사항</text>
    <text x="398" y="32">심볼 윈도</text>
    <text x="398" y="50" font-size="12">선택 사항</text>
    <text x="467" y="32">네트워크</text>
