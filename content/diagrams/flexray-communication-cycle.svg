    <rect x="230.75" y="70.75" width="4.5" height="38.5" />
    <rect x="238.75" y="70.75" width="4.5" height="38.5" />
    <rect x="246.75" y="70.75" width="4.5" height="38.5" />
    <rect x="254.75" y="70.75" width="4.5" height="38.5" />
    <rect x="262.75" y="70.75" width="4.5" height="38.5" />
    <rect x="270.75" y="70.75" width="4.5" height="38.5" />
    <rect x="278.75" y="70.75" width="4.5" height="38.5" />
    <rect x="286.75" y="70.75" width="4.5" height="38.5" />
    <rect x="294.75" y="70.75" width="4.5" height="38.5" />
    <rect x="302.75" y="70.75" width="4.5" height="38.5" />
    <rect x="310.75" y="70.75" width="4.5" height="38.5" />
    <rect x="318.75" y="70.75" width="4.5" height="38.5" />
    <rect x="326.75" y="70.75" width="4.5" height="38.5" />
    <rect x="334.75" y="70.75" width="4.5" height="38.5" />
    <rect x="342.75" y="70.75" width="4.5" height="38.5" />
    <rect x="350.75" y="70.75" width="4.5" height="38.5" />
