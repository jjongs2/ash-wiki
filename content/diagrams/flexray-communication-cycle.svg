<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 세그먼트 이름 -->
  <g stroke="#727981" stroke-width="1.5">
    <path d="M20 64 V58 H278 V64" />
    <path d="M282 64 V58 H460 V64" />
    <path d="M462 64 V58 H560 V64" />
    <path d="M562 64 V58 H700 V64" />
  </g>
  <g text-anchor="middle" fill="#727981">
