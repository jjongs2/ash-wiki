  <rect x="562" y="70" width="138" height="40" fill="#825da9" />

  <!-- 단위 이름 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="45" y1="112" x2="45" y2="126" />
    <line x1="286" y1="112" x2="286" y2="126" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="45" y="141">정적 슬롯</text>
    <text x="286" y="141">미니슬롯</text>
  </g>

  <!-- 사이클 -->
  <path d="M20 152 V158 H700 V152" stroke="#727981" stroke-width="1.5" />
  <text x="360" y="178" text-anchor="middle" fill="#727981">통신 사이클 · 주기적으로 되풀이</text>
