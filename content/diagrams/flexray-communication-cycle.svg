<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 0 522 200" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 세그먼트 이름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 64 V58 H218 V64" />
    <path d="M222 64 V58 H364 V64" />
    <path d="M366 64 V58 H430 V64" />
    <path d="M432 64 V58 H502 V64" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
