  <!-- 사이클 -->
  <path d="M20 152 V158 H502 V152" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="261" y="178" text-anchor="middle" fill="var(--text, #727981)">통신 사이클 · 주기적으로 되풀이</text>
