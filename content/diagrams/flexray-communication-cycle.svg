    <rect x="292.75" y="70.75" width="6.5" height="38.5" />
    <rect x="302.75" y="70.75" width="6.5" height="38.5" />
    <rect x="312.75" y="70.75" width="6.5" height="38.5" />
    <rect x="322.75" y="70.75" width="6.5" height="38.5" />
    <rect x="332.75" y="70.75" width="6.5" height="38.5" />
    <rect x="342.75" y="70.75" width="6.5" height="38.5" />
    <rect x="352.75" y="70.75" width="6.5" height="38.5" />
    <rect x="362.75" y="70.75" width="6.5" height="38.5" />
    <rect x="372.75" y="70.75" width="6.5" height="38.5" />
    <rect x="382.75" y="70.75" width="6.5" height="38.5" />
    <rect x="392.75" y="70.75" width="6.5" height="38.5" />
    <rect x="402.75" y="70.75" width="6.5" height="38.5" />
    <rect x="412.75" y="70.75" width="6.5" height="38.5" />
    <rect x="422.75" y="70.75" width="6.5" height="38.5" />
    <rect x="432.75" y="70.75" width="6.5" height="38.5" />
    <rect x="442.75" y="70.75" width="6.5" height="38.5" />
