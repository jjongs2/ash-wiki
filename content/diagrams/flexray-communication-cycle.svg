    <text x="286" y="141">미니슬롯</text>
  </g>

  <!-- 사이클 -->
  <path d="M20 152 V158 H700 V152" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="360" y="178" text-anchor="middle" fill="var(--text, #727981)">통신 사이클 · 주기적으로 되풀이</text>
