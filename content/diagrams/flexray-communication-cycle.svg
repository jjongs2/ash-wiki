<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.5 9.5 534 304.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="FlexRay 통신 사이클과 시간의 네 단계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 단계 이름 -->
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="116" y="47">통신 사이클</text>
    <text x="116" y="102">arbitration grid</text>
    <text x="116" y="192">macrotick</text>
    <text x="116" y="262">microtick</text>
  </g>

  <!-- 통신 사이클: 세그먼트 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="128" y="20" width="146" height="46" />
    <rect x="278.75" y="20.75" width="116.5" height="44.5" stroke-dasharray="5 4" />
    <rect x="400.75" y="20.75" width="68.5" height="44.5" stroke-dasharray="5 4" />
    <rect x="474" y="20" width="76" height="46" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="201" y="48">정적 세그먼트</text>
    <text x="337" y="39">동적 세그먼트</text>
    <text x="337" y="56" font-size="12">선택 사항</text>
    <text x="435" y="39">심볼 윈도</text>
    <text x="435" y="56" font-size="12">선택 사항</text>
    <text x="512" y="39">네트워크</text>
    <text x="512" y="56">idle 시간</text>
  </g>

  <!-- arbitration grid: 정적 슬롯, 미니슬롯 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="128.75" y="80.75" width="24.5" height="34.5" />
    <rect x="158.75" y="80.75" width="24.5" height="34.5" />
    <rect x="218.75" y="80.75" width="24.5" height="34.5" />
    <rect x="248.75" y="80.75" width="24.5" height="34.5" />
  </g>
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="278.75" y="80.75" width="4.5" height="34.5" />
    <rect x="286.75" y="80.75" width="4.5" height="34.5" />
    <rect x="294.75" y="80.75" width="4.5" height="34.5" />
    <rect x="302.75" y="80.75" width="4.5" height="34.5" />
    <rect x="310.75" y="80.75" width="4.5" height="34.5" />
    <rect x="318.75" y="80.75" width="4.5" height="34.5" />
    <rect x="350.75" y="80.75" width="4.5" height="34.5" />
    <rect x="358.75" y="80.75" width="4.5" height="34.5" />
    <rect x="366.75" y="80.75" width="4.5" height="34.5" />
    <rect x="374.75" y="80.75" width="4.5" height="34.5" />
    <rect x="382.75" y="80.75" width="4.5" height="34.5" />
    <rect x="390.75" y="80.75" width="4.5" height="34.5" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="141" y1="118" x2="141" y2="124" />
    <line x1="377" y1="118" x2="377" y2="124" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="141" y="138">정적 슬롯</text>
    <text x="377" y="138">미니슬롯</text>
  </g>

  <!-- macrotick -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="128" y="174" width="26" height="30" />
    <rect x="154" y="174" width="26" height="30" />
    <rect x="180" y="174" width="26" height="30" />
    <rect x="206" y="174" width="26" height="30" />
    <rect x="258" y="174" width="26" height="30" />
    <rect x="284" y="174" width="26" height="30" />
    <rect x="310" y="174" width="26" height="30" />
    <rect x="336" y="174" width="26" height="30" />
    <rect x="362" y="174" width="26" height="30" />
  </g>

  <!-- macrotick 하나를 펼친 microtick -->
  <path d="M128 206 L128 242 M154 206 L388 242" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="128" y="244" width="32.5" height="30" />
    <rect x="160.5" y="244" width="32.5" height="30" />
    <rect x="193" y="244" width="32.5" height="30" />
    <rect x="290.5" y="244" width="32.5" height="30" />
    <rect x="323" y="244" width="32.5" height="30" />
    <rect x="355.5" y="244" width="32.5" height="30" />
  </g>

  <!-- 생략: 칸의 수는 정해진 값이 아니다 -->
  <g fill="var(--ink, #727981)">
    <circle cx="194" cy="98" r="1.5" />
    <circle cx="201" cy="98" r="1.5" />
    <circle cx="208" cy="98" r="1.5" />
    <circle cx="330" cy="98" r="1.5" />
    <circle cx="337" cy="98" r="1.5" />
    <circle cx="344" cy="98" r="1.5" />
    <circle cx="238" cy="189" r="1.5" />
    <circle cx="245" cy="189" r="1.5" />
    <circle cx="252" cy="189" r="1.5" />
    <circle cx="250" cy="259" r="1.5" />
    <circle cx="258" cy="259" r="1.5" />
    <circle cx="266" cy="259" r="1.5" />
  </g>

  <!-- 시간 단위 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="402" y="185">네트워크 전체가 함께</text>
    <text x="402" y="201">쓰는 시간 단위</text>
    <text x="402" y="255">노드의 발진기 클록에서</text>
    <text x="402" y="271">나온 노드별 시간 단위</text>
  </g>

  <text x="128" y="302" font-size="12" fill="var(--text, #727981)">NXP 앱노트에 따른 네 단계. 통신 사이클은 주기적으로 되풀이한다.</text>
</svg>
