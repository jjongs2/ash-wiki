    <rect x="292" y="70" width="8" height="40" />
    <rect x="302" y="70" width="8" height="40" />
    <rect x="312" y="70" width="8" height="40" />
    <rect x="322" y="70" width="8" height="40" />
    <rect x="332" y="70" width="8" height="40" />
    <rect x="342" y="70" width="8" height="40" />
    <rect x="352" y="70" width="8" height="40" />
    <rect x="362" y="70" width="8" height="40" />
    <rect x="372" y="70" width="8" height="40" />
    <rect x="382" y="70" width="8" height="40" />
    <rect x="392" y="70" width="8" height="40" />
    <rect x="402" y="70" width="8" height="40" />
    <rect x="412" y="70" width="8" height="40" />
    <rect x="422" y="70" width="8" height="40" />
    <rect x="432" y="70" width="8" height="40" />
