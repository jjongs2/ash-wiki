<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 6.5 639.5 184.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- LET 구간 -->
  <line x1="182" y1="36" x2="598" y2="36" stroke="#727981" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="390" y="28" text-anchor="middle" font-size="12" fill="#727981">LET 구간</text>
  <g stroke="#727981" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="180" y1="30" x2="180" y2="160" />
    <line x1="600" y1="30" x2="600" y2="160" />
  </g>

  <!-- 행 이름 -->
  <g text-anchor="end" fill="#727981">
    <text x="164" y="73">일찍 끝나는 실행</text>
    <text x="164" y="121">선점된 실행</text>
  </g>

  <!-- 일찍 끝나는 실행 -->
  <rect x="200" y="56" width="130" height="24" rx="3" fill="#336fb8" />
  <text x="265" y="72" text-anchor="middle" font-size="12" fill="#f8fafd">실행</text>
  <line x1="334" y1="68" x2="596" y2="68" stroke="#727981" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#tip)" />

  <!-- 선점된 실행 -->
  <rect x="250" y="104" width="80" height="24" rx="3" fill="#336fb8" />
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#f8fafd">실행</text>
  <rect x="330" y="104" width="100" height="24" rx="3" fill="#b0540d" />
  <text x="380" y="120" text-anchor="middle" font-size="12" fill="#f8fafd">다른 태스크</text>
  <rect x="430" y="104" width="110" height="24" rx="3" fill="#336fb8" />
  <text x="485" y="120" text-anchor="middle" font-size="12" fill="#f8fafd">실행</text>
  <line x1="544" y1="116" x2="596" y2="116" stroke="#727981" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#tip)" />

  <!-- 시간 축 -->
  <line x1="170" y1="148" x2="660" y2="148" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="668" y="152" font-size="12" fill="#727981">시간</text>
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="180" y="178">입력을 읽음</text>
    <text x="600" y="178">출력을 씀</text>
  </g>
</svg>
