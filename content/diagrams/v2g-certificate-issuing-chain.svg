<svg xmlns="http://www.w3.org/2000/svg" viewBox="39.5 -7 413.5 387.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="V2G root CA에서 leaf 인증서까지의 발급">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="210" y="22" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ISO 15118-20:2022</text>

  <!-- CA -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="36" width="140" height="36" rx="2" />
    <rect x="140" y="112" width="140" height="36" rx="2" />
  </g>
  <rect x="100" y="188" width="120" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="59">V2G root CA</text>
    <text x="210" y="135">sub-CA</text>
    <text x="160" y="211">둘째 sub-CA</text>
  </g>

  <!-- leaf 인증서 -->
  <rect x="60" y="264" width="300" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="76" y="276" width="126" height="36" rx="2" />
    <rect x="218" y="276" width="126" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="139" y="299">계약 인증서</text>
    <text x="281" y="299">SECC 인증서</text>
  </g>
  <text x="370" y="299" fill="var(--text, #727981)">leaf 인증서</text>

  <!-- 발급 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="210" y1="72" x2="210" y2="111" />
    <line x1="170" y1="148" x2="170" y2="187" />
    <line x1="170" y1="224" x2="170" y2="263" />
    <line x1="250" y1="148" x2="250" y2="263" />
  </g>

  <!-- 범례 -->
  <line x1="60" y1="352" x2="88" y2="352" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="210" y="344" width="28" height="16" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="96" y="356">인증서 발급</text>
    <text x="246" y="356">거치지 않을 수 있음</text>
  </g>
</svg>
