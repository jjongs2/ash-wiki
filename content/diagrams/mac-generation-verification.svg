<svg xmlns="http://www.w3.org/2000/svg" viewBox="51.5 10 515 290" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 두 쪽과 그 키 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="20" width="140" height="32" rx="4" />
    <rect x="360" y="20" width="140" height="32" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="41">송신자</text>
    <text x="430" y="41">수신자</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="52" x2="130" y2="64" />
    <line x1="430" y1="52" x2="430" y2="64" />
    <line x1="130" y1="92" x2="130" y2="290" />
    <line x1="430" y1="92" x2="430" y2="290" />
  </g>
  <line x1="170" y1="78" x2="390" y2="78" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="var(--text, #727981)">나눠 가짐</text>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="90" y="64" width="80" height="28" rx="2" />
    <rect x="390" y="64" width="80" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="130" y="83">비밀 키</text>
    <text x="430" y="83">비밀 키</text>
  </g>

  <!-- 생성 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="138" y="124">메시지와 비밀 키로</text>
    <text x="138" y="140">MAC 생성</text>
  </g>

  <!-- 보냄 -->
  <line x1="132" y1="164" x2="428" y2="180" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">메시지와 MAC (대개 함께 보냄)</text>

  <!-- 검증 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="438" y="210">받은 메시지와 MAC에</text>
    <text x="438" y="226">비밀 키로 MAC 검증 적용</text>
    <text x="438" y="258">성공하면 키를 나눠 가진</text>
    <text x="438" y="274">쪽에게서 왔고 바뀌지</text>
    <text x="438" y="290">않았다는 보증</text>
  </g>
</svg>
