<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 10 494 376" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="송신 쪽과 수신 쪽의 transformer chain">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- transformer chain -->
  <rect x="28" y="136" width="454" height="154" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="255" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RTE가 실행하는 transformer chain</text>

  <!-- 쪽 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="40">송신 쪽</text>
    <text x="380" y="40">수신 쪽</text>
  </g>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="60" width="180" height="36" rx="2" />
    <rect x="40" y="150" width="180" height="36" rx="2" />
    <rect x="40" y="240" width="180" height="36" rx="2" />
    <rect x="40" y="330" width="180" height="36" rx="2" />
    <rect x="290" y="60" width="180" height="36" rx="2" />
    <rect x="290" y="150" width="180" height="36" rx="2" />
    <rect x="290" y="240" width="180" height="36" rx="2" />
    <rect x="290" y="330" width="180" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="83">SW-C</text>
    <text x="130" y="173">SOME/IP Transformer</text>
    <text x="130" y="263">E2E Transformer</text>
    <text x="130" y="353">AUTOSAR COM</text>
    <text x="380" y="83">SW-C</text>
    <text x="380" y="173">SOME/IP Transformer</text>
    <text x="380" y="263">E2E Transformer</text>
    <text x="380" y="353">AUTOSAR COM</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="98" x2="130" y2="148" marker-end="url(#arrow)" />
    <line x1="130" y1="188" x2="130" y2="238" marker-end="url(#arrow)" />
    <line x1="130" y1="278" x2="130" y2="328" marker-end="url(#arrow)" />
    <line x1="380" y1="328" x2="380" y2="278" marker-end="url(#arrow)" />
    <line x1="380" y1="238" x2="380" y2="188" marker-end="url(#arrow)" />
    <line x1="380" y1="148" x2="380" y2="98" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <g text-anchor="end">
      <text x="122" y="127">데이터</text>
      <text x="122" y="217">바이트 배열</text>
      <text x="122" y="307">바이트 배열</text>
    </g>
    <text x="388" y="307">바이트 배열</text>
    <text x="388" y="217">바이트 배열</text>
    <text x="388" y="127">데이터</text>
  </g>
</svg>
