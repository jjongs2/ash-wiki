<svg xmlns="http://www.w3.org/2000/svg" viewBox="31.5 1.5 810 190" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- transformer chain -->
  <rect x="244" y="32" width="392" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="440" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RTE가 실행하는 transformer chain</text>

  <!-- 쪽 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="82" y="67">송신 쪽</text>
    <text x="82" y="155">수신 쪽</text>
  </g>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="92" y="44" width="70" height="36" rx="2" />
    <rect x="252" y="44" width="156" height="36" rx="2" />
    <rect x="498" y="44" width="130" height="36" rx="2" />
    <rect x="718" y="44" width="112" height="36" rx="2" />
    <rect x="92" y="132" width="70" height="36" rx="2" />
    <rect x="252" y="132" width="156" height="36" rx="2" />
    <rect x="498" y="132" width="130" height="36" rx="2" />
    <rect x="718" y="132" width="112" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="127" y="67">SW-C</text>
    <text x="330" y="67">SOME/IP Transformer</text>
    <text x="563" y="67">E2E Transformer</text>
    <text x="774" y="67">AUTOSAR COM</text>
    <text x="127" y="155">SW-C</text>
    <text x="330" y="155">SOME/IP Transformer</text>
    <text x="563" y="155">E2E Transformer</text>
    <text x="774" y="155">AUTOSAR COM</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="164" y1="62" x2="250" y2="62" marker-end="url(#arrow)" />
    <line x1="410" y1="62" x2="496" y2="62" marker-end="url(#arrow)" />
    <line x1="630" y1="62" x2="716" y2="62" marker-end="url(#arrow)" />
    <line x1="716" y1="150" x2="630" y2="150" marker-end="url(#arrow)" />
    <line x1="496" y1="150" x2="410" y2="150" marker-end="url(#arrow)" />
    <line x1="250" y1="150" x2="164" y2="150" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="203" y="54">데이터</text>
    <text x="453" y="54">바이트 배열</text>
    <text x="677" y="54">바이트 배열</text>
    <text x="677" y="142">바이트 배열</text>
    <text x="453" y="142">바이트 배열</text>
    <text x="203" y="142">데이터</text>
  </g>
</svg>
