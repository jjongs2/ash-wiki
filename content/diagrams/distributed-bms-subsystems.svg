<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 10 460.5 312" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="분산 BMS의 구성">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 셀: 직렬로 이은 셀과 셀마다의 감지선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M40 34 V40 M30 40 H50 M35 45 H45 M40 45 V58 M30 58 H50 M35 63 H45 M40 63 V76 M30 76 H50 M35 81 H45 M40 81 V94 M30 94 H50 M35 99 H45 M40 99 V106" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M40 34 H80 M40 52 H80 M40 70 H80 M40 88 H80 M40 106 H80" />
  </g>
  <text x="22" y="74" text-anchor="end" fill="var(--text, #727981)">셀</text>

  <!-- CSU와 BDU -->
  <rect x="80.75" y="26.75" width="158.5" height="86.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="300.75" y="26.75" width="138.5" height="86.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="66">CSU</text>
    <text x="160" y="83" font-size="11">셀 전압·온도, 셀 밸런싱</text>
    <text x="370" y="74">BDU(BJB)</text>
  </g>

  <!-- 데이지 체인 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="160" y1="114" x2="160" y2="162" />
    <line x1="370" y1="114" x2="370" y2="162" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="168" y="142">데이지 체인</text>
    <text x="378" y="142">데이지 체인</text>
  </g>

  <!-- BCU -->
  <rect x="80.75" y="150.75" width="358.5" height="84.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="205" y1="177" x2="225" y2="177" />
    <line x1="305" y1="177" x2="325" y2="177" />
  </g>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="115.75" y="162.75" width="88.5" height="28.5" rx="2" />
    <rect x="225.75" y="162.75" width="78.5" height="28.5" rx="2" />
    <rect x="325.75" y="162.75" width="88.5" height="28.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="181">통신 칩</text>
    <text x="265" y="181">MCU</text>
    <text x="370" y="181">통신 칩</text>
  </g>
  <text x="92" y="225" fill="var(--text, #727981)">BCU</text>

  <!-- CAN과 차량 쪽 -->
  <line x1="265" y1="192" x2="265" y2="276" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="274" y="260" fill="var(--text, #727981)">CAN</text>
  <rect x="185.75" y="276.75" width="158.5" height="28.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="265" y="295" text-anchor="middle" fill="var(--text, #727981)">차량 제어 장치나 ECU</text>
</svg>
