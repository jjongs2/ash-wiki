<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 -1.5 554 255" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- OUI와 나머지 3옥텟 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="119" y="18">OUI · 24비트</text>
    <text x="119" y="34">등록 기관이 조직에 배정</text>
    <text x="281" y="18">나머지 3옥텟</text>
    <text x="281" y="34">조직이 제품마다 붙임</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M40 48 V42 H198 V48" />
    <path d="M202 48 V42 H360 V48" />
  </g>

  <!-- 여섯 옥텟 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="40.75" y="54.75" width="48.5" height="30.5" rx="2" />
    <rect x="94.75" y="54.75" width="48.5" height="30.5" rx="2" />
    <rect x="148.75" y="54.75" width="48.5" height="30.5" rx="2" />
  </g>
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="202.75" y="54.75" width="48.5" height="30.5" rx="2" />
    <rect x="256.75" y="54.75" width="48.5" height="30.5" rx="2" />
    <rect x="310.75" y="54.75" width="48.5" height="30.5" rx="2" />
  </g>
  <g fill="var(--on-fill, #f8fafd)" text-anchor="middle">
    <text x="65" y="75">AC</text>
    <text x="119" y="75">DE</text>
    <text x="173" y="75">48</text>
    <text x="227" y="75">23</text>
    <text x="281" y="75">45</text>
    <text x="335" y="75">67</text>
  </g>

  <!-- 첫 옥텟을 비트로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="88" x2="40" y2="122" />
    <line x1="90" y1="88" x2="360" y2="122" />
  </g>
  <text x="98" y="108" font-size="12" fill="var(--text, #727981)">첫 옥텟</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
    <rect x="80.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
    <rect x="120.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
    <rect x="160.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
    <rect x="200.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
    <rect x="240.75" y="124.75" width="38.5" height="30.5" fill="var(--surface, none)" />
  </g>
  <rect x="280.75" y="124.75" width="38.5" height="30.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="320.75" y="124.75" width="38.5" height="30.5" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <g font-size="12" fill="var(--on-fill, #f8fafd)" text-anchor="middle">
    <text x="300" y="144">U/L</text>
    <text x="340" y="144">I/G</text>
  </g>

  <!-- 두 비트의 뜻 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M340 156 V176 H384" />
    <path d="M300 156 V198 H384" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="390" y="180">I/G(최하위 비트): 개별 주소 / 그룹 주소</text>
    <text x="390" y="202">U/L: 전역 관리 / 로컬 관리</text>
  </g>

  <!-- 전송 순서 -->
  <line x1="360" y1="220" x2="40" y2="220" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="40" y="242" font-size="12" fill="var(--text, #727981)">바이트마다 최하위 비트부터 보낸다. I/G가 주소에서 가장 먼저 나간다</text>
</svg>
