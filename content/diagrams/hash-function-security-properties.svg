<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 5 590 181" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 열 머리 -->
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="24">입력</text>
    <text x="360" y="24">해시 값</text>
    <text x="530" y="24">입력</text>
  </g>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="59">역상 저항</text>
    <text x="20" y="111">제2역상 저항</text>
    <text x="20" y="163">충돌 저항</text>
  </g>

  <!-- 주어진 것 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="300" y="36" width="120" height="36" rx="2" />
    <rect x="130" y="88" width="120" height="36" rx="2" />
    <rect x="300" y="88" width="120" height="36" rx="2" />
    <rect x="300" y="140" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="360" y="59">주어진 해시 값</text>
    <text x="190" y="111">주어진 입력</text>
    <text x="360" y="111">같은 해시 값</text>
    <text x="360" y="163">같은 해시 값</text>
  </g>

  <!-- 찾을 것 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="130" y="36" width="120" height="36" rx="2" />
    <rect x="470" y="88" width="120" height="36" rx="2" />
    <rect x="130" y="140" width="120" height="36" rx="2" />
    <rect x="470" y="140" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="190" y="59">찾을 입력</text>
    <text x="530" y="111">찾을 다른 입력</text>
    <text x="190" y="163">찾을 입력</text>
    <text x="530" y="163">찾을 다른 입력</text>
  </g>

  <!-- 해시 함수 적용 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="250" y1="54" x2="298" y2="54" />
    <line x1="250" y1="106" x2="298" y2="106" />
    <line x1="470" y1="106" x2="422" y2="106" />
    <line x1="250" y1="158" x2="298" y2="158" />
    <line x1="470" y1="158" x2="422" y2="158" />
  </g>
</svg>
