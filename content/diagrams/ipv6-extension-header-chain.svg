  <text x="90" y="62" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Next Header</text>
  <rect x="164.75" y="20.75" width="118.5" height="54.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="224" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">확장 헤더</text>
  <text x="224" y="62" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">Next Header</text>
  <rect x="288.75" y="20.75" width="118.5" height="54.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="348" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">확장 헤더</text>
  <text x="348" y="62" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">Next Header</text>
  <rect x="412.75" y="20.75" width="128.5" height="54.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="477" y="53" text-anchor="middle" fill="var(--on-fill, #f8fafd)">위 계층 헤더</text>
  <!-- Next Header가 다음 헤더를 가리킴 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M106 78 V94 H208 V80" />
    <path d="M240 78 V94 H332 V80" />
    <path d="M364 78 V94 H461 V80" />
