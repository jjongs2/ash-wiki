  </defs>
  <rect x="20" y="20" width="140" height="56" rx="3" fill="#336fb8" />
  <text x="90" y="43" text-anchor="middle" fill="#f8fafd">기본 헤더</text>
  <text x="90" y="62" text-anchor="middle" font-size="12" fill="#f8fafd">Next Header</text>
  <rect x="164" y="20" width="120" height="56" rx="3" fill="#b0540d" />
