<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1 535 323" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="ADDW의 Area 1, Area 2, Area 3">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="24" fill="var(--text, #727981)">EU 위임 규정 2023/2590, ADDW</text>

  <!-- 옆에서 본 모습: 앞은 오른쪽 -->
  <text x="20" y="52" fill="var(--text, #727981)">옆에서 본 모습</text>

  <!-- 지붕과 앞유리 -->
  <path d="M30 86 H170 L230 146" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--text, #727981)">
    <text x="100" y="78" text-anchor="middle">지붕: Area 1</text>
    <text x="208" y="106">앞유리: Area 2</text>
  </g>

  <!-- 수평 기준과 30° 아래 평면 -->
  <line x1="60" y1="136" x2="280" y2="136" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="60" y1="136" x2="280" y2="263" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M110 136 A50 50 0 0 1 103.3 161" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="116" y="156" fill="var(--text, #727981)">30°</text>
  <text x="250" y="272" text-anchor="middle" fill="var(--text, #727981)">Area 3</text>

  <!-- ocular reference point와 운전석 R 점 -->
  <line x1="60" y1="136" x2="60" y2="226" stroke="var(--ink, #727981)" stroke-width="1" />
  <g fill="var(--ink, #727981)">
    <circle cx="60" cy="136" r="4" />
    <circle cx="60" cy="226" r="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="46" y="120">ocular reference point</text>
    <text x="68" y="196">635 mm</text>
    <text x="60" y="246" text-anchor="middle">운전석 R 점</text>
  </g>

  <!-- 위에서 본 모습: 앞은 위쪽 -->
  <text x="330" y="52" fill="var(--text, #727981)">위에서 본 모습</text>

  <line x1="425" y1="196" x2="425" y2="76" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="433" y="84" fill="var(--text, #727981)">앞</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="425" y1="196" x2="515" y2="133" />
    <line x1="425" y1="196" x2="335" y2="133" />
  </g>
  <path d="M425 156 A40 40 0 0 1 457.8 173.1 M425 156 A40 40 0 0 0 392.2 173.1" stroke="var(--ink, #727981)" stroke-width="1" />
  <g fill="var(--text, #727981)">
    <text x="440" y="150">55°</text>
    <text x="410" y="150" text-anchor="end">55°</text>
    <text x="352" y="188">Area 1</text>
    <text x="498" y="188" text-anchor="end">Area 1</text>
  </g>
  <circle cx="425" cy="196" r="4" fill="var(--ink, #727981)" />
  <text x="425" y="218" text-anchor="middle" fill="var(--text, #727981)">ocular reference point</text>

  <g fill="var(--text, #727981)">
    <text x="20" y="286">Area 2는 앞유리·창과 그 둘레 10°이다</text>
    <text x="20" y="304">Area 1과 Area 2에 든 곳은 기본적으로 Area 3에서 뺀다</text>
  </g>
</svg>
