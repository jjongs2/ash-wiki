<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 760 224" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Infineon AURIX TC3xx의 HSM 구조">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Infineon AURIX TC3xx</text>

  <!-- 주 코어 쪽 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="48" width="160" height="36" rx="2" />
    <rect x="20" y="112" width="160" height="36" rx="2" />
    <rect x="20" y="164" width="160" height="60" rx="2" />
    <rect x="280" y="108" width="120" height="44" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="100" y="71">주 코어</text>
    <text x="100" y="135">다른 버스 마스터</text>
    <text x="100" y="185">HSM 몫 플래시</text>
    <text x="340" y="128">브리지</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="100" y="201">키 저장 데이터 플래시 등</text>
    <text x="100" y="216">설정으로 HSM만 접근</text>
    <text x="340" y="144">방화벽</text>
  </g>

  <!-- 버스 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="220" y1="66" x2="220" y2="194" />
    <line x1="180" y1="66" x2="220" y2="66" />
    <line x1="180" y1="130" x2="280" y2="130" />
    <line x1="180" y1="194" x2="220" y2="194" />
    <line x1="400" y1="130" x2="440" y2="130" />
  </g>
  <circle cx="220" cy="130" r="3" fill="var(--ink, #727981)" />
  <text x="228" y="100" font-size="12" fill="var(--text, #727981)">버스</text>

  <!-- HSM -->
  <rect x="440" y="20" width="320" height="204" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="456" y="42" fill="var(--text, #727981)">HSM</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="456" y="56" width="140" height="44" rx="2" />
    <rect x="608" y="56" width="140" height="44" rx="2" />
    <rect x="456" y="112" width="140" height="44" rx="2" />
    <rect x="608" y="112" width="140" height="44" rx="2" />
    <rect x="456" y="168" width="140" height="44" rx="2" />
    <rect x="608" y="168" width="140" height="44" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="526" y="76">Arm Cortex-M3</text>
    <text x="678" y="83">메모리</text>
    <text x="526" y="139">AES-128</text>
    <text x="678" y="132">타원 곡선</text>
    <text x="526" y="195">SHA-224/256</text>
    <text x="678" y="195">TRNG</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="526" y="92">32비트</text>
    <text x="678" y="148">256비트</text>
  </g>
</svg>
