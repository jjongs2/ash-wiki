<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 512 144" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 단계가 차례로 이어진다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="16" y="52" width="120" height="36" />
    <rect x="136" y="52" width="120" height="36" />
    <rect x="256" y="52" width="120" height="36" />
    <rect x="376" y="52" width="120" height="36" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="76" y="75">Development</text>
    <text x="196" y="75">Evolution</text>
    <text x="316" y="75">Maintenance</text>
    <text x="436" y="75">Issue Notice</text>
  </g>

  <!-- 경계의 사건 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="16" y1="38" x2="16" y2="52" />
    <line x1="136" y1="38" x2="136" y2="52" />
    <line x1="496" y1="38" x2="496" y2="52" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="16" y="30">생명주기 시작</text>
    <text x="136" y="30" text-anchor="middle">첫 릴리스</text>
    <text x="496" y="30" text-anchor="end">생명주기 끝</text>
  </g>

  <!-- 단계마다 나오는 것 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="76" y="110">첫 릴리스까지</text>
    <text x="196" y="110">minor release ·</text>
    <text x="196" y="125">revision</text>
    <text x="316" y="110">revision으로</text>
    <text x="316" y="125">기존 내용만</text>
    <text x="436" y="110">알려진 문제</text>
    <text x="436" y="125">목록만 갱신</text>
  </g>
</svg>
