<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 129.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 단계가 차례로 이어진다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="52" width="180" height="36" />
    <rect x="200" y="52" width="180" height="36" />
    <rect x="380" y="52" width="180" height="36" />
    <rect x="560" y="52" width="180" height="36" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="75">Development</text>
    <text x="290" y="75">Evolution</text>
    <text x="470" y="75">Maintenance</text>
    <text x="650" y="75">Issue Notice</text>
  </g>

  <!-- 경계의 사건 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="20" y1="38" x2="20" y2="52" />
    <line x1="200" y1="38" x2="200" y2="52" />
    <line x1="740" y1="38" x2="740" y2="52" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="30">생명주기 시작</text>
    <text x="200" y="30" text-anchor="middle">첫 릴리스</text>
    <text x="740" y="30" text-anchor="end">생명주기 끝</text>
  </g>

  <!-- 단계마다 나오는 것 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="110" y="110">첫 릴리스까지</text>
    <text x="290" y="110">minor release · revision</text>
    <text x="470" y="110">revision으로 기존 내용만</text>
    <text x="650" y="110">알려진 문제 목록만 갱신</text>
  </g>
</svg>
