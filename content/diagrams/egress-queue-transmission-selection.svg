<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 0.5 776 237" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 들어오는 프레임과 우선순위 표 -->
  <text x="20" y="116" fill="var(--text, #727981)">프레임</text>
  <text x="20" y="132" fill="var(--text, #727981)">(PCP 0–7)</text>
  <line x1="78" y1="120" x2="100" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="102" y="84" width="96" height="72" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="150" y="108" text-anchor="middle" fill="var(--text, #727981)">우선순위</text>
  <text x="150" y="124" text-anchor="middle" fill="var(--text, #727981)">→ 트래픽 클래스</text>
  <text x="150" y="140" text-anchor="middle" fill="var(--text, #727981)">표</text>

  <!-- 표에서 큐로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M198 120 H212 V52 H232" marker-end="url(#arrow)" />
    <path d="M212 120 V102 H232" marker-end="url(#arrow)" />
    <path d="M212 120 V188 H232" marker-end="url(#arrow)" />
  </g>

  <!-- 행 이름 -->
  <text x="290" y="30" text-anchor="middle" fill="var(--text, #727981)">큐</text>
  <text x="420" y="30" text-anchor="middle" fill="var(--text, #727981)">전송 선택 알고리즘</text>
  <text x="536" y="30" text-anchor="middle" fill="var(--text, #727981)">게이트</text>

  <!-- 트래픽 클래스 7 -->
  <rect x="234" y="40" width="112" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="298.75" y="44.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="322.75" y="44.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="240" y="80" fill="var(--text, #727981)">트래픽 클래스 7</text>
  <line x1="346" y1="52" x2="358" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="360" y="40" width="120" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="420" y="56" text-anchor="middle" fill="var(--text, #727981)">credit-based shaper</text>
  <line x1="480" y1="52" x2="498" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="500.75" y="40.75" width="70.5" height="22.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="536" y="56" text-anchor="middle" fill="var(--on-fill, #f8fafd)">열림</text>

  <!-- 트래픽 클래스 6 -->
  <rect x="234" y="90" width="112" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="322.75" y="94.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="240" y="130" fill="var(--text, #727981)">트래픽 클래스 6</text>
  <line x1="346" y1="102" x2="358" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="360" y="90" width="120" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="420" y="106" text-anchor="middle" fill="var(--text, #727981)">credit-based shaper</text>
  <line x1="480" y1="102" x2="498" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="500" y="90" width="72" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="536" y="106" text-anchor="middle" fill="var(--text, #727981)">닫힘</text>

  <g fill="var(--ink, #727981)">
    <circle cx="290" cy="144" r="2" />
    <circle cx="290" cy="152" r="2" />
    <circle cx="290" cy="160" r="2" />
  </g>

  <!-- 트래픽 클래스 0 -->
  <rect x="234" y="176" width="112" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="274.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="298.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="322.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="240" y="216" fill="var(--text, #727981)">트래픽 클래스 0</text>
  <line x1="346" y1="188" x2="358" y2="188" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="360" y="176" width="120" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="420" y="192" text-anchor="middle" fill="var(--text, #727981)">strict priority</text>
  <line x1="480" y1="188" x2="498" y2="188" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="500.75" y="176.75" width="70.5" height="22.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="536" y="192" text-anchor="middle" fill="var(--on-fill, #f8fafd)">열림</text>

  <!-- 열린 게이트만 전송 선택으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M572 52 H600 V108 H618" marker-end="url(#arrow)" />
    <path d="M572 188 H600 V132 H618" marker-end="url(#arrow)" />
  </g>
  <rect x="620" y="96" width="80" height="48" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="660" y="116" text-anchor="middle" fill="var(--text, #727981)">전송</text>
  <text x="660" y="132" text-anchor="middle" fill="var(--text, #727981)">선택</text>
  <line x1="700" y1="120" x2="730" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="736" y="124" fill="var(--text, #727981)">포트</text>
</svg>
