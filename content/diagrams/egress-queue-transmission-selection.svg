<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 0.5 527 237" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="트래픽 클래스마다의 게이트와 전송 선택">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 들어오는 프레임과 우선순위 표 -->
  <text x="64" y="44" text-anchor="middle" fill="var(--text, #727981)">프레임</text>
  <text x="64" y="60" text-anchor="middle" fill="var(--text, #727981)">(우선순위 0–7)</text>
  <line x1="64" y1="66" x2="64" y2="82" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="20" y="84" width="88" height="72" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="64" y="108" text-anchor="middle" fill="var(--text, #727981)">우선순위</text>
  <text x="64" y="124" text-anchor="middle" fill="var(--text, #727981)">→ 트래픽 클래스</text>
  <text x="64" y="140" text-anchor="middle" fill="var(--text, #727981)">표</text>

  <!-- 표에서 큐로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M108 120 H118 V52 H128" marker-end="url(#arrow)" />
    <path d="M118 120 V102 H128" marker-end="url(#arrow)" />
    <path d="M118 120 V188 H128" marker-end="url(#arrow)" />
  </g>

  <!-- 행 이름 -->
  <text x="178" y="30" text-anchor="middle" fill="var(--text, #727981)">큐</text>
  <text x="299" y="30" text-anchor="middle" fill="var(--text, #727981)">전송 선택 알고리즘</text>
  <text x="400" y="30" text-anchor="middle" fill="var(--text, #727981)">게이트</text>

  <!-- 트래픽 클래스 7 -->
  <rect x="130" y="40" width="96" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="178.75" y="44.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="202.75" y="44.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="136" y="80" fill="var(--text, #727981)">트래픽 클래스 7</text>
  <line x1="226" y1="52" x2="238" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="240" y="40" width="118" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="299" y="56" text-anchor="middle" fill="var(--text, #727981)">credit-based shaper</text>
  <line x1="358" y1="52" x2="370" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="372.75" y="40.75" width="54.5" height="22.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="400" y="56" text-anchor="middle" fill="var(--on-fill, #f8fafd)">열림</text>

  <!-- 트래픽 클래스 6 -->
  <rect x="130" y="90" width="96" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="202.75" y="94.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="136" y="130" fill="var(--text, #727981)">트래픽 클래스 6</text>
  <line x1="226" y1="102" x2="238" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="240" y="90" width="118" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="299" y="106" text-anchor="middle" fill="var(--text, #727981)">credit-based shaper</text>
  <line x1="358" y1="102" x2="370" y2="102" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="372" y="90" width="56" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="400" y="106" text-anchor="middle" fill="var(--text, #727981)">닫힘</text>

  <g fill="var(--ink, #727981)">
    <circle cx="178" cy="144" r="2" />
    <circle cx="178" cy="152" r="2" />
    <circle cx="178" cy="160" r="2" />
  </g>

  <!-- 트래픽 클래스 0 -->
  <rect x="130" y="176" width="96" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="154.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="178.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="202.75" y="180.75" width="18.5" height="14.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="136" y="216" fill="var(--text, #727981)">트래픽 클래스 0</text>
  <line x1="226" y1="188" x2="238" y2="188" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="240" y="176" width="118" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="299" y="192" text-anchor="middle" fill="var(--text, #727981)">strict priority</text>
  <line x1="358" y1="188" x2="370" y2="188" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="372.75" y="176.75" width="54.5" height="22.5" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="400" y="192" text-anchor="middle" fill="var(--on-fill, #f8fafd)">열림</text>

  <!-- 열린 게이트만 전송 선택으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M428 52 H440 V108 H450" marker-end="url(#arrow)" />
    <path d="M428 188 H440 V132 H450" marker-end="url(#arrow)" />
  </g>
  <rect x="452" y="96" width="56" height="48" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="480" y="116" text-anchor="middle" fill="var(--text, #727981)">전송</text>
  <text x="480" y="132" text-anchor="middle" fill="var(--text, #727981)">선택</text>
  <line x1="480" y1="144" x2="480" y2="166" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="480" y="182" text-anchor="middle" fill="var(--text, #727981)">포트</text>
</svg>
