<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360.5 229.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="VSS 트리의 노드와 노드 이름">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 부모에서 자식으로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M32 50 V77 H44" />
    <path d="M56 92 V119 H68" />
    <path d="M80 134 V161 H92" />
  </g>

  <!-- branch -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="130" height="30" rx="2" />
    <rect x="44" y="62" width="130" height="30" rx="2" />
    <rect x="68" y="104" width="130" height="30" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="39.5">Vehicle</text>
    <text x="109" y="81.5">Cabin</text>
    <text x="133" y="123.5">RearviewMirror</text>
  </g>

  <!-- 데이터 항목 -->
  <rect x="92" y="146" width="130" height="30" rx="2" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />
  <text x="157" y="165.5" text-anchor="middle" fill="var(--on-fill, #f8fafd)">Dimmed</text>

  <!-- 노드 종류 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="160" y="39">뿌리 branch</text>
    <text x="184" y="81">branch</text>
    <text x="208" y="123">branch</text>
    <text x="232" y="165">데이터 항목(리프 노드)</text>
  </g>

  <!-- 노드 이름 -->
  <text x="20" y="208" fill="var(--text, #727981)">노드 이름: Vehicle.Cabin.RearviewMirror.Dimmed</text>
</svg>
