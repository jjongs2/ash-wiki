<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5.5 532 235" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <text x="20" y="32" fill="var(--text, #727981)">The Scrum Guide 2020</text>

  <!-- Sprint: 나머지 네 이벤트를 담는다 -->
  <rect x="20" y="44" width="396" height="152" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="64" fill="var(--text, #727981)">Sprint: 길이 고정, 한 달 이하</text>

  <!-- 다음 Sprint -->
  <rect x="428" y="44" width="84" height="152" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="440" y="64" fill="var(--text, #727981)">다음 Sprint</text>
  <text x="440" y="80" fill="var(--text, #727981)">곧바로 시작</text>

  <!-- 이벤트 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="80" width="72" height="58" rx="2" />
    <rect x="116" y="80" width="10" height="58" rx="2" />
    <rect x="134" y="80" width="10" height="58" rx="2" />
    <rect x="152" y="80" width="10" height="58" rx="2" />
    <rect x="170" y="80" width="10" height="58" rx="2" />
    <rect x="188" y="80" width="10" height="58" rx="2" />
    <rect x="206" y="80" width="10" height="58" rx="2" />
    <rect x="228" y="80" width="72" height="58" rx="2" />
    <rect x="308" y="80" width="96" height="58" rx="2" />
  </g>
  <!-- Daily Scrum: 여섯 막대를 묶는 괄호 -->
  <path d="M116 144 V150 H216 V144" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="68" y="98">Sprint</text>
    <text x="68" y="114">Planning</text>
    <text x="68" y="130">최대 8시간</text>
    <text x="264" y="98">Sprint</text>
    <text x="264" y="114">Review</text>
    <text x="264" y="130">최대 4시간</text>
    <text x="356" y="98">Sprint</text>
    <text x="356" y="114">Retrospective</text>
    <text x="356" y="130">최대 3시간</text>
    <text x="166" y="166">Daily Scrum</text>
    <text x="166" y="182">근무일마다 15분</text>
  </g>

  <text x="20" y="220" fill="var(--text, #727981)">최대 시간은 한 달짜리 Sprint 기준</text>
</svg>
