<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 680 235" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="32" fill="var(--text, #727981)">The Scrum Guide 2020</text>

  <!-- Sprint: 나머지 네 이벤트를 담는다 -->
  <rect x="20" y="44" width="540" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="64" fill="var(--text, #727981)">Sprint: 길이 고정, 한 달 이하</text>

  <!-- 다음 Sprint -->
  <rect x="572" y="44" width="88" height="148" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="584" y="64" fill="var(--text, #727981)">다음 Sprint</text>
  <text x="584" y="80" fill="var(--text, #727981)">곧바로 시작</text>

  <!-- 이벤트 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="92" width="112" height="44" rx="2" />
    <rect x="160" y="92" width="12" height="44" rx="2" />
    <rect x="182" y="92" width="12" height="44" rx="2" />
    <rect x="204" y="92" width="12" height="44" rx="2" />
    <rect x="226" y="92" width="12" height="44" rx="2" />
    <rect x="248" y="92" width="12" height="44" rx="2" />
    <rect x="270" y="92" width="12" height="44" rx="2" />
    <rect x="298" y="92" width="104" height="44" rx="2" />
    <rect x="412" y="92" width="136" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="88" y="110">Sprint Planning</text>
    <text x="88" y="126">최대 8시간</text>
    <text x="350" y="110">Sprint Review</text>
    <text x="350" y="126">최대 4시간</text>
    <text x="480" y="110">Sprint Retrospective</text>
    <text x="480" y="126">최대 3시간</text>
    <text x="221" y="158">Daily Scrum</text>
    <text x="221" y="174">근무일마다 15분</text>
  </g>

  <text x="20" y="216" fill="var(--text, #727981)">최대 시간은 한 달짜리 Sprint 기준</text>
</svg>
