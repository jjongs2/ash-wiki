<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 206" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="몇 분 이내의 리팩터링과 며칠씩 깨진 채 하는 재구성">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <text x="500" y="30" text-anchor="end" fill="var(--text, #727981)">Fowler</text>

  <!-- 리팩터링: 작은 단계마다 다시 동작하는 상태 -->
  <text x="20" y="30" font-size="14" fill="var(--text, #727981)">리팩터링</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="84" y1="50" x2="500" y2="50" />
    <line x1="84" y1="78" x2="500" y2="78" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="76" y="54">동작</text>
    <text x="76" y="82">깨짐</text>
  </g>
  <path d="M84 50 H136 V78 H148 V50 H200 V78 H212 V50 H264 V78 H276 V50 H328 V78 H340 V50 H392 V78 H404 V50 H456 V78 H468 V50 H500" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="334" y="98" text-anchor="middle" fill="var(--text, #727981)">몇 분 이내</text>

  <!-- 며칠씩 깨진 채 하는 재구성 -->
  <text x="20" y="134" font-size="14" fill="var(--text, #727981)">며칠씩 깨진 채 하는 재구성</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="84" y1="154" x2="500" y2="154" />
    <line x1="84" y1="182" x2="500" y2="182" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="76" y="158">동작</text>
    <text x="76" y="186">깨짐</text>
  </g>
  <path d="M84 154 H137 V182 H460 V154 H500" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="298" y="173" text-anchor="middle" fill="var(--text, #727981)">며칠</text>
</svg>
