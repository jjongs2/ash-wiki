<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 206" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="600" y="30" text-anchor="end" fill="var(--text, #727981)">Fowler</text>

  <!-- 리팩터링: 작은 단계마다 다시 동작하는 상태 -->
  <text x="20" y="30" font-size="14" fill="var(--text, #727981)">리팩터링</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="84" y1="50" x2="600" y2="50" />
    <line x1="84" y1="78" x2="600" y2="78" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="76" y="54">동작</text>
    <text x="76" y="82">깨짐</text>
  </g>
  <path d="M84 50 H150 V78 H162 V50 H230 V78 H242 V50 H310 V78 H322 V50 H390 V78 H402 V50 H470 V78 H482 V50 H550 V78 H562 V50 H600" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="316" y="98" text-anchor="middle" fill="var(--text, #727981)">몇 분 이내</text>

  <!-- 며칠씩 깨진 채 하는 재구성 -->
  <text x="20" y="134" font-size="14" fill="var(--text, #727981)">며칠씩 깨진 채 하는 재구성</text>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="84" y1="154" x2="600" y2="154" />
    <line x1="84" y1="182" x2="600" y2="182" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="76" y="158">동작</text>
    <text x="76" y="186">깨짐</text>
  </g>
  <path d="M84 154 H150 V182 H550 V154 H600" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="350" y="173" text-anchor="middle" fill="var(--text, #727981)">며칠</text>
</svg>
