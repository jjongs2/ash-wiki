    <text x="60" y="105">블록</text>
    <text x="60" y="137">블록</text>
    <text x="336" y="73">블록</text>
    <text x="336" y="105">블록</text>
    <text x="336" y="137">블록</text>
    <text x="612" y="73">블록</text>
    <text x="612" y="105">블록</text>
    <text x="612" y="137">블록</text>
    <text x="748" y="73">블록</text>
    <text x="748" y="137">블록</text>
