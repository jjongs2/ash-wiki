<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 212" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="128" y="30">BndM_WriteStart</text>
    <text x="404" y="30">BndM_WriteBlock</text>
    <text x="680" y="30">BndM_WriteFinalize</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="246" y1="101" x2="286" y2="101" />
    <line x1="522" y1="101" x2="562" y2="101" />
  </g>

  <!-- 파티션 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
