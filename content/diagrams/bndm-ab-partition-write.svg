    <rect x="26" y="88" width="68" height="26" rx="2" />
    <rect x="26" y="120" width="68" height="26" rx="2" />
    <rect x="302" y="56" width="68" height="26" rx="2" />
    <rect x="302" y="88" width="68" height="26" rx="2" />
    <rect x="302" y="120" width="68" height="26" rx="2" />
    <rect x="578" y="56" width="68" height="26" rx="2" />
    <rect x="578" y="88" width="68" height="26" rx="2" />
    <rect x="578" y="120" width="68" height="26" rx="2" />
    <rect x="714" y="56" width="68" height="26" rx="2" />
    <rect x="714" y="120" width="68" height="26" rx="2" />
