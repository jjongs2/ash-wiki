    <rect x="296" y="50" width="80" height="102" rx="2" />
    <rect x="432" y="50" width="80" height="102" rx="2" />
    <rect x="572" y="50" width="80" height="102" rx="2" />
    <rect x="708" y="50" width="80" height="102" rx="2" />
