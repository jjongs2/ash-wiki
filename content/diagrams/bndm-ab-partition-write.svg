    <text x="60" y="172">파티션 A</text>
    <text x="196" y="172">파티션 B</text>
    <text x="336" y="172">파티션 A</text>
    <text x="472" y="172">파티션 B</text>
    <text x="612" y="172">파티션 A</text>
