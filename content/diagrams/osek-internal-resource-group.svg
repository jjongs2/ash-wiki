<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 3.5 617 255" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Schedule 호출 -->
  <text x="440" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Schedule</text>
  <line x1="440" y1="40" x2="440" y2="176" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 레인 이름 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="176" y="66">그룹보다 높은 태스크</text>
    <text x="176" y="112">그룹 안의 높은 태스크</text>
    <text x="176" y="158">그룹 안의 낮은 태스크</text>
  </g>

  <!-- suspended -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="190" y1="62" x2="300" y2="62" />
    <line x1="380" y1="62" x2="640" y2="62" />
    <line x1="190" y1="108" x2="240" y2="108" />
    <line x1="520" y1="108" x2="640" y2="108" />
    <line x1="600" y1="154" x2="640" y2="154" />
  </g>

  <!-- ready -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="240" y1="108" x2="440" y2="108" />
    <line x1="300" y1="154" x2="380" y2="154" />
    <line x1="440" y1="154" x2="520" y2="154" />
  </g>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점하지 못한다</text>

  <!-- running -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="300" y="50" width="80" height="24" />
    <rect x="440" y="96" width="80" height="24" />
    <rect x="190" y="142" width="110" height="24" />
    <rect x="380" y="142" width="60" height="24" />
    <rect x="520" y="142" width="80" height="24" />
  </g>

  <!-- 시간 -->
  <line x1="190" y1="190" x2="650" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="650" y="206" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 범례 -->
  <rect x="190" y="222" width="30" height="16" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="228" y="234" font-size="12" fill="var(--text, #727981)">running</text>
  <line x1="310" y1="230" x2="340" y2="230" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="348" y="234" font-size="12" fill="var(--text, #727981)">ready</text>
  <line x1="420" y1="230" x2="450" y2="230" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="458" y="234" font-size="12" fill="var(--text, #727981)">suspended</text>
</svg>
