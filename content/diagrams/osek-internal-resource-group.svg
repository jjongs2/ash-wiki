<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 3.5 525 255" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Schedule 호출 -->
  <text x="390" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Schedule</text>
  <line x1="390" y1="40" x2="390" y2="176" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 레인 이름 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="176" y="66">그룹보다 높은 태스크</text>
    <text x="176" y="112">그룹 안의 높은 태스크</text>
    <text x="176" y="158">그룹 안의 낮은 태스크</text>
  </g>

  <!-- suspended -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="190" y1="62" x2="278" y2="62" />
    <line x1="342" y1="62" x2="550" y2="62" />
    <line x1="190" y1="108" x2="230" y2="108" />
    <line x1="454" y1="108" x2="550" y2="108" />
    <line x1="518" y1="154" x2="550" y2="154" />
  </g>

  <!-- ready -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="230" y1="108" x2="390" y2="108" />
    <line x1="278" y1="154" x2="342" y2="154" />
    <line x1="390" y1="154" x2="454" y2="154" />
  </g>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선점하지 못한다</text>

  <!-- running -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="278" y="50" width="64" height="24" />
    <rect x="390" y="96" width="64" height="24" />
    <rect x="190" y="142" width="88" height="24" />
    <rect x="342" y="142" width="48" height="24" />
    <rect x="454" y="142" width="64" height="24" />
  </g>

  <!-- 시간 -->
  <line x1="190" y1="190" x2="558" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="558" y="206" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 범례 -->
  <rect x="190" y="222" width="30" height="16" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="228" y="234" font-size="12" fill="var(--text, #727981)">running</text>
  <line x1="310" y1="230" x2="340" y2="230" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="348" y="234" font-size="12" fill="var(--text, #727981)">ready</text>
  <line x1="420" y1="230" x2="450" y2="230" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="458" y="234" font-size="12" fill="var(--text, #727981)">suspended</text>
</svg>
