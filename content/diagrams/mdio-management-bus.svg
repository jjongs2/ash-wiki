<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 532 245" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 관리 쪽 -->
  <rect x="20.75" y="50.75" width="88.5" height="78.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="65" y="95" text-anchor="middle" fill="var(--on-fill, #f8fafd)">관리 쪽</text>

  <!-- 버스 두 선 -->
  <line x1="110" y1="70" x2="509" y2="70" stroke="var(--ink, #727981)" stroke-width="3" />
