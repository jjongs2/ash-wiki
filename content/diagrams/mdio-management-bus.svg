<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 660 245" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 관리 쪽 -->
  <rect x="20.75" y="50.75" width="98.5" height="78.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="70" y="95" text-anchor="middle" fill="var(--on-fill, #f8fafd)">관리 쪽</text>

  <!-- 버스 두 선 -->
  <line x1="120" y1="70" x2="620" y2="70" stroke="var(--ink, #727981)" stroke-width="3" />
  <line x1="120" y1="110" x2="620" y2="110" stroke="var(--ink, #727981)" stroke-width="3" />
  <text x="130" y="62" font-size="12" fill="var(--text, #727981)">MDC (클럭)</text>
  <text x="130" y="102" font-size="12" fill="var(--text, #727981)">MDIO (양방향 데이터)</text>

  <!-- PHY 주소 0 -->
  <path d="M275 70 V103 A7 7 0 0 0 275 117 V178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="315" y1="112" x2="315" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <circle cx="275" cy="70" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="315" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="240" y="180" width="110" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="295" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="295" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 0</text>

  <!-- PHY 주소 1 -->
  <path d="M395 70 V103 A7 7 0 0 0 395 117 V178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="435" y1="112" x2="435" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <circle cx="395" cy="70" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="435" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="360" y="180" width="110" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="415" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="415" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 1</text>

  <text x="500" y="206" text-anchor="middle" fill="var(--text, #727981)">…</text>

  <!-- PHY 주소 31 -->
  <path d="M565 70 V103 A7 7 0 0 0 565 117 V178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="605" y1="112" x2="605" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <circle cx="565" cy="70" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="605" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="530" y="180" width="110" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="585" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="585" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 31</text>

  <text x="440" y="254" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PHY 주소 5비트 · 버스 하나에 PHY 32개까지</text>
</svg>
