  <!-- PHY 주소 31 -->
  <path d="M535 70 V103 A7 7 0 0 0 535 117 V178" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="575" y1="112" x2="575" y2="178" stroke="#727981" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
