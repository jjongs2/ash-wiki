  <circle cx="288" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="230" y="180" width="76" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="268" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="268" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 0</text>

  <!-- PHY 주소 1 -->
  <path d="M334 70 V103 A7 7 0 0 0 334 117 V178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="374" y1="112" x2="374" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <circle cx="334" cy="70" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="374" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="316" y="180" width="76" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="354" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="354" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 1</text>

  <text x="414" y="206" text-anchor="middle" fill="var(--text, #727981)">…</text>

  <!-- PHY 주소 31 -->
  <path d="M454 70 V103 A7 7 0 0 0 454 117 V178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="494" y1="112" x2="494" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <circle cx="454" cy="70" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="494" cy="110" r="3.5" fill="var(--ink, #727981)" />
  <rect x="436" y="180" width="76" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="474" y="201" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <text x="474" y="219" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주소 31</text>

  <text x="371" y="254" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PHY 주소 5비트 · 버스 하나에 PHY 32개까지</text>
