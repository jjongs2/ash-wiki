<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="PNC coordinator 계층의 PNC 요청 해제와 PN shutdown message">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="145" y="20" width="210" height="36" rx="2" />
    <rect x="60" y="110" width="230" height="36" rx="2" />
    <rect x="310" y="110" width="130" height="36" rx="2" />
    <rect x="60" y="200" width="130" height="36" rx="2" />
    <rect x="210" y="200" width="130" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="250" y="43">top-level PNC coordinator</text>
    <text x="175" y="133">intermediate PNC coordinator</text>
    <text x="375" y="133">PNC leaf node</text>
    <text x="125" y="223">PNC leaf node</text>
    <text x="275" y="223">PNC leaf node</text>
  </g>

  <!-- 계층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M250 56 V83 H175 V110" />
    <path d="M250 83 H375 V110" />
    <path d="M175 146 V173 H125 V200" />
    <path d="M175 173 H275 V200" />
  </g>

  <!-- 요청 해제와 PN shutdown message -->
  <line x1="30" y1="236" x2="30" y2="22" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <line x1="470" y1="20" x2="470" y2="234" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="262">PNC 요청 해제</text>
    <text x="20" y="280">단계마다 PN reset time만큼 늦게 전해진다</text>
    <text x="480" y="262" text-anchor="end">PN shutdown message</text>
    <text x="480" y="280" text-anchor="end">intermediate PNC coordinator는</text>
    <text x="480" y="298" text-anchor="end">받는 즉시 넘긴다</text>
  </g>
</svg>
