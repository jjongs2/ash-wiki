<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.5 5 660 290" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 노드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="250" y="20" width="220" height="36" rx="2" />
    <rect x="150" y="110" width="240" height="36" rx="2" />
    <rect x="470" y="110" width="130" height="36" rx="2" />
    <rect x="120" y="200" width="130" height="36" rx="2" />
    <rect x="290" y="200" width="130" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="360" y="43">top-level PNC coordinator</text>
    <text x="270" y="133">intermediate PNC coordinator</text>
    <text x="535" y="133">PNC leaf node</text>
    <text x="185" y="223">PNC leaf node</text>
    <text x="355" y="223">PNC leaf node</text>
  </g>

  <!-- 계층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M360 56 V83 H270 V110" />
    <path d="M360 83 H535 V110" />
    <path d="M270 146 V173 H185 V200" />
    <path d="M270 173 H355 V200" />
  </g>

  <!-- 요청 해제와 PN shutdown message -->
  <line x1="70" y1="236" x2="70" y2="22" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <line x1="650" y1="20" x2="650" y2="234" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="262">PNC 요청 해제</text>
    <text x="40" y="280">단계마다 PN reset time만큼 늦게 전해진다</text>
    <text x="680" y="262" text-anchor="end">PN shutdown message</text>
    <text x="680" y="280" text-anchor="end">intermediate PNC coordinator는 받는 즉시 넘긴다</text>
  </g>
</svg>
