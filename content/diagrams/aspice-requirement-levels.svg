<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 272" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="SYS.1부터 SWE.1과 HWE.1까지 세우는 요구사항과 시스템 아키텍처">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="170" height="46" rx="2" />
    <rect x="20" y="106" width="170" height="46" rx="2" />
    <rect x="270" y="106" width="170" height="46" rx="2" />
    <rect x="60" y="206" width="150" height="46" rx="2" />
    <rect x="250" y="206" width="150" height="46" rx="2" />
  </g>
  <text x="440" y="36" font-size="12" text-anchor="end" fill="var(--text, #727981)">ASPICE 4.1</text>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="40">이해관계자 요구사항</text>
    <text x="105" y="57" font-size="12">SYS.1</text>
    <text x="105" y="126">시스템 요구사항</text>
    <text x="105" y="143" font-size="12">SYS.2</text>
    <text x="355" y="126">시스템 아키텍처</text>
    <text x="355" y="143" font-size="12">SYS.3</text>
    <text x="135" y="226">소프트웨어 요구사항</text>
    <text x="135" y="243" font-size="12">SWE.1</text>
    <text x="325" y="226">하드웨어 요구사항</text>
    <text x="325" y="243" font-size="12">HWE.1</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="105" y1="68" x2="105" y2="104" marker-end="url(#arrow)" />
    <line x1="192" y1="129" x2="268" y2="129" marker-end="url(#arrow)" />
    <path d="M105 152 V176 H355 V152" />
    <line x1="135" y1="176" x2="135" y2="204" marker-end="url(#arrow)" />
    <line x1="325" y1="176" x2="325" y2="204" marker-end="url(#arrow)" />
