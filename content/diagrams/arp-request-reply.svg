<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 10 530 250" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <rect x="65" y="20" width="130" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="130" y="41" text-anchor="middle" fill="var(--text, #727981)">요청한 호스트</text>
  <rect x="250" y="20" width="130" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="315" y="41" text-anchor="middle" fill="var(--text, #727981)">찾는 주소의 주인</text>
  <rect x="435" y="20" width="130" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="500" y="41" text-anchor="middle" fill="var(--text, #727981)">다른 호스트</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="52" x2="130" y2="250" />
    <line x1="315" y1="52" x2="315" y2="250" />
    <line x1="500" y1="52" x2="500" y2="250" />
  </g>
  <!-- 요청: 브로드캐스트 -->
  <line x1="132" y1="84" x2="313" y2="100" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="132" y1="84" x2="498" y2="116.4" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="222.5" y="80" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ARP 요청 (브로드캐스트)</text>
  <text x="323" y="140" font-size="12" fill="var(--text, #727981)">요청한 쪽의 주소 쌍을 캐시에 넣음</text>
  <text x="508" y="140" font-size="12" fill="var(--text, #727981)">항목이 있으면</text>
  <text x="508" y="156" font-size="12" fill="var(--text, #727981)">새 주소로 고침</text>
  <!-- 응답: 요청한 호스트에 직접 -->
  <line x1="313" y1="182" x2="132" y2="198" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="222.5" y="178" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ARP 응답 (요청한 호스트에 직접)</text>
  <text x="138" y="230" font-size="12" fill="var(--text, #727981)">알아낸 주소 쌍을 캐시에 둠</text>
</svg>
