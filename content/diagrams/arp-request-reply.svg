<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 10 655 250" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#336fb8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b0540d" />
    </marker>
  </defs>
  <rect x="60" y="20" width="140" height="32" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="130" y="41" text-anchor="middle" fill="#727981">요청한 호스트</text>
  <rect x="320" y="20" width="140" height="32" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="390" y="41" text-anchor="middle" fill="#727981">찾는 주소의 주인</text>
  <rect x="550" y="20" width="140" height="32" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="620" y="41" text-anchor="middle" fill="#727981">다른 호스트</text>
  <g stroke="#727981" stroke-width="1.5">
    <line x1="130" y1="52" x2="130" y2="250" />
    <line x1="390" y1="52" x2="390" y2="250" />
    <line x1="620" y1="52" x2="620" y2="250" />
  </g>
  <!-- 요청: 브로드캐스트 -->
  <line x1="132" y1="84" x2="388" y2="100" stroke="#336fb8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="132" y1="84" x2="618" y2="114" stroke="#336fb8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#727981">ARP 요청 (브로드캐스트)</text>
  <text x="398" y="140" font-size="12" fill="#727981">요청한 쪽의 주소 쌍을 표에 넣음</text>
  <text x="628" y="140" font-size="12" fill="#727981">항목이 있으면</text>
  <text x="628" y="156" font-size="12" fill="#727981">새 주소로 고침</text>
  <!-- 응답: 요청한 호스트에 직접 -->
  <line x1="388" y1="182" x2="132" y2="198" stroke="#b0540d" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#727981">ARP 응답 (요청한 호스트에 직접)</text>
  <text x="138" y="230" font-size="12" fill="#727981">알아낸 주소 쌍을 캐시에 둠</text>
</svg>
