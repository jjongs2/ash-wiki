<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 2 522 206" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="공유 매체와 스위치를 가운데 둔 스타">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 공유 매체 -->
  <text x="151" y="24" text-anchor="middle" fill="var(--text, #727981)">공유 매체</text>
  <text x="151" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">반이중 · CSMA/CD</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30" y="100" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="92" y="100" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="154" y="100" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="216" y="100" width="56" height="28" rx="2" fill="var(--surface, none)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="58" y="118">스테이션</text>
    <text x="120" y="118">스테이션</text>
    <text x="182" y="118">스테이션</text>
    <text x="244" y="118">스테이션</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="58" y1="128" x2="58" y2="160" />
    <line x1="120" y1="128" x2="120" y2="160" />
    <line x1="182" y1="128" x2="182" y2="160" />
    <line x1="244" y1="128" x2="244" y2="160" />
  </g>
  <line x1="30" y1="160" x2="272" y2="160" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- 스위치를 가운데 둔 스타 -->
  <text x="416" y="24" text-anchor="middle" fill="var(--text, #727981)">스위치를 가운데 둔 스타</text>
  <text x="416" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">링크마다 전이중</text>
  <rect x="384.75" y="110.75" width="62.5" height="28.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="416" y="130" text-anchor="middle" fill="var(--on-fill, #f8fafd)">스위치</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="388" y="52" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="388" y="170" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="300" y="111" width="56" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="476" y="111" width="56" height="28" rx="2" fill="var(--surface, none)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="416" y="70">스테이션</text>
    <text x="416" y="188">스테이션</text>
    <text x="328" y="129">스테이션</text>
    <text x="504" y="129">스테이션</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="416" y1="82" x2="416" y2="108" />
    <line x1="416" y1="142" x2="416" y2="168" />
    <line x1="358" y1="125" x2="382" y2="125" />
    <line x1="450" y1="125" x2="474" y2="125" />
  </g>
