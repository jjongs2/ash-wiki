  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30" y="100" width="60" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="105" y="100" width="60" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="180" y="100" width="60" height="28" rx="2" fill="var(--surface, none)" />
    <rect x="255" y="100" width="60" height="28" rx="2" fill="var(--surface, none)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="60" y="118">스테이션</text>
    <text x="135" y="118">스테이션</text>
    <text x="210" y="118">스테이션</text>
    <text x="285" y="118">스테이션</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="60" y1="128" x2="60" y2="160" />
    <line x1="135" y1="128" x2="135" y2="160" />
    <line x1="210" y1="128" x2="210" y2="160" />
    <line x1="285" y1="128" x2="285" y2="160" />
