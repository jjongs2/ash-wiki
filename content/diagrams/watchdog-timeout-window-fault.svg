<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.5 5.5 529 233" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="Timeout 모드와 Window 모드의 fault 구간">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="24" fill="var(--text, #727981)">UJA1169</text>

  <!-- 모드 이름 -->
  <g fill="var(--text, #727981)" font-size="14">
    <text x="20" y="74">Timeout 모드</text>
    <text x="20" y="174">Window 모드</text>
  </g>

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="70" x2="500" y2="70" />
    <line x1="130" y1="170" x2="500" y2="170" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="508" y="74">시간</text>
    <text x="508" y="174">시간</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="62" x2="130" y2="78" />
    <line x1="130" y1="162" x2="130" y2="178" />
  </g>

  <!-- 트리거를 받는 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="130" y="60" width="270" height="20" />
    <rect x="260" y="160" width="140" height="20" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="265" y="52">아무 때나 트리거</text>
    <text x="330" y="152">window</text>
  </g>

  <!-- fault 구간 -->
  <g stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)">
    <rect x="400" y="60" width="80" height="20" />
    <rect x="130" y="160" width="130" height="20" />
    <rect x="400" y="160" width="80" height="20" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="440" y="74">fault</text>
    <text x="195" y="174">fault</text>
    <text x="440" y="174">fault</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="440" y="52">너무 늦음</text>
    <text x="195" y="152">너무 이름</text>
    <text x="440" y="152">너무 늦음</text>
  </g>

  <!-- watchdog 주기 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="131" y1="96" x2="399" y2="96" />
    <line x1="131" y1="210" x2="399" y2="210" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="265" y="112">watchdog 주기</text>
    <text x="260" y="196">하한</text>
    <text x="400" y="196">상한</text>
    <text x="265" y="226">watchdog 주기</text>
  </g>
</svg>
