<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 6.5 681 200.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 내려받는 범위 -->
  <path d="M250 50 V44 H660 V50" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="455" y="36" font-size="12" text-anchor="middle" fill="var(--text, #727981)">버전 순서대로 모두 내려받음</text>

  <!-- root 메타데이터 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="60" width="150" height="48" rx="2" />
    <rect x="250" y="60" width="150" height="48" rx="2" />
    <rect x="510" y="60" width="150" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="80">클라이언트가 가진</text>
    <text x="95" y="98">오래된 root</text>
    <text x="325" y="80">다음 버전</text>
    <text x="325" y="98">root</text>
    <text x="455" y="88.5">…</text>
    <text x="585" y="80">최신</text>
    <text x="585" y="98">root</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="84" x2="248" y2="84" />
    <line x1="400" y1="84" x2="438" y2="84" />
    <line x1="472" y1="84" x2="508" y2="84" />
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="20" y="146">버전마다 확인한다</text>
    <text x="20" y="166">· 바로 앞 버전이 정한 키의 임계값만큼 서명되었는가</text>
    <text x="20" y="186">· 자기가 정한 키의 임계값만큼 서명되었는가</text>
  </g>
</svg>
