  <!-- 연도 축 -->
  <line x1="50" y1="40" x2="50" y2="440" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M50 40 h-5 M50 120 h-5 M50 200 h-5 M50 280 h-5 M50 360 h-5 M50 440 h-5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="40" y="44">2021</text>
    <text x="40" y="124">2022</text>
    <text x="40" y="204">2023</text>
    <text x="40" y="284">2024</text>
    <text x="40" y="364">2025</text>
    <text x="40" y="444">2026</text>
