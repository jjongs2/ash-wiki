<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.5 0 749.5 261" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 필드 -->
  <rect x="110.75" y="10.75" width="42.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="132" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">SOF</text>
  <rect x="156.75" y="10.75" width="74.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="194" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 필드</text>
  <rect x="234.75" y="10.75" width="74.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="272" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">제어 필드</text>
  <rect x="312.75" y="10.75" width="78.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="352" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터 필드</text>
  <rect x="394.75" y="10.75" width="78.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="434" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CRC 시퀀스</text>
  <rect x="476.75" y="10.75" width="78.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="516" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CRC 구분자</text>
  <rect x="558.75" y="10.75" width="68.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="593" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ACK 슬롯</text>
  <rect x="630.75" y="10.75" width="78.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="670" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ACK 구분자</text>
  <rect x="712.75" y="10.75" width="48.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="737" y="34.5" text-anchor="middle" font-size="12" fill="var(--text, #727981)">EOF</text>

  <!-- 오류마다 검사하는 필드 -->
  <text x="96" y="82" text-anchor="end" fill="var(--text, #727981)">비트 오류</text>
  <rect x="110.75" y="66.75" width="650.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="96" y="116" text-anchor="end" fill="var(--text, #727981)">스터프 오류</text>
  <rect x="110.75" y="100.75" width="362.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="96" y="150" text-anchor="end" fill="var(--text, #727981)">CRC 오류</text>
  <rect x="394.75" y="134.75" width="78.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="96" y="184" text-anchor="end" fill="var(--text, #727981)">폼 오류</text>
  <rect x="476.75" y="168.75" width="78.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="630.75" y="168.75" width="130.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="96" y="218" text-anchor="end" fill="var(--text, #727981)">ACK 오류</text>
  <rect x="558.75" y="202.75" width="68.5" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="110" y="250" font-size="12" fill="var(--text, #727981)">막대: 그 오류를 검사하는 필드. 비트 오류는 비트를 보내는 노드가 검사한다.</text>
</svg>
