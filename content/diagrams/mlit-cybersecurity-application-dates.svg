<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.5 -5.5 707 236.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <text x="20" y="14" font-size="12" fill="var(--text, #727981)">일본 도로운송차량의 보안기준 개정(2020년 12월 25일 공포)의 적용</text>

  <g transform="translate(0 30)">
  <!-- 1년 = 90 단위, 2021년 1월 1일 = x 150 -->
  <text x="136" y="30" font-size="12" text-anchor="end" fill="var(--text, #727981)">무선 소프트웨어 업데이트</text>
  <g fill="var(--text, #727981)" text-anchor="end">
    <text x="136" y="64.5">지원 차량</text>
    <text x="136" y="138.5">미지원 차량</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="150" y1="60" x2="690" y2="60" />
    <line x1="150" y1="134" x2="690" y2="134" />
  </g>

  <!-- 날짜 -->
  <g fill="var(--ink, #727981)">
    <circle cx="284.6" cy="60" r="4" />
    <circle cx="464.8" cy="60" r="4" />
    <circle cx="420" cy="134" r="4" />
    <circle cx="629.6" cy="134" r="4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="284.6" y="30">신형차</text>
    <text x="284.6" y="46">2022년 7월 1일</text>
    <text x="464.8" y="30">계속 생산차</text>
    <text x="464.8" y="46">2024년 7월 1일</text>
    <text x="420" y="104">신형차</text>
    <text x="420" y="120">2024년 1월 1일</text>
    <text x="629.6" y="104">계속 생산차</text>
    <text x="629.6" y="120">2026년 5월 1일</text>
  </g>

  <!-- 연도 축 -->
  <line x1="150" y1="170" x2="690" y2="170" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M150 170 v5 M240 170 v5 M330 170 v5 M420 170 v5 M510 170 v5 M600 170 v5 M690 170 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="191">2021</text>
    <text x="240" y="191">2022</text>
    <text x="330" y="191">2023</text>
    <text x="420" y="191">2024</text>
    <text x="510" y="191">2025</text>
    <text x="600" y="191">2026</text>
    <text x="690" y="191">2027</text>
  </g>
  </g>
