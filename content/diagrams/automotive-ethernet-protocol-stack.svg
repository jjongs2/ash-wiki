<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 290" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 응용 프로토콜 -->
  <rect x="20" y="20" width="214" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="127" y="45" text-anchor="middle" fill="var(--text, #727981)">DoIP</text>
  <rect x="240" y="20" width="214" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="347" y="45" text-anchor="middle" fill="var(--text, #727981)">SOME/IP</text>

  <!-- TCP · UDP -->
  <rect x="20" y="70" width="434" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="237" y="95" text-anchor="middle" fill="var(--text, #727981)">TCP · UDP</text>

  <!-- IP -->
  <rect x="20" y="120" width="434" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="237" y="145" text-anchor="middle" fill="var(--text, #727981)">IP</text>

  <!-- 공통 MAC -->
  <rect x="20" y="170" width="434" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="237" y="195" text-anchor="middle" fill="var(--text, #727981)">MAC</text>

  <!-- 속도별 PHY -->
  <rect x="20" y="220" width="104" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="72" y="241" text-anchor="middle" fill="var(--text, #727981)">10BASE-T1S</text>
  <text x="72" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">10 Mbit/s</text>
  <rect x="130" y="220" width="104" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="182" y="241" text-anchor="middle" fill="var(--text, #727981)">100BASE-T1</text>
  <text x="182" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">100 Mbit/s</text>
  <rect x="240" y="220" width="104" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="292" y="241" text-anchor="middle" fill="var(--text, #727981)">1000BASE-T1</text>
  <text x="292" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">1 Gbit/s</text>
  <rect x="350" y="220" width="104" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="402" y="241" text-anchor="middle" fill="var(--text, #727981)">MultiGBASE-T1</text>
  <text x="402" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">2.5, 5, 10 Gbit/s</text>

  <!-- IEEE 802.3의 범위 -->
  <path d="M461 170 H467 V270 H461" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="474" y="216" fill="var(--text, #727981)">IEEE</text>
  <text x="474" y="233" fill="var(--text, #727981)">802.3</text>
</svg>
