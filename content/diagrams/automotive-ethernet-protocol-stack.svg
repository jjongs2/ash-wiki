<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661 290" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 응용 프로토콜 -->
  <rect x="20" y="20" width="260" height="40" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="150" y="45" text-anchor="middle" fill="var(--text, #727981)">DoIP</text>
  <rect x="290" y="20" width="260" height="40" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="420" y="45" text-anchor="middle" fill="var(--text, #727981)">SOME/IP</text>

  <!-- TCP · UDP -->
  <rect x="20" y="70" width="530" height="40" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="285" y="95" text-anchor="middle" fill="var(--text, #727981)">TCP · UDP</text>

  <!-- IP -->
  <rect x="20" y="120" width="530" height="40" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="285" y="145" text-anchor="middle" fill="var(--text, #727981)">IP</text>

  <!-- 공통 MAC -->
  <rect x="20" y="170" width="530" height="40" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="285" y="195" text-anchor="middle" fill="var(--text, #727981)">MAC</text>

  <!-- 속도별 PHY -->
  <rect x="20" y="220" width="125" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="82.5" y="241" text-anchor="middle" fill="var(--text, #727981)">802.3cg</text>
  <text x="82.5" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">10 Mbit/s</text>
  <rect x="155" y="220" width="125" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="217.5" y="241" text-anchor="middle" fill="var(--text, #727981)">100BASE-T1</text>
  <text x="217.5" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">100 Mbit/s</text>
  <rect x="290" y="220" width="125" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="352.5" y="241" text-anchor="middle" fill="var(--text, #727981)">1000BASE-T1</text>
  <text x="352.5" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">1 Gbit/s</text>
  <rect x="425" y="220" width="125" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="487.5" y="241" text-anchor="middle" fill="var(--text, #727981)">802.3ch</text>
  <text x="487.5" y="259" text-anchor="middle" font-size="12" fill="var(--text, #727981)">2.5, 5, 10 Gbit/s</text>

  <!-- IEEE 802.3의 범위 -->
  <path d="M560 170 H566 V270 H560" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="574" y="225" fill="var(--text, #727981)">IEEE 802.3</text>
</svg>
