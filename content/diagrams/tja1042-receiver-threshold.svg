<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 -4 560 160" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="수신기가 차동 전압으로 판정하는 dominant와 recessive">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판정 구간 -->
  <rect x="20" y="30" width="200" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="55" text-anchor="middle" fill="var(--text, #727981)">recessive</text>
  <rect x="340.75" y="30.75" width="198.5" height="38.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="440" y="55" text-anchor="middle" fill="var(--on-fill, #f8fafd)">dominant</text>

  <!-- 축: CAN_H − CAN_L -->
  <line x1="20" y1="90" x2="546" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="70" y1="84" x2="70" y2="96" />
    <line x1="220" y1="24" x2="220" y2="96" />
    <line x1="340" y1="24" x2="340" y2="96" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="70" y="112">0 V</text>
    <text x="220" y="112">0.5 V</text>
    <text x="340" y="112">0.9 V</text>
  </g>
  <text x="120" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">0.5 V 이하</text>
  <text x="440" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">0.9 V 이상</text>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CAN_H와 CAN_L의 전압 차 (TJA1042, Normal 모드)</text>
</svg>
