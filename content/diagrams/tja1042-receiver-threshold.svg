<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 -4 560 160" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 판정 구간 -->
  <rect x="20" y="30" width="200" height="40" stroke="#727981" stroke-width="1.5" />
  <text x="120" y="55" text-anchor="middle" fill="#727981">recessive</text>
  <rect x="340" y="30" width="200" height="40" fill="#336fb8" />
  <text x="440" y="55" text-anchor="middle" fill="#f8fafd">dominant</text>

  <!-- 축: CAN_H − CAN_L -->
  <line x1="20" y1="90" x2="546" y2="90" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="#727981" stroke-width="1.5">
    <line x1="70" y1="84" x2="70" y2="96" />
    <line x1="220" y1="24" x2="220" y2="96" />
    <line x1="340" y1="24" x2="340" y2="96" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="70" y="112">0 V</text>
    <text x="220" y="112">0.5 V</text>
    <text x="340" y="112">0.9 V</text>
  </g>
  <text x="120" y="20" text-anchor="middle" font-size="12" fill="#727981">0.5 V 이하</text>
  <text x="440" y="20" text-anchor="middle" font-size="12" fill="#727981">0.9 V 이상</text>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#727981">CAN_H와 CAN_L의 전압 차 (TJA1042, Normal 모드)</text>
</svg>
