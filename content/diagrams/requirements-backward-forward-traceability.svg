<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 478 190" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="소프트웨어 요구사항의 backward와 forward 추적성">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="183" font-size="12" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <!-- 산출물 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="170" height="46" rx="2" />
    <rect x="30" y="112" width="150" height="32" rx="2" />
    <rect x="288" y="66" width="190" height="32" rx="2" />
    <rect x="288" y="112" width="190" height="32" rx="2" />
    <rect x="288" y="158" width="190" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="40">원천 문서</text>
    <text x="105" y="57" font-size="12">시스템 요구사항, 표준 문서</text>
    <text x="105" y="133">소프트웨어 요구사항</text>
    <text x="383" y="87">설계 요소</text>
    <text x="383" y="133">요구사항 기반 테스트 케이스</text>
    <text x="383" y="179">사용자 매뉴얼의 절</text>
  </g>

  <!-- 추적 방향 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="105" y1="110" x2="105" y2="68" marker-end="url(#arrow)" />
    <path d="M182 128 H250" />
    <path d="M250 82 V174" />
    <line x1="250" y1="82" x2="286" y2="82" marker-end="url(#arrow)" />
    <line x1="250" y1="128" x2="286" y2="128" marker-end="url(#arrow)" />
    <line x1="250" y1="174" x2="286" y2="174" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="113" y="93">backward</text>
    <text x="216" y="120" text-anchor="middle">forward</text>
  </g>
</svg>
