<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 164" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="34" font-size="12" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <!-- 산출물 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="59" width="170" height="46" rx="2" />
    <rect x="270" y="66" width="150" height="32" rx="2" />
    <rect x="530" y="20" width="190" height="32" rx="2" />
    <rect x="530" y="66" width="190" height="32" rx="2" />
    <rect x="530" y="112" width="190" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="79">원천 문서</text>
    <text x="105" y="96" font-size="12">시스템 요구사항, 표준 문서</text>
    <text x="345" y="87">소프트웨어 요구사항</text>
    <text x="625" y="41">설계 요소</text>
