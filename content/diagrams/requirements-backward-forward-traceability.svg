    <text x="625" y="133">사용자 매뉴얼의 절</text>
  </g>

  <!-- 추적 방향 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="268" y1="82" x2="192" y2="82" marker-end="url(#arrow)" />
    <path d="M422 82 H490" />
    <path d="M490 36 V128" />
    <line x1="490" y1="36" x2="528" y2="36" marker-end="url(#arrow)" />
    <line x1="490" y1="82" x2="528" y2="82" marker-end="url(#arrow)" />
    <line x1="490" y1="128" x2="528" y2="128" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="230" y="74">backward</text>
    <text x="456" y="74">forward</text>
  </g>
