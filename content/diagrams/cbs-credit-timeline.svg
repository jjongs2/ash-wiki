<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 9.5 519 268" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="idleSlope와 sendSlope로 오르내리는 credit">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 포트 -->
  <text x="118" y="46" text-anchor="end" fill="var(--text, #727981)">포트</text>
  <rect x="141.95" y="30.75" width="24.9" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="154.4" y="46" text-anchor="middle" fill="var(--on-fill, #f8fafd)">A</text>
  <rect x="167.6" y="30" width="79.2" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="207.2" y="46" text-anchor="middle" fill="var(--text, #727981)">best-effort</text>
  <rect x="247.55" y="30.75" width="24.9" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="260" y="46" text-anchor="middle" fill="var(--on-fill, #f8fafd)">B</text>
  <rect x="273.2" y="30" width="132" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="339.2" y="46" text-anchor="middle" fill="var(--text, #727981)">best-effort</text>
  <rect x="405.95" y="30.75" width="11.7" height="22.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="411.8" y="46" text-anchor="middle" fill="var(--on-fill, #f8fafd)">C</text>
  <rect x="418.4" y="30" width="72" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="454.4" y="46" text-anchor="middle" fill="var(--text, #727981)">best-effort</text>

  <!-- CBS 큐에서 기다리는 프레임 -->
  <text x="118" y="88" text-anchor="end" fill="var(--text, #727981)">CBS 큐에서 기다림</text>
  <line x1="128" y1="94" x2="490.4" y2="94" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="155.15" y="72.75" width="90.9" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="200.6" y="87" text-anchor="middle" fill="var(--on-fill, #f8fafd)">B</text>
  <rect x="260.75" y="72.75" width="143.7" height="20.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="332.6" y="87" text-anchor="middle" fill="var(--on-fill, #f8fafd)">C</text>

  <!-- credit가 0에 이르는 때 B가 나간다 -->
  <line x1="246.8" y1="58" x2="246.8" y2="190" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="252" y="118" fill="var(--text, #727981)">credit ≥ 0이면 전송할 수 있음</text>

  <!-- credit -->
  <line x1="128" y1="258" x2="128" y2="122" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="128" y="112" text-anchor="middle" fill="var(--text, #727981)">credit</text>
  <text x="118" y="194" text-anchor="end" fill="var(--text, #727981)">0</text>
  <line x1="128" y1="190" x2="506" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="506" y="208" text-anchor="end" fill="var(--text, #727981)">시간</text>
  <line x1="128" y1="136" x2="506" y2="136" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="118" y="140" text-anchor="end" fill="var(--text, #727981)">hiCredit</text>
  <polyline points="128,190 141.2,190 167.6,244 246.8,190 273.2,244 405.2,154 418.4,181 418.4,190 490.4,190" stroke="var(--blue, #336fb8)" stroke-width="3" stroke-linejoin="round" />
  <text x="263" y="241" text-anchor="end" fill="var(--text, #727981)">sendSlope</text>
  <text x="337" y="216" fill="var(--text, #727981)">idleSlope</text>
  <text x="424" y="176" fill="var(--text, #727981)">큐가 비어 0으로</text>
</svg>
