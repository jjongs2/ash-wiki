<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 42.5 502 170.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="반복식의 값이 고정점에 이르는 흐름">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축: 모든 태스크가 함께 도착한 때부터의 시간. 반복식의 값이 첫 값 C_i에서 커지다가 고정점에서 멈춘다. -->

  <!-- 시간 축 -->
  <line x1="40" y1="120" x2="482" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="482" y="110" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>
  <line x1="40" y1="112" x2="40" y2="128" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="40" y="146" text-anchor="middle" font-size="12" fill="var(--text, #727981)">함께 도착</text>

  <!-- 반복식의 값 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <circle cx="124.5" cy="120" r="6" />
    <circle cx="209" cy="120" r="6" />
    <circle cx="267.5" cy="120" r="6" />
  </g>
  <circle cx="339" cy="120" r="7" fill="var(--green, #337b47)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="124.5" y="146">첫 값 <tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">i</tspan></text>
    <text x="209" y="146">둘째 값</text>
    <text x="267.5" y="146">셋째 값</text>
    <text x="303" y="114">…</text>
    <text x="339" y="146">고정점 <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">i</tspan></text>
  </g>

  <!-- 반복: 오른쪽 변을 계산해 새 값으로 삼는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#tip)">
    <path d="M128.5 110 Q 166.75 62, 205 110" />
    <path d="M213 110 Q 238.25 76, 263.5 110" />
    <path d="M336 110 C 313 72, 365 72, 342 110" />
  </g>
  <text x="166.75" y="68" text-anchor="middle" font-size="12" fill="var(--text, #727981)">오른쪽 변을 계산해 새 값으로</text>
  <text x="339" y="68" text-anchor="middle" font-size="12" fill="var(--text, #727981)">값이 바뀌지 않음</text>

  <!-- 마감 시한 -->
  <line x1="430" y1="60" x2="430" y2="130" stroke="var(--red, #bb464d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="430" y="146">마감 시한 <tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">i</tspan></text>
    <text x="430" y="164">넘으면</text>
    <text x="430" y="182">스케줄할 수 없다고 판정</text>
  </g>

  <!-- 값은 반복마다 줄지 않는다 -->
  <line x1="124.5" y1="178" x2="335" y2="178" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#tip)" />
  <text x="229.75" y="196" text-anchor="middle" font-size="12" fill="var(--text, #727981)">반복마다 줄지 않음</text>
</svg>
