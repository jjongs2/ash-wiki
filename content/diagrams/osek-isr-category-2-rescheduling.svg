<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 3 627.5 224.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="category 2 ISR이 끝날 때의 재스케줄링">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 레인 이름 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="176" y="66">category 2 ISR</text>
    <text x="176" y="112">우선순위가 더 높은 태스크</text>
    <text x="176" y="158">선점할 수 있는 태스크</text>
  </g>

  <!-- 실행하지 않는 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="190" y1="62" x2="640" y2="62" />
    <line x1="190" y1="108" x2="640" y2="108" />
    <line x1="300" y1="154" x2="580" y2="154" />
  </g>

  <!-- 실행 구간 -->
  <rect x="300.75" y="50.75" width="138.5" height="22.5" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="370" y="66" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">ActivateTask</text>
  <rect x="440.75" y="96.75" width="138.5" height="22.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="190" y="142" width="110" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="580" y="142" width="60" height="24" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />

  <!-- 활성화: 아직 스케줄링되지 않음 -->
  <line x1="370" y1="76" x2="370" y2="104" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="372" y1="108" x2="438" y2="108" stroke="var(--orange, #b0540d)" stroke-width="3" stroke-dasharray="5 4" />

  <!-- ISR이 끝날 때 재스케줄링 -->
  <line x1="440" y1="40" x2="440" y2="176" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="440" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ISR이 끝남: 재스케줄링</text>
  <text x="300" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인터럽트</text>
  <line x1="300" y1="40" x2="300" y2="176" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 시간 -->
  <line x1="190" y1="190" x2="640" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="640" y="206" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
