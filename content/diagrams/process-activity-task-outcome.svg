<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 515 335.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="프로세스의 구성 요소">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 프로세스: 입력을 출력으로 바꾼다 -->
  <rect x="70" y="30" width="396" height="290" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="82" y="50" font-size="13" fill="var(--text, #727981)">프로세스</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="20" y1="108" x2="68" y2="108" />
    <line x1="466" y1="108" x2="514" y2="108" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="20" y="98">입력</text>
    <text x="476" y="98">출력</text>
  </g>

  <!-- 활동과 태스크 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="82" y="64" width="164" height="88" rx="2" />
    <rect x="290" y="64" width="164" height="88" rx="2" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="94" y="84">활동</text>
    <text x="302" y="84">활동</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="94" y="96" width="64" height="40" rx="2" />
    <rect x="170" y="96" width="64" height="40" rx="2" />
    <rect x="302" y="96" width="64" height="40" rx="2" />
    <rect x="378" y="96" width="64" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="126" y="120">태스크</text>
    <text x="202" y="120">태스크</text>
    <text x="334" y="120">태스크</text>
    <text x="410" y="120">태스크</text>
  </g>

  <!-- 태스크는 결과에 기여한다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="126" y1="136" x2="152" y2="198" />
    <line x1="202" y1="136" x2="176" y2="198" />
    <line x1="334" y1="136" x2="360" y2="198" />
    <line x1="410" y1="136" x2="384" y2="198" />
  </g>
  <text x="164" y="170" text-anchor="middle" fill="var(--text, #727981)">기여</text>

  <!-- 결과와 목적 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="122" y="200" width="84" height="32" rx="2" />
    <rect x="330" y="200" width="84" height="32" rx="2" />
    <rect x="218" y="270" width="100" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="164" y="220">프로세스 결과</text>
    <text x="372" y="220">프로세스 결과</text>
    <text x="268" y="290">프로세스 목적</text>
  </g>
  <path d="M164 232 V251 H372 V232 M268 251 V270" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <text x="70" y="344" fill="var(--text, #727981)">ISO/IEC/IEEE 12207:2026</text>

  <!-- 정의 -->
  <text x="268" y="212" text-anchor="middle" fill="var(--text, #727981)"><tspan x="268">목적을 이뤘을 때</tspan><tspan x="268" dy="16">관찰할 수 있는 결과</tspan></text>
  <g fill="var(--text, #727981)">
    <text x="330" y="282">상위 목표와</text>
    <text x="330" y="298">기대하는 결과</text>
  </g>
</svg>
