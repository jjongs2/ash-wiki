<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -6.5 523 243" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Compound Stream -->
  <rect x="180" y="30" width="166" height="186" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="263" y="22" text-anchor="middle" fill="var(--text, #727981)">Compound Stream</text>

  <!-- 복제와 중복 제거 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="98" y="100" width="56" height="40" rx="2" />
    <rect x="354" y="100" width="66" height="40" rx="2" />
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--text, #727981)">
    <text x="126" y="125">복제</text>
    <text x="387" y="125">중복 제거</text>
  </g>

  <!-- 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="74" y1="120" x2="96" y2="120" marker-end="url(#arrow-ink)" />
    <path d="M154 110 H168 V60 H328 V110 H352" marker-end="url(#arrow-ink)" />
    <path d="M154 130 H168 V180 H328 V130 H352" marker-end="url(#arrow-ink)" />
    <line x1="420" y1="120" x2="442" y2="120" marker-end="url(#arrow-ink)" />
  </g>

  <!-- 패킷 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="113" width="14" height="14" rx="2" />
    <rect x="38" y="113" width="14" height="14" rx="2" />
    <rect x="56" y="113" width="14" height="14" rx="2" />
    <rect x="192" y="53" width="14" height="14" rx="2" />
    <rect x="218" y="53" width="14" height="14" rx="2" />
    <rect x="244" y="53" width="14" height="14" rx="2" />
    <rect x="192" y="173" width="14" height="14" rx="2" />
    <rect x="218" y="173" width="14" height="14" rx="2" />
    <rect x="244" y="173" width="14" height="14" rx="2" />
    <rect x="446" y="113" width="14" height="14" rx="2" />
    <rect x="464" y="113" width="14" height="14" rx="2" />
    <rect x="482" y="113" width="14" height="14" rx="2" />
  </g>

  <!-- 장비 고장 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="300" y1="174" x2="312" y2="186" />
    <line x1="312" y1="174" x2="300" y2="186" />
  </g>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="45" y="104">스트림</text>
    <text x="471" y="104">되살린 스트림</text>
    <text x="263" y="46">Member Stream</text>
    <text x="232" y="204">Member Stream</text>
    <text x="306" y="204">장비 고장</text>
  </g>
</svg>
