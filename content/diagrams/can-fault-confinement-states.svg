<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 25 730 151.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>
  <!-- 상태: 한 줄로 -->
  <rect x="20" y="40" width="130" height="48" fill="#337b47" />
  <text x="85" y="69" text-anchor="middle" fill="#f8fafd">error active</text>
  <rect x="350" y="40" width="130" height="48" fill="#b0540d" />
  <text x="415" y="69" text-anchor="middle" fill="#f8fafd">error passive</text>
  <rect x="600" y="40" width="130" height="48" fill="#bb464d" />
  <text x="665" y="69" text-anchor="middle" fill="#f8fafd">bus-off</text>

  <!-- error active와 error passive 사이 -->
  <line x1="152" y1="54" x2="347" y2="54" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="44" text-anchor="middle" font-size="12" fill="#727981">TEC &gt; 127 또는 REC &gt; 127</text>
  <line x1="348" y1="74" x2="153" y2="74" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="94" text-anchor="middle" font-size="12" fill="#727981">TEC ≤ 127 그리고 REC ≤ 127</text>

  <!-- error passive에서 bus-off로 -->
  <line x1="482" y1="64" x2="597" y2="64" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="540" y="54" text-anchor="middle" font-size="12" fill="#727981">TEC &gt; 255</text>

  <!-- bus-off에서 error active로: 줄 아래로 돌아옴 -->
  <path d="M665.0 90 V144 H85.0 V91" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#727981">recessive 11비트 연속을 128번 본 뒤, 두 계수기는 0</text>
</svg>
