<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 358" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 끊긴 태스크 -->
  <rect x="40" y="20" width="160" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="45" text-anchor="middle" fill="var(--text, #727981)">태스크</text>
  <line x1="120" y1="62" x2="120" y2="88" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="130" y="80" font-size="12" fill="var(--text, #727981)">인터럽트</text>

  <!-- 바깥: category 1 ISR, 안쪽: category 2 ISR -->
  <rect x="20.75" y="90.75" width="198.5" height="178.5" rx="2" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="36" y="114" fill="var(--text, #727981)">category 1 ISR</text>
  <rect x="50.75" y="128.75" width="138.5" height="62.5" rx="2" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="120" y="154">category 2 ISR</text>
    <text x="120" y="176" font-size="12">ActivateTask</text>
  </g>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="var(--text, #727981)">category 1 ISR이 끝남:</text>
  <text x="120" y="240" text-anchor="middle" font-size="12" fill="var(--text, #727981)">운영체제로 들어가지 않음</text>

  <!-- 끊겼던 태스크가 이어서 돈다 -->
  <line x1="120" y1="270" x2="120" y2="296" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="40" y="298" width="160" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="323" text-anchor="middle" fill="var(--text, #727981)">태스크</text>

  <!-- 활성화된 태스크는 밀린다 -->
  <path d="M192 160 H300 V296" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="240.75" y="298.75" width="118.5" height="38.5" rx="2" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="300" y="323" text-anchor="middle" fill="var(--text, #727981)">활성화된 태스크</text>
  <text x="308" y="236" font-size="12" fill="var(--text, #727981)">다음 재스케줄링</text>
  <text x="308" y="254" font-size="12" fill="var(--text, #727981)">시점까지 밀림</text>
</svg>
