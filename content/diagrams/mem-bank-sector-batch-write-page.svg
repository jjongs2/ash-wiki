<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 3.5 561 263" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Mem의 뱅크, sector batch, 섹터, write page">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <text x="20" y="32" font-size="12" fill="var(--text, #727981)">Mem</text>

  <!-- 메모리 장치, 뱅크, sector batch -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="44" width="520" height="132" rx="2" />
    <rect x="32" y="72" width="244" height="92" rx="2" />
    <rect x="284" y="72" width="244" height="92" rx="2" />
    <rect x="44" y="98" width="112" height="56" rx="2" />
    <rect x="164" y="98" width="100" height="56" rx="2" />
    <rect x="296" y="98" width="112" height="56" rx="2" />
    <rect x="416" y="98" width="100" height="56" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="62">메모리 장치</text>
    <text x="44" y="90">뱅크</text>
    <text x="296" y="90">뱅크</text>
    <text x="52" y="114">sector batch</text>
    <text x="172" y="114">sector batch</text>
    <text x="304" y="114">sector batch</text>
    <text x="424" y="114">sector batch</text>
  </g>

  <!-- 섹터 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="52" y="120" width="24" height="26" />
    <rect x="100" y="120" width="24" height="26" />
    <rect x="124" y="120" width="24" height="26" />
    <rect x="172" y="120" width="42" height="26" />
    <rect x="214" y="120" width="42" height="26" />
    <rect x="304" y="120" width="32" height="26" />
    <rect x="336" y="120" width="32" height="26" />
    <rect x="368" y="120" width="32" height="26" />
    <rect x="424" y="120" width="42" height="26" />
    <rect x="466" y="120" width="42" height="26" />
  </g>
  <rect x="76" y="120" width="24" height="26" stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)" />

  <!-- 섹터 하나의 write page -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="76" y1="146" x2="90" y2="214" />
    <line x1="100" y1="146" x2="520" y2="214" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="90" y="214" width="86" height="32" />
    <rect x="176" y="214" width="86" height="32" />
    <rect x="262" y="214" width="86" height="32" />
    <rect x="348" y="214" width="86" height="32" />
    <rect x="434" y="214" width="86" height="32" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="133" y="234">write page</text>
    <text x="219" y="234">write page</text>
    <text x="305" y="234">write page</text>
    <text x="391" y="234">write page</text>
    <text x="477" y="234">write page</text>
  </g>
  <text x="80" y="235" text-anchor="end" fill="var(--text, #727981)">섹터</text>
</svg>
