<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 710 160" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="26" fill="var(--text, #727981)">2014년형 Jeep Cherokee</text>

  <!-- 헤드 유닛 -->
  <rect x="160" y="44" width="272" height="96" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="296" y="64" text-anchor="middle" fill="var(--text, #727981)">헤드 유닛 Uconnect</text>

  <!-- 구성 요소 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="82" width="90" height="36" rx="2" />
    <rect x="176" y="78" width="100" height="44" rx="2" />
    <rect x="306" y="78" width="110" height="44" rx="2" />
    <rect x="540" y="78" width="150" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="104.5">셀룰러망</text>
    <text x="226" y="96">서비스</text>
    <text x="226" y="113" font-size="12">코드 실행</text>
    <text x="361" y="96">Renesas V850</text>
    <text x="361" y="113" font-size="12">고친 펌웨어</text>
    <text x="615" y="96">일부 물리 시스템</text>
    <text x="615" y="113" font-size="12">조향, 제동 등</text>
  </g>

  <!-- 공격 경로 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="100" x2="174" y2="100" />
    <line x1="276" y1="100" x2="304" y2="100" />
    <line x1="416" y1="100" x2="538" y2="100" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="486" y="92">CAN 버스</text>
    <text x="486" y="117">CAN 메시지</text>
  </g>
</svg>
