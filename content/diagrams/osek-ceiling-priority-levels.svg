<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.5 -23.5 569 305.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <line x1="30" y1="270" x2="30" y2="14" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="30" y="-2" text-anchor="middle" font-size="12" fill="var(--text, #727981)">우선순위</text>
  <rect x="70" y="18" width="200" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="170" y="39" text-anchor="middle" fill="var(--text, #727981)">resource를 쓰지 않는 태스크</text>
  <text x="290" y="39" font-size="12" fill="var(--text, #727981)">쥔 동안에도 실행된다</text>

  <line x1="70" y1="86" x2="270" y2="86" stroke="var(--violet, #825da9)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="290" y="82" font-size="12" fill="var(--text, #727981)">ceiling priority: 쓰는 태스크의 가장 높은 우선순위 이상,</text>
  <text x="290" y="98" font-size="12" fill="var(--text, #727981)">그보다 높은 쓰지 않는 태스크보다 낮다</text>
  <rect x="70.75" y="122.75" width="198.5" height="30.5" rx="4" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="170" y="143" text-anchor="middle" fill="var(--on-fill, #f8fafd)">resource를 쓰는 태스크</text>
  <text x="290" y="143" font-size="12" fill="var(--text, #727981)">쥔 동안 기다린다</text>
  <rect x="70" y="174" width="200" height="32" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="170" y="195" text-anchor="middle" fill="var(--text, #727981)">resource를 쓰지 않는 태스크</text>
  <text x="290" y="195" font-size="12" fill="var(--text, #727981)">쥔 동안 기다린다</text>
  <rect x="70.75" y="226.75" width="198.5" height="30.5" rx="4" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="170" y="247" text-anchor="middle" fill="var(--on-fill, #f8fafd)">resource를 쓰는 태스크</text>
  <text x="290" y="247" font-size="12" fill="var(--text, #727981)">resource를 얻으면 ceiling priority로 오른다</text>

  <line x1="50" y1="242" x2="50" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="50" y1="242" x2="68" y2="242" stroke="var(--ink, #727981)" stroke-width="1.5" />
</svg>
