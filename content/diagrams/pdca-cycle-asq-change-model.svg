<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 238" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="30" fill="var(--text, #727981)">ASQ</text>

  <!-- 네 단계 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="46" width="110" height="64" rx="2" />
    <rect x="158" y="46" width="110" height="64" rx="2" />
    <rect x="296" y="46" width="110" height="64" rx="2" />
    <rect x="434" y="46" width="110" height="64" rx="2" />
    <rect x="450" y="174" width="130" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="66">Plan</text>
    <text x="213" y="66">Do</text>
    <text x="351" y="66">Check</text>
    <text x="489" y="66">Act</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="var(--text, #727981)">
    <text x="75" y="84">기회를 알아보고</text>
    <text x="75" y="100">변화를 계획</text>
    <text x="213" y="84">변화를</text>
    <text x="213" y="100">작은 규모로 시험</text>
    <text x="351" y="84">결과를 분석해</text>
    <text x="351" y="100">배운 것을 찾음</text>
    <text x="489" y="84">배운 것에 따라</text>
    <text x="489" y="100">조치</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="515" y="192">배운 것을</text>
    <text x="515" y="208">더 넓은 변화에 담음</text>
  </g>

  <!-- 흐름과 Act 뒤의 갈림 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="78" x2="156" y2="78" />
    <line x1="268" y1="78" x2="294" y2="78" />
    <line x1="406" y1="78" x2="432" y2="78" />
    <path d="M460 110 V140 H75 V112" />
    <line x1="515" y1="110" x2="515" y2="172" />
  </g>
  <text x="523" y="146" fill="var(--text, #727981)">통함</text>
  <text x="268" y="158" text-anchor="middle" fill="var(--text, #727981)">통하지 않음: 다른 계획으로 다시</text>
</svg>
