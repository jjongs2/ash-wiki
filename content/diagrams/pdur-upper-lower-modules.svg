<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 2.5 324 500" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="PduR의 상위 모듈과 하위 모듈">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 부류 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="185.5" y="32">통신 인터페이스 모듈</text>
    <text x="185.5" y="282">전송 프로토콜 모듈</text>
  </g>
  <g text-anchor="end" font-size="12" fill="var(--text, #727981)">
    <text x="44" y="65">상위</text>
    <text x="44" y="219">하위</text>
    <text x="44" y="315">상위</text>
    <text x="44" y="469">하위</text>
  </g>

  <!-- 통신 인터페이스 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="52" y="44" width="131" height="34" rx="2" />
    <rect x="52" y="120" width="267" height="36" rx="2" />
    <rect x="52" y="198" width="63" height="34" rx="2" />
    <rect x="120" y="198" width="63" height="34" rx="2" />
    <rect x="256" y="198" width="63" height="34" rx="2" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="188" y="44" width="63" height="34" rx="2" />
    <rect x="188" y="198" width="63" height="34" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="117.5" y="66">AUTOSAR COM</text>
    <text x="185.5" y="143">PduR</text>
    <text x="83.5" y="220">CanNm</text>
    <text x="151.5" y="220">FrNm</text>
    <text x="287.5" y="220">LSduR</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="219.5" y="66">IpduM</text>
    <text x="219.5" y="220">IpduM</text>
  </g>

  <!-- 전송 프로토콜 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="52" y="294" width="131" height="34" rx="2" />
    <rect x="188" y="294" width="63" height="34" rx="2" />
    <rect x="52" y="370" width="267" height="36" rx="2" />
    <rect x="52" y="448" width="63" height="34" rx="2" />
    <rect x="120" y="448" width="63" height="34" rx="2" />
    <rect x="188" y="448" width="63" height="34" rx="2" />
    <rect x="256" y="448" width="63" height="34" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="117.5" y="316">AUTOSAR COM</text>
    <text x="219.5" y="316">Dcm</text>
    <text x="185.5" y="393">PduR</text>
    <text x="83.5" y="470">CanTp</text>
    <text x="151.5" y="470">FrTp</text>
    <text x="219.5" y="470">LinTp</text>
    <text x="287.5" y="470">J1939Tp</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="117.5" y1="80" x2="117.5" y2="118" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="219.5" y1="80" x2="219.5" y2="118" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="83.5" y1="158" x2="83.5" y2="196" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="151.5" y1="158" x2="151.5" y2="196" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="219.5" y1="158" x2="219.5" y2="196" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="287.5" y1="158" x2="287.5" y2="196" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="117.5" y1="330" x2="117.5" y2="368" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="219.5" y1="330" x2="219.5" y2="368" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="83.5" y1="408" x2="83.5" y2="446" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="151.5" y1="408" x2="151.5" y2="446" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="219.5" y1="408" x2="219.5" y2="446" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="287.5" y1="408" x2="287.5" y2="446" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
</svg>
