<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -3.5 520 267" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="46">Rte_Mode</text>
    <text x="20" y="115">runnable</text>
    <text x="20" y="150">disabled mode</text>
    <text x="122" y="150" font-size="12">시작을 막는 구간</text>
  </g>

  <!-- Rte_Switch -->
  <text x="100" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Rte_Switch</text>
  <line x1="100" y1="30" x2="100" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Rte_Mode가 돌려주는 값 -->
  <rect x="20.75" y="54.75" width="438.5" height="26.5" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M100 55.5 V80.5 M370 55.5 V80.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="60" y="73">이전 모드</text>
    <text x="235" y="73" font-size="12">RTE_TRANSITION_&lt;ModeDeclarationGroup&gt;</text>
    <text x="415" y="73">새 모드</text>
  </g>

  <!-- 전환 중에 실행하는 runnable -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="104.75" y="96.75" width="82.5" height="26.5" />
    <rect x="193.75" y="96.75" width="82.5" height="26.5" />
    <rect x="282.75" y="96.75" width="82.5" height="26.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="146" y="114">on-exit</text>
    <text x="235" y="114">on-transition</text>
    <text x="324" y="114">on-entry</text>
  </g>

  <!-- disabled mode -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20.75" y="160.75" width="348.5" height="26.5" />
    <rect x="100.75" y="196.75" width="358.5" height="26.5" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="195" y="178">이전 모드를 disabled mode로 건 이벤트</text>
    <text x="280" y="214">새 모드를 disabled mode로 건 이벤트</text>
  </g>

  <!-- 시간 -->
  <line x1="20" y1="240" x2="470" y2="240" stroke="var(--ink, #727981)" stroke-width="1" marker-end="url(#arrow)" />
  <text x="476" y="244" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
