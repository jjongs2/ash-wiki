<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -4.5 736 247.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="73">Rte_Mode</text>
    <text x="20" y="115">runnable</text>
    <text x="20" y="170">disabled mode</text>
    <text x="20" y="188" font-size="12">시작을 막는 구간</text>
  </g>

  <!-- Rte_Switch -->
  <text x="300" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Rte_Switch</text>
  <line x1="300" y1="30" x2="300" y2="52" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Rte_Mode가 돌려주는 값 -->
  <rect x="170.75" y="54.75" width="508.5" height="26.5" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M300 55.5 V80.5 M580 55.5 V80.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="235" y="73">이전 모드</text>
    <text x="440" y="73" font-size="12">RTE_TRANSITION_&lt;ModeDeclarationGroup&gt;</text>
    <text x="630" y="73">새 모드</text>
  </g>

  <!-- 전환 중에 실행하는 runnable -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="304.75" y="96.75" width="86.5" height="26.5" rx="2" />
    <rect x="396.75" y="96.75" width="86.5" height="26.5" rx="2" />
    <rect x="488.75" y="96.75" width="86.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="348" y="114">on-exit</text>
    <text x="440" y="114">on-transition</text>
    <text x="532" y="114">on-entry</text>
  </g>

  <!-- disabled mode -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="170.75" y="138.75" width="408.5" height="26.5" rx="2" />
    <rect x="300.75" y="174.75" width="378.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="375" y="156">이전 모드를 disabled mode로 건 이벤트</text>
    <text x="490" y="192">새 모드를 disabled mode로 건 이벤트</text>
  </g>

  <!-- 시간 -->
  <line x1="170" y1="218" x2="690" y2="218" stroke="var(--ink, #727981)" stroke-width="1" marker-end="url(#arrow)" />
  <text x="696" y="222" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
