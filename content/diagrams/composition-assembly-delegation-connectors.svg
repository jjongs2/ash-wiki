<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 202" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="assembly connector와 delegation connector">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- composition -->
  <rect x="40.75" y="20.75" width="432.5" height="128.5" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="56" y="44" fill="var(--text, #727981)">composition</text>

  <!-- component prototype -->
