<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.875 0 420 226.25" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 작업: 계획은 1986년 논문에만, 개요는 코드 인스펙션에 없음. 윗줄 셋, 아랫줄 셋 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="100" height="44" rx="2" stroke-dasharray="5 4" />
    <rect x="160" y="20" width="100" height="44" rx="2" stroke-dasharray="5 4" />
    <rect x="300" y="20" width="100" height="44" rx="2" />
    <rect x="20" y="124" width="100" height="44" rx="2" />
    <rect x="160" y="124" width="100" height="44" rx="2" />
    <rect x="300" y="124" width="100" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="39">계획</text>
    <text x="70" y="56" font-size="12">planning</text>
    <text x="210" y="39">개요</text>
    <text x="210" y="56" font-size="12">overview</text>
    <text x="350" y="39">준비</text>
    <text x="350" y="56" font-size="12">preparation</text>
    <text x="70" y="143">인스펙션</text>
    <text x="70" y="160" font-size="12">inspection</text>
    <text x="210" y="143">재작업</text>
    <text x="210" y="160" font-size="12">rework</text>
    <text x="350" y="143">후속 조치</text>
    <text x="350" y="160" font-size="12">follow-up</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="70" y="82">1986년 논문에서 더함</text>
    <text x="210" y="82">코드 인스펙션에는 없음</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="42" x2="158" y2="42" />
    <line x1="260" y1="42" x2="298" y2="42" />
    <path d="M350 64 V104 H70 V122" />
    <line x1="120" y1="146" x2="158" y2="146" />
    <line x1="260" y1="146" x2="298" y2="146" />
    <path d="M350 168 V188 H70 V170" />
  </g>
  <text x="210" y="206" text-anchor="middle" font-size="12" fill="var(--text, #727981)">대상의 5% 넘게 재작업되면 다시 인스펙션</text>
</svg>
