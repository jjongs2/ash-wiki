<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 644 140" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 작업: 계획은 1986년 논문에만, 개요는 코드 인스펙션에 없음 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="60" width="84" height="44" rx="2" stroke-dasharray="5 4" />
    <rect x="128" y="60" width="84" height="44" rx="2" stroke-dasharray="5 4" />
    <rect x="236" y="60" width="84" height="44" rx="2" />
    <rect x="344" y="60" width="84" height="44" rx="2" />
    <rect x="452" y="60" width="84" height="44" rx="2" />
    <rect x="560" y="60" width="84" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="62" y="79">계획</text>
    <text x="62" y="96" font-size="12">planning</text>
    <text x="170" y="79">개요</text>
    <text x="170" y="96" font-size="12">overview</text>
    <text x="278" y="79">준비</text>
    <text x="278" y="96" font-size="12">preparation</text>
    <text x="386" y="79">인스펙션</text>
    <text x="386" y="96" font-size="12">inspection</text>
    <text x="494" y="79">재작업</text>
    <text x="494" y="96" font-size="12">rework</text>
    <text x="602" y="79">후속 조치</text>
    <text x="602" y="96" font-size="12">follow-up</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="104" y1="82" x2="126" y2="82" />
    <line x1="212" y1="82" x2="234" y2="82" />
    <line x1="320" y1="82" x2="342" y2="82" />
    <line x1="428" y1="82" x2="450" y2="82" />
    <line x1="536" y1="82" x2="558" y2="82" />
    <path d="M602 60 V38 H386 V58" />
  </g>
  <text x="494" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">대상의 5% 넘게 재작업되면 다시 인스펙션</text>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="62" y="124">1986년 논문에서</text>
    <text x="62" y="140">더함</text>
    <text x="170" y="124">코드 인스펙션에는</text>
    <text x="170" y="140">없음</text>
  </g>
</svg>
