<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 550.5 189" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 세그먼트 -->
  <rect x="100.75" y="30.75" width="156.5" height="44.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <rect x="262" y="30" width="216" height="46" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="482" y="30" width="98" height="46" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="179" y="50">헤더</text>
    <text x="370" y="50" fill="var(--text, #727981)">페이로드</text>
    <text x="531" y="50" fill="var(--text, #727981)">트레일러</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">
    <text x="179" y="67">5바이트</text>
    <text x="370" y="67" fill="var(--text, #727981)">0~254바이트</text>
    <text x="531" y="67" fill="var(--text, #727981)">24비트 CRC</text>
  </g>
  <text x="86" y="58" text-anchor="end" fill="var(--text, #727981)">프레임</text>

  <!-- 헤더를 펼친 모습 -->
  <path d="M100 80 L100 120 M258 80 L580 120" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="100.75" y="124.75" width="54.5" height="48.5" />
    <rect x="160.75" y="124.75" width="126.5" height="48.5" />
    <rect x="292.75" y="124.75" width="78.5" height="48.5" />
    <rect x="376.75" y="124.75" width="126.5" height="48.5" />
    <rect x="508.75" y="124.75" width="70.5" height="48.5" />
  </g>
  <g text-anchor="middle" font-size="11" fill="var(--on-fill, #f8fafd)">
    <text x="128" y="145">indicator</text>
    <text x="224" y="145">프레임 ID</text>
    <text x="332" y="145">페이로드 길이</text>
    <text x="440" y="145">헤더 CRC</text>
    <text x="544" y="145">사이클 카운트</text>
    <text x="128" y="162">5비트</text>
    <text x="224" y="162">11비트</text>
    <text x="332" y="162">7비트</text>
    <text x="440" y="162">11비트</text>
    <text x="544" y="162">6비트</text>
  </g>
  <text x="86" y="154" text-anchor="end" fill="var(--text, #727981)">헤더</text>
  <text x="100" y="198" font-size="12" fill="var(--text, #727981)">헤더 필드 폭은 비트 수에 비례한다. 페이로드 길이는 2바이트 워드 수다.</text>
</svg>
