<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 550.5 189" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 세그먼트 -->
  <rect x="100" y="30" width="158" height="46" fill="#336fb8" />
  <rect x="262" y="30" width="216" height="46" fill="#337b47" />
