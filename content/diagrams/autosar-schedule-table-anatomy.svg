<svg xmlns="http://www.w3.org/2000/svg" viewBox="37 5 640 219" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축: schedule table 시작(틱 0)은 x=60, duration은 x=600. expiry point는 x=140, 260, 380, 480 -->

  <!-- 틱 축 -->
  <line x1="60" y1="70" x2="640" y2="70" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="648" y="74" font-size="12" fill="var(--text, #727981)">틱</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="60" y1="60" x2="60" y2="80" />
    <line x1="600" y1="60" x2="600" y2="80" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="60" y="50">0</text>
    <text x="600" y="50">duration</text>
  </g>

  <!-- expiry point -->
  <g fill="var(--ink, #727981)">
    <circle cx="140" cy="70" r="6" />
    <circle cx="260" cy="70" r="6" />
    <circle cx="380" cy="70" r="6" />
    <circle cx="480" cy="70" r="6" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="140" y="34">initial</text>
    <text x="140" y="50">expiry point</text>
    <text x="260" y="50">expiry point</text>
    <text x="380" y="50">expiry point</text>
    <text x="480" y="34">final</text>
    <text x="480" y="50">expiry point</text>
  </g>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="80" x2="60" y2="190" />
    <line x1="140" y1="76" x2="140" y2="110" />
    <line x1="380" y1="76" x2="380" y2="150" />
    <line x1="480" y1="76" x2="480" y2="110" />
    <line x1="600" y1="80" x2="600" y2="190" />
  </g>

  <!-- 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="61" y1="104" x2="139" y2="104" />
    <line x1="481" y1="104" x2="599" y2="104" />
    <line x1="61" y1="144" x2="379" y2="144" />
    <line x1="61" y1="184" x2="599" y2="184" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="100" y="124">initial offset</text>
    <text x="540" y="124">final delay</text>
    <text x="220" y="164">offset</text>
    <text x="330" y="204">duration</text>
  </g>
</svg>
