<svg xmlns="http://www.w3.org/2000/svg" viewBox="81.5 9.5 419 250" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="질의-응답 watchdog의 질의와 응답 바이트">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130" y="20" width="120" height="32" rx="2" />
    <rect x="370" y="20" width="120" height="32" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="190" y="41">watchdog</text>
    <text x="430" y="41">MCU</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="190" y1="52" x2="190" y2="250" />
    <line x1="430" y1="52" x2="430" y2="250" />
  </g>

  <!-- 질의와 응답 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="192" y1="86" x2="428" y2="86" />
    <line x1="428" y1="124" x2="192" y2="124" />
    <line x1="428" y1="150" x2="192" y2="150" />
    <line x1="428" y1="176" x2="192" y2="176" />
    <line x1="428" y1="202" x2="192" y2="202" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="310" y="80">질의</text>
    <text x="310" y="118">응답 바이트 1</text>
    <text x="310" y="144">응답 바이트 2</text>
    <text x="310" y="170">응답 바이트 3</text>
    <text x="310" y="196">응답 바이트 4</text>
  </g>

  <!-- 정한 시간과 순서 -->
  <line x1="160" y1="125" x2="160" y2="201" stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="150" y="160">정한 시간 안</text>
    <text x="150" y="176">정한 순서로</text>
  </g>

  <text x="198" y="234" font-size="12" fill="var(--text, #727981)">응답이 틀리면 오류 계수기를 올림</text>
</svg>
