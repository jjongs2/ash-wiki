<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 10 520 205" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="주기 태스크와 sporadic 태스크의 요청 간격">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="tip-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- periodic: 이웃한 요청 사이가 늘 T_i -->
  <text x="20" y="85" fill="var(--text, #727981)">periodic</text>
  <line x1="90" y1="90" x2="470" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="94" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="105" y1="90" x2="105" y2="38" />
    <line x1="191" y1="90" x2="191" y2="38" />
    <line x1="277" y1="90" x2="277" y2="38" />
    <line x1="363" y1="90" x2="363" y2="38" />
    <line x1="449" y1="90" x2="449" y2="38" />
  </g>
  <g fill="var(--ink, #727981)">
    <path d="M105 30 L110 40 L100 40 z" />
    <path d="M191 30 L196 40 L186 40 z" />
    <path d="M277 30 L282 40 L272 40 z" />
    <path d="M363 30 L368 40 L358 40 z" />
    <path d="M449 30 L454 40 L444 40 z" />
  </g>
  <text x="113" y="46" font-size="12" fill="var(--text, #727981)">요청</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)">
    <line x1="107" y1="78" x2="189" y2="78" />
    <line x1="193" y1="78" x2="275" y2="78" />
    <line x1="279" y1="78" x2="361" y2="78" />
    <line x1="365" y1="78" x2="447" y2="78" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="148" y="70">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="234" y="70">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="320" y="70">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="406" y="70">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  </g>

  <!-- sporadic: 요청마다 최소 간격, 다음 요청은 그 끝 이후에만 -->
  <text x="20" y="185" fill="var(--text, #727981)">sporadic</text>
  <line x1="90" y1="190" x2="470" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="194" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="105" y1="190" x2="105" y2="138" />
    <line x1="215" y1="190" x2="215" y2="138" />
    <line x1="285" y1="190" x2="285" y2="138" />
    <line x1="380" y1="190" x2="380" y2="138" />
  </g>
  <g fill="var(--orange, #b0540d)">
    <path d="M105 130 L110 140 L100 140 z" />
    <path d="M215 130 L220 140 L210 140 z" />
    <path d="M285 130 L290 140 L280 140 z" />
    <path d="M380 130 L385 140 L375 140 z" />
  </g>
  <text x="113" y="146" font-size="12" fill="var(--text, #727981)">요청</text>
  <!-- 최소 간격의 끝 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="175" y1="190" x2="175" y2="172" />
    <line x1="355" y1="190" x2="355" y2="172" />
    <line x1="450" y1="190" x2="450" y2="172" />
  </g>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-start="url(#tip-orange)" marker-end="url(#tip-orange)">
    <line x1="107" y1="178" x2="173" y2="178" />
    <line x1="217" y1="178" x2="283" y2="178" />
    <line x1="287" y1="178" x2="353" y2="178" />
    <line x1="382" y1="178" x2="448" y2="178" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="170">최소 간격</text>
    <text x="250" y="170">최소 간격</text>
    <text x="320" y="170">최소 간격</text>
    <text x="415" y="170">최소 간격</text>
  </g>
</svg>
