<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 10 706 205" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- periodic: 요청마다 T_i 막대, 막대가 끝나면 곧바로 다음 요청 -->
  <text x="20" y="85" fill="var(--text, #727981)">periodic</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="131" y="64" width="118" height="24" fill="var(--surface, none)" />
    <rect x="251" y="64" width="118" height="24" fill="var(--surface, none)" />
    <rect x="371" y="64" width="118" height="24" fill="var(--surface, none)" />
    <rect x="491" y="64" width="118" height="24" fill="var(--surface, none)" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="190" y="81">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="310" y="81">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="430" y="81">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
    <text x="550" y="81">요청 주기 <tspan font-style="italic">T</tspan><tspan font-style="italic" dy="3" font-size="9">i</tspan></text>
  </g>
  <line x1="110" y1="90" x2="658" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="666" y="94" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="130" y1="90" x2="130" y2="38" />
    <line x1="250" y1="90" x2="250" y2="38" />
    <line x1="370" y1="90" x2="370" y2="38" />
    <line x1="490" y1="90" x2="490" y2="38" />
    <line x1="610" y1="90" x2="610" y2="38" />
  </g>
  <g fill="var(--ink, #727981)">
    <path d="M130 30 L135 40 L125 40 z" />
    <path d="M250 30 L255 40 L245 40 z" />
    <path d="M370 30 L375 40 L365 40 z" />
    <path d="M490 30 L495 40 L485 40 z" />
    <path d="M610 30 L615 40 L605 40 z" />
  </g>
  <text x="138" y="46" font-size="12" fill="var(--text, #727981)">요청</text>

  <!-- sporadic: 요청마다 최소 간격 막대, 다음 요청은 막대가 끝난 뒤에만 -->
  <text x="20" y="185" fill="var(--text, #727981)">sporadic</text>
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="131.75" y="164.75" width="96.5" height="22.5" />
    <rect x="301.75" y="164.75" width="96.5" height="22.5" />
    <rect x="401.75" y="164.75" width="96.5" height="22.5" />
    <rect x="541.75" y="164.75" width="96.5" height="22.5" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="180" y="181">최소 간격</text>
    <text x="350" y="181">최소 간격</text>
    <text x="450" y="181">최소 간격</text>
    <text x="590" y="181">최소 간격</text>
  </g>
  <line x1="110" y1="190" x2="658" y2="190" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="666" y="194" font-size="12" fill="var(--text, #727981)">시간</text>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="130" y1="190" x2="130" y2="138" />
    <line x1="300" y1="190" x2="300" y2="138" />
    <line x1="400" y1="190" x2="400" y2="138" />
    <line x1="540" y1="190" x2="540" y2="138" />
  </g>
  <g fill="var(--orange, #b0540d)">
    <path d="M130 130 L135 140 L125 140 z" />
    <path d="M300 130 L305 140 L295 140 z" />
    <path d="M400 130 L405 140 L395 140 z" />
    <path d="M540 130 L545 140 L535 140 z" />
  </g>
  <text x="138" y="146" font-size="12" fill="var(--text, #727981)">요청</text>
</svg>
