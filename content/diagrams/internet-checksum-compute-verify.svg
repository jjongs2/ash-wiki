<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 8 513 216" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 송신 측 -->
  <text x="90" y="32" fill="var(--text, #727981)">송신 측</text>
  <rect x="90.75" y="42.75" width="98.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="67" text-anchor="middle" fill="var(--text, #727981)">16비트 워드</text>
  <rect x="194.75" y="42.75" width="82.5" height="38.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="236" y="67" text-anchor="middle" fill="var(--on-fill, #f8fafd)">체크섬 = 0</text>
  <line x1="280" y1="62" x2="304" y2="62" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="306.75" y="42.75" width="90.5" height="38.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="352" y="67" text-anchor="middle" fill="var(--on-fill, #f8fafd)">1의 보수 합</text>
  <line x1="400" y1="62" x2="424" y2="62" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="426.75" y="42.75" width="82.5" height="38.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="468" y="67" text-anchor="middle" fill="var(--on-fill, #f8fafd)">1의 보수</text>

  <!-- 계산한 값이 체크섬 필드로 -->
  <path d="M468 82 V108 H236 V138" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="352" y="102" text-anchor="middle" font-size="12" fill="var(--text, #727981)">체크섬 필드에 넣어 보냄</text>

  <!-- 수신 측 -->
  <text x="90" y="130" fill="var(--text, #727981)">수신 측</text>
  <rect x="90.75" y="140.75" width="98.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="165" text-anchor="middle" fill="var(--text, #727981)">16비트 워드</text>
  <rect x="194.75" y="140.75" width="82.5" height="38.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="236" y="165" text-anchor="middle" fill="var(--on-fill, #f8fafd)">체크섬</text>
  <line x1="280" y1="160" x2="304" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="306.75" y="140.75" width="90.5" height="38.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="352" y="165" text-anchor="middle" fill="var(--on-fill, #f8fafd)">1의 보수 합</text>
  <line x1="400" y1="160" x2="424" y2="160" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="426.75" y="140.75" width="158.5" height="38.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="506" y="165" text-anchor="middle" fill="var(--on-fill, #f8fafd)">모든 비트가 1이면 통과</text>

  <path d="M90 186 V192 H278 V186" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="184" y="210" text-anchor="middle" font-size="12" fill="var(--text, #727981)">체크섬 필드까지 더한다</text>
</svg>
