<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 11.5 448 270" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Adaptive Application의 요청을 제한하는 PEP와 PDP">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 객체의 프로세스 -->
  <rect x="266.75" y="30.75" width="160.5" height="100.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="280" y="54" font-size="12" fill="var(--text, #727981)">객체의 프로세스</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="62" width="156" height="48" rx="2" />
    <rect x="297" y="66" width="100" height="40" rx="2" />
    <rect x="297" y="183" width="100" height="40" rx="2" />
    <rect x="20" y="150" width="156" height="48" rx="2" />
    <rect x="20" y="214" width="156" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="98" y="82">Adaptive Application</text>
    <text x="347" y="91">PEP</text>
    <text x="347" y="208">PDP</text>
    <text x="98" y="170">intent</text>
    <text x="98" y="234">Grant</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="98" y="100">주체</text>
    <text x="98" y="187">Application Manifest</text>
    <text x="98" y="251">통합자가 승인</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="176" y1="86" x2="295" y2="86" marker-end="url(#arrow)" />
    <line x1="347" y1="106" x2="347" y2="181" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="176" y1="174" x2="295" y2="197" marker-end="url(#arrow)" />
    <line x1="176" y1="238" x2="295" y2="209" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="220" y="78" text-anchor="middle">요청</text>
    <text x="220" y="104" text-anchor="middle">IPC · 네트워크</text>
    <text x="357" y="160">허용 · 거부</text>
  </g>
</svg>
