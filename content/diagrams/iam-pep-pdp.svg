<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10.5 760 237.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 객체의 프로세스 -->
  <rect x="270.75" y="30.75" width="180.5" height="118.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="284" y="54" font-size="12" fill="var(--text, #727981)">객체의 프로세스</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="76" width="160" height="48" rx="2" />
    <rect x="310" y="80" width="100" height="40" rx="2" />
    <rect x="550" y="80" width="100" height="40" rx="2" />
    <rect x="460" y="180" width="140" height="48" rx="2" />
    <rect x="620" y="180" width="120" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="96">Adaptive Application</text>
    <text x="360" y="105">PEP</text>
    <text x="600" y="105">PDP</text>
    <text x="530" y="199">intent</text>
    <text x="680" y="199">Grant</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="100" y="114">주체</text>
    <text x="530" y="216">Application Manifest</text>
    <text x="680" y="216">통합자가 승인</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="180" y1="100" x2="308" y2="100" marker-end="url(#arrow)" />
    <line x1="410" y1="100" x2="548" y2="100" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="530" y1="180" x2="580" y2="122" marker-end="url(#arrow)" />
    <line x1="680" y1="180" x2="620" y2="122" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="225" y="92">요청</text>
    <text x="225" y="118">IPC · 네트워크</text>
    <text x="490" y="118">허용 · 거부</text>
  </g>
