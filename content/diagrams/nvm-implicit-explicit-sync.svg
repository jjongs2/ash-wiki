<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 224" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Implicit synchronization: 응용과 NvM이 같은 RAM 블록을 쓴다 -->
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">Implicit synchronization</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="90" height="36" rx="2" />
    <rect x="160" y="40" width="110" height="36" rx="2" />
    <rect x="380" y="40" width="150" height="36" rx="2" />
    <rect x="580" y="40" width="110" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="63">응용</text>
    <text x="215" y="63">RAM 블록</text>
    <text x="455" y="63">NvM</text>
    <text x="635" y="63">NV 블록</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="112" y1="58" x2="158" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="272" y1="58" x2="378" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="532" y1="58" x2="578" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>

  <!-- Explicit synchronization: NvM의 RAM mirror와 콜백 복사 -->
  <text x="20" y="128" font-size="12" fill="var(--text, #727981)">Explicit synchronization</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="157" width="90" height="36" rx="2" />
    <rect x="160" y="157" width="110" height="36" rx="2" />
    <rect x="395" y="157" width="120" height="36" rx="2" />
    <rect x="580" y="157" width="110" height="36" rx="2" />
  </g>
  <rect x="380" y="140" width="150" height="64" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="180">응용</text>
    <text x="215" y="180">RAM 블록</text>
    <text x="455" y="180">RAM mirror</text>
    <text x="635" y="180">NV 블록</text>
  </g>
  <text x="455" y="134" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NvM</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="112" y1="175" x2="158" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="272" y1="175" x2="393" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="517" y1="175" x2="578" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <text x="325" y="167" text-anchor="middle" font-size="12" fill="var(--text, #727981)">콜백으로 복사</text>
</svg>
