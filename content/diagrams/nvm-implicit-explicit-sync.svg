<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 224" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="응용과 NvM의 RAM 블록 동기화">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Implicit synchronization: 응용과 NvM이 같은 RAM 블록을 쓴다 -->
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">Implicit synchronization</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="52" height="36" rx="2" />
    <rect x="108" y="40" width="74" height="36" rx="2" />
    <rect x="282" y="40" width="112" height="36" rx="2" />
    <rect x="430" y="40" width="74" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="46" y="63">응용</text>
    <text x="145" y="63">RAM 블록</text>
    <text x="338" y="63">NvM</text>
    <text x="467" y="63">NV 블록</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="74" y1="58" x2="106" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="184" y1="58" x2="280" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="396" y1="58" x2="428" y2="58" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>

  <!-- Explicit synchronization: NvM의 RAM mirror와 콜백 복사 -->
  <text x="20" y="128" font-size="12" fill="var(--text, #727981)">Explicit synchronization</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="157" width="52" height="36" rx="2" />
    <rect x="108" y="157" width="74" height="36" rx="2" />
    <rect x="290" y="157" width="96" height="36" rx="2" />
    <rect x="430" y="157" width="74" height="36" rx="2" />
  </g>
  <rect x="282" y="140" width="112" height="64" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="46" y="180">응용</text>
    <text x="145" y="180">RAM 블록</text>
    <text x="338" y="180">RAM mirror</text>
    <text x="467" y="180">NV 블록</text>
  </g>
  <text x="338" y="134" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NvM</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="74" y1="175" x2="106" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="184" y1="175" x2="288" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="388" y1="175" x2="428" y2="175" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <text x="236" y="167" text-anchor="middle" font-size="12" fill="var(--text, #727981)">콜백으로 복사</text>
</svg>
