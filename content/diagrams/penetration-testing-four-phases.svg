<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 470 180" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">NIST SP 800-115</text>

  <!-- 세 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="64" width="110" height="44" rx="4" />
    <rect x="190" y="64" width="110" height="44" rx="4" />
    <rect x="360" y="64" width="110" height="44" rx="4" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="75" y="83">계획</text>
    <text x="245" y="83">발견</text>
    <text x="415" y="83">공격</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="75" y="100">planning</text>
    <text x="245" y="100">discovery</text>
    <text x="415" y="100">attack</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="86" x2="188" y2="86" />
    <line x1="300" y1="86" x2="358" y2="86" />
    <path d="M415 64 V44 H270 V62" />
  </g>
  <text x="342.5" y="36" font-size="12" text-anchor="middle" fill="var(--text, #727981)">더 많은 접근이나 정보를 얻으면</text>

  <!-- 보고: 다른 세 단계와 함께 진행 -->
  <rect x="20" y="128" width="450" height="44" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="245" y="147" text-anchor="middle" fill="var(--text, #727981)">보고</text>
  <text x="245" y="164" font-size="12" text-anchor="middle" fill="var(--text, #727981)">reporting: 다른 세 단계와 함께 진행</text>
</svg>
