<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1 500 170" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="베이스라인과 승인된 변경으로 된 현재 승인된 형상">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 현재 승인된 형상 -->
  <text x="221" y="30" text-anchor="middle" fill="var(--text, #727981)">현재 승인된 형상</text>
  <path d="M20 48 V40 H422 V48" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="480" y="30" font-size="12" text-anchor="end" fill="var(--text, #727981)">ISO/IEC/IEEE 24765 용어집</text>

  <!-- 베이스라인 -->
  <rect x="20" y="56" width="110" height="32" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="75" y="77" text-anchor="middle" fill="var(--text, #727981)">베이스라인</text>

  <!-- 승인된 변경 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="166" y="56" width="110" height="32" rx="2" />
    <rect x="312" y="56" width="110" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="221" y="77">승인된 변경</text>
    <text x="367" y="77">승인된 변경</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="148" y="77">+</text>
    <text x="294" y="77">+</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="106">공식 승인·고정</text>
    <text x="221" y="106">근거와 승인</text>
    <text x="367" y="106">근거와 승인</text>
  </g>

  <!-- 생명주기 -->
  <line x1="20" y1="130" x2="480" y2="130" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="75" y1="111" x2="75" y2="130" />
    <line x1="221" y1="111" x2="221" y2="130" />
    <line x1="367" y1="111" x2="367" y2="130" />
  </g>
  <text x="480" y="148" font-size="12" text-anchor="end" fill="var(--text, #727981)">형상 항목의 생명주기</text>
</svg>
