<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 162" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 현재 승인된 형상 -->
  <text x="236" y="30" text-anchor="middle" fill="var(--text, #727981)">현재 승인된 형상</text>
  <path d="M20 48 V40 H452 V48" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="598" y="30" font-size="12" text-anchor="end" fill="var(--text, #727981)">ISO/IEC/IEEE 24765 용어집</text>

  <!-- 베이스라인 -->
  <rect x="20" y="56" width="120" height="32" rx="4" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="80" y="77" text-anchor="middle" fill="var(--text, #727981)">베이스라인</text>

  <!-- 승인된 변경 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="176" y="56" width="120" height="32" rx="4" />
    <rect x="332" y="56" width="120" height="32" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="236" y="77">승인된 변경</text>
    <text x="392" y="77">승인된 변경</text>
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="158" y="77">+</text>
    <text x="314" y="77">+</text>
  </g>

  <!-- 생명주기 -->
  <line x1="20" y1="124" x2="598" y2="124" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="90" x2="80" y2="124" />
    <line x1="236" y1="90" x2="236" y2="124" />
    <line x1="392" y1="90" x2="392" y2="124" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="598" y="116" text-anchor="end">형상 항목의 생명주기</text>
    <text x="80" y="142" text-anchor="middle">공식 승인·고정</text>
    <text x="236" y="142" text-anchor="middle">근거와 승인</text>
    <text x="392" y="142" text-anchor="middle">근거와 승인</text>
  </g>
</svg>
