<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 195" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="운전 자동화 시스템, 운전자 지원 기능, ADS가 가리키는 레벨">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">ISO/SAE PAS 22736:2021</text>

  <!-- 레벨 축: 맞붙는 칸 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="42" width="76" height="32" />
    <rect x="96" y="42" width="76" height="32" />
    <rect x="172" y="42" width="76" height="32" />
    <rect x="248" y="42" width="76" height="32" />
    <rect x="324" y="42" width="76" height="32" />
    <rect x="400" y="42" width="76" height="32" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="58" y="63">레벨 0</text>
    <text x="134" y="63">레벨 1</text>
    <text x="210" y="63">레벨 2</text>
    <text x="286" y="63">레벨 3</text>
    <text x="362" y="63">레벨 4</text>
    <text x="438" y="63">레벨 5</text>
  </g>

  <!-- 이름이 가리키는 레벨 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="98" y="90" width="376" height="36" rx="2" />
    <rect x="98" y="138" width="148" height="36" rx="2" />
    <rect x="250" y="138" width="224" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="286" y="113">운전 자동화 시스템</text>
    <text x="172" y="161">운전자 지원 기능</text>
    <text x="362" y="161">ADS</text>
  </g>
</svg>
