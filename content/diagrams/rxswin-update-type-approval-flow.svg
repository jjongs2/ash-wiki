<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 388" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="180" y="20" width="260" height="36" rx="2" />
    <rect x="120" y="80" width="380" height="36" rx="2" />
    <rect x="20" y="150" width="280" height="68" rx="2" />
    <rect x="20" y="242" width="280" height="50" rx="2" />
    <rect x="340" y="150" width="260" height="36" rx="2" />
    <rect x="340" y="206" width="260" height="50" rx="2" />
    <rect x="340" y="276" width="260" height="36" rx="2" />
    <rect x="340" y="332" width="260" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="310" y="42.5">차량 등록 뒤의 업데이트</text>
    <text x="310" y="102.5">형식 승인 대상 시스템의 적합성에 영향을 주는가</text>
    <text x="160" y="172">RXSWIN을 그대로 두고</text>
    <text x="160" y="189" font-size="12">한 RXSWIN 아래 허용되는</text>
    <text x="160" y="205" font-size="12">소프트웨어 버전을 모두 기록</text>
    <text x="160" y="263">승인 당국에 연락하지 않고 업데이트 실행</text>
    <text x="160" y="280" font-size="12">변경을 문서로 남김</text>
    <text x="470" y="172.5">승인 당국에 확장이나 새 승인 신청</text>
    <text x="470" y="227">확장이나 새 승인</text>
    <text x="470" y="244" font-size="12">RXSWIN 갱신</text>
    <text x="470" y="298.5">등록 정보를 각국 법에 따라 고침</text>
    <text x="470" y="354.5">업데이트 실행</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="310" y1="56" x2="310" y2="78" />
    <line x1="160" y1="116" x2="160" y2="148" />
    <line x1="160" y1="218" x2="160" y2="240" />
    <line x1="470" y1="116" x2="470" y2="148" />
    <line x1="470" y1="186" x2="470" y2="204" />
    <line x1="470" y1="256" x2="470" y2="274" />
    <line x1="470" y1="312" x2="470" y2="330" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="168" y="137">영향 없음</text>
    <text x="478" y="137">영향을 주거나 줄 수 있음</text>
  </g>
</svg>
