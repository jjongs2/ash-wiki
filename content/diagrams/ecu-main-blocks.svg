<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.5 9 520 430" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- ECU 경계 -->
  <rect x="60" y="60" width="382" height="266" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="74" y="82" font-size="12" fill="var(--text, #727981)">ECU</text>

  <!-- 전원부 -->
  <rect x="176" y="80" width="150" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="251" y="101" text-anchor="middle" fill="var(--text, #727981)">전원부</text>
  <text x="251" y="119" text-anchor="middle" font-size="12" fill="var(--text, #727981)">전압 레귤레이터</text>

  <!-- 마이크로컨트롤러 -->
  <rect x="186" y="170" width="130" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="251" y="198" text-anchor="middle" fill="var(--text, #727981)">마이크로컨트롤러</text>

  <!-- 센서 인터페이스, 액추에이터 드라이버 -->
  <rect x="72" y="170" width="90" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="117" y="188" text-anchor="middle" fill="var(--text, #727981)">센서</text>
  <text x="117" y="205" text-anchor="middle" fill="var(--text, #727981)">인터페이스</text>
  <rect x="340" y="170" width="90" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="385" y="188" text-anchor="middle" fill="var(--text, #727981)">액추에이터</text>
  <text x="385" y="205" text-anchor="middle" fill="var(--text, #727981)">드라이버</text>

  <!-- 차량 네트워크 인터페이스 -->
  <rect x="151" y="256" width="200" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="251" y="284" text-anchor="middle" fill="var(--text, #727981)">차량 네트워크 인터페이스</text>

  <!-- ECU 밖 -->
  <g fill="var(--text, #727981)">
    <text x="251" y="30" text-anchor="middle">차량 배터리</text>
    <text x="44" y="198" text-anchor="end">센서</text>
    <text x="458" y="198">액추에이터</text>
    <text x="251" y="374" text-anchor="middle">차량 네트워크</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="251" y1="40" x2="251" y2="80" />
    <line x1="251" y1="130" x2="251" y2="170" />
    <line x1="162" y1="193" x2="186" y2="193" />
    <line x1="316" y1="193" x2="340" y2="193" />
    <line x1="251" y1="216" x2="251" y2="256" />
    <line x1="50" y1="193" x2="72" y2="193" />
    <line x1="430" y1="193" x2="452" y2="193" />
    <line x1="251" y1="302" x2="251" y2="356" />
  </g>

  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="251" y="410">NXP 백서에 따른 ECU의 구성.</text>
    <text x="251" y="428">마이크로컨트롤러는 전압 레귤레이터를 거쳐 차량 배터리에 이어진다.</text>
  </g>
</svg>
