<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.5 9 674.5 412" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- ECU 경계 -->
  <rect x="60" y="60" width="540" height="266" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="74" y="82" font-size="12" fill="var(--text, #727981)">ECU</text>

  <!-- 전원부 -->
  <rect x="255" y="80" width="150" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="101" text-anchor="middle" fill="var(--text, #727981)">전원부</text>
  <text x="330" y="119" text-anchor="middle" font-size="12" fill="var(--text, #727981)">전압 레귤레이터</text>

  <!-- 마이크로컨트롤러 -->
  <rect x="255" y="170" width="150" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="198" text-anchor="middle" fill="var(--text, #727981)">마이크로컨트롤러</text>

  <!-- 센서 인터페이스, 액추에이터 드라이버 -->
  <rect x="80" y="170" width="145" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="152.5" y="198" text-anchor="middle" fill="var(--text, #727981)">센서 인터페이스</text>
  <rect x="435" y="170" width="145" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="507.5" y="198" text-anchor="middle" fill="var(--text, #727981)">액추에이터 드라이버</text>

  <!-- 차량 네트워크 인터페이스 -->
  <rect x="230" y="256" width="200" height="46" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="284" text-anchor="middle" fill="var(--text, #727981)">차량 네트워크 인터페이스</text>

  <!-- ECU 밖 -->
  <g fill="var(--text, #727981)">
    <text x="330" y="30" text-anchor="middle">차량 배터리</text>
    <text x="44" y="198" text-anchor="end">센서</text>
    <text x="616" y="198">액추에이터</text>
    <text x="330" y="374" text-anchor="middle">차량 네트워크</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="330" y1="40" x2="330" y2="80" />
    <line x1="330" y1="130" x2="330" y2="170" />
    <line x1="225" y1="193" x2="255" y2="193" />
    <line x1="405" y1="193" x2="435" y2="193" />
    <line x1="330" y1="216" x2="330" y2="256" />
    <line x1="50" y1="193" x2="80" y2="193" />
    <line x1="580" y1="193" x2="610" y2="193" />
    <line x1="330" y1="302" x2="330" y2="356" />
  </g>

  <text x="330" y="410" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NXP 백서에 따른 ECU의 구성. 마이크로컨트롤러는 전압 레귤레이터를 거쳐 차량 배터리에 이어진다.</text>
</svg>
