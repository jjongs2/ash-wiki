<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 539.5 136" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Fee·Ea 블록 번호의 비트 구조">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 16비트 Fee·Ea 블록 번호 -->
  <text x="340" y="30" text-anchor="middle" fill="var(--text, #727981)">Fee · Ea 블록 번호 (16비트)</text>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="100" y="30">상위 비트</text>
    <text x="580" y="30" text-anchor="end">하위 비트</text>
  </g>
  <rect x="100" y="40" width="360" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="280" y="63" text-anchor="middle" fill="var(--text, #727981)">NvMNvBlockBaseNumber</text>
  <rect x="460.75" y="40.75" width="118.5" height="34.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="520" y="63" text-anchor="middle" fill="var(--on-fill, #f8fafd)">데이터 인덱스</text>

  <!-- 비트 수 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="100" y1="80" x2="100" y2="100" />
    <line x1="460" y1="80" x2="460" y2="100" />
    <line x1="580" y1="80" x2="580" y2="100" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="102" y1="92" x2="458" y2="92" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="462" y1="92" x2="578" y2="92" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="280" y="116">나머지 상위 비트</text>
    <text x="520" y="116">NvMDatasetSelectionBits 비트</text>
  </g>
</svg>
