<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 4.5 621 362" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 열 제목 -->
