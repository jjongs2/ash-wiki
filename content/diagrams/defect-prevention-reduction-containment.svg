<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 180" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 사슬: 실수 → fault → failure -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="65" y="20" width="100" height="36" rx="2" />
    <rect x="275" y="20" width="100" height="36" rx="2" />
    <rect x="595" y="20" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="42.5">실수</text>
    <text x="325" y="42.5">fault</text>
    <text x="645" y="42.5">failure</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="165" y1="38" x2="273" y2="38" />
    <line x1="375" y1="38" x2="593" y2="38" />
  </g>

  <!-- 품질 보증 활동 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="20" y="110" width="190" height="50" rx="2" />
    <rect x="230" y="110" width="190" height="50" rx="2" />
    <rect x="440" y="110" width="190" height="50" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="115" y="131">결함 예방</text>
    <text x="115" y="149" font-size="12">실수를 없앤다</text>
    <text x="325" y="131">결함 감소</text>
    <text x="325" y="149" font-size="12">들어간 fault를 찾아 없앤다</text>
    <text x="535" y="131">결함 봉쇄</text>
    <text x="535" y="149" font-size="12">fault와 failure의 인과를 끊는다</text>
  </g>

  <!-- 활동이 미치는 곳 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <line x1="115" y1="110" x2="115" y2="58" marker-end="url(#arrow-blue)" />
    <line x1="325" y1="110" x2="325" y2="58" marker-end="url(#arrow-blue)" />
    <line x1="535" y1="110" x2="535" y2="62" marker-end="url(#arrow-blue)" />
    <path d="M524 28 L532 48 M534 28 L542 48" />
  </g>
</svg>
