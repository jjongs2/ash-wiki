<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 652 200" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="하향식·상향식·빅뱅 통합 전략">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 이름 -->
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="100" y="38">하향식</text>
    <text x="330" y="38">상향식</text>
    <text x="560" y="38">빅뱅</text>
  </g>

  <!-- 컴포넌트 계층: 하향식 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M100 80 L70 110 M100 80 L130 110 M70 130 L40 160 M70 130 L100 160 M130 130 L160 160" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="80" y="60" width="40" height="20" rx="2" />
    <rect x="50" y="110" width="40" height="20" rx="2" />
    <rect x="110" y="110" width="40" height="20" rx="2" />
    <rect x="20" y="160" width="40" height="20" rx="2" />
    <rect x="80" y="160" width="40" height="20" rx="2" />
    <rect x="140" y="160" width="40" height="20" rx="2" />
  </g>

  <!-- 컴포넌트 계층: 상향식 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M330 80 L300 110 M330 80 L360 110 M300 130 L270 160 M300 130 L330 160 M360 130 L390 160" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="310" y="60" width="40" height="20" rx="2" />
    <rect x="280" y="110" width="40" height="20" rx="2" />
    <rect x="340" y="110" width="40" height="20" rx="2" />
    <rect x="250" y="160" width="40" height="20" rx="2" />
    <rect x="310" y="160" width="40" height="20" rx="2" />
    <rect x="370" y="160" width="40" height="20" rx="2" />
  </g>

  <!-- 컴포넌트 계층: 빅뱅 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M560 80 L530 110 M560 80 L590 110 M530 130 L500 160 M530 130 L560 160 M590 130 L620 160" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="540" y="60" width="40" height="20" rx="2" />
    <rect x="510" y="110" width="40" height="20" rx="2" />
    <rect x="570" y="110" width="40" height="20" rx="2" />
    <rect x="480" y="160" width="40" height="20" rx="2" />
    <rect x="540" y="160" width="40" height="20" rx="2" />
    <rect x="600" y="160" width="40" height="20" rx="2" />
  </g>
  <rect x="468" y="50" width="184" height="140" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- 통합 방향 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="62" x2="200" y2="178" />
    <line x1="430" y1="178" x2="430" y2="62" />
  </g>

  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="100" y="208">가장 높은 컴포넌트부터</text>
    <text x="330" y="208">가장 낮은 컴포넌트부터</text>
    <text x="560" y="208">단계를 나누지 않고 한꺼번에</text>
  </g>
</svg>
