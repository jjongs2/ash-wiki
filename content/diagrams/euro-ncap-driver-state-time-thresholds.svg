<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -1 540 298.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="Driver Engagement 프로토콜의 운전자 상태별 시간 기준">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="20" y="24" fill="var(--text, #727981)">Euro NCAP Driver Engagement 프로토콜 v1.2</text>

  <!-- 상태와 재는 시간 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="150" y="56">long distraction</text>
    <text x="150" y="71" font-size="11">시선을 뗀 시간</text>
    <text x="150" y="98">microsleep</text>
    <text x="150" y="113" font-size="11">눈을 감은 시간</text>
    <text x="150" y="140">sleep</text>
    <text x="150" y="155" font-size="11">눈을 감은 시간</text>
    <text x="150" y="182">unresponsive</text>
    <text x="150" y="197" font-size="11">눈을 감은 시간</text>
  </g>

  <!-- 시간 축: 1초 = 50 단위, 0초 = x 170 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="112" x2="220" y2="214" />
    <line x1="270" y1="112" x2="270" y2="214" />
    <line x1="320" y1="70" x2="320" y2="214" />
    <line x1="370" y1="70" x2="370" y2="214" />
    <line x1="470" y1="196" x2="470" y2="214" />
  </g>

  <!-- 범위: 축 위의 구간이므로 모서리는 0. 끝이 열린 범위는 오른쪽 변을 그리지 않는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="320" y="50" width="50" height="20" />
    <rect x="220" y="92" width="50" height="20" />
  </g>
  <g fill="var(--surface, none)">
    <rect x="320" y="134" width="190" height="20" />
    <rect x="470" y="176" width="40" height="20" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M510 134 H320 V154 H510" />
    <path d="M510 176 H470 V196 H510" />
  </g>

  <line x1="170" y1="214" x2="520" y2="214" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M170 214 v5 M220 214 v5 M270 214 v5 M320 214 v5 M370 214 v5 M470 214 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="170" y="233">0</text>
    <text x="220" y="233">1</text>
    <text x="270" y="233">2</text>
    <text x="320" y="233">3</text>
    <text x="370" y="233">4</text>
    <text x="470" y="233">6</text>
    <text x="345" y="253">시간 (s)</text>
  </g>

  <text x="20" y="279" fill="var(--text, #727981)">unresponsive는 주의 분산 경고 뒤 3초 안에 시선이 앞 도로로 돌아오지 않을 때도 분류할 수 있다</text>
</svg>
