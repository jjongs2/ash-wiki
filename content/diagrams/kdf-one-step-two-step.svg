<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -2 634 177" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 줄 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="22">한 단계</text>
    <text x="20" y="94">두 단계</text>
  </g>

  <!-- 값 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="30.75" width="76.5" height="34.5" rx="2" />
    <rect x="562.75" y="30.75" width="66.5" height="34.5" rx="2" />
    <rect x="20.75" y="102.75" width="76.5" height="34.5" rx="2" />
    <rect x="319.75" y="102.75" width="80.5" height="34.5" rx="2" />
    <rect x="562.75" y="102.75" width="66.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="59" y="53">공유 비밀</text>
    <text x="596" y="53">키 재료</text>
    <text x="59" y="125">공유 비밀</text>
    <text x="360" y="125">키 유도 키</text>
    <text x="596" y="125">키 재료</text>
  </g>

  <!-- 함수와 절차 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="123.25" y="30.75" width="413.5" height="34.5" rx="2" />
    <rect x="123.25" y="102.75" width="170.5" height="34.5" rx="2" />
    <rect x="426.25" y="102.75" width="110.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="330" y="53">one-step 키 유도 함수</text>
    <text x="208.5" y="125">randomness extraction</text>
    <text x="481.5" y="125">key expansion</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="99" y1="48" x2="120.5" y2="48" />
    <line x1="538.5" y1="48" x2="560" y2="48" />
    <line x1="99" y1="120" x2="120.5" y2="120" />
    <line x1="295.5" y1="120" x2="317" y2="120" />
    <line x1="402" y1="120" x2="423.5" y2="120" />
    <line x1="538.5" y1="120" x2="560" y2="120" />
  </g>
  <text x="20" y="162" font-size="12" fill="var(--text, #727981)">NIST SP 800-56C Rev. 2</text>
</svg>
