<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 등급마다 틀 하나, 안의 칸은 그 등급이 가진 기능 묶음. timing protection 쪽은 orange, memory protection 쪽은 blue -->

  <!-- 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="125" y="20" width="170" height="68" rx="2" />
    <rect x="20" y="128" width="170" height="98" rx="2" />
    <rect x="230" y="128" width="170" height="98" rx="2" />
    <rect x="125" y="266" width="170" height="128" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="42">SC1</text>
    <text x="105" y="150">SC2</text>
    <text x="315" y="150">SC3</text>
    <text x="210" y="288">SC4</text>
  </g>

  <!-- SC1 기능 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="135" y="54" width="150" height="24" rx="2" />
    <rect x="30" y="162" width="150" height="24" rx="2" />
    <rect x="240" y="162" width="150" height="24" rx="2" />
    <rect x="135" y="300" width="150" height="24" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="70">SC1 기능</text>
    <text x="105" y="178">SC1 기능</text>
    <text x="315" y="178">SC1 기능</text>
    <text x="210" y="316">SC1 기능</text>
  </g>

  <!-- timing protection 등 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="30.75" y="192.75" width="148.5" height="22.5" rx="2" />
    <rect x="135.75" y="330.75" width="148.5" height="22.5" rx="2" />
  </g>
  <!-- memory protection 등 -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="240.75" y="192.75" width="148.5" height="22.5" rx="2" />
    <rect x="135.75" y="360.75" width="148.5" height="22.5" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="105" y="208">timing protection 등</text>
    <text x="210" y="346">timing protection 등</text>
    <text x="315" y="208">memory protection 등</text>
    <text x="210" y="376">memory protection 등</text>
  </g>

  <!-- 더하는 방향 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 88 V108 H105 V125" />
    <path d="M230 88 V108 H315 V125" />
    <path d="M105 226 V246 H190 V263" />
    <path d="M315 226 V246 H230 V263" />
  </g>
</svg>
