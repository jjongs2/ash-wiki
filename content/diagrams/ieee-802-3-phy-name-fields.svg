<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1.5 730.5 138" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 세 필드 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="28">데이터율</text>
    <text x="330" y="28">변조 방식</text>
    <text x="450" y="28">추가 구분</text>
  </g>

  <!-- 10GBASE-T -->
  <text x="20" y="62" fill="var(--text, #727981)">10GBASE-T</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="160" y="44" width="100" height="28" rx="2" />
    <rect x="280" y="44" width="100" height="28" rx="2" />
    <rect x="400" y="44" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="62">10G</text>
    <text x="330" y="62">BASE</text>
    <text x="450" y="62">T</text>
  </g>
  <text x="520" y="62" fill="var(--text, #727981)">G: Gb/s 단위 · T: 꼬임쌍선</text>

  <!-- 100BASE-X -->
  <text x="20" y="106" fill="var(--text, #727981)">100BASE-X</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="160" y="88" width="100" height="28" rx="2" />
    <rect x="280" y="88" width="100" height="28" rx="2" />
    <rect x="400" y="88" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="106">100</text>
    <text x="330" y="106">BASE</text>
    <text x="450" y="106">X</text>
  </g>
  <text x="520" y="106" fill="var(--text, #727981)">숫자만: Mb/s 단위 · X: 블록 PCS 부호화</text>
</svg>
