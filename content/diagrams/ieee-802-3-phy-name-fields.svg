<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -1.5 460 180" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 세 필드 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="28">데이터율</text>
    <text x="270" y="28">변조 방식</text>
    <text x="390" y="28">추가 구분</text>
  </g>

  <!-- 10GBASE-T -->
  <text x="20" y="62" fill="var(--text, #727981)">10GBASE-T</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="44" width="100" height="28" rx="2" />
    <rect x="220" y="44" width="100" height="28" rx="2" />
    <rect x="340" y="44" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="62">10G</text>
    <text x="270" y="62">BASE</text>
    <text x="390" y="62">T</text>
  </g>
  <text x="100" y="90" fill="var(--text, #727981)">G: Gb/s 단위 · T: 꼬임쌍선</text>

  <!-- 100BASE-X -->
  <text x="20" y="130" fill="var(--text, #727981)">100BASE-X</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="100" y="112" width="100" height="28" rx="2" />
    <rect x="220" y="112" width="100" height="28" rx="2" />
    <rect x="340" y="112" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="130">100</text>
    <text x="270" y="130">BASE</text>
    <text x="390" y="130">X</text>
  </g>
  <text x="100" y="158" fill="var(--text, #727981)">숫자만: Mb/s 단위 · X: 블록 PCS 부호화</text>
</svg>
