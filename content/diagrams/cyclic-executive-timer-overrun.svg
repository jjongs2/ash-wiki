<svg xmlns="http://www.w3.org/2000/svg" viewBox="91 -3.5 523.5 156.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 타이머 인터럽트 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="140" y1="24" x2="140" y2="84" />
    <line x1="300" y1="24" x2="300" y2="84" />
    <line x1="460" y1="24" x2="460" y2="84" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="140" y="18">타이머 인터럽트</text>
    <text x="300" y="18">타이머 인터럽트</text>
    <text x="460" y="18">타이머 인터럽트</text>
  </g>

  <!-- 계산 -->
  <text x="130" y="69" text-anchor="end" fill="var(--text, #727981)">계산</text>
  <rect x="140" y="50" width="110" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="195" y="69" text-anchor="middle" fill="var(--text, #727981)">계산 1</text>
  <rect x="300" y="50" width="220" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="380" y="69" text-anchor="middle" fill="var(--text, #727981)">계산 2</text>
  <line x1="460" y1="44" x2="460" y2="84" stroke="var(--red, #bb464d)" stroke-width="1.5" />

  <!-- 인터럽트가 하는 일 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="140" y="100">계산 1 시작</text>
    <text x="300" y="100">계산 1 끝남:</text>
    <text x="300" y="116">계산 2 시작</text>
    <text x="460" y="100">계산 2 끝나지 않음:</text>
    <text x="460" y="116">오류 복구</text>
  </g>

  <!-- 주기 -->
  <line x1="142" y1="40" x2="298" y2="40" stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="220" y="35" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주기</text>

  <!-- 시간 -->
  <line x1="140" y1="136" x2="574" y2="136" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="582" y="140" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
