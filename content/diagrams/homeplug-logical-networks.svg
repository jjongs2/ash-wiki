<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -26 545 227.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="같은 물리 매체 위의 logical network 둘">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판 -->
  <text x="272" y="4" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ISO 15118-3:2015</text>

  <!-- logical network -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="44" width="242" height="76" rx="2" />
    <rect x="282" y="44" width="242" height="76" rx="2" />
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="141" y="32">logical network 1 · 네트워크 키 1</text>
    <text x="403" y="32">logical network 2 · 네트워크 키 2</text>
  </g>

  <!-- 물리 매체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="20" y1="160" x2="524" y2="160" />
    <path d="M67 100 V160 M215 100 V160 M329 100 V160 M477 100 V160" />
  </g>
  <text x="272" y="180" text-anchor="middle" font-size="12" fill="var(--text, #727981)">물리 매체</text>

  <!-- 스테이션 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="35" y="60" width="64" height="40" rx="2" />
    <rect x="183" y="60" width="64" height="40" rx="2" />
    <rect x="297" y="60" width="64" height="40" rx="2" />
    <rect x="445" y="60" width="64" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="67" y="85">스테이션</text>
    <text x="215" y="85">스테이션</text>
    <text x="329" y="85">스테이션</text>
    <text x="477" y="85">스테이션</text>
  </g>

  <!-- 암호화한 페이로드 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="101" y1="92" x2="181" y2="92" />
    <line x1="363" y1="92" x2="443" y2="92" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="141" y="68">암호화한</text>
    <text x="141" y="82">페이로드</text>
    <text x="403" y="68">암호화한</text>
    <text x="403" y="82">페이로드</text>
  </g>
</svg>
