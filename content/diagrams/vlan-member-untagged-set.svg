<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 620 182" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 들어오는 프레임 -->
  <rect x="20.75" y="110.75" width="88.5" height="18.5" rx="2" stroke="#727981" stroke-width="1.5" />
  <text x="65" y="150" text-anchor="middle" font-size="12" fill="#727981">태그 없는 프레임</text>
  <line x1="112" y1="120" x2="188" y2="120" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 브리지 -->
  <rect x="190.75" y="30.75" width="258.5" height="160.5" rx="8" stroke="#727981" stroke-width="1.5" />
  <text x="204" y="52" fill="#727981">브리지</text>
  <g font-size="12" fill="#727981">
    <text x="202" y="124">포트 A</text>
    <text x="438" y="74" text-anchor="end">포트 B</text>
    <text x="438" y="124" text-anchor="end">포트 C</text>
    <text x="438" y="174" text-anchor="end">포트 D</text>
  </g>
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="320" y="104">포트 A의 PVID로 VLAN을 정함</text>
    <text x="320" y="130">member set: A, B, C</text>
    <text x="320" y="148">untagged set: A, B</text>
  </g>

  <!-- 나가는 프레임 -->
  <g stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="452" y1="70" x2="528" y2="70" />
    <line x1="452" y1="120" x2="528" y2="120" />
  </g>
  <rect x="530.75" y="60.75" width="88.5" height="18.5" rx="2" stroke="#727981" stroke-width="1.5" />
  <text x="575" y="98" text-anchor="middle" font-size="12" fill="#727981">태그 없이</text>
  <rect x="530.75" y="110.75" width="88.5" height="18.5" rx="2" stroke="#727981" stroke-width="1.5" />
  <rect x="558" y="111.5" width="16" height="17" fill="#b0540d" />
  <text x="575" y="148" text-anchor="middle" font-size="12" fill="#727981">VLAN 태그를 달고</text>
  <text x="462" y="174" font-size="12" fill="#727981">보내지 않음(member set 밖)</text>
</svg>
