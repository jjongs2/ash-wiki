<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.5 20 525 182" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="member set과 untagged set">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 들어오는 프레임 -->
  <rect x="20.75" y="110.75" width="68.5" height="18.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="55" y="150" text-anchor="middle" font-size="12" fill="var(--text, #727981)">태그 없는 프레임</text>
  <line x1="92" y1="120" x2="118" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 브리지 -->
  <rect x="120.75" y="30.75" width="248.5" height="160.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="134" y="52" fill="var(--text, #727981)">브리지</text>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="132" y="124">포트 A</text>
    <text x="358" y="74" text-anchor="end">포트 B</text>
    <text x="358" y="124" text-anchor="end">포트 C</text>
    <text x="358" y="174" text-anchor="end">포트 D</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="245" y="104">포트 A의 PVID로 VLAN을 정함</text>
    <text x="245" y="130">member set: A, B, C</text>
    <text x="245" y="148">untagged set: A, B</text>
  </g>

  <!-- 나가는 프레임 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="372" y1="70" x2="398" y2="70" />
    <line x1="372" y1="120" x2="398" y2="120" />
  </g>
  <rect x="400.75" y="60.75" width="68.5" height="18.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="435" y="98" text-anchor="middle" font-size="12" fill="var(--text, #727981)">태그 없이</text>
  <rect x="400.75" y="110.75" width="68.5" height="18.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="422.75" y="112.25" width="14.5" height="15.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="435" y="148" text-anchor="middle" font-size="12" fill="var(--text, #727981)">VLAN 태그를 달고</text>
  <text x="382" y="174" font-size="12" fill="var(--text, #727981)">보내지 않음(member set 밖)</text>
</svg>
