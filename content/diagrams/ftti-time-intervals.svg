<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.5 4.5 712.5 327.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 시각: fault 발생 x=40, fault 검출 x=300, 안전 상태나 emergency operation 도달 x=440, 해저드 사건 x=540, 안전 상태 도달(emergency operation 뒤) x=600 -->

  <text x="688" y="24" font-size="12" fill="var(--text, #727981)" text-anchor="end">ISO 26262-1:2018</text>

  <!-- fault 발생: 세 줄의 공통 시작점 -->
  <text x="40" y="24" font-size="12" fill="var(--text, #727981)" text-anchor="middle">fault 발생</text>
  <line x1="40" y1="30" x2="40" y2="306" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="40" y1="70" x2="680" y2="70" />
    <line x1="40" y1="150" x2="680" y2="150" />
    <line x1="40" y1="260" x2="680" y2="260" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="688" y="74">시간</text>
    <text x="688" y="154">시간</text>
    <text x="688" y="264">시간</text>
  </g>

  <!-- 눈금 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="540" y1="62" x2="540" y2="78" />
    <line x1="300" y1="142" x2="300" y2="158" />
    <line x1="440" y1="142" x2="440" y2="158" />
    <line x1="300" y1="252" x2="300" y2="268" />
    <line x1="440" y1="252" x2="440" y2="268" />
    <line x1="600" y1="252" x2="600" y2="268" />
  </g>

  <!-- 축 위의 글자 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="50" y="60">안전 메커니즘이 동작하지 않을 때</text>
    <text x="50" y="140">안전 상태에 바로 이를 때</text>
    <text x="50" y="250">emergency operation을 거칠 때</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="540" y="56">해저드 사건이 일어날 수 있는 때</text>
    <text x="300" y="140">fault 검출</text>
    <text x="490" y="140">안전 상태</text>
    <text x="300" y="250">fault 검출</text>
    <text x="520" y="250">emergency operation</text>
    <text x="640" y="250">안전 상태</text>
  </g>

  <!-- 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="41" y1="86" x2="539" y2="86" />
    <line x1="41" y1="166" x2="299" y2="166" />
    <line x1="301" y1="166" x2="439" y2="166" />
    <line x1="41" y1="196" x2="439" y2="196" />
    <line x1="41" y1="276" x2="299" y2="276" />
    <line x1="301" y1="276" x2="439" y2="276" />
    <line x1="441" y1="276" x2="599" y2="276" />
    <line x1="41" y1="306" x2="439" y2="306" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="290" y="102">FTTI</text>
    <text x="170" y="182">FDTI</text>
    <text x="370" y="182">FRTI</text>
    <text x="240" y="212">FHTI</text>
    <text x="170" y="292">FDTI</text>
    <text x="370" y="292">FRTI</text>
    <text x="520" y="292">EOTTI</text>
    <text x="240" y="322">FHTI</text>
  </g>
</svg>
