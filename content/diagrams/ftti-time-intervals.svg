<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 -1 532 385" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 시각: fault 발생 x=40, fault 검출 x=250, 안전 상태나 emergency operation 도달 x=340, 해저드 사건 x=415, 안전 상태 도달(emergency operation 뒤) x=465 -->

  <text x="14" y="20" font-size="12" fill="var(--text, #727981)">ISO 26262-1:2018</text>

  <!-- fault 발생: 세 줄의 공통 시작점 -->
  <text x="40" y="44" font-size="12" fill="var(--text, #727981)" text-anchor="middle">fault 발생</text>
  <line x1="40" y1="50" x2="40" y2="356" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 시간 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="40" y1="90" x2="500" y2="90" />
    <line x1="40" y1="190" x2="500" y2="190" />
    <line x1="40" y1="310" x2="500" y2="310" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="508" y="94">시간</text>
    <text x="508" y="194">시간</text>
    <text x="508" y="314">시간</text>
  </g>

  <!-- 눈금 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="415" y1="82" x2="415" y2="98" />
    <line x1="250" y1="182" x2="250" y2="198" />
    <line x1="340" y1="182" x2="340" y2="198" />
    <line x1="250" y1="302" x2="250" y2="318" />
    <line x1="340" y1="302" x2="340" y2="318" />
    <line x1="465" y1="302" x2="465" y2="318" />
  </g>

  <!-- 축 위의 글자 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="50" y="66">안전 메커니즘이 동작하지 않을 때</text>
    <text x="50" y="162">안전 상태에 바로 이를 때</text>
    <text x="50" y="282">emergency operation을 거칠 때</text>
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="415" y="76">해저드 사건이 일어날 수 있는 때</text>
    <text x="250" y="180">fault 검출</text>
    <text x="385" y="180">안전 상태</text>
    <text x="250" y="300">fault 검출</text>
    <text x="402.5" y="300">emergency operation</text>
    <text x="495" y="300">안전 상태</text>
  </g>

  <!-- 구간 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="41" y1="106" x2="414" y2="106" />
    <line x1="41" y1="206" x2="249" y2="206" />
    <line x1="251" y1="206" x2="339" y2="206" />
    <line x1="41" y1="236" x2="339" y2="236" />
    <line x1="41" y1="326" x2="249" y2="326" />
    <line x1="251" y1="326" x2="339" y2="326" />
    <line x1="341" y1="326" x2="464" y2="326" />
    <line x1="41" y1="356" x2="339" y2="356" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="227.5" y="122">FTTI</text>
    <text x="145" y="222">FDTI</text>
    <text x="295" y="222">FRTI</text>
    <text x="190" y="252">FHTI</text>
    <text x="145" y="342">FDTI</text>
    <text x="295" y="342">FRTI</text>
    <text x="402.5" y="342">EOTTI</text>
    <text x="190" y="372">FHTI</text>
  </g>
</svg>
