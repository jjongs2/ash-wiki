<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 190" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="IEC 61508과 분야별 표준">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 일반 표준 -->
  <rect x="111.25" y="20.75" width="299.5" height="48.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="261" y="41" font-size="14">IEC 61508</text>
    <text x="261" y="59">일반 표준 · 모든 E/E/PE 안전 관련 시스템</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M261 70 V94" />
    <path d="M75 94 H447" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M75 94 V116" />
    <path d="M199 94 V116" />
    <path d="M323 94 V116" />
    <path d="M447 94 V116" />
  </g>

  <!-- 분야별 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="120.75" width="108.5" height="48.5" rx="2" />
    <rect x="144.75" y="120.75" width="108.5" height="48.5" rx="2" />
    <rect x="268.75" y="120.75" width="108.5" height="48.5" rx="2" />
    <rect x="392.75" y="120.75" width="108.5" height="48.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="141" font-size="14">IEC 61511-1</text>
    <text x="75" y="159">공정 산업</text>
    <text x="199" y="141" font-size="14">IEC 62061</text>
    <text x="199" y="159">기계</text>
    <text x="323" y="141" font-size="14">IEC 61513</text>
    <text x="323" y="159">원자력</text>
    <text x="447" y="141" font-size="14">ISO 26262</text>
    <text x="447" y="159">도로 차량</text>
  </g>
</svg>
