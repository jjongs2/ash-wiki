<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 190" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 일반 표준 -->
  <rect x="172.75" y="20.75" width="299.5" height="48.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="322.5" y="41" font-size="14">IEC 61508</text>
    <text x="322.5" y="59">일반 표준 · 모든 E/E/PE 안전 관련 시스템</text>
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M322.5 70 V94" />
    <path d="M90 94 H555" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M90 94 V116" />
    <path d="M245 94 V116" />
    <path d="M400 94 V116" />
    <path d="M555 94 V116" />
  </g>

  <!-- 분야별 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="120.75" width="138.5" height="48.5" rx="2" />
    <rect x="175.75" y="120.75" width="138.5" height="48.5" rx="2" />
    <rect x="330.75" y="120.75" width="138.5" height="48.5" rx="2" />
    <rect x="485.75" y="120.75" width="138.5" height="48.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="141" font-size="14">IEC 61511-1</text>
    <text x="90" y="159">공정 산업</text>
    <text x="245" y="141" font-size="14">IEC 62061</text>
    <text x="245" y="159">기계</text>
    <text x="400" y="141" font-size="14">IEC 61513</text>
    <text x="400" y="159">원자력</text>
    <text x="555" y="141" font-size="14">ISO 26262</text>
    <text x="555" y="159">도로 차량</text>
  </g>
