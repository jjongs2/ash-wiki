<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 18 663.5 87" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <rect x="20" y="30" width="90" height="40" rx="4" fill="#336fb8" />
  <text x="65" y="55" text-anchor="middle" fill="#f8fafd">T1</text>
  <rect x="290" y="30" width="90" height="40" rx="4" fill="#825da9" />
  <text x="335" y="55" text-anchor="middle" fill="#f8fafd">T2</text>
  <rect x="560" y="30" width="90" height="40" rx="4" fill="#825da9" />
  <text x="605" y="55" text-anchor="middle" fill="#f8fafd">T3</text>
  <g stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="50" x2="288" y2="50" />
    <line x1="380" y1="50" x2="558" y2="50" />
  </g>
  <g font-size="12" fill="#727981" text-anchor="middle">
    <text x="200" y="40">T2가 쥔 락에서 블록</text>
    <text x="470" y="40">T3가 쥔 자원에서 블록</text>
    <text x="335" y="92">T1의 우선순위를 물려받음</text>
    <text x="605" y="92">T1의 우선순위가 전해짐</text>
  </g>
</svg>
