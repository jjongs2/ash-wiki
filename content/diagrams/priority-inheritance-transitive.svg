<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 18 663.5 87" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="전이적인 우선순위 상속">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <rect x="20" y="30" width="90" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="65" y="55" text-anchor="middle" fill="var(--text, #727981)">T1</text>
  <rect x="290.75" y="30.75" width="88.5" height="38.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="335" y="55" text-anchor="middle" fill="var(--on-fill, #f8fafd)">T2</text>
  <rect x="560.75" y="30.75" width="88.5" height="38.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="605" y="55" text-anchor="middle" fill="var(--on-fill, #f8fafd)">T3</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="50" x2="288" y2="50" />
    <line x1="380" y1="50" x2="558" y2="50" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="200" y="40">T2가 쥔 락에서 블록</text>
    <text x="470" y="40">T3가 쥔 자원에서 블록</text>
    <text x="335" y="92">T1의 우선순위를 물려받음</text>
    <text x="605" y="92">T1의 우선순위가 전해짐</text>
  </g>
</svg>
