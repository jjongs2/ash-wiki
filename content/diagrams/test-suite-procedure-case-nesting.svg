<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 294" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 틀: 테스트 스위트, 펼친 테스트 절차, 접은 테스트 절차. 두 절차는 같은 꼴의 틀로 그린다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="20" width="356" height="254" rx="2" />
    <rect x="34" y="50" width="328" height="164" rx="2" />
    <rect x="34" y="228" width="328" height="30" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="38">테스트 스위트</text>
    <text x="46" y="68">테스트 절차</text>
    <text x="46" y="247">테스트 절차</text>
  </g>

  <!-- 펼친 테스트 절차: 실행 순서. 윗줄은 왼쪽에서 오른쪽, 아랫줄은 오른쪽에서 왼쪽 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="48" y="80" width="100" height="44" rx="2" />
    <rect x="188" y="80" width="160" height="44" rx="2" />
    <rect x="188" y="156" width="160" height="44" rx="2" />
    <rect x="48" y="156" width="100" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="98" y="98">사전 조건을</text>
    <text x="98" y="115">갖추는 동작</text>
    <text x="268" y="98">테스트 케이스</text>
    <text x="268" y="115" font-size="12">사전 조건, 입력, 기대 결과</text>
    <text x="268" y="174">테스트 케이스</text>
    <text x="268" y="191" font-size="12">사전 조건, 입력, 기대 결과</text>
    <text x="98" y="174">실행 뒤의</text>
    <text x="98" y="191">마무리 활동</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="148" y1="102" x2="186" y2="102" />
    <line x1="268" y1="124" x2="268" y2="154" />
    <line x1="188" y1="178" x2="150" y2="178" />
  </g>
</svg>
