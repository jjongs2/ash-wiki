<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 25.5 526 189.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="TJA1462의 웨이크업 패턴">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 버스 상태 -->
  <g fill="var(--text, #727981)" text-anchor="end">
    <text x="104" y="44">dominant</text>
    <text x="104" y="94">recessive</text>
  </g>
  <path d="M114 90 H160 V40 H270 V90 H380 V40 H490 V90 H560" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- 구간 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="160" y1="92" x2="160" y2="160" />
    <line x1="270" y1="92" x2="270" y2="126" />
    <line x1="380" y1="92" x2="380" y2="126" />
    <line x1="490" y1="92" x2="490" y2="160" />
  </g>

  <!-- 구간마다 최소 길이, 전체는 정해진 시간 안 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="162" y1="114" x2="268" y2="114" />
    <line x1="272" y1="114" x2="378" y2="114" />
    <line x1="382" y1="114" x2="488" y2="114" />
    <line x1="162" y1="152" x2="488" y2="152" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="215" y="134">최소 길이 넘김</text>
    <text x="325" y="134">최소 길이 넘김</text>
    <text x="435" y="134">최소 길이 넘김</text>
    <text x="325" y="174">패턴 전체를 정해진 시간 안에 받음</text>
    <text x="325" y="204">TJA1462의 웨이크업 패턴</text>
  </g>
</svg>
