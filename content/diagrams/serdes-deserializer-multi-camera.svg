<svg xmlns="http://www.w3.org/2000/svg" viewBox="29.5 9.5 491 191" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="여러 카메라의 링크를 받는 역직렬화기">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="20" width="70" height="36" rx="2" />
    <rect x="140" y="20" width="76" height="36" rx="2" />
    <rect x="40" y="74" width="70" height="36" rx="2" />
    <rect x="140" y="74" width="76" height="36" rx="2" />
    <rect x="40" y="154" width="70" height="36" rx="2" />
    <rect x="140" y="154" width="76" height="36" rx="2" />
    <rect x="300" y="20" width="90" height="170" rx="2" />
    <rect x="440" y="87" width="70" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="43">카메라</text>
    <text x="178" y="43">직렬화기</text>
    <text x="75" y="97">카메라</text>
    <text x="178" y="97">직렬화기</text>
    <text x="75" y="177">카메라</text>
    <text x="178" y="177">직렬화기</text>
    <text x="345" y="110">역직렬화기</text>
    <text x="475" y="110">SoC</text>
  </g>

  <!-- 더 있는 카메라 -->
  <g fill="var(--ink, #727981)">
    <circle cx="75" cy="122" r="1.5" />
    <circle cx="75" cy="132" r="1.5" />
    <circle cx="75" cy="142" r="1.5" />
    <circle cx="178" cy="122" r="1.5" />
    <circle cx="178" cy="132" r="1.5" />
    <circle cx="178" cy="142" r="1.5" />
  </g>

  <!-- 연결 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="38" x2="138" y2="38" />
    <line x1="110" y1="92" x2="138" y2="92" />
    <line x1="110" y1="172" x2="138" y2="172" />
    <line x1="216" y1="38" x2="298" y2="38" />
    <line x1="216" y1="92" x2="298" y2="92" />
    <line x1="216" y1="172" x2="298" y2="172" />
    <line x1="390" y1="105" x2="438" y2="105" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="257" y="30">링크</text>
    <text x="257" y="84">링크</text>
    <text x="257" y="164">링크</text>
    <text x="414" y="97">CSI-2</text>
  </g>
</svg>
