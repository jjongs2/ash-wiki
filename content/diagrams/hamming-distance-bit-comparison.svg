<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 8 220 123" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 같은 자리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="60.75" y="20.75" width="34.5" height="34.5" fill="var(--surface, none)" />
    <rect x="140.75" y="20.75" width="34.5" height="34.5" fill="var(--surface, none)" />
    <rect x="220.75" y="20.75" width="34.5" height="34.5" fill="var(--surface, none)" />
    <rect x="60.75" y="60.75" width="34.5" height="34.5" fill="var(--surface, none)" />
    <rect x="140.75" y="60.75" width="34.5" height="34.5" fill="var(--surface, none)" />
    <rect x="220.75" y="60.75" width="34.5" height="34.5" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="78" y="43">1</text><text x="158" y="43">1</text><text x="238" y="43">0</text>
    <text x="78" y="83">1</text><text x="158" y="83">1</text><text x="238" y="83">0</text>
  </g>

  <!-- 값이 다른 자리 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="100.75" y="20.75" width="34.5" height="34.5" />
    <rect x="180.75" y="20.75" width="34.5" height="34.5" />
    <rect x="100.75" y="60.75" width="34.5" height="34.5" />
    <rect x="180.75" y="60.75" width="34.5" height="34.5" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="118" y="43">0</text><text x="198" y="43">1</text>
    <text x="118" y="83">1</text><text x="198" y="83">0</text>
  </g>

  <text x="158" y="118" text-anchor="middle" font-size="12" fill="var(--text, #727981)">값이 다른 자리 2개: 해밍 거리 2</text>
</svg>
