<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="리스크 분석과 리스크 통제로 묶은 네 가지">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 틀: 리스크 분석, 리스크 통제 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="20" y="20" width="310" height="90" rx="2" />
    <rect x="410" y="20" width="310" height="90" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="32" y="38">리스크 분석</text>
    <text x="422" y="38">리스크 통제</text>
  </g>

  <!-- 활동 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="54" width="120" height="36" rx="2" />
    <rect x="190" y="54" width="120" height="36" rx="2" />
    <rect x="430" y="54" width="120" height="36" rx="2" />
    <rect x="580" y="54" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="76.5">리스크 식별</text>
    <text x="250" y="76.5">리스크 평가</text>
    <text x="490" y="76.5">리스크 완화</text>
    <text x="640" y="76.5">리스크 모니터링</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="160" y1="72" x2="188" y2="72" />
    <line x1="310" y1="72" x2="428" y2="72" />
    <line x1="550" y1="72" x2="578" y2="72" />
    <path d="M640 90 V140 H250 V92" stroke-dasharray="5 4" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="370" y="64">제안한 조치</text>
    <text x="445" y="158">평가를 다듬을 정보</text>
  </g>
</svg>
