<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -27.5 509 582" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="ASPICE 4.1의 프로세스 범주와 그룹">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 판 -->
  <text x="254" y="2" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ASPICE 4.1</text>

  <!-- 범주: 그룹을 담는 틀 -->
