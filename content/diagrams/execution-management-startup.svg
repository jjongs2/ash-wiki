<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 530 440" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g font-size="14" fill="var(--text, #727981)">
    <text x="20" y="32">프로세스 시작 순서</text>
    <text x="20" y="322">Machine State</text>
  </g>

  <!-- 시작 순서 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="44" width="210" height="36" rx="2" />
    <rect x="20" y="100" width="210" height="44" rx="2" />
    <rect x="20" y="164" width="210" height="44" rx="2" />
    <rect x="20" y="228" width="210" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="125" y="66.5">운영체제 초기화</text>
    <text x="125" y="119">Execution Management</text>
    <text x="125" y="183">Adaptive Platform Foundation</text>
    <text x="125" y="247">Adaptive Application</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="125" y="135">첫 프로세스</text>
    <text x="125" y="199">functional cluster 프로세스</text>
    <text x="125" y="263">프로세스</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="125" y1="80" x2="125" y2="98" />
    <line x1="125" y1="144" x2="125" y2="162" />
    <line x1="125" y1="208" x2="125" y2="226" />
  </g>
  <!-- 플랫폼 수준과 응용 수준의 순서를 정하는 근거 -->
  <path d="M238 164 h6 V272 h-6" stroke="var(--ink, #727981)" stroke-width="1" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="256" y="206">Machine Manifest와,</text>
    <text x="256" y="222">Execution Manifest의 의존성으로</text>
    <text x="256" y="238">순서를 정한다</text>
  </g>

  <!-- Machine State -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="342" width="80" height="36" rx="2" />
    <rect x="190" y="342" width="100" height="36" rx="2" />
    <rect x="350" y="342" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="60" y="364.5">Off</text>
    <text x="240" y="364.5">Startup</text>
    <text x="430" y="364.5">State Management</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="360" x2="188" y2="360" />
    <line x1="290" y1="360" x2="348" y2="360" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="144" y="352">준비를 마치면</text>
    <text x="319" y="352">전이 확인</text>
    <text x="60" y="400">기본 상태</text>
    <text x="240" y="400">Startup에 속한 프로세스 시작</text>
    <text x="430" y="400">Function Group 상태</text>
    <text x="430" y="416">변경 시작을 맡는다</text>
  </g>
</svg>
