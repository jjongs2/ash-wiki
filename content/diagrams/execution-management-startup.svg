<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1.5 750 254.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g font-size="14" fill="var(--text, #727981)">
    <text x="20" y="32">프로세스 시작 순서</text>
    <text x="20" y="162">Machine State</text>
  </g>

  <!-- 시작 순서 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="48" width="110" height="44" rx="2" />
    <rect x="166" y="48" width="160" height="44" rx="2" />
    <rect x="362" y="48" width="190" height="44" rx="2" />
    <rect x="588" y="48" width="142" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="74.5">운영체제 초기화</text>
    <text x="246" y="67">Execution Management</text>
    <text x="457" y="67">Adaptive Platform Foundation</text>
    <text x="659" y="67">Adaptive Application</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="246" y="83">첫 프로세스</text>
    <text x="457" y="83">functional cluster 프로세스</text>
    <text x="659" y="83">프로세스</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="70" x2="164" y2="70" />
    <line x1="326" y1="70" x2="360" y2="70" />
    <line x1="552" y1="70" x2="586" y2="70" />
  </g>
  <!-- 플랫폼 수준과 응용 수준의 순서를 정하는 근거 -->
  <path d="M362 100 v6 H730 v-6" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="546" y="124" text-anchor="middle" font-size="12" fill="var(--text, #727981)">Machine Manifest와, Execution Manifest의 의존성으로 순서를 정한다</text>

  <!-- Machine State -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="178" width="90" height="36" rx="2" />
    <rect x="230" y="178" width="100" height="36" rx="2" />
    <rect x="450" y="178" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="200.5">Off</text>
    <text x="280" y="200.5">Startup</text>
    <text x="530" y="200.5">State Management</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="110" y1="196" x2="228" y2="196" />
    <line x1="330" y1="196" x2="448" y2="196" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="169" y="188">준비를 마치면</text>
    <text x="389" y="188">전이 확인</text>
    <text x="65" y="234">기본 상태</text>
    <text x="280" y="234">Startup에 속한 프로세스 시작</text>
    <text x="530" y="234">Function Group 상태 변경 시작을 맡는다</text>
  </g>
</svg>
