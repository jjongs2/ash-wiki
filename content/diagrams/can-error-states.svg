<svg xmlns="http://www.w3.org/2000/svg" viewBox="60.5 0 588.5 222.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 계수기 값에 따른 오류 상태 -->
  <rect x="120" y="20" width="179" height="40" fill="#337b47" />
  <rect x="300" y="20" width="179" height="40" fill="#b0540d" />
  <rect x="480" y="20" width="140" height="40" fill="#bb464d" />
  <g text-anchor="middle" fill="#f8fafd">
    <text x="209.5" y="45">error active</text>
    <text x="389.5" y="45">error passive</text>
    <text x="550" y="45">bus-off</text>
  </g>

  <!-- 계수기 값 축 -->
  <line x1="120" y1="78" x2="628" y2="78" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="#727981" stroke-width="1.5">
    <line x1="120" y1="72" x2="120" y2="84" />
    <line x1="300" y1="64" x2="300" y2="84" />
    <line x1="480" y1="64" x2="480" y2="84" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="120" y="100">0</text>
    <text x="300" y="100">127/128</text>
    <text x="480" y="100">255/256</text>
  </g>

  <!-- 계수기마다 이를 수 있는 상태 -->
  <text x="106" y="133" text-anchor="end" fill="#727981">TEC</text>
  <line x1="120" y1="128" x2="614" y2="128" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="106" y="165" text-anchor="end" fill="#727981">REC</text>
  <line x1="120" y1="160" x2="479" y2="160" stroke="#727981" stroke-width="1.5" />
  <line x1="480" y1="152" x2="480" y2="168" stroke="#727981" stroke-width="1.5" />
  <text x="492" y="164" font-size="12" fill="#727981">bus-off로 가지 않는다</text>

  <text x="370" y="200" text-anchor="middle" font-size="12" fill="#727981">TEC &gt; 127 또는 REC &gt; 127이면 error passive, TEC &gt; 255이면 bus-off</text>
</svg>
