<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 510 208.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 노드와 링크 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="120" y1="38" x2="230" y2="38" />
    <line x1="320" y1="38" x2="430" y2="38" />
  </g>
  <rect x="30.75" y="20.75" width="88.5" height="34.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="75" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">발신 호스트</text>
  <rect x="230.75" y="20.75" width="88.5" height="34.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="275" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">라우터</text>
  <rect x="430.75" y="20.75" width="88.5" height="34.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="475" y="43" text-anchor="middle" fill="var(--on-fill, #f8fafd)">목적 호스트</text>
  <!-- 첫 링크의 프레임 -->
  <rect x="42.75" y="76.75" width="90.5" height="42.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="88" y="103" text-anchor="middle" fill="var(--on-fill, #f8fafd)">링크 계층 헤더</text>
  <rect x="136.75" y="76.75" width="118.5" height="42.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="196" y="95" text-anchor="middle" fill="var(--on-fill, #f8fafd)">IP 헤더</text>
  <text x="196" y="112" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">목적 주소: 목적 호스트</text>
  <rect x="258.75" y="76.75" width="48.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="283" y="103" text-anchor="middle" fill="var(--text, #727981)">데이터</text>
  <!-- 다음 홉으로 가는 새 프레임 -->
  <rect x="234.75" y="136.75" width="106.5" height="42.5" fill="var(--red-tint, #bb464d)" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="288" y="163" text-anchor="middle" fill="var(--on-fill, #f8fafd)">새 링크 계층 헤더</text>
  <rect x="344.75" y="136.75" width="118.5" height="42.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="404" y="155" text-anchor="middle" fill="var(--on-fill, #f8fafd)">IP 헤더</text>
  <text x="404" y="172" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">목적 주소: 목적 호스트</text>
  <rect x="466.75" y="136.75" width="48.5" height="42.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="491" y="163" text-anchor="middle" fill="var(--text, #727981)">데이터</text>
  <text x="275" y="206" text-anchor="middle" font-size="12" fill="var(--text, #727981)">라우터는 링크 계층 헤더를 떼고, 데이터그램을 새 링크 계층 프레임에 다시 담는다</text>
</svg>
