<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 12.5 651 482.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 개발 산출물 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="60" y="40" width="180" height="32" rx="4" />
    <rect x="60" y="102" width="180" height="32" rx="4" />
    <rect x="60" y="164" width="180" height="32" rx="4" />
    <rect x="60" y="226" width="180" height="32" rx="4" />
    <rect x="60" y="288" width="180" height="32" rx="4" />
    <rect x="60" y="350" width="180" height="32" rx="4" />
    <rect x="60" y="412" width="180" height="32" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="61">이해관계자 요구사항</text>
    <text x="150" y="123">시스템 요구사항</text>
    <text x="150" y="185">시스템 아키텍처</text>
    <text x="150" y="247">소프트웨어 요구사항</text>
    <text x="150" y="309">소프트웨어 아키텍처</text>
    <text x="150" y="371">소프트웨어 상세 설계</text>
    <text x="150" y="433">소프트웨어 유닛</text>
  </g>

  <!-- 양방향 추적성 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="150" y1="74" x2="150" y2="100" />
    <line x1="150" y1="136" x2="150" y2="162" />
    <line x1="150" y1="198" x2="150" y2="224" />
    <line x1="150" y1="260" x2="150" y2="286" />
    <line x1="150" y1="322" x2="150" y2="348" />
    <line x1="150" y1="384" x2="150" y2="410" />
    <path d="M58 118 H44 V236 H58" />
    <line x1="242" y1="56" x2="338" y2="56" />
    <line x1="472" y1="56" x2="528" y2="56" />
    <line x1="256" y1="273" x2="338" y2="273" />
    <line x1="472" y1="273" x2="528" y2="273" />
  </g>

  <!-- 추적성 -->
  <path d="M58 248 H30 V366 H58" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- 검증 대상 -->
  <path d="M246 102 H254 V444 H246" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="297" y="265" font-size="12" text-anchor="middle" fill="var(--text, #727981)">검증 대상</text>

  <!-- 확인과 검증 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="340" y="33" width="130" height="46" rx="4" stroke-dasharray="5 4" />
    <rect x="530" y="40" width="110" height="32" rx="4" />
    <rect x="340" y="257" width="130" height="32" rx="4" />
    <rect x="530" y="257" width="110" height="32" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="405" y="53">확인 수단</text>
    <text x="405" y="70" font-size="12">(해당할 때)</text>
    <text x="585" y="61">확인 결과</text>
    <text x="405" y="278">검증 수단</text>
    <text x="585" y="278">검증 결과</text>
  </g>

  <!-- 범례 -->
  <line x1="60" y1="470" x2="100" y2="470" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="220" y1="470" x2="260" y2="470" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="110" y="474">양방향 추적성</text>
    <text x="270" y="474">추적성</text>
    <text x="640" y="474" text-anchor="end">ASPICE 4.1</text>
  </g>
</svg>
