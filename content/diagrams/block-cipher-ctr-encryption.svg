<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 10 524 220" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 카운터 블록, 순방향 함수, 평문 블록 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="138" y="20" width="64" height="28" rx="2" />
    <rect x="318" y="20" width="64" height="28" rx="2" />
    <rect x="498" y="20" width="64" height="28" rx="2" />
    <rect x="126" y="72" width="88" height="36" rx="4" />
    <rect x="306" y="72" width="88" height="36" rx="4" />
    <rect x="486" y="72" width="88" height="36" rx="4" />
    <rect x="70" y="136" width="56" height="28" rx="2" />
    <rect x="250" y="136" width="56" height="28" rx="2" />
    <rect x="430" y="136" width="56" height="28" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="170" y="39">T<tspan dy="4" font-size="10">1</tspan></text>
    <text x="350" y="39">T<tspan dy="4" font-size="10">2</tspan></text>
    <text x="530" y="39">T<tspan dy="4" font-size="10">3</tspan></text>
    <text x="170" y="95">CIPH<tspan dy="4" font-size="10">K</tspan></text>
    <text x="350" y="95">CIPH<tspan dy="4" font-size="10">K</tspan></text>
    <text x="530" y="95">CIPH<tspan dy="4" font-size="10">K</tspan></text>
    <text x="98" y="155">P<tspan dy="4" font-size="10">1</tspan></text>
    <text x="278" y="155">P<tspan dy="4" font-size="10">2</tspan></text>
    <text x="458" y="155">P<tspan dy="4" font-size="10">3</tspan></text>
  </g>
  <g fill="var(--text, #727981)" font-size="12">
    <text x="178" y="128">O<tspan dy="4" font-size="10">1</tspan></text>
    <text x="358" y="128">O<tspan dy="4" font-size="10">2</tspan></text>
    <text x="538" y="128">O<tspan dy="4" font-size="10">3</tspan></text>
  </g>

  <!-- 배타적 논리합 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <circle cx="170" cy="150" r="10" />
    <path d="M160 150 H180 M170 140 V160" />
    <circle cx="350" cy="150" r="10" />
    <path d="M340 150 H360 M350 140 V160" />
    <circle cx="530" cy="150" r="10" />
    <path d="M520 150 H540 M530 140 V160" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="170" y1="48" x2="170" y2="70" />
    <line x1="350" y1="48" x2="350" y2="70" />
    <line x1="530" y1="48" x2="530" y2="70" />
    <line x1="170" y1="108" x2="170" y2="138" />
    <line x1="350" y1="108" x2="350" y2="138" />
    <line x1="530" y1="108" x2="530" y2="138" />
    <line x1="126" y1="150" x2="158" y2="150" />
    <line x1="306" y1="150" x2="338" y2="150" />
    <line x1="486" y1="150" x2="518" y2="150" />
  </g>

  <!-- 암호문 블록 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="170" y1="160" x2="170" y2="190" />
    <line x1="350" y1="160" x2="350" y2="190" />
    <line x1="530" y1="160" x2="530" y2="190" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="138" y="192" width="64" height="28" rx="2" />
    <rect x="318" y="192" width="64" height="28" rx="2" />
    <rect x="498" y="192" width="64" height="28" rx="2" />
  </g>
  <g fill="var(--on-fill, #f8fafd)" text-anchor="middle">
    <text x="170" y="211">C<tspan dy="4" font-size="10">1</tspan></text>
    <text x="350" y="211">C<tspan dy="4" font-size="10">2</tspan></text>
    <text x="530" y="211">C<tspan dy="4" font-size="10">3</tspan></text>
  </g>
</svg>
