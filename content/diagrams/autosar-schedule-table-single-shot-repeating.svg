<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 10.5 660.5 237.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축: 시작은 x=140, duration은 240. 한 바퀴의 expiry point는 시작에서 40, 120, 200 뒤 -->

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="65">Single-shot</text>
    <text x="20" y="165">Repeating</text>
  </g>

  <!-- 틱 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="60" x2="640" y2="60" marker-end="url(#arrow)" />
    <line x1="140" y1="160" x2="640" y2="160" marker-end="url(#arrow)" />
    <line x1="140" y1="50" x2="140" y2="70" />
    <line x1="140" y1="150" x2="140" y2="170" />
    <line x1="380" y1="50" x2="380" y2="70" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="140" y="40">시작</text>
    <text x="140" y="140">시작</text>
    <text x="380" y="40">멈춤</text>
  </g>

  <!-- expiry point -->
  <g fill="var(--ink, #727981)">
    <circle cx="180" cy="60" r="6" />
    <circle cx="260" cy="60" r="6" />
    <circle cx="340" cy="60" r="6" />
    <circle cx="180" cy="160" r="6" />
    <circle cx="260" cy="160" r="6" />
    <circle cx="340" cy="160" r="6" />
    <circle cx="420" cy="160" r="6" />
    <circle cx="500" cy="160" r="6" />
    <circle cx="580" cy="160" r="6" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="180" y="40">initial</text>
    <text x="340" y="40">final</text>
    <text x="180" y="140">initial</text>
    <text x="340" y="140">final</text>
    <text x="420" y="140">initial</text>
    <text x="580" y="140">final</text>
  </g>

  <!-- 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="340" y1="66" x2="340" y2="80" />
    <line x1="340" y1="166" x2="340" y2="180" />
    <line x1="180" y1="166" x2="180" y2="214" />
    <line x1="420" y1="166" x2="420" y2="214" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="341" y1="80" x2="379" y2="80" />
    <line x1="341" y1="180" x2="419" y2="180" />
    <line x1="181" y1="210" x2="419" y2="210" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="360" y="98">final delay</text>
    <text x="428" y="184" text-anchor="start">final delay + initial offset</text>
    <text x="300" y="228">duration</text>
  </g>
</svg>
