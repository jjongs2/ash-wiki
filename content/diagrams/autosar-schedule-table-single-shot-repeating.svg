<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 10 521 290" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="single-shot과 repeating schedule table">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 가로축: 시작은 x=20, duration은 240. 한 바퀴의 expiry point는 시작에서 40, 120, 200 뒤. 행 이름은 축 위에 -->

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="40">Single-shot</text>
    <text x="20" y="162">Repeating</text>
  </g>

  <!-- 틱 축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="20" y1="90" x2="490" y2="90" marker-end="url(#arrow)" />
    <line x1="20" y1="212" x2="490" y2="212" marker-end="url(#arrow)" />
    <line x1="20" y1="80" x2="20" y2="100" />
    <line x1="20" y1="202" x2="20" y2="222" />
    <line x1="260" y1="80" x2="260" y2="100" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="20" y="70">시작</text>
    <text x="20" y="192">시작</text>
    <text x="260" y="70">멈춤</text>
  </g>

  <!-- expiry point -->
  <g fill="var(--ink, #727981)">
    <circle cx="60" cy="90" r="6" />
    <circle cx="140" cy="90" r="6" />
    <circle cx="220" cy="90" r="6" />
    <circle cx="60" cy="212" r="6" />
    <circle cx="140" cy="212" r="6" />
    <circle cx="220" cy="212" r="6" />
    <circle cx="300" cy="212" r="6" />
    <circle cx="380" cy="212" r="6" />
    <circle cx="460" cy="212" r="6" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="60" y="70">initial</text>
    <text x="220" y="70">final</text>
    <text x="60" y="192">initial</text>
    <text x="220" y="192">final</text>
    <text x="300" y="192">initial</text>
    <text x="460" y="192">final</text>
  </g>

  <!-- 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="96" x2="220" y2="110" />
    <line x1="220" y1="218" x2="220" y2="232" />
    <line x1="60" y1="218" x2="60" y2="266" />
    <line x1="300" y1="218" x2="300" y2="266" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="221" y1="110" x2="259" y2="110" />
    <line x1="221" y1="232" x2="299" y2="232" />
    <line x1="61" y1="262" x2="299" y2="262" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="240" y="128">final delay</text>
    <text x="308" y="236" text-anchor="start">final delay + initial offset</text>
    <text x="180" y="280">duration</text>
  </g>
</svg>
