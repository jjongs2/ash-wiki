<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 523.5 371" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 노드 하나의 신호 경로 -->
  <rect x="10.75" y="110.75" width="410.5" height="138.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="24" y="134" fill="var(--text, #727981)">노드</text>

  <rect x="24.75" y="160.75" width="90.5" height="42.5" rx="2" fill="var(--violet-tint, #825da9)" stroke="var(--violet, #825da9)" stroke-width="1.5" />
  <text x="70" y="187" text-anchor="middle" fill="var(--on-fill, #f8fafd)">호스트 CPU</text>
  <line x1="116" y1="182" x2="140" y2="182" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <rect x="140.75" y="154.75" width="104.5" height="54.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="193" y="187" text-anchor="middle" fill="var(--on-fill, #f8fafd)">CAN 컨트롤러</text>

  <line x1="246" y1="168" x2="300" y2="168" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="274" y="161" text-anchor="middle" font-size="12" fill="var(--text, #727981)">TXD</text>
  <line x1="302" y1="196" x2="248" y2="196" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="274" y="214" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RXD</text>

  <rect x="302.75" y="154.75" width="104.5" height="54.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="355" y="187" text-anchor="middle" fill="var(--on-fill, #f8fafd)">CAN 트랜시버</text>

  <!-- 트랜시버에서 버스로 -->
  <line x1="408" y1="168" x2="480" y2="168" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M408 196 H473 A7 7 0 0 1 487 196 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <circle cx="480" cy="168" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="510" cy="196" r="3.5" fill="var(--ink, #727981)" />
  <text x="451" y="161" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CAN_H</text>
  <text x="451" y="214" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CAN_L</text>

  <!-- 세로로 놓은 버스 두 선 -->
  <line x1="480" y1="32" x2="480" y2="330" stroke="var(--ink, #727981)" stroke-width="3" />
  <line x1="510" y1="32" x2="510" y2="330" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- 위아래 끝 종단 저항 -->
  <path d="M480 32 H485 M505 32 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="485" y="25" width="20" height="14" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="495" y="16" text-anchor="middle" font-size="12" fill="var(--text, #727981)">120 Ω</text>
  <path d="M480 330 H485 M505 330 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="485" y="323" width="20" height="14" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="495" y="358" text-anchor="middle" font-size="12" fill="var(--text, #727981)">120 Ω</text>

  <!-- 버스의 다른 노드: 노드 위아래, 버스 같은 쪽 -->
  <line x1="441" y1="63" x2="480" y2="63" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M441 77 H473 A7 7 0 0 1 487 77 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <circle cx="480" cy="63" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="510" cy="77" r="3.5" fill="var(--ink, #727981)" />
  <rect x="381.75" y="49.75" width="58.5" height="40.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="411" y="75" text-anchor="middle" fill="var(--text, #727981)">노드</text>
  <line x1="441" y1="283" x2="480" y2="283" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M441 297 H473 A7 7 0 0 1 487 297 H510" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <circle cx="480" cy="283" r="3.5" fill="var(--ink, #727981)" />
  <circle cx="510" cy="297" r="3.5" fill="var(--ink, #727981)" />
  <rect x="381.75" y="269.75" width="58.5" height="40.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="411" y="295" text-anchor="middle" fill="var(--text, #727981)">노드</text>
</svg>
