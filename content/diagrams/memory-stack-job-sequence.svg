<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 360" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="100" height="36" rx="2" />
    <rect x="150" y="20" width="100" height="36" rx="2" />
    <rect x="280" y="20" width="100" height="36" rx="2" />
    <rect x="410" y="20" width="100" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="43">NvM</text>
    <text x="200" y="43">Fee · Ea</text>
    <text x="330" y="43">MemAcc</text>
    <text x="460" y="43">Mem</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="70" y1="56" x2="70" y2="340" />
    <line x1="200" y1="56" x2="200" y2="340" />
    <line x1="330" y1="56" x2="330" y2="340" />
    <line x1="460" y1="56" x2="460" y2="340" />
  </g>

  <!-- 요청과 notification -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="70" y1="100" x2="198" y2="100" marker-end="url(#arrow)" />
    <line x1="200" y1="140" x2="72" y2="140" marker-end="url(#arrow)" />
    <line x1="200" y1="190" x2="328" y2="190" marker-end="url(#arrow)" />
    <line x1="330" y1="230" x2="458" y2="230" marker-end="url(#arrow)" />
    <line x1="330" y1="280" x2="202" y2="280" marker-end="url(#arrow)" />
    <line x1="200" y1="320" x2="72" y2="320" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="135" y="77">쓰기 요청</text>
    <text x="135" y="92">(MemIf를 거쳐)</text>
    <text x="135" y="132">E_OK로 돌아온다</text>
    <text x="265" y="182">job</text>
    <text x="395" y="207">MainFunction에서</text>
    <text x="395" y="222">job</text>
    <text x="265" y="272">완료 notification</text>
    <text x="135" y="297">완료 notification</text>
    <text x="135" y="312">(설정되어 있으면)</text>
  </g>
</svg>
