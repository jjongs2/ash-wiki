<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="120" height="36" rx="2" />
    <rect x="200" y="20" width="120" height="36" rx="2" />
    <rect x="380" y="20" width="120" height="36" rx="2" />
    <rect x="540" y="20" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="43">NvM</text>
    <text x="260" y="43">Fee · Ea</text>
    <text x="440" y="43">MemAcc</text>
    <text x="600" y="43">Mem</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="56" x2="80" y2="340" />
    <line x1="260" y1="56" x2="260" y2="340" />
    <line x1="440" y1="56" x2="440" y2="340" />
    <line x1="600" y1="56" x2="600" y2="340" />
  </g>

  <!-- 요청과 notification -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="80" y1="100" x2="258" y2="100" marker-end="url(#arrow)" />
    <line x1="260" y1="140" x2="82" y2="140" marker-end="url(#arrow)" />
    <line x1="260" y1="190" x2="438" y2="190" marker-end="url(#arrow)" />
    <line x1="440" y1="230" x2="598" y2="230" marker-end="url(#arrow)" />
    <line x1="440" y1="280" x2="262" y2="280" marker-end="url(#arrow)" />
    <line x1="260" y1="320" x2="82" y2="320" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="170" y="92">쓰기 요청 (MemIf를 거쳐)</text>
    <text x="170" y="132">E_OK로 돌아온다</text>
    <text x="350" y="182">job</text>
    <text x="520" y="222">MainFunction에서 job</text>
    <text x="350" y="272">완료 notification</text>
    <text x="170" y="297">완료 notification</text>
    <text x="170" y="312">(설정되어 있으면)</text>
  </g>
</svg>
