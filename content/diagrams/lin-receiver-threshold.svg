<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 4 550.5 138.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 판정 구간 -->
  <rect x="20" y="20" width="200" height="40" fill="#336fb8" />
  <text x="120" y="45" text-anchor="middle" fill="#f8fafd">dominant</text>
  <rect x="320" y="20" width="200" height="40" stroke="#727981" stroke-width="1.5" />
  <text x="420" y="45" text-anchor="middle" fill="#727981">recessive</text>

  <!-- 축: 버스 전압 / 배터리 전압 -->
  <line x1="20" y1="80" x2="546" y2="80" stroke="#727981" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="#727981" stroke-width="1.5">
    <line x1="20" y1="74" x2="20" y2="86" />
    <line x1="220" y1="14" x2="220" y2="86" />
    <line x1="320" y1="14" x2="320" y2="86" />
    <line x1="520" y1="74" x2="520" y2="86" />
  </g>
  <g text-anchor="middle" font-size="12" fill="#727981">
    <text x="20" y="102">0</text>
    <text x="220" y="102">40%</text>
    <text x="320" y="102">60%</text>
    <text x="520" y="102">100%</text>
  </g>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#727981">버스 전압 (배터리 전압에 대한 비율)</text>
</svg>
