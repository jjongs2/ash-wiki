<svg xmlns="http://www.w3.org/2000/svg" viewBox="15.5 1 549 260.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="ITS-G5 주파수 대역과 EU 시행 결정 2020/1426의 우선 사용">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 1 MHz = 6.25, 5855 MHz = 40 -->

  <!-- ETSI EN 302 571의 대역 -->
  <text x="40" y="22" fill="var(--text, #727981)">ETSI EN 302 571 V2.1.1</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="34" width="125" height="48" />
    <rect x="165" y="34" width="187.5" height="48" />
    <rect x="352.5" y="34" width="125" height="48" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="102.5" y="54">ITS-G5B</text>
    <text x="258.75" y="54">ITS-G5A</text>
    <text x="415" y="54">ITS-G5D</text>
    <g font-size="12">
      <text x="102.5" y="71">ITS 비안전 응용</text>
      <text x="258.75" y="71">ITS 도로 안전</text>
      <text x="415" y="71">앞으로의 ITS 응용</text>
    </g>
  </g>

  <!-- EU 시행 결정 2020/1426의 제한 -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="446.25" y="108">도로 ITS는</text>
    <text x="446.25" y="123">I2V만</text>
    <text x="508.75" y="108">urban rail</text>
    <text x="508.75" y="123">ITS만</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M416.5 138 V131 H476 V138" />
    <path d="M479 138 V131 H538.5 V138" />
  </g>

  <!-- EU 시행 결정 2020/1426의 우선 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="152" y="164">EU 시행 결정</text>
    <text x="152" y="181">2020/1426</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="165" y="144" width="250" height="48" />
    <rect x="415" y="144" width="125" height="48" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="290" y="172">도로 ITS 우선</text>
    <text x="477.5" y="172">urban rail ITS 우선</text>
  </g>

  <!-- 경계 보조선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="82" x2="40" y2="208" />
    <line x1="165" y1="82" x2="165" y2="144" />
    <line x1="352.5" y1="82" x2="352.5" y2="144" />
    <line x1="165" y1="192" x2="165" y2="208" />
    <line x1="352.5" y1="192" x2="352.5" y2="208" />
    <line x1="415" y1="192" x2="415" y2="208" />
    <line x1="540" y1="192" x2="540" y2="208" />
  </g>

  <!-- 주파수 축 -->
  <line x1="40" y1="208" x2="540" y2="208" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="40" y1="208" x2="40" y2="214" />
    <line x1="165" y1="208" x2="165" y2="214" />
    <line x1="352.5" y1="208" x2="352.5" y2="214" />
    <line x1="415" y1="208" x2="415" y2="214" />
    <line x1="477.5" y1="208" x2="477.5" y2="214" />
    <line x1="540" y1="208" x2="540" y2="214" />
  </g>
  <g text-anchor="middle" font-size="11" fill="var(--text, #727981)">
    <text x="40" y="228">5855</text>
    <text x="165" y="228">5875</text>
    <text x="352.5" y="228">5905</text>
    <text x="415" y="228">5915</text>
    <text x="477.5" y="228">5925</text>
    <text x="540" y="228">5935</text>
  </g>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="var(--text, #727981)">주파수 (MHz)</text>
</svg>
