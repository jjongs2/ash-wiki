<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 틀 -->
  <rect x="20.75" y="20.75" width="238.5" height="198.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="350.75" y="20.75" width="118.5" height="198.5" />
    <rect x="490.75" y="20.75" width="248.5" height="198.5" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="34" y="42">VFB view</text>
    <text x="364" y="42">ECU 1</text>
    <text x="504" y="42">ECU 2</text>
  </g>

  <!-- 매핑 -->
  <line x1="268" y1="130" x2="342" y2="130" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="305" y="122" text-anchor="middle" font-size="12" fill="var(--text, #727981)">ECU에 매핑</text>

  <!-- connector: ECU 사이 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="120" y1="78" x2="160" y2="78" />
    <line x1="450" y1="78" x2="640" y2="78" />
    <line x1="236" y1="246" x2="266" y2="246" />
  </g>
  <!-- connector: ECU 안, RTE를 지난다 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <line x1="200" y1="96" x2="200" y2="164" />
    <line x1="120" y1="182" x2="160" y2="182" />
    <path d="M680 96 V122 M680 146 V164" />
    <path d="M590 182 H600 M630 182 H640" />
    <line x1="490" y1="246" x2="520" y2="246" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="680" y="138">RTE</text>
    <text x="615" y="186">RTE</text>
  </g>

  <!-- SW-C -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40.75" y="60.75" width="78.5" height="34.5" rx="4" />
    <rect x="160.75" y="60.75" width="78.5" height="34.5" rx="4" />
    <rect x="160.75" y="164.75" width="78.5" height="34.5" rx="4" />
    <rect x="40.75" y="164.75" width="78.5" height="34.5" rx="4" />
    <rect x="370.75" y="60.75" width="78.5" height="34.5" rx="4" />
    <rect x="640.75" y="60.75" width="78.5" height="34.5" rx="4" />
    <rect x="640.75" y="164.75" width="78.5" height="34.5" rx="4" />
    <rect x="510.75" y="164.75" width="78.5" height="34.5" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="80" y="83">SW-C A</text>
    <text x="200" y="83">SW-C B</text>
    <text x="200" y="187">SW-C C</text>
    <text x="80" y="187">SW-C D</text>
    <text x="410" y="83">SW-C A</text>
    <text x="680" y="83">SW-C B</text>
    <text x="680" y="187">SW-C C</text>
    <text x="550" y="187">SW-C D</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="160" y="250">connector</text>
    <text x="274" y="250">ECU 사이 통신: CAN·FlexRay 프레임</text>
    <text x="528" y="250">ECU 안 통신</text>
  </g>
</svg>
