<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 555" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="VFB view의 SW-C를 ECU에 매핑">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 틀 -->
  <rect x="95.75" y="20.75" width="238.5" height="198.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="280.75" width="118.5" height="198.5" />
    <rect x="160.75" y="280.75" width="248.5" height="198.5" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="109" y="42">VFB view</text>
    <text x="34" y="302">ECU 1</text>
    <text x="174" y="302">ECU 2</text>
  </g>

  <!-- 매핑 -->
  <line x1="215" y1="228" x2="215" y2="272" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="223" y="254" font-size="12" fill="var(--text, #727981)">ECU에 매핑</text>

  <!-- RTE: ECU마다 하나 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30.75" y="380.75" width="98.5" height="24.5" rx="2" />
    <rect x="170.75" y="380.75" width="228.5" height="24.5" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="80" y="397">RTE</text>
    <text x="275" y="397">RTE</text>
  </g>

  <!-- connector: ECU 사이, 두 ECU의 RTE를 지난다 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <line x1="195" y1="78" x2="235" y2="78" />
    <line x1="80" y1="356" x2="80" y2="380" />
    <line x1="130" y1="393" x2="170" y2="393" />
    <line x1="330" y1="356" x2="330" y2="380" />
    <line x1="165" y1="508" x2="195" y2="508" />
  </g>
  <!-- connector: ECU 안, RTE를 지난다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="275" y1="96" x2="275" y2="164" />
    <line x1="195" y1="182" x2="235" y2="182" />
    <path d="M370 356 V380 M370 406 V424" />
    <line x1="220" y1="406" x2="220" y2="424" />
    <line x1="165" y1="528" x2="195" y2="528" />
  </g>

  <!-- SW-C -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="115.75" y="60.75" width="78.5" height="34.5" rx="2" />
    <rect x="235.75" y="60.75" width="78.5" height="34.5" rx="2" />
    <rect x="235.75" y="164.75" width="78.5" height="34.5" rx="2" />
    <rect x="115.75" y="164.75" width="78.5" height="34.5" rx="2" />
    <rect x="40.75" y="320.75" width="78.5" height="34.5" rx="2" />
    <rect x="310.75" y="320.75" width="78.5" height="34.5" rx="2" />
    <rect x="310.75" y="424.75" width="78.5" height="34.5" rx="2" />
    <rect x="180.75" y="424.75" width="78.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="155" y="83">SW-C A</text>
    <text x="275" y="83">SW-C B</text>
    <text x="275" y="187">SW-C C</text>
    <text x="155" y="187">SW-C D</text>
    <text x="80" y="343">SW-C A</text>
    <text x="350" y="343">SW-C B</text>
    <text x="350" y="447">SW-C C</text>
    <text x="220" y="447">SW-C D</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="95" y="512">connector</text>
    <text x="201" y="512">ECU 사이 통신: CAN·FlexRay 프레임</text>
    <text x="201" y="532">ECU 안 통신</text>
  </g>
</svg>
