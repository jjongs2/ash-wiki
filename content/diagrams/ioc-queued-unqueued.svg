<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4.5 505 233" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 위: queued(FIFO), 아래: unqueued(last-is-best). 통신마다 생성되는 API 이름을 화살표에 적는다. 행 이름은 행 위에 -->

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="34">queued</text>
    <text x="20" y="144">unqueued</text>
  </g>

  <!-- 송신자와 수신자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="60" width="60" height="28" rx="2" />
    <rect x="425" y="60" width="60" height="28" rx="2" />
    <rect x="20" y="170" width="60" height="28" rx="2" />
    <rect x="425" y="170" width="60" height="28" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="50" y="78">송신자</text>
    <text x="455" y="78">수신자</text>
    <text x="50" y="188">송신자</text>
    <text x="455" y="188">수신자</text>
  </g>

  <!-- queue와 한 칸 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="205" y="60" width="30" height="28" />
    <rect x="235" y="60" width="30" height="28" />
    <rect x="265" y="60" width="30" height="28" />
    <rect x="235" y="170" width="30" height="28" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="250" y="108">FIFO</text>
    <text x="250" y="218">last-is-best</text>
  </g>

  <!-- API -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="82" y1="74" x2="202" y2="74" />
    <line x1="297" y1="74" x2="422" y2="74" />
    <line x1="82" y1="184" x2="232" y2="184" />
    <line x1="267" y1="184" x2="422" y2="184" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="142.5" y="64">IocSend_&lt;IocId&gt;</text>
    <text x="360" y="64">IocReceive_&lt;IocId&gt;</text>
    <text x="157" y="174">IocWrite_&lt;IocId&gt;</text>
    <text x="344.5" y="174">IocRead_&lt;IocId&gt;</text>
  </g>
</svg>
