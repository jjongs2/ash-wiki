<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 15.5 640 172.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 위: queued(FIFO), 아래: unqueued(last-is-best). 통신마다 생성되는 API 이름을 화살표에 적는다 -->

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="59">queued</text>
    <text x="20" y="139">unqueued</text>
  </g>

  <!-- 송신자와 수신자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="110" y="40" width="80" height="28" rx="2" />
    <rect x="540" y="40" width="80" height="28" rx="2" />
    <rect x="110" y="120" width="80" height="28" rx="2" />
    <rect x="540" y="120" width="80" height="28" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="58">송신자</text>
    <text x="580" y="58">수신자</text>
    <text x="150" y="138">송신자</text>
    <text x="580" y="138">수신자</text>
  </g>

  <!-- queue와 한 칸 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="320" y="40" width="30" height="28" rx="2" />
    <rect x="350" y="40" width="30" height="28" rx="2" />
    <rect x="380" y="40" width="30" height="28" rx="2" />
    <rect x="350" y="120" width="30" height="28" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="365" y="88">FIFO</text>
    <text x="365" y="168">last-is-best</text>
  </g>

  <!-- API -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="192" y1="54" x2="317" y2="54" />
    <line x1="412" y1="54" x2="537" y2="54" />
    <line x1="192" y1="134" x2="347" y2="134" />
    <line x1="382" y1="134" x2="537" y2="134" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="255" y="44">IocSend_&lt;IocId&gt;</text>
    <text x="475" y="44">IocReceive_&lt;IocId&gt;</text>
    <text x="270" y="124">IocWrite_&lt;IocId&gt;</text>
    <text x="460" y="124">IocRead_&lt;IocId&gt;</text>
  </g>
</svg>
