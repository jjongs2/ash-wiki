<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- test runner -->
  <rect x="20" y="65" width="100" height="28" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="70" y="83" text-anchor="middle" fill="var(--text, #727981)">test runner</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="79" x2="166" y2="79" />
    <line x1="70" y1="93" x2="70" y2="138" />
  </g>
  <text x="143" y="71" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <text x="20" y="158" fill="var(--text, #727981)">결과를 사용자에게 보여 줌</text>

  <!-- test suite -->
  <rect x="168" y="20" width="410" height="118" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="180" y="38" fill="var(--text, #727981)">test suite</text>

  <!-- 테스트마다 setup, test case, teardown -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="184" y="50" width="120" height="28" rx="2" />
    <rect x="452" y="50" width="110" height="28" rx="2" />
    <rect x="184" y="94" width="120" height="28" rx="2" />
    <rect x="452" y="94" width="110" height="28" rx="2" />
  </g>
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="328" y="50" width="100" height="28" rx="2" />
    <rect x="328" y="94" width="100" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="244" y="68">setup: fixture 준비</text>
    <text x="507" y="68">teardown: 정리</text>
    <text x="244" y="112">setup: fixture 준비</text>
    <text x="507" y="112">teardown: 정리</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="378" y="68">test case</text>
    <text x="378" y="112">test case</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="304" y1="64" x2="326" y2="64" />
    <line x1="428" y1="64" x2="450" y2="64" />
    <line x1="304" y1="108" x2="326" y2="108" />
    <line x1="428" y1="108" x2="450" y2="108" />
  </g>
</svg>
