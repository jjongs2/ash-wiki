<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 180" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="test case마다의 setup과 teardown">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- test runner -->
  <rect x="20" y="65" width="86" height="28" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="63" y="83" text-anchor="middle" fill="var(--text, #727981)">test runner</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="106" y1="79" x2="140" y2="79" />
    <line x1="63" y1="93" x2="63" y2="138" />
  </g>
  <text x="123" y="71" text-anchor="middle" fill="var(--text, #727981)">실행</text>
  <text x="20" y="158" fill="var(--text, #727981)">결과를 사용자에게 보여 줌</text>

  <!-- test suite -->
  <rect x="142" y="20" width="356" height="118" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="154" y="38" fill="var(--text, #727981)">test suite</text>

  <!-- 테스트마다 setup, test case, teardown. 두 줄은 서로 다른 test case -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="154" y="50" width="112" height="28" rx="2" />
    <rect x="390" y="50" width="96" height="28" rx="2" />
    <rect x="154" y="94" width="112" height="28" rx="2" />
    <rect x="390" y="94" width="96" height="28" rx="2" />
  </g>
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="286" y="50" width="84" height="28" rx="2" />
    <rect x="286" y="94" width="84" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="210" y="68">setup: fixture 준비</text>
    <text x="438" y="68">teardown: 정리</text>
    <text x="210" y="112">setup: fixture 준비</text>
    <text x="438" y="112">teardown: 정리</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="328" y="68">test case 1</text>
    <text x="328" y="112">test case 2</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="266" y1="64" x2="284" y2="64" />
    <line x1="370" y1="64" x2="388" y2="64" />
    <line x1="266" y1="108" x2="284" y2="108" />
    <line x1="370" y1="108" x2="388" y2="108" />
  </g>
</svg>
