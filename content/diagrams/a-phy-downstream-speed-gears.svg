<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 19 477.5 207" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="A-PHY 판마다의 하향 속도 기어">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 축 -->
  <line x1="60" y1="170" x2="508" y2="170" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="60" y1="170" x2="60" y2="176" />
    <line x1="172" y1="170" x2="172" y2="176" />
    <line x1="284" y1="170" x2="284" y2="176" />
    <line x1="396" y1="170" x2="396" y2="176" />
    <line x1="508" y1="170" x2="508" y2="176" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="60" y="192">0</text>
    <text x="172" y="192">8</text>
    <text x="284" y="192">16</text>
    <text x="396" y="192">24</text>
    <text x="508" y="192">32</text>
    <text x="284" y="214">하향 속도 (Gbit/s)</text>
  </g>

  <!-- 기준선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="88" y1="74" x2="88" y2="170" />
    <line x1="116" y1="74" x2="116" y2="170" />
    <line x1="172" y1="74" x2="172" y2="170" />
    <line x1="228" y1="74" x2="228" y2="170" />
    <line x1="284" y1="74" x2="284" y2="170" />
    <line x1="396" y1="134" x2="396" y2="170" />
    <line x1="508" y1="134" x2="508" y2="170" />
  </g>

  <!-- 기어 -->
  <g fill="var(--text, #727981)">
    <text x="60" y="40">v1.0과 v1.1의 하향 속도 기어</text>
    <text x="508" y="96" text-anchor="end">v2.0이 더한 하향 속도 기어</text>
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="88" cy="70" r="4" />
    <circle cx="116" cy="70" r="4" />
    <circle cx="172" cy="70" r="4" />
    <circle cx="228" cy="70" r="4" />
    <circle cx="284" cy="70" r="4" />
    <circle cx="396" cy="130" r="4" />
    <circle cx="508" cy="130" r="4" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="88" y="60">2</text>
    <text x="116" y="60">4</text>
    <text x="172" y="60">8</text>
    <text x="228" y="60">12</text>
    <text x="284" y="60">16</text>
    <text x="396" y="120">24</text>
    <text x="508" y="120">32</text>
  </g>
</svg>
