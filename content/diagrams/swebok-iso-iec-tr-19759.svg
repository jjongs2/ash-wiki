<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="30" fill="var(--text, #727981)">SWEBOK V4.0a</text>

  <!-- SWEBOK의 두 판과 그것을 받아들인 기술 보고서 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="48" width="170" height="32" rx="2" />
    <rect x="300" y="48" width="170" height="32" rx="2" />
    <rect x="20" y="136" width="170" height="44" rx="2" />
    <rect x="300" y="136" width="170" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="68">SWEBOK 2004년판</text>
    <text x="385" y="68">SWEBOK V3.0(2014)</text>
    <text x="105" y="154">ISO/IEC TR 19759:2005</text>
    <text x="385" y="154">ISO/IEC TR 19759:2015</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="var(--text, #727981)">
    <text x="105" y="170">1판</text>
    <text x="385" y="170">2판</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="105" y1="80" x2="105" y2="134" />
    <line x1="385" y1="80" x2="385" y2="134" />
    <line x1="190" y1="158" x2="298" y2="158" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="113" y="112">고치지 않고 냄</text>
    <text x="393" y="112">고치지 않고 냄</text>
    <text x="244" y="150" text-anchor="middle">이음</text>
  </g>
</svg>
