<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 4.5 420 333.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="OSI 참조 모델의 계층과 CAN·UDS 표준의 대응">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 열 제목 -->
  <text x="140" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">OSI 참조 모델</text>
  <text x="360" y="24" text-anchor="middle" font-size="12" fill="var(--text, #727981)">표준</text>

  <!-- 일곱 계층 -->
  <rect x="40" y="40" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="63" font-size="12" fill="var(--text, #727981)">7</text>
  <text x="140" y="63" text-anchor="middle" fill="var(--text, #727981)">응용 계층</text>
  <rect x="40" y="82" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="105" font-size="12" fill="var(--text, #727981)">6</text>
  <text x="140" y="105" text-anchor="middle" fill="var(--text, #727981)">표현 계층</text>
  <rect x="40" y="124" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="147" font-size="12" fill="var(--text, #727981)">5</text>
  <text x="140" y="147" text-anchor="middle" fill="var(--text, #727981)">세션 계층</text>
  <rect x="40" y="166" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="189" font-size="12" fill="var(--text, #727981)">4</text>
  <text x="140" y="189" text-anchor="middle" fill="var(--text, #727981)">전송 계층</text>
  <rect x="40" y="208" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="231" font-size="12" fill="var(--text, #727981)">3</text>
  <text x="140" y="231" text-anchor="middle" fill="var(--text, #727981)">네트워크 계층</text>
  <rect x="40" y="250" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="273" font-size="12" fill="var(--text, #727981)">2</text>
  <text x="140" y="273" text-anchor="middle" fill="var(--text, #727981)">데이터 링크 계층</text>
  <rect x="40" y="292" width="200" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="54" y="315" font-size="12" fill="var(--text, #727981)">1</text>
  <text x="140" y="315" text-anchor="middle" fill="var(--text, #727981)">물리 계층</text>

  <!-- 차량 진단 통신 표준 -->
  <rect x="280.75" y="40.75" width="158.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="360" y="63" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ISO 14229-1</text>
  <rect x="280.75" y="166.75" width="158.5" height="76.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="360" y="210" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ISO 15765-2</text>
  <rect x="280.75" y="250.75" width="158.5" height="76.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="360" y="284" text-anchor="middle" fill="var(--on-fill, #f8fafd)">ISO 11898-1</text>
  <text x="360" y="303" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">데이터 링크 계층 · PCS</text>

  <!-- 계층과 표준을 잇는 선 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="242" y1="58" x2="278" y2="58" />
    <line x1="242" y1="184" x2="278" y2="184" />
    <line x1="242" y1="226" x2="278" y2="226" />
    <line x1="242" y1="268" x2="278" y2="268" />
    <line x1="242" y1="310" x2="278" y2="310" />
  </g>
</svg>
