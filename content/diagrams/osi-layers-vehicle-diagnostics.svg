<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 4.5 420 333.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 열 제목 -->
  <text x="140" y="24" text-anchor="middle" font-size="12" fill="#727981">OSI 참조 모델</text>
  <text x="360" y="24" text-anchor="middle" font-size="12" fill="#727981">표준</text>

  <!-- 일곱 계층 -->
  <rect x="40" y="40" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="63" font-size="12" fill="#727981">7</text>
  <text x="140" y="63" text-anchor="middle" fill="#727981">응용 계층</text>
  <rect x="40" y="82" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="105" font-size="12" fill="#727981">6</text>
  <text x="140" y="105" text-anchor="middle" fill="#727981">표현 계층</text>
  <rect x="40" y="124" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="147" font-size="12" fill="#727981">5</text>
  <text x="140" y="147" text-anchor="middle" fill="#727981">세션 계층</text>
  <rect x="40" y="166" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="189" font-size="12" fill="#727981">4</text>
  <text x="140" y="189" text-anchor="middle" fill="#727981">전송 계층</text>
  <rect x="40" y="208" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="231" font-size="12" fill="#727981">3</text>
  <text x="140" y="231" text-anchor="middle" fill="#727981">네트워크 계층</text>
  <rect x="40" y="250" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="273" font-size="12" fill="#727981">2</text>
  <text x="140" y="273" text-anchor="middle" fill="#727981">데이터 링크 계층</text>
  <rect x="40" y="292" width="200" height="36" rx="4" stroke="#727981" stroke-width="1.5" />
  <text x="54" y="315" font-size="12" fill="#727981">1</text>
  <text x="140" y="315" text-anchor="middle" fill="#727981">물리 계층</text>

  <!-- 차량 진단 통신 표준 -->
  <rect x="280" y="40" width="160" height="36" rx="4" fill="#b0540d" />
  <text x="360" y="63" text-anchor="middle" fill="#f8fafd">ISO 14229-1</text>
  <rect x="280" y="166" width="160" height="78" rx="4" fill="#b0540d" />
  <text x="360" y="210" text-anchor="middle" fill="#f8fafd">ISO 15765-2</text>
  <rect x="280" y="250" width="160" height="36" rx="4" fill="#b0540d" />
  <text x="360" y="273" text-anchor="middle" fill="#f8fafd">ISO 11898-1</text>

  <!-- 계층과 표준을 잇는 선 -->
  <g stroke="#727981" stroke-width="1.5">
    <line x1="242" y1="58" x2="278" y2="58" />
    <line x1="242" y1="184" x2="278" y2="184" />
    <line x1="242" y1="226" x2="278" y2="226" />
    <line x1="242" y1="268" x2="278" y2="268" />
  </g>
</svg>
