<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 0.5 572.5 188.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <path d="M144 34 V28 H652 V34" stroke="#727981" stroke-width="1.5" />
  <text x="398" y="20" text-anchor="middle" font-size="12" fill="#727981">중재 필드</text>
  <!-- 확장 포맷 -->
  <rect x="100.75" y="40.75" width="38.5" height="38.5" stroke="#727981" stroke-width="1.5" />
  <text x="120" y="65" text-anchor="middle" fill="#727981">SOF</text>
  <rect x="144" y="40" width="160" height="40" stroke="#727981" stroke-width="1.5" />
  <text x="224" y="65" text-anchor="middle" fill="#727981">기본 식별자 11비트</text>
  <rect x="308.75" y="40.75" width="42.5" height="38.5" stroke="#727981" stroke-width="1.5" />
  <text x="330" y="65" text-anchor="middle" fill="#727981">SRR</text>
  <rect x="356.75" y="40.75" width="42.5" height="38.5" stroke="#727981" stroke-width="1.5" />
  <text x="378" y="65" text-anchor="middle" fill="#727981">IDE</text>
  <rect x="404" y="40" width="200" height="40" stroke="#727981" stroke-width="1.5" />
  <text x="504" y="65" text-anchor="middle" fill="#727981">확장 식별자 18비트</text>
  <rect x="608.75" y="40.75" width="42.5" height="38.5" stroke="#727981" stroke-width="1.5" />
  <text x="630" y="65" text-anchor="middle" fill="#727981">RTR</text>
  <text x="330" y="96" text-anchor="middle" font-size="12" fill="#727981">R</text>
  <text x="378" y="96" text-anchor="middle" font-size="12" fill="#727981">R</text>
  <!-- 기본 포맷의 식별자 끝 -->
  <path d="M306 82 V120 H312" stroke="#727981" stroke-width="1.5" />
  <text x="316" y="124" font-size="12" fill="#727981">(기본 포맷은 여기서 식별자가 끝나고 RTR, IDE(D)가 온다)</text>
  <!-- 범례 -->
  <text x="100" y="158" font-size="12" fill="#727981">확장 포맷. D: dominant · R: recessive. RTR은 데이터 프레임에서 D, 리모트 프레임에서 R이다.</text>
  <text x="100" y="178" font-size="12" fill="#727981">식별자는 최상위 비트부터 보낸다.</text>
</svg>
