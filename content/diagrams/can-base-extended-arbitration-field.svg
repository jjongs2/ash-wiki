<svg xmlns="http://www.w3.org/2000/svg" viewBox="93.5 1 474.5 174.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="확장 포맷의 중재 필드">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <path d="M144 34 V28 H540 V34" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="342" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 필드</text>
  <!-- 확장 포맷 -->
  <rect x="100.75" y="40.75" width="38.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="65" text-anchor="middle" fill="var(--text, #727981)">SOF</text>
  <rect x="144" y="40" width="124" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="206" y="65" text-anchor="middle" fill="var(--text, #727981)">기본 식별자 11비트</text>
  <rect x="272.75" y="40.75" width="42.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="294" y="59" text-anchor="middle" fill="var(--text, #727981)">SRR</text>
  <text x="294" y="75" text-anchor="middle" font-size="12" fill="var(--text, #727981)">R</text>
  <rect x="320.75" y="40.75" width="42.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="342" y="59" text-anchor="middle" fill="var(--text, #727981)">IDE</text>
  <text x="342" y="75" text-anchor="middle" font-size="12" fill="var(--text, #727981)">R</text>
  <rect x="368" y="40" width="124" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="430" y="65" text-anchor="middle" fill="var(--text, #727981)">확장 식별자 18비트</text>
  <rect x="496.75" y="40.75" width="42.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="518" y="65" text-anchor="middle" fill="var(--text, #727981)">RTR</text>
  <!-- 기본 포맷의 식별자 끝 -->
  <path d="M270 82 V106 H276" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="280" y="110" font-size="12" fill="var(--text, #727981)">(기본 포맷은 여기서 식별자가 끝나고 RTR, IDE(D)가 온다)</text>
  <!-- 범례 -->
  <text x="100" y="144" font-size="12" fill="var(--text, #727981)">확장 포맷. D: dominant · R: recessive. RTR은 데이터 프레임에서 D, 리모트 프레임에서 R이다.</text>
  <text x="100" y="164" font-size="12" fill="var(--text, #727981)">식별자는 최상위 비트부터 보낸다.</text>
</svg>
