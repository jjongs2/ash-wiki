<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 26 512 137" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 두 구간과 그 사이 -->
  <rect x="40.75" y="36.75" width="138.5" height="40.5" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="110" y="54" text-anchor="middle" fill="var(--on-fill, #f8fafd)">길이</text>
  <text x="110" y="71" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">데이터 필드의 옥텟 수</text>
  <text x="235" y="61" text-anchor="middle" font-size="12" fill="var(--text, #727981)">1500 &lt; <tspan font-style="italic">v</tspan> &lt; 1536</text>
  <rect x="290" y="36" width="230" height="42" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="405" y="54" text-anchor="middle" fill="var(--text, #727981)">EtherType</text>
  <text x="405" y="71" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터 필드에 실린 상위 프로토콜</text>

  <!-- 값의 축 -->
  <line x1="40" y1="90" x2="532" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="40.75" y1="84" x2="40.75" y2="96" />
    <line x1="180" y1="84" x2="180" y2="96" />
    <line x1="290" y1="84" x2="290" y2="96" />
    <line x1="396" y1="90" x2="396" y2="96" />
    <line x1="452" y1="90" x2="452" y2="96" />
    <line x1="508" y1="90" x2="508" y2="96" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="112">0</text>
    <text x="184" y="112" text-anchor="end">1500</text>
    <text x="286" y="112">0x0600(1536)</text>
    <text x="396" y="112" text-anchor="middle">0x0800</text>
    <text x="396" y="128" text-anchor="middle">IPv4</text>
    <text x="452" y="112" text-anchor="middle">0x0806</text>
    <text x="452" y="128" text-anchor="middle">ARP</text>
    <text x="508" y="112" text-anchor="middle">0x86DD</text>
    <text x="508" y="128" text-anchor="middle">IPv6</text>
    <text x="40" y="152">눈금 사이의 거리는 값에 비례하지 않는다.</text>
  </g>
</svg>
