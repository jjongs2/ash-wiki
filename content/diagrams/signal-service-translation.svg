<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 357" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="32" fill="var(--text, #727981)">시그널에서 서비스로 옮길 때</text>

  <!-- Classic Platform ECU -->
  <rect x="20.75" y="50.75" width="358.5" height="200.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="34" y="72" font-size="12" fill="var(--text, #727981)">Classic Platform ECU</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="80" y="84" width="240" height="40" rx="2" />
    <rect x="40" y="162" width="320" height="26" rx="2" />
    <rect x="40" y="208" width="320" height="26" rx="2" />
    <rect x="215" y="290" width="130" height="46" rx="2" />
  </g>
  <!-- 포트 -->
  <g fill="var(--ink, #727981)">
    <rect x="115" y="119" width="10" height="10" />
    <rect x="275" y="119" width="10" height="10" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="200" y="109" font-size="13">Translation Software Component</text>
    <text x="200" y="180">RTE</text>
    <text x="200" y="226">통신 스택</text>
    <text x="280" y="309">Adaptive Platform</text>
    <text x="280" y="326">Machine</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="82" y="147">시그널 포트</text>
    <text x="318" y="147">이벤트 포트</text>
  </g>

  <!-- 흐름: RTE 상자 안은 지나간다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M120 304 V236" marker-end="url(#arrow)" />
    <path d="M120 208 V188 M120 162 V131" marker-end="url(#arrow)" />
    <path d="M280 129 V162 M280 188 V206" marker-end="url(#arrow)" />
    <path d="M280 234 V288" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="120" y="318" text-anchor="middle">CAN · LIN · FlexRay</text>
    <text x="128" y="274">ISignalIPdu</text>
    <text x="288" y="274">SOME/IP 서비스</text>
  </g>
</svg>
