<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 9 481 265" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 층: 꼭짓점 (150 20), 밑변 y 240, 경계 y 100과 170 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" stroke-linejoin="round">
    <polygon points="150,20 197.27,100 102.73,100" />
    <polygon points="102.73,100 197.27,100 238.64,170 61.36,170" />
    <polygon points="61.36,170 238.64,170 280,240 20,240" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="84">UI tests</text>
    <text x="150" y="140">service tests</text>
    <text x="150" y="210">unit tests</text>
  </g>
  <text x="150" y="262" font-size="12" text-anchor="middle" fill="var(--text, #727981)">처음 나온 모델(Cohn 2009)의 층</text>

  <!-- 위층으로 갈수록 -->
  <line x1="312" y1="232" x2="312" y2="30" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="326" y="56">복잡한 끝에서 끝까지의 테스트</text>
    <text x="326" y="72">대개 몇 개면 된다</text>
    <text x="326" y="128">위층일수록 세분성과 격리 정도는</text>
    <text x="326" y="144">낮고, 실행 시간은 길다</text>
    <text x="326" y="206">작고 떨어져 있으며 빠른 테스트</text>
    <text x="326" y="222">대개 많이 필요하다</text>
  </g>
</svg>
