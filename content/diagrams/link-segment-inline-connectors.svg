<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 165" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 양 끝 PHY -->
  <rect x="20" y="50" width="80" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="60" y="80" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <rect x="420" y="50" width="80" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="460" y="80" text-anchor="middle" fill="var(--text, #727981)">PHY</text>

  <!-- 한 쌍 케이블 -->
  <line x1="100" y1="68" x2="420" y2="68" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="100" y1="82" x2="420" y2="82" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 인라인 커넥터 4개 -->
  <rect x="150.75" y="57.75" width="18.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="215.75" y="57.75" width="18.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="285.75" y="57.75" width="18.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="350.75" y="57.75" width="18.5" height="34.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <path d="M160 44 V38 H360 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="260" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인라인 커넥터 4개까지</text>

  <!-- 길이 -->
  <line x1="102" y1="120" x2="418" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="var(--text, #727981)">링크 세그먼트</text>
</svg>
