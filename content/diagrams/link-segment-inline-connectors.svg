<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 165" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 양 끝 PHY -->
  <rect x="20" y="50" width="90" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="65" y="80" text-anchor="middle" fill="var(--text, #727981)">PHY</text>
  <rect x="550" y="50" width="90" height="50" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="595" y="80" text-anchor="middle" fill="var(--text, #727981)">PHY</text>

  <!-- 한 쌍 케이블 -->
  <line x1="110" y1="68" x2="550" y2="68" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="110" y1="82" x2="550" y2="82" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 인라인 커넥터 4개 -->
  <rect x="180.75" y="57.75" width="18.5" height="34.5" rx="4" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="270.75" y="57.75" width="18.5" height="34.5" rx="4" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="370.75" y="57.75" width="18.5" height="34.5" rx="4" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="460.75" y="57.75" width="18.5" height="34.5" rx="4" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <path d="M190 44 V38 H470 V44" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="330" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">인라인 커넥터 4개까지</text>

  <!-- 길이 -->
  <line x1="112" y1="120" x2="548" y2="120" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="330" y="144" text-anchor="middle" font-size="12" fill="var(--text, #727981)">링크 세그먼트 · 적어도 15 m</text>
</svg>
