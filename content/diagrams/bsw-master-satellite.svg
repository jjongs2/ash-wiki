<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="BSW 파티션에 나눈 master와 satellite">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 파티션 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="240" height="166" rx="2" />
    <rect x="380" y="20" width="240" height="166" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="44">BSW 파티션</text>
    <text x="500" y="44">BSW 파티션</text>
  </g>

  <!-- 다른 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="50" y="60" width="180" height="36" rx="2" />
    <rect x="410" y="60" width="180" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="83">다른 모듈</text>
    <text x="500" y="83">다른 모듈</text>
  </g>

  <!-- master와 satellite -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="50" y="130" width="180" height="36" rx="2" />
    <rect x="410" y="130" width="180" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="140" y="153">master</text>
    <text x="500" y="153">satellite</text>
  </g>

  <!-- 호출과 내부 통신 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="96" x2="140" y2="128" marker-end="url(#arrow)" />
    <line x1="500" y1="96" x2="500" y2="128" marker-end="url(#arrow)" />
    <line x1="232" y1="148" x2="408" y2="148" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="148" y="117">같은 인터페이스</text>
    <text x="508" y="117">같은 인터페이스</text>
    <text x="320" y="125" text-anchor="middle">표준화되지 않은</text>
    <text x="320" y="140" text-anchor="middle">내부 통신</text>
  </g>
</svg>
