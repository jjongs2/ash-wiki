<svg xmlns="http://www.w3.org/2000/svg" viewBox="24.5 0 775.5 498.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="140" y="20" width="120" height="36" rx="2" />
    <rect x="380" y="20" width="100" height="36" rx="2" />
    <rect x="620" y="20" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="200" y="43">UCM Client</text>
    <text x="430" y="43">UCM</text>
    <text x="700" y="43">State Management</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="200" y1="56" x2="200" y2="480" />
    <line x1="430" y1="56" x2="430" y2="480" />
    <line x1="700" y1="56" x2="700" y2="480" />
  </g>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M96 78 h-6 V140 h6" />
    <path d="M96 160 h-6 V428 h6" />
    <path d="M96 448 h-6 V474 h6" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="80" y="114">준비</text>
    <text x="80" y="299">활성화</text>
    <text x="80" y="466">정리</text>
  </g>

  <!-- 메시지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="90" x2="428" y2="90" />
    <path d="M430 116 h28 v16 h-26" />
    <path d="M430 166 h28 v16 h-26" />
    <line x1="430" y1="212" x2="698" y2="212" />
    <line x1="430" y1="246" x2="698" y2="246" />
    <line x1="430" y1="280" x2="698" y2="280" />
    <line x1="430" y1="314" x2="698" y2="314" />
    <line x1="200" y1="354" x2="428" y2="354" />
    <line x1="430" y1="388" x2="698" y2="388" stroke-dasharray="5 4" />
    <line x1="430" y1="422" x2="698" y2="422" />
    <path d="M430 450 h28 v16 h-26" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="315" y="82" text-anchor="middle">Software Package 전송</text>
    <text x="466" y="128.5">Software Cluster 설치·갱신·제거</text>
    <text x="466" y="178.5">의존성 검사</text>
    <text x="564" y="204" text-anchor="middle">UpdateSession 열기</text>
    <text x="564" y="238" text-anchor="middle">PrepareUpdate: Function Group마다</text>
    <text x="564" y="272" text-anchor="middle">Machine 리셋이나 Function Group 재시작</text>
    <text x="564" y="306" text-anchor="middle">VerifyUpdate: 제대로 도는지 검증</text>
    <text x="315" y="346" text-anchor="middle">Finish 또는 Rollback</text>
    <text x="564" y="380" text-anchor="middle">PrepareRollback: Rollback이면</text>
    <text x="564" y="414" text-anchor="middle">갱신 세션 끝내기</text>
    <text x="466" y="462.5">불필요한 산출물 지우기</text>
