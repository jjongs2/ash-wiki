<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 -1 524 536" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="UCM의 준비, 활성화와 정리 순서">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 참여자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="86" y="20" width="100" height="36" rx="2" />
    <rect x="241" y="20" width="70" height="36" rx="2" />
    <rect x="368" y="20" width="136" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="136" y="43">UCM Client</text>
    <text x="276" y="43">UCM</text>
    <text x="436" y="43">State Management</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="136" y1="56" x2="136" y2="516" />
    <line x1="276" y1="56" x2="276" y2="516" />
    <line x1="436" y1="56" x2="436" y2="516" />
  </g>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M76 78 h-6 V140 h6" />
    <path d="M76 158 h-6 V462 h6" />
    <path d="M76 478 h-6 V510 h6" />
  </g>
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="62" y="114">준비</text>
    <text x="62" y="315">활성화</text>
    <text x="62" y="499">정리</text>
  </g>

  <!-- 메시지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="136" y1="90" x2="274" y2="90" />
    <path d="M276 110 h28 v16 h-26" />
    <path d="M276 166 h28 v16 h-26" />
    <line x1="276" y1="214" x2="434" y2="214" />
    <line x1="276" y1="256" x2="434" y2="256" />
    <line x1="276" y1="298" x2="434" y2="298" />
    <line x1="276" y1="340" x2="434" y2="340" />
    <line x1="136" y1="380" x2="274" y2="380" />
    <line x1="276" y1="422" x2="434" y2="422" stroke-dasharray="5 4" />
    <line x1="276" y1="454" x2="434" y2="454" />
    <path d="M276 484 h28 v16 h-26" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="206" y="82" text-anchor="middle">Software Package 전송</text>
    <text x="312" y="115">Software Cluster</text>
    <text x="312" y="129">설치·갱신·제거</text>
    <text x="312" y="178.5">의존성 검사</text>
    <text x="356" y="206" text-anchor="middle">UpdateSession 열기</text>
    <text x="356" y="234" text-anchor="middle">PrepareUpdate:</text>
    <text x="356" y="248" text-anchor="middle">Function Group마다</text>
    <text x="356" y="276" text-anchor="middle">Machine 리셋이나</text>
    <text x="356" y="290" text-anchor="middle">Function Group 재시작</text>
    <text x="356" y="318" text-anchor="middle">VerifyUpdate:</text>
    <text x="356" y="332" text-anchor="middle">제대로 도는지 검증</text>
    <text x="206" y="372" text-anchor="middle">Finish 또는 Rollback</text>
    <text x="356" y="400" text-anchor="middle">PrepareRollback:</text>
    <text x="356" y="414" text-anchor="middle">Rollback이면</text>
    <text x="356" y="446" text-anchor="middle">갱신 세션 끝내기</text>
    <text x="312" y="489">불필요한</text>
    <text x="312" y="503">산출물 지우기</text>
  </g>
</svg>
