<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268.5 348" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="Kuksa Databroker의 연결">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="160" height="32" rx="2" />
    <rect x="20" y="108" width="160" height="44" rx="2" />
    <rect x="20" y="208" width="160" height="32" rx="2" />
    <rect x="20" y="296" width="160" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="40.5">차량 응용</text>
    <text x="100" y="126">Kuksa Databroker</text>
    <text x="100" y="143" font-size="12">VSS 신호 트리 구현</text>
    <text x="100" y="228.5">Kuksa provider</text>
    <text x="100" y="316.5">ECU</text>
  </g>

  <!-- 주고받음 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="100" y1="54" x2="100" y2="106" />
    <line x1="100" y1="154" x2="100" y2="206" />
    <line x1="100" y1="242" x2="100" y2="294" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="112" y="77.5">gRPC API</text>
    <text x="112" y="91.5">신호 조회, 값 갱신, 변경 통지</text>
    <text x="112" y="184.5">gRPC API 호출</text>
    <text x="112" y="265.5">CAN, SOME/IP 등</text>
    <text x="112" y="279.5">프로토콜의 저수준 메시지</text>
  </g>
</svg>
