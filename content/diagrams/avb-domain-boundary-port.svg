<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 502 233" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="SRP 도메인 경계 포트의 Talker Advertise">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 도메인 경계 -->
  <line x1="280" y1="20" x2="280" y2="52" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g font-size="14" fill="var(--text, #727981)">
    <text x="264" y="34" text-anchor="end">AVB 도메인</text>
    <text x="296" y="34">도메인 밖</text>
  </g>

  <!-- 경계의 브리지와 경계 포트 -->
  <rect x="160" y="52" width="120" height="160" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="220" y="137" text-anchor="middle" font-size="14" fill="var(--text, #727981)">브리지</text>
  <rect x="275" y="127" width="10" height="10" fill="var(--ink, #727981)" />
  <text x="293" y="136" fill="var(--text, #727981)">SRP 도메인 경계 포트</text>

  <!-- 나가는 talker 선언 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="20" y1="92" x2="158" y2="92" />
    <line x1="282" y1="92" x2="482" y2="92" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="89" y="84">Talker Advertise</text>
    <text x="382" y="84">Talker Failed (실패 코드 8)</text>
    <text x="382" y="110" font-size="11">IEEE 802.1BA-2021</text>
  </g>

  <!-- 들어오는 트래픽의 우선순위 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="482" y1="172" x2="282" y2="172" />
    <line x1="158" y1="172" x2="20" y2="172" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="382" y="164">우선순위 3, 2</text>
    <text x="89" y="164">우선순위 0</text>
    <text x="382" y="190" font-size="11">IEEE 802.1Q-2022 기본값</text>
  </g>
</svg>
