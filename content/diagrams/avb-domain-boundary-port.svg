<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 256" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 도메인 경계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="360" y1="20" x2="360" y2="52" />
    <line x1="360" y1="212" x2="360" y2="220" />
  </g>
  <g font-size="14" fill="var(--text, #727981)">
    <text x="344" y="34" text-anchor="end">AVB 도메인</text>
    <text x="376" y="34">도메인 밖</text>
  </g>

  <!-- 경계의 브리지 -->
  <rect x="240" y="52" width="120" height="160" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="300" y="137" text-anchor="middle" font-size="14" fill="var(--text, #727981)">브리지</text>
  <text x="360" y="236" text-anchor="middle" fill="var(--text, #727981)">SRP 도메인 경계 포트</text>

  <!-- 나가는 talker 선언 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="40" y1="92" x2="238" y2="92" />
    <line x1="362" y1="92" x2="660" y2="92" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="139" y="84">Talker Advertise</text>
    <text x="511" y="84">Talker Failed (실패 코드 8)</text>
    <text x="511" y="110" font-size="11">IEEE 802.1BA-2021</text>
  </g>

  <!-- 들어오는 트래픽의 우선순위 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="660" y1="172" x2="362" y2="172" />
    <line x1="238" y1="172" x2="40" y2="172" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="511" y="164">우선순위 3, 2</text>
    <text x="139" y="164">우선순위 0</text>
    <text x="511" y="190" font-size="11">IEEE 802.1Q-2022 기본값</text>
  </g>
</svg>
