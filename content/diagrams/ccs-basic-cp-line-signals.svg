<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 -6 560 336.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CCS Basic에서 CP 선이 나르는 신호">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 범위 -->
  <text x="315" y="24" text-anchor="middle" font-size="13" fill="var(--text, #727981)">CharIN CCS Basic 구현 가이드 v1.1.1.1</text>

  <!-- 충전 방식 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="95">DC 충전</text>
    <text x="20" y="195">AC 충전</text>
  </g>

  <!-- 충전 설비와 차량 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="90" y="66" width="100" height="48" rx="2" />
    <rect x="440" y="66" width="100" height="48" rx="2" />
    <rect x="90" y="166" width="100" height="48" rx="2" />
    <rect x="440" y="166" width="100" height="48" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="95">충전 설비</text>
    <text x="490" y="95">차량</text>
    <text x="140" y="195">충전 설비</text>
    <text x="490" y="195">차량</text>
  </g>

  <!-- CP 선 하나 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="190" y1="90" x2="440" y2="90" />
    <line x1="190" y1="190" x2="440" y2="190" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="315" y="110">CP 선</text>
    <text x="315" y="210">CP 선</text>
  </g>

  <!-- CP 선이 함께 나르는 신호 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M200 84 V78 H430 V84" />
    <path d="M200 184 V178 H430 V184" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="240" y="46" width="70" height="24" rx="2" />
    <rect x="320" y="46" width="70" height="24" rx="2" />
    <rect x="240" y="146" width="70" height="24" rx="2" />
  </g>
  <rect x="320" y="146" width="70" height="24" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="275" y="63">PWM</text>
    <text x="355" y="63">PLC</text>
    <text x="275" y="163">PWM</text>
    <text x="355" y="163">PLC</text>
  </g>

  <!-- 범례 -->
  <rect x="90" y="242" width="28" height="16" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <rect x="250" y="242" width="28" height="16" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g font-size="13" fill="var(--text, #727981)">
    <text x="126" y="255">필수</text>
    <text x="286" y="255">CCS Basic의 범위 밖</text>
    <text x="90" y="288">PWM: basic signalling</text>
    <text x="90" y="308">PLC: HomePlug Green PHY 기반 HLC</text>
  </g>
</svg>
