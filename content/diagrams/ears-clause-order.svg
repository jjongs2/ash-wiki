<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1.5 584 140.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 절 순서 -->
  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">늘 같은 순서</text>
  <line x1="20" y1="38" x2="562" y2="38" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 절 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="52" width="124" height="46" rx="2" stroke-dasharray="5 4" />
    <rect x="160" y="52" width="124" height="46" rx="2" stroke-dasharray="5 4" />
    <rect x="300" y="52" width="124" height="46" rx="2" />
    <rect x="440" y="52" width="124" height="46" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="82" y="71">While</text>
    <text x="82" y="89">&lt;전제 조건&gt;</text>
    <text x="222" y="71">when</text>
    <text x="222" y="89">&lt;트리거&gt;</text>
    <text x="362" y="71">the</text>
    <text x="362" y="89">&lt;시스템 이름&gt;</text>
    <text x="502" y="71">shall</text>
    <text x="502" y="89">&lt;시스템 응답&gt;</text>
  </g>

  <!-- 개수 -->
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="82" y="118">0개 이상</text>
    <text x="222" y="118">0개나 1개</text>
    <text x="362" y="118">1개</text>
    <text x="502" y="118">1개 이상</text>
  </g>
</svg>
