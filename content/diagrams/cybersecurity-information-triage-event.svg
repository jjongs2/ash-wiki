    <text x="415" y="74">아이템이나 컴포넌트와 관련됨</text>
  </g>

  <line x1="210" y1="60" x2="318" y2="60" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="265" y="52">triage</text>
    <text x="265" y="76">기준: trigger</text>
  </g>
