<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 -1 511 95.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">ISO/SAE 21434:2021</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="36" width="190" height="48" rx="4" />
    <rect x="320" y="36" width="190" height="48" rx="4" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="115" y="56">cybersecurity information</text>
    <text x="415" y="56">cybersecurity event</text>
