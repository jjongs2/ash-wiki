<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 4비트 단어 흐름 -->
  <rect x="20" y="30" width="150" height="52" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="95" y="52" text-anchor="middle" fill="var(--text, #727981)">4비트 단어 흐름</text>
  <text x="95" y="70" text-anchor="middle" font-size="12" fill="var(--text, #727981)">25 MBd</text>

  <line x1="170" y1="56" x2="263" y2="56" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="217" y="47" text-anchor="middle" font-size="12" fill="var(--text, #727981)">4B/3B</text>

  <!-- 3비트 단어 흐름 -->
  <rect x="265" y="30" width="150" height="52" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="340" y="52" text-anchor="middle" fill="var(--text, #727981)">3비트 단어 흐름</text>
  <text x="340" y="70" text-anchor="middle" font-size="12" fill="var(--text, #727981)">33.333 MBd</text>

  <line x1="415" y1="56" x2="528" y2="56" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="471" y="47" text-anchor="middle" font-size="12" fill="var(--text, #727981)">스크램블</text>
  <text x="471" y="74" text-anchor="middle" font-size="12" fill="var(--text, #727981)">3비트마다</text>
  <text x="471" y="90" text-anchor="middle" font-size="12" fill="var(--text, #727981)">심볼 둘</text>

  <!-- PAM3 심볼 -->
  <rect x="530.75" y="30.75" width="128.5" height="50.5" rx="4" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="595" y="52" text-anchor="middle" fill="var(--on-fill, #f8fafd)">PAM3 심볼</text>
  <text x="595" y="70" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">66.666 MBd</text>
</svg>
