<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2.5 520 290" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 방식 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="24">Fullpass</text>
    <text x="260" y="24">External bypass</text>
    <text x="435" y="24">Internal bypass</text>
  </g>

  <!-- 장치 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="10" y="40" width="150" height="90" rx="2" />
    <rect x="185" y="40" width="150" height="90" rx="2" />
    <rect x="185" y="180" width="150" height="90" rx="2" />
    <rect x="360" y="40" width="150" height="160" rx="2" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="85" y="60">RPU</text>
    <text x="260" y="60">원래 ECU</text>
    <text x="260" y="200">RPU</text>
    <text x="435" y="60">원래 ECU</text>
  </g>

  <!-- 원래 알고리즘 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="200" y="74" width="120" height="36" rx="2" />
    <rect x="375" y="74" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="97">원래 알고리즘</text>
    <text x="435" y="97">원래 알고리즘</text>
  </g>

  <!-- 시험할 알고리즘 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="25" y="74" width="120" height="36" rx="2" />
    <rect x="200" y="214" width="120" height="36" rx="2" />
    <rect x="375" y="150" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="85" y="97">시험할 알고리즘</text>
    <text x="260" y="237">시험할 알고리즘</text>
    <text x="435" y="173">시험할 알고리즘</text>
  </g>

  <!-- 값의 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="215" y1="130" x2="215" y2="178" />
    <line x1="260" y1="180" x2="260" y2="132" />
    <line x1="435" y1="150" x2="435" y2="112" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="268" y="160">계산한 값</text>
    <text x="443" y="135">계산한 값</text>
  </g>
</svg>
