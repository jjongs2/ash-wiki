<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 2 534 192" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="LTE V2X sidelink 자원 할당의 두 방식">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 방식 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="24">scheduled resource allocation (Mode 3)</text>
    <text x="20" y="124">autonomous resource selection (Mode 4)</text>
  </g>
  <g font-size="12" text-anchor="end" fill="var(--text, #727981)">
    <text x="530" y="24">NR에서 비슷한 모드: mode 1</text>
    <text x="530" y="124">NR에서 비슷한 모드: mode 2</text>
  </g>

  <!-- 상자 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="40.75" width="88.5" height="38.5" rx="2" />
    <rect x="250.75" y="40.75" width="88.5" height="38.5" rx="2" />
    <rect x="440.75" y="40.75" width="88.5" height="38.5" rx="2" />
    <rect x="20.75" y="140.75" width="88.5" height="38.5" rx="2" />
    <rect x="250.75" y="140.75" width="88.5" height="38.5" rx="2" />
    <rect x="440.75" y="140.75" width="88.5" height="38.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="65" y="64.5">기지국</text>
    <text x="295" y="64.5">단말</text>
    <text x="485" y="64.5">단말</text>
    <text x="65" y="164.5">자원 풀</text>
    <text x="295" y="164.5">단말</text>
    <text x="485" y="164.5">단말</text>
  </g>

  <!-- scheduled: 요청과 스케줄 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="250" y1="52" x2="111" y2="52" />
    <line x1="110" y1="68" x2="249" y2="68" />
    <line x1="110" y1="160" x2="249" y2="160" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="180" y="45">송신 자원 요청</text>
    <text x="180" y="86">송신 자원 스케줄</text>
    <text x="180" y="152">센싱 결과에 따라</text>
    <text x="180" y="176">자원을 고름</text>
  </g>

  <!-- sidelink 송신 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="340" y1="60" x2="439" y2="60" />
    <line x1="340" y1="160" x2="439" y2="160" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="390" y="52">sidelink 송신</text>
    <text x="390" y="152">sidelink 송신</text>
  </g>
</svg>
