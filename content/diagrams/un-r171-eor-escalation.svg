<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 196" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="눈을 뗀 때부터 운전자 미응답 대응까지의 경고 단계">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 판과 조건 -->
  <text x="20" y="24" fill="var(--text, #727981)">UN R171 01 시리즈, 차속 &gt; 10 km/h</text>

  <!-- 1초 = 28 단위. 길이를 정하지 않은 두 간격(EOR과 EOR을 높임 사이, DCA와 운전자 미응답 대응 사이)은 축을 끊어 그린다 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="54">늦어도 5초</text>
    <text x="320" y="54">늦어도 5초</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M40 68 v-6 H180 v6" />
    <path d="M250 68 v-6 H390 v6" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="40" y1="68" x2="40" y2="92" />
    <line x1="180" y1="68" x2="180" y2="92" />
    <line x1="250" y1="68" x2="250" y2="92" />
    <line x1="390" y1="68" x2="390" y2="92" />
  </g>

  <!-- 시간 축: 215와 425에서 끊는다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="20" y1="96" x2="209" y2="96" />
    <line x1="221" y1="96" x2="419" y2="96" />
    <line x1="431" y1="96" x2="518" y2="96" marker-end="url(#arrow)" />
    <path d="M206 102 l6 -12 M218 102 l6 -12" />
    <path d="M416 102 l6 -12 M428 102 l6 -12" />
  </g>
  <g fill="var(--ink, #727981)">
    <circle cx="40" cy="96" r="4" />
    <circle cx="180" cy="96" r="4" />
    <circle cx="250" cy="96" r="4" />
    <circle cx="390" cy="96" r="4" />
    <circle cx="470" cy="96" r="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="40" y="118">눈을 뗌</text>
    <text x="180" y="118">EOR</text>
    <text x="250" y="118">EOR을</text>
    <text x="250" y="134">높임</text>
    <text x="390" y="118">DCA</text>
    <text x="470" y="118">운전자 미응답</text>
    <text x="470" y="134">대응 시작</text>
  </g>

  <g fill="var(--text, #727981)">
    <text x="20" y="160">운전자 미응답 대응은 늦어도 처음 높인 요청이나 DCA 뒤 10초에 시작한다</text>
    <text x="20" y="178">안전 개념에 따라 어느 단계에서든 시작하거나 어느 단계든 건너뛸 수 있다</text>
  </g>
</svg>
