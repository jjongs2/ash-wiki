<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 -0.5 519.5 329" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="12" fill="var(--text, #727981)">RAUC boot-mbr-switch</text>

  <!-- 미리 정한 디스크 영역 -->
  <path d="M160 64 V58 H500 V64" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="330" y="52" font-size="12" text-anchor="middle" fill="var(--text, #727981)">미리 정한 디스크 영역</text>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="34" y="96">①</text>
    <text x="34" y="226">②</text>
  </g>

  <!-- 디스크 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="70" width="90" height="44" />
    <rect x="160" y="70" width="170" height="44" />
    <rect x="60" y="200" width="90" height="44" />
    <rect x="160" y="200" width="170" height="44" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="330" y="70" width="170" height="44" />
    <rect x="330" y="200" width="170" height="44" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="105" y="96.5">MBR</text>
    <text x="245" y="96.5">부트로더</text>
    <text x="105" y="226.5">MBR</text>
    <text x="245" y="226.5">부트로더</text>
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="415" y="96.5">새 부트로더</text>
    <text x="415" y="226.5">새 부트로더</text>
  </g>

  <!-- 첫 파티션 항목 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M105 114 V132 H245 V116" />
    <path d="M105 244 V262 H415 V246" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="113" y="150">첫 파티션 항목</text>
    <text x="113" y="280">첫 파티션 항목</text>
    <text x="60" y="176">쉬는 반쪽에 새 부트로더를 쓴다</text>
    <text x="60" y="306">첫 파티션 항목이 새 부트로더를 가리키게 MBR 전체(512바이트)를 한 번에 다시 쓴다</text>
  </g>
</svg>
