<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 490 320" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="클라이언트와 서버의 통신 방식">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="150" y="20" width="100" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="200" y="43" text-anchor="middle" fill="var(--text, #727981)">클라이언트</text>
  <rect x="450" y="20" width="100" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="500" y="43" text-anchor="middle" fill="var(--text, #727981)">서버</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="56" x2="200" y2="300" />
    <line x1="500" y1="56" x2="500" y2="300" />
  </g>

  <!-- 요청/응답 -->
  <line x1="202" y1="84" x2="498" y2="98" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="350" y="84" text-anchor="middle" font-size="12" fill="var(--text, #727981)">REQUEST</text>
  <line x1="498" y1="124" x2="202" y2="138" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="350" y="124" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RESPONSE 또는 ERROR</text>

  <!-- Fire & Forget -->
  <line x1="202" y1="180" x2="498" y2="194" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="var(--text, #727981)">REQUEST_NO_RETURN</text>

  <!-- 이벤트 -->
  <line x1="498" y1="236" x2="202" y2="250" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="350" y="236" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NOTIFICATION</text>
  <line x1="498" y1="276" x2="202" y2="290" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="350" y="276" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NOTIFICATION</text>

  <!-- 방식 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M184 74 H176 V142 H184" />
    <path d="M184 170 H176 V198 H184" />
    <path d="M184 226 H176 V294 H184" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="168" y="112">요청/응답</text>
    <text x="168" y="188">Fire &amp; Forget</text>
    <text x="168" y="264">이벤트</text>
  </g>
</svg>
