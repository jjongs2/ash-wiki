<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 19.5 769 237.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 12207의 판 -->
  <rect x="20" y="30" width="290" height="64" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30" y="40" width="90" height="44" rx="4" />
    <rect x="130" y="40" width="80" height="44" rx="4" />
    <rect x="220" y="40" width="80" height="44" rx="4" />
    <rect x="348" y="40" width="140" height="44" rx="4" />
    <rect x="528" y="40" width="100" height="44" rx="4" />
    <rect x="668" y="40" width="100" height="44" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="57">ISO/IEC</text>
    <text x="75" y="73">12207:1995</text>
    <text x="170" y="66">Amd 1:2002</text>
    <text x="260" y="66">Amd 2:2004</text>
    <text x="418" y="57">ISO/IEC 12207:2008</text>
    <text x="418" y="73">IEEE Std 12207-2008</text>
    <text x="578" y="57">ISO/IEC/IEEE</text>
    <text x="578" y="73">12207:2017</text>
    <text x="718" y="57">ISO/IEC/IEEE</text>
    <text x="718" y="73">12207:2026</text>
  </g>

  <!-- 12207을 바탕으로 한 다른 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150" y="170" width="130" height="44" rx="4" />
    <rect x="368" y="170" width="100" height="44" rx="4" />
    <rect x="528" y="170" width="100" height="44" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="215" y="187">ASPICE</text>
    <text x="215" y="203">참조 모델 4.5판(2010)</text>
    <text x="418" y="187">ISO/IEC</text>
    <text x="418" y="203">15504-5:2012</text>
    <text x="578" y="187">ISO/IEC TS</text>
    <text x="578" y="203">33061:2021</text>
  </g>

  <!-- 대체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="310" y1="62" x2="346" y2="62" />
    <line x1="488" y1="62" x2="526" y2="62" />
    <line x1="628" y1="62" x2="666" y2="62" />
    <line x1="468" y1="192" x2="526" y2="192" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="328" y="54">대체</text>
    <text x="507" y="54">대체</text>
    <text x="647" y="54">대체</text>
    <text x="497" y="184">대체</text>
  </g>

  <!-- 프로세스를 가져옴 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="170" y1="84" x2="195" y2="168" />
    <line x1="260" y1="84" x2="235" y2="168" />
    <line x1="418" y1="84" x2="418" y2="168" />
  </g>
  <line x1="150" y1="242" x2="190" y2="242" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="200" y="246" fill="var(--text, #727981)">프로세스를 가져옴</text>
</svg>
