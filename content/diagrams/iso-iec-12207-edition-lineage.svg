<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 19.5 361 471" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 12207의 판: 위에서 아래로 -->
  <rect x="20" y="30" width="150" height="168" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30" y="40" width="130" height="44" rx="2" />
    <rect x="30" y="92" width="130" height="44" rx="2" />
    <rect x="30" y="144" width="130" height="44" rx="2" />
    <rect x="30" y="238" width="130" height="44" rx="2" />
    <rect x="30" y="320" width="130" height="44" rx="2" />
    <rect x="30" y="402" width="130" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="95" y="57">ISO/IEC</text>
    <text x="95" y="73">12207:1995</text>
    <text x="95" y="118">Amd 1:2002</text>
    <text x="95" y="170">Amd 2:2004</text>
    <text x="95" y="255">ISO/IEC 12207:2008</text>
    <text x="95" y="271">IEEE Std 12207-2008</text>
    <text x="95" y="337">ISO/IEC/IEEE</text>
    <text x="95" y="353">12207:2017</text>
    <text x="95" y="419">ISO/IEC/IEEE</text>
    <text x="95" y="435">12207:2026</text>
  </g>

  <!-- 12207을 바탕으로 한 다른 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="230" y="118" width="130" height="44" rx="2" />
    <rect x="230" y="238" width="130" height="44" rx="2" />
    <rect x="230" y="320" width="130" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="295" y="135">ASPICE</text>
    <text x="295" y="151">참조 모델 4.5판(2010)</text>
    <text x="295" y="255">ISO/IEC</text>
    <text x="295" y="271">15504-5:2012</text>
    <text x="295" y="337">ISO/IEC TS</text>
    <text x="295" y="353">33061:2021</text>
  </g>

  <!-- 대체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="95" y1="198" x2="95" y2="236" />
    <line x1="95" y1="282" x2="95" y2="318" />
    <line x1="95" y1="364" x2="95" y2="400" />
    <line x1="295" y1="282" x2="295" y2="318" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="103" y="221">대체</text>
    <text x="103" y="304">대체</text>
    <text x="103" y="386">대체</text>
    <text x="303" y="304">대체</text>
  </g>

  <!-- 프로세스를 가져옴 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <line x1="160" y1="114" x2="228" y2="132" />
    <line x1="160" y1="166" x2="228" y2="148" />
    <line x1="160" y1="260" x2="228" y2="260" />
  </g>
  <line x1="20" y1="474" x2="60" y2="474" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="70" y="478" fill="var(--text, #727981)">프로세스를 가져옴</text>
</svg>
