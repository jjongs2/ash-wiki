<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 2.5 620 330" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상태 -->
  <rect x="40.75" y="20.75" width="198.5" height="42.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="47" text-anchor="middle" fill="var(--text, #727981)">초기화</text>
  <rect x="40.75" y="120.75" width="198.5" height="48.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="141" text-anchor="middle" fill="var(--text, #727981)">pre-operational</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="var(--text, #727981)">SDO 가능 · PDO 불가</text>
  <rect x="40.75" y="226.75" width="198.5" height="48.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="247" text-anchor="middle" fill="var(--text, #727981)">operational</text>
  <text x="140" y="266" text-anchor="middle" font-size="12" fill="var(--text, #727981)">PDO 가능</text>
  <rect x="380.75" y="173.75" width="198.5" height="48.5" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="480" y="194" text-anchor="middle" fill="var(--text, #727981)">stopped</text>
  <text x="480" y="213" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NMT 명령에만 반응</text>
  <!-- 전환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M140 64 V118" marker-end="url(#arrow)" />
    <path d="M120 170 V224" marker-end="url(#arrow)" />
    <path d="M160 226 V172" marker-end="url(#arrow)" />
    <path d="M240 132 H500 V171" marker-end="url(#arrow)" />
    <path d="M460 173 V158 H242" marker-end="url(#arrow)" />
    <path d="M240 264 H500 V225" marker-end="url(#arrow)" />
    <path d="M460 223 V238 H242" marker-end="url(#arrow)" />
    <path d="M40 145 H20" />
    <path d="M40 251 H20 V42 H38" marker-end="url(#arrow)" />
    <path d="M580 198 H600 V42 H242" marker-end="url(#arrow)" />
  </g>
  <circle cx="20" cy="145" r="3.5" fill="var(--ink, #727981)" />
  <text x="150" y="96" font-size="12" fill="var(--text, #727981)">boot-up 메시지</text>
  <text x="20" y="312" font-size="12" fill="var(--text, #727981)">나머지 전환은 활성 NMT manager가 보내는 NMT 명령으로 일어난다.</text>
</svg>
