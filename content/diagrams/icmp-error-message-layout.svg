<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 4.5 668 199.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- IP 데이터그램에 실린 ICMP 메시지 -->
  <rect x="20" y="44" width="150" height="44" rx="3" fill="#336fb8" />
  <text x="95" y="63" text-anchor="middle" fill="#f8fafd">IP 헤더</text>
  <text x="95" y="80" text-anchor="middle" font-size="12" fill="#f8fafd">Protocol 1</text>
  <rect x="172" y="44" width="64" height="44" rx="3" fill="#b0540d" />
  <text x="204" y="63" text-anchor="middle" fill="#f8fafd">Type</text>
  <text x="204" y="80" text-anchor="middle" font-size="12" fill="#f8fafd">8비트</text>
  <rect x="238" y="44" width="64" height="44" rx="3" fill="#b0540d" />
  <text x="270" y="63" text-anchor="middle" fill="#f8fafd">Code</text>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#f8fafd">8비트</text>
  <rect x="304" y="44" width="112" height="44" rx="3" fill="#b0540d" />
  <text x="360" y="63" text-anchor="middle" fill="#f8fafd">Checksum</text>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="#f8fafd">16비트</text>
  <rect x="418.75" y="44.75" width="248.5" height="42.5" rx="3" stroke="#727981" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="543" y="71" text-anchor="middle" fill="#727981">Type마다 다른 내용</text>
  <path d="M173 38 V32 H667 V38" stroke="#727981" stroke-width="1.5" />
  <text x="420" y="24" text-anchor="middle" font-size="12" fill="#727981">ICMP 메시지</text>
  <!-- 오류 메시지의 뒷부분 -->
  <path d="M478 90 L301 148 M667 90 V148" stroke="#727981" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="300" y="150" width="222" height="44" rx="3" fill="#336fb8" />
  <text x="411" y="169" text-anchor="middle" font-size="12" fill="#f8fafd">오류를 일으킨 데이터그램의</text>
  <text x="411" y="185" text-anchor="middle" fill="#f8fafd">IP 헤더</text>
  <rect x="524" y="150" width="144" height="44" rx="3" fill="#337b47" />
  <text x="596" y="169" text-anchor="middle" font-size="12" fill="#f8fafd">그 데이터의</text>
  <text x="596" y="185" text-anchor="middle" fill="#f8fafd">앞 8바이트 이상</text>
  <text x="288" y="177" text-anchor="end" font-size="12" fill="#727981">오류 메시지</text>
</svg>
