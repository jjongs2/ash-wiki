<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -3.5 580 338" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="패치를 만들 때와 적용할 때의 이전 이미지">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 업데이트를 만드는 쪽과 기기의 경계 -->
  <line x1="20" y1="160" x2="560" y2="160" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="24">업데이트를 만드는 쪽</text>
    <text x="40" y="184">기기</text>
  </g>

  <!-- 이전 이미지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="96" width="140" height="36" rx="2" />
    <rect x="40" y="200" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="119">이전 이미지</text>
    <text x="110" y="223">이전 이미지</text>
  </g>

  <!-- 새 이미지 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="40" y="40" width="140" height="36" rx="2" />
    <rect x="220" y="280" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="110" y="63">새 이미지</text>
    <text x="290" y="303">새 이미지</text>
  </g>

  <!-- 패치 -->
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)">
    <rect x="400" y="68" width="140" height="36" rx="2" />
    <rect x="400" y="200" width="140" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="470" y="91">패치</text>
    <text x="470" y="223">패치</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M182 58 H240 V114 H182" />
    <line x1="240" y1="86" x2="398" y2="86" marker-end="url(#arrow)" />
    <line x1="470" y1="106" x2="470" y2="198" marker-end="url(#arrow)" />
    <path d="M110 238 V298 H218" marker-end="url(#arrow)" />
    <path d="M470 238 V298 H362" marker-end="url(#arrow)" />
  </g>
  <line x1="110" y1="134" x2="110" y2="198" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="320" y="78" text-anchor="middle">비교</text>
    <text x="478" y="140">보냄</text>
    <text x="118" y="150">같아야 함</text>
    <text x="290" y="270" text-anchor="middle">패치 적용</text>
  </g>
</svg>
