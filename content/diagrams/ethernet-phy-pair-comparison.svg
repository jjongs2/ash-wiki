<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474.5 150" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 100BASE-TX: 송신 쌍과 수신 쌍 -->
  <rect x="20" y="20" width="130" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="85" y="50" text-anchor="middle" fill="var(--text, #727981)">100BASE-TX</text>
  <line x1="170" y1="35" x2="358" y2="35" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="172" y1="55" x2="360" y2="55" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" />
  <text x="374" y="39" font-size="12" fill="var(--text, #727981)">송신 쌍</text>
  <text x="374" y="59" font-size="12" fill="var(--text, #727981)">수신 쌍</text>

  <!-- 100BASE-T1: 한 쌍에 양방향 -->
  <rect x="20" y="90" width="130" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="85" y="115" text-anchor="middle" fill="var(--text, #727981)">100BASE-T1</text>
  <line x1="172" y1="110" x2="358" y2="110" stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="374" y="114" font-size="12" fill="var(--text, #727981)">한 쌍에 송신·수신</text>
</svg>
