<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 0 506 456" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="13" fill="none" aria-label="부트로더를 거친 애플리케이션 재프로그래밍">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 단계 틀 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="20" width="200" height="250" rx="2" />
    <rect x="286" y="20" width="200" height="170" rx="2" />
    <rect x="286" y="240" width="200" height="170" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)" font-weight="600">
    <text x="120" y="44">애플리케이션의 Dcm</text>
    <text x="386" y="44">부트로더</text>
    <text x="386" y="264">새로 프로그래밍된 애플리케이션</text>
  </g>

  <!-- 단계 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="30" y="60" width="180" height="50" rx="2" />
    <rect x="30" y="130" width="180" height="50" rx="2" />
    <rect x="30" y="200" width="180" height="50" rx="2" />
    <rect x="296" y="60" width="180" height="50" rx="2" />
    <rect x="296" y="130" width="180" height="50" rx="2" />
    <rect x="296" y="280" width="180" height="50" rx="2" />
    <rect x="296" y="350" width="180" height="50" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="120" y="81">DiagnosticSessionControl</text>
    <text x="120" y="98" font-size="12">programming session</text>
    <text x="120" y="151">BswM에 모드 전환으로 알림</text>
    <text x="120" y="168" font-size="12">부트로더로 넘어갈 준비</text>
    <text x="120" y="221">Dcm_SetProgConditions</text>
    <text x="120" y="238" font-size="12">ReprogrammingRequest</text>
    <text x="386" y="89.5">애플리케이션 재프로그래밍</text>
    <text x="386" y="159.5">ApplUpdated 갱신</text>
    <text x="386" y="301">Dcm_GetProgConditions</text>
    <text x="386" y="318" font-size="12">ApplUpdated 읽기</text>
    <text x="386" y="371">BswM에 알림</text>
    <text x="386" y="388" font-size="12">애플리케이션이 갱신됨</text>
  </g>

  <!-- 흐름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="110" x2="120" y2="128" />
    <line x1="120" y1="180" x2="120" y2="198" />
    <line x1="386" y1="110" x2="386" y2="128" />
    <line x1="386" y1="330" x2="386" y2="348" />
    <line x1="220" y1="145" x2="284" y2="145" />
    <line x1="386" y1="190" x2="386" y2="238" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="253" y="121" text-anchor="middle">부트로더로</text>
    <text x="253" y="137" text-anchor="middle">전환</text>
    <text x="394" y="219">ECU 리셋</text>
  </g>
  <text x="20" y="434" font-size="12" fill="var(--text, #727981)">AUTOSAR R25-11: 부트로더로 전환할지는 세션마다의 설정(DcmDspSessionForBoot)이 정한다</text>
</svg>
