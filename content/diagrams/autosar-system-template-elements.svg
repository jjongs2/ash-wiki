<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 186" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 최상위 요소 System -->
  <rect x="293" y="20" width="100" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="343" y="42.5" text-anchor="middle" font-size="14" fill="var(--text, #727981)">System</text>

  <!-- 직접 모으는 요소 -->
  <path d="M343 56 V76 H68 M68 76 V116 M176 76 V116 M311 76 V116" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="243.5" y="98" text-anchor="middle" font-size="12" fill="var(--text, #727981)">직접 모음</text>

  <!-- 참조하는 ASAM FIBEX 요소 -->
  <path d="M393 38 H540 V87" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="466.5" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">참조</text>
  <rect x="414" y="88" width="252" height="78" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="426" y="106" fill="var(--text, #727981)">ASAM FIBEX 요소</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="116" width="96" height="36" rx="2" />
    <rect x="128" y="116" width="96" height="36" rx="2" />
    <rect x="236" y="116" width="150" height="36" rx="2" />
    <rect x="426" y="116" width="96" height="36" rx="2" />
    <rect x="534" y="116" width="120" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="68" y="138.5">Software</text>
    <text x="176" y="138.5">Mapping</text>
    <text x="311" y="138.5">Mapping Constraints</text>
    <text x="474" y="138.5">Topology</text>
    <text x="594" y="138.5">Communication</text>
  </g>
</svg>
