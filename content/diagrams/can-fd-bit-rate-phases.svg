<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -3.5 771 215" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 구간 이름 -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 구간</text>
  <text x="398" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터 구간</text>
  <text x="650" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 구간</text>
  <!-- 비트 눈금: 눈금 사이가 비트 하나 -->
  <path d="M24 70 V96 M48 70 V96 M72 70 V96 M96 70 V96 M120 70 V96 M144 70 V96 M168 70 V96 M192 70 V96 M216 70 V96 M236 70 V96 M244 70 V96 M252 70 V96 M260 70 V96 M268 70 V96 M276 70 V96 M284 70 V96 M292 70 V96 M300 70 V96 M308 70 V96 M316 70 V96 M324 70 V96 M332 70 V96 M340 70 V96 M348 70 V96 M356 70 V96 M364 70 V96 M372 70 V96 M380 70 V96 M388 70 V96 M396 70 V96 M404 70 V96 M412 70 V96 M420 70 V96 M428 70 V96 M436 70 V96 M444 70 V96 M452 70 V96 M460 70 V96 M468 70 V96 M476 70 V96 M484 70 V96 M492 70 V96 M500 70 V96 M508 70 V96 M516 70 V96 M524 70 V96 M532 70 V96 M540 70 V96 M548 70 V96 M556 70 V96 M568 70 V96 M592 70 V96 M616 70 V96 M640 70 V96 M664 70 V96 M688 70 V96 M712 70 V96 M736 70 V96" stroke="var(--ink, #727981)" stroke-width="1" />
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" /></marker></defs>
  <path d="M20 96 H770" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="770" y="116" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>
  <!-- 전환 시점 -->
  <path d="M234 28 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="234" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">BRS 샘플 포인트</text>
  <path d="M562 28 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="562" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CRC 구분자 샘플 포인트</text>
  <path d="M216 102 V108 H236 V102 M556 102 V108 H568 V102" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="226" y="124">BRS</text>
    <text x="562" y="124">CRC 구분자</text>
  </g>
  <text x="20" y="156" font-size="12" fill="var(--text, #727981)">눈금 사이 하나가 비트 하나다. 데이터 구간에서는 비트 시간을 더 줄일 수 있다.</text>
  <text x="20" y="176" font-size="12" fill="var(--text, #727981)">Bosch CAN FD 1.0에서 BRS와 CRC 구분자는 샘플 포인트에서 비트율을 바꿔, 길이가 공칭 비트와 데이터 비트의 중간이다.</text>
  <text x="20" y="196" font-size="12" fill="var(--text, #727981)">BRS가 recessive일 때. dominant이면 비트율을 바꾸지 않는다.</text>
</svg>
