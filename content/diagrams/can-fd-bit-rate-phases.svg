<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -3.5 514 235" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="BRS와 CRC 구분자에서 바꾸는 비트율">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <!-- 구간 이름 -->
  <text x="93" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 구간</text>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터 구간</text>
  <text x="429" y="58" text-anchor="middle" font-size="12" fill="var(--text, #727981)">중재 구간</text>
  <!-- 비트 눈금: 눈금 사이가 비트 하나 -->
  <path d="M24 70 V96 M48 70 V96 M72 70 V96 M96 70 V96 M120 70 V96 M144 70 V96 M164 70 V96 M172 70 V96 M180 70 V96 M188 70 V96 M196 70 V96 M204 70 V96 M212 70 V96 M220 70 V96 M228 70 V96 M236 70 V96 M244 70 V96 M252 70 V96 M260 70 V96 M268 70 V96 M276 70 V96 M284 70 V96 M292 70 V96 M300 70 V96 M308 70 V96 M316 70 V96 M324 70 V96 M332 70 V96 M340 70 V96 M348 70 V96 M356 70 V96 M364 70 V96 M372 70 V96 M384 70 V96 M408 70 V96 M432 70 V96 M456 70 V96 M480 70 V96" stroke="var(--ink, #727981)" stroke-width="1" />
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" /></marker></defs>
  <path d="M20 96 H514" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="514" y="116" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>
  <!-- 전환 시점 -->
  <path d="M162 28 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="162" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">BRS 샘플 포인트</text>
  <path d="M378 28 V108" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="378" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CRC 구분자 샘플 포인트</text>
  <path d="M144 102 V108 H164 V102 M372 102 V108 H384 V102" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="154" y="124">BRS</text>
    <text x="378" y="124">CRC 구분자</text>
  </g>
  <text x="20" y="156" font-size="12" fill="var(--text, #727981)">눈금 사이 하나가 비트 하나다. 데이터 구간에서는 비트 시간을 더 줄일 수 있다.</text>
  <text x="20" y="176" font-size="12" fill="var(--text, #727981)">Bosch CAN FD 1.0에서 BRS와 CRC 구분자는 샘플 포인트에서 비트율을 바꿔,</text>
  <text x="20" y="196" font-size="12" fill="var(--text, #727981)">길이가 공칭 비트와 데이터 비트의 중간이다.</text>
  <text x="20" y="216" font-size="12" fill="var(--text, #727981)">BRS가 recessive일 때. dominant이면 비트율을 바꾸지 않는다.</text>
</svg>
