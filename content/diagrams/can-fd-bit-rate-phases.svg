<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0.5 771 174.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 구간 이름 -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#727981">중재 구간</text>
