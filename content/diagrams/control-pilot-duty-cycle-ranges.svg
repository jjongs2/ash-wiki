<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -3 561 234.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="nominal duty cycle과 valid duty cycle의 범위">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 판 -->
  <text x="286.2" y="24" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ISO 15118-3:2015</text>

  <!-- duty cycle 축: 1 % = 5.3 단위, 5 % = x 45, 10 % = x 71.5, 96 % = x 527.3 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="45" y1="130" x2="45" y2="170" />
    <line x1="71.5" y1="78" x2="71.5" y2="170" />
    <line x1="527.3" y1="78" x2="527.3" y2="170" />
  </g>
  <line x1="30" y1="170" x2="542.3" y2="170" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M45 170 v5 M71.5 170 v5 M527.3 170 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="71.5" y="189">10 %</text>
    <text x="527.3" y="189">96 %</text>
  </g>
  <text x="286.2" y="211" text-anchor="middle" font-size="12" fill="var(--text, #727981)">충전 설비가 내는 CP duty cycle</text>

  <!-- valid duty cycle은 5 %와 막대를 함께 묶음 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M45 112 V106 H527.3 V112" />
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="299.4" y="50">nominal duty cycle</text>
    <text x="299.4" y="98">valid duty cycle</text>
  </g>

  <!-- 범위 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="71.5" y="58" width="455.8" height="20" />
    <rect x="71.5" y="116" width="455.8" height="20" />
  </g>
  <circle cx="45" cy="126" r="4" fill="var(--ink, #727981)" />
  <text x="37" y="130" text-anchor="end" font-size="12" fill="var(--text, #727981)">5 %</text>
</svg>
