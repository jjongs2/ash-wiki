<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="UN R152 02 시리즈의 시나리오별 동작 차속 범위">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 판 -->
  <text x="20" y="24" fill="var(--text, #727981)">UN R152 02 시리즈</text>

  <!-- 차속 축: 1 km/h = 6 단위, 0 km/h = x 100, 10 = 160, 20 = 220, 60 = 460 -->
  <g text-anchor="end" fill="var(--text, #727981)">
    <text x="88" y="64.5">승용차</text>
    <text x="88" y="100.5">보행자</text>
    <text x="88" y="136.5">자전거</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="160" y1="70" x2="160" y2="162" />
    <line x1="220" y1="106" x2="220" y2="162" />
    <line x1="460" y1="70" x2="460" y2="162" />
  </g>

  <!-- 범위: 축 위의 구간이므로 모서리는 0 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="160" y="50" width="300" height="20" />
    <rect x="220" y="86" width="240" height="20" />
    <rect x="220" y="122" width="240" height="20" />
  </g>

  <line x1="100" y1="162" x2="520" y2="162" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M160 162 v5 M220 162 v5 M460 162 v5" stroke="var(--ink, #727981)" stroke-width="1" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="160" y="181">10</text>
    <text x="220" y="181">20</text>
    <text x="460" y="181">60</text>
    <text x="310" y="203">적어도 동작해야 하는 차속 범위 (km/h)</text>
  </g>
</svg>
