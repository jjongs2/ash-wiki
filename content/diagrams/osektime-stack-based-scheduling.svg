<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 -7.5 501 302" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 디스패처 라운드 -->
  <text x="344" y="22" text-anchor="middle" font-size="12" fill="var(--text, #727981)">디스패처 라운드</text>
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="200" y1="34" x2="488" y2="34" />
    <line x1="200" y1="28" x2="200" y2="40" />
    <line x1="488" y1="28" x2="488" y2="40" />
  </g>

  <!-- 레인 이름 -->
  <g font-size="12" fill="var(--text, #727981)" text-anchor="end">
    <text x="176" y="66">디스패처 틱</text>
    <text x="176" y="110">TT 태스크 A</text>
    <text x="176" y="156">TT 태스크 B</text>
    <text x="176" y="194.5">ttIdleTask 또는</text>
    <text x="176" y="209.5">OSEK OS</text>
  </g>

  <!-- 디스패처 틱: 태스크를 활성화한다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="200" y1="50" x2="200" y2="72" marker-end="url(#arrow)" />
    <line x1="248" y1="50" x2="248" y2="72" marker-end="url(#arrow)" />
    <line x1="392" y1="50" x2="392" y2="72" marker-end="url(#arrow)" />
    <line x1="488" y1="50" x2="488" y2="72" marker-end="url(#arrow)" />
  </g>

  <!-- suspended -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="344" y1="106" x2="488" y2="106" />
    <line x1="528" y1="106" x2="552" y2="106" />
    <line x1="200" y1="152" x2="248" y2="152" />
    <line x1="304" y1="152" x2="392" y2="152" />
    <line x1="440" y1="152" x2="552" y2="152" />
  </g>

  <!-- preempted -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="248" y1="106" x2="304" y2="106" />
    <line x1="200" y1="198" x2="344" y2="198" />
    <line x1="392" y1="198" x2="440" y2="198" />
    <line x1="488" y1="198" x2="528" y2="198" />
  </g>

  <!-- running -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="200" y="94" width="48" height="24" />
    <rect x="304" y="94" width="40" height="24" />
    <rect x="488" y="94" width="40" height="24" />
    <rect x="248" y="140" width="56" height="24" />
    <rect x="392" y="140" width="48" height="24" />
    <rect x="344" y="186" width="48" height="24" />
    <rect x="440" y="186" width="48" height="24" />
    <rect x="528" y="186" width="24" height="24" />
  </g>

  <!-- 시간 -->
  <line x1="200" y1="226" x2="560" y2="226" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="560" y="242" text-anchor="end" font-size="12" fill="var(--text, #727981)">시간</text>

  <!-- 범례 -->
  <rect x="200" y="258" width="30" height="16" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="238" y="270" font-size="12" fill="var(--text, #727981)">running</text>
  <line x1="320" y1="266" x2="350" y2="266" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="358" y="270" font-size="12" fill="var(--text, #727981)">preempted</text>
  <line x1="450" y1="266" x2="480" y2="266" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="488" y="270" font-size="12" fill="var(--text, #727981)">suspended</text>
</svg>
