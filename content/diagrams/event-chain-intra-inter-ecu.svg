<svg xmlns="http://www.w3.org/2000/svg" viewBox="-59.5 -21.5 814.5 350.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <!-- 센서에서 액추에이터까지의 종단 간 event chain이 지나는 층. 로컬 통신은 blue, 원격 통신은 orange -->

  <!-- 종단 간 event chain -->
  <path d="M-10 26 V18 H670 V26" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="330" y="8" text-anchor="middle" font-size="12" fill="var(--text, #727981)">종단 간 event chain</text>

  <!-- ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40" y="50" width="260" height="182" rx="4" />
    <rect x="340" y="50" width="260" height="182" rx="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="40" y="42">ECU 1</text>
    <text x="340" y="42">ECU 2</text>
  </g>

  <!-- 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="70" width="80" height="28" rx="2" />
    <rect x="200" y="70" width="80" height="28" rx="2" />
    <rect x="60" y="118" width="220" height="24" rx="2" />
    <rect x="60" y="162" width="220" height="24" rx="2" />
    <rect x="60" y="196" width="110" height="24" rx="2" />
    <rect x="360" y="70" width="90" height="28" rx="2" />
    <rect x="500" y="70" width="80" height="28" rx="2" />
    <rect x="360" y="118" width="220" height="24" rx="2" />
    <rect x="360" y="162" width="220" height="24" rx="2" />
    <rect x="470" y="196" width="110" height="24" rx="2" />
    <rect x="40" y="250" width="560" height="24" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="66" y="134">RTE</text>
    <text x="66" y="178">BSW</text>
    <text x="162" y="212" text-anchor="end">I/O</text>
    <text x="366" y="134">RTE</text>
    <text x="366" y="178">BSW</text>
    <text x="476" y="212">I/O</text>
    <text x="48" y="266">CAN 버스</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="88">SW-C</text>
    <text x="240" y="88">SW-C</text>
    <text x="405" y="88">SW-C</text>
    <text x="540" y="88">SW-C</text>
  </g>

  <!-- 센서와 액추에이터 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M-10 208 H100 V101" />
    <path d="M560 100 V208 H667" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="-16" y="213" text-anchor="end">센서</text>
    <text x="676" y="213">액추에이터</text>
  </g>

  <!-- 로컬 통신 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <path d="M120 100 V130 H220 V101" />
    <path d="M435 100 V130 H520 V101" />
  </g>
  <!-- 원격 통신 -->
  <path d="M260 100 V262 H410 V101" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- 범례 -->
  <line x1="40" y1="304" x2="80" y2="304" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="88" y="308" font-size="12" fill="var(--text, #727981)">로컬 통신: 같은 ECU의 SW-C 사이</text>
  <line x1="320" y1="304" x2="360" y2="304" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="368" y="308" font-size="12" fill="var(--text, #727981)">원격 통신: 다른 ECU의 SW-C 사이</text>
</svg>
