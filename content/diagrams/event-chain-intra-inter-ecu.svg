<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -21.5 526.5 372.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <!-- 센서에서 액추에이터까지의 종단 간 event chain이 지나는 층. 로컬 통신은 blue, 원격 통신은 orange. 센서와 액추에이터 이름은 화살표 위에 -->

  <!-- 종단 간 event chain -->
  <path d="M20 26 V18 H505 V26" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="262.5" y="8" text-anchor="middle" font-size="12" fill="var(--text, #727981)">종단 간 event chain</text>

  <!-- ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="60" y="50" width="170" height="182" rx="2" />
    <rect x="260" y="50" width="170" height="182" rx="2" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="60" y="42">ECU 1</text>
    <text x="260" y="42">ECU 2</text>
  </g>

  <!-- 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="70" y="70" width="60" height="28" rx="2" />
    <rect x="160" y="70" width="60" height="28" rx="2" />
    <rect x="70" y="118" width="150" height="24" rx="2" />
    <rect x="70" y="162" width="150" height="24" rx="2" />
    <rect x="70" y="196" width="80" height="24" rx="2" />
    <rect x="270" y="70" width="60" height="28" rx="2" />
    <rect x="360" y="70" width="60" height="28" rx="2" />
    <rect x="270" y="118" width="150" height="24" rx="2" />
    <rect x="270" y="162" width="150" height="24" rx="2" />
    <rect x="340" y="196" width="80" height="24" rx="2" />
    <rect x="60" y="250" width="370" height="24" rx="2" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="76" y="134">RTE</text>
    <text x="76" y="178">BSW</text>
    <text x="142" y="212" text-anchor="end">I/O</text>
    <text x="276" y="134">RTE</text>
    <text x="276" y="178">BSW</text>
    <text x="346" y="212">I/O</text>
    <text x="68" y="266">CAN 버스</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="100" y="88">SW-C</text>
    <text x="190" y="88">SW-C</text>
    <text x="300" y="88">SW-C</text>
    <text x="390" y="88">SW-C</text>
  </g>

  <!-- 센서와 액추에이터 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M20 208 H106 V101" />
    <path d="M390 100 V208 H505" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="20" y="200">센서</text>
    <text x="505" y="200" text-anchor="end">액추에이터</text>
  </g>

  <!-- 로컬 통신 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)">
    <path d="M120 100 V130 H172 V101" />
    <path d="M322 100 V130 H372 V101" />
  </g>
  <!-- 원격 통신 -->
  <path d="M205 100 V262 H310 V101" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- 범례 -->
  <line x1="60" y1="304" x2="100" y2="304" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="108" y="308" font-size="12" fill="var(--text, #727981)">로컬 통신: 같은 ECU의 SW-C 사이</text>
  <line x1="60" y1="326" x2="100" y2="326" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="108" y="330" font-size="12" fill="var(--text, #727981)">원격 통신: 다른 ECU의 SW-C 사이</text>
</svg>
