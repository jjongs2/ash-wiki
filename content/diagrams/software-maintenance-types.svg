<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 32 484 238" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 반응형과 선제형 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="180" height="96" rx="2" />
    <rect x="220" y="40" width="264" height="96" rx="2" />
  </g>
  <g fill="var(--text, #727981)" font-size="13">
    <text x="32" y="60">반응형(reactive)</text>
    <text x="232" y="60">선제형(proactive)</text>
  </g>

  <!-- 유지보수 유형 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="32" y="76" width="72" height="40" rx="2" />
    <rect x="232" y="76" width="72" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="68" y="93">교정</text>
    <text x="68" y="108">유지보수</text>
    <text x="268" y="93">예방</text>
    <text x="268" y="108">유지보수</text>
  </g>
  <!-- 개선의 유형 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="116" y="76" width="72" height="40" rx="2" />
    <rect x="316" y="76" width="72" height="40" rx="2" />
    <rect x="400" y="76" width="72" height="40" rx="2" />
    <rect x="20" y="226" width="26" height="16" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="152" y="93">적응</text>
    <text x="152" y="108">유지보수</text>
    <text x="352" y="93">완전화</text>
    <text x="352" y="108">유지보수</text>
    <text x="436" y="93">추가</text>
    <text x="436" y="108">유지보수</text>
  </g>

  <!-- 긴급 유지보수 -->
  <line x1="68" y1="116" x2="68" y2="168" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="32" y="168" width="72" height="40" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="68" y="185">긴급</text>
    <text x="68" y="200">유지보수</text>
  </g>
  <g fill="var(--text, #727981)">
    <text x="116" y="184">교정 유지보수의 한 유형으로</text>
    <text x="116" y="200">볼 수 있다</text>
  </g>

  <!-- 범례 -->
  <g fill="var(--text, #727981)">
    <text x="54" y="238">개선(enhancement)의 유형</text>
    <text x="20" y="262">적응 유지보수를 개선으로 보지 않는 조직도 있다</text>
  </g>
  <text x="484" y="262" text-anchor="end" fill="var(--text, #727981)">ISO/IEC/IEEE 14764:2022</text>
</svg>
