<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 30 500 394" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모델과 프레임워크, 상자마다 요구를 정한 표준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="40" width="220" height="60" rx="2" />
    <rect x="280" y="40" width="220" height="60" rx="2" />
    <rect x="150" y="144" width="220" height="44" rx="2" />
    <rect x="150" y="224" width="220" height="44" rx="2" />
    <rect x="150" y="304" width="220" height="44" rx="2" />
    <rect x="150" y="384" width="220" height="30" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="130" y="66">프로세스 참조 모델</text>
    <text x="130" y="83">요구: ISO/IEC 33004:2015</text>
    <text x="390" y="57">측정 프레임워크</text>
    <text x="390" y="74">ISO/IEC 33020:2019</text>
    <text x="390" y="91">요구: ISO/IEC 33003:2015</text>
    <text x="260" y="162">프로세스 평가 모델</text>
    <text x="260" y="179">요구: ISO/IEC 33004:2015</text>
    <text x="260" y="242">프로세스 평가</text>
    <text x="260" y="259">요구: ISO/IEC 33002:2015</text>
    <text x="260" y="322">process profile</text>
    <text x="260" y="339">프로세스 속성 평정의 집합</text>
    <text x="260" y="403">프로세스 능력 수준</text>
  </g>

  <!-- 흐름 -->
  <path d="M130 100 V118 H390 V100" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="260" y1="118" x2="260" y2="142" />
    <line x1="260" y1="188" x2="260" y2="222" />
    <line x1="260" y1="268" x2="260" y2="302" />
    <line x1="260" y1="348" x2="260" y2="382" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="270" y="135">합쳐 세움</text>
    <text x="270" y="210">평가에 씀</text>
    <text x="270" y="290">프레임워크로 평정</text>
    <text x="270" y="370">끌어냄</text>
  </g>
</svg>
