<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 156" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 확인 테스트: 수정한 부분 -->
  <text x="20" y="30" fill="var(--text, #727981)">확인 테스트: 수정이 결함을 실제로 없앴는지</text>
  <path d="M20 50 V42 H176 V50" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 소프트웨어 -->
  <rect x="20" y="58" width="156" height="40" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <rect x="184" y="58" width="356" height="40" rx="2" fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="98" y="82" text-anchor="middle" fill="var(--on-fill, #f8fafd)">결함 수정</text>
  <text x="362" y="82" text-anchor="middle" fill="var(--text, #727981)">바꾸지 않은 부분</text>

  <!-- 회귀 테스트: 바꾸지 않은 부분 -->
  <path d="M184 106 V114 H540 V106" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="184" y="134" fill="var(--text, #727981)">회귀 테스트: 변경이 바꾸지 않은 부분에 뜻하지 않은 영향을 주지 않았는지</text>
</svg>
