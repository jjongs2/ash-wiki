<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -2 701 192.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <!-- 통신이 넘는 경계에 따라 맡는 쪽이 다르다. IOC만 orange -->

  <!-- ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="450" height="130" rx="4" />
    <rect x="530" y="40" width="150" height="130" rx="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="20" y="28">ECU 1</text>
    <text x="530" y="28">ECU 2</text>
  </g>

  <!-- OS-Application -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40" y="60" width="210" height="90" rx="4" />
    <rect x="290" y="60" width="160" height="90" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="145" y="82">OS-Application 1</text>
    <text x="370" y="82">OS-Application 2</text>
  </g>

  <!-- SW-C -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="100" width="60" height="28" rx="2" />
    <rect x="170" y="100" width="60" height="28" rx="2" />
    <rect x="340" y="100" width="60" height="28" rx="2" />
    <rect x="575" y="100" width="60" height="28" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="118">SW-C</text>
    <text x="200" y="118">SW-C</text>
    <text x="370" y="118">SW-C</text>
    <text x="605" y="118">SW-C</text>
  </g>

  <!-- 통신 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="122" y1="114" x2="167" y2="114" />
    <line x1="402" y1="114" x2="572" y2="114" />
  </g>
  <line x1="232" y1="114" x2="337" y2="114" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="145" y="104">RTE</text>
    <text x="270" y="104">IOC</text>
    <text x="500" y="104">COM</text>
  </g>
</svg>
