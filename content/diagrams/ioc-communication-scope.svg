<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -2 701 246.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="RTE·COM·IOC가 맡는 통신">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <!-- 통신이 넘는 경계에 따라 맡는 쪽이 다르다. IOC만 orange.
       IOC는 OS의 일부이고, OS-Application 경계를 넘는 통신은 RTE가 IOC를 불러 나른다 -->

  <!-- ECU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="450" height="184" rx="2" />
    <rect x="530" y="40" width="150" height="184" rx="2" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="20" y="28">ECU 1</text>
    <text x="530" y="28">ECU 2</text>
  </g>

  <!-- OS-Application -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40" y="60" width="210" height="90" rx="2" />
    <rect x="290" y="60" width="160" height="90" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="145" y="82">OS-Application 1</text>
    <text x="370" y="82">OS-Application 2</text>
  </g>

  <!-- OS와 그 안의 IOC -->
  <rect x="40" y="166" width="410" height="38" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="52" y="190" fill="var(--text, #727981)">OS</text>
  <rect x="240.75" y="173.75" width="58.5" height="22.5" rx="2" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="270" y="189" font-size="12" text-anchor="middle" fill="var(--on-fill, #f8fafd)">IOC</text>

  <!-- SW-C -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="100" width="60" height="28" rx="2" />
    <rect x="170" y="100" width="60" height="28" rx="2" />
    <rect x="340" y="100" width="60" height="28" rx="2" />
    <rect x="575" y="100" width="60" height="28" rx="2" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="118">SW-C</text>
    <text x="200" y="118">SW-C</text>
    <text x="370" y="118">SW-C</text>
    <text x="605" y="118">SW-C</text>
  </g>

  <!-- 통신 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="122" y1="114" x2="167" y2="114" />
    <line x1="402" y1="114" x2="572" y2="114" />
  </g>
  <g stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <path d="M200 130 V185 H237" marker-end="url(#arrow-orange)" />
    <path d="M300 185 H370 V131" marker-end="url(#arrow-orange)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="145" y="104" text-anchor="middle">RTE</text>
    <text x="500" y="104" text-anchor="middle">COM</text>
    <text x="206" y="143">RTE</text>
    <text x="376" y="143">RTE</text>
  </g>
</svg>
