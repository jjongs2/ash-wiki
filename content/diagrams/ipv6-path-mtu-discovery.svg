<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 22 510 264" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Packet Too Big으로 줄이는 경로 MTU">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 경로: 노드와 링크 -->
  <rect x="60" y="32" width="100" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="110" y="53" text-anchor="middle" fill="var(--text, #727981)">출발 노드</text>
  <rect x="250" y="32" width="100" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="300" y="53" text-anchor="middle" fill="var(--text, #727981)">경로의 노드</text>
  <rect x="450" y="32" width="100" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="500" y="53" text-anchor="middle" fill="var(--text, #727981)">목적 노드</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="162" y1="48" x2="248" y2="48" />
    <line x1="352" y1="48" x2="448" y2="48" />
  </g>
  <text x="205" y="40" text-anchor="middle" font-size="12" fill="var(--text, #727981)">첫 홉의 MTU</text>
  <text x="400" y="40" text-anchor="middle" font-size="12" fill="var(--text, #727981)">더 작은 링크 MTU</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="64" x2="110" y2="276" />
    <line x1="300" y1="64" x2="300" y2="276" />
    <line x1="500" y1="64" x2="500" y2="276" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <!-- 첫 홉의 MTU 크기로 보낸 패킷 -->
    <line x1="112" y1="100" x2="298" y2="114" />
    <!-- Packet Too Big -->
    <line x1="298" y1="146" x2="112" y2="160" />
    <!-- 줄인 경로 MTU 크기로 다시 보낸 패킷 -->
    <line x1="112" y1="230" x2="298" y2="244" />
    <line x1="302" y1="244" x2="498" y2="258" />
  </g>

  <text x="205" y="94" text-anchor="middle" fill="var(--text, #727981)">패킷 (첫 홉의 MTU 크기)</text>
  <text x="312" y="120" font-size="12" fill="var(--text, #727981)">너무 커서 버림</text>
  <text x="205" y="140" text-anchor="middle" fill="var(--text, #727981)">Packet Too Big (MTU)</text>
  <text x="122" y="192" font-size="12" fill="var(--text, #727981)">가정한 경로 MTU를 줄임</text>
  <text x="205" y="224" text-anchor="middle" fill="var(--text, #727981)">패킷 (줄인 경로 MTU 크기)</text>
</svg>
