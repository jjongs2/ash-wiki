<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 22 660 264" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 경로: 노드와 링크 -->
  <rect x="60" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="120" y="53" text-anchor="middle" fill="var(--text, #727981)">출발 노드</text>
  <rect x="320" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="380" y="53" text-anchor="middle" fill="var(--text, #727981)">경로의 노드</text>
  <rect x="580" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="640" y="53" text-anchor="middle" fill="var(--text, #727981)">목적 노드</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="182" y1="48" x2="318" y2="48" />
    <line x1="442" y1="48" x2="578" y2="48" />
  </g>
  <text x="250" y="40" text-anchor="middle" font-size="12" fill="var(--text, #727981)">첫 홉의 MTU</text>
  <text x="510" y="40" text-anchor="middle" font-size="12" fill="var(--text, #727981)">더 작은 링크 MTU</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="120" y1="64" x2="120" y2="276" />
    <line x1="380" y1="64" x2="380" y2="276" />
    <line x1="640" y1="64" x2="640" y2="276" />
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <!-- 첫 홉의 MTU 크기로 보낸 패킷 -->
    <line x1="122" y1="100" x2="378" y2="114" />
    <!-- Packet Too Big -->
    <line x1="378" y1="146" x2="122" y2="160" />
    <!-- 줄인 경로 MTU 크기로 다시 보낸 패킷 -->
    <line x1="122" y1="230" x2="378" y2="244" />
    <line x1="382" y1="244" x2="638" y2="258" />
  </g>

  <text x="250" y="94" text-anchor="middle" fill="var(--text, #727981)">패킷 (첫 홉의 MTU 크기)</text>
  <text x="392" y="120" font-size="12" fill="var(--text, #727981)">너무 커서 버림</text>
  <text x="250" y="140" text-anchor="middle" fill="var(--text, #727981)">Packet Too Big (MTU)</text>
  <text x="132" y="192" font-size="12" fill="var(--text, #727981)">가정한 경로 MTU를 줄임</text>
  <text x="250" y="224" text-anchor="middle" fill="var(--text, #727981)">패킷 (줄인 경로 MTU 크기)</text>
</svg>
