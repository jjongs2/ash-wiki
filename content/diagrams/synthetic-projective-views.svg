<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 700 172.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="175" y="34">synthetic 방식</text>
    <text x="545" y="34">projective 방식</text>
  </g>

  <!-- synthetic: AD 안에서 뷰를 통합 -->
  <rect x="20" y="52" width="310" height="104" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="70" font-size="12" fill="var(--text, #727981)">AD</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="112" y1="100" x2="138" y2="100" />
    <line x1="212" y1="100" x2="238" y2="100" />
  </g>
  <text x="175" y="140" font-size="12" text-anchor="middle" fill="var(--text, #727981)">correspondence 규칙으로 통합</text>

  <!-- projective: 통합된 모델에서 뷰를 뽑아냄 -->
  <rect x="470" y="52" width="150" height="32" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="545" y="73" text-anchor="middle" fill="var(--on-fill, #f8fafd)">통합된 모델</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M545 86 V104 M445 104 H645" />
    <line x1="445" y1="104" x2="445" y2="122" marker-end="url(#arrow)" />
    <line x1="545" y1="104" x2="545" y2="122" marker-end="url(#arrow)" />
    <line x1="645" y1="104" x2="645" y2="122" marker-end="url(#arrow)" />
  </g>
  <text x="600" y="98" font-size="12" text-anchor="middle" fill="var(--text, #727981)">정해진 절차</text>

  <!-- 뷰 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40" y="84" width="70" height="32" rx="2" />
    <rect x="140" y="84" width="70" height="32" rx="2" />
    <rect x="240" y="84" width="70" height="32" rx="2" />
    <rect x="410" y="124" width="70" height="32" rx="2" />
    <rect x="510" y="124" width="70" height="32" rx="2" />
    <rect x="610" y="124" width="70" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="105">뷰</text>
    <text x="175" y="105">뷰</text>
    <text x="275" y="105">뷰</text>
    <text x="445" y="145">뷰</text>
    <text x="545" y="145">뷰</text>
    <text x="645" y="145">뷰</text>
  </g>
</svg>
