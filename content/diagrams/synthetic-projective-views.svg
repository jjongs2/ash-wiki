<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3.5 516 172.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="133" y="34">synthetic 방식</text>
    <text x="391" y="34">projective 방식</text>
  </g>

  <!-- synthetic: AD 안에서 뷰를 통합 -->
  <rect x="20" y="52" width="226" height="104" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="32" y="70" font-size="12" fill="var(--text, #727981)">AD</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="84" y1="100" x2="106" y2="100" />
    <line x1="160" y1="100" x2="182" y2="100" />
  </g>
  <text x="133" y="140" font-size="12" text-anchor="middle" fill="var(--text, #727981)">correspondence 규칙으로 통합</text>

  <!-- projective: 통합된 모델에서 뷰를 뽑아냄 -->
  <rect x="316" y="52" width="150" height="32" rx="2" fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5" />
  <text x="391" y="73" text-anchor="middle" fill="var(--on-fill, #f8fafd)">통합된 모델</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M391 86 V104 M311 104 H471" />
    <line x1="311" y1="104" x2="311" y2="122" marker-end="url(#arrow)" />
    <line x1="391" y1="104" x2="391" y2="122" marker-end="url(#arrow)" />
    <line x1="471" y1="104" x2="471" y2="122" marker-end="url(#arrow)" />
  </g>
  <text x="433" y="98" font-size="12" text-anchor="middle" fill="var(--text, #727981)">정해진 절차</text>

  <!-- 뷰 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="32" y="84" width="50" height="32" rx="2" />
    <rect x="108" y="84" width="50" height="32" rx="2" />
    <rect x="184" y="84" width="50" height="32" rx="2" />
    <rect x="286" y="124" width="50" height="32" rx="2" />
    <rect x="366" y="124" width="50" height="32" rx="2" />
    <rect x="446" y="124" width="50" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="57" y="105">뷰</text>
    <text x="133" y="105">뷰</text>
    <text x="209" y="105">뷰</text>
    <text x="311" y="145">뷰</text>
    <text x="391" y="145">뷰</text>
    <text x="471" y="145">뷰</text>
  </g>
</svg>
