<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="72" height="44" rx="2" />
    <rect x="158" y="20" width="100" height="44" rx="2" />
    <rect x="354" y="20" width="146" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="56" y="47">응용</text>
    <text x="208" y="47">임시 저장소</text>
    <text x="427" y="39">Key-Value Storage</text>
  </g>
  <text x="427" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비휘발성 메모리</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="92" y1="42" x2="156" y2="42" marker-end="url(#arrow)" />
    <line x1="258" y1="42" x2="352" y2="42" marker-end="url(#arrow)" />
    <path d="M427 64 V100 H238 V66" marker-end="url(#arrow)" />
    <line x1="178" y1="64" x2="178" y2="142" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="125" y="34">모든 작업</text>
    <text x="305" y="34">SyncToStorage</text>
    <text x="332" y="118">저장소를 열 때 만든다</text>
    <text x="178" y="162">저장하지 않은 변경은</text>
    <text x="178" y="178">닫거나 재시작하면 버려진다</text>
  </g>
</svg>
