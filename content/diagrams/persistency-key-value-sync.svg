<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="100" height="44" rx="2" />
    <rect x="200" y="20" width="120" height="44" rx="2" />
    <rect x="460" y="20" width="180" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="47">응용</text>
    <text x="260" y="47">임시 저장소</text>
    <text x="550" y="39">Key-Value Storage</text>
  </g>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비휘발성 메모리</text>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="120" y1="42" x2="198" y2="42" marker-end="url(#arrow)" />
    <line x1="320" y1="42" x2="458" y2="42" marker-end="url(#arrow)" />
    <path d="M550 64 V100 H290 V66" marker-end="url(#arrow)" />
    <line x1="230" y1="64" x2="230" y2="142" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="159" y="34">모든 작업</text>
    <text x="389" y="34">SyncToStorage</text>
    <text x="420" y="118">저장소를 열 때 만든다</text>
    <text x="230" y="162">저장하지 않은 변경은</text>
    <text x="230" y="178">닫거나 재시작하면 버려진다</text>
  </g>
</svg>
