<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 4 508 216" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 제어 패킷의 세 부분 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 34 V28 H180 V34" />
    <path d="M184 34 V28 H508 V34" />
  </g>
  <text x="100" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">모든 제어 패킷</text>
  <text x="346" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">일부 제어 패킷에만</text>
  <rect x="20" y="42" width="160" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="184.75" y="42.75" width="158.5" height="34.5" fill="var(--surface, none)" />
    <rect x="348.75" y="42.75" width="158.5" height="34.5" fill="var(--surface, none)" />
  </g>
  <text x="100" y="65" text-anchor="middle" fill="var(--text, #727981)">Fixed Header</text>
  <text x="264" y="65" text-anchor="middle" fill="var(--text, #727981)">Variable Header</text>
  <text x="428" y="65" text-anchor="middle" fill="var(--text, #727981)">Payload</text>

  <!-- Fixed Header 펼침 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="80" x2="20" y2="146" />
    <line x1="180" y1="80" x2="424" y2="146" />
  </g>
  <text x="70" y="140" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비트 7~4</text>
  <text x="172" y="140" text-anchor="middle" font-size="12" fill="var(--text, #727981)">비트 3~0</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="148" width="100" height="36" fill="var(--surface, none)" />
    <rect x="122" y="148" width="100" height="36" fill="var(--surface, none)" />
    <rect x="224" y="148" width="200" height="36" fill="var(--surface, none)" />
  </g>
  <text x="70" y="170" text-anchor="middle" font-size="12" fill="var(--text, #727981)">제어 패킷 종류</text>
  <text x="172" y="171" text-anchor="middle" fill="var(--text, #727981)">플래그</text>
  <text x="324" y="171" text-anchor="middle" fill="var(--text, #727981)">Remaining Length</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M20 190 V196 H222 V190" />
    <path d="M224 190 V196 H424 V190" />
  </g>
  <text x="121" y="212" text-anchor="middle" font-size="12" fill="var(--text, #727981)">첫 바이트</text>
  <text x="324" y="212" text-anchor="middle" font-size="12" fill="var(--text, #727981)">둘째 바이트부터 · 최대 4바이트</text>
</svg>
