<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 4.5 673 126.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- 필드: 스터핑하는 쪽과 모양이 고정된 쪽 -->
  <rect x="10" y="44" width="50" height="44" fill="#336fb8" />
  <text x="35" y="71" text-anchor="middle" fill="#f8fafd">SOF</text>
  <rect x="64" y="44" width="84" height="44" fill="#336fb8" />
  <text x="106" y="71" text-anchor="middle" fill="#f8fafd">중재 필드</text>
  <rect x="152" y="44" width="84" height="44" fill="#336fb8" />
  <text x="194" y="71" text-anchor="middle" fill="#f8fafd">제어 필드</text>
  <rect x="240" y="44" width="90" height="44" fill="#336fb8" />
  <text x="285" y="71" text-anchor="middle" fill="#f8fafd">데이터 필드</text>
  <rect x="334" y="44" width="90" height="44" fill="#336fb8" />
  <text x="379" y="71" text-anchor="middle" fill="#f8fafd">CRC 시퀀스</text>
  <rect x="428" y="44" width="90" height="44" stroke="#727981" stroke-width="1.5" />
  <text x="473" y="71" text-anchor="middle" fill="#727981">CRC 구분자</text>
  <rect x="522" y="44" width="80" height="44" stroke="#727981" stroke-width="1.5" />
  <text x="562" y="71" text-anchor="middle" fill="#727981">ACK 필드</text>
  <rect x="606" y="44" width="56" height="44" stroke="#727981" stroke-width="1.5" />
  <text x="634" y="71" text-anchor="middle" fill="#727981">EOF</text>
  <path d="M10 38 V32 H424 V38" stroke="#727981" stroke-width="1.5" />
  <text x="217" y="24" text-anchor="middle" font-size="12" fill="#727981">스터핑 대상</text>
  <path d="M428 38 V32 H662 V38" stroke="#727981" stroke-width="1.5" />
  <text x="545" y="24" text-anchor="middle" font-size="12" fill="#727981">모양이 고정, 스터핑하지 않음</text>
  <text x="10" y="120" font-size="12" fill="#727981">데이터 프레임과 리모트 프레임. 오류 프레임과 오버로드 프레임은 스터핑하지 않는다.</text>
</svg>
