<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 138" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 행 이름 -->
  <g font-size="14" fill="var(--text, #727981)">
    <text x="20" y="47">IEEE 1722 프레임</text>
    <text x="20" y="101">IP UDP 캡슐화</text>
  </g>

  <!-- 머리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="150.75" y="20.75" width="219.25" height="40.5" />
    <rect x="150.75" y="74.75" width="219.25" height="40.5" />
    <rect x="370" y="74.75" width="70" height="40.5" />
    <rect x="440" y="74.75" width="70" height="40.5" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="37">IEEE 802 헤더</text>
    <text x="260" y="53">EtherType 0x22F0</text>
    <text x="260" y="100">IEEE 802 헤더</text>
    <text x="405" y="100">IP</text>
    <text x="475" y="100">UDP</text>
  </g>

  <!-- AVTP -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="370" y="20.75" width="119.25" height="40.5" />
    <rect x="510" y="74.75" width="119.25" height="40.5" />
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="430" y="46">AVTP</text>
    <text x="570" y="100">AVTP</text>
  </g>
</svg>
