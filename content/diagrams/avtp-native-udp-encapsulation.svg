<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 138" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 행 이름 -->
  <g font-size="14" fill="var(--text, #727981)">
    <text x="20" y="47">IEEE 1722 프레임</text>
    <text x="20" y="101">IP UDP 캡슐화</text>
  </g>

  <!-- 머리 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="130.75" y="20.75" width="149.25" height="40.5" />
    <rect x="130.75" y="74.75" width="149.25" height="40.5" />
    <rect x="280" y="74.75" width="56" height="40.5" />
    <rect x="336" y="74.75" width="56" height="40.5" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="205" y="37">IEEE 802 헤더</text>
    <text x="205" y="53">EtherType 0x22F0</text>
    <text x="205" y="100">IEEE 802 헤더</text>
    <text x="308" y="100">IP</text>
    <text x="364" y="100">UDP</text>
  </g>

  <!-- AVTP -->
  <g fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5">
    <rect x="280" y="20.75" width="109.25" height="40.5" />
    <rect x="392" y="74.75" width="109.25" height="40.5" />
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="334.5" y="46">AVTP</text>
    <text x="446.5" y="100">AVTP</text>
  </g>
</svg>
