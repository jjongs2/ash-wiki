<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 30 529.75 174.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="Back-to-back 테스트의 결과 비교">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <!-- 상자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="90" width="122" height="36" rx="2" />
    <rect x="184" y="40" width="118" height="36" rx="2" />
    <rect x="184" y="140" width="118" height="36" rx="2" />
    <rect x="342" y="90" width="76" height="36" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="81" y="113">같은 테스트 케이스</text>
    <text x="243" y="63">테스트 대상</text>
    <text x="243" y="163">pseudo-oracle</text>
    <text x="380" y="113">결과 비교</text>
  </g>
  <text x="243" y="194" font-size="12" fill="var(--text, #727981)" text-anchor="middle">독립적으로 만든 변형</text>

  <!-- 두 변형에 같은 입력 -->
  <line x1="142" y1="108" x2="162" y2="108" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M162 108 V58 H182" />
    <path d="M162 108 V158 H182" />
  </g>

  <!-- 두 결과를 비교 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M302 58 H322 V108" />
    <path d="M302 158 H322 V108" />
  </g>
  <line x1="322" y1="108" x2="340" y2="108" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 판정 -->
  <line x1="418" y1="108" x2="434" y2="108" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M434 108 V78 H474" />
    <path d="M434 108 V138 H474" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="454" y="70">같으면</text>
    <text x="454" y="130">다르면</text>
  </g>
  <g fill="var(--text, #727981)">
    <text x="480" y="83">통과</text>
    <text x="480" y="143">원인 분석</text>
  </g>
</svg>
