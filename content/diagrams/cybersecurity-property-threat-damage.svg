<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 620 223.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">ISO/SAE 21434:2021</text>

  <!-- 위협 시나리오와 피해 시나리오 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="30" width="140" height="40" rx="4" />
    <rect x="480" y="30" width="140" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="90" y="55">위협 시나리오</text>
    <text x="550" y="55">피해 시나리오</text>
  </g>
  <line x1="160" y1="50" x2="478" y2="50" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">실현하려 함</text>

  <!-- 자산과 그 사이버보안 속성 -->
  <rect x="200" y="110" width="240" height="104" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="320" y="132" text-anchor="middle" fill="var(--text, #727981)">자산</text>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="var(--text, #727981)">사이버보안 속성의 예</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="216" y="166" width="64" height="28" rx="2" />
    <rect x="288" y="166" width="64" height="28" rx="2" />
    <rect x="360" y="166" width="64" height="28" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="248" y="185">기밀성</text>
    <text x="320" y="185">무결성</text>
    <text x="392" y="185">가용성</text>
  </g>

  <!-- 훼손과 그 결과 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M90 70 V162 H198" />
    <path d="M440 162 H550 V72" />
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="144" y="154">훼손</text>
    <text x="495" y="138">훼손되면</text>
    <text x="495" y="154">생길 수 있음</text>
  </g>
</svg>
