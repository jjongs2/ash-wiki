<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 306" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- CPU: 다른 객체를 담는 컨테이너 -->
  <rect x="20.75" y="20.75" width="480.5" height="238.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="36" y="44" fill="var(--text, #727981)">CPU</text>

  <!-- 객체 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="40" y="60" width="90" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="170" y="60" width="90" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="170" y="200" width="90" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="392" y="130" width="90" height="40" rx="2" fill="var(--surface, none)" />
    <rect x="392" y="200" width="90" height="40" rx="2" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="85" y="85">RESOURCE</text>
    <text x="215" y="85">TASK</text>
    <text x="215" y="225">EVENT</text>
    <text x="437" y="155">ALARM</text>
    <text x="437" y="225">COUNTER</text>
  </g>

  <!-- 참조 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="168" y1="80" x2="132" y2="80" marker-end="url(#arrow)" />
    <line x1="215" y1="102" x2="215" y2="198" marker-end="url(#arrow)" />
    <path d="M390 150 H296 V80 H262" marker-end="url(#arrow)" />
    <path d="M296 150 V220 H262" marker-end="url(#arrow)" />
    <line x1="437" y1="172" x2="437" y2="198" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="343" y="142" text-anchor="middle">만료 동작에 따라</text>
    <text x="207" y="154" text-anchor="end">extended 태스크라면</text>
  </g>

  <!-- 범례 -->
  <line x1="440" y1="280" x2="470" y2="280" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="478" y="284" font-size="12" fill="var(--text, #727981)">참조</text>
</svg>
