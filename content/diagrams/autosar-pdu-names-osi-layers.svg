<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 417.5 476" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 모듈 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="180" y="20" width="160" height="36" rx="2" />
    <rect x="180" y="100" width="160" height="36" rx="2" />
    <rect x="100" y="180" width="160" height="36" rx="2" />
    <rect x="180" y="260" width="160" height="36" rx="2" />
    <rect x="180" y="340" width="160" height="36" rx="2" />
    <rect x="180" y="420" width="160" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="260" y="43">AUTOSAR COM</text>
    <text x="260" y="123">PduR</text>
    <text x="180" y="203">전송 프로토콜 모듈</text>
    <text x="260" y="283">LSduR</text>
    <text x="260" y="363">버스 인터페이스</text>
    <text x="260" y="443">드라이버</text>
  </g>

  <!-- 모듈 사이에서 주고받는 PDU -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="260" y1="58" x2="260" y2="98" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="220" y1="138" x2="220" y2="178" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="310" y1="138" x2="310" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="220" y1="218" x2="220" y2="258" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="260" y1="298" x2="260" y2="338" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="260" y1="378" x2="260" y2="418" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="270" y="82">I-PDU</text>
    <text x="210" y="162" text-anchor="end">I-PDU</text>
    <text x="318" y="202">I-PDU</text>
    <text x="210" y="242" text-anchor="end">N-PDU</text>
    <text x="270" y="322">L-PDU</text>
    <text x="270" y="402">L-PDU</text>
  </g>

  <!-- OSI 참조 모델의 층 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M384 20 H390 V136 H384" />
    <path d="M384 180 H390 V216 H384" />
    <path d="M384 340 H390 V456 H384" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="400" y="74">6층</text>
    <text x="400" y="93" font-size="12">상호작용 계층</text>
    <text x="400" y="194">3층</text>
    <text x="400" y="213" font-size="12">네트워크 계층</text>
    <text x="400" y="394">2층</text>
    <text x="400" y="413" font-size="12">데이터 링크 계층</text>
  </g>
</svg>
