<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CNC -->
  <rect x="190" y="20" width="300" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="340" y="43" font-size="13" text-anchor="middle" fill="var(--text, #727981)">CNC</text>

  <!-- 엔드 스테이션과 브리지 -->
  <rect x="168" y="128" width="334" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="140" width="100" height="36" rx="2" />
    <rect x="180" y="140" width="70" height="36" rx="2" />
    <rect x="300" y="140" width="70" height="36" rx="2" />
    <rect x="420" y="140" width="70" height="36" rx="2" />
    <rect x="560" y="140" width="100" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="163">talker</text>
    <text x="215" y="163">브리지</text>
    <text x="335" y="163">브리지</text>
    <text x="455" y="163">브리지</text>
    <text x="610" y="163">listener</text>
  </g>

  <!-- UNI -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)">
    <line x1="122" y1="158" x2="178" y2="158" />
    <line x1="492" y1="158" x2="558" y2="158" />
  </g>

  <!-- 에지 브리지와 CNC -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="205" y1="58" x2="215" y2="138" />
    <line x1="475" y1="58" x2="455" y2="138" />
  </g>

  <!-- 원격 네트워크 관리 -->
  <line x1="340" y1="56" x2="340" y2="126" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)" />

  <g fill="var(--text, #727981)">
    <text x="150" y="150" text-anchor="middle">UNI</text>
    <text x="525" y="150" text-anchor="middle">UNI</text>
    <text x="198" y="100" text-anchor="end">talker·listener 정보</text>
    <text x="474" y="100">talker·listener 정보</text>
    <text x="348" y="88">원격 네트워크 관리</text>
    <text x="348" y="104">모든 브리지 설정</text>
  </g>
</svg>
