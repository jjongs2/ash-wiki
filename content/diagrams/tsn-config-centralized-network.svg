<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 524 228" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="CNC와 주고받는 talker·listener 정보">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- CNC -->
  <rect x="130" y="20" width="264" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="262" y="43" font-size="13" text-anchor="middle" fill="var(--text, #727981)">CNC</text>

  <!-- 엔드 스테이션과 브리지 -->
  <rect x="126" y="128" width="272" height="60" rx="2" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="140" width="70" height="36" rx="2" />
    <rect x="138" y="140" width="56" height="36" rx="2" />
    <rect x="234" y="140" width="56" height="36" rx="2" />
    <rect x="330" y="140" width="56" height="36" rx="2" />
    <rect x="434" y="140" width="70" height="36" rx="2" />
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--text, #727981)">
    <text x="55" y="163">talker</text>
    <text x="166" y="163">브리지</text>
    <text x="262" y="163">브리지</text>
    <text x="358" y="163">브리지</text>
    <text x="469" y="163">listener</text>
  </g>

  <!-- UNI -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)">
    <line x1="92" y1="158" x2="136" y2="158" />
    <line x1="388" y1="158" x2="432" y2="158" />
  </g>

  <!-- 에지 브리지와 CNC -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="140" y1="58" x2="150" y2="138" />
    <line x1="384" y1="58" x2="374" y2="138" />
  </g>

  <!-- 원격 네트워크 관리 -->
  <line x1="262" y1="56" x2="262" y2="126" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ink)" />

  <g fill="var(--text, #727981)">
    <text x="108" y="150" text-anchor="middle">UNI</text>
    <text x="416" y="150" text-anchor="middle">UNI</text>
    <text x="136" y="100" text-anchor="end">talker·listener 정보</text>
    <text x="388" y="100">talker·listener 정보</text>
    <text x="270" y="88">원격 네트워크 관리</text>
    <text x="270" y="104">모든 브리지 설정</text>
    <text x="262" y="206" text-anchor="middle">네트워크</text>
  </g>
</svg>
