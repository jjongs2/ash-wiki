<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 13 643 252" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 축 -->
  <text x="130" y="44" text-anchor="end" fill="var(--text, #727981)">최댓값</text>
  <text x="130" y="144" text-anchor="end" fill="var(--text, #727981)">최솟값</text>
  <line x1="140" y1="40" x2="620" y2="40" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="140" y1="140" x2="626" y2="140" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="632" y="144" fill="var(--text, #727981)">시간</text>

  <!-- free running counter -->
  <polyline points="140,140 300,40 300,140 460,40 460,140 580,65" stroke="var(--ink, #727981)" stroke-width="3" stroke-linejoin="round" />
  <text x="292" y="32" text-anchor="end" fill="var(--text, #727981)">free running counter</text>

  <!-- compare threshold -->
  <line x1="140" y1="90" x2="620" y2="90" stroke="var(--orange, #b0540d)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="130" y="94" text-anchor="end" fill="var(--text, #727981)">compare threshold</text>

  <!-- 일치 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="96" x2="220" y2="216" />
    <line x1="380" y1="96" x2="380" y2="216" />
    <line x1="540" y1="96" x2="540" y2="216" />
  </g>
  <g fill="var(--orange, #b0540d)">
    <circle cx="220" cy="90" r="4" />
    <circle cx="380" cy="90" r="4" />
    <circle cx="540" cy="90" r="4" />
  </g>
  <g fill="var(--text, #727981)">
    <text x="226" y="112">일치</text>
    <text x="386" y="112">일치</text>
    <text x="546" y="112">일치</text>
  </g>

  <!-- 일치 때 동작 -->
  <text x="130" y="194" text-anchor="end" fill="var(--text, #727981)">출력 핀 · 뒤집기</text>
  <path d="M140 202 H220 V174 H380 V202 H540 V174 H580" stroke="var(--ink, #727981)" stroke-width="3" />
  <text x="130" y="246" text-anchor="end" fill="var(--text, #727981)">notification</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="220" y1="226" x2="220" y2="254" />
    <line x1="380" y1="226" x2="380" y2="254" />
    <line x1="540" y1="226" x2="540" y2="254" />
  </g>
</svg>
