<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 196" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#727981" />
    </marker>
  </defs>

  <!-- 반복되는 사건 -->
  <rect x="20" y="74" width="180" height="48" rx="4" fill="#825da9" />
  <g text-anchor="middle" fill="#f8fafd">
    <text x="110" y="94">반복되는 사건</text>
    <text x="110" y="111" font-size="12">타이머 인터럽트, 축의 엔코더</text>
  </g>

  <!-- 카운터 -->
  <rect x="240" y="74" width="100" height="48" rx="4" fill="#336fb8" />
  <text x="290" y="103" text-anchor="middle" fill="#f8fafd">카운터</text>

  <!-- 알람 -->
  <g fill="#b0540d">
    <rect x="380" y="20" width="100" height="40" rx="4" />
    <rect x="380" y="78" width="100" height="40" rx="4" />
    <rect x="380" y="136" width="100" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="430" y="45">알람</text>
    <text x="430" y="103">알람</text>
    <text x="430" y="161">알람</text>
  </g>

  <!-- 만료 동작 -->
  <g fill="#337b47">
    <rect x="520" y="20" width="160" height="40" rx="4" />
    <rect x="520" y="78" width="160" height="40" rx="4" />
    <rect x="520" y="136" width="160" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="#f8fafd">
    <text x="600" y="45">태스크 활성화</text>
    <text x="600" y="103">이벤트 설정</text>
    <text x="600" y="161">callback 루틴 호출</text>
  </g>

  <g stroke="#727981" stroke-width="1.5">
    <line x1="202" y1="98" x2="238" y2="98" marker-end="url(#arrow)" />
    <line x1="342" y1="88" x2="378" y2="44" marker-end="url(#arrow)" />
    <line x1="342" y1="98" x2="378" y2="98" marker-end="url(#arrow)" />
    <line x1="342" y1="108" x2="378" y2="152" marker-end="url(#arrow)" />
    <line x1="482" y1="40" x2="518" y2="40" marker-end="url(#arrow)" />
    <line x1="482" y1="98" x2="518" y2="98" marker-end="url(#arrow)" />
    <line x1="482" y1="156" x2="518" y2="156" marker-end="url(#arrow)" />
  </g>
</svg>
