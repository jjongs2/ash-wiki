<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 318" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="counter에 걸린 알람의 만료 동작">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 반복되는 사건 -->
  <rect x="170.75" y="20.75" width="158.5" height="46.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="250" y="40">반복되는 사건</text>
    <text x="250" y="57" font-size="12">타이머 인터럽트, 축의 엔코더</text>
  </g>

  <!-- counter -->
  <rect x="200.75" y="98.75" width="98.5" height="46.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="250" y="127" text-anchor="middle" fill="var(--on-fill, #f8fafd)">counter</text>

  <!-- 알람 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="40.75" y="190.75" width="98.5" height="38.5" rx="2" />
    <rect x="200.75" y="190.75" width="98.5" height="38.5" rx="2" />
    <rect x="360.75" y="190.75" width="98.5" height="38.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="90" y="215">알람</text>
    <text x="250" y="215">알람</text>
    <text x="410" y="215">알람</text>
  </g>

  <!-- 만료 동작 -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="20.75" y="258.75" width="138.5" height="38.5" rx="2" />
    <rect x="180.75" y="258.75" width="138.5" height="38.5" rx="2" />
    <rect x="340.75" y="258.75" width="138.5" height="38.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="90" y="283">태스크 활성화</text>
    <text x="250" y="283">이벤트 설정</text>
    <text x="410" y="283">callback 루틴 호출</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="250" y1="70" x2="250" y2="96" marker-end="url(#arrow)" />
    <path d="M250 148 V168 H90 V188" marker-end="url(#arrow)" />
    <line x1="250" y1="148" x2="250" y2="188" marker-end="url(#arrow)" />
    <path d="M250 148 V168 H410 V188" marker-end="url(#arrow)" />
    <line x1="90" y1="232" x2="90" y2="256" marker-end="url(#arrow)" />
    <line x1="250" y1="232" x2="250" y2="256" marker-end="url(#arrow)" />
    <line x1="410" y1="232" x2="410" y2="256" marker-end="url(#arrow)" />
  </g>
</svg>
