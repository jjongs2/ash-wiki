<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 196" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 반복되는 사건 -->
  <rect x="20" y="74" width="180" height="48" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="94">반복되는 사건</text>
    <text x="110" y="111" font-size="12">타이머 인터럽트, 축의 엔코더</text>
  </g>

  <!-- counter -->
  <rect x="240.75" y="74.75" width="98.5" height="46.5" rx="2" fill="var(--blue-tint, #336fb8)" stroke="var(--blue, #336fb8)" stroke-width="1.5" />
  <text x="290" y="103" text-anchor="middle" fill="var(--on-fill, #f8fafd)">counter</text>

  <!-- 알람 -->
  <g fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5">
    <rect x="380.75" y="20.75" width="98.5" height="38.5" rx="2" />
    <rect x="380.75" y="78.75" width="98.5" height="38.5" rx="2" />
    <rect x="380.75" y="136.75" width="98.5" height="38.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="430" y="45">알람</text>
    <text x="430" y="103">알람</text>
    <text x="430" y="161">알람</text>
  </g>

  <!-- 만료 동작 -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="520.75" y="20.75" width="158.5" height="38.5" rx="2" />
    <rect x="520.75" y="78.75" width="158.5" height="38.5" rx="2" />
    <rect x="520.75" y="136.75" width="158.5" height="38.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="600" y="45">태스크 활성화</text>
    <text x="600" y="103">이벤트 설정</text>
    <text x="600" y="161">callback 루틴 호출</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="202" y1="98" x2="238" y2="98" marker-end="url(#arrow)" />
    <line x1="342" y1="88" x2="378" y2="44" marker-end="url(#arrow)" />
    <line x1="342" y1="98" x2="378" y2="98" marker-end="url(#arrow)" />
    <line x1="342" y1="108" x2="378" y2="152" marker-end="url(#arrow)" />
    <line x1="482" y1="40" x2="518" y2="40" marker-end="url(#arrow)" />
    <line x1="482" y1="98" x2="518" y2="98" marker-end="url(#arrow)" />
    <line x1="482" y1="156" x2="518" y2="156" marker-end="url(#arrow)" />
  </g>
</svg>
