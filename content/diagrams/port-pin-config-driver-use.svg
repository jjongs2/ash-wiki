<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 640 244" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- Port Driver가 핀을 설정한다 -->
  <rect x="250" y="20" width="160" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="42" text-anchor="middle" fill="var(--text, #727981)">Port Driver</text>
  <line x1="330" y1="58" x2="330" y2="98" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="340" y="82" fill="var(--text, #727981)">설정 · 초기화</text>
  <rect x="20" y="100" width="620" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="122" text-anchor="middle" fill="var(--text, #727981)">포트와 port pin</text>

  <!-- 다른 드라이버가 핀을 쓴다 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="78" y1="178" x2="78" y2="138" />
    <line x1="204" y1="178" x2="204" y2="138" />
    <line x1="330" y1="178" x2="330" y2="138" />
    <line x1="456" y1="178" x2="456" y2="138" />
    <line x1="582" y1="178" x2="582" y2="138" />
  </g>
  <text x="88" y="162" fill="var(--text, #727981)">사용</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="180" width="116" height="64" rx="2" />
    <rect x="146" y="180" width="116" height="64" rx="2" />
    <rect x="272" y="180" width="116" height="64" rx="2" />
    <rect x="398" y="180" width="116" height="64" rx="2" />
    <rect x="524" y="180" width="116" height="64" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="78" y="202">DIO Driver</text>
    <text x="78" y="222">핀과 포트</text>
    <text x="204" y="202">ADC Driver</text>
    <text x="204" y="222">아날로그 입력 핀</text>
    <text x="204" y="237">외부 트리거 핀</text>
    <text x="330" y="202">PWM Driver</text>
    <text x="330" y="222">핀의 기능</text>
    <text x="456" y="202">ICU Driver</text>
    <text x="456" y="222">입력 핀</text>
    <text x="582" y="202">OCU Driver</text>
    <text x="582" y="222">출력 핀</text>
  </g>
</svg>
