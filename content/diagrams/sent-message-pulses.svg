<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 10 520 186.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 메시지의 부분 -->
  <rect x="59" y="20" width="143" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="130.5" y="45" text-anchor="middle" font-size="12" fill="var(--text, #727981)">동기·보정 펄스</text>
  <rect x="206" y="20" width="59" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="235.5" y="45" text-anchor="middle" font-size="12" fill="var(--text, #727981)">상태·통신</text>
  <rect x="269" y="20" width="98" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="318" y="37" text-anchor="middle" font-size="12" fill="var(--text, #727981)">데이터 니블</text>
  <text x="318" y="53" text-anchor="middle" font-size="12" fill="var(--text, #727981)">1~6개</text>
  <rect x="371" y="20" width="54" height="40" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="398" y="45" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CRC</text>
  <rect x="429.75" y="20.75" width="73.5" height="38.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="466.5" y="37" text-anchor="middle" font-size="12" fill="var(--text, #727981)">휴지 펄스</text>
  <text x="466.5" y="53" text-anchor="middle" font-size="12" fill="var(--text, #727981)">선택 사항</text>

  <!-- 하강 에지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="57" y1="64" x2="57" y2="144" />
    <line x1="204" y1="64" x2="204" y2="144" />
    <line x1="267" y1="64" x2="267" y2="144" />
    <line x1="330" y1="64" x2="330" y2="144" />
    <line x1="369" y1="64" x2="369" y2="144" />
    <line x1="427" y1="64" x2="427" y2="144" />
    <line x1="506" y1="64" x2="506" y2="144" />
  </g>
  <path d="M36 86 H57 V118 H70 V86 H204 V118 H217 V86 H267 V118 H280 V86 H330 V118 H343 V86 H369 V118 H382 V86 H427 V118 H440 V86 H506 V118 H519 V86 H536" stroke="var(--ink, #727981)" stroke-width="3" />

  <!-- 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="59" y1="136" x2="202" y2="136" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="206" y1="136" x2="265" y2="136" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <line x1="429" y1="136" x2="504" y2="136" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="130.5" y="156">56틱</text>
    <text x="235.5" y="156">12 + v틱</text>
    <text x="466.5" y="156">12틱 이상</text>
  </g>
  <text x="36" y="184" font-size="12" fill="var(--text, #727981)">니블 값 v는 하강 에지 사이의 간격 12 + v틱으로 싣는다. 12틱이 0, 27틱이 15다.</text>
</svg>
