<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 1 271.5 445" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none" aria-label="BQ7961x-Q1의 밸런싱 전류 경로">
