<svg xmlns="http://www.w3.org/2000/svg" viewBox="59.5 0.5 459.5 426.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="12" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
  </defs>

  <!-- 기준 경로 -->
  <text x="115" y="30" text-anchor="middle" fill="var(--text, #727981)">기준 경로</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="90" y1="130" x2="90" y2="230" />
    <line x1="90" y1="250" x2="90" y2="350" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="3" marker-end="url(#arrow-blue)">
    <line x1="90" y1="70" x2="90" y2="110" />
    <line x1="96.4" y1="127.7" x2="133.6" y2="172.3" />
    <line x1="133.6" y1="187.7" x2="96.4" y2="232.3" />
    <line x1="96.4" y1="247.7" x2="133.6" y2="292.3" />
    <line x1="133.6" y1="307.7" x2="96.4" y2="352.3" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="90" cy="60" r="10" />
    <circle cx="90" cy="120" r="10" />
    <circle cx="140" cy="180" r="10" />
    <circle cx="90" cy="240" r="10" />
    <circle cx="140" cy="300" r="10" />
    <circle cx="90" cy="360" r="10" />
  </g>

  <!-- 판정을 뒤집은 경로 (D1 뒤집기) -->
  <text x="285" y="30" text-anchor="middle" fill="var(--text, #727981)">판정을 뒤집은 경로</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="266.4" y1="127.7" x2="303.6" y2="172.3" />
    <line x1="303.6" y1="187.7" x2="266.4" y2="232.3" />
    <line x1="260" y1="250" x2="260" y2="350" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="3" marker-end="url(#arrow-blue)">
    <line x1="260" y1="70" x2="260" y2="110" />
    <line x1="260" y1="130" x2="260" y2="230" />
    <line x1="266.4" y1="247.7" x2="303.6" y2="292.3" />
    <line x1="303.6" y1="307.7" x2="266.4" y2="352.3" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="260" cy="60" r="10" />
    <circle cx="310" cy="180" r="10" />
    <circle cx="260" cy="240" r="10" />
    <circle cx="310" cy="300" r="10" />
    <circle cx="260" cy="360" r="10" />
  </g>
  <circle cx="260" cy="120" r="10" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <text x="244" y="124" text-anchor="end" fill="var(--text, #727981)">뒤집은 판정</text>

  <!-- 판정을 뒤집은 경로 (D2 뒤집기) -->
  <text x="455" y="30" text-anchor="middle" fill="var(--text, #727981)">판정을 뒤집은 경로</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="430" y1="130" x2="430" y2="230" />
    <line x1="436.4" y1="247.7" x2="473.6" y2="292.3" />
    <line x1="473.6" y1="307.7" x2="436.4" y2="352.3" />
  </g>
  <g stroke="var(--blue, #336fb8)" stroke-width="3" marker-end="url(#arrow-blue)">
    <line x1="430" y1="70" x2="430" y2="110" />
    <line x1="436.4" y1="127.7" x2="473.6" y2="172.3" />
    <line x1="473.6" y1="187.7" x2="436.4" y2="232.3" />
    <line x1="430" y1="250" x2="430" y2="350" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <circle cx="430" cy="60" r="10" />
    <circle cx="430" cy="120" r="10" />
    <circle cx="480" cy="180" r="10" />
    <circle cx="480" cy="300" r="10" />
    <circle cx="430" cy="360" r="10" />
  </g>
  <circle cx="430" cy="240" r="10" stroke="var(--orange, #b0540d)" stroke-width="1.5" fill="var(--orange-tint, #b0540d)" />
  <text x="414" y="244" text-anchor="end" fill="var(--text, #727981)">뒤집은 판정</text>

  <!-- 기본 경로 집합 -->
  <path d="M80 380 V388 H490 V380" stroke="var(--ink, #727981)" stroke-width="1" />
  <text x="285" y="406" text-anchor="middle" fill="var(--text, #727981)">기본 경로 집합</text>
</svg>
