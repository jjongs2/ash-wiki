<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 9.5 621 245.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 클래스 카테고리와 의존 -->
  <rect x="170" y="20" width="300" height="130" rx="4" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="184" y="42" fill="var(--text, #727981)">클래스 카테고리</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="64" width="100" height="40" rx="4" />
    <rect x="190" y="64" width="110" height="40" rx="4" />
    <rect x="340" y="64" width="110" height="40" rx="4" />
    <rect x="520" y="64" width="100" height="40" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="70" y="89">밖의 클래스</text>
    <text x="245" y="89">안의 클래스</text>
    <text x="395" y="89">안의 클래스</text>
    <text x="570" y="89">밖의 클래스</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="84" x2="188" y2="84" />
    <line x1="450" y1="84" x2="518" y2="84" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="154" y="76">의존</text>
    <text x="484" y="76">의존</text>
    <text x="70" y="126"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">a</tspan>에 셈</text>
    <text x="395" y="126"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan>에 셈</text>
  </g>

  <!-- I의 범위 -->
  <text x="320" y="186" text-anchor="middle" fill="var(--text, #727981)"><tspan font-style="italic">I</tspan> = <tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan> / (<tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">a</tspan> + <tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan>)</text>
  <line x1="120" y1="206" x2="520" y2="206" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M120 200 V212 M520 200 V212" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="120" y="228">0</text>
    <text x="120" y="244">가장 안정적</text>
    <text x="520" y="228">1</text>
    <text x="520" y="244">가장 불안정</text>
  </g>
</svg>
