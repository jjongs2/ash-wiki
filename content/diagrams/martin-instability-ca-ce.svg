<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 9.5 489 245.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 클래스 카테고리와 의존 -->
  <rect x="146" y="20" width="216" height="130" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="160" y="42" fill="var(--text, #727981)">클래스 카테고리</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="64" width="86" height="40" rx="2" />
    <rect x="160" y="64" width="86" height="40" rx="2" />
    <rect x="262" y="64" width="86" height="40" rx="2" />
    <rect x="402" y="64" width="86" height="40" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="63" y="89">밖의 클래스</text>
    <text x="203" y="89">안의 클래스</text>
    <text x="305" y="89">안의 클래스</text>
    <text x="445" y="89">밖의 클래스</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="106" y1="84" x2="158" y2="84" />
    <line x1="348" y1="84" x2="400" y2="84" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="126" y="76">의존</text>
    <text x="382" y="76">의존</text>
    <text x="63" y="126"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">a</tspan>에 셈</text>
    <text x="305" y="126"><tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan>에 셈</text>
  </g>

  <!-- I의 범위 -->
  <text x="254" y="186" text-anchor="middle" fill="var(--text, #727981)"><tspan font-style="italic">I</tspan> = <tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan> / (<tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">a</tspan> + <tspan font-style="italic">C</tspan><tspan baseline-shift="sub" font-size="10">e</tspan>)</text>
  <line x1="106" y1="206" x2="402" y2="206" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M106 200 V212 M402 200 V212" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="106" y="228">0</text>
    <text x="106" y="244">가장 안정적</text>
    <text x="402" y="228">1</text>
    <text x="402" y="244">가장 불안정</text>
  </g>
</svg>
