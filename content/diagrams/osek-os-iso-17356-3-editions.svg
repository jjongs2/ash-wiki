<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 214" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- OSEK/VDX OS 명세의 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">OSEK/VDX OS 명세</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="110" height="46" rx="4" fill="var(--surface, none)" />
    <rect x="170" y="40" width="110" height="46" rx="4" fill="var(--surface, none)" />
    <rect x="320" y="40" width="110" height="46" rx="4" fill="var(--surface, none)" />
    <rect x="520" y="40" width="110" height="46" rx="4" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="75" y="68">2.2</text>
    <text x="225" y="60">2.2.1</text>
    <text x="225" y="77" font-size="12">2003년</text>
    <text x="375" y="60">2.2.2</text>
    <text x="375" y="77" font-size="12">2004년</text>
    <text x="575" y="60">2.2.3</text>
    <text x="575" y="77" font-size="12">2005년</text>
  </g>

  <!-- ISO -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="20.75" y="148.75" width="408.5" height="44.5" rx="4" />
    <rect x="460.75" y="148.75" width="108.5" height="44.5" rx="4" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="225" y="176">ISO 표준화 과정</text>
    <text x="515" y="168">ISO 17356-3</text>
    <text x="515" y="185" font-size="12">2005년</text>
  </g>

  <!-- 판 사이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="132" y1="63" x2="168" y2="63" marker-end="url(#arrow)" />
    <line x1="282" y1="63" x2="318" y2="63" marker-end="url(#arrow)" />
    <line x1="432" y1="63" x2="518" y2="63" marker-end="url(#arrow)" />
    <line x1="75" y1="88" x2="75" y2="146" marker-end="url(#arrow)" />
    <line x1="432" y1="171" x2="458" y2="171" marker-end="url(#arrow)" />
  </g>

  <!-- 편집상 변경 반영 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="225" y1="146" x2="225" y2="88" marker-end="url(#arrow)" />
    <line x1="375" y1="146" x2="375" y2="88" marker-end="url(#arrow)" />
    <line x1="530" y1="146" x2="560" y2="88" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="83" y="122">바탕</text>
    <text x="300" y="122" text-anchor="middle">편집상 변경 반영</text>
    <text x="554" y="122">편집상 변경 반영</text>
  </g>
</svg>
