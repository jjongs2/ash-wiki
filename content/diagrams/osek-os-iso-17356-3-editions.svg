<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0.5 528 214" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="OSEK/VDX OS 명세의 판과 ISO 17356-3">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- OSEK/VDX OS 명세의 판 -->
  <text x="20" y="30" font-size="12" fill="var(--text, #727981)">OSEK/VDX OS 명세</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20" y="40" width="88" height="46" rx="2" fill="var(--surface, none)" />
    <rect x="140" y="40" width="88" height="46" rx="2" fill="var(--surface, none)" />
    <rect x="260" y="40" width="88" height="46" rx="2" fill="var(--surface, none)" />
    <rect x="420" y="40" width="88" height="46" rx="2" fill="var(--surface, none)" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="64" y="68">2.2</text>
    <text x="184" y="60">2.2.1</text>
    <text x="184" y="77" font-size="12">2003년</text>
    <text x="304" y="60">2.2.2</text>
    <text x="304" y="77" font-size="12">2004년</text>
    <text x="464" y="60">2.2.3</text>
    <text x="464" y="77" font-size="12">2005년</text>
  </g>

  <!-- ISO -->
  <g fill="var(--green-tint, #337b47)" stroke="var(--green, #337b47)" stroke-width="1.5">
    <rect x="20.75" y="148.75" width="326.5" height="44.5" rx="2" />
    <rect x="372.75" y="148.75" width="94.5" height="44.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="184" y="176">ISO 표준화 과정</text>
    <text x="420" y="168">ISO 17356-3</text>
    <text x="420" y="185" font-size="12">2005년</text>
  </g>

  <!-- 판 사이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="63" x2="138" y2="63" marker-end="url(#arrow)" />
    <line x1="230" y1="63" x2="258" y2="63" marker-end="url(#arrow)" />
    <line x1="350" y1="63" x2="418" y2="63" marker-end="url(#arrow)" />
    <line x1="64" y1="88" x2="64" y2="146" marker-end="url(#arrow)" />
    <line x1="350" y1="171" x2="370" y2="171" marker-end="url(#arrow)" />
  </g>

  <!-- 편집상 변경 반영 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="184" y1="146" x2="184" y2="88" marker-end="url(#arrow)" />
    <line x1="304" y1="146" x2="304" y2="88" marker-end="url(#arrow)" />
    <line x1="428" y1="146" x2="452" y2="88" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="72" y="122">바탕</text>
    <text x="244" y="122" text-anchor="middle">편집상 변경 반영</text>
    <text x="452" y="114">편집상</text>
    <text x="452" y="130">변경 반영</text>
  </g>
</svg>
