<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -9 540 295" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="20">한 슬롯</text>
    <text x="430" y="20">다른 슬롯</text>
  </g>

  <!-- 한 슬롯 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="40" y="32" width="220" height="36" rx="2" />
    <rect x="40" y="230" width="220" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="150" y="55">동작 중인 이미지</text>
    <text x="150" y="253">이전 이미지로 롤백</text>
  </g>

  <!-- 다른 슬롯 -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="320" y="32" width="220" height="36" rx="2" />
    <rect x="320" y="120" width="220" height="36" rx="2" />
    <rect x="320" y="230" width="220" height="36" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--on-fill, #f8fafd)">
    <text x="430" y="55">새 이미지 쓰기</text>
    <text x="430" y="143">확인 대기로 부팅</text>
    <text x="430" y="253">유효 표시, 확정</text>
  </g>

  <!-- 이전 이미지가 남은 슬롯 -->
  <line x1="100" y1="70" x2="100" y2="228" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="108" y="100" font-size="12" fill="var(--text, #727981)">이전 이미지가 남음</text>

  <!-- 전환 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="430" y1="70" x2="430" y2="118" marker-end="url(#arrow)" />
    <line x1="430" y1="158" x2="430" y2="228" marker-end="url(#arrow)" />
    <path d="M318 138 H150 V228" marker-end="url(#arrow)" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="438" y="98">재부팅</text>
    <text x="438" y="197">점검 통과</text>
    <text x="234" y="160" text-anchor="middle">점검 실패</text>
  </g>
</svg>
