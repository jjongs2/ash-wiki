<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 28 700 154" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- A와 B가 믿는 관계 -->
  <path d="M80 98 V56 H640 V98" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)" />
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="var(--text, #727981)">A와 B는 서로를 받아들임</text>

  <!-- 당사자와 공격자 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="100" width="120" height="32" rx="4" />
    <rect x="580" y="100" width="120" height="32" rx="4" />
  </g>
  <rect x="300" y="100" width="120" height="32" rx="4" stroke="var(--red, #bb464d)" stroke-width="1.5" fill="var(--red-tint, #bb464d)" />
  <g text-anchor="middle">
    <text x="80" y="121" fill="var(--text, #727981)">A</text>
    <text x="360" y="121" fill="var(--on-fill, #f8fafd)">공격자</text>
    <text x="640" y="121" fill="var(--text, #727981)">B</text>
  </g>

  <!-- 실제로 나눈 키 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-start="url(#arrow-ink)" marker-end="url(#arrow-ink)">
    <line x1="142" y1="116" x2="298" y2="116" />
    <line x1="422" y1="116" x2="578" y2="116" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="220" y="108">키 K<tspan dy="4" font-size="10">A</tspan></text>
    <text x="500" y="108">키 K<tspan dy="4" font-size="10">B</tspan></text>
  </g>

  <!-- 중계 -->
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="360" y="156">한 키로 복호한 메시지를</text>
    <text x="360" y="172">다른 키로 다시 암호화해 넘김</text>
  </g>
</svg>
