<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.5 -35.5 561 386" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 판 -->
  <text x="324" y="-6" text-anchor="middle" font-size="13" fill="var(--text, #727981)">ASPICE 4.1</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 지표의 두 종류 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="174" y="26" font-size="13">프로세스 수행 지표</text>
    <text x="174" y="44">프로세스마다 다름, CL 1</text>
    <text x="474" y="26" font-size="13">프로세스 능력 지표</text>
    <text x="474" y="44">모든 프로세스에 공통, CL 1~CL 5</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="70" y="60" width="80" height="32" rx="2" />
    <rect x="162" y="60" width="116" height="32" rx="2" />
    <rect x="380" y="60" width="80" height="32" rx="2" />
    <rect x="472" y="60" width="96" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="110" y="80">BP</text>
    <text x="220" y="80">출력 정보 항목</text>
    <text x="420" y="80">GP</text>
    <text x="520" y="80">정보 항목</text>
  </g>

  <!-- 지표가 가리키는 것 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M110 92 V108 M220 92 V108 M110 108 H220" />
    <path d="M420 92 V108 M520 92 V108 M420 108 H520" />
    <line x1="174" y1="108" x2="174" y2="134" marker-end="url(#arrow)" />
    <line x1="474" y1="108" x2="474" y2="134" marker-end="url(#arrow)" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="104" y="136" width="140" height="44" rx="2" />
    <rect x="399" y="136" width="150" height="44" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="174" y="154">프로세스 성과</text>
    <text x="174" y="170" font-size="11">프로세스 참조 모델에서</text>
    <text x="474" y="162">프로세스 속성 달성</text>
  </g>

  <!-- 프로세스 속성 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="174" y1="180" x2="174" y2="218" />
    <line x1="474" y1="180" x2="474" y2="218" />
  </g>
  <text x="184" y="203" fill="var(--text, #727981)">R1: 성과 판정을 모아 평정</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="134" y="220" width="80" height="32" rx="2" />
    <rect x="414" y="220" width="120" height="32" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="174" y="240">PA 1.1</text>
    <text x="474" y="240">PA 2.1~PA 5.2</text>
  </g>

  <!-- PA 1.1의 편집상 GP는 수행 지표를 가리킨다 -->
  <path d="M134 236 H48 V76 H68" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="91" y="230" text-anchor="middle" fill="var(--text, #727981)">GP 1.1.1</text>

  <!-- 능력 수준 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M174 252 V272 H474 M474 252 V272" />
    <line x1="324" y1="272" x2="324" y2="296" marker-end="url(#arrow)" />
  </g>
  <text x="334" y="290" fill="var(--text, #727981)">속성 등급으로 정함</text>
  <rect x="244" y="298" width="160" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="324" y="318" text-anchor="middle" fill="var(--text, #727981)">능력 수준 CL 0~CL 5</text>
</svg>
