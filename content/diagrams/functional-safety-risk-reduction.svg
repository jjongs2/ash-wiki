<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 22.5 648.5 188.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="12" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 리스크 축 -->
  <line x1="50" y1="150" x2="572" y2="150" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="584" y="154" fill="var(--text, #727981)">리스크</text>
  <line x1="50" y1="144" x2="50" y2="156" stroke="var(--ink, #727981)" stroke-width="1" />

  <!-- 허용 리스크 -->
  <line x1="320" y1="62" x2="320" y2="150" stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3" />
  <text x="320" y="52" text-anchor="middle" fill="var(--text, #727981)">허용 리스크</text>

  <!-- 리스크 감소 -->
  <path d="M520 144 V118 H290 V140" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="425" y="92">리스크 감소</text>
    <text x="425" y="108">기능 안전: 안전 메커니즘 작동</text>
  </g>

  <!-- 점 -->
  <circle cx="290" cy="150" r="4" fill="var(--ink, #727981)" />
  <circle cx="520" cy="150" r="4" fill="var(--ink, #727981)" />

  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="50" y="174">0</text>
    <text x="50" y="190">0으로 만들 수 없음</text>
    <text x="290" y="174">잔여 리스크</text>
    <text x="520" y="174">리스크 감소 조치 전</text>
  </g>
</svg>
