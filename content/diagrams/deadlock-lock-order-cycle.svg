<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 -7.5 544 212.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <rect x="40" y="60" width="120" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="100" y="87" text-anchor="middle" fill="var(--text, #727981)">태스크 A</text>
  <rect x="440" y="60" width="120" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="500" y="87" text-anchor="middle" fill="var(--text, #727981)">태스크 B</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M130 58 Q300 -10 470 58" />
    <path d="M470 106 Q300 174 130 106" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="300" y="14">B가 쥔 L2</text>
    <text x="300" y="160">A가 쥔 L1</text>
  </g>
  <text x="300" y="87" text-anchor="middle" fill="var(--text, #727981)">서로를 기다리며 멈춘다</text>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="var(--text, #727981)">화살표: 기다리는 태스크 → 락을 쥔 태스크</text>
</svg>
