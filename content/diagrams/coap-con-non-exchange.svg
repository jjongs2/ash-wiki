<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.5 0.5 386.5 549.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CON 메시지 재전송과 확인 응답 없는 NON 메시지">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- CON 메시지 -->
  <text x="220" y="20" text-anchor="middle" font-size="12" fill="var(--text, #727981)">CON 메시지</text>
  <rect x="50" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="110" y="53" text-anchor="middle" fill="var(--text, #727981)">송신자</text>
  <rect x="270" y="32" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="53" text-anchor="middle" fill="var(--text, #727981)">수신자</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="64" x2="110" y2="350" />
    <line x1="330" y1="64" x2="330" y2="350" />
  </g>

  <!-- 잃은 CON 두 번 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="112" y1="96" x2="220" y2="102" />
    <path d="M216 96 L228 108 M216 108 L228 96" />
    <line x1="112" y1="156" x2="220" y2="162" />
    <path d="M216 156 L228 168 M216 168 L228 156" />
  </g>
  <text x="166" y="88" text-anchor="middle" fill="var(--text, #727981)">CON</text>
  <text x="166" y="148" text-anchor="middle" fill="var(--text, #727981)">CON</text>

  <!-- 재전송 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M100 96 H94 V152 H100" />
    <path d="M100 160 H94 V276 H100" />
  </g>
  <text x="88" y="130" text-anchor="end" font-size="12" fill="var(--text, #727981)">기본 타임아웃</text>
  <text x="88" y="220" text-anchor="end" font-size="12" fill="var(--text, #727981)">지수 백오프</text>

  <!-- 닿은 CON과 ACK -->
  <line x1="112" y1="276" x2="328" y2="290" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="220" y="270" text-anchor="middle" fill="var(--text, #727981)">CON</text>
  <line x1="328" y1="322" x2="112" y2="336" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="220" y="316" text-anchor="middle" fill="var(--text, #727981)">ACK (같은 Message ID)</text>

  <!-- NON 메시지 -->
  <text x="220" y="380" text-anchor="middle" font-size="12" fill="var(--text, #727981)">NON 메시지</text>
  <rect x="50" y="392" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="110" y="413" text-anchor="middle" fill="var(--text, #727981)">송신자</text>
  <rect x="270" y="392" width="120" height="32" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="413" text-anchor="middle" fill="var(--text, #727981)">수신자</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="110" y1="424" x2="110" y2="540" />
    <line x1="330" y1="424" x2="330" y2="540" />
  </g>
  <line x1="112" y1="456" x2="328" y2="470" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="220" y="450" text-anchor="middle" fill="var(--text, #727981)">NON</text>
  <text x="220" y="506" text-anchor="middle" font-size="12" fill="var(--text, #727981)">확인 응답 없음</text>
</svg>
