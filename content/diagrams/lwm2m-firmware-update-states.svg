<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 500 194" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 상태 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="20" width="140" height="44" rx="4" />
    <rect x="360" y="20" width="140" height="44" rx="4" />
    <rect x="360" y="150" width="140" height="44" rx="4" />
    <rect x="20" y="150" width="140" height="44" rx="4" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="90" y="40">Idle</text>
    <text x="430" y="40">Downloading</text>
    <text x="430" y="170">Downloaded</text>
    <text x="90" y="170">Updating</text>
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle" font-size="12">
    <text x="90" y="56">State 0</text>
    <text x="430" y="56">State 1</text>
    <text x="430" y="186">State 2</text>
    <text x="90" y="186">State 3</text>
  </g>

  <!-- 전이 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)">
    <line x1="160" y1="42" x2="358" y2="42" />
    <line x1="430" y1="64" x2="430" y2="148" />
    <line x1="360" y1="172" x2="162" y2="172" />
    <line x1="90" y1="150" x2="90" y2="66" />
  </g>
  <g fill="var(--text, #727981)" font-size="12">
    <text x="260" y="34" text-anchor="middle">Package나 Package URI에 씀</text>
    <text x="438" y="111">다 받음</text>
    <text x="260" y="164" text-anchor="middle">Update 실행</text>
    <text x="98" y="111">업데이트 성공</text>
  </g>
</svg>
