<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 534 162" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="CAM의 header와 container">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- container 묶음 -->
  <text x="302" y="30" text-anchor="middle" font-size="12" fill="var(--text, #727981)">container</text>
  <path d="M90 46 V40 H514 V46" stroke="var(--ink, #727981)" stroke-width="1.5" />

  <!-- 메시지: header 뒤에 container. 점선은 넣지 않을 수도 있는 container -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20.75" y="52.75" width="62.5" height="46.5" rx="2" />
    <rect x="90.75" y="52.75" width="78.5" height="46.5" rx="2" />
    <rect x="176.75" y="52.75" width="78.5" height="46.5" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)">
    <rect x="262.75" y="52.75" width="78.5" height="46.5" rx="2" />
    <rect x="348.75" y="52.75" width="78.5" height="46.5" rx="2" />
    <rect x="434.75" y="52.75" width="78.5" height="46.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="52" y="81">header</text>
    <text x="130" y="81">basic</text>
    <text x="216" y="72">high</text>
    <text x="216" y="90">frequency</text>
    <text x="302" y="72">low</text>
    <text x="302" y="90">frequency</text>
    <text x="388" y="72">special</text>
    <text x="388" y="90">vehicle</text>
    <text x="474" y="81">extension</text>
  </g>

  <!-- 넣는 CAM -->
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="130" y="122">모든 CAM</text>
    <text x="216" y="122">모든 CAM</text>
    <text x="302" y="122">차량 CAM만</text>
    <text x="388" y="122">특정 역할을</text>
    <text x="388" y="138">맡은 차량</text>
    <text x="474" y="122">차량 CAM,</text>
    <text x="474" y="138">Release 2</text>
  </g>
</svg>
