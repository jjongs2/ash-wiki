<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 684 253" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 열 이름 -->
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="28">RTE 이벤트</text>
    <text x="300" y="28">runnable</text>
    <text x="414" y="28" font-size="12">RteEventToTaskMapping</text>
    <text x="564" y="28">태스크</text>
  </g>

  <!-- RTE 이벤트와 runnable -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="50.75" width="188.5" height="34.5" rx="2" />
    <rect x="20.75" y="100.75" width="188.5" height="34.5" rx="2" />
    <rect x="20.75" y="188.75" width="188.5" height="34.5" rx="2" />
    <rect x="250.75" y="50.75" width="98.5" height="34.5" rx="2" />
    <rect x="250.75" y="100.75" width="98.5" height="34.5" rx="2" />
    <rect x="250.75" y="188.75" width="98.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="115" y="73">TimingEvent</text>
    <text x="115" y="123">DataReceivedEvent</text>
    <text x="115" y="211">OperationInvokedEvent</text>
    <text x="300" y="73">runnable 1</text>
    <text x="300" y="123">runnable 2</text>
    <text x="300" y="211">runnable 3</text>
  </g>

  <!-- 태스크 -->
  <rect x="464.75" y="40.75" width="198.5" height="104.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="480.75" y="54.75" width="158.5" height="26.5" rx="2" />
    <rect x="480.75" y="104.75" width="158.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="560" y="73">runnable 1 호출</text>
    <text x="560" y="123">runnable 2 호출</text>
  </g>
  <text x="560" y="164" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RtePositionInTask 순서</text>

  <!-- 태스크에 매핑하지 않은 runnable -->
  <rect x="480.75" y="182.75" width="158.5" height="46.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="560" y="202">직접 함수 호출이나</text>
    <text x="560" y="219">trusted function call</text>
    <text x="414" y="199">태스크 없음</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="211" y1="68" x2="248" y2="68" />
    <line x1="211" y1="118" x2="248" y2="118" />
    <line x1="211" y1="206" x2="248" y2="206" />
    <line x1="351" y1="68" x2="478" y2="68" />
    <line x1="351" y1="118" x2="478" y2="118" />
    <line x1="351" y1="206" x2="478" y2="206" />
    <line x1="652" y1="58" x2="652" y2="130" />
  </g>
</svg>
