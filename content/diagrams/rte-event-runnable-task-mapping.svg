<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 261" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- RTE 이벤트 -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="20.75" y="20.75" width="150.5" height="34.5" rx="2" />
    <rect x="182.75" y="20.75" width="150.5" height="34.5" rx="2" />
    <rect x="344.75" y="20.75" width="150.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" font-size="13" fill="var(--text, #727981)">
    <text x="96" y="43">TimingEvent</text>
    <text x="258" y="43">DataReceivedEvent</text>
    <text x="420" y="43">OperationInvokedEvent</text>
  </g>

  <!-- runnable -->
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="51.75" y="84.75" width="88.5" height="34.5" rx="2" />
    <rect x="213.75" y="84.75" width="88.5" height="34.5" rx="2" />
    <rect x="375.75" y="84.75" width="88.5" height="34.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="96" y="107">runnable 1</text>
    <text x="258" y="107">runnable 2</text>
    <text x="420" y="107">runnable 3</text>
  </g>

  <!-- 태스크 -->
  <rect x="20.75" y="156.75" width="312.5" height="83.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="34" y="176" fill="var(--text, #727981)">태스크</text>
  <g fill="var(--surface, none)" stroke="var(--ink, #727981)" stroke-width="1.5">
    <rect x="30.75" y="186.75" width="130.5" height="26.5" rx="2" />
    <rect x="192.75" y="186.75" width="130.5" height="26.5" rx="2" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="96" y="205">runnable 1 호출</text>
    <text x="258" y="205">runnable 2 호출</text>
  </g>
  <text x="177" y="232" text-anchor="middle" font-size="12" fill="var(--text, #727981)">RtePositionInTask 순서</text>

  <!-- 태스크에 매핑하지 않은 runnable -->
  <rect x="344.75" y="186.75" width="150.5" height="46.5" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="420" y="206">직접 함수 호출이나</text>
    <text x="420" y="223">trusted function call</text>
  </g>

  <!-- 매핑 -->
  <g font-size="12" fill="var(--text, #727981)">
    <text x="177" y="148" text-anchor="middle">RteEventToTaskMapping</text>
    <text x="428" y="150">태스크 없음</text>
  </g>

  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="96" y1="57" x2="96" y2="82" />
    <line x1="258" y1="57" x2="258" y2="82" />
    <line x1="420" y1="57" x2="420" y2="82" />
    <line x1="96" y1="121" x2="96" y2="184" />
    <line x1="258" y1="121" x2="258" y2="184" />
    <line x1="420" y1="121" x2="420" y2="184" />
    <line x1="163" y1="200" x2="190" y2="200" />
  </g>
</svg>
