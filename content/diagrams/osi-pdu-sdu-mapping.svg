<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 10 479.75 196.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- (N) 계층 -->
  <text x="86" y="43" text-anchor="end" fill="var(--text, #727981)">(N) 계층</text>
  <rect x="244.75" y="20.75" width="126.5" height="34.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="308" y="42" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">(N) 프로토콜 제어 정보</text>
  <rect x="372" y="20" width="112" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="428" y="42" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(N) 사용자 데이터</text>
  <path d="M244 62 V68 H484 V62" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="364" y="86" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(N) PDU</text>

  <!-- (N) PDU가 (N−1) SDU 하나에 대응 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="244" y1="70" x2="244" y2="126" />
    <line x1="484" y1="70" x2="484" y2="126" />
  </g>

  <!-- (N−1) 계층 -->
  <text x="86" y="151" text-anchor="end" fill="var(--text, #727981)">(N−1) 계층</text>
  <rect x="100.75" y="128.75" width="142.5" height="34.5" fill="var(--orange-tint, #b0540d)" stroke="var(--orange, #b0540d)" stroke-width="1.5" />
  <text x="172" y="150" text-anchor="middle" font-size="12" fill="var(--on-fill, #f8fafd)">(N−1) 프로토콜 제어 정보</text>
  <rect x="244" y="128" width="240" height="36" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="364" y="150" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(N−1) SDU</text>
  <path d="M100 170 V176 H484 V170" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="292" y="194" text-anchor="middle" font-size="12" fill="var(--text, #727981)">(N−1) PDU</text>
</svg>
