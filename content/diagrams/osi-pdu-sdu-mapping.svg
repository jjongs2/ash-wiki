<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 10 615.5 196.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <!-- (N) 계층 -->
  <text x="86" y="43" text-anchor="end" fill="#727981">(N) 계층</text>
  <rect x="270" y="20" width="150" height="36" fill="#b0540d" />
  <text x="345" y="42" text-anchor="middle" font-size="12" fill="#f8fafd">(N) 프로토콜 제어 정보</text>
  <rect x="420" y="20" width="200" height="36" fill="#336fb8" />
  <text x="520" y="42" text-anchor="middle" font-size="12" fill="#f8fafd">(N) 사용자 데이터</text>
  <path d="M270 62 V68 H620 V62" stroke="#727981" stroke-width="1.5" />
  <text x="445" y="86" text-anchor="middle" font-size="12" fill="#727981">(N) PDU</text>

  <!-- (N) PDU가 (N−1) SDU 하나에 대응 -->
  <g stroke="#727981" stroke-width="1" stroke-dasharray="4 4">
    <line x1="270" y1="70" x2="270" y2="126" />
    <line x1="620" y1="70" x2="620" y2="126" />
  </g>

  <!-- (N−1) 계층 -->
  <text x="86" y="151" text-anchor="end" fill="#727981">(N−1) 계층</text>
  <rect x="100" y="128" width="170" height="36" fill="#b0540d" />
  <text x="185" y="150" text-anchor="middle" font-size="12" fill="#f8fafd">(N−1) 프로토콜 제어 정보</text>
  <rect x="270" y="128" width="350" height="36" fill="#336fb8" />
  <text x="445" y="150" text-anchor="middle" font-size="12" fill="#f8fafd">(N−1) SDU</text>
  <path d="M100 170 V176 H620 V170" stroke="#727981" stroke-width="1.5" />
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#727981">(N−1) PDU</text>
</svg>
