<svg xmlns="http://www.w3.org/2000/svg" viewBox="68 8 484 404" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--blue, #336fb8)" />
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 두 쪽 -->
  <rect x="80" y="20" width="120" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="140" y="43" text-anchor="middle" fill="var(--text, #727981)">진단 장비</text>
  <rect x="400" y="20" width="140" height="36" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="470" y="43" text-anchor="middle" fill="var(--text, #727981)">AUTOSAR DoIP 모듈</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="140" y1="56" x2="140" y2="400" />
    <line x1="470" y1="56" x2="470" y2="400" />
  </g>

  <!-- UDP: 차량 식별 -->
  <line x1="142" y1="84" x2="468" y2="100" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="305" y="84" text-anchor="middle" font-size="12" fill="var(--text, #727981)">차량 식별 요청 (0x0001)</text>
  <line x1="468" y1="128" x2="142" y2="144" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="305" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">차량 식별 응답·차량 알림 (0x0004)</text>

  <!-- TCP: 라우팅 활성화 -->
  <line x1="142" y1="186" x2="468" y2="202" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="305" y="186" text-anchor="middle" font-size="12" fill="var(--text, #727981)">라우팅 활성화 요청 (0x0005)</text>
  <line x1="468" y1="230" x2="142" y2="246" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="305" y="230" text-anchor="middle" font-size="12" fill="var(--text, #727981)">라우팅 활성화 응답 (0x0006), 응답 코드 0x10</text>

  <!-- TCP: 진단 메시지 -->
  <line x1="142" y1="274" x2="468" y2="290" stroke="var(--blue, #336fb8)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="305" y="274" text-anchor="middle" font-size="12" fill="var(--text, #727981)">진단 메시지 (0x8001)</text>
  <line x1="468" y1="318" x2="142" y2="334" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="305" y="318" text-anchor="middle" font-size="12" fill="var(--text, #727981)">진단 메시지 긍정 확인 (0x8002)</text>
  <line x1="468" y1="362" x2="142" y2="378" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-ink)" />
  <text x="305" y="362" text-anchor="middle" font-size="12" fill="var(--text, #727981)">진단 메시지 (0x8001)</text>

  <!-- 전송 프로토콜 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <path d="M124 76 H116 V148 H124" />
    <path d="M124 178 H116 V382 H124" />
  </g>
  <text x="108" y="116" text-anchor="end" font-size="12" fill="var(--text, #727981)">UDP</text>
  <text x="108" y="284" text-anchor="end" font-size="12" fill="var(--text, #727981)">TCP</text>
</svg>
