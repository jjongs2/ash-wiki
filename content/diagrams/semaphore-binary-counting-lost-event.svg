<svg xmlns="http://www.w3.org/2000/svg" viewBox="22.5 -3.5 592 226.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 인터럽트와 가져감 시점 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" stroke-dasharray="3 3">
    <line x1="160" y1="24" x2="160" y2="198" />
    <line x1="280" y1="24" x2="280" y2="198" />
    <line x1="400" y1="24" x2="400" y2="198" />
    <line x1="180" y1="34" x2="180" y2="198" />
    <line x1="480" y1="34" x2="480" y2="198" />
  </g>
  <g text-anchor="middle" font-size="12" fill="var(--text, #727981)">
    <text x="160" y="18">첫 인터럽트</text>
    <text x="280" y="18">두 번째 인터럽트</text>
    <text x="400" y="18">세 번째 인터럽트</text>
  </g>
  <text x="110" y="18" text-anchor="end" font-size="12" fill="var(--text, #727981)">FreeRTOS</text>

  <!-- 태스크 -->
  <text x="110" y="53" text-anchor="end" fill="var(--text, #727981)">태스크</text>
  <rect x="120.75" y="34.75" width="38.5" height="26.5" stroke="var(--ink, #727981)" stroke-width="1.5" stroke-dasharray="5 4" fill="var(--surface, none)" />
  <text x="140" y="53" text-anchor="middle" fill="var(--text, #727981)">대기</text>
  <rect x="180" y="34" width="300" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="330" y="53" text-anchor="middle" fill="var(--text, #727981)">앞 사건 처리</text>
  <rect x="480" y="34" width="80" height="28" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="520" y="53" text-anchor="middle" fill="var(--text, #727981)">다음 사건</text>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="185" y="78">가져감</text>
    <text x="485" y="78">가져감</text>
  </g>

  <!-- 세마포어 값 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="120" y="90" width="40" height="28" />
    <rect x="160" y="90" width="20" height="28" />
    <rect x="180" y="90" width="100" height="28" />
    <rect x="280" y="90" width="120" height="28" />
    <rect x="400" y="90" width="80" height="28" />
    <rect x="480" y="90" width="80" height="28" />
    <rect x="120" y="160" width="40" height="28" />
    <rect x="160" y="160" width="20" height="28" />
    <rect x="180" y="160" width="100" height="28" />
    <rect x="280" y="160" width="120" height="28" />
    <rect x="400" y="160" width="80" height="28" />
    <rect x="480" y="160" width="80" height="28" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="140" y="109">0</text>
    <text x="170" y="109">1</text>
    <text x="230" y="109">0</text>
    <text x="340" y="109">1</text>
    <text x="440" y="109">1</text>
    <text x="520" y="109">0</text>
    <text x="140" y="179">0</text>
    <text x="170" y="179">1</text>
    <text x="230" y="179">0</text>
    <text x="340" y="179">1</text>
    <text x="440" y="179">2</text>
    <text x="520" y="179">1</text>
  </g>
  <text x="110" y="109" text-anchor="end" fill="var(--text, #727981)">이진 세마포어</text>
  <text x="110" y="179" text-anchor="end" fill="var(--text, #727981)">계수 세마포어</text>

  <!-- 잃은 사건 -->
  <line x1="400" y1="84" x2="400" y2="124" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="406" y="134" font-size="12" fill="var(--text, #727981)">이미 주어져</text>
  <text x="406" y="149" font-size="12" fill="var(--text, #727981)">줄 수 없음</text>

  <!-- 시간 -->
  <line x1="120" y1="204" x2="574" y2="204" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="582" y="208" font-size="12" fill="var(--text, #727981)">시간</text>
</svg>
