<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 -1 721 191.5" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="14" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>
  <text x="20" y="18" font-size="12" fill="var(--text, #727981)">ISO/SAE 21434:2021</text>

  <!-- 공격에서 피해까지 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="36" width="130" height="44" rx="2" />
    <rect x="200" y="36" width="130" height="44" rx="2" />
    <rect x="380" y="36" width="160" height="44" rx="2" />
    <rect x="590" y="36" width="130" height="44" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="85" y="63">attack path</text>
    <text x="265" y="63">위협 시나리오</text>
    <text x="460" y="55">자산</text>
    <text x="460" y="72" font-size="12">사이버보안 속성</text>
    <text x="655" y="63">damage scenario</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="58" x2="198" y2="58" />
    <line x1="330" y1="58" x2="378" y2="58" />
    <line x1="540" y1="58" x2="588" y2="58" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="175" y="50">실현</text>
    <text x="355" y="50">침해</text>
    <text x="565" y="50">이어짐</text>
  </g>

  <!-- 리스크 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="20" y="136" width="130" height="44" rx="2" />
    <rect x="315" y="136" width="110" height="44" rx="2" />
    <rect x="590" y="136" width="130" height="44" rx="2" />
  </g>
  <g fill="var(--text, #727981)" text-anchor="middle">
    <text x="85" y="163">attack feasibility</text>
    <text x="370" y="163">risk</text>
    <text x="655" y="163">impact</text>
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="85" y1="80" x2="85" y2="134" />
    <line x1="655" y1="80" x2="655" y2="134" />
    <line x1="150" y1="158" x2="313" y2="158" />
    <line x1="590" y1="158" x2="427" y2="158" />
  </g>
  <g font-size="12" fill="var(--text, #727981)">
    <text x="95" y="112">attack path의 속성</text>
    <text x="645" y="112" text-anchor="end">크기 추정</text>
  </g>
</svg>
