<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 552 360" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="targets 역할의 위임과 다시 위임">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>

  <!-- 역할이 신뢰를 맡는 범위 -->
  <rect x="40" y="30" width="512" height="230" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="196" y="66" width="340" height="180" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <rect x="346" y="102" width="178" height="130" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g font-size="12" fill="var(--text, #727981)">
    <text x="54" y="52">targets: 대상 전부</text>
    <text x="210" y="88">위임받은 역할: 일부</text>
    <text x="358" y="124">다시 위임받은 역할: 그 일부</text>
  </g>

  <!-- 대상 파일 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="60" y="80" width="24" height="24" rx="2" />
    <rect x="104" y="80" width="24" height="24" rx="2" />
    <rect x="148" y="80" width="24" height="24" rx="2" />
    <rect x="60" y="124" width="24" height="24" rx="2" />
    <rect x="104" y="124" width="24" height="24" rx="2" />
    <rect x="40" y="326" width="24" height="24" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="212" y="108" width="24" height="24" rx="2" />
    <rect x="256" y="108" width="24" height="24" rx="2" />
    <rect x="300" y="108" width="24" height="24" rx="2" />
    <rect x="212" y="152" width="24" height="24" rx="2" />
    <rect x="256" y="152" width="24" height="24" rx="2" />
  </g>
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="366" y="144" width="24" height="24" rx="2" />
    <rect x="410" y="144" width="24" height="24" rx="2" />
    <rect x="454" y="144" width="24" height="24" rx="2" />
    <rect x="366" y="188" width="24" height="24" rx="2" />
    <rect x="410" y="188" width="24" height="24" rx="2" />
  </g>

  <g font-size="12" fill="var(--text, #727981)">
    <text x="40" y="290">역할마다 다른 키를 쓰면 한 역할의 키가 넘어가도</text>
    <text x="40" y="306">공격자가 할 수 있는 공격은 그 역할이 맡은 일로 줄어든다</text>
    <text x="74" y="343">대상 파일</text>
  </g>
</svg>
