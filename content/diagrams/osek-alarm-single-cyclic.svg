<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 6.5 660.5 196.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="단일 알람과 주기 알람">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- 행 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="50">단일 알람</text>
    <text x="20" y="67" font-size="12">주기 0</text>
    <text x="20" y="140">주기 알람</text>
    <text x="20" y="157" font-size="12">주기가 0이 아님</text>
  </g>

  <!-- 시간축 -->
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="150" y1="56" x2="640" y2="56" marker-end="url(#arrow)" />
    <line x1="150" y1="146" x2="640" y2="146" marker-end="url(#arrow)" />
    <line x1="170" y1="46" x2="170" y2="66" />
    <line x1="170" y1="136" x2="170" y2="156" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="170" y="36">SetRelAlarm</text>
    <text x="170" y="126">SetRelAlarm</text>
    <text x="330" y="36">만료</text>
    <text x="330" y="126">만료</text>
    <text x="450" y="126">만료</text>
    <text x="570" y="126">만료</text>
  </g>

  <!-- 만료 -->
  <g fill="var(--orange, #b0540d)">
    <circle cx="330" cy="56" r="6" />
    <circle cx="330" cy="146" r="6" />
    <circle cx="450" cy="146" r="6" />
    <circle cx="570" cy="146" r="6" />
  </g>

  <!-- 간격 -->
  <g stroke="var(--ink, #727981)" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)">
    <line x1="171" y1="76" x2="329" y2="76" />
    <line x1="171" y1="166" x2="329" y2="166" />
    <line x1="331" y1="166" x2="449" y2="166" />
    <line x1="451" y1="166" x2="569" y2="166" />
  </g>
  <g font-size="12" fill="var(--text, #727981)" text-anchor="middle">
    <text x="250" y="92">지정한 틱 수</text>
    <text x="250" y="182">지정한 틱 수</text>
    <text x="390" y="182">주기</text>
    <text x="510" y="182">주기</text>
  </g>
</svg>
