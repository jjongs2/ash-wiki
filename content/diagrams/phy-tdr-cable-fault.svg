<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 542.5 145.5" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="시험 펄스의 반사로 찾는 단선과 단락">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
  </defs>

  <!-- PHY와 꼬임쌍선 케이블 -->
  <rect x="20" y="40" width="130" height="44" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="85" y="67" text-anchor="middle" fill="var(--text, #727981)">DP83TC811R-Q1</text>
  <line x1="150" y1="56" x2="440" y2="56" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <line x1="150" y1="68" x2="440" y2="68" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <path d="M432 50 L448 74 M448 50 L432 74" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <text x="458" y="66" font-size="12" fill="var(--text, #727981)">단선이나 단락</text>

  <!-- 시험 펄스와 되돌아오는 반사 -->
  <line x1="170" y1="40" x2="420" y2="40" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="295" y="32" text-anchor="middle" font-size="12" fill="var(--text, #727981)">시험 펄스</text>
  <line x1="420" y1="84" x2="170" y2="84" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="295" y="102" text-anchor="middle" font-size="12" fill="var(--text, #727981)">반사</text>
  <text x="295" y="128" text-anchor="middle" font-size="12" fill="var(--text, #727981)">반사의 시간과 세기를 재어 결함의 위치를 추정</text>
</svg>
