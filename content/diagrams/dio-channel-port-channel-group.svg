<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 6.5 559.5 230" font-family="Pretendard, sans-serif" text-rendering="geometricPrecision" font-variant="none" font-size="13" fill="none">
  <style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css");</style>

  <!-- 규격 이름 -->
  <g fill="var(--text, #727981)">
    <text x="20" y="56">DIO Driver 규격</text>
    <text x="20" y="190">Port Driver 규격</text>
  </g>

  <!-- 포트와 핀 -->
  <rect x="140" y="90" width="400" height="50" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" />
  <g stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)">
    <rect x="154" y="97" width="36" height="36" rx="2" />
    <rect x="202" y="97" width="36" height="36" rx="2" />
    <rect x="394" y="97" width="36" height="36" rx="2" />
    <rect x="442" y="97" width="36" height="36" rx="2" />
    <rect x="490" y="97" width="36" height="36" rx="2" />
  </g>
  <!-- channel group에 든 channel -->
  <g stroke="var(--blue, #336fb8)" stroke-width="1.5" fill="var(--blue-tint, #336fb8)">
    <rect x="250" y="97" width="36" height="36" rx="2" />
    <rect x="298" y="97" width="36" height="36" rx="2" />
    <rect x="346" y="97" width="36" height="36" rx="2" />
  </g>

  <!-- DIO Driver의 이름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <path d="M140 50 V44 H540 V50" />
    <path d="M250 86 V80 H382 V86" />
    <line x1="460" y1="97" x2="460" y2="72" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="340" y="36">DIO port</text>
    <text x="316" y="70">DIO channel group</text>
    <text x="460" y="66">DIO channel</text>
  </g>

  <!-- Port Driver의 이름 -->
  <g stroke="var(--ink, #727981)" stroke-width="1">
    <line x1="460" y1="133" x2="460" y2="158" />
    <path d="M140 190 V196 H540 V190" />
  </g>
  <g text-anchor="middle" fill="var(--text, #727981)">
    <text x="460" y="174">port pin</text>
    <text x="340" y="214">port</text>
  </g>
</svg>
