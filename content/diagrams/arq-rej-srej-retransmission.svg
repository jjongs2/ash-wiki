<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -6.5 524 365" font-family="IBM Plex Sans, IBM Plex Sans KR, sans-serif" text-rendering="geometricPrecision" font-size="14" fill="none" aria-label="REJ와 SREJ로 다시 보내는 프레임">
  <style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap");</style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink, #727981)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--orange, #b0540d)" />
    </marker>
  </defs>
  <!-- REJ (Go-back-N) -->
  <text x="120" y="16" text-anchor="middle" fill="var(--text, #727981)">REJ (Go-back-N)</text>
  <rect x="8" y="28" width="84" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="50" y="47" text-anchor="middle" fill="var(--text, #727981)">송신 측</text>
  <rect x="148" y="28" width="84" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="190" y="47" text-anchor="middle" fill="var(--text, #727981)">수신 측</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="50" y1="56" x2="50" y2="316" />
    <line x1="190" y1="56" x2="190" y2="316" />
  </g>
  <line x1="52" y1="76" x2="188" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="120" y="77" text-anchor="middle" fill="var(--text, #727981)">A</text>
  <line x1="52" y1="114" x2="143" y2="123.333" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <path d="M137 117.333 L149 129.333 M137 129.333 L149 117.333" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="104" y="113" text-anchor="middle" fill="var(--text, #727981)">B</text>
  <line x1="52" y1="152" x2="188" y2="166" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="120" y="153" text-anchor="middle" fill="var(--text, #727981)">C</text>
  <text x="200" y="170" font-size="12" fill="var(--text, #727981)">버림</text>
  <line x1="188" y1="190" x2="52" y2="204" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="120" y="191" text-anchor="middle" fill="var(--text, #727981)">REJ B</text>
  <line x1="52" y1="228" x2="188" y2="242" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="120" y="229" text-anchor="middle" fill="var(--text, #727981)">B</text>
  <line x1="52" y1="266" x2="188" y2="280" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="120" y="267" text-anchor="middle" fill="var(--text, #727981)">C</text>
  <!-- SREJ (selective repeat) -->
  <text x="372" y="16" text-anchor="middle" fill="var(--text, #727981)">SREJ (selective repeat)</text>
  <rect x="260" y="28" width="84" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="302" y="47" text-anchor="middle" fill="var(--text, #727981)">송신 측</text>
  <rect x="400" y="28" width="84" height="28" rx="2" stroke="var(--ink, #727981)" stroke-width="1.5" fill="var(--surface, none)" />
  <text x="442" y="47" text-anchor="middle" fill="var(--text, #727981)">수신 측</text>
  <g stroke="var(--ink, #727981)" stroke-width="1.5">
    <line x1="302" y1="56" x2="302" y2="316" />
    <line x1="442" y1="56" x2="442" y2="316" />
  </g>
  <line x1="304" y1="76" x2="440" y2="90" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="372" y="77" text-anchor="middle" fill="var(--text, #727981)">A</text>
  <line x1="304" y1="114" x2="395" y2="123.333" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <path d="M389 117.333 L401 129.333 M389 129.333 L401 117.333" stroke="var(--red, #bb464d)" stroke-width="1.5" />
  <text x="356" y="113" text-anchor="middle" fill="var(--text, #727981)">B</text>
  <line x1="304" y1="152" x2="440" y2="166" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="372" y="153" text-anchor="middle" fill="var(--text, #727981)">C</text>
  <text x="452" y="170" font-size="12" fill="var(--text, #727981)">쥐고 있음</text>
  <line x1="440" y1="190" x2="304" y2="204" stroke="var(--orange, #b0540d)" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <text x="372" y="191" text-anchor="middle" fill="var(--text, #727981)">SREJ B</text>
  <line x1="304" y1="228" x2="440" y2="242" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="372" y="229" text-anchor="middle" fill="var(--text, #727981)">B</text>
  <text x="452" y="246" font-size="12" fill="var(--text, #727981)">B, C를 넘김</text>
  <line x1="304" y1="266" x2="440" y2="280" stroke="var(--ink, #727981)" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="372" y="267" text-anchor="middle" fill="var(--text, #727981)">D</text>
  <text x="50" y="344" font-size="12" fill="var(--text, #727981)">A, B, C, D: 차례로 보내는 정보 프레임 · ×: 잃거나 깨진 프레임</text>
</svg>
