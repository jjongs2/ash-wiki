<svg viewBox="0 0 760 242" width="760" height="242" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-labelledby="aw-pipeline-title aw-pipeline-desc" xmlns="http://www.w3.org/2000/svg"><title id="aw-pipeline-title">위키 콘텐츠 파이프라인</title><desc id="aw-pipeline-desc">에이전트가 계획이나 보강으로 묶음을 짜면 사람이 승인해 인제스트 티켓을 발행한다. 인제스트 PR을 사람이 머지하면 Cloudflare Pages로 배포된다. 미검증 주장은 재조사를 한 번 더 거친다. 게시 뒤에는 린트와 Reader Testing이 위키를 읽고 수정 PR을 올린다.</desc><style>.aw-t{fill:#151b23;font-size:14px;font-weight:600}.aw-s{fill:#626a73;font-size:12px}.aw-l{fill:#626a73;font-size:12px}.aw-z{fill:#626a73;font-size:12px;font-weight:600;letter-spacing:.02em}.aw-box{fill:none;stroke:#626a73;stroke-opacity:.55;stroke-width:1.2}.aw-agt{fill:#2b58b1;fill-opacity:.1;stroke:#2b58b1;stroke-width:1.4}.aw-hum{fill:#e0901f;fill-opacity:.14;stroke:#e0901f;stroke-width:1.4}.aw-doc{fill:none;stroke:#626a73;stroke-width:1.2;stroke-dasharray:4 3}.aw-ln{fill:none;stroke:#626a73;stroke-width:1.4}.aw-dash{fill:none;stroke:#626a73;stroke-width:1.4;stroke-dasharray:5 4}.aw-ah{fill:#626a73}.aw-rule{stroke:#626a73;stroke-opacity:.25;stroke-width:1}.aw-i{fill:#2f363f;font-size:13px}.aw-frame{fill:#626a73;fill-opacity:.05;stroke:#626a73;stroke-opacity:.3;stroke-width:1}.aw-k{fill:#151b23;font-size:15px;font-weight:700}</style><defs><marker id="aw-pipeline-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aw-ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="aw-agt" x="20" y="24" width="124" height="56" rx="6"/><text class="aw-t" x="82" y="49" text-anchor="middle">계획</text><text class="aw-s" x="82" y="67" text-anchor="middle">wiki-plan</text><rect class="aw-hum" x="168" y="24" width="124" height="56" rx="6"/><text class="aw-t" x="230" y="49" text-anchor="middle">승인</text><text class="aw-s" x="230" y="67" text-anchor="middle">티켓 발행</text><rect class="aw-agt" x="316" y="24" width="124" height="56" rx="6"/><text class="aw-t" x="378" y="49" text-anchor="middle">인제스트</text><text class="aw-s" x="378" y="67" text-anchor="middle">wiki-ingest</text><rect class="aw-hum" x="464" y="24" width="124" height="56" rx="6"/><text class="aw-t" x="526" y="49" text-anchor="middle">머지</text><text class="aw-s" x="526" y="67" text-anchor="middle">PR 리뷰 뒤</text><rect class="aw-box" x="612" y="24" width="124" height="56" rx="6"/><text class="aw-t" x="674" y="49" text-anchor="middle">배포</text><text class="aw-s" x="674" y="67" text-anchor="middle">Cloudflare Pages</text><path class="aw-ln" d="M144,52 H166" marker-end="url(#aw-pipeline-ah)"/><path class="aw-ln" d="M292,52 H314" marker-end="url(#aw-pipeline-ah)"/><path class="aw-ln" d="M440,52 H462" marker-end="url(#aw-pipeline-ah)"/><path class="aw-ln" d="M588,52 H610" marker-end="url(#aw-pipeline-ah)"/><rect class="aw-agt" x="20" y="134" width="124" height="56" rx="6"/><text class="aw-t" x="82" y="159" text-anchor="middle">보강</text><text class="aw-s" x="82" y="177" text-anchor="middle">wiki-enrich</text><path class="aw-ln" d="M144,162 H230 V82" marker-end="url(#aw-pipeline-ah)"/><path class="aw-ln" d="M378,80 V132" marker-end="url(#aw-pipeline-ah)"/><text class="aw-l" x="386" y="112" text-anchor="start">미검증 주장</text><rect class="aw-agt" x="316" y="134" width="124" height="56" rx="6"/><text class="aw-t" x="378" y="159" text-anchor="middle">재조사</text><text class="aw-s" x="378" y="177" text-anchor="middle">wiki-verify</text><path class="aw-ln" d="M440,162 H476 V82" marker-end="url(#aw-pipeline-ah)"/><text class="aw-l" x="470" y="124" text-anchor="end">PR</text><rect class="aw-frame" x="488" y="104" width="248" height="96" rx="10"/><text class="aw-z" x="498" y="122" text-anchor="start">게시 뒤</text><rect class="aw-agt" x="498" y="134" width="108" height="56" rx="6"/><text class="aw-t" x="552" y="159" text-anchor="middle">린트</text><text class="aw-s" x="552" y="177" text-anchor="middle">wiki-lint</text><rect class="