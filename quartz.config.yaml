# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Æ wiki
  pageTitleSuffix: " - Æ wiki"
  enableSPA: true
  enablePopovers: true
  # 기본값은 업스트림 문서 사이트의 plausible 설정이다. 이 위키는 분석 계정이 없다.
  analytics: null
  locale: en-US
  baseUrl: ash-wiki.pages.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  # 색과 폰트 값의 정본은 이 theme다. 고른 근거와 대비 실측은 docs/palette.md에 있다.
  # Pretendard는 Google Fonts에 없어 fontOrigin을 local로 두고, 폰트 CSS는 Head가 건다(quartz/util/localFonts.ts).
  # OG 이미지 생성기가 쓰는 폰트는 prebuild가 캐시에 둔다(tools/og-fonts.ts).
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Pretendard
      body: Pretendard
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f8fafd"
        lightgray: "#e1e7ee"
        gray: "#626a73"
        darkgray: "#2f363f"
        dark: "#151b23"
        secondary: "#2b58b1"
        tertiary: "#1b428f"
        highlight: rgba(43, 88, 177, 0.08)
        textHighlight: rgba(250, 204, 21, 0.35)
      darkMode:
        light: "#0f1318"
        lightgray: "#25292f"
        gray: "#9299a1"
        darkgray: "#d4d8dc"
        dark: "#eceff2"
        secondary: "#8ab1f9"
        tertiary: "#abcbff"
        highlight: rgba(138, 177, 249, 0.1)
        textHighlight: rgba(202, 160, 0, 0.28)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # WIKI_DIFF=<ref>를 줄 때만 로컬 프리뷰에 기준 이후 바뀐 블록을 표시한다(plugins/wiki-diff, docs/deploy.md).
  # 원본의 mdast를 비교하므로 위키링크와 callout을 바꾸는 obsidian-flavored-markdown보다 먼저 돌아야 한다.
  - source: ./plugins/wiki-diff
    enabled: true
    order: 29
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  # 도해 <object>에 viewBox 폭을 붙인다(plugins/diagram-width). embed가 <object>를 만든 뒤에 돌아야 한다.
  - source: ./plugins/diagram-width
    enabled: true
    order: 35
  # 도해 SVG에 현재 테마의 색 토큰 값을 넣는 스크립트를 싣는다(plugins/diagram-theme).
  - source: ./plugins/diagram-theme
    enabled: true
    order: 36
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # 절이 하나뿐인 쪽에도 목차를 띄운다. 기본값(minEntries: 1)은 제목이 둘 이상일 때만 띄운다.
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      minEntries: 0
    order: 50
    layout:
      position: right
      priority: 30
  # 본문의 외부 링크는 새 탭으로 연다. 위키링크, 제목 앵커 같은 내부 링크는 같은 탭 그대로다.
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  # ##, ### 절을 접고 펼 수 있게 감싼다(plugins/collapsible-sections). 참고문헌이 마지막 절에 들지 않도록
  # citations보다 먼저, 다른 플러그인이 원래 꼴의 본문을 보도록 그 바로 앞에서 돈다. 순서를 바꾸면 테스트와
  # 검사는 통과한 채로, 마지막 절을 접을 때 참고문헌이 함께 접힌다.
  - source: ./plugins/collapsible-sections
    enabled: true
    order: 84
  # 인용 스택(ADR 0003). bibliographyFile은 prebuild가 bib/를 합친 합본이고(tools/bib.ts),
  # CSL은 저장소가 소유한 IEEE 스타일이다(docs/engine.md). 번호가 참고문헌 앵커로 링크된다.
  - source: "@quartz-community/citations"
    enabled: true
    options:
      bibliographyFile: ./bibliography.bib
      csl: ./csl/ieee.csl
      linkCitations: true
    order: 85
  # 참고문헌 항목의 URL을 새 탭 링크로 바꾼다(plugins/bibliography-links). 참고문헌이 붙은 뒤에 돌아야 한다.
  - source: ./plugins/bibliography-links
    enabled: true
    order: 86
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # 코어가 theme.typography로 폰트 변수를 이미 만든다. 이 플러그인은 theme을 읽지 않고
  # 자기 기본값(Schibsted Grotesk 등)으로 h1~h6의 font-family를 덮어써, 폰트의 정본이 둘이 된다.
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # CNAME 파일은 GitHub Pages용이다. 호스팅은 Cloudflare Pages다(ADR 0004).
  - source: "@quartz-community/cname"
    enabled: false
  # 위키는 canvas 페이지를 쓰지 않는다. 켜 두면 페이지마다 그 CSS와 스크립트를 받는다.
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  # 위키는 폴더를 쓰지 않는다. 켜 두면 계층 태그의 표시 이름 파일(content/tags/<구역>/)이
  # 폴더로 잡혀 /tags/<구역>/ 폴더 목록이 생기고, 프리뷰에서 /tags/<구역> 태그 목록을 가린다.
  - source: "@quartz-community/folder-page"
    enabled: false
  - source: "@quartz-community/tag-page"
    enabled: true
  # 폴더 대신 태그로 구역 › 주제 › 페이지 트리를 그린다. 세 옵션을 둔 이유는 plugins/explorer-tree에 있다.
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      filterFn: "() => true"
      mapFn: "(node) => window.explorerTree(node)"
      sortFn: "() => 0"
      # 폴더 이름을 눌러도 페이지로 가지 않고 폴더를 접고 편다. 구역과 주제의 태그 목록은 대문에서 간다.
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  # Backlinks를 목차처럼 제목을 눌러 접고 편다(plugins/backlinks-collapse). backlinks 플러그인에는 접기 옵션이 없다.
  - source: ./plugins/backlinks-collapse
    enabled: true
  # 탐색기의 mapFn이 부르는 전역 window.explorerTree를 싣는다(plugins/explorer-tree).
  - source: ./plugins/explorer-tree
    enabled: true
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      # 기본값은 업스트림의 GitHub와 Discord 링크다. 이 저장소로 바꿨다.
      links:
        GitHub: https://github.com/jjongs2/ash-wiki
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # 위키는 bases 페이지를 쓰지 않는다. 켜 두면 페이지마다 그 CSS와 스크립트를 받는다.
  - source: "@quartz-community/bases-page"
    enabled: false
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        # 검증일과 표준 페이지의 칸이다(docs/wiki-conventions.md). 값이 없는 키는 칸이 나오지 않는다.
        - verified
        - publisher
        - edition
        - status
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # 위키는 목록에서 빼는 페이지를 쓰지 않는다.
  - source: "@quartz-community/unlisted-pages"
    enabled: false
    options: {}
    order: 45
  # 위키는 암호화 페이지를 쓰지 않는다. 켜 두면 페이지마다 그 CSS와 스크립트를 받는다.
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
